# trivy ignore file — GRANULAR (path-scoped) form.
#
# Used by .github/workflows/trivy.yml for BOTH `trivy fs` (JS/npm dependency
# CVEs) and `trivy config` (IaC / Dockerfile / config misconfig).
#
# WHY the YAML form (not plain .trivyignore): plain .trivyignore matches by ID
# GLOBALLY — `AVD-DS-0002` there would mute "runs as root" in EVERY Dockerfile,
# including a real deployed one. The YAML form scopes each exemption to a PATH,
# so the gate stays sharp everywhere else.
#
# Policy: EVERY entry MUST carry a `statement` (the risk classification + why it
# does not apply). Entries that ACCEPT a real risk (vs. classify an in-context
# false positive) additionally require Owner sign-off. Mirrors `.cargo/audit.toml`
# (Rust) and `pnpm.auditConfig.ignoreCves` (npm).

misconfigurations:
  - id: AVD-DS-0002
    paths:
      - "apps/get-corelink-worker/test/smoke-install.Dockerfile"
    statement: >-
      In-context FALSE POSITIVE, not an accepted risk. This is an ephemeral
      smoke-test image that verifies the PUBLIC install script on a clean Debian;
      it is never deployed and never pushed (built, run once in CI, discarded).
      It MUST run as root: the install script does `mv /tmp/corelink
      /usr/local/bin/corelink` and falls back to `sudo` for non-root, but
      debian-bookworm-slim ships no sudo — so a non-root USER would break the very
      install path the smoke test exists to exercise. DS-0002 (deployed images
      should not run as root) does not apply to a throwaway test container that is
      root by design.

# The ws@7.5.10 CVE-2026-48779 and the nanoid CVE-2026-67213/-67214 are FIXED via
# pnpm overrides, not suppressed. Cargo.lock/RustSec is cargo-deny's lane, skipped
# in fs. The one entry below is the exception, and it is an ACCEPTED RISK.

vulnerabilities:
  # docs(search): @easyops-cn/docusaurus-search-local -> lunr-languages ships a
  # vendored Ruby "stopwords-filter" gem PROJECT (its own build tooling for
  # generating stopword lists) inside the published npm tarball, complete with
  # a committed Gemfile.lock from ~2012. It is dead weight, not a dependency:
  # nothing in our install/build/runtime ever runs `bundle install` or
  # `bundle exec` against it — pnpm never touches Ruby, and Docusaurus never
  # shells out to this directory. trivy's bundler scanner finds it purely
  # because the file exists on disk inside node_modules. Same false-positive
  # shape as AVD-DS-0002 above: in-context inert, not a reachable dependency.
  # Both paths are the SAME file — pnpm's content-addressed virtual store
  # (`.pnpm/<pkg>/node_modules/...`) plus its flattened symlink target — and
  # both are deterministically regenerated by `pnpm install --frozen-lockfile`
  # from pnpm-lock.yaml, so the paths are stable across CI runs.
  - id: CVE-2022-25648
    paths:
      - "node_modules/.pnpm/lunr-languages@1.21.0/node_modules/lunr-languages/build/stopwords-filter/Gemfile.lock"
      - "node_modules/lunr-languages/build/stopwords-filter/Gemfile.lock"
    statement: >-
      FALSE POSITIVE — vendored, never-executed Ruby build-tooling fixture
      inside @easyops-cn/docusaurus-search-local's lunr-languages dependency.
      See the block comment above this entry.
  - id: CVE-2022-47318
    paths:
      - "node_modules/.pnpm/lunr-languages@1.21.0/node_modules/lunr-languages/build/stopwords-filter/Gemfile.lock"
      - "node_modules/lunr-languages/build/stopwords-filter/Gemfile.lock"
    statement: >-
      FALSE POSITIVE — same vendored Ruby fixture as CVE-2022-25648 above.
  - id: CVE-2013-0269
    paths:
      - "node_modules/.pnpm/lunr-languages@1.21.0/node_modules/lunr-languages/build/stopwords-filter/Gemfile.lock"
      - "node_modules/lunr-languages/build/stopwords-filter/Gemfile.lock"
    statement: >-
      FALSE POSITIVE — same vendored Ruby fixture as CVE-2022-25648 above.
  - id: CVE-2020-10663
    paths:
