# Cloudflare Workers + Containers config
# Workers lida com control plane (HTTP). Containers roda o servidor gRPC Rust.
# Docs: https://developers.cloudflare.com/containers/

name = "corelink"
compatibility_date = "2026-04-01"
# nodejs_compat: required by @sentry/cloudflare (worker/src/index.ts), which imports
# node:async_hooks (AsyncLocalStorage). Without it the prod deploy is rejected by the
# CF API with `No such module "node:async_hooks"` [10021]. Top-level so it applies to
# ALL envs (prod + prod-sam/lhr/nrt/syd + staging); matches the other workers
# (apps/signup-worker, apps/get-corelink-worker). date 2026-04-01 ≥ the flag's floor.
compatibility_flags = ["nodejs_compat"]

# Worker (control plane) — Wave 32 Phase B implementation
main = "worker/src/index.ts"

# ── Security hardening (Wave 32 Phase E pre-deploy — 2026-05-26) ─────────────
#
# Post-incident lockdown after a $36 surprise CF bill on a previous public
# staging env (bots discovered the workers.dev subdomain and hammered it).
#
# workers_dev = false :: Worker is NOT reachable at any
#   <name>.<account-subdomain>.workers.dev URL. Customer traffic arrives ONLY
#   via the custom domain configured in Phase G DNS (e.g. api.corelink.humangr.com),
#   which is proxied through CF (orange-cloud) + protected by zone-level Bot
#   Fight Mode. Bot wildcard scans of *.workers.dev cannot find this Worker.
#
# Trade-off: smoke testing post-Phase-E APPLY cannot use the workers.dev URL.
# Smoke is deferred to Phase H (post-Phase-G DNS apply) when api.corelink.humangr.com
# resolves. Pre-Phase-G, smoke uses `wrangler tail` + `wrangler dev --remote`
# preview URLs (which require Authorization, not bot-scannable).
workers_dev = false

# ── Workers Observability (native retained logs) ─────────────────────────────
# Zero-cost native feature: retains + makes Worker logs queryable in the CF
# dashboard (Workers Logs / Workers Logpush "Logs Engine") so an operator isn't
# blind at launch. This is NOT Logpush to an external sink — that needs an
# owner-provided destination and is deliberately left off here.
# head_sampling_rate = 1 → keep 100% of invocation logs.
# NOTE: [observability] is NOT inherited by named [env.*] environments, so each
# deployed env below (prod + regional prod-*) re-declares its own block.
[observability]
enabled = true
head_sampling_rate = 1

# [limits] cpu_ms cap per request — hard upper bound that aborts runaway
# request handlers before CF bills extra CPU. Default is 50ms on Workers
# Paid plan; raised to 100ms (P1-3: HMAC auth path 5-15ms overhead caused
# CPU-Exceeded 1102 errors under load at 30ms; 100ms provides adequate
# headroom for the Sonnet HMAC auth path without unbounded runaway risk).
[limits]
cpu_ms = 100

# Container com o servidor gRPC Rust
[[containers]]
class_name = "CoreLinkServer"
image = "./Dockerfile"
max_instances = 5
instance_type = "basic"

# Durable Object que gerencia lifecycle do Container + event bus
[[durable_objects.bindings]]
name = "CORELINK_SERVER"
class_name = "CoreLinkServer"

# Migrations do Durable Object
[[migrations]]
tag = "v1"
new_sqlite_classes = ["CoreLinkServer"]

# R2 bucket pra CAS blobs
[[r2_buckets]]
binding = "CAS_BUCKET"
bucket_name = "corelink-cas-dev"
preview_bucket_name = "corelink-cas-preview"

# WI-S04-002 — R2 buckets for AC envelopes (5 regions per WI §1).
# Production cutover happens via `scripts/provision_ac_buckets.sh <env>`;
# bindings here pin the canonical name + preview-bucket convention.
# Region literals MUST match corelink_ac::schema::REGION_LIST.
[[r2_buckets]]
binding = "AC_BUCKET_SAM"
bucket_name = "corelink-ac-sam"
preview_bucket_name = "corelink-ac-sam-preview"

[[r2_buckets]]
binding = "AC_BUCKET_IAD"
bucket_name = "corelink-ac-iad"
preview_bucket_name = "corelink-ac-iad-preview"

[[r2_buckets]]
binding = "AC_BUCKET_LHR"
bucket_name = "corelink-ac-lhr"
preview_bucket_name = "corelink-ac-lhr-preview"

[[r2_buckets]]
binding = "AC_BUCKET_NRT"
bucket_name = "corelink-ac-nrt"
preview_bucket_name = "corelink-ac-nrt-preview"

[[r2_buckets]]
binding = "AC_BUCKET_SYD"
bucket_name = "corelink-ac-syd"
preview_bucket_name = "corelink-ac-syd-preview"

# WI-S05-004 — R2 buckets for multipart chunks (5 regions per S-05 §5.1).
# `chunks.r2_object_key` references `corelink-chunk-<region>/<tenant_prefix_hex>/<chunk_digest>`.
# Region literals MUST match crates/corelink-multipart-schema::REGION_LIST.
[[r2_buckets]]
binding = "CHUNK_BUCKET_SAM"
bucket_name = "corelink-chunk-sam"
preview_bucket_name = "corelink-chunk-sam-preview"

[[r2_buckets]]
binding = "CHUNK_BUCKET_IAD"
bucket_name = "corelink-chunk-iad"
preview_bucket_name = "corelink-chunk-iad-preview"

[[r2_buckets]]
binding = "CHUNK_BUCKET_LHR"
bucket_name = "corelink-chunk-lhr"
preview_bucket_name = "corelink-chunk-lhr-preview"

[[r2_buckets]]
binding = "CHUNK_BUCKET_NRT"
bucket_name = "corelink-chunk-nrt"
preview_bucket_name = "corelink-chunk-nrt-preview"

[[r2_buckets]]
binding = "CHUNK_BUCKET_SYD"
bucket_name = "corelink-chunk-syd"
preview_bucket_name = "corelink-chunk-syd-preview"

# WI-S05-004 — R2 buckets for multipart manifest envelopes (5 regions per S-05 §5.1).
# Stores the Merkle root + ordered chunk list for each chunked blob.
[[r2_buckets]]
binding = "MANIFEST_BUCKET_SAM"
bucket_name = "corelink-manifest-sam"
preview_bucket_name = "corelink-manifest-sam-preview"

[[r2_buckets]]
binding = "MANIFEST_BUCKET_IAD"
bucket_name = "corelink-manifest-iad"
preview_bucket_name = "corelink-manifest-iad-preview"

[[r2_buckets]]
binding = "MANIFEST_BUCKET_LHR"
bucket_name = "corelink-manifest-lhr"
preview_bucket_name = "corelink-manifest-lhr-preview"

[[r2_buckets]]
binding = "MANIFEST_BUCKET_NRT"
bucket_name = "corelink-manifest-nrt"
preview_bucket_name = "corelink-manifest-nrt-preview"

[[r2_buckets]]
binding = "MANIFEST_BUCKET_SYD"
bucket_name = "corelink-manifest-syd"
preview_bucket_name = "corelink-manifest-syd-preview"

# KV pra metadata hot lookup
[[kv_namespaces]]
binding = "METADATA_KV"
id = "TODO_KV_NAMESPACE_ID"
preview_id = "TODO_PREVIEW_KV_ID"

# R2-10 — Clerk JWKS cache KV namespace (consumed by
# `corelink-cf-bindings::CfKvNamespaceAdapter` and `corelink-clerk-cf::CfKvJwksCache`).
# Separate namespace from METADATA_KV so the JWKS cache TTL eviction
# does not pollute the metadata hot-lookup hit rate.
[[kv_namespaces]]
binding = "CLERK_JWKS_KV"
id = "PLACEHOLDER_CLERK_JWKS_KV_ID"
preview_id = "PLACEHOLDER_CLERK_JWKS_KV_PREVIEW_ID"

# R2-10 — Negative-cache KV namespace (S-02 negative cache hit path,
# consumed by `corelink-cf-bindings::CfKvNamespaceAdapter`). Per-region
# is NOT required — negative cache is global by digest. Separate from
# METADATA_KV so the 300s TTL churn does not evict metadata entries.
[[kv_namespaces]]
binding = "NEGATIVE_CACHE_KV"
id = "PLACEHOLDER_NEG_CACHE_KV_ID"
preview_id = "PLACEHOLDER_NEG_CACHE_KV_PREVIEW_ID"

# R2-10 — D1 database for control-plane config + audit rows.
# Consumed by `corelink-cf-bindings::CfD1DatabaseAdapter` and the
# `corelink-clerk-cf::handle_health` smoke-test handler.
[[d1_databases]]
binding = "CONFIG_DB"
database_name = "corelink-config-dev"
database_id = "PLACEHOLDER_D1_CONFIG_DB_ID"
preview_database_id = "PLACEHOLDER_D1_CONFIG_DB_PREVIEW_ID"
migrations_dir = "migrations/d1"

# R2-10 — Rollout-controller Durable Object namespace (WI-S13-*),
# consumed by `corelink-cf-bindings::CfDurableObjectAdapter`. Single
# DO instance per rollout_id; CF hashes id_from_name into a 256-bit
# ObjectId. The class itself is declared via `[[migrations]]` below.
[[durable_objects.bindings]]
name = "ROLLOUT_DO"
class_name = "RolloutController"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RolloutController"]

# ADR-0065 — EventLogDO: thin, generic, per-tenant append-only event-log
# primitive (hugit-P2 seam D). One DO instance per tenant via
# idFromName(tenant_id); SQLite-backed storage. The class is exported from
# worker/src/index.ts and implemented in worker/src/event_log_do.ts.
[[durable_objects.bindings]]
name = "EVENT_LOG_DO"
class_name = "EventLogDO"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["EventLogDO"]

# WI-MULTI-REGION-V1 — ReplicationCoordinatorDO: the SINGLE global multi-region
# replication coordinator (idFromName("replication-coordinator-singleton")). Its
# single-instance guarantee IS the split-brain-safe promotion lock; its `alarm()`
# is the scheduled evaluate→promote driver. SQLite-backed (durable role map +
# heartbeats). Reached via `/_internal/replication/*` (internal-auth gated) in
# worker/src/index.ts; ported from crates/corelink-replication-coordinator.
[[durable_objects.bindings]]
name = "REPLICATION_COORDINATOR_DO"
class_name = "ReplicationCoordinatorDO"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["ReplicationCoordinatorDO"]

# P3 edge-local request metering (ACCEPTED, docs/design/2026-08-19-adr-edge-local-do-
# request-metering.md). Two SQLite-backed DOs, INERT until the per-region
# EDGE_DO_METER flag is flipped: RequestMeterCoordinatorDO — 1/tenant
# (idFromName(tenant_id)), the authoritative monthly-cap token-lease coordinator;
# RequestMeterShardDO — 1/(tenant,region) (idFromName(tenant + ":" + region)), the
# edge-local lease balance debited per request. Classes exported from
# worker/src/index.ts; cores in worker/src/lib/request_meter_lease.ts +
# request_meter_shard.ts. Bound (and migrated) in every environment so the flip is a
# var change with no infra step; with EDGE_DO_METER unset no instance is ever created.
[[durable_objects.bindings]]
name = "REQUEST_METER_COORDINATOR_DO"
class_name = "RequestMeterCoordinatorDO"

[[durable_objects.bindings]]
name = "REQUEST_METER_SHARD_DO"
class_name = "RequestMeterShardDO"

[[migrations]]
tag = "v5"
new_sqlite_classes = ["RequestMeterCoordinatorDO", "RequestMeterShardDO"]

# Vars não-secretas
[vars]
ENVIRONMENT = "dev"

# WI-S17-001 — Chaos scheduler weekly cron (Mondays 06:00 UTC).
# Default = dev/staging only; production env intentionally omits [triggers]
# so chaos NEVER fires in prod (HARD env check at code level is the
# second line of defense; this cron-level omission is the first).
# Catalog: specs/_runbooks/RB-CHAOS-CATALOG.md.
#
# WI-S20-006 — Synthetic page weekly drill (Mondays 14:00 UTC).
# Triggers `corelink-synthetic-pager` to emit a synthetic SEV-2 page
# through the dedicated PagerDuty `synthetic-drill` service routing
# key. Region rotates across a 4-week cycle:
#   - Week N % 4 == 0: target Americas
#   - Week N % 4 == 1: target EMEA
#   - Week N % 4 == 2: target APAC
#   - Week N % 4 == 3: rotation-handoff drill (paged at 23:59 UTC
#     Sunday so the boundary handoff is exercised)
# Runbook: specs/_runbooks/RB-SYNTHETIC-PAGE-DRILL.md.
# SHA-pinned image: ghcr.io/HumanGuardrail/corelink-synthetic-pager@sha256:
#   <PIN_AT_RELEASE> — pinned at PRR ship gate per supply-chain canonical.
[triggers]
crons = [
    "0 6 * * 1",
    "0 14 * * 1",
]

# Secrets: `wrangler secret put STRIPE_KEY` etc
# - CLERK_SECRET_KEY
# - CLERK_ISSUER_URL  — Clerk JWT issuer URL pin; read by worker/src/index.ts to
#   validate the `iss` claim on inbound Clerk JWTs (prevents cross-instance token
#   replay). Value is the Clerk instance issuer URL (e.g.
#   `https://<instance>.clerk.accounts.dev`). Rotate on instance change or compromise.
#   Set via: wrangler secret put CLERK_ISSUER_URL --env prod
# - STRIPE_SECRET_KEY
# - DATABASE_URL (Neon Postgres)
# - PAT_SIGNING_KEY  — hex-encoded HMAC-SHA256 signing key (≥ 32 bytes decoded).
#   Used by WP-A1 PAT fast-fail layer. Derivation:
#   HKDF-SHA256(CORELINK_MASTER_KEY, "corelink-pat-signing-salt-v1",
#     b"corelink-v1-pat-signing-key", 32)
#   Set via: wrangler secret put PAT_SIGNING_KEY --env prod

# Produção (rodar com --env prod)
[env.prod]
name = "corelink-prod"
# R2_S3_ENDPOINT + D1_DATABASE_ID are non-secret container-storage config: the
# DO forwards them (plus the R2/CF_API_TOKEN secrets) into container.start({env}).
# Account-scoped R2 S3 endpoint; D1 id = corelink-config-prod (CONFIG_DB binding).
# EDGE_PUBLIC_READ="serve" arms the Worker-native _public brew/pip cache-HIT edge
# read (colo Cache API -> native R2 -> blake3 verify, container bypassed); "shadow"
# = compare-only, unset = pure container. EDGE_ASYNC_METER="on" arms the async
# request-count metering. Both were launch-time runtime secrets (wrangler secret
# put, WP3 2026-08-17); declared here as non-secret vars so the live prod behavior
# is reproducible from config and a fresh deploy does NOT silently ship them OFF
# (which would regress edge-HIT latency + under-count billing).
vars = { ENVIRONMENT = "prod", R2_S3_ENDPOINT = "https://6a1fc1c626fc2628823e60b9db01f5cd.r2.cloudflarestorage.com", D1_DATABASE_ID = "d64742ea-e102-40b2-a844-ff02e3f94562", R2_AC_BUCKET = "corelink-ac-iad", R2_AC_REGION = "iad", R2_CAS_REGION = "iad", EDGE_PUBLIC_READ = "serve", EDGE_ASYNC_METER = "on", EDGE_DO_METER = "serve", OCI_PUBLIC_DEDUP_ENABLED = "1", OCI_UPSTREAM_ON_MISS = "1" }

# Native retained Workers Logs (per-env; not inherited from top-level).
[env.prod.observability]
enabled = true
head_sampling_rate = 1

# ── Worker route bindings (Wave 32 Phase G+ — DNS cutover) ────────────────
#
# With `workers_dev = false` at top-level (security hardening per d398fa45),
# the Worker is reachable ONLY via these custom-route bindings on humangr.com.
# Each CNAME from Phase G (9ade35e2) points at the CF edge; the route binding
# tells CF Edge "invoke `corelink-prod` Worker for matching requests".
#
# Pages-backed CNAMEs (app.*, docs.*) do NOT need worker routes — Pages handles
# their custom-domain routing via Phase F APPLY (corelink-docs + corelink-admin-ui
# project custom-domain config).
#
# Routes-only change: deploy with `wrangler deploy --env prod --containers-rollout none`
# to avoid re-rolling the 11 healthy Firecracker container instances.
[[env.prod.routes]]
pattern = "corelink-api.humangr.com/*"
zone_name = "humangr.com"

# OCI registry host — the realm the OCI adapter advertises in Www-Authenticate
# (`routes/oci.rs::OCI_BEARER_REALM` = corelink-oci.humangr.com/token). The host
# was a deployment-note never provisioned (no DNS, no route) so real `docker
# login/push` failed; CNAME + this route added 2026-06-21 so the /v2/ + /token
# OCI paths (host-agnostic in the worker) serve on the advertised host.
[[env.prod.routes]]
pattern = "corelink-oci.humangr.com/*"
zone_name = "humangr.com"

# WI-MULTI-REGION-V1 Service Bindings: prod worker can fan-out to regional
# workers via per-tenant routing. Worker code reads tenant.primary_region
# from D1 and forwards to the matching regional Service Binding when
# primary_region != "iad" (or null). See ADR-MULTI-REGION-V1.
[[env.prod.services]]
binding = "PROD_SAM"
service = "corelink-prod-sam"

[[env.prod.services]]
binding = "PROD_LHR"
service = "corelink-prod-lhr"

[[env.prod.services]]
binding = "PROD_NRT"
service = "corelink-prod-nrt"

[[env.prod.services]]
binding = "PROD_SYD"
service = "corelink-prod-syd"

# Onboarding funnel telemetry (PLG §7.1) — `first_cli_authed`.
# `analytics_events` lives ONLY in corelink-analytics-prod (D1
# d7fe391f-9fe0-4544-a1fb-64747bcd2639, see apps/analytics-worker/wrangler.toml);
# this Worker's CONFIG_DB is the control plane, so the row must be written via
# the analytics Worker's `POST /v1/event` ingest. A Worker→Worker fetch over the
# public humangr.com custom domain is rejected by Cloudflare's edge with error
# 1014 (CNAME Cross-User Banned) even inside one account — see the
# `[[services]]` note in apps/signup-worker/wrangler.toml — so the service
# binding is the ONLY viable path. Consumed by
# worker/src/lib/onboarding_events.ts (fire-and-forget, ctx.waitUntil).
#
# `entrypoint` is LOAD-BEARING, not cosmetic. Without it the binding resolves to
# corelink-analytics-prod's DEFAULT `fetch` export, which exposes NO RPC methods
# — `env.ANALYTICS_SVC.ingestServerEvent` would simply not exist. With it the
# binding resolves to the `AnalyticsIngest` WorkerEntrypoint
# (apps/analytics-worker/src/index.ts:153).
#
# NO OPERATOR PREREQUISITE. The RPC path needs no shared secret: a service
# binding is authenticated by the platform (the stub is resolved by the CF
# control plane from this Worker's own deployed config; the call never leaves
# the runtime, so there is no hostname to point at and no header to forge), and
# `ingestServerEvent` passes `trusted = true` on that basis. That is what turns
# this emitter ON — it previously no-op'd waiting on an ANALYTICS_INGEST_KEY
# secret that was never set on corelink-prod. The `INGEST_KEY`/HTTP path is
# untouched and still serves its own callers (secrets matrix row 138).
#
# ⚠️ DEPLOY ORDER: corelink-analytics-prod must ship `AnalyticsIngest` BEFORE
# corelink-prod deploys with `entrypoint =` set — a binding that names an
# entrypoint the target Worker does not export is rejected at deploy time.
#
# Scope note: this is the ONLY ANALYTICS_SVC binding in the repo. [env.staging]
# and the regional envs (prod-sam/lhr/nrt/syd) declare no services blocks at
# all, so the emit stays a silent no-op there — unchanged by this WP.
[[env.prod.services]]
binding = "ANALYTICS_SVC"
service = "corelink-analytics-prod"
entrypoint = "AnalyticsIngest"

# corelink-signup.humangr.com/* is served by apps/signup-worker
# (Phase 1 / Stream A4). The route was previously misassigned to this
# Worker which has no Clerk/Stripe webhook handlers; moved to the
# dedicated signup-worker so the route binding aligns with the code
# that handles those webhooks.

# NOTE (Stream 3.11, 2026-05-29): humangr.com is served by
# the CF Pages project `corelink-admin-ui`, NOT by this Worker.  The route
# was removed here so Pages custom-domain routing takes effect (Worker routes
# take precedence over Pages custom domains when both match the same hostname;
# removing the Worker route lets the Pages CNAME resolve correctly).
#
# app/docs/get are also NOT main-worker routes:
#   corelink-app + corelink-docs → CF Pages custom domains
#   corelink-get                 → dedicated Worker (corelink-get-cli-prod)
# The main Worker (corelink-prod) owns only: api/signup.

[[env.prod.r2_buckets]]
binding = "CAS_BUCKET"
bucket_name = "corelink-cas-prod"

# WI-S04-002 — prod-env AC bucket bindings (no `-preview` suffix in prod).
[[env.prod.r2_buckets]]
binding = "AC_BUCKET_SAM"
bucket_name = "corelink-ac-sam"

[[env.prod.r2_buckets]]
binding = "AC_BUCKET_IAD"
bucket_name = "corelink-ac-iad"

[[env.prod.r2_buckets]]
binding = "AC_BUCKET_LHR"
bucket_name = "corelink-ac-lhr"

[[env.prod.r2_buckets]]
binding = "AC_BUCKET_NRT"
bucket_name = "corelink-ac-nrt"

[[env.prod.r2_buckets]]
binding = "AC_BUCKET_SYD"
bucket_name = "corelink-ac-syd"

# WI-S05-004 — prod-env multipart chunk + manifest bucket bindings.
[[env.prod.r2_buckets]]
binding = "CHUNK_BUCKET_SAM"
bucket_name = "corelink-chunk-sam"

[[env.prod.r2_buckets]]
binding = "CHUNK_BUCKET_IAD"
bucket_name = "corelink-chunk-iad"

[[env.prod.r2_buckets]]
binding = "CHUNK_BUCKET_LHR"
bucket_name = "corelink-chunk-lhr"

[[env.prod.r2_buckets]]
binding = "CHUNK_BUCKET_NRT"
bucket_name = "corelink-chunk-nrt"

[[env.prod.r2_buckets]]
