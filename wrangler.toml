bucket_name = "corelink-manifest-nrt"

[[env.prod.r2_buckets]]
binding = "MANIFEST_BUCKET_SYD"
bucket_name = "corelink-manifest-syd"

[[env.prod.containers]]
class_name = "CoreLinkServer"
# Pinned to the explicit registry image because wrangler v4's default deploy
# path silently skipped the container rebuild when only container source
# changed (no Worker delta). Built via `docker build --no-cache` + pushed via
# `wrangler containers push`. Tag 832c7884e = WP-I1 router + WP-S2 env wiring +
# WP-S1.2 real AC R2 handler + WP-S1.2 real D1 Admin handler + cas.rs
# block_in_place fix. Once 2aa2be6f's Dockerfile cache invalidation fix proves
# itself end-to-end in CI, revert to "./Dockerfile".
image = "registry.cloudflare.com/6a1fc1c626fc2628823e60b9db01f5cd/corelink-prod-corelinkserver-prod:35459260-r1"
# Cap 20→200 (2026-08-19). 1 `basic` container (0.25 vCPU) per active tenant; idle
# scales to zero so a high ceiling is free when idle. The BINDING account limit is
# vCPU, NOT instance count: CF RESERVES max_instances × per-instance-vCPU against
# total_vcpu=1500, SHARED across all container apps (5 cache regions + the standard-4
# runner fleet @ 4 vCPU each). A first attempt at 2000 (=500 vCPU/region) was REJECTED
# by CF ("Surpassed total account limits: ... vcpus"). 200/region (5×200×0.25=250 vCPU)
# co-exists with the runner (250×4=1000 vCPU) under 1500. Going higher — toward real
# 2000-user scale — requires a Cloudflare account-limit increase (total_vcpu/memory/
# instances), drafted separately; no config can exceed it.
max_instances = 200
instance_type = "basic"
# P0-5 — DECISION-GATE-1 Option A: the container reaches R2 (S3 API) + D1 (HTTP
# API) over egress. NOTE: wrangler's `[[containers]]` schema does NOT accept
# `enableInternet`, `vars`, or `secrets` fields (they were silently ignored +
# warned on). Container egress + env are configured where the platform actually
# reads them: the DO's `container.start({ enableInternet: true, env: {...} })`
# in worker/src/durable_object.ts. The Worker holds the values as vars (endpoint,
# db id — below in [env.prod.vars]) + secrets (R2 keys, CF_API_TOKEN via
# `wrangler secret put`), and the DO forwards them into the container at start.
# See scripts/d-day-r2-s3-creds-runbook.md for the cred-minting + put procedure.

