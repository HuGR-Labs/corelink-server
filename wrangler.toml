# ============================================================================
# ADR-MULTI-REGION-V1 — Regional production environments (Approach A).
#
# Four new worker envs, one per non-IAD region. Each deploys:
#   - A distinct worker name (`corelink-prod-<region>`)
#   - A distinct CF Container app (`corelink-prod-<region>-corelinkserver-prod`)
#   - The same container image tag as IAD (`:6b816156-r2`) — same binary,
#     different region bucket config injected via env vars at container start.
#   - Regional R2 bucket vars forwarded to the container: R2_AC_BUCKET,
#     R2_AC_REGION, R2_CHUNK_BUCKET, R2_CHUNK_REGION, R2_CAS_REGION.
#   - CAS bucket = corelink-cas-prod (single global R2 bucket today); F7
#     (2026-06-13 audit) makes CAS residency-aware by KEYING each region's CAS
#     objects under its own R2_CAS_REGION (sam/lhr/nrt/syd, not "iad"). Per-region
#     CAS *buckets* (corelink-cas-<region>) are an infra follow-up; until they
#     exist the bytes still land in corelink-cas-prod but under a region-correct
#     key, and the cas.rs residency invariant test enforces the per-env binding.
#   - Same global D1 (corelink-config-prod) + KV bindings as [env.prod]
#   - Route: <region>.corelink-api.humangr.com/*
#
# WEUR/LHR compliance note (ADR-S14-002): DO jurisdictional restriction = "eu"
# is a Cloudflare account-API concern, not set in wrangler.toml. Track separately.
#
# Secret provisioning (per-region, same set as [env.prod]):
#   wrangler secret put R2_S3_ACCESS_KEY_ID --env prod-<region>
#   wrangler secret put R2_S3_SECRET_ACCESS_KEY --env prod-<region>
#   wrangler secret put CF_API_TOKEN --env prod-<region>
#   wrangler secret put PAT_SIGNING_KEY --env prod-<region>
#   wrangler secret put CORELINK_INTERNAL_AUTH_KEY --env prod-<region>
#   wrangler secret put CLOUDFLARE_ACCOUNT_ID --env prod-<region>
# ============================================================================

