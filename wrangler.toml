# ── SYD (Sydney / Asia Pacific Southeast) ────────────────────────────────────
[env.prod-syd]
name = "corelink-prod-syd"
workers_dev = false

# Native retained Workers Logs (per-env; not inherited from top-level).
[env.prod-syd.observability]
enabled = true
head_sampling_rate = 1

[env.prod-syd.vars]
ENVIRONMENT = "prod-syd"
# Edge _public read + async metering (see [env.prod].vars note). Declared as vars
# so the live behavior is repo-reproducible, not a hidden runtime secret.
EDGE_PUBLIC_READ = "serve"
EDGE_DO_METER = "serve"
EDGE_ASYNC_METER = "on"
# F3.2 WP-E — client `_public` dedup flag. "0" (Roll-1) keeps it OFF.
OCI_PUBLIC_DEDUP_ENABLED = "1"
OCI_UPSTREAM_ON_MISS = "1"
R2_S3_ENDPOINT = "https://6a1fc1c626fc2628823e60b9db01f5cd.r2.cloudflarestorage.com"
D1_DATABASE_ID = "d64742ea-e102-40b2-a844-ff02e3f94562"
R2_AC_BUCKET = "corelink-ac-syd"
R2_AC_REGION = "syd"
R2_CHUNK_BUCKET = "corelink-chunk-syd"
R2_CHUNK_REGION = "syd"
# F7 (2026-06-13 audit) — CAS residency. SYD/AU CAS bytes key under "syd", not
# the US default "iad". Per-region CAS *buckets* are an infra follow-up
# (R2_CAS_BUCKET stays corelink-cas-prod until they exist); region key = invariant.
R2_CAS_REGION = "syd"

[[env.prod-syd.routes]]
pattern = "syd.corelink-api.humangr.com"
custom_domain = true

[[env.prod-syd.r2_buckets]]
