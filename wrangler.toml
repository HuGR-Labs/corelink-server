[[env.staging.r2_buckets]]
binding = "AC_BUCKET_IAD"
bucket_name = "corelink-ac-iad-staging"

[[env.staging.r2_buckets]]
binding = "AC_BUCKET_LHR"
bucket_name = "corelink-ac-lhr-staging"

[[env.staging.r2_buckets]]
binding = "AC_BUCKET_NRT"
bucket_name = "corelink-ac-nrt-staging"

[[env.staging.r2_buckets]]
binding = "AC_BUCKET_SYD"
bucket_name = "corelink-ac-syd-staging"

[[env.staging.r2_buckets]]
