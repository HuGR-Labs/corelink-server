bucket_name = "corelink-manifest-lhr-staging"

[[env.staging.r2_buckets]]
binding = "MANIFEST_BUCKET_NRT"
bucket_name = "corelink-manifest-nrt-staging"

[[env.staging.r2_buckets]]
binding = "MANIFEST_BUCKET_SYD"
bucket_name = "corelink-manifest-syd-staging"

[[env.staging.kv_namespaces]]
