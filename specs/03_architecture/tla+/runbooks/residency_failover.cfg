\* CoreLink WI-S20-007 — residency_failover TLC config (runbook 4/4).
\* TLC v1.8.0 SHA-256 pinned (ADR-0042 §A1).
\* CI runtime target: ≤ 60s on ubuntu-latest (4 vCPU; -workers auto).
\* t1 residency_set = {WNAM, ENAM}; primary = WNAM
\* t2 residency_set = {WEUR};       primary = WEUR (single-region tenant)
\* WEUR exists outside t1's residency_set — used to falsify cross-set writes.

CONSTANTS
  Tenants  = {"t1", "t2"}
  Regions  = {"WNAM", "ENAM", "WEUR"}
  ResidencySetOf <- ResidencySetOf_Default
  PrimaryOf      <- PrimaryOf_Default
  MaxClock = 4

SPECIFICATION Spec

INVARIANTS
  TypeOK
  FailoverInSetOnly
  NoCrossResidencyWrite

PROPERTIES
  PrimaryRestores

CHECK_DEADLOCK FALSE
