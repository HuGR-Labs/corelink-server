(*
 * TLC config para byok_envelope_aad.tla (PR lane -- small bounds).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh byok_envelope_aad
 *
 * Endereca INV-BYOK-CRYPTO-SOVEREIGNTY (invariant_registry sec 3.13, CRITICAL)
 * -- AAD-binding side + DEK cache TTL liveness.
 *
 * Bounds chosen so TLC finishes < 2 min on a 4-core dev laptop:
 *   - 2 tenants -> minimum for cross-tenant adversarial action.
 *   - 2 envelopes -> exercises cache eviction and concurrent unwraps.
 *   - MaxOps = 8.
 *)

SPECIFICATION Spec

CONSTANTS
    Tenants   = {tA, tB}
    Envelopes = {e1, e2}
    MaxOps    = 8

INVARIANT
    InvAadMatchesOwner
    InvNoCrossTenantOk

PROPERTY
    CacheEventuallyClears

CHECK_DEADLOCK FALSE
