(*
 * TLC config para signup_resignup.tla (PR lane — small bounds).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh signup_resignup
 *
 * Addresses FT-9 (DEBT-014):
 *   INV-SIGNUP-RESIGNUP-IDEMPOTENT (HIGH; new),
 *   INV-ONBOARD-DPA-FIRST (HIGH; inherited),
 *   INV-ONBOARD-ATOMIC-PROVISIONING (HIGH; inherited).
 *
 * Bounds chosen so TLC finishes < 1 min on a 4-core dev laptop:
 *   - MaxAttempts = 3 (enough to exercise re-signup with same email
 *     after compensated failure).
 *   - Emails = {e1, e2} (re-signup happens when 2 attempts share an
 *     email; 2nd email lets the model also explore non-reuse path).
 *)

SPECIFICATION Spec

CONSTANTS
    MaxAttempts = 3
    Emails = {e1, e2}

INVARIANT
    TypeOK
    InvAtomicPerAttempt
    InvDPAFirst
    InvResignupNoCrossLeak
    InvAtMostOneSuccessPerEmail
    InvLateWebhookNoOp

PROPERTY
    EventuallyTerminates

CHECK_DEADLOCK FALSE
