(*
 * TLC config para multipart_finalize.tla (NIGHTLY lane — extended bounds).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh multipart_finalize multipart_finalize_nightly
 *
 * Bounds widened over PR lane:
 *   - 2 tenants
 *   - 4 session ids
 *   - 3 digest values
 *   - MaxConcurrencyPerTenant = 2 (cap kept; exercises overflow harder)
 *   - MaxOps = 14 -> state space ~tens of thousands distinct states
 *     (< 5 min on ubuntu-latest with 4 vCPU + -workers 2).
 *)

SPECIFICATION Spec

CONSTANTS
    Tenants = {t1, t2}
    SessionIds = {s1, s2, s3, s4}
    Digests = {d1, d2, d3}
    MaxConcurrencyPerTenant = 2
    MaxOps = 14

INVARIANT
    InvTypeOK
    InvConcurrencyBounded
    InvFinalizeIrrevocable
    InvStateMonotonic
    InvNoDoubleTerminal
    InvFinalizedDigestStable

CHECK_DEADLOCK FALSE
