(*
 * TLC config for webauthn_origin.tla (NIGHTLY lane).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh webauthn_origin webauthn_origin_nightly
 *
 * Extended bounds (TLC < 5 min CI):
 *   - 4 origins (2 allowlisted, 2 spoof)
 *   - 3 rp_ids (1 canonical, 2 subdomain)
 *   - MaxOps = 14
 *)

SPECIFICATION Spec

CONSTANTS
    Origins       = {ok1, ok2, spoof1, spoof2}
    Allowlist     = {ok1, ok2}
    CanonicalRpId = canonical
    RpIds         = {canonical, sub1, sub2}
    MaxOps        = 14

INVARIANT
    InvOriginExact
    InvRpIdCanonical
    InvNoPendingInLog

CHECK_DEADLOCK FALSE
