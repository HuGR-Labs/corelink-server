(*
 * TLC config para gc_lock_protocol.tla (PR lane — small bounds).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh gc_lock_protocol
 *
 * Endereça FT-5 (DEBT-014):
 *   INV-GC-SINGLE-RUNNING-PER-TENANT-REGION (HIGH),
 *   INV-GC-RECONCILE-AUDIT-FAIL-CLOSED (CRITICAL, inherited).
 *
 * Bounds chosen so TLC finishes < 1 min on a 4-core dev laptop:
 *   - 2 tenants × 2 regions = 4 lock keys.
 *   - 2 workers — minimal viable for "two workers contend for same lock".
 *   - MaxOps = 8 → state space a few thousand reachable states.
 *)

SPECIFICATION Spec

CONSTANTS
    Tenants = {t1, t2}
    Regions = {r1, r2}
    Workers = {w1, w2}
    MaxOps = 8

INVARIANT
    InvSingleHolderPerKey
    InvNoConcurrentHolders
    InvAuditReleaseRequiresAcquire
    InvReconcileOnlyFromCrashed
    InvLockTypeOK

CHECK_DEADLOCK FALSE
