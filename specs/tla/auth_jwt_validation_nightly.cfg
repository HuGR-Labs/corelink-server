(*
 * TLC config para auth_jwt_validation.tla (NIGHTLY lane -- extended bounds).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh auth_jwt_validation auth_jwt_validation_nightly
 *
 * Bounds widened over the PR lane:
 *   - 5 algs adding "PS256" (asymmetric variant the lib accepts only when
 *     enabled -- adversarial enables here to prove still rejected).
 *   - 4 issuers: 2 allowlisted (multi-tenant), 1 prefix-spoof, 1 suffix.
 *   - 3 tokens -> richer replay interleavings.
 *   - MaxOps = 10.
 *
 * Expected reachable state space: ~ 60k distinct states (<= 5 min on
 * ubuntu-latest with 4 vCPU + -workers 2).
 *)

SPECIFICATION Spec

CONSTANTS
    Algs = {"none", "HS256", "RS256", "ES256", "PS256"}
    Issuers = {"https_clerk_good", "https_clerk_alt", "https_clerk_good_attacker", "attacker_clerk_good"}
    Allowlist = {"https_clerk_good", "https_clerk_alt"}
    Tokens = {t1, t2, t3}
    MaxOps = 10

INVARIANT
    InvOnlyRS256Accepted
    InvIssuerExactMatch
    InvAcceptedMetaConsistent
    InvAcceptedBoundedBySubmissions

CHECK_DEADLOCK FALSE
