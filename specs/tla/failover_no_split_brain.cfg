(*
 * TLC config para failover_no_split_brain.tla (PR lane — small bounds).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh failover_no_split_brain
 *
 * Endereça INV-REGION-NO-CROSS-LEAK + write-lease handoff
 * (invariant_registry §3.13, CRITICAL).
 *
 * Bounds chosen so TLC finishes < 2 min on a 4-core dev laptop:
 *   - 1 tenant → focuses on the handoff state machine.
 *   - 2 regions → minimum for failover.
 *   - 2 writes → exercises accept + reject under stale-lease attack.
 *   - MaxOps = 8.
 *)

SPECIFICATION Spec

CONSTANTS
    Tenants = {tA}
    Regions = {iad, fra}
    Writes  = {w1, w2}
    MaxOps  = 8

INVARIANT
    InvAtMostOneLease
    InvNoLeaseDuringHandoff
    InvAcceptedWriteHasRegion
    InvNoCrossRegionWrite
    InvPendingWriteUnstamped

CHECK_DEADLOCK FALSE
