(*
 * TLC config for ac_eviction_isolation.tla (NIGHTLY lane).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh ac_eviction_isolation ac_eviction_isolation_nightly
 *
 * Extended bounds:
 *   - 3 rows
 *   - 3 tenants, 3 regions
 *   - MaxOps = 16
 *
 * Init enumeration: 3^3 * 3^3 = 729 starting states.
 *)

SPECIFICATION Spec

CONSTANTS
    Rows    = {r1, r2, r3}
    Tenants = {tA, tB, tC}
    Regions = {iad, fra, gru}
    MaxOps  = 16

INVARIANT
    InvDeletesRegionScoped
    InvDeletesTenantScoped
    InvOnlyExpiredDeleted
    InvDeadStaysDead

CHECK_DEADLOCK FALSE
