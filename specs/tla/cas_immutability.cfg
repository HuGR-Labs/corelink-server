(*
 * TLC config for cas_immutability.tla (PR lane).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh cas_immutability
 *
 * Closes INV-CAS-IMMUTABILITY + INV-CAS-IDEMPOTENCY +
 *        INV-CAS-CORRECTNESS (CRITICAL × 3 §3.4 CAS).
 * DEBT-005 batch 5.
 *
 * Bounds (TLC < 30 s):
 *   - 3 byte sets, MaxOps = 8
 *)

SPECIFICATION Spec

CONSTANTS
    ByteSets = {b1, b2, b3}
    MaxOps   = 8

INVARIANT
    InvImmutability
    InvIdempotency
    InvCorrectness

CHECK_DEADLOCK FALSE
