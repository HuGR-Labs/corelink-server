(*
 * TLC config para tenant_isolation.tla -- NIGHTLY (extended bounds).
 *
 * Per WI-S01-007 sec 6.1.7: nightly lane runs with larger bounds than PR lane
 * (PR uses tenant_isolation.cfg). Estimated state-space cardinality
 * ~10^7..10^8 on GitHub `ubuntu-latest` (16 GB RAM, 4 vCPU); 30-min hard
 * timeout enforced by workflow `timeout-minutes: 30`.
 *
 * Bounds increased per axis:
 *   - Tenants: 2 -> 3   (cross-tenant fan-out exercised)
 *   - Principals: 2 -> 3 (1:1 with Tenants + 1 attacker principal)
 *   - Blobs: 2 -> 3
 *   - MaxOps: 4 -> 8    (longer interleavings exercise more reorderings)
 *
 * Run locally:
 *   cd specs/tla
 *   tlc -config tenant_isolation_nightly.cfg -workers 2 tenant_isolation.tla
 *)

SPECIFICATION Spec

CONSTANTS
    Tenants = {t1, t2, t3}
    Principals = {p_t1, p_t2, p_t3}
    Blobs = {b1, b2, b3}
    MaxOps = 8

INVARIANT
    InvTenantIsolationRead
    InvTenantIsolationWrite
    InvTenantIsolationEnum
    InvPrefixInjective
    InvNamespaceConsistency

CHECK_DEADLOCK FALSE
