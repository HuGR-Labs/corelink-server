(*
 * TLC config for multipart_determinism.tla (PR lane).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh multipart_determinism
 *
 * Closes INV-MULTIPART-CHUNK-DETERMINISTIC +
 *        INV-MULTIPART-PATH-TENANT-SCOPED (CRITICAL x 2 sec 3.5).
 * DEBT-005 batch 4.
 *
 * Chunker is a VARIABLE enumerated by TLC at Init across
 * [Inputs -> ChunkSeqs] (avoids FT-4 .cfg function-literal brittleness).
 *
 * Bounds (TLC < 30 s):
 *   - 2 tenants, 2 inputs, 2 chunk-seqs, 2 sessions
 *   - MaxOps = 8
 *)

SPECIFICATION Spec

CONSTANTS
    Tenants   = {t1, t2}
    Inputs    = {i1, i2}
    ChunkSeqs = {cs1, cs2}
    Sessions  = {s1, s2}
    MaxOps    = 8

INVARIANT
    InvChunkDeterministic
    InvPathTenantScoped
    InvLogsScopedToOpenSessions

CHECK_DEADLOCK FALSE
