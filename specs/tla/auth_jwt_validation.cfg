(*
 * TLC config para auth_jwt_validation.tla (PR lane — small bounds).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh auth_jwt_validation
 *
 * Endereça INV-AUTH-JWT-VALIDATE-RS256-ONLY + INV-AUTH-ISS-EXACT-MATCH
 * (invariant_registry §3.14, CRITICAL × 2).
 *
 * Bounds chosen so TLC finishes < 1 min on a 4-core dev laptop:
 *   - 4 algs including "none", "HS256", "RS256", "ES256" → exercises both
 *     CVE-2015-9235 (alg=none) and CVE-2018-0114 (key confusion HS256).
 *   - 3 issuers: 1 allowlisted (good), 1 prefix-spoof, 1 suffix-spoof.
 *   - 2 tokens → enough to exercise replay-on-already-accepted branch.
 *   - MaxOps = 6 → state space ≈ a few thousand reachable states.
 *)

SPECIFICATION Spec

CONSTANTS
    Algs = {"none", "HS256", "RS256", "ES256"}
    Issuers = {"https_clerk_good", "https_clerk_good_attacker", "attacker_clerk_good"}
    Allowlist = {"https_clerk_good"}
    Tokens = {t1, t2}
    MaxOps = 6

INVARIANT
    InvOnlyRS256Accepted
    InvIssuerExactMatch
    InvAcceptedMetaConsistent
    InvAcceptedBoundedBySubmissions

CHECK_DEADLOCK FALSE
