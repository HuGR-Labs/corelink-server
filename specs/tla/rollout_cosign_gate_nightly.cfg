(*
 * TLC config for rollout_cosign_gate.tla (NIGHTLY lane -- extended bounds).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh rollout_cosign_gate rollout_cosign_gate_nightly
 *
 * Bounds widened for the nightly tier:
 *   - 3 deployables (cross-deploy interleaving).
 *   - MaxOps = 20.
 *
 * Expected state space: ~ 50k-200k states (<= 5 min on ubuntu-latest
 * with -workers 2).
 *)

SPECIFICATION Spec

CONSTANTS
    Deployables = {d1, d2, d3}
    MaxOps      = 20

INVARIANT
    InvActiveIsSigned
    InvRejectedIsUnsigned
    InvSupplySignedDeploy
    InvRejectionAudited
    InvActivationAudited

CHECK_DEADLOCK FALSE
