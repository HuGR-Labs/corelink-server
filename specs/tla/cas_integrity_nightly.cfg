(*
 * TLC config para cas_integrity.tla — NIGHTLY (extended bounds).
 *
 * Per WI-S01-007 §6.1.7: nightly lane runs with larger bounds than PR lane
 * (PR uses cas_integrity.cfg). Estimated state-space cardinality
 * ~10^7..10^9 on GitHub `ubuntu-latest`; 30-min hard timeout via workflow.
 *
 * Bounds increased per axis:
 *   - Bodies: 2 → 3   (more digest collisions exercised)
 *   - Digests: 3 → 4  (corrupted digest count up; d_wrong + d_alt_wrong)
 *   - Clients: 1 → 2  (concurrent verify paths)
 *   - MaxOps: 3 → 6
 *
 * Endereça INV-CAS-INTEGRITY + INV-CAS-IDEMPOTENCY + INV-CAS-IMMUTABILITY.
 *)

SPECIFICATION Spec

CONSTANTS
    Bodies = {b1, b2, b3}
    Digests = {d1, d2, d_wrong, d_alt_wrong}
    Clients = {c1, c2}
    MaxOps = 6

INVARIANT
    InvCASIntegrityUncorrupted
    InvClientVerifyIsSound
    InvCASImmutability
    InvPoisoningRejected

CHECK_DEADLOCK FALSE
