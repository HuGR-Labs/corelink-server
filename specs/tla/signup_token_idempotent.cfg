(*
 * TLC config para signup_token_idempotent.tla (PR lane -- small bounds).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh signup_token_idempotent
 *
 * Endereca INV-SIGNUP-TOKEN-IDEMPOTENT (HIGH sec 3.29) -- Wave-30 stream-4
 * R-PREP promoting the wave-29 stream-10 DRAFT candidate.
 *
 * Sibling of:
 *   - signup_resignup.cfg (DEBT-014 FT-9) -- production onboarding path with
 *     Stripe webhook + DPA-first; DISJOINT from this pilot-token path.
 *   - audit_emit_atomic.cfg (DEBT-005 batch 2) -- general audit-pairing
 *     pattern; THIS spec inherits the pattern and proves the SIGNUP-
 *     SPECIFIC binding (exit_status reserved vs duplicate).
 *
 * Bounds chosen so TLC finishes sub-1s on a 4-core dev laptop:
 *   - 1 tenant pool entry -- sufficient because under the chosen Tokens/
 *     Emails bounds at most 1 fresh allocation fires before every replay
 *     branch lands on dup-email or dup-token (the ASSUME at the top of
 *     the spec also requires |Tenants| >= |Tokens|, so we pick |Tenants|
 *     = |Tokens| = 2 to exercise the multi-token cohort).
 *
 *     Wait -- re-read: ASSUME requires |Tenants| >= |Tokens|. With Tokens
 *     = {tok1, tok2} we need |Tenants| >= 2. We set Tenants = {te1, te2}
 *     so both tokens can mint fresh allocations in distinct interleavings.
 *
 *   - 2 tokens         -- exercise distinct-token interleavings + token
 *                        replay race (single-use claim).
 *   - 2 emails         -- exercise dup-email branch (canonical idempotency
 *                        claim) + cross-email interleavings.
 *   - MaxRequests = 4  -- bounds caller actions (RouteInvocation only).
 *                        RouteCompletion is internal-system, NOT counted
 *                        -- its own guard `in_flight > 0` bounds firings
 *                        to the cumulative request_count.
 *   - MaxConcurrentSignups = 2 -- models the per-IP concurrency bound;
 *                        sufficient to surface a 2-way race between two
 *                        distinct route invocations that both attempt to
 *                        bind the same email.
 *
 * Larger sweep documented in signup_token_idempotent_nightly.cfg.
 *)

SPECIFICATION Spec

CONSTANTS
    Tenants = {te1, te2}
    Tokens = {tok1, tok2}
    Emails = {em1, em2}
    MaxRequests = 4
    MaxConcurrentSignups = 2

\* Expected reachable state-space: 1 017 distinct states, depth 9,
\* ~5 s wall clock with TLC v1.8.0 -workers 2 on dev laptop (12 cores,
\* MacOS 15.3.2). Comfortable sub-1-min budget -- well inside the CI
\* 30-min per-spec hard timeout.
INVARIANT
    InvSignupIdempotentByEmail
    InvSignupTokenSingleUse
    InvAuditEmitAtomic
    InvAuditTenantIsAllocated
    InvSotCoherent

PROPERTY
    InvInFlightDrains

CHECK_DEADLOCK FALSE
