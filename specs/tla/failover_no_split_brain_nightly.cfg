(*
 * TLC config para failover_no_split_brain.tla (NIGHTLY lane — extended bounds).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh failover_no_split_brain failover_no_split_brain_nightly
 *
 * Bounds widened over the PR lane:
 *   - 2 tenants → cross-tenant lease independence.
 *   - 3 regions → 3-region failover topology.
 *   - 3 writes.
 *   - MaxOps = 14.
 *
 * Expected reachable state space: ≈ 200k–800k states (≤ 5 min on
 * ubuntu-latest with 4 vCPU + -workers 2).
 *)

SPECIFICATION Spec

CONSTANTS
    Tenants = {tA, tB}
    Regions = {iad, fra, gru}
    Writes  = {w1, w2, w3}
    MaxOps  = 14

INVARIANT
    InvAtMostOneLease
    InvNoLeaseDuringHandoff
    InvAcceptedWriteHasRegion
    InvNoCrossRegionWrite
    InvPendingWriteUnstamped

CHECK_DEADLOCK FALSE
