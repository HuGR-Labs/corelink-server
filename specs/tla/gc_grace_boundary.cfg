(*
 * TLC config for gc_grace_boundary.tla (PR lane).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh gc_grace_boundary
 *
 * Closes INV-GC-GRACE-BOUNDARY-STRICT + INV-GC-MARK-TENANT-SCOPED +
 *        INV-GC-SWEEP-TENANT-SCOPED (CRITICAL × 3 §3.6).
 * DEBT-005 batch 3.
 *
 * Owner is a VARIABLE enumerated by TLC at Init across `[Blobs -> Tenants]`
 * (avoids FT-4 .cfg function-literal brittleness).
 *
 * Bounds (TLC < 30 s):
 *   - 2 tenants, 2 blobs
 *   - GraceWindow = 2
 *   - MaxOps = 8
 *)

SPECIFICATION Spec

CONSTANTS
    Tenants     = {t1, t2}
    Blobs       = {b1, b2}
    GraceWindow = 2
    MaxOps      = 8

INVARIANT
    InvMarkTenantScoped
    InvSweepTenantScoped
    InvGraceBoundaryStrict
    InvStateWellFormed

CHECK_DEADLOCK FALSE
