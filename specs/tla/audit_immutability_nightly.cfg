(*
 * TLC config para audit_immutability.tla -- NIGHTLY (extended bounds).
 *
 * Per WI-S01-007 sec 6.1.7: nightly lane runs with larger bounds than PR lane
 * (PR uses audit_immutability.cfg). Estimated state-space cardinality
 * ~10^6..10^8 on GitHub `ubuntu-latest`; 30-min hard timeout via workflow.
 *
 * Bounds increased per axis:
 *   - Actors: 1 -> 2          (concurrent multi-actor append)
 *   - EventTypes: same {write, revoke}
 *   - MaxEvents: 3 -> 8       (chain length pressure on InvAuditChainIntact)
 *
 * Endereca INV-AUDIT-APPEND-ONLY + InvAuditChainIntact + InvAuditRejectTamper.
 *)

SPECIFICATION Spec

CONSTANTS
    Actors = {a1, a2}
    EventTypes = {write, revoke}
    MaxEvents = 8

INVARIANT
    InvAuditAppendOnly
    InvAuditChainIntact
    InvAuditOrderPreserved
    InvAuditRejectTamper
    InvDefenseInDepth

CHECK_DEADLOCK FALSE
