(*
 * TLC config para tenant_ctx_propagation.tla (PR lane -- small bounds).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh tenant_ctx_propagation
 *
 * Endereca INV-AUTH-TENANTCTX-IMMUTABLE + INV-AUTH-5-LAYER-ORDERING
 * (invariant_registry sec 3.14, CRITICAL x 2).
 *
 * Bounds chosen so TLC finishes < 1 min on a 4-core dev laptop:
 *   - 2 requests in flight -> exercises interleavings without explosion.
 *   - 2 tenants -> ensures InvTenantCtxImmutable distinguishes assignments.
 *   - MaxOps = 16 -> 6 layers x 2 requests + spare adversarial steps.
 *)

SPECIFICATION Spec

CONSTANTS
    Requests = {r1, r2}
    Tenants  = {tA, tB}
    MaxOps   = 16

INVARIANT
    InvTenantCtxImmutable
    InvHandlerHasCtx
    InvLayerOrderCanonical
    InvHandlerFullTrace

CHECK_DEADLOCK FALSE
