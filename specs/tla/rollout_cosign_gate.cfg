(*
 * TLC config for rollout_cosign_gate.tla (PR lane -- small bounds).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh rollout_cosign_gate
 *
 * Closes INV-ROLLOUT-COSIGN-GATE (CRITICAL sec 3.26) + runtime side of
 * INV-SUPPLY-SIGNED-DEPLOY (HIGH sec 3.10). DEBT-005 batch 2.
 *
 * Bounds chosen so TLC finishes < 1 min on a 4-core dev laptop:
 *   - 2 deployables -> exercise both reject and activate concurrently.
 *   - MaxOps = 12 -> enough steps for attach + verify + activate/reject
 *     for both deployables under all 3 SigOutcomes.
 *)

SPECIFICATION Spec

CONSTANTS
    Deployables = {d1, d2}
    MaxOps      = 12

INVARIANT
    InvActiveIsSigned
    InvRejectedIsUnsigned
    InvSupplySignedDeploy
    InvRejectionAudited
    InvActivationAudited

CHECK_DEADLOCK FALSE
