(*
 * TLC config for auth_webauthn_uv_admin.tla (PR lane).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh auth_webauthn_uv_admin
 *
 * Closes INV-AUTH-WEBAUTHN-UV-REQUIRED-ADMIN +
 *        INV-AUTH-WEBAUTHN-ATTESTATION-VERIFIED (CRITICAL x 2 sec 3.4 AUTH).
 * DEBT-005 batch 5.
 *
 * Bounds (TLC < 30 s):
 *   - 2 users, 2 scopes, MaxOps = 8
 *)

SPECIFICATION Spec

CONSTANTS
    Users  = {u1, u2}
    Scopes = {"admin", "member"}
    MaxOps = 8

INVARIANT
    InvAttestationVerified
    InvAdminUvRequired

CHECK_DEADLOCK FALSE
