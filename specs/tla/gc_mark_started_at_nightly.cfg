(*
 * TLC config for gc_mark_started_at.tla (NIGHTLY lane).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh gc_mark_started_at gc_mark_started_at_nightly
 *
 * Extended bounds (TLC < 5 min CI):
 *   - 2 runs, 3 workers, 3 clock tags
 *   - MaxOps = 12
 *)

SPECIFICATION Spec

CONSTANTS
    Runs    = {r1, r2}
    Workers = {w1, w2, w3}
    Clocks  = {c1, c2, c3}
    MaxOps  = 12

INVARIANT
    InvAtomicSingleWriter
    InvImmutablePostCapture
    InvNoRowsImpliesSet

CHECK_DEADLOCK FALSE
