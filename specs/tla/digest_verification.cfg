(*
 * TLC config for digest_verification.tla (PR lane).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh digest_verification
 *
 * Closes INV-DIGEST-VERIFICATION (CRITICAL §3.3 CAS).
 * DEBT-005 batch 4.
 *
 * TrueDigest + w_body + w_claimed are VARIABLEs lifted via Init
 * enumeration (avoids FT-4 .cfg function-literal brittleness).
 *
 * Bounds (TLC < 30 s):
 *   - 2 bodies, 2 digests, 2 writes
 *   - MaxOps = 6
 *)

SPECIFICATION Spec

CONSTANTS
    Bodies  = {b1, b2}
    Digests = {d1, d2}
    Writes  = {w1, w2}
    MaxOps  = 6

INVARIANT
    InvDigestVerification
    InvStoreAccepted
    InvRejectedNotInStore

CHECK_DEADLOCK FALSE
