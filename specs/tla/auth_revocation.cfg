(*
 * TLC config para auth_revocation.tla (PR lane — small bounds).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh auth_revocation
 *
 * Endereça INV-AUTH-REVOCATION-IDEMPOTENT + INV-AUTH-REVOCATION-SLO-60S +
 * INV-AUTH-MASS-REVOKE-ATOMIC + INV-AUTH-PROPAGATION-AT-LEAST-ONCE
 * (invariant_registry §3.14, CRITICAL/HIGH).
 *
 * Bounds chosen so TLC finishes < 5 min on a 4-core dev laptop:
 *   - 2 PATs across 2 tenants (1 each) → mass-revoke action is reachable.
 *   - 2 regions → exercises propagation per region without state explosion.
 *   - MaxOps = 5, MaxQueue = 6 → enough room for: 1 revoke + 2 deliveries
 *     + 1 redup + 1 retry.
 * Larger sweep documented in auth_revocation_nightly.cfg (see file).
 *)

SPECIFICATION Spec

CONSTANTS
    Pats = {p1, p2}
    Regions = {iad, fra}
    Tenants = {tA, tB}
    MaxOps = 5
    MaxQueue = 6

INVARIANT
    InvRevocationIdempotent
    InvMassRevokeAtomicOutbox
    InvRegionMonotonic
    InvSoTPrecedesRegion

PROPERTY
    RevokedEventuallyConverges

CHECK_DEADLOCK FALSE
