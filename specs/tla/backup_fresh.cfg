(*
 * TLC config for backup_fresh.tla (PR lane).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh backup_fresh
 *
 * Closes INV-BACKUP-FRESH + INV-BACKUP-INTEGRITY-SAMPLE-CAP
 *        (HIGH × 2 §3.20 Backup).
 * DEBT-005 batch 3.
 *
 * Bounds (TLC < 30 s):
 *   - RpoBudget = 3, MaxSamples = 2, MaxOps = 8
 *)

SPECIFICATION Spec

CONSTANTS
    RpoBudget  = 3
    MaxSamples = 2
    MaxOps     = 8

INVARIANT
    InvLatestAcceptedFresh
    InvSampleCapPerCycle
    InvNoBackwardSamples

CHECK_DEADLOCK FALSE
