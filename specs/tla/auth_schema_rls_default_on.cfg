(*
 * TLC config for auth_schema_rls_default_on.tla (PR lane).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh auth_schema_rls_default_on
 *
 * Closes INV-AUTH-SCHEMA-RLS-DEFAULT-ON + INV-AUTH-PII-ENCRYPTED
 *        (CRITICAL x 2 sec 3.4 AUTH).
 * DEBT-005 batch 5.
 *
 * Bounds (TLC < 30 s):
 *   - 2 tables, MaxOps = 8
 *)

SPECIFICATION Spec

CONSTANTS
    Tables = {tbl_users, tbl_sessions}
    Forms  = {"plaintext", "encrypted"}
    MaxOps = 8

INVARIANT
    InvSchemaRlsDefaultOn
    InvPiiEncrypted

CHECK_DEADLOCK FALSE
