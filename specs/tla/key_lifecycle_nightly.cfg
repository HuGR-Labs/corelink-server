(*
 * TLC config para key_lifecycle.tla (NIGHTLY lane -- extended bounds).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh key_lifecycle key_lifecycle_nightly
 *
 * Bounds widened over the PR lane:
 *   - 3 keys -> richer concurrent-rotation interleavings.
 *   - 3 approvers -> exercise N-of-M dual-approval combinatorics.
 *   - MaxOps = 12 -> state space ~ tens of thousands of distinct states
 *     (<= 5 min on ubuntu-latest with 4 vCPU + -workers 2).
 *)

SPECIFICATION Spec

CONSTANTS
    Keys = {k1, k2, k3}
    Approvers = {a1, a2, a3}
    MaxOps = 12

INVARIANT
    InvNoWriteOnRetiredOrDestroyed
    InvOverlapWindowMatchesState
    InvDualApprovalOnRetire
    InvAuditCoversTransitions
    InvStateInRange

CHECK_DEADLOCK FALSE
