(*
 * TLC config for auth_pat_plaintext_never_persisted.tla (PR lane).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh auth_pat_plaintext_never_persisted
 *
 * Closes INV-AUTH-PAT-PLAINTEXT-NEVER-PERSISTED (CRITICAL sec 3.4 AUTH).
 * DEBT-005 batch 5.
 *
 * Bounds (TLC < 30 s):
 *   - 2 tenants, 2 PAT ids, MaxOps = 8
 *)

SPECIFICATION Spec

CONSTANTS
    Tenants = {t1, t2}
    PatIds  = {p1, p2}
    MaxOps  = 8

INVARIANT
    InvPatStoreNoPlaintext
    InvAuditNoPlaintext

CHECK_DEADLOCK FALSE
