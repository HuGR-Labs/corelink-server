(*
 * TLC config for digest_verification.tla (NIGHTLY lane).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh digest_verification digest_verification_nightly
 *
 * Extended bounds (TLC < 5 min CI):
 *   - 3 bodies, 3 digests, 3 writes
 *   - MaxOps = 10
 *)

SPECIFICATION Spec

CONSTANTS
    Bodies  = {b1, b2, b3}
    Digests = {d1, d2, d3}
    Writes  = {w1, w2, w3}
    MaxOps  = 10

INVARIANT
    InvDigestVerification
    InvStoreAccepted
    InvRejectedNotInStore

CHECK_DEADLOCK FALSE
