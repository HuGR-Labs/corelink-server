(*
 * TLC config para auth_pat_revoke.tla (NIGHTLY lane -- extended bounds).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh auth_pat_revoke auth_pat_revoke_nightly
 *
 * Bounds widened over the PR lane (kept tight because the verify_attempts
 * sequence, region_cache map, and queue interleaving combine into a
 * state-space curve that grows fast -- empirically observed in dispatch
 * 2026-05-16: 3 pats x 3 regions x MaxOps=8 exceeded 9M states / 8 min):
 *   - 3 PAT IDs    -> richer adversarial interleavings (per-pat revoke +
 *                    verify ordering for distinct pats).
 *   - 2 regions    -> multi-region race surface preserved.
 *   - MaxOps = 7   -> caller-driven actions (DeleteHandler + VerifyAttempt);
 *                    PropagateToRegion is internal-and-bounded by region
 *                    cache guard (3 x 2 = 6 firings max).
 *
 * Expected wall clock: < 10 min on ubuntu-latest with 4 vCPU + -workers 2
 * (within CI 30-min hard timeout per spec -- comfortable margin). Larger
 * sweeps (5+ PATs x 5+ regions, MaxOps > 10) should run under Apalache
 * symbolic mode (FT-3 followup tracked separately).
 *)

SPECIFICATION Spec

CONSTANTS
    Pats = {p1, p2, p3}
    Regions = {iad, fra}
    MaxOps = 7

\* Expected reachable state-space: ~61 293 distinct states, depth 14,
\* 1 min 06 s wall clock with TLC v1.8.0 -workers 2. Within CI 30-min
\* per-spec budget by ~30x margin.
INVARIANT
    InvRevokedTokenNeverValidates
    InvRevokeAuditAtomic
    InvRevokeIsIdempotent
    InvRegionImpliesSoTRevoked
    InvRevokeIsMonotonic

PROPERTY
    InvRevokeAtLeastOncePropagation

CHECK_DEADLOCK FALSE
