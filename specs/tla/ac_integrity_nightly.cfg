(*
 * TLC config for ac_integrity.tla (NIGHTLY lane).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh ac_integrity ac_integrity_nightly
 *
 * Extended bounds (TLC < 5 min CI):
 *   - 3 tenants, 2 ac keys, 3 content sets
 *   - MaxOps = 14
 *)

SPECIFICATION Spec

CONSTANTS
    Tenants     = {t1, t2, t3}
    AcKeys      = {k1, k2}
    ContentSets = {c1, c2, c3}
    MaxOps      = 14

INVARIANT
    InvDigestSigned
    InvTenantScoped
    InvMerkleDeterministic

CHECK_DEADLOCK FALSE
