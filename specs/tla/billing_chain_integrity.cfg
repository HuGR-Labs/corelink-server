(*
 * TLC config for billing_chain_integrity.tla (PR lane).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh billing_chain_integrity
 *
 * Closes INV-BILLING-CHAIN-INTEGRITY (HIGH §3.9; Bitcoin block-header
 * pattern inheritance from corelink-audit-chain S-09).
 * DEBT-005 batch 3.
 *
 * Bounds (TLC < 30 s):
 *   - 2 payload alphabet
 *   - MaxLen = 4
 *   - MaxOps = 6
 *)

SPECIFICATION Spec

CONSTANTS
    Payloads = {p1, p2}
    MaxLen   = 4
    MaxOps   = 6

INVARIANT
    InvChainExtendOnly
    InvChainHeadVerifiable
    InvNoFork

CHECK_DEADLOCK FALSE
