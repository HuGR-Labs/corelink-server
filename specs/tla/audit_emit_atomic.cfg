(*
 * TLC config for audit_emit_atomic.tla (PR lane).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh audit_emit_atomic
 *
 * Closes INV-AUDIT-EMIT-ATOMIC-WITH-HANDLER (CRITICAL sec 3.6).
 * DEBT-005 batch 2.
 *
 * Bounds (TLC < 30 s):
 *   - 3 handlers
 *   - MaxOps = 8
 *)

SPECIFICATION Spec

CONSTANTS
    Handlers = {h1, h2, h3}
    MaxOps   = 8

INVARIANT
    InvAtomicPairing
    InvOutcomeConsistency
    InvNoOrphanOutbox
    InvNoOrphanDomain

CHECK_DEADLOCK FALSE
