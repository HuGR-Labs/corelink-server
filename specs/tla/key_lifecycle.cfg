(*
 * TLC config para key_lifecycle.tla (PR lane — small bounds).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh key_lifecycle
 *
 * Endereça FT-2 (DEBT-014):
 *   INV-KEY-NO-SKIP (HIGH),
 *   INV-KEY-OVERLAP (HIGH),
 *   INV-ADMIN-DUAL-APPROVAL (HIGH),
 *   INV-KEY-AUDIT (implicit).
 *
 * Bounds chosen so TLC finishes < 1 min on a 4-core dev laptop:
 *   - 2 keys → enough to exercise concurrent rotation cohorts.
 *   - 2 approvers → minimal viable for dual-approval (smaller would FAIL
 *     INV-ADMIN-DUAL-APPROVAL by construction; the approver set must
 *     allow ≥ 2 distinct approvers per ASSUME).
 *   - MaxOps = 8 → enough actions to reach destroyed state on both keys.
 *)

SPECIFICATION Spec

CONSTANTS
    Keys = {k1, k2}
    Approvers = {a1, a2}
    MaxOps = 8

INVARIANT
    InvNoWriteOnRetiredOrDestroyed
    InvOverlapWindowMatchesState
    InvDualApprovalOnRetire
    InvAuditCoversTransitions
    InvStateInRange

CHECK_DEADLOCK FALSE
