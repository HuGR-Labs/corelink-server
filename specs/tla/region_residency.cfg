\* CoreLink S-14 WI-S14-009 -- region_residency TLC config.
\* TLC v1.8.0 SHA-256 pinned (ADR-0042 sec A1).
\* State space bounded for CI tractability: tenants=3, blobs=2, regions=4, MaxRequests=2.
\* CI runtime target: <= 60s on ubuntu-latest (4 vCPU; -workers 2).

CONSTANTS
  \* 4 canonical S-14 regions
  Regions          = {"WNAM", "ENAM", "WEUR", "SAM"}

  \* 3 tenants with distinct primary regions (bounded state space)
  Tenants          = {"t1", "t2", "t3"}

  \* 2 blobs (bounded; matched to MaxRequests=2 — at most 2 writes ever occur)
  Blobs            = {"b1", "b2"}

  \* PrimaryRegionOf: injective partial mapping (3 tenants -> 3 distinct regions);
  \* t3 shares WEUR -- multi-tenant coexistence in one region. The TLC .cfg grammar
  \* has no function-literal syntax, so the concrete mapping is defined as
  \* PrimaryRegionOfImpl in region_residency.tla and injected via this <- override.
  PrimaryRegionOf  <- PrimaryRegionOfImpl

  \* MaxLag: abstract replication lag bound (clock ticks; 2 is sufficient for convergence test)
  MaxLag           = 2

SPECIFICATION Spec

INVARIANTS
  TypeOK
  RegionResidencyHolds
  NoCrossRegionWrite
  NoCrossRegionLeak

PROPERTIES
  ReplicationEventuallyConverges

CHECK_DEADLOCK FALSE
