(*
 * TLC config para byok_dek_race.tla (PR lane — small bounds).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh byok_dek_race
 *
 * Addresses FT-7 (DEBT-014, CRITICAL upgrade):
 *   INV-BYOK-CRYPTO-SOVEREIGNTY (CRITICAL) — per-region DEK cache race.
 *
 * Bounds chosen so TLC finishes < 1 min on a 4-core dev laptop:
 *   - 1 tenant (the inter-region race is per-tenant; multiple tenants
 *     add product-state explosion without exposing new races).
 *   - 2 regions (minimum to exhibit inter-region cache asymmetry).
 *   - MaxTicks = 6, SlaTicks = 3 (matches BYOK kill-switch SLA shape).
 *   - MaxEncrypts = 2 -> bounds the encrypts_admitted counter.
 *)

SPECIFICATION Spec

CONSTANTS
    Tenants = {t1}
    Regions = {r1, r2}
    MaxTicks = 6
    SlaTicks = 3
    MaxEncrypts = 2

INVARIANT
    TypeOK
    InvNoEncryptAfterRegionEvicted
    InvDegradedRegionCacheClean
    InvNoCrossRegionDekCopy
    InvTicksBounded

PROPERTY
    RegionDegradesUnderRevoke

CHECK_DEADLOCK FALSE
