(*
 * TLC config for webauthn_origin.tla (PR lane).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh webauthn_origin
 *
 * Closes INV-AUTH-WEBAUTHN-ORIGIN-EXACT + INV-AUTH-WEBAUTHN-RP-ID-CANONICAL
 * (CRITICAL x 2 sec 3.14).
 * DEBT-005 batch 4.
 *
 * Bounds (TLC < 30 s):
 *   - 3 origins (2 allowlisted, 1 spoof)
 *   - 2 rp_ids (1 canonical, 1 subdomain)
 *   - MaxOps = 8
 *)

SPECIFICATION Spec

CONSTANTS
    Origins       = {ok1, ok2, spoof1}
    Allowlist     = {ok1, ok2}
    CanonicalRpId = canonical
    RpIds         = {canonical, sub1}
    MaxOps        = 8

INVARIANT
    InvOriginExact
    InvRpIdCanonical
    InvNoPendingInLog

CHECK_DEADLOCK FALSE
