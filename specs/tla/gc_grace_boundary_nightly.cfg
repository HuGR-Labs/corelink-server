(*
 * TLC config for gc_grace_boundary.tla (NIGHTLY lane).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh gc_grace_boundary gc_grace_boundary_nightly
 *
 * Extended bounds (TLC < 5 min CI):
 *   - 2 tenants, 3 blobs (Owner enumerated by TLC)
 *   - GraceWindow = 3
 *   - MaxOps = 14
 *)

SPECIFICATION Spec

CONSTANTS
    Tenants     = {t1, t2}
    Blobs       = {b1, b2, b3}
    GraceWindow = 3
    MaxOps      = 14

INVARIANT
    InvMarkTenantScoped
    InvSweepTenantScoped
    InvGraceBoundaryStrict
    InvStateWellFormed

CHECK_DEADLOCK FALSE
