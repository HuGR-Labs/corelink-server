(*
 * TLC config for audit_no_raw_pii.tla (PR lane).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh audit_no_raw_pii
 *
 * Closes INV-AUDIT-NO-RAW-PII + INV-NO-PII-IN-LOGS +
 *        INV-NO-BODY-IN-LOGS (CRITICAL × 3 §3.4).
 * DEBT-005 batch 5.
 *
 * Bounds (TLC < 30 s):
 *   - 3 payload kinds, MaxOps = 8
 *)

SPECIFICATION Spec

CONSTANTS
    PayloadKinds = {"clean", "pii_raw", "body_bytes"}
    MaxOps       = 8

INVARIANT
    InvAuditNoRawPii
    InvNoPiiInLogs
    InvNoBodyInLogs

CHECK_DEADLOCK FALSE
