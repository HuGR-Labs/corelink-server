(*
 * TLC config para merkle_integrity.tla (NIGHTLY lane -- extended bounds).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh merkle_integrity merkle_integrity_nightly
 *
 * Bounds widened over the PR lane:
 *   - 3 envelopes.
 *   - 4 leaves -> 2^4 = 16 subsets; richer adversarial choices.
 *   - MaxOps = 12.
 *
 * Expected reachable state space: ~ 200k-500k states (<= 5 min on
 * ubuntu-latest with 4 vCPU + -workers 2). Wider sweeps belong in
 * Apalache symbolic mode (FT-3 followup).
 *)

SPECIFICATION Spec

CONSTANTS
    Envelopes = {e1, e2, e3}
    Leaves    = {l1, l2, l3, l4}
    MaxOps    = 12

INVARIANT
    InvAcceptedBindsRoot
    InvDecisionsDisjoint
    InvTamperedNotAccepted

CHECK_DEADLOCK FALSE
