(*
 * TLC config para signup_resignup.tla (NIGHTLY lane — extended bounds).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh signup_resignup signup_resignup_nightly
 *
 * Bounds widened over PR lane:
 *   - MaxAttempts = 4 (3 same-email re-signup retries + 1 distinct).
 *   - Emails = {e1, e2, e3}.
 *)

SPECIFICATION Spec

CONSTANTS
    MaxAttempts = 4
    Emails = {e1, e2, e3}

INVARIANT
    TypeOK
    InvAtomicPerAttempt
    InvDPAFirst
    InvResignupNoCrossLeak
    InvAtMostOneSuccessPerEmail
    InvLateWebhookNoOp

PROPERTY
    EventuallyTerminates

CHECK_DEADLOCK FALSE
