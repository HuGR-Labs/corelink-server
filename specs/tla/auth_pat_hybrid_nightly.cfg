(*
 * TLC config para auth_pat_hybrid.tla (NIGHTLY lane -- extended bounds).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh auth_pat_hybrid auth_pat_hybrid_nightly
 *
 * Bounds widened over the PR lane:
 *   - 3 PAT IDs -> richer interleavings between accepted + rejected paths.
 *   - MaxOps = 9 -> state space ~ tens of thousands of distinct states
 *     (<= 5 min on ubuntu-latest with 4 vCPU + -workers 2).
 *)

SPECIFICATION Spec

CONSTANTS
    Pats = {p1, p2, p3}
    MaxOps = 9

INVARIANT
    InvHmacVerifiedBeforeAdmit
    InvNoArgonWithoutHmacAndRow
    InvNoDbHitWithoutHmac
    InvAcceptedRequiresArgon
    InvHybridOrderingChain

CHECK_DEADLOCK FALSE
