(*
 * TLC config para byok_dek_race.tla (NIGHTLY lane -- extended bounds).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh byok_dek_race byok_dek_race_nightly
 *
 * Bounds widened over PR lane:
 *   - 2 tenants (tests independent kms_state flips).
 *   - 3 regions (broader inter-region asymmetry surface).
 *   - MaxTicks = 8, SlaTicks = 3.
 *   - MaxEncrypts = 3.
 *)

SPECIFICATION Spec

CONSTANTS
    Tenants = {t1, t2}
    Regions = {r1, r2, r3}
    MaxTicks = 8
    SlaTicks = 3
    MaxEncrypts = 3

INVARIANT
    TypeOK
    InvNoEncryptAfterRegionEvicted
    InvDegradedRegionCacheClean
    InvNoCrossRegionDekCopy
    InvTicksBounded

PROPERTY
    RegionDegradesUnderRevoke

CHECK_DEADLOCK FALSE
