(*
 * TLC config para billing_atomicity.tla — PR-tier bounds.
 *
 * Model checking run:
 *   cd specs/tla
 *   tlc -config billing_atomicity.cfg -workers 2 -fp 32 billing_atomicity.tla
 *
 * Endereça INV-BILLING-NO-LOSS (HIGH; registry §3.9 line 136) +
 * INV-BILLING-NO-DUP (HIGH; registry §3.9 line 137) +
 * INV-BILLING-RECONCILE-3-LAYER Layer-1 sub-property (HIGH; registry §3.12 line 166)
 * + INV-BILLING-CHAIN-INTEGRITY (NEW; sprint contract §6 DoD).
 * Evidence: WI-S10-007 §6 + sprint contract §6 DoD.
 *
 * State-space sizing per WI §6.1.3 + §9.4 + §10.s10.007.5:
 *   Tenants × SKUs × BillingPeriods × MaxEventsPerTenant per tenant
 *     = 3 × 1 × 2 × 3 = 18 distinct events
 *   MaxConcurrentEvents = 3 (in-flight bound; previne unbounded set growth)
 *   Reachable graph (re-)measured empirically 2026-06-03: TLC exhausts the
 *   FULL graph in ~21s — 749,775 states generated, 224,816 distinct, 0 left on
 *   queue, depth 8, all 4 invariants green (≤ 1M states; CI feasibility per WI
 *   §9.3). The prior 5/10 bounds inherited an UN-validated "≤ 1M" estimate: the
 *   spec aborted at State 4 (the AggregateCounter empty-function crash) so the
 *   true reachable graph was never reached — once the crash + the two unsound
 *   strict-equality invariants were fixed, the real 5/10 graph is tens of
 *   millions of states (non-terminating in the CI window). These bounds still
 *   exercise every load-bearing interleaving (the violation counterexamples
 *   need only 2 events per (tenant,sku,bp) + the aggregate→invoice→Stripe race;
 *   3/3 keeps margin).
 *
 *   NOTE: billing_atomicity_nightly.cfg (5/10-class wider bounds) inherited the
 *   SAME un-validated estimate and is now also non-terminating against the
 *   fixed spec; its bounds must be re-measured before that off-PR lane can go
 *   green (out of scope for this PR-tier fix — flagged for follow-up).
 *)

SPECIFICATION Spec

CONSTANTS
    Tenants = {t1, t2, t3}
    SKUs = {sku1}
    BillingPeriods = {p1, p2}
    MaxEventsPerTenant = 3
    MaxConcurrentEvents = 3

INVARIANT
    INV_BILLING_NO_LOSS
    INV_BILLING_NO_DUP
    INV_BILLING_CHAIN_INTEGRITY
    INV_LAYER_1_RECONCILE

CHECK_DEADLOCK FALSE
