(*
 * TLC config para billing_atomicity.tla -- PR-tier bounds.
 *
 * Model checking run:
 *   cd specs/tla
 *   tlc -config billing_atomicity.cfg -workers 2 -fp 32 billing_atomicity.tla
 *
 * Endereca INV-BILLING-NO-LOSS (HIGH; registry sec 3.9 line 136) +
 * INV-BILLING-NO-DUP (HIGH; registry sec 3.9 line 137) +
 * INV-BILLING-RECONCILE-3-LAYER Layer-1 sub-property (HIGH; registry sec 3.12 line 166)
 * + INV-BILLING-CHAIN-INTEGRITY (NEW; sprint contract sec 6 DoD).
 * Evidence: WI-S10-007 sec 6 + sprint contract sec 6 DoD.
 *
 * State-space sizing per WI sec 6.1.3 + sec 9.4 + sec 10.s10.007.5:
 *   Tenants x SKUs x BillingPeriods x MaxEventsPerTenant per tenant
 *     = 3 x 1 x 2 x 5 = 30 distinct events
 *   MaxConcurrentEvents = 10 (in-flight bound; previne unbounded set growth)
 *   Reachable graph determined empirically via TLC dry-run; CONSTANTS upper
 *   bound per WI sec 9.3 <= 1M states (CI feasibility threshold).
 *)

SPECIFICATION Spec

CONSTANTS
    Tenants = {t1, t2, t3}
    SKUs = {sku1}
    BillingPeriods = {p1, p2}
    MaxEventsPerTenant = 5
    MaxConcurrentEvents = 10

INVARIANT
    INV_BILLING_NO_LOSS
    INV_BILLING_NO_DUP
    INV_BILLING_CHAIN_INTEGRITY
    INV_LAYER_1_RECONCILE

CHECK_DEADLOCK FALSE
