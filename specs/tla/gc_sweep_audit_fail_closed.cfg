(*
 * TLC config for gc_sweep_audit_fail_closed.tla (PR lane).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh gc_sweep_audit_fail_closed
 *
 * Closes INV-GC-SWEEP-AUDIT-FAIL-CLOSED + INV-GC-RECONCILE-AUDIT-FAIL-CLOSED
 * (CRITICAL × 2 §3.6). DEBT-005 batch 2.
 *
 * Bounds (TLC < 1 min):
 *   - 2 sweep ops, 2 reconcile ops
 *   - MaxOps = 10
 *)

SPECIFICATION Spec

CONSTANTS
    SweepOps     = {s1, s2}
    ReconcileOps = {r1, r2}
    MaxOps       = 10

INVARIANT
    InvSweepAtomicPairing
    InvSweepOutcomeConsistent
    InvReconcileAtomicPairing
    InvReconcileOutcomeConsistent
    InvNoOrphanSweepAudit
    InvNoOrphanReconcileAudit

CHECK_DEADLOCK FALSE
