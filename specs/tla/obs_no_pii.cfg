(*
 * TLC config for obs_no_pii.tla (PR lane).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh obs_no_pii
 *
 * Closes INV-OBS-NO-PII (CRITICAL sec 3.24).
 * DEBT-005 batch 3.
 *
 * Bounds (TLC < 30 s):
 *   - 3 events
 *   - MaxOps = 8
 *)

SPECIFICATION Spec

CONSTANTS
    Events = {e1, e2, e3}
    MaxOps = 8

INVARIANT
    InvNoPiiInSink
    InvSinkEqAdmitted
    InvPendingNotInSink

CHECK_DEADLOCK FALSE
