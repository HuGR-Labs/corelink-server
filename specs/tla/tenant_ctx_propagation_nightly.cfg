(*
 * TLC config para tenant_ctx_propagation.tla (NIGHTLY lane — extended bounds).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh tenant_ctx_propagation tenant_ctx_propagation_nightly
 *
 * Bounds widened over the PR lane:
 *   - 3 requests in flight → richer cross-request interleavings.
 *   - 3 tenants → broader tenant_id discrimination.
 *   - MaxOps = 24.
 *
 * Expected reachable state space: ≈ 50k–100k states (≤ 5 min on
 * ubuntu-latest with 4 vCPU + -workers 2).
 *)

SPECIFICATION Spec

CONSTANTS
    Requests = {r1, r2, r3}
    Tenants  = {tA, tB, tC}
    MaxOps   = 24

INVARIANT
    InvTenantCtxImmutable
    InvHandlerHasCtx
    InvLayerOrderCanonical
    InvHandlerFullTrace

CHECK_DEADLOCK FALSE
