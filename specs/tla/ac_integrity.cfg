(*
 * TLC config for ac_integrity.tla (PR lane).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh ac_integrity
 *
 * Closes INV-AC-DIGEST-SIGNED + INV-AC-MERKLE-DETERMINISTIC +
 *        INV-AC-TENANT-SCOPED (CRITICAL × 3 §3.4).
 * DEBT-005 batch 4.
 *
 * Bounds (TLC < 30 s):
 *   - 2 tenants, 2 ac keys, 2 content sets
 *   - MaxOps = 8
 *)

SPECIFICATION Spec

CONSTANTS
    Tenants     = {t1, t2}
    AcKeys      = {k1, k2}
    ContentSets = {c1, c2}
    MaxOps      = 8

INVARIANT
    InvDigestSigned
    InvTenantScoped
    InvMerkleDeterministic

CHECK_DEADLOCK FALSE
