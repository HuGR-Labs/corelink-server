(*
 * TLC config para gc_correctness.tla -- NIGHTLY (extended bounds).
 *
 * Per WI-S01-007 sec 6.1.7: nightly lane runs with larger bounds than PR lane
 * (PR uses gc_correctness.cfg). Estimated state-space cardinality
 * ~10^7..10^9 on GitHub `ubuntu-latest`; 30-min hard timeout via workflow.
 *
 * Bounds increased per axis:
 *   - Blobs: 2 -> 4
 *   - AC_Entries: 1 -> 3   (more re-ref / unref interleavings)
 *   - MaxTime: 10 -> 20    (longer GC race windows)
 *   - GracePeriod: 2 -> 3  (one extra observable window)
 *
 * Endereca INV-GC-001 + INV-GC-004 (CRITICAL).
 *)

SPECIFICATION Spec

CONSTANTS
    Blobs = {b1, b2, b3, b4}
    AC_Entries = {e1, e2, e3}
    MaxTime = 20
    GracePeriod = 3

INVARIANT
    InvGCReachableNeverDeleted
    InvGCReRefProtected

CHECK_DEADLOCK FALSE
