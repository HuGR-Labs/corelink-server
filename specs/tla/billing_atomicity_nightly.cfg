(*
 * TLC config para billing_atomicity.tla — Nightly extended bounds.
 *
 * Model checking run (nightly tier):
 *   cd specs/tla
 *   tlc -config billing_atomicity_nightly.cfg -workers 2 -fp 32 billing_atomicity.tla
 *
 * Extended bounds vs PR-tier billing_atomicity.cfg:
 *   - 4 tenants (vs 3)         — broader cross-tenant interleaving
 *   - 2 SKUs (vs 1)            — confirms per-SKU counter PK isolation
 *   - 3 billing_periods (vs 2) — confirms YYYY-MM rollover semantics
 *   - MaxEventsPerTenant = 6   — more emit interleavings per bucket
 *   - MaxConcurrentEvents = 15 — bigger in-flight ceiling
 *
 * Reachable graph determined empirically via TLC nightly run with
 * 30-min hard timeout. Failures fail-CLOSED in CI per .github/workflows/
 * tla_billing_check.yml + nightly.yml::tlc-extended.
 *)

SPECIFICATION Spec

CONSTANTS
    Tenants = {t1, t2, t3, t4}
    SKUs = {sku1, sku2}
    BillingPeriods = {p1, p2, p3}
    MaxEventsPerTenant = 6
    MaxConcurrentEvents = 15

INVARIANT
    INV_BILLING_NO_LOSS
    INV_BILLING_NO_DUP
    INV_BILLING_CHAIN_INTEGRITY
    INV_LAYER_1_RECONCILE

CHECK_DEADLOCK FALSE
