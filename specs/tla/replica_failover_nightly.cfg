(*
 * TLC config para replica_failover.tla (NIGHTLY lane — extended bounds).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh replica_failover replica_failover_nightly
 *
 * Bounds widened over the PR lane:
 *   - 3 regions → 3-region failover topology.
 *   - CooldownTicks = 3 → longer cool-down window.
 *   - MaxOps = 14.
 *
 * Expected reachable state space: small (≤ 100k states; ≤ 2 min on
 * ubuntu-latest with 4 vCPU + -workers 2). The model is finite by
 * MaxOps + bounded Regions + bounded clock (constrained by MaxOps).
 *)

SPECIFICATION Spec

CONSTANTS
    Regions       = {wnam, enam, weur}
    CooldownTicks = 3
    MaxOps        = 14

INVARIANT
    InvAtMostOnePrimary
    InvCooldownTrackedForHotStandby
    InvCooldownNotInFuture
    InvRoleCanonical
    InvHealthyWellFormed

CHECK_DEADLOCK FALSE
