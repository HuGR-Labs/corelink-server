(*
 * TLC config para gc_lock_protocol.tla (NIGHTLY lane -- extended bounds).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh gc_lock_protocol gc_lock_protocol_nightly
 *
 * Bounds widened over the PR lane:
 *   - 2 tenants x 3 regions = 6 lock keys -> asymmetric topology.
 *   - 3 workers -> wider contention surface (handoff + crash + retry).
 *   - MaxOps = 12 -> state space ~ tens of thousands of distinct states
 *     (<= 5 min on ubuntu-latest with 4 vCPU + -workers 2).
 *)

SPECIFICATION Spec

CONSTANTS
    Tenants = {t1, t2}
    Regions = {r1, r2, r3}
    Workers = {w1, w2, w3}
    MaxOps = 12

INVARIANT
    InvSingleHolderPerKey
    InvNoConcurrentHolders
    InvAuditReleaseRequiresAcquire
    InvReconcileOnlyFromCrashed
    InvLockTypeOK

CHECK_DEADLOCK FALSE
