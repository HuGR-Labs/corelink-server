(*
 * TLC config for backup_restore_ephemeral.tla (NIGHTLY lane).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh backup_restore_ephemeral backup_restore_ephemeral_nightly
 *
 * Extended bounds:
 *   - 3 restore ops
 *   - 2 prod namespaces + 3 ephemeral namespaces
 *   - MaxOps = 16
 *)

SPECIFICATION Spec

CONSTANTS
    RestoreOps          = {o1, o2, o3}
    ProdNamespaces      = {prod_iad, prod_fra}
    EphemeralNamespaces = {eph1, eph2, eph3}
    MaxOps              = 16

INVARIANT
    InvRunningIsEphemeral
    InvNoProdRestore
    InvRejectedHasNoNamespace
    InvTornDownPreservesTag

PROPERTY
    EphemeralEventuallyTornDown

CHECK_DEADLOCK FALSE
