(*
 * TLC config for backup_fresh.tla (NIGHTLY lane).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh backup_fresh backup_fresh_nightly
 *
 * Extended bounds (TLC < 5 min CI):
 *   - RpoBudget = 5, MaxSamples = 3, MaxOps = 14
 *)

SPECIFICATION Spec

CONSTANTS
    RpoBudget  = 5
    MaxSamples = 3
    MaxOps     = 14

INVARIANT
    InvLatestAcceptedFresh
    InvSampleCapPerCycle
    InvNoBackwardSamples

CHECK_DEADLOCK FALSE
