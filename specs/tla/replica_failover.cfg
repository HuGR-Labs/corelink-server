(*
 * TLC config para replica_failover.tla (PR lane -- small bounds).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh replica_failover
 *
 * Endereca INV-FAILOVER-NO-SPLIT-BRAIN at the COORDINATOR layer
 * (complements `failover_no_split_brain.tla` write-lease side; the
 * coordinator's 3-state role machine is a STRICT GENERALIZATION
 * -- the lease-handoff spec proves at most one *write lease* per
 * tenant; this spec proves at most one *PRIMARY role* per region
 * topology, AND adds the 24h failback cool-down guarantee).
 *
 * Bounds chosen so TLC finishes < 2 min on a 4-core dev laptop:
 *   - 2 regions -> minimum for failover.
 *   - CooldownTicks = 2 -> exercises failback before/after cool-down.
 *   - MaxOps = 8.
 *)

SPECIFICATION Spec

CONSTANTS
    Regions       = {wnam, enam}
    CooldownTicks = 2
    MaxOps        = 8

INVARIANT
    InvAtMostOnePrimary
    InvCooldownTrackedForHotStandby
    InvCooldownNotInFuture
    InvRoleCanonical
    InvHealthyWellFormed

CHECK_DEADLOCK FALSE
