(*
 * TLC config para multipart_finalize.tla (PR lane — small bounds).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh multipart_finalize
 *
 * Addresses FT-6 (DEBT-014):
 *   INV-MULTIPART-FINALIZE-IRREVOCABLE (HIGH),
 *   INV-MULTIPART-STATE-MONOTONIC (HIGH),
 *   INV-MULTIPART-CONCURRENCY-BOUNDED (HIGH).
 *
 * Bounds chosen so TLC finishes < 1 min on a 4-core dev laptop:
 *   - 2 tenants
 *   - 3 session ids (enough to exhibit cap=2 + 1 reject)
 *   - 2 digest values (enough to exhibit mismatched re-finalize)
 *   - MaxConcurrencyPerTenant = 2
 *   - MaxOps = 8 -> state space a few thousand reachable states.
 *)

SPECIFICATION Spec

CONSTANTS
    Tenants = {t1}
    SessionIds = {s1, s2}
    Digests = {d1, d2}
    MaxConcurrencyPerTenant = 1
    MaxOps = 5

INVARIANT
    InvTypeOK
    InvConcurrencyBounded
    InvFinalizeIrrevocable
    InvStateMonotonic
    InvNoDoubleTerminal
    InvFinalizedDigestStable

CHECK_DEADLOCK FALSE
