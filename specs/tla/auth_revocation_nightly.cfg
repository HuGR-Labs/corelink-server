(*
 * TLC config para auth_revocation.tla (NIGHTLY lane -- extended bounds).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh auth_revocation auth_revocation_nightly
 *
 * Bounds widened over the PR lane:
 *   - 3 PATs across 2 tenants (2+1) -> tenant A has a real mass-revoke
 *     payload, tenant B is a single-PAT control.
 *   - 2 regions -> keeps state space tractable while still exercising
 *     multi-region propagation (queue redelivery interleaving is the
 *     dominant state-space driver, not the region count).
 *   - MaxOps = 6, MaxQueue = 8.
 *
 * Expected reachable state space: ~ 300k distinct states (<= 5 min on
 * ubuntu-latest with 4 vCPU + -workers 2). Local probe with 3x3x2 x
 * (MaxOps=9, MaxQueue=12) exceeded 4M states / 15 min -> out of CI 30 min
 * budget; trimmed to this bound 2026-05-15 per the audit doc sec 8.
 * Larger sweeps should run under Apalache symbolic mode (FT-3 followup).
 *)

SPECIFICATION Spec

CONSTANTS
    Pats = {p1, p2, p3}
    Regions = {iad, fra}
    Tenants = {tA, tB}
    MaxOps = 6
    MaxQueue = 8

INVARIANT
    InvRevocationIdempotent
    InvMassRevokeAtomicOutbox
    InvRegionMonotonic
    InvSoTPrecedesRegion

PROPERTY
    RevokedEventuallyConverges

CHECK_DEADLOCK FALSE
