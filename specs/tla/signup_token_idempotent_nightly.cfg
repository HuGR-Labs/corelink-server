(*
 * TLC config para signup_token_idempotent.tla (NIGHTLY lane -- extended).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh signup_token_idempotent \
 *       signup_token_idempotent_nightly
 *
 * Bounds widened over the PR lane while staying inside the CI per-spec
 * 30-min hard timeout. The state space grows as roughly
 * O(|Tokens| x |Emails| x MaxRequests x MaxConcurrentSignups) so we
 * grow each dimension by one and hold MaxRequests modest to stay tight.
 *
 *   - 3 tenants    -- preserves |Tenants| >= |Tokens| ASSUME for the
 *                    worst-case allocation pattern.
 *   - 3 tokens     -> richer adversarial token-replay interleavings
 *                    (per-token replay x cross-token races).
 *   - 2 emails     -> 2-email coverage exercises dup-email branch and
 *                    cross-email dup-token branch without blowing up
 *                    the |Emails| x |Tokens| RouteInvocation lattice.
 *                    Empirical dispatch profile (2026-05-16): the
 *                    initial bounds 3x3x6 generated > 1.3 M states /
 *                    > 10 min wall clock and was still climbing --
 *                    audit_log sequence is the cardinal driver because
 *                    every distinct (e, t, tenant, exit_status)
 *                    permutation grows the state space combinatorially.
 *                    Trimming to |Emails|=2 + MaxRequests=5 cuts the
 *                    audit_log permutation count by ~4x while keeping
 *                    every branch of `insert_or_existing` reachable.
 *   - MaxRequests = 5 -- bounds caller actions; covers up to 5 distinct
 *                       RouteInvocations across the 2x3 (e, t) lattice
 *                       (= 6 possible distinct pairs; 5 fires lands
 *                       every distinct fresh-allocation + replay
 *                       interleaving).
 *   - MaxConcurrentSignups = 3 -- surfaces 3-way race contention.
 *
 * Expected wall clock: < 5 min on ubuntu-latest with 4 vCPU + -workers 2
 * (well within CI 30-min hard timeout per spec -- comfortable margin).
 * Larger sweeps (4+ tokens x 4+ emails, MaxRequests > 8) should run
 * under Apalache symbolic mode if BFS exceeds the budget -- tracked
 * under the general FT-3 followup (Apalache adoption).
 *)

SPECIFICATION Spec

CONSTANTS
    Tenants = {te1, te2, te3}
    Tokens = {tok1, tok2, tok3}
    Emails = {em1, em2}
    MaxRequests = 5
    MaxConcurrentSignups = 3

\* Expected reachable state-space: ~37 273 distinct states, depth 11,
\* ~33 s wall clock with TLC v1.8.0 -workers 2 on dev laptop (12 cores,
\* MacOS 15.3.2). Within CI 30-min per-spec budget by ~50x margin.
INVARIANT
    InvSignupIdempotentByEmail
    InvSignupTokenSingleUse
    InvAuditEmitAtomic
    InvAuditTenantIsAllocated
    InvSotCoherent

PROPERTY
    InvInFlightDrains

CHECK_DEADLOCK FALSE
