(*
 * TLC config para tenant_isolation.tla
 *
 * Model checking run:
 *   cd specs/tla
 *   tlc -config tenant_isolation.cfg -deadlock tenant_isolation.tla
 *
 * Em CI: evidence EVT-022 (CTRL-FORMAL-001).
 *)

SPECIFICATION Spec

CONSTANTS
    Tenants = {t1, t2}
    Principals = {p_t1, p_t2}
    Blobs = {b1, b2}
    MaxOps = 4

INVARIANT
    InvTenantIsolation
    InvPrefixInjective
    InvNamespaceConsistency

(* Opcional: descomentar para liveness check
PROPERTY
    Liveness
*)

CHECK_DEADLOCK FALSE
