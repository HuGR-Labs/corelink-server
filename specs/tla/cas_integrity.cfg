SPECIFICATION Spec

CONSTANTS
    Bodies = {b1, b2}
    Digests = {d1, d2, d_wrong}
    Clients = {c1}
    MaxOps = 3

INVARIANT
    InvCASIntegrityUncorrupted
    InvClientVerifyIsSound
    InvCASImmutability
