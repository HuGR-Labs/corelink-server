(*
 * TLC config para cas_integrity.tla
 *
 * Model checking run:
 *   cd specs/tla
 *   tlc -config cas_integrity.cfg -deadlock cas_integrity.tla
 *
 * Endereca INV-CAS-INTEGRITY + INV-CAS-IDEMPOTENCY + INV-CAS-IMMUTABILITY
 * (invariant_registry sec 3.2, todas CRITICAL).
