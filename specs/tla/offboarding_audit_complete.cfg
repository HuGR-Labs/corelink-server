(*
 * TLC config for offboarding_audit_complete.tla (PR lane).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh offboarding_audit_complete
 *
 * Closes INV-OFFBOARDING-AUDIT-COMPLETE (CRITICAL sec 3.25) +
 *        INV-OFFBOARDING-GRACE-RESPECTED (HIGH sec 3.25).
 * DEBT-005 batch 3.
 *
 * Bounds (TLC < 30 s):
 *   - 2 tenants
 *   - GraceThreshold = 2
 *   - MaxOps = 12
 *)

SPECIFICATION Spec

CONSTANTS
    Tenants        = {t1, t2}
    GraceThreshold = 2
    MaxOps         = 12

INVARIANT
    InvAuditPairsTransition
    InvAuditRowsAreValidTransitions
    InvGraceRespected

CHECK_DEADLOCK FALSE
