(*
 * TLC config for multipart_determinism.tla (NIGHTLY lane).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh multipart_determinism multipart_determinism_nightly
 *
 * Extended bounds (TLC < 5 min CI):
 *   - 2 tenants, 3 inputs, 2 chunk-seqs, 3 sessions
 *   - MaxOps = 14
 *)

SPECIFICATION Spec

CONSTANTS
    Tenants   = {t1, t2}
    Inputs    = {i1, i2, i3}
    ChunkSeqs = {cs1, cs2}
    Sessions  = {s1, s2, s3}
    MaxOps    = 14

INVARIANT
    InvChunkDeterministic
    InvPathTenantScoped
    InvLogsScopedToOpenSessions

CHECK_DEADLOCK FALSE
