(*
 * TLC config para byok_envelope_aad.tla (NIGHTLY lane -- extended bounds).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh byok_envelope_aad byok_envelope_aad_nightly
 *
 * Bounds widened over the PR lane:
 *   - 3 tenants -> richer cross-tenant interleavings.
 *   - 3 envelopes -> cache and revocation sweep stress.
 *   - MaxOps = 12.
 *
 * Expected reachable state space: ~ 100k-300k states (<= 5 min on
 * ubuntu-latest with 4 vCPU + -workers 2).
 *)

SPECIFICATION Spec

CONSTANTS
    Tenants   = {tA, tB, tC}
    Envelopes = {e1, e2, e3}
    MaxOps    = 12

INVARIANT
    InvAadMatchesOwner
    InvNoCrossTenantOk

PROPERTY
    CacheEventuallyClears

CHECK_DEADLOCK FALSE
