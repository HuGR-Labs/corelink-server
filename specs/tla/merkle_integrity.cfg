(*
 * TLC config para merkle_integrity.tla (PR lane -- small bounds).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh merkle_integrity
 *
 * Endereca INV-AC-MERKLE-VALID + INV-MULTIPART-MANIFEST-VALID
 * (invariant_registry sec 3.4 + sec 3.5, CRITICAL x 2).
 *
 * Bounds chosen so TLC finishes < 2 min on a 4-core dev laptop:
 *   - 2 envelopes -> one honest + one adversarial path concurrently.
 *   - 3 leaves -> 2^3 = 8 subsets per envelope, manageable.
 *   - MaxOps = 8.
 *)

SPECIFICATION Spec

CONSTANTS
    Envelopes = {e1, e2}
    Leaves    = {l1, l2, l3}
    MaxOps    = 8

INVARIANT
    InvAcceptedBindsRoot
    InvDecisionsDisjoint
    InvTamperedNotAccepted

CHECK_DEADLOCK FALSE
