(*
 * TLC config for gc_mark_started_at.tla (PR lane).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh gc_mark_started_at
 *
 * Closes INV-GC-MARK-STARTED-AT-ATOMIC + INV-GC-MARK-STARTED-AT-IMMUTABLE
 * (CRITICAL × 2 §3.6).
 * DEBT-005 batch 4.
 *
 * Tick is a VARIABLE enumerated by TLC at Init across [Workers -> Clocks]
 * (avoids FT-4 .cfg function-literal brittleness).
 *
 * Bounds (TLC < 30 s):
 *   - 2 runs, 2 workers, 2 clock tags
 *   - MaxOps = 6
 *)

SPECIFICATION Spec

CONSTANTS
    Runs    = {r1, r2}
    Workers = {w1, w2}
    Clocks  = {c1, c2}
    MaxOps  = 6

INVARIANT
    InvAtomicSingleWriter
    InvImmutablePostCapture
    InvNoRowsImpliesSet

CHECK_DEADLOCK FALSE
