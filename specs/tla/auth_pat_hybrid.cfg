(*
 * TLC config para auth_pat_hybrid.tla (PR lane -- small bounds).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh auth_pat_hybrid
 *
 * Endereca FT-1 (DEBT-014):
 *   INV-AUTH-PAT-HMAC-SIG-VERIFIED (CRITICAL),
 *   INV-AUTH-PAT-VERIFY-CONSTANT-TIME (HIGH),
 *   INV-AUTH-PAT-HASH-ARGON2ID-2024 (HIGH).
 *
 * Bounds chosen so TLC finishes < 1 min on a 4-core dev laptop:
 *   - 2 PAT IDs -- enough to exercise distinct-pat interleavings.
 *   - MaxOps = 6 -> adversary chooses <= 6 actions over 4 BOOLEAN dims
 *     per call -> state space a few thousand reachable states.
 *)

SPECIFICATION Spec

CONSTANTS
    Pats = {p1, p2}
    MaxOps = 6

INVARIANT
    InvHmacVerifiedBeforeAdmit
    InvNoArgonWithoutHmacAndRow
    InvNoDbHitWithoutHmac
    InvAcceptedRequiresArgon
    InvHybridOrderingChain

CHECK_DEADLOCK FALSE
