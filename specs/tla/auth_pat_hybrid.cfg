(*
 * TLC config para auth_pat_hybrid.tla (PR lane — small bounds).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh auth_pat_hybrid
 *
 * Endereça FT-1 (DEBT-014):
 *   INV-AUTH-PAT-HMAC-SIG-VERIFIED (CRITICAL),
 *   INV-AUTH-PAT-VERIFY-CONSTANT-TIME (HIGH),
 *   INV-AUTH-PAT-HASH-ARGON2ID-2024 (HIGH).
 *
 * Bounds:
 *   - 2 PAT IDs — enough to exercise distinct-pat interleavings.
 *   - MaxOps = 6 → adversary chooses ≤ 6 actions over 4 BOOLEAN dims.
 *
 * MEASURED 2026-08-02: 25,141 distinct states, ~7 s at -workers 2.
 * The previous claim here ("a few thousand reachable states", "< 1 min on a
 * 4-core laptop") was wrong by ~3 orders of magnitude and had never been
 * checked, because this suite had not run since it was written: `submissions`
 * was a sequence, so the real figure was sum(16^i, i=0..6) = 17,895,697 states
 * and 4 min 12 s at -workers 8 — over CI's per-spec budget. See the
 * `submissions` comment in the .tla for why a set is equivalent here.
 * Re-measure and update this block when the bounds change.
 *)

SPECIFICATION Spec

CONSTANTS
    Pats = {p1, p2}
    MaxOps = 6

INVARIANT
    InvHmacVerifiedBeforeAdmit
    InvNoArgonWithoutHmacAndRow
    InvNoDbHitWithoutHmac
    InvAcceptedRequiresArgon
    InvHybridOrderingChain

CHECK_DEADLOCK FALSE
