(*
 * TLC config para audit_immutability.tla
 *
 * Endereca T-02 do re-audit Lote 5: INV-AUDIT-APPEND-ONLY e CRITICAL;
 * exemption de TLA+ sem waiver viola CTRL-FORMAL-001. Este spec fecha
 * o gap.
 *
 * Model checking:
 *   cd specs/tla
 *   tlc -config audit_immutability.cfg audit_immutability.tla
 *)

SPECIFICATION Spec

CONSTANTS
    Actors = {a1}
    EventTypes = {write, revoke}
    MaxEvents = 3

INVARIANT
    InvAuditAppendOnly
    InvAuditChainIntact
    InvAuditOrderPreserved
    InvAuditRejectTamper
    InvDefenseInDepth

CHECK_DEADLOCK FALSE
