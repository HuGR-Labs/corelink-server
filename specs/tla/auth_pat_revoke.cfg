(*
 * TLC config para auth_pat_revoke.tla (PR lane -- small bounds).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh auth_pat_revoke
 *
 * Endereca INV-PAT-REVOKE-PROPAGATION (CRITICAL sec 3.28) -- Wave-24 R-PREP.
 * Sibling of:
 *   - auth_pat_hybrid.cfg (mint-path HMAC/Argon2id ordering)
 *   - auth_revocation.cfg (queue at-least-once + mass-revoke)
 *
 * Bounds chosen so TLC finishes < 1 s on a 4-core dev laptop:
 *   - 2 PAT IDs        -- enough to exercise distinct-pat interleavings.
 *   - 2 regions        -- multi-region propagation race surface.
 *   - MaxOps = 5       -- bounds caller-driven actions (DeleteHandler +
 *                        VerifyAttempt). PropagateToRegion is an internal
 *                        system action NOT counted against MaxOps so the
 *                        liveness property can drain; its own guard
 *                        (region_cache[r,p] = 0) bounds it to
 *                        |Pats| * |Regions| = 4 firings max.
 * Larger sweep documented in auth_pat_revoke_nightly.cfg.
 *)

SPECIFICATION Spec

CONSTANTS
    Pats = {p1, p2}
    Regions = {iad, fra}
    MaxOps = 5

\* Expected reachable state-space: ~1 263 distinct states, depth 10,
\* 3 s wall clock with TLC v1.8.0 -workers 2. Comfortable sub-1-min budget.
INVARIANT
    InvRevokedTokenNeverValidates
    InvRevokeAuditAtomic
    InvRevokeIsIdempotent
    InvRegionImpliesSoTRevoked
    InvRevokeIsMonotonic

PROPERTY
    InvRevokeAtLeastOncePropagation

CHECK_DEADLOCK FALSE
