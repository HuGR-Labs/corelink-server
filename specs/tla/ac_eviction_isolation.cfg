(*
 * TLC config for ac_eviction_isolation.tla (PR lane).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh ac_eviction_isolation
 *
 * Closes INV-AC-EVICT-REGION-PINNED + INV-AC-EVICT-TENANT-SCOPED
 * (CRITICAL x 2 sec 3.15). DEBT-005 batch 2.
 *
 * Bounds (TLC < 2 min):
 *   - 2 rows
 *   - 2 tenants, 2 regions
 *   - MaxOps = 10
 *
 * Note: TLC enumerates Init for `row_tenant`/`row_region` (function
 * spaces of size |Tenants|^|Rows| * |Regions|^|Rows| = 4*4 = 16 init
 * states) so it explores every tenantxregion tagging.
 *)

SPECIFICATION Spec

CONSTANTS
    Rows    = {r1, r2}
    Tenants = {tA, tB}
    Regions = {iad, fra}
    MaxOps  = 10

INVARIANT
    InvDeletesRegionScoped
    InvDeletesTenantScoped
    InvOnlyExpiredDeleted
    InvDeadStaysDead

CHECK_DEADLOCK FALSE
