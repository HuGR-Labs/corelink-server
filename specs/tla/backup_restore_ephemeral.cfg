(*
 * TLC config for backup_restore_ephemeral.tla (PR lane — small bounds).
 *
 * Run:
 *   bash scripts/run_tlc_corelink.sh backup_restore_ephemeral
 *
 * Closes INV-BACKUP-RESTORE-EPHEMERAL (CRITICAL §3.20). DEBT-005 batch 2.
 *
 * Bounds chosen so TLC finishes < 1 min on a 4-core dev laptop:
 *   - 2 restore ops
 *   - 1 prod namespace + 2 ephemeral namespaces
 *   - MaxOps = 10
 *)

SPECIFICATION Spec

CONSTANTS
    RestoreOps          = {o1, o2}
    ProdNamespaces      = {prod_iad}
    EphemeralNamespaces = {eph1, eph2}
    MaxOps              = 10

INVARIANT
    InvRunningIsEphemeral
    InvNoProdRestore
    InvRejectedHasNoNamespace
    InvTornDownPreservesTag

PROPERTY
    EphemeralEventuallyTornDown

CHECK_DEADLOCK FALSE
