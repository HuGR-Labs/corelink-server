# cargo-deny policy — CoreLink supply-chain gate (WI-S01-007 §6.1.3 + ADR-0014).
#
# Enforced by `.github/workflows/cas_foundation.yml::cargo-deny` on every PR
# that touches Rust code or workspace manifests. Fail-closed: ANY finding in
# advisories / bans / sources / licenses fails the gate; HIGH_RISK lane has
# zero "warning-only" tolerance.
#
# Re-classification (e.g. accepting a new license, allowlisting a yanked
# crate by ADR waiver) requires:
#   1. ADR documenting the decision
#   2. Bump of this file with the ADR ID in the comment
#   3. Security review sign-off
#
# Format ref: https://embarkstudios.github.io/cargo-deny/checks/
# Schema version 2 (cargo-deny 0.14+).

[graph]
# All targets shipped by CoreLink workspace. Workers WASM target is the
# production runtime; x86_64-unknown-linux-gnu covers the dev/test host.
targets = [
    { triple = "wasm32-unknown-unknown" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories — RUSTSEC + dependency CVE policy.
# ---------------------------------------------------------------------------
# Fail-closed: vulnerability/unmaintained/unsound/yanked all DENY.
# `notice` is the only "info" lane; bumped to deny so nothing slips silently.
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "deny"
# R1-9 emergency dep update: `rsa` Marvin timing sidechannel
# (RUSTSEC-2023-0071) has NO upstream fix as of 2026-05-14. The CoreLink
# usage is **signing-only** on operator-controlled inputs (RS256 receipt
# generation in corelink-clerk / corelink-worker / corelink-dpa-acceptance);
# none of the Marvin chosen-ciphertext oracle preconditions hold. Mitigated
# via quarterly RS256 key rotation + signing-latency P99±3σ alerting +
# per-tenant signing-process isolation. Full decision matrix +
# auto-promotion triggers in ADR-S20-RSA-MARVIN-MITIGATION.
ignore = [
    "RUSTSEC-2023-0071",
    # 2026-05-27 Wave 36 close-out — rustls-pemfile RUSTSEC-2025-0134
    # (unmaintained). Reached only via `bollard 0.17 → testcontainers 0.21
    # → testcontainers-modules 0.9` which is a `[dev-dependencies]` of
    # `corelink-audit-chain` (test-only). Zero production exposure. Re-evaluate
    # when bollard cuts a release dropping rustls-pemfile or when testcontainers
    # migrates to rustls-pki-types directly. Mitigation: PEM parsing only
    # happens at test-container boot, never against external input in prod.
    "RUSTSEC-2025-0134",
    # 2026-06-02 — number_prefix 0.4.0 RUSTSEC-2025-0119 (unmaintained-ONLY;
    # no vuln, no CVE). Reached solely via `indicatif 0.17.11 → corelink-cli`
    # (the dev/ops CLI progress bars in tools/cli). Upstream advisory states
    # "No safe upgrade is available!" — number_prefix has no maintained
    # replacement wired into indicatif yet (indicatif must migrate to
    # `unit-prefix` first). Zero production/runtime exposure: corelink-cli is
    # an operator tool, not shipped in the CF Workers runtime. Re-evaluate
    # when indicatif cuts a release dropping number_prefix (track an indicatif
    # bump that switches to unit-prefix), then remove this ignore.
    "RUSTSEC-2025-0119",
    # 2026-06-11 — pyo3 0.24.2 RUSTSEC-2026-0176 (out-of-bounds read in
    # `nth`/`nth_back` for `PyList`/`PyTuple` iterators). Reached SOLELY via
    # `corelink-py` (the Python SDK bindings crate) — pyo3 is a Python-extension
    # dependency and is NOT shipped in the CoreLink Cloudflare runtime (the
    # Workers run on V8 isolates + a native Rust container; no Python interpreter
    # / pyo3 is ever loaded in the product attack surface). The OOB read requires
    # adversarial `nth`/`nth_back` iteration over a `PyList`/`PyTuple`; the SDK's
    # controlled bindings do not expose untrusted-controlled iterator skipping.
    # No semver-compatible fix in the 0.24 line as of 2026-06-11 (`cargo update -p
    # pyo3` is a no-op; the fix lands in pyo3 0.25+, a major bump for the Python
    # SDK). Re-evaluate: bump `corelink-py` to pyo3 >= 0.25 (a separate Python-SDK
    # change), then remove this ignore.
    "RUSTSEC-2026-0176",
]
# CVSS threshold not applied: HIGH_RISK lane treats EVERY advisory as
# blocking until explicitly waived via ADR.

# ---------------------------------------------------------------------------
# Licenses — allowlist (CTRL-SUPPLY-005 + INV-SUPPLY-LICENSE-ALLOWLIST).
# ---------------------------------------------------------------------------
# Allow only permissive + weak-copyleft (MPL-2.0 file-level only). GPL/AGPL/
# SSPL/Commons-Clause are anti-pattern for a hosted service shipping
# closed-source CF Workers code.
[licenses]
version = 2
unused-allowed-license = "allow"  # crates with no license info reported by exceptions
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    # BSL-1.0 — Boost Software License 1.0. Strictly less restrictive than
    # Apache-2.0 in compiled form (no NOTICE file requirement, no patent
    # retaliation clause). Ratified by ADR-S32-001 (2026-05-27) to clear
    # ryu + ryu-js (dual Apache-2.0 OR BSL-1.0) and future small
    # algorithmic Rust ports that adopt this dual-license pattern.
    "BSL-1.0",
    # CDLA-Permissive-2.0 — Community Data License Agreement (Permissive).
    # Functionally equivalent to MIT/Apache for software use (permissive, no
    # copyleft, no patent traps). Added 2026-05-14 (R1-9 emergency dep
    # update) to admit `webpki-roots` 1.0+ which the rustls/AWS-SDK stack
    # now pulls transitively. Canonical fix used by every rustls consumer
    # since webpki-roots was relicensed for data-distribution clarity.
    # See AUDIT-R1-8-DEPENDENCY-SECURITY §3.2 and ADR-S20-RSA-MARVIN-MITIGATION
    # for the broader R1-9 supply-chain decision record.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
# Workspace's own crates carry `license = "UNLICENSED"` (closed-source per
# Cargo.toml workspace.package; CoreLink is a hosted service, not a
# library). cargo-deny treats UNLICENSED as parse-error; allow it ONLY for
# our own workspace member crates via private-crate registry exception.
exceptions = []

# `private` blocks individual crates from license enforcement when they're
# `publish = false` workspace members. This is the cargo-deny canonical
# way to handle a closed-source workspace (see cargo-deny issue #321).
[licenses.private]
ignore = true
registries = []

# ---------------------------------------------------------------------------
# Bans — explicit deny list + duplicate-version policy.
# ---------------------------------------------------------------------------
[bans]
# `multiple-versions = "deny"` would be the strictest setting, but transitive
# deps inside the tonic/axum/hyper stack legitimately pull two `tower`
# majors (0.4 from tonic 0.12, 0.5 from axum 0.7). Until tonic 0.13 lands,
# enumerate the known dupes in `skip` so the gate still catches *new*
# duplicates while not flagging the pinned, audited pair.
multiple-versions = "deny"
wildcards = "deny"           # all external version specifiers must be pinned (>= or =)
# Workspace member crates use `{ workspace = true }` which cargo-deny
# reports as wildcard. Allow this private-workspace pattern; external
# wildcards (e.g. `serde = "*"`) still fail.
allow-wildcard-paths = true
highlight = "all"
allow = []
deny = [
    # Anti-pattern crates banned org-wide.
    { crate = "openssl", reason = "use rustls (WASM-friendly + no system OpenSSL link)" },
    { crate = "openssl-sys", reason = "transitive ban; rustls only" },
    # ---------------------------------------------------------------
    # Wave-36 Stage 3 — adapter HTTPS crates lockdown.
    # ---------------------------------------------------------------
    # Per `specs/_audits/sealed/2026-05-26-wave-33-34-closure-followups.md` §3
    # follow-up #1 closure path (c) and `specs/_audits/2026-05-26-w36-
    # stage2c-closure.md` §8 step 3 (final Stage 2.C closure step). The
    # 4 absorbed adapter HTTPS crates (`corelink-stripe-real`,
    # `corelink-statuspage-real`, `corelink-slack-real`,
    # `corelink-clerk-cf`) are now CANONICAL implementations re-exported
    # via the Wave-33 umbrella façades; new direct workspace consumers
    # must import through the umbrella (`corelink-billing::stripe`,
    # `corelink-ops::{statuspage,slack}`, `corelink-auth::clerk_cf`,
    # `corelink-adapters-cloud::{stripe,statuspage,slack,clerk}`) rather
    # than the absorbed crates directly. The `wrappers` allowlist
    # enumerates the existing direct importers grandfathered as legal:
    # (1) the Wave-33 umbrella façades themselves (canonical re-export
    # shims), (2) historical pre-Wave-33 importers preserved per the
    # incremental migration strategy, and (3) workspace e2e test crates
    # which legitimately exercise concrete HTTPS clients.
    #
    # Pre-recon source: AUDIT-2026-05-27-W36-STAGE-3-SEAL §2-3.
    # Charter ADR-S12-045 (cargo-audit / cargo-deny / dependabot policy)
    # extended; INV-AUDIT preserved (build-time policy only, no runtime
    # impact).
    { crate = "corelink-stripe-real", wrappers = [
        "corelink-adapters-cloud",                   # Wave-33 Stream C re-export façade
        "corelink-billing",                          # Wave-33 Stream A umbrella (billing/stripe.rs)
        "corelink-billing-stripe-materializer",      # src migrated to traits crate (Trigger A); dep retained for tests/materializers_e2e.rs concrete fakes (FixedClock, RecordingSliRecorder, WebhookDispatcher)
        "corelink-server",                           # crate at crates/corelink-container/ (package name = corelink-server); legacy pre-W36 Stage 2.C dep; src migrated to umbrella (doc-comment refs only); dangling Cargo.toml dep retained pending separate cleanup
        "e2e-signup-flow",                           # workspace e2e — STRIPE_SECRET_KEY_TEST-gated #[ignore] variant drives real HTTPS Stripe Checkout via StripeRealClient::from_env
    ], reason = "Wave-36 Stage 3 lockdown: use corelink-billing::stripe or corelink-adapters-cloud::stripe umbrella" },
    { crate = "corelink-statuspage-real", wrappers = [
        "corelink-adapters-cloud",                   # Wave-33 Stream C re-export façade
        "corelink-ops",                              # Wave-33 Stream B umbrella (ops/statuspage.rs)
        "corelink-dsr-statuspage-scheduler",         # cfg(target_arch = "wasm32") fallback path in scheduler.rs (Trigger B: native uses corelink-ops; wasm32 falls back direct because ops pulls tokio/mio which wasm32 cannot build)
        "corelink-clerk-cf",                         # wasm32-only CF Worker cron entry point (dsr_statuspage_cron.rs uses bridge_to_report + StatuspageWasm32Client + InMemoryStatuspageAuditSink)
    ], reason = "Wave-36 Stage 3 lockdown: use corelink-ops::statuspage or corelink-adapters-cloud::statuspage umbrella" },
    { crate = "corelink-slack-real", wrappers = [
        "corelink-adapters-cloud",                   # Wave-33 Stream C re-export façade
        "corelink-ops",                              # Wave-33 Stream B umbrella (ops/slack.rs)
    ], reason = "Wave-36 Stage 3 lockdown: use corelink-ops::slack or corelink-adapters-cloud::slack umbrella" },
    { crate = "corelink-clerk-cf", wrappers = [
        "corelink-adapters-cloud",                   # Wave-33 Stream C re-export façade
        "corelink-auth",                             # Wave-33 Stream B umbrella (auth/clerk_cf.rs)
    ], reason = "Wave-36 Stage 3 lockdown: use corelink-auth::clerk_cf or corelink-adapters-cloud::clerk umbrella" },
]
# Known transitive dupes from upstream — re-evaluate on every tonic/axum/
# RustCrypto/sigstore bump. Each entry is the OLDER duplicate; the newer
# version is preferred. Removing an entry should be done concurrently with
# the upstream bump that resolves it.
skip = [
    # tonic 0.12 still depends on tower 0.4; axum 0.7 + corelink-reapi pull
    # tower 0.5. Resolves on tonic 0.13 (currently RC).
    { crate = "tower@0.4.13", reason = "transitive via tonic 0.12; resolves on tonic 0.13" },
    # RustCrypto upgraded the digest/block-buffer/cpufeatures/crypto-common
    # quartet from 0.10/0.10/0.2/0.1 to 0.11/0.10/0.3/0.2; older line still
    # pinned via tonic + tracing dep tree.
    { crate = "block-buffer@0.10.4", reason = "transitive via tonic stack; RustCrypto 0.11 migration in flight" },
    { crate = "cpufeatures@0.2.17", reason = "transitive via sha2 0.10; resolves with sha2 0.11" },
    { crate = "crypto-common@0.1.7", reason = "transitive via digest 0.10" },
    { crate = "digest@0.10.7", reason = "transitive via tonic stack" },
    # rand 0.9 ships getrandom 0.3; older crates still ship 0.2.
    { crate = "getrandom@0.2.17", reason = "transitive via uuid v7" },
    { crate = "getrandom@0.4.2", reason = "transitive via newer dev-dep" },
    # hashbrown/indexmap 0.12/1.x lingering via prost-build / older async stack.
    { crate = "hashbrown@0.12.3", reason = "transitive via prost-build / older async stack" },
    { crate = "indexmap@1.9.3", reason = "transitive via prost-build" },
    # socket2 0.5 + 0.6 from tokio + newer hyper-util.
    { crate = "socket2@0.5.10", reason = "transitive via tokio 1.40 stack; resolves with tokio 1.42+" },
    # ----- 2026-05-27 Wave 36 close-out batch (post tag wave-36-final-sealed) -----
    # Pre-existing transitive dupes inherited from upstream crates that
    # ship overlapping major lines. Each older version is the OLDER duplicate;
    # the newer line is preferred. Re-evaluate when upstream resolves.
    { crate = "const-oid@0.9.6", reason = "transitive via RustCrypto 0.10 line (0.10.2 newer via spki/der 0.7); resolves with RustCrypto 0.11 migration" },
    { crate = "fallible-iterator@0.2.0", reason = "transitive via tokio-postgres / postgres-types (0.3.0 newer); resolves with postgres ecosystem bump" },
    { crate = "hashbrown@0.14.5", reason = "transitive via newer async stack (0.17.1 from latest indexmap); resolves with indexmap 2.x catchup" },
    { crate = "hmac@0.12.1", reason = "transitive via RustCrypto 0.12 (0.13 newer via signature-2); resolves with RustCrypto 0.11/0.13 migration" },
    { crate = "http@0.2.12", reason = "transitive via tonic 0.12 + reqwest old line (1.4.1 newer via axum 0.7 / hyper 1.x); resolves with tonic 0.13" },
    { crate = "http-body@0.4.6", reason = "transitive via tonic 0.12 (1.0.1 newer via hyper 1.x); resolves with tonic 0.13" },
    { crate = "rand@0.8.6", reason = "transitive via older RustCrypto stack (0.9.4/0.10.1 newer); resolves with RustCrypto 0.11 migration" },
    { crate = "rand@0.9.4", reason = "transitive via mid-tier deps (0.10.1 newest); transient until ecosystem stabilizes on 0.10" },
    { crate = "rand_chacha@0.3.1", reason = "transitive via older rand 0.8 (0.9.0 newer); resolves with rand 0.10 catchup" },
    { crate = "rand_core@0.6.4", reason = "transitive via older rand 0.8 (0.9.5/0.10.1 newer); resolves with RustCrypto 0.11 migration" },
    { crate = "rand_core@0.9.5", reason = "transitive via rand 0.9 (0.10.1 newest); transient until ecosystem stabilizes on 0.10" },
    { crate = "sha2@0.10.9", reason = "transitive via RustCrypto 0.10 line (0.11.0 newer); resolves with RustCrypto 0.11 migration" },
    { crate = "wasm-streams@0.4.2", reason = "transitive via older wasm-bindgen-futures (0.5.0 newer); resolves with wasm-bindgen ecosystem bump" },
    { crate = "webpki-roots@0.26.11", reason = "transitive via rustls 0.23 stack (1.0.7 newer via rustls 0.24+); resolves with rustls major bump" },
    # ----- 2026-05-28 WP-S1 Phase 1 — aws-sdk-s3 v1 transitive dupes -----
    # aws-sdk-s3 v1.133.0 pulls lru 0.16.4 (workspace was already on
    # lru 0.18.0 from corelink-byok), which in turn pulls hashbrown 0.16.1
    # (workspace prefers 0.17.1). Both older versions are the OLDER duplicate.
    # sha1 0.11.0 (from aws-sdk-s3 checksum helpers) conflicts with sha1 0.10.6
    # (from aws-config; resolved once aws-config 2.x lands).
    # spin 0.10.0 (from crc-fast via aws-smithy-checksums) conflicts with
    # spin 0.9.8 (from lazy_static; resolved with lazy_static 2.x / OnceLock).
    { crate = "hashbrown@0.16.1", reason = "transitive via aws-sdk-s3→lru 0.16 (0.17.1 newer via workspace); resolves when aws-sdk-s3 bumps lru to 0.18" },
    { crate = "lru@0.16.4", reason = "transitive via aws-sdk-s3 v1.133 (0.18.0 newer in workspace via corelink-byok); resolves with aws-sdk-s3 v1 lru bump" },
    { crate = "sha1@0.10.6", reason = "transitive via aws-config v1 (0.11.0 newer via aws-sdk-s3 checksums); resolves with aws-config v2" },
    { crate = "spin@0.9.8", reason = "transitive via lazy_static (0.10.0 newer via crc-fast→aws-smithy-checksums); resolves with lazy_static 2.x / std OnceLock migration" },
]
skip-tree = []

# ---------------------------------------------------------------------------
# Sources — only crates.io + the sigstore/cyclonedx GitHub orgs (if pinned).
# ---------------------------------------------------------------------------
# Git deps must be SHA-pinned; non-pinned git refs blocked.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
