# cargo-mutants configuration.
#
# `exclude_globs` removes whole paths from mutation testing. Mutation testing
# only has signal where in-CI tests can KILL a mutant; a crate with no in-CI
# tests produces only "surviving" mutants — noise, not a blind spot.
#
# tests/e2e-user-journeys is a BLACK-BOX integration harness: a binary that
# drives real journeys against a LIVE deployment (prod) using provisioned PATs.
# Its assertions run via `provision-and-run-suite.sh`, never as `cargo test` in
# CI, so cargo-mutants can never kill a mutant in its journey/harness logic —
# every changed line surfaces as a false "surviving mutant". (The nightly
# full-sweep already scopes to product crates via `--package`, so this crate was
# always outside real mutation scope; only the per-diff PR gate caught it by
# accident on every e2e-suite PR.) Excluding it makes the per-diff gate correct:
# mutation testing stays focused on product crates whose tests run in CI.
#
# corelink-byok provider modules (byok_aws/gcp/azure/vault) are gated behind the
# non-default cargo features `_internal-aws`/`-gcp`/`-azure`/`-vault` (see
# `lib.rs` `#[cfg(feature = "_internal-aws")] mod byok_aws;`). Their unit tests
# (e.g. `read_env_fallback`, `with_fips`) only COMPILE + RUN under those features
# — verified green via `cargo test -p corelink-byok --features _internal-aws`.
# But BOTH mutation lanes run DEFAULT features (the per-diff gate workspace-wide,
# the nightly `--package corelink-byok` with no `--features`), so the provider
# tests never run there and every changed provider line surfaces as a FALSE
# survivor (the per-diff gate only sees these mutants at all via incidental
# workspace feature-unification). The provider code is unit-tested in the
# crate-scoped + `_matrix-test` lanes; the DEFAULT-compiled crypto core
# (envelope/dek_cache/convergent/context/types) stays fully mutation-covered.
exclude_globs = [
    "tests/e2e-user-journeys/**",
    "crates/corelink-byok/src/byok_aws/**",
    "crates/corelink-byok/src/byok_gcp.rs",
    "crates/corelink-byok/src/byok_azure.rs",
    "crates/corelink-byok/src/byok_vault.rs",
]
