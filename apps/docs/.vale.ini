# Vale configuration for CoreLink public docs.
#
# WI-S18-001 establishes the Microsoft Writing Style Guide as the
# canonical tone reference for English content. PR review gates run
# `vale --no-exit` for warnings and `vale` for errors. Closing ship gate
# (WI-S18-005) tightens MinAlertLevel to "warning".
StylesPath = styles

MinAlertLevel = error

# Microsoft Writing Style Guide vendored for offline CI.
Packages = Microsoft

# Project terms (Bazel, REAPI, sccache, …) accepted by Vale.Spelling.
# Lives at styles/config/vocabularies/CoreLink/ (the Vale 3 layout —
# the old styles/Vocab/ location is silently ignored by Vale 3).
Vocab = CoreLink

[formats]
# Lint MDX with the Markdown parser: Vale's native MDX handling lints
# YAML frontmatter keys and SKIPS prose nested in JSX components
# (<Tabs> bodies etc.); the md parser does the opposite — skip
# frontmatter, lint the prose. BlockIgnores below cover import/export.
mdx = md

[*.{md,mdx}]
BasedOnStyles = Vale, Microsoft

# MDX components and code fences should not be linted as prose.
# NOTE: BlockIgnores is a comma-separated list, so patterns must not
# contain literal commas — `{3,4}` used to split mid-regex and made Vale
# exit 2 with E201 on every run (`\x60{3}\x60?` = 3-or-4 backticks).
BlockIgnores = (?s)^(\x60{3}\x60?)[^\n]*\n.+?\n\1$, \
              (?s)^import\s+.+?from\s+['"].+?['"];?$, \
              (?s)^export\s+default\s+.+?$

# Allow CoreLink-specific terminology.
Microsoft.Terms = NO
Microsoft.Vocab = NO
# The CoreLink vocabulary exists ONLY as Vale.Spelling exceptions. Vale.Terms
# would additionally enforce each accept.txt entry's casing as the "preferred"
# form ("Use 'ci' instead of 'CI'") — wrong for a list that deliberately
# carries both casings of the same term.
Vale.Terms = NO

# House-style overrides (error → warning): rules that contradict the
# repo's established voice would turn the gate into noise, not signal.
# Spaced em-dashes ( — ) ARE the house style across docs + marketing.
Microsoft.Dashes = warning
# House voice is deliberately formal; Microsoft mandates contractions.
Microsoft.Contractions = warning
# House vocabulary hyphenates auto-* compounds (auto-gen, auto-merge).
Microsoft.Auto = warning
