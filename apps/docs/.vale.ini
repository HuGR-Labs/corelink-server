# Vale configuration for CoreLink public docs.
#
# WI-S18-001 establishes the Microsoft Writing Style Guide as the
# canonical tone reference for English content. PR review gates run
# `vale --no-exit` for warnings and `vale` for errors. Closing ship gate
# (WI-S18-005) tightens MinAlertLevel to "warning".
StylesPath = styles

MinAlertLevel = error

# Microsoft Writing Style Guide vendored for offline CI.
Packages = Microsoft

[*.{md,mdx}]
BasedOnStyles = Vale, Microsoft

# MDX components and code fences should not be linted as prose.
BlockIgnores = (?s)^(`{3,4})[^\n]*\n.+?\n\1$, \
              (?s)^import\s+.+?from\s+['"].+?['"];?$, \
              (?s)^export\s+default\s+.+?$

# Allow CoreLink-specific terminology.
Microsoft.Terms = NO
Microsoft.Vocab = NO
