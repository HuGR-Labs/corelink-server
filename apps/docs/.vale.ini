# Vale tone consistency lint — WI-S18-005 deliverable 7.
#
# Spec contract S-18 §5.6 R-S18-15 + Quality Standard 14.s18.3. Microsoft
# style baseline + custom CoreLink rules (`styles/CoreLink/`).
#
# Locally:
#   vale --config=.vale.ini docs/ blog/
# CI: `.github/workflows/docs-vale.yml`.

StylesPath = styles
MinAlertLevel = warning

Packages = Microsoft

Vocab = CoreLink

[*.{md,mdx}]
BasedOnStyles = Vale, Microsoft, CoreLink

# Microsoft style has aggressive defaults; trim noise that conflicts with
# Diátaxis tutorial-style ("you" pronoun is encouraged in tutorials).
Microsoft.We = NO
Microsoft.FirstPerson = NO
Microsoft.Foreign = NO

# Code fences and front matter never linted.
TokenIgnores = (?s) *(`{3}.+?`{3})
BlockIgnores = (?s) *(<!--.*?-->), (?s) *(```.*?```)

[*.mdx]
# MDX uses JSX; ignore inline component props.
TokenIgnores = (?sm)<[A-Z][^>]*>.*?</[A-Z][^>]*>, (?s) *(`{3}.+?`{3})
