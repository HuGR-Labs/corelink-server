name = "corelink-signup-worker"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Security hardening (2026-05-28): NOT reachable at *.workers.dev. The other
# three workers (root, get-corelink, analytics) already set this; signup-worker
# was the lone gap — bot wildcard scans of *.workers.dev could otherwise find
# it. Customer traffic arrives ONLY via the proxied custom domain
# (corelink-signup.humangr.com) behind zone-level Bot Fight Mode.
# Lesson: a prior public *.workers.dev staging URL drew a $36 bot bill.
workers_dev = false

# Native retained Workers Logs (zero-cost; queryable in the CF dashboard).
# Not Logpush to an external sink (that needs an owner-provided destination).
[observability]
enabled = true
head_sampling_rate = 1

# Bindings below are placeholders — actual values are configured per
# environment via `wrangler secret put` and Pages dashboard.
#
# Secrets (bind via `wrangler secret put`):
#   CLERK_WEBHOOK_SECRET         — svix signing key from Clerk dashboard.
#   CLERK_SECRET_KEY             — Clerk Backend API secret key (sk_test_... or sk_live_...).
#                                  Writes tenant_id + region to Clerk PUBLIC metadata
#                                  (session claim) and the one-time pat_plaintext to
#                                  PRIVATE metadata (backend-only) for the /welcome reveal.
#                                  Also used by the hourly PAT-scrub cron (CTRL-CRED-001)
#                                  to clear stale private_metadata.pat_plaintext.
#   CORELINK_INTERNAL_AUTH_KEY   — shared secret for X-Corelink-Internal-Auth header.
#                                  Must match the container + main worker binding.
#                                  Used to call /_internal/pat/mint on the container.
#   CORELINK_ERASE_AUTH_KEY      — OPTIONAL dedicated erase/DSR consumer secret
#                                  (red-team #3 split). When the full-split config
#                                  provisions this on the container + main worker,
#                                  it MUST also be bound here so the DSR erase/verify
#                                  calls authenticate (rt-nuclear #23). Unset ⇒ the
#                                  DSR path falls back to CORELINK_INTERNAL_AUTH_KEY.
#
# D1 bindings:
#   CONFIG_DB  — corelink-prod-d1 (tenant, pat, tenant_billing tables).
#   BILLING_DB — alias to same corelink-prod-d1; required by stripe.ts webhook handler.
#
# Vars (non-secret, set in [vars]):
#   CORELINK_API_BASE — base URL of the CoreLink API (container host).

# D1 bindings: same physical database (corelink-prod-d1, id d64742ea-...)
# bound under two names. CONFIG_DB carries tenant + pat tables (read by the
# main worker + written by signup-worker chain). BILLING_DB alias is required
# by apps/signup-worker/src/webhooks/stripe.ts which writes the
# tenant_billing table; without the alias the stripe webhook silently no-ops.
[[d1_databases]]
binding = "CONFIG_DB"
database_name = "corelink-prod-d1"
database_id = "d64742ea-e102-40b2-a844-ff02e3f94562"

[[d1_databases]]
binding = "BILLING_DB"
database_name = "corelink-prod-d1"
database_id = "d64742ea-e102-40b2-a844-ff02e3f94562"

# [[d1_databases]]
# binding = "ANALYTICS_DB"
# database_name = "corelink-analytics"
# database_id = "<assigned-by-agent-G>"

# Route binding — signup-worker owns this hostname exclusively.
# The main corelink worker (wrangler.toml at root) had this route but does not
# implement /webhooks/clerk or /webhooks/stripe; moved here 2026-05-29 (Phase A4).
[[routes]]
pattern = "corelink-signup.humangr.com/*"
zone_name = "humangr.com"

[vars]
CORELINK_API_BASE = "https://corelink-api.humangr.com"
# Deployment environment. Load-bearing for fail-CLOSED behavior in
# deriveErasureSalt (clerk.ts): when ERASURE_SALT_KEY is absent and ENVIRONMENT
# starts with "prod", salt derivation THROWS rather than falling back to a
# predictable non-secret SHA-256 that would break GDPR/LGPD pseudonymization
# unlinkability. This worker is the prod signup deployment, so it MUST be "prod".
ENVIRONMENT = "prod"

# Service binding to the main CoreLink Worker. Required: a public custom-domain
# fetch (`https://corelink-api.humangr.com`) from one Worker to another on the
# same zone is rejected by Cloudflare's edge with error 1014 (CNAME Cross-User
# Banned) even when both Workers belong to the same account. The service
# binding routes the request inside Cloudflare's runtime, bypassing the public
# edge and the 1014 check. Used by `webhooks/clerk.ts` for `/_internal/pat/mint`.
[[services]]
binding = "CORELINK_API_SVC"
service = "corelink-prod"

# ── DSR erasure queue (WI-S11-008) ───────────────────────────────────────────
# The Clerk `user.deleted` webhook PRODUCES `dsr.queued.v1` messages onto
# DSR_QUEUE (src/webhooks/clerk.ts::handleUserDeleted); this same worker CONSUMES
# them (src/index.ts `queue` → src/webhooks/dsr_consumer.ts) and forwards each to
# the container's `/_internal/dsr/erase` endpoint (internal-auth gated). The
# erasure orchestrator dedups per (dsr_id, backend), so redelivery is safe;
# poison messages land in the dead-letter queue after max_retries.
#
# Infra (one-time, operator — task #46 adjacent):
#   worker/node_modules/.bin/wrangler queues create corelink-dsr-erasure
#   worker/node_modules/.bin/wrangler queues create corelink-dsr-erasure-dlq
# New secret (operator): wrangler secret put ERASURE_SALT_KEY  (per-DSR salt HMAC)
[[queues.producers]]
binding = "DSR_QUEUE"
queue = "corelink-dsr-erasure"

[[queues.consumers]]
queue = "corelink-dsr-erasure"
max_batch_size = 10
max_batch_timeout = 30
# Erasure is a legal obligation — retry generously before dead-lettering for
# manual review rather than dropping a right-to-erasure request.
max_retries = 10
dead_letter_queue = "corelink-dsr-erasure-dlq"

# Hourly Cron Trigger → src/index.ts `scheduled()`. Drives TWO sweeps:
#   1. DSR 24h verification sweep (WI-S11-008 incr 5) → runDsrVerifySweep →
#      container POST /_internal/dsr/verify for every DSR past its 24h SLA
#      deadline (idempotent; inert until CORELINK_INTERNAL_AUTH_KEY bound — #46).
#   2. PAT-plaintext scrub (CTRL-CRED-001) → runPatScrubSweep → Clerk Backend
#      API PATCH clearing private_metadata.pat_plaintext for any user whose
#      reveal is older than the TTL (inert until CLERK_SECRET_KEY bound).
[triggers]
crons = ["0 * * * *"]
