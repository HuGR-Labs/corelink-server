[package]
name = "corelink-server"
description = "HuGR CoreLink — shared content-addressable cache server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[features]
# Default: native gRPC server uses `InMemoryR2` as the CAS backend for
# host-side integration tests + local dev.
default = []

# Wire the production AWS KMS provider (`corelink_byok_aws::AwsKmsRealProvider`)
# instead of the in-memory fake. Off by default — enable in production
# deployments where customer CMKs live in AWS KMS. The BYOK orchestrator
# (`apps/server/src/byok_orchestrator.rs`) dispatches the trait-object
# construction based on which (single) `byok-*-real` flag is set.
#
# Pattern reference (replicated for GCP/Azure/Vault):
# `specs/_audits/2026-05-15-byok-real-provider-pattern.md` §7.
byok-aws-real = ["dep:corelink-byok-aws"]

# Wire the production GCP Cloud KMS provider
# (`corelink_byok_gcp::GcpKmsRealProvider`) instead of the in-memory fake.
# Off by default — enable in production deployments where customer CMKs
# live in Google Cloud KMS. Mirrors `byok-aws-real`. The
# `corelink-byok-gcp/production` sub-feature pulls in `reqwest` + ADC
# (jsonwebtoken + base64 + regex) on native targets; on wasm32 the
# `GcpKmsWasmStub` is linked and every method surfaces an explicit
# "unsupported on wasm32" error (Workers proxy to the native server).
#
# Pattern reference: `specs/_audits/2026-05-15-byok-real-provider-pattern.md`.
byok-gcp-real = ["dep:corelink-byok-gcp", "corelink-byok-gcp/production"]

# Wire the production Azure Key Vault provider
# (`corelink_byok_azure::AzureKeyVaultRealProvider`) instead of the
# in-memory fake. Off by default — enable in production deployments where
# customer CMKs live in Azure Key Vault Premium HSM / Managed HSM.
#
# Pattern reference: `specs/_audits/2026-05-15-byok-real-provider-pattern.md`.
byok-azure-real = ["dep:corelink-byok-azure", "corelink-byok-azure/real"]

# Wire the production HashiCorp Vault Transit provider
# (`corelink_byok_vault::VaultRealProvider`) instead of the in-memory fake.
# Off by default — enable in production deployments where customer CMKs
# live in a customer-hosted Vault Enterprise (FIPS-mode) cluster.
#
# Pattern reference: `specs/_audits/2026-05-15-byok-real-provider-pattern.md`.
byok-vault-real = ["dep:corelink-byok-vault", "corelink-byok-vault/real"]

# R-PREP-CF-R2-REAL — opt into the real Cloudflare R2 binding adapter
# (`corelink_cf_bindings::CfR2BucketReal`). On `target_arch = "wasm32"`
# this swaps in the production binding; on native it links the
# `CfR2BucketReal::stub_for_native_tests` stub, which fails CLOSED with
# `R2Error::Backend("WasmOnly: …")` if a code path attempts an R2
# operation. The flag is a **build-config witness** that the consumer
# expects the real binding to be wired by the CF Worker boot layer
# (`crates/corelink-clerk-cf`); native gRPC server behavior is
# unchanged when the flag is off.
#
# Cutover plan: enable on the CF Worker build (`wrangler deploy
# --features cf-r2-real`) once `corelink-clerk-cf` adopts the
# `CfR2BucketReal` adapter end-to-end. The native server binary may
# enable the flag to assert at boot that R2 calls are routed to the
# (stub) adapter — this surfaces wiring mistakes immediately rather
# than at first R2 access in a staging Worker.
cf-r2-real = ["dep:corelink-cf-bindings"]

# Wave-18 follow-on: opt into the wasm32 production binders for the
# Stripe materializer (`corelink-billing-stripe-materializer`). On
# `target_arch = "wasm32"` this routes `BillingD1Writer` through
# `corelink-cf-bindings::CfD1DatabaseReal` and `BillingAuditEmitter`
# through `corelink-audit-chain::ArchiveProducer` (the wave-14 + wave-15
# canonical seams). On native targets the wrapper module compiles
# behind the same flag — `apps/server/main.rs` keeps the wave-17
# `InMemoryBillingD1` + `InMemoryBillingAuditEmitter` mirrors for the
# native gRPC server + axum HTTP shell (D1 is not reachable outside the
# CF Worker on native dev/CI anyway). Off by default; enable on the CF
# Worker build (`wrangler deploy --features cf-billing-real`).
#
# Pattern reference: see `specs/_audits/2026-05-15-stripe-webhook-production.md`
# §materializers.wasm32-binders.
cf-billing-real = ["corelink-billing-stripe-materializer/cf-billing-real"]

[dependencies]
# R-PREP-CF-R2-REAL — gated by the `cf-r2-real` feature (see [features]).
corelink-cf-bindings = { workspace = true, optional = true }
tonic = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# R2-12: Stripe webhook HTTP route + signature verify + idempotency
# Wave-15.3 adds the `query` feature so `apps/server/src/routes/audit_export.rs`
# can extract `?from=&to=&tenant=` via `axum::extract::Query`.
axum = { workspace = true, features = ["query"] }
tower = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
corelink-stripe-real = { workspace = true }
corelink-tier-selection = { workspace = true }
# Wave-17: production materializer + D1 idempotency + tier reconciliation
# (replaces the Recording* / InMemory* placeholders from wave 16).
corelink-billing-stripe-materializer = { workspace = true }

# R-prep: handler crates wired into apps/server::routes as the
# end-to-end SLO-instrumented handler surface (see audit
# `specs/_audits/2026-05-14-slo-instrumentation-gaps.md`). The CAS
# wire-up landed in wave 8; the AC + Admin wire-ups land in wave 11
# (this commit) — both follow the cas-read trait-object pattern with
# `Arc<dyn HandlerTrait>` to keep route shape stable across the
# native / wasm32 CF-Worker swap.
corelink-handler-cas = { workspace = true }
corelink-handler-ac = { workspace = true }
corelink-handler-admin = { workspace = true }

# Wave-15.3 — customer-facing `GET /v1/audit/export` route
# (WI-S09-008 wiring). The route ships in
# `apps/server/src/routes/audit_export.rs`; the trait-object surface
# (`Arc<dyn AuditExporter>` + `Arc<dyn RateLimiter>`) preserves the
# binary shape across the native / wasm32 CF-Worker swap.
corelink-audit-chain = { workspace = true }
corelink-ratelimit = { workspace = true }
subtle = { workspace = true }
uuid = { workspace = true }

# BYOK foundation crate (KmsProvider trait + InMemoryFake used by
# the orchestrator default path) — NOT optional: the orchestrator
# must compile in the default `cargo build -p corelink-server`
# configuration and return `Arc<dyn KmsProvider>` backed by a local
# in-memory fake when no `byok-*-real` flag is active.
# Pattern: `specs/_audits/2026-05-15-byok-real-provider-pattern.md` §7.
corelink-byok = { path = "../../crates/corelink-byok" }
# Optional BYOK adapter crates — only linked when the matching
# `byok-<provider>-real` feature is enabled. See features section
# above and `specs/_audits/2026-05-15-byok-real-provider-pattern.md`.
corelink-byok-aws = { path = "../../crates/corelink-byok-aws", optional = true }
corelink-byok-gcp = { path = "../../crates/corelink-byok-gcp", optional = true }
corelink-byok-azure = { path = "../../crates/corelink-byok-azure", optional = true }
corelink-byok-vault = { path = "../../crates/corelink-byok-vault", optional = true }
async-trait = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# Wave-15.3 — integration test fixtures for the `audit_export` route.
# `corelink-analytics` provides the canonical `Region` enum the
# `AuditEvent` constructor uses; `tower` brings the `ServiceExt`
# trait used to drive `axum::Router::oneshot` in async tests;
# `serde_json` parses the NDJSON envelope; `tokio` runs the async
# test functions; `axum` brings the `Request`/`Body` body shapes.
corelink-analytics = { workspace = true }
tower = { workspace = true, features = ["util"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }
