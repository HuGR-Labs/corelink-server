[package]
name = "corelink-server"
description = "HuGR CoreLink — shared content-addressable cache server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[features]
# Default: native gRPC server uses `InMemoryR2` as the CAS backend for
# host-side integration tests + local dev.
default = []

# Wire the production AWS KMS provider (`corelink_byok_aws::AwsKmsRealProvider`)
# instead of the in-memory fake. Off by default — enable in production
# deployments where customer CMKs live in AWS KMS. The flag is GA-prep
# scaffolding; the server BYOK orchestrator wiring lands incrementally.
#
# Pattern reference (replicated for GCP/Azure/Vault):
# `specs/_audits/2026-05-15-byok-real-provider-pattern.md`.
byok-aws-real = ["dep:corelink-byok", "dep:corelink-byok-aws"]

# Wire the production GCP Cloud KMS provider
# (`corelink_byok_gcp::GcpKmsRealProvider`) instead of the in-memory fake.
# Off by default — enable in production deployments where customer CMKs
# live in Google Cloud KMS. Mirrors `byok-aws-real`. The
# `corelink-byok-gcp/production` sub-feature pulls in `reqwest` + ADC
# (jsonwebtoken + base64 + regex) on native targets; on wasm32 the
# `GcpKmsWasmStub` is linked and every method surfaces an explicit
# "unsupported on wasm32" error (Workers proxy to the native server).
#
# Pattern reference: `specs/_audits/2026-05-15-byok-real-provider-pattern.md`.
byok-gcp-real = ["dep:corelink-byok", "dep:corelink-byok-gcp", "corelink-byok-gcp/production"]

# Wire the production Azure Key Vault provider
# (`corelink_byok_azure::AzureKeyVaultRealProvider`) instead of the
# in-memory fake. Off by default — enable in production deployments where
# customer CMKs live in Azure Key Vault Premium HSM / Managed HSM.
#
# Pattern reference: `specs/_audits/2026-05-15-byok-real-provider-pattern.md`.
byok-azure-real = ["dep:corelink-byok", "dep:corelink-byok-azure", "corelink-byok-azure/real"]

# Wire the production HashiCorp Vault Transit provider
# (`corelink_byok_vault::VaultRealProvider`) instead of the in-memory fake.
# Off by default — enable in production deployments where customer CMKs
# live in a customer-hosted Vault Enterprise (FIPS-mode) cluster.
#
# Pattern reference: `specs/_audits/2026-05-15-byok-real-provider-pattern.md`.
byok-vault-real = ["dep:corelink-byok", "dep:corelink-byok-vault", "corelink-byok-vault/real"]

# R-PREP-CF-R2-REAL — opt into the real Cloudflare R2 binding adapter
# (`corelink_cf_bindings::CfR2BucketReal`). On `target_arch = "wasm32"`
# this swaps in the production binding; on native it links the
# `CfR2BucketReal::stub_for_native_tests` stub, which fails CLOSED with
# `R2Error::Backend("WasmOnly: …")` if a code path attempts an R2
# operation. The flag is a **build-config witness** that the consumer
# expects the real binding to be wired by the CF Worker boot layer
# (`crates/corelink-clerk-cf`); native gRPC server behavior is
# unchanged when the flag is off.
#
# Cutover plan: enable on the CF Worker build (`wrangler deploy
# --features cf-r2-real`) once `corelink-clerk-cf` adopts the
# `CfR2BucketReal` adapter end-to-end. The native server binary may
# enable the flag to assert at boot that R2 calls are routed to the
# (stub) adapter — this surfaces wiring mistakes immediately rather
# than at first R2 access in a staging Worker.
cf-r2-real = ["dep:corelink-cf-bindings"]

[dependencies]
# R-PREP-CF-R2-REAL — gated by the `cf-r2-real` feature (see [features]).
corelink-cf-bindings = { workspace = true, optional = true }
tonic = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# R2-12: Stripe webhook HTTP route + signature verify + idempotency
axum = { workspace = true }
tower = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
corelink-stripe-real = { workspace = true }
corelink-tier-selection = { workspace = true }

# R-prep: handler crates wired into apps/server::routes as the
# end-to-end SLO-instrumented handler surface (see audit
# `specs/_audits/2026-05-14-slo-instrumentation-gaps.md`). The CAS
# wire-up landed in wave 8; the AC + Admin wire-ups land in wave 11
# (this commit) — both follow the cas-read trait-object pattern with
# `Arc<dyn HandlerTrait>` to keep route shape stable across the
# native / wasm32 CF-Worker swap.
corelink-handler-cas = { workspace = true }
corelink-handler-ac = { workspace = true }
corelink-handler-admin = { workspace = true }

# Optional BYOK dependencies — only linked when `byok-aws-real` or
# `byok-gcp-real` is enabled. See features section above and
# `specs/_audits/2026-05-15-byok-real-provider-pattern.md`.
corelink-byok = { path = "../../crates/corelink-byok", optional = true }
corelink-byok-aws = { path = "../../crates/corelink-byok-aws", optional = true }
corelink-byok-gcp = { path = "../../crates/corelink-byok-gcp", optional = true }
corelink-byok-azure = { path = "../../crates/corelink-byok-azure", optional = true }
corelink-byok-vault = { path = "../../crates/corelink-byok-vault", optional = true }

[dev-dependencies]
proptest = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }
