[package]
name = "corelink-server"
description = "HuGR CoreLink — shared content-addressable cache server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
tonic = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# R2-12: Stripe webhook HTTP route + signature verify + idempotency
axum = { workspace = true }
tower = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
corelink-stripe-real = { workspace = true }
corelink-tier-selection = { workspace = true }

# R-prep: handler crates wired into apps/server::routes as the
# end-to-end SLO-instrumented handler surface (see audit
# `specs/_audits/2026-05-14-slo-instrumentation-gaps.md`). The CAS
# wire-up landed in wave 8; the AC + Admin wire-ups land in wave 11
# (this commit) — both follow the cas-read trait-object pattern with
# `Arc<dyn HandlerTrait>` to keep route shape stable across the
# native / wasm32 CF-Worker swap.
corelink-handler-cas = { workspace = true }
corelink-handler-ac = { workspace = true }
corelink-handler-admin = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }
