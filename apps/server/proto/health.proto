syntax = "proto3";

package corelink.health.v1;

// Health check simples pra confirmar que o servidor tá up.
// Compatível com o padrão grpc.health.v1 pra integrar com load balancers.

service Health {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
}

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
  }
  ServingStatus status = 1;
}
