# Cloudflare Worker config for the CoreLink Admin UI.
#
# Project name: corelink-admin-ui  (HuGR-Labs org — the repos moved out of
#   `HumanGuardrail` on 2026-08-01; the old paths still resolve, but only through
#   GitHub's transfer redirect, so names are pinned to the live org rather than
#   left depending on it)
# Public entry point: humangr.com/corelink  (operator-managed zone route; see routes below)
#
# Build: pnpm cf:build  (opennextjs-cloudflare build)
# Deploy: wrangler deploy  (orchestrator-only -- do NOT run locally)
#
# Migrated from @cloudflare/next-on-pages (Pages) to @opennextjs/cloudflare (Worker)
# Reason: next-on-pages 1.13.7 cannot render Next 15 SSR with next-intl + middleware
#         + ClerkProvider -- every SSR page route returned HTTP 500.
#
# Secrets (set via `wrangler secret put <NAME>`):
#   CLERK_SECRET_KEY
#   STRIPE_SECRET_KEY
#   SENTRY_AUTH_TOKEN      (optional -- enables source-map upload at build time)
#
# ⚠️ THIS LIST IS NOT THE DEPLOYED STATE, AND READING IT AS SUCH COSTS TIME.
#   Cloudflare secrets are write-only: values never come back, but NAMES are
#   listable via `GET /accounts/<acct>/workers/scripts/corelink-admin-ui/secrets`.
#   As of 2026-08-02 the deployed Worker carries FIVE secrets, and two of them
#   appear nowhere in this file:
#
#     ADMIN_UI_PUBLIC_URL          CLERK_PUBLISHABLE_KEY     CLERK_SECRET_KEY
#     GITHUB_APP_SLUG              INSTALL_STATE_SIGNING_KEY
#
#   Both `GITHUB_APP_SLUG` and `INSTALL_STATE_SIGNING_KEY` are the config that
#   `/api/install/github` fails closed without. They have been bound the whole
#   time. The "Install GitHub App" button nevertheless returned
#   `runner_install_not_configured` (503) for every tenant, because the route
#   read its bindings via `globalThis.__env__` — the `next-on-pages` convention
#   this app migrated AWAY from — instead of `getCloudflareContext()`. Fixed
#   separately; see the activation-telemetry change, which fixes the same read
#   bug in `/api/welcome/stream`.
#
#   The lesson is the reason this comment exists: **absence from this file is
#   not evidence that a secret is unset.** That inference was made, believed,
#   and briefly written into a changelog entry as "left unbound" before the
#   deployed list was actually queried. Query it.
#
#   (`GITHUB_APP_SLUG` is worth a second note: it is a PUBLIC identifier — the
#   `<slug>` in `github.com/apps/<slug>/installations/new`, the URL this app
#   redirects the customer to. Storing a public string as a write-only secret is
#   why it looked missing. Moving it to `[vars]` is a defensible cleanup, but it
#   is deliberately NOT done here: a name cannot be both a var and a secret, so
#   the change requires deleting the deployed secret first, which is an operator
#   step and not worth the churn today.)
#
# Public (build-time) env vars -- set in CF Worker dashboard or via CI:
#   NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY  -- Clerk publishable key (pk_live_...)
#   NEXT_PUBLIC_CORELINK_API_URL       -- https://corelink-api.humangr.com
#   NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY -- Stripe publishable key (pk_live_...)
#   NEXT_PUBLIC_SENTRY_DSN             -- Sentry DSN (https://...@sentry.io/...)
#   CSP_ENFORCEMENT                    -- "enforce" (production default)

name = "corelink-admin-ui"
main = ".open-next/worker.js"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Custom domains — bind directly to the Worker. Previously owned by the
# `corelink-admin-ui` Pages project; detached via CF API on migration day
# (Pages project remains but no longer serves these domains).
#
# The PUBLIC app entry point is `humangr.com/corelink` (path-mounted, served
# via the `humangr.com/corelink/*` zone route — added by the operator at cutover,
# NOT a custom_domain, so it is intentionally NOT listed here). Both retired
# subdomains — `corelink-app.humangr.com` AND `corelink-admin.humangr.com` — had
# their custom_domain bindings removed here so the subdomains cease to serve the
# Worker. OPERATOR follow-up: unbind the `corelink-admin.humangr.com` custom
# domain in the CF Worker dashboard + remove its DNS record (the wrangler removal
# stops the Worker claiming it; the dashboard/DNS cleanup is manual).
# NOTE: the Clerk production Frontend API still lives at
# `clerk.corelink-app.humangr.com` (baked into the pk_live key) — that is a
# SEPARATE domain the operator migrates on the Clerk cutover; do not conflate it.
routes = []

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
