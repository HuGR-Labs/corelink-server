[package]
name = "migrate-single-to-multi-region"
description = "CoreLink data migration script: single-region → multi-region tenant migration (WI-S14-001 §6.1 ST-006..008). Supports --dry-run (default), --execute, and --rollback modes. Dry-run: report tenants to migrate (D1 row count + R2 blob count + estimated duration). Execute: per-tenant transactional [D1 row migration + R2 copy + verify hash] + audit emit. Rollback: Terraform state revert + D1 PITR restore signal + R2 backup restore signal. Idempotent re-run safe."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "migrate-single-to-multi-region"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[dependencies]
corelink-region = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v7", "serde"] }
tokio = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tokio-test = { workspace = true }
