[package]
name = "corelink-tenant-offboarding"
description = "CoreLink tenant-level offboarding state machine (R-prep). Complements the DSR individual-data-subject erasure surface (`corelink-dsr` / `corelink-privacy-erasure-worker`) with the canonical tenant-level lifecycle: ACTIVE → CANCEL_REQUESTED (T+0) → GRACE_PERIOD (T+1..T+30; export window) → READ_ONLY (T+30..T+45; restoration window cap) → SUSPENDED (T+45..T+90; admin-revoke only) → ERASED (T+90+; cryptographic erasure via BYOK CMK destroy + R2/D1/KV cleanup). 5 states + `#[non_exhaustive]` taxonomy; `TenantOffboardingOrchestrator` trait with state machine; `InMemoryFake` for tests; `TenantOffboardingStore` trait surface for D1 persistence; audit fail-CLOSED before every state mutation per ADR-S11-002 split-tier (regulatory-grade NEVER tolerates silent loss); 10+ unit + 2 property tests pinning state machine reachability + audit completeness. Production wiring to CF Worker route `POST /v1/tenant/{tenant_id}/offboard`, D1 `tenant_offboarding_state` mirror (migration 0046), daily cron time-based transitions, BYOK CMK destroy hook (via `corelink-byok-revocation`), and admin force-advance dry-run deferred to PRR ship gate per `trait-abstraction-defer` charter pattern."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[[test]]
name = "prop_tenant_offboarding"
path = "tests/prop_tenant_offboarding.rs"
