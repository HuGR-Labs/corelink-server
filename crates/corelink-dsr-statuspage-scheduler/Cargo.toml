[package]
name = "corelink-dsr-statuspage-scheduler"
description = "Wave-17 DSR Statuspage 24h publish scheduler — composes `corelink-privacy-erasure-worker::aggregate_24h_window` + `corelink-statuspage-real::bridge_to_report` + `StatuspageBackend::publish_dsr_metric`. Owns the daily orchestration entry point (`run_once`), the `(date, metric_id)` idempotency dedupe (CronRunLog), the D1 row source trait (`D1RowSource`), and the scheduler audit envelope (`SchedulerAuditSink`) emitting four canonical events (`scheduled` / `succeeded` / `failed` / `skipped`). Native-only — the wasm32 CF Worker cron entry point lives in `corelink-clerk-cf::dsr_statuspage_cron` and binds the trait surfaces."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
corelink-privacy-erasure-worker = { workspace = true }
corelink-statuspage-real = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Wave-18 D1-backed row source. The `wasm32_row_source` module uses
# `corelink-cf-bindings::CfD1DatabaseReal` (`worker::D1Database` async API
# on wasm32; `stub_for_native_tests` on native) + the canonical
# `TenantScopedQuery` tenant-prefix guard so the production cron handler
# queries the `dsr_erasure_log` table without bypassing tenant isolation.
# `corelink-cf-bindings` itself is dual-target by design (see its crate
# docs); we depend on it on every target so the wave-14 tenant-scope
# validator exercises on native CI as well as wasm32 production.
corelink-cf-bindings = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.8", features = ["d1", "http"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
wiremock = "0.6"
uuid = { workspace = true }
proptest = { workspace = true }
