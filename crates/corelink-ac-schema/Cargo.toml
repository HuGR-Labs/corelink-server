[package]
name = "corelink-ac-schema"
description = "CoreLink D1 (Cloudflare SQLite) Action Cache schema (WI-S04-002). Embeds the canonical migrations/d1/0002_ac_meta.sql + an in-memory schema simulator that enforces every load-bearing invariant of the migration (PK uniqueness on (tenant_id, action_digest), tenant-isolation envelope, CHECK constraint enforcement, idempotent ON CONFLICT semantics, INV-AC-RESULT-HASH-IMMUTABLE) without a live D1 instance. Production wiring (WI-S04-006) consumes the SQL artifact via wrangler d1 migrations apply; the simulator drives 10k iter property tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
hex = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
hex = { workspace = true }

[[test]]
name = "migration_canonical"
path = "tests/migration_canonical.rs"

[[test]]
name = "prop_ac_schema"
path = "tests/prop_ac_schema.rs"

[[test]]
name = "idempotency_canonical"
path = "tests/idempotency_canonical.rs"
