[package]
name = "corelink-config-api"
description = "Worker HTTP handlers for the DO config-singleton admin API: GET/PUT /v1/admin/config + rollback + history. MFA freshness middleware (CTRL-AUTH-010 + INV-ADMIN-MFA-FRESHNESS). Schema validation + CAS retry pattern. Adversarial regression tests. Examples: crud_basic, cas_retry, rollback_drill (WI-S13-001, HIGH_RISK lane FF-HR-005)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1"
uuid = { workspace = true, features = ["v7", "serde"] }
corelink-config-do = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["v7", "serde", "js"] }

[[test]]
name = "adversarial"
path = "tests/adversarial.rs"

[[example]]
name = "crud_basic"
path = "examples/crud_basic.rs"

[[example]]
name = "cas_retry"
path = "examples/cas_retry.rs"

[[example]]
name = "rollback_drill"
path = "examples/rollback_drill.rs"

# Host-only tools: examples + tests require tokio (not wasm32-safe).
[dev-dependencies]
proptest = { workspace = true }
tokio-test = { workspace = true }
tokio = { workspace = true }
