[package]
name = "corelink-region"
description = "CoreLink multi-region types, metrics, provisioning events, and migration primitives (WI-S14-001). Ships: Region enum (wnam/enam/weur/sam) + DoJurisdiction + ProvisioningEvent CloudEvent types + RegionMetrics (5 canonical metrics per WI-S14-001 §6.1.6) + MigrationReport + MigrationDecision #[non_exhaustive] taxonomy + RegionHealthStatus gauge + per-instance Arc<Mutex<>> F-001 closure. wasm32-clean (no tokio in src/). Foundation crate consumed by WI-S14-002..009."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# wasm32: uuid needs `js` feature for Uuid::now_v7() RNG via JS crypto (S-12 lesson)
uuid = { workspace = true, features = ["v7", "serde", "js"] }

[dev-dependencies]
proptest = { workspace = true }
rand = "0.9"
rand_chacha = "0.9"
# Cross-crate SLI binding tests (DR-16 wave-14): assert that
# canonical metric-name constants in this crate match the
# `Sli::*::prometheus_metric_base()` taxonomy in `corelink-slo`.
corelink-slo = { path = "../corelink-slo" }

[[test]]
name = "prop_region_invariants"
path = "tests/prop_region_invariants.rs"

[[test]]
name = "sli_binding"
path = "tests/sli_binding.rs"
