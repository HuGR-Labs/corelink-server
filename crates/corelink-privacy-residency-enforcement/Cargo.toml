[package]
name = "corelink-privacy-residency-enforcement"
description = "CoreLink residency pinning E2E + custom domain routing 6-region canonical enum (WI-S11-007 — S-11 Privacy Pipeline HIGH_RISK lane). Schrems II (CJEU C-311/18) + LGPD Art. 33 §1º + GDPR Art. 44 runtime enforcement: 6-region canonical closed enum (wnam/enam/weur/sam/apac/afr per privacy_model.md §7.1 + data_model.md §2.1); custom domain routing `<tenant_id>.<region>.corelink.dev` regex match; cross-region requests rejected 451 `legal_residency_violation` (PAT-ROUTING-PINNED-001 fail-CLOSED canonical); insert checks pre-flight em CAS PUT/AC PUT/audit emit/billing-events emit reject cross-region writes; D1 trigger defense-in-depth backup; 20k property test (10k weur + 10k enam × 5 random ops each) → 0 cross-region leaks; 2 CloudEvents canonical `dev.hugr.corelink.residency.{request_routed,write_rejected_cross_region}.v1` per Lote 10.9bis P0-G prefix em audit-<region> Object Lock 7y emit fail-CLOSED; region migration endpoint POST /v1/admin/tenant/region-migration with 30d cooldown + Privacy Officer + Compliance review (privacy_model.md §7.2 + ADR-S11-011); ResidencyEnforcement trait + InMemoryResidencyEnforcement orchestrator + RegionRouter + InsertCheckEnforcer + AuditEmitter; TenantCtx + BackendKind `#[non_exhaustive]`; per-instance Arc<Mutex<>> F-001 closure; INV-DATA-RESIDENCY CRITICAL (Lote 10.11.0-bis: Schrems II) §3.11 runtime cobertura; FM-451 P0 (S=5 → upgrade FF-HR-010) RB-DATA-RESIDENCY-LEAK runbook canonical. wasm32-unknown-unknown clean (no ring / no C toolchain dep)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
proptest = { workspace = true }
rand = "0.9"
rand_chacha = "0.10"

[[test]]
name = "integration_residency_routing"
path = "tests/integration_residency_routing.rs"

[[test]]
name = "property_residency_20k"
path = "tests/property_residency_20k.rs"

[[test]]
name = "regression_d1_check_constraints"
path = "tests/regression_d1_check_constraints.rs"
