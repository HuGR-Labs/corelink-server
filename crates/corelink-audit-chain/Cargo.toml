[package]
name = "corelink-audit-chain"
description = "CoreLink CloudEvents 1.0 audit emitter + per-region BLAKE3 hash chain + daily verify primitive (WI-S09-004 — S-09 observability stack HIGH_RISK lane). Ships AuditEvent (CloudEvents 1.0 aligned: id / source / specversion / type / time / data + datacontenttype) extended with per-event hash-chain link (`prev_hash` 32-byte BLAKE3 of canonical previous-event bytes + monotonic `sequence_number` u64) + AuditEventKind `#[non_exhaustive]` 8-canonical CNCF subject taxonomy (tenant / cas:put / cas:get / ac:lookup / gc:purge / auth:login / quota:exceeded / abuse:detected) + HashChainBuilder (RFC 8785 JCS canonical event bytes → BLAKE3-256 chain link `next_hash = BLAKE3(prev_hash || canonical_event_bytes)`) + R2AuditSink trait + InMemoryR2AuditSink (capture + R2 NDJSON layout `audit/{tenant_id}/{date YYYY-MM-DD}/{seq:08}.cloudevent.ndjson` per WI §6.1.4) + ChainVerifier (daily-verify routine; walks chain start → end; recomputes hashes; fail-closed on first mismatch) + AuditChainError `#[non_exhaustive]` taxonomy + per-instance `Arc<Mutex<>>` F-001 closure + audit-emit-BEFORE-mutation fail-closed envelope on every emit arm (meta — auditing the audit). Production R2 PutObject + scheduled verify Cron + SIEM fan-out via Cloudflare Queue + R2 Object Lock Governance Mode 7y deferred to WI-S09-007 PRR ship gate per `trait-abstraction-defer` charter pattern."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[features]
# Default: pure-logic crate; only the in-memory fakes are built.
default = []

# Build-time witness for the production `RealNeonShadowSink` driver
# path (per-region project resolver + `app.current_tenant` RLS GUC
# `set_local`-via-`SELECT set_config` + idempotent ON CONFLICT DO
# NOTHING insert + aggregate-query SQL). The trait surface +
# `RealNeonShadowSink` orchestration are ALWAYS built in (so the
# `apps/server` binary can wire them without conditional code); the
# `tokio-postgres` adapter (`real::tokio_postgres_executor`) is gated
# by this flag + `cfg(not(target_arch = "wasm32"))` so the CF Worker
# build stays clean.
#
# Pattern reference (mirrors `byok-aws-real` / `cf-billing-real`
# trait-abstraction-defer charter): the `NeonExecutor` trait lives in
# this crate; the production Postgres binder lives in the binary; the
# feature flag is a compile-time witness, not a runtime gate.
#
# Wave-20 closure: flipping this flag now ALSO pulls in the
# `TokioPostgresExecutor` adapter (`neon_shadow::real_tokio_pg`)
# which is the actual driver binder satisfying `NeonExecutor`.
#
# See `specs/_audits/2026-05-16-neon-shadow-real-driver.md` §3 + §7
# (wave-20 closure-note).
neon-real = [
    "dep:deadpool-postgres",
    "dep:tokio",
    "dep:tokio-postgres",
    "dep:tokio-postgres-rustls",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:webpki-roots",
]

# Wave-20 test-infra: gate the 5 ephemeral-Postgres integration tests
# that live in `tests/neon_shadow_real.rs`. The harness boots a
# `postgres:16-alpine` testcontainer per test (Docker required), applies
# the wave-18 + wave-20 migrations, binds a tokio-postgres-backed
# `NeonExecutor` adapter, and exercises `RealNeonShadowSink` end-to-end.
#
# OFF by default — local dev + CI runs that lack Docker stay green via
# `#[cfg_attr(not(feature = "live-pg"), ignore)]` on every test.
#
# ON via `cargo test -p corelink-audit-chain --features live-pg` —
# requires a reachable Docker daemon (see
# `specs/_audits/2026-05-16-neon-shadow-pg-testharness.md`).
live-pg = []

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_jcs = "0.2"
blake3 = { workspace = true }
hex = { workspace = true }
subtle = { workspace = true }
uuid = { workspace = true, features = ["v7", "serde"] }
corelink-analytics = { workspace = true }
# DEBT-013 OPT-04 phase 1 — `parking_lot::Mutex` on the in-memory
# audit sink record buffer (no poisoning, smaller guard).
parking_lot = { workspace = true }

# Wave-20 — `TokioPostgresExecutor` adapter satisfying `NeonExecutor`.
# All optional, gated by the `neon-real` feature (native-only — the
# wasm32 stub at `neon_shadow::real_tokio_pg::wasm_stub` requires no
# extra deps).
#
# `default-features = false` everywhere to keep the transitive dep
# surface minimal — we explicitly enable only the features we need.
deadpool-postgres = { version = "0.14", default-features = false, features = ["rt_tokio_1"], optional = true }
tokio-postgres = { version = "0.7", default-features = false, features = ["with-uuid-1"], optional = true }
tokio-postgres-rustls = { version = "0.14", default-features = false, optional = true }
tokio = { workspace = true, optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
webpki-roots = { version = "1.0", optional = true }

[dev-dependencies]
proptest = { workspace = true }
rand = "0.9"
rand_chacha = "0.10"
criterion = { workspace = true }
# Wave-20 ephemeral-Postgres test harness (`tests/harness/pg_container.rs`).
# Dev-deps only — never linked into the library or CF Worker bundle.
# The `live-pg` feature gates the 5 tests in `tests/neon_shadow_real.rs`
# that exercise `RealNeonShadowSink` against a `postgres:16-alpine`
# testcontainer. Docker is required at run-time; `cargo build` without
# the feature does NOT require Docker.
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
tokio = { workspace = true }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-serde_json-1"] }

[[bin]]
name = "verifier"
path = "src/bin/verifier.rs"

[[test]]
name = "prop_audit_chain"
path = "tests/prop_audit_chain.rs"

# Wave-20 — ephemeral-Postgres integration suite + `#[ignore]`-by-default
# Neon-staging integration tests + 1 always-on smoke test for the env-var
# resolver / secrets-matrix consistency. Tests are gated `#[cfg_attr(not(
# feature = "live-pg"), ignore)]` so the default `cargo test` run skips
# them when Docker is unavailable; `--features live-pg` (or
# `--features neon-real`) opts in to the real boot path via the
# testcontainers harness.
[[test]]
name = "neon_shadow_real"
path = "tests/neon_shadow_real.rs"

[[bench]]
name = "merkle_append"
harness = false

[[bench]]
name = "jcs_canonicalize"
harness = false
