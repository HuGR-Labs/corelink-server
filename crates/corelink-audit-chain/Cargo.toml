[package]
name = "corelink-audit-chain"
description = "CoreLink CloudEvents 1.0 audit emitter + per-region BLAKE3 hash chain + daily verify primitive (WI-S09-004 — S-09 observability stack HIGH_RISK lane). Ships AuditEvent (CloudEvents 1.0 aligned: id / source / specversion / type / time / data + datacontenttype) extended with per-event hash-chain link (`prev_hash` 32-byte BLAKE3 of canonical previous-event bytes + monotonic `sequence_number` u64) + AuditEventKind `#[non_exhaustive]` 8-canonical CNCF subject taxonomy (tenant / cas:put / cas:get / ac:lookup / gc:purge / auth:login / quota:exceeded / abuse:detected) + HashChainBuilder (RFC 8785 JCS canonical event bytes → BLAKE3-256 chain link `next_hash = BLAKE3(prev_hash || canonical_event_bytes)`) + R2AuditSink trait + InMemoryR2AuditSink (capture + R2 NDJSON layout `audit/{tenant_id}/{date YYYY-MM-DD}/{seq:08}.cloudevent.ndjson` per WI §6.1.4) + ChainVerifier (daily-verify routine; walks chain start → end; recomputes hashes; fail-closed on first mismatch) + AuditChainError `#[non_exhaustive]` taxonomy + per-instance `Arc<Mutex<>>` F-001 closure + audit-emit-BEFORE-mutation fail-closed envelope on every emit arm (meta — auditing the audit). Production R2 PutObject + scheduled verify Cron + SIEM fan-out via Cloudflare Queue + R2 Object Lock Governance Mode 7y deferred to WI-S09-007 PRR ship gate per `trait-abstraction-defer` charter pattern."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_jcs = "0.2"
blake3 = { workspace = true }
hex = { workspace = true }
subtle = { workspace = true }
uuid = { workspace = true, features = ["v7", "serde"] }
corelink-analytics = { workspace = true }
# DEBT-013 OPT-04 phase 1 — `parking_lot::Mutex` on the in-memory
# audit sink record buffer (no poisoning, smaller guard).
parking_lot = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
rand = "0.9"
rand_chacha = "0.9"
criterion = { workspace = true }

[[bin]]
name = "verifier"
path = "src/bin/verifier.rs"

[[test]]
name = "prop_audit_chain"
path = "tests/prop_audit_chain.rs"

[[bench]]
name = "merkle_append"
harness = false

[[bench]]
name = "jcs_canonicalize"
harness = false
