[package]
name = "corelink-privacy-sub-processor-emit"
description = "CoreLink Sub-Processor Register CloudEvents emitter (WI-S11-005 — S-11 Privacy Pipeline HIGH_RISK lane). Emits 3 canonical CloudEvents types `dev.hugr.corelink.sub_processor.{published,changed,objection_filed}.v1` per Lote 10.9bis P0-G prefix to audit-<region> Object Lock 7y (CTRL-PRIV-021 + GDPR Art. 28.2 + LGPD Art. 39). Implements SubProcessorAuditSink trait + InMemorySubProcessorAuditSink + FailingSubProcessorAuditSink (canonical fail-CLOSED envelope per ADR-S11-002: audit emit MUST succeed BEFORE any state mutation; CD pipeline aborts on emit failure). SubProcessorEvent `#[non_exhaustive]` 3-arm taxonomy (Published / Changed / ObjectionFiled). SubProcessorBroadcastLog + SubProcessorObjection domain types. DKIM tenant-scoped HKDF info=`corelink/v1/dkim-broadcast`. Per-instance `Arc<Mutex<>>` F-001 closure. Audit fail-CLOSED ordering: lookup → emit_audit → mutate_state. wasm32-unknown-unknown clean (no ring/C deps)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[[test]]
name = "prop_sub_processor_emit"
path = "tests/prop_sub_processor_emit.rs"
