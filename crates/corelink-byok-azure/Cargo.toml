[package]
name = "corelink-byok-azure"
description = "CoreLink BYOK Azure Key Vault Premium HSM adapter (FIPS 140-2 Level 2 default; Managed HSM = Level 3 — see compliance/byok-fips-matrix.md). Custom AAD flow: Azure wrapKey has no native AAD — CoreLink applies inner AES-GCM-AAD layer (composite key) before RSA-OAEP-256 wrapKey. Managed Identity / Service Principal / Workload Identity Entra ID auth. Implements KmsProvider trait (WI-S14-005). Production REST client (feature = `production`) targets the Key Vault REST API 7.4 with token caching. R2-8. HIGH_RISK FF-HR-005 FF-HR-008."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Default build = stub/mock only (no network deps, suitable for CI without Azure creds).
default = []
# Production = real Key Vault REST client + Entra ID OAuth2 (R2-8). Pulls in
# reqwest + regex. The `tracing` crate is now an unconditional dependency
# (audit-emit fail-CLOSED is required per the BYOK real-provider pattern;
# see `specs/_audits/2026-05-15-byok-real-provider-pattern.md`).
production = ["dep:reqwest", "dep:regex"]
# `real` is the GA-pattern alias for `production`. The server crate exposes
# `byok-azure-real` which forwards here.
real = ["production"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
corelink-byok = { path = "../corelink-byok" }
async-trait = "0.1"
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# RFC 8785 JCS canonical JSON — used for AAD / encryption_context
# canonicalization per INV-BYOK-CRYPTO-SOVEREIGNTY (the same canonical bytes
# must be reproducible across architectures including wasm32 so that
# AAD-bound ciphertext can be verified anywhere).
serde_jcs = { workspace = true }
# Constant-time byte comparison for AAD fingerprint / digest checks.
subtle = { workspace = true }
zeroize = { workspace = true }
aes-gcm = "0.10"
getrandom = "0.2"
base64 = { workspace = true }
tracing = { workspace = true }

# Production-only deps (gated behind `production` feature). Native-only
# because reqwest + regex pull in tokio/hyper/OS-level TLS and do not build
# for `wasm32-unknown-unknown`. The wasm32 stub (see `src/real.rs`) returns
# `BYOKError::Provider("... unsupported on wasm32 ...")` from every method.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
reqwest = { workspace = true, optional = true }
regex = { version = "1", optional = true }

[dev-dependencies]
tokio = { workspace = true }
tokio-test = { workspace = true }
proptest = { workspace = true }
wiremock = "0.6"
reqwest = { workspace = true }
