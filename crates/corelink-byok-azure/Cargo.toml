[package]
name = "corelink-byok-azure"
description = "CoreLink BYOK Azure Key Vault Premium HSM adapter (FIPS 140-2 Level 2 mandatory). Custom AAD flow: Azure wrapKey has no native AAD — CoreLink applies inner AES-GCM-AAD layer before wrapKey. Managed Identity OR Service Principal auth. Implements KmsProvider trait (WI-S14-005). HIGH_RISK FF-HR-005 FF-HR-008."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
corelink-byok = { path = "../corelink-byok" }
async-trait = "0.1"
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
zeroize = { workspace = true }
aes-gcm = "0.10"
getrandom = "0.4"
base64 = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tokio-test = { workspace = true }
proptest = { workspace = true }
