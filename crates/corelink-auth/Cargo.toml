[package]
name = "corelink-auth"
description = "Wave-33 Stage 1 Stream B sub-step B.3 — canonical authentication-context aggregator façade. Re-exports the 6 absorbed auth-context crates (Clerk JWT verify + Clerk CF Worker bindings pure-logic + auth-schema RLS + WebAuthn + PAT issuance/revoke + tenant-path CTRL-CAS-001 enforcer) under a single canonical import surface (`corelink_auth::{clerk, clerk_cf, schema, webauthn, pat, tenant_path}`). Stage 1 Stream B ships this crate as a re-export aggregator (Option-A least-invasive interpretation per `specs/_audits/sealed/2026-05-22-w33-stage0-foundation.md` §4) so consumer migration can proceed incrementally. Absorbed crates remain canonical sources of truth, retaining their own tests/benches/fuzz. The `corelink-clerk-cf` wasm32-only portion is preserved by reference (charter Hard Pause Trigger 5 — wasm32 build green tripwire); the `corelink-tenant-path` CTRL-CAS-001 prefix enforcer is absorbed unchanged (charter `INV-AUTH-SCHEMA-RLS-DEFAULT-ON` preserved by reference)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
# Re-export targets (Stage 1 Stream B Option-A aggregator: physical
# absorption deferred to consumer-migration stream that owns the
# `apps/server` route layer + `corelink-worker` wasm32 entry atomically;
# see Stream B SEAL audit §1).
#
# Default-features = false on `corelink-clerk` to mirror the workspace
# default; consumers opt in to clerk-prod via the `clerk-prod` feature
# (declared below).
corelink-clerk = { workspace = true }
# `corelink-clerk-cf` is wasm32-only; the umbrella consumes its pure-
# logic surface via cfg-gated re-export so the native CI build path
# does not pull wasm-bindgen / worker-rs into the auth aggregator.
# See lib.rs `#[cfg(target_arch = "wasm32")]` gate on the `clerk_cf`
# submodule.
corelink-clerk-cf = { workspace = true }
corelink-pat = { workspace = true }
corelink-tenant-path = { workspace = true }

# Wave 35 Phase 2 — webauthn absorbed inline (corelink-webauthn crate
# removed from workspace; source physically resides under
# `src/webauthn/` + `src/webauthn.rs`).
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
password-hash = { version = "0.5", default-features = false, features = ["alloc", "rand_core"] }
hmac = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
zeroize = { workspace = true }
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
uuid = { workspace = true, features = ["v7", "rng-getrandom", "serde"] }

# Wave 33 Stage 2.A-v2 additive aggregator (per 2.A HALT audit §9(b)):
# expose corelink-worker's middleware + auth submodules under canonical
# wave-33 paths `corelink_auth::middleware::*` + `corelink_auth::worker_session::*`.
# Re-export rather than physical move preserves 63-consumer surface +
# Stage 1 Option-A façade design.
corelink-worker = { workspace = true }

[features]
# Default mirrors the workspace clerk dep (no default features), and
# the consumer opts in to the JWT adapter via the umbrella feature
# `clerk-jwt-adapter` to keep parity with the absorbed crate.
default = []
clerk-jwt-adapter = ["corelink-clerk/jwt-adapter"]
# Wave 33 Stage 2.A-v2: expose corelink-worker's Tower middleware +
# auth session lifecycle adapters under canonical wave-33 paths
# `corelink_auth::middleware::*` + `corelink_auth::worker_session::*`.
# Gated because corelink-worker default-feature is wasm32-clean
# (http/tower/tokio NOT pulled). Consumers wanting these canonical
# paths must opt in via `corelink-auth/tower-middleware`.
tower-middleware = ["corelink-worker/tower-middleware"]

[dev-dependencies]
# Wave 35 Phase 2 — needed by absorbed webauthn property + adversarial tests
# and (after schema absorption) the schema simulator property tests.
proptest = { workspace = true }
serde_json = { workspace = true }
# Wave 35 Phase 2 — needed by absorbed auth-schema DSR PAT export
# integration test for pseudonym-stability assertions across the
# erasure boundary (WI-S03-008 §6.1.3).
corelink-audit = { workspace = true }

# Wave 35 Phase 2 — explicit test/example binaries preserved from absorbed
# corelink-webauthn crate (Cargo would auto-discover, but pinning is
# explicit for traceability across the absorption).
[[example]]
name = "webauthn_passkey_enroll"
path = "examples/webauthn_passkey_enroll.rs"

[[example]]
name = "webauthn_yubikey_admin_op"
path = "examples/webauthn_yubikey_admin_op.rs"

[[example]]
name = "webauthn_cross_browser_test"
path = "examples/webauthn_cross_browser_test.rs"

[[example]]
name = "webauthn_recovery_flow"
path = "examples/webauthn_recovery_flow.rs"

[[test]]
name = "webauthn_prop_webauthn"
path = "tests/webauthn_prop_webauthn.rs"

[[test]]
name = "webauthn_adversarial"
path = "tests/webauthn_adversarial.rs"

[[test]]
name = "webauthn_canonical_vectors"
path = "tests/webauthn_canonical_vectors.rs"

# Wave 35 Phase 2 — auth-schema absorbed (corelink-auth-schema removed
# from workspace; source physically resides under `src/schema/` + `src/schema.rs`).
[[test]]
name = "schema_prop_schema"
path = "tests/schema_prop_schema.rs"

[[test]]
name = "schema_migration_canonical"
path = "tests/schema_migration_canonical.rs"

[[test]]
name = "schema_integration_dsr_pat_export"
path = "tests/schema_integration_dsr_pat_export.rs"

[[test]]
name = "schema_mutation_kills"
path = "tests/schema_mutation_kills.rs"
