[package]
name = "corelink-tenant-path"
description = "CoreLink tenant prefix derivation (HMAC-SHA256 + b64 URL-safe truncation; CTRL-AUTH-004 / INV-TENANT-ISOLATION layer 5)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish = true
repository = "https://github.com/HumanGuardrail/corelink"

[lints]
workspace = true

[dependencies]
hmac = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true, features = ["v7", "rng-getrandom"] }
zeroize = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "derive"
harness = false

[[bench]]
name = "derive_prefix_v2"
harness = false

[[bench]]
name = "derive_prefix_cached"
harness = false
