[package]
name = "corelink-replication"
description = "Wave-33 Stage 1 Stream C sub-step C.1 — canonical replication-context aggregator façade. Re-exports the 5 absorbed replication-context crates (corelink-region + corelink-replica-worker + corelink-replication-coordinator + corelink-failover-router + corelink-rollout-controller) under a single canonical import surface (`corelink_replication::{region, replica, coordinator, failover, rollout}`). Option-A aggregator (per `specs/_audits/2026-05-22-w33-stage0-foundation.md` §4): absorbed crates remain canonical sources of truth, retaining their own tests/benches; consumer migration proceeds incrementally. Preserves DR-16 failover-router warm-failover lifecycle, R-PREP wave-15 multi-region coordinator 3-state machine (PRIMARY/HOT_STANDBY/REPLICA), and audit-emit-BEFORE-mutation fail-CLOSED envelopes across every absorbed crate by reference."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
# Re-export targets (Stage 1 Stream C Option-A aggregator: physical
# absorption deferred to a follow-up stream that owns the apps/server
# replication wiring atomically; see Stream C SEAL audit §1).
corelink-region = { workspace = true }
corelink-replica-worker = { workspace = true }
corelink-replication-coordinator = { workspace = true }
corelink-failover-router = { workspace = true }
corelink-rollout-controller = { workspace = true }
