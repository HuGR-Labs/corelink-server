[package]
name = "corelink-replication"
description = "Wave-33 Stage 1 Stream C sub-step C.1 — canonical replication-context aggregator façade. Re-exports the 5 absorbed replication-context crates (corelink-region + corelink-replica-worker + corelink-replication-coordinator + corelink-failover-router + corelink-rollout-controller) under a single canonical import surface (`corelink_replication::{region, replica, coordinator, failover, rollout}`). Option-A aggregator (per `specs/_audits/sealed/2026-05-22-w33-stage0-foundation.md` §4): absorbed crates remain canonical sources of truth, retaining their own tests/benches; consumer migration proceeds incrementally. Preserves DR-16 failover-router warm-failover lifecycle, R-PREP wave-15 multi-region coordinator 3-state machine (PRIMARY/HOT_STANDBY/REPLICA), and audit-emit-BEFORE-mutation fail-CLOSED envelopes across every absorbed crate by reference."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
# Re-export targets (Stage 1 Stream C Option-A aggregator: physical
# absorption deferred to a follow-up stream that owns the apps/server
# replication wiring atomically; see Stream C SEAL audit §1).
corelink-region = { workspace = true }
corelink-replica-worker = { workspace = true }
corelink-replication-coordinator = { workspace = true }
corelink-failover-router = { workspace = true }

# Wave 33 Stage 2.A-v2 additive aggregator (per 2.A HALT audit §9(b)):
# expose corelink-worker's Region enum + region-resolver state under
# canonical wave-33 path `corelink_replication::region_resolver::*`.
# Region is top-level public in corelink-worker (no feature gate).
corelink-worker = { workspace = true }

# Wave 35 Phase 2 physical absorption (per
# `specs/_audits/sealed/2026-05-26-w35-p2-replication-absorption.md`):
# `corelink-rollout-controller` is now an in-crate module at
# `corelink_replication::rollout_controller`. These deps were
# previously transitively pulled via the absorbed crate.
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# wasm32 needs uuid `js` feature for `Uuid::now_v7()` RNG via JS crypto
# (target-conditional per S-06 P0-2 pattern — same as corelink-dsr,
# corelink-deploy-verifier).
uuid = { workspace = true, features = ["v7", "serde", "js"] }

[dev-dependencies]
proptest = { workspace = true }

# Test/example targets relocated from corelink-rollout-controller per
# Wave 35 Phase 2 absorption.
[[test]]
name = "rollout_controller_prop_rollout"
path = "tests/rollout_controller_prop_rollout.rs"

[[test]]
name = "rollout_controller_adversarial"
path = "tests/rollout_controller_adversarial.rs"

[[example]]
name = "rollout_controller_start_rollout"
path = "examples/rollout_controller_start_rollout.rs"

[[example]]
name = "rollout_controller_manual_abort"
path = "examples/rollout_controller_manual_abort.rs"

[[example]]
name = "rollout_controller_budget_exceeded"
path = "examples/rollout_controller_budget_exceeded.rs"
