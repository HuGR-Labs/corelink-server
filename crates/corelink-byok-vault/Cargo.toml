[package]
name = "corelink-byok-vault"
description = "CoreLink BYOK HashiCorp Vault Transit adapter (FIPS 140-3 Level 1, Vault Enterprise FIPS build; customer-hosted; mTLS auth; transit secrets engine). mTLS cert pinning + 30d expiry alert. context = base64(JSON-encoded encryption_context). Implements KmsProvider trait (WI-S14-005). HIGH_RISK FF-HR-005 FF-HR-008."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Default build = stub/mock only (no network deps, suitable for CI without Vault creds).
default = []
# Production = real Vault Transit REST client (R2-9). Pulls in reqwest + regex + tracing.
production = ["dep:reqwest", "dep:regex"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
corelink-byok = { path = "../corelink-byok" }
async-trait = "0.1"
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
zeroize = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# Production-only deps (gated behind `production` feature).
reqwest = { workspace = true, optional = true }
regex = { version = "1", optional = true }

[dev-dependencies]
tokio = { workspace = true }
tokio-test = { workspace = true }
proptest = { workspace = true }
wiremock = "0.6"
