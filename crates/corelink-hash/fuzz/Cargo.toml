[workspace]

[package]
name = "corelink-hash-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
corelink-hash = { path = ".." }
bytes = "1"

[[bin]]
name = "digest_parse"
path = "fuzz_targets/digest_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify_body"
path = "fuzz_targets/verify_body.rs"
test = false
doc = false
bench = false
