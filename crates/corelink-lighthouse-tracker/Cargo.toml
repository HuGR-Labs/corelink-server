[package]
name = "corelink-lighthouse-tracker"
description = "WI-S20-004 lighthouse customer state machine tracker (3 customers — 2 team + 1 enterprise BYOK — across recruiting → engaged → migrating → observing → attested → case-study-signed). Pure-logic library: state transitions canonical, SLA-breach evaluation, 30d observation window math, attestation gating. No tokio, no I/O — host adapters bind to D1 (migration 0042) / CF Cron / CLI. Fail-CLOSED audit emission on illegal transitions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
mod_module_files = "deny"

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }

[dev-dependencies]
proptest = { workspace = true }
