[package]
name = "corelink-lru-tracker"
description = "CoreLink last_accessed_at hot-path async-batch LRU tracker (WI-S07-004). Ships LruTracker trait + InMemoryLruTracker orchestrator coalescing per-(tenant,digest) records over a flush window + bounded queue (drop-oldest on overflow) + drift-detection histogram + consistency-violation guard. Writes through `corelink-eviction::BlobMetaSoftDeleteStore::update_last_accessed_at_ms` conditional monotone UPDATE (INV-AC-TTL-MONOTONIC inheritance). Production Cloudflare Durable Object singleton + real D1 batch wiring deferred to WI-S07-005 PRR ship gate per `trait-abstraction-defer` charter pattern; in-memory fakes here exercise every load-bearing invariant: write-amplification mitigation via coalescing, FIFO overflow with drop-oldest semantics, monotone latest-write-wins, bounded LRU drift, INV-LRU-CONSISTENCY violation detection, tenant-scoped strict isolation, audit fail-closed envelope."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
corelink-eviction = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[[test]]
name = "prop_lru"
path = "tests/prop_lru.rs"
