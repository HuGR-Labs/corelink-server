[package]
name = "corelink-byok-revocation"
description = "CoreLink CMK revocation kill switch — RevocationDetector (60s background KMS access check per BYOK tenant), atomic DEK cache eviction, tenant degrade read-only, audit emit corelink.byok.cmk_revoked, customer alert wiring, SLA ≤ 5 min p99 global. INV-BYOK-CRYPTO-SOVEREIGNTY CRITICAL enforced. NO operator override. (WI-S14-006 — S-14 BYOK HIGH_RISK lane)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
corelink-byok = { path = "../corelink-byok" }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true }
tokio-test = { workspace = true }

[[test]]
name = "prop_revocation"
path = "tests/prop_revocation.rs"

[[test]]
name = "adversarial"
path = "tests/adversarial.rs"
