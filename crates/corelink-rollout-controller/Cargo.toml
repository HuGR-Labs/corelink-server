[package]
name = "corelink-rollout-controller"
description = "CoreLink progressive rollout controller (WI-S13-005 — S-13 admin plane, HIGH_RISK lane). Ships RolloutStage `#[non_exhaustive]` 4-canonical (Stage1Pct / Stage10Pct / Stage50Pct / Stage100Pct) + RolloutStatus `#[non_exhaustive]` 6-canonical (Pending / Active / Completed / AutoRolledBack / ManuallyAborted / BudgetFrozen) + AutoRollbackTrigger `#[non_exhaustive]` (ErrorRateExceedsBaseline3Sigma / SloBurnRateExceeds14_4 / P99LatencyExceedsBaseline50Pct) + RolloutController trait + RolloutControllerImpl orchestrator (per-instance Arc<Mutex<>> per F-001; D1-backed state machine; DO-singleton per env; 4-stage progression with dwell minimums 15/30/60/0 min; gate criteria error-budget burn; auto-rollback sustained-5-min threshold; monthly budget cap 30% measured-burn enforcement; Cosign signature gate INV-SUPPLY-SIGNED-DEPLOY S-12; concurrent rollout blocked D1 UNIQUE; audit-fail-CLOSED envelope INV-AUDIT-EMIT-ATOMIC-WITH-HANDLER) + RolloutError `#[non_exhaustive]` taxonomy + GateMetrics + RolloutDecision + NextAction + DeployArtifact + AdminActor + RolloutHandle. Property tests 4 props x 10k iter (prop_rollout_stage_progression / prop_rollout_auto_rollback_triggers / prop_rollout_budget_cap_enforced / prop_rollout_concurrent_blocked). Adversarial regression tests 8 scenarios. Production Cloudflare gradual deploy adapter + DO RolloutControllerSingletonDO per env deferred to staging account per trait-abstraction-defer charter pattern."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# wasm32 needs uuid `js` feature for `Uuid::now_v7()` RNG via JS crypto
# (target-conditional per S-06 P0-2 pattern — same as corelink-dsr, corelink-deploy-verifier).
uuid = { workspace = true, features = ["v7", "serde", "js"] }

[dev-dependencies]
proptest = { workspace = true }

[[test]]
name = "prop_rollout"
path = "tests/prop_rollout.rs"

[[test]]
name = "adversarial"
path = "tests/adversarial.rs"

[[example]]
name = "start_rollout"
path = "examples/start_rollout.rs"

[[example]]
name = "manual_abort"
path = "examples/manual_abort.rs"

[[example]]
name = "budget_exceeded"
path = "examples/budget_exceeded.rs"
