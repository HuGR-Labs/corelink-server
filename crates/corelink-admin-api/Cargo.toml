[package]
name = "corelink-admin-api"
description = "CoreLink admin API endpoint POST /v1/admin/ops — Tower middleware composition (auth → mfa_freshness → dual_approval → op_dispatch → audit_emit) + AdminOpType handler dispatcher (ConfigRollback / RetentionPolicyReduce / FeatureFlagDisable / SecretRotationStart / TenantTombstone / FeatureFlagToggleSafe / RateLimitAdjustUp) + schema validation pre-dispatch. Enforces PAT-DUAL-APPROVAL-001 via corelink-dual-approval gate; hard-fail 403 on any violation; no advisory mode. (WI-S13-002)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
corelink-dual-approval = { path = "../corelink-dual-approval" }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v7", "serde"] }
tracing = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["v7", "serde", "js"] }

[dev-dependencies]
proptest = { workspace = true }

[[test]]
name = "e2e_admin_dual_approval"
path = "tests/e2e_admin_dual_approval.rs"

[[example]]
name = "basic_2admin"
path = "examples/basic_2admin.rs"

[[example]]
name = "collusion_demo"
path = "examples/collusion_demo.rs"

[[example]]
name = "audit_inspection"
path = "examples/audit_inspection.rs"
