[package]
name = "corelink-stripe-real"
description = "CoreLink Stripe HTTPS client — real implementation of corelink-tier-selection::StripeClient via reqwest (rustls). Ships endpoints for Checkout Sessions, Subscriptions, Customers, and Billing Portal sessions; idempotent POSTs via `Idempotency-Key`; exponential backoff retries on 5xx / 429 (respects `Retry-After`); pure-function HMAC-SHA256 webhook signature verify (constant-time via `subtle::ConstantTimeEq`; 5-min replay window). Wave-31 (R-PREP wallet-broker series, stream-1): outbound Stripe calls now route through the HuGR Wallet remote credential broker at `{HUGR_WALLET_BASE}/_wallet/proxy/{HUGR_STRIPE_REF}/…` with `Authorization: Bearer ${HUGR_WALLET_TOKEN}` — CoreLink never holds a real `STRIPE_SECRET_KEY`. Webhook signature verification stays direct (inbound + local `STRIPE_WEBHOOK_SECRET`). API token + ref resolved via `StripeClientConfig::from_env()`; the `hugrw_` token is held in a redacting `SecretString` and NEVER logged. `StripeError` `#[non_exhaustive]` taxonomy (RateLimited / Authentication / CardDeclined / InvalidRequest / ApiConnection / Idempotency / Generic). Wave-19 (R-PREP): crate-root gate lifted; wasm32-safe surface (`webhook`, `webhook_dispatch`, `error`, `retry`, `dlq`, `portal`) builds on `wasm32-unknown-unknown`; native-only HTTPS client (`client.rs` + reqwest) gated per-module to non-wasm32 (see `specs/_audits/2026-05-16-stripe-wasm32-gate-lift.md` + `specs/_audits/2026-05-16-wallet-broker-stripe.md`)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[features]
default = []
# Gate live-network integration tests behind explicit feature flag so
# default `cargo test -p corelink-stripe-real` never reaches the
# network. CI sets `STRIPE_SECRET_KEY_TEST` + `--features live-integration`.
live-integration = []

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
hex = { workspace = true }
blake3 = { workspace = true }
url = "2"
# Wave-31 (R-PREP wallet-broker stream-1): `hugrw_` token held in a
# redacting `SecretString` so it never leaks via `Debug` / `Display` /
# panic output. See `specs/_audits/2026-05-16-wallet-broker-stripe.md`.
secrecy = "0.10"
corelink-tier-selection = { path = "../corelink-tier-selection" }
# Wave-36 Trigger A: the four port traits + identity / outcome / error
# types previously defined inline in `webhook_dispatch.rs` now live in
# `corelink-billing-stripe-traits` (leaf crate, zero `corelink-*` deps).
# This crate (a) re-exports them so the canonical
# `corelink_stripe_real::webhook_dispatch::*` public surface keeps
# working unchanged, and (b) implements the traits on the concrete
# HTTPS dispatcher / in-memory store / test-fake adapters that still
# live here. See `specs/_audits/2026-05-27-w36-trigger-a-seal.md`.
corelink-billing-stripe-traits = { path = "../corelink-billing-stripe-traits" }

# Wave-19 (R-PREP): native-only HTTPS dependency. The `client.rs` module
# wrapping `reqwest::blocking` is gated to non-wasm32 at the module level
# (see `src/lib.rs`); pulling `reqwest` in only on native targets keeps
# the wasm32 build slim and avoids hitting reqwest's wasm shim
# (which lacks `blocking`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, features = ["json", "rustls-tls", "blocking"], default-features = false }

# Wave-20: wasm32 wall-clock via `js_sys::Date::now()`. Closes the
# wave-19 `SystemTime::now()` runtime-panic caveat on
# `wasm32-unknown-unknown`. See
# `crates/corelink-stripe-real/src/clock.rs` ::WasmWorkerClock and audit
# `specs/_audits/2026-05-16-stripe-wasm32-gate-lift.md §8`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true }
criterion = { workspace = true }
# Wave-31: stub the HuGR Wallet proxy in tests. The mock listens on a
# `MockServer` URI; tests inject that URI as `wallet_base` to the
# `StripeRealClient` builder so they never hit `api.humangr.com`.
wiremock = "0.6"

[[bench]]
name = "webhook_verify"
harness = false
