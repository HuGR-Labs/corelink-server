[package]
name = "corelink-stripe-real"
description = "CoreLink Stripe HTTPS client — real implementation of corelink-tier-selection::StripeClient via reqwest (rustls). Ships endpoints for Checkout Sessions, Subscriptions, Customers, and Billing Portal sessions; idempotent POSTs via `Idempotency-Key`; exponential backoff retries on 5xx / 429 (respects `Retry-After`); pure-function HMAC-SHA256 webhook signature verify (constant-time via `subtle::ConstantTimeEq`; 5-min replay window). API key + webhook secret resolved from env (`STRIPE_SECRET_KEY` / `STRIPE_SECRET_KEY_TEST` / `STRIPE_WEBHOOK_SECRET`) — NEVER logged. `StripeError` `#[non_exhaustive]` taxonomy (RateLimited / Authentication / CardDeclined / InvalidRequest / ApiConnection / Idempotency / Generic). Wave-19 (R-PREP): crate-root gate lifted; wasm32-safe surface (`webhook`, `webhook_dispatch`, `error`, `retry`, `dlq`, `portal`) builds on `wasm32-unknown-unknown`; native-only HTTPS client (`client.rs` + reqwest) gated per-module to non-wasm32 (see `specs/_audits/2026-05-16-stripe-wasm32-gate-lift.md`)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[features]
default = []
# Gate live-network integration tests behind explicit feature flag so
# default `cargo test -p corelink-stripe-real` never reaches the
# network. CI sets `STRIPE_SECRET_KEY_TEST` + `--features live-integration`.
live-integration = []

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
hex = { workspace = true }
blake3 = { workspace = true }
url = "2"
corelink-tier-selection = { path = "../corelink-tier-selection" }

# Wave-19 (R-PREP): native-only HTTPS dependency. The `client.rs` module
# wrapping `reqwest::blocking` is gated to non-wasm32 at the module level
# (see `src/lib.rs`); pulling `reqwest` in only on native targets keeps
# the wasm32 build slim and avoids hitting reqwest's wasm shim
# (which lacks `blocking`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, features = ["json", "rustls-tls", "blocking"], default-features = false }

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "webhook_verify"
harness = false
