[package]
name = "corelink-core"
description = "Wave-33 Stage 0 — apex cross-cutting types for the CoreLink workspace. Pure-logic newtypes (`TenantId`, `Digest`, `Region`, `SecretWrap`), workspace-cross-cutting error enum (`CoreError`), and the `Clock` trait surface (monotonic + wall). Apex of the dependency graph: this crate depends on NO other `corelink-*` crate (cargo-deny enforced post Stage 3). Behaviour-preserving Stage 0 — existing scattered copies remain in place until Stage 1 streams migrate consumers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v7", "serde"] }
subtle = { workspace = true }
secrecy = "0.10"

[dev-dependencies]
serde_json = { workspace = true }
