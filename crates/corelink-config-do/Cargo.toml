[package]
name = "corelink-config-do"
description = "DO config-singleton per-region: schema-versioned ConfigPayload (feature flags + rate-limit tunables + retention policies), CAS atomic update, propagation pub-sub, D1 config_change_log 90d retention, rollback API. Foundation for WI-S13-002 admin API (WI-S13-001, HIGH_RISK lane FF-HR-005). Implements ConfigSingletonStore trait + InMemoryConfigSingletonStore. Per-instance Arc<Mutex<>> F-001. Audit fail-CLOSED (lookup→emit→mutate). Prometheus metrics: corelink_admin_config_* family (5 metrics). Trace spans: admin.config.update | admin.config.rollback | admin.config.propagation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_jcs = "0.2"
sha2 = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1"
uuid = { workspace = true, features = ["v7", "serde"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["v7", "serde", "js"] }

[dev-dependencies]
proptest = { workspace = true }
tokio-test = { workspace = true }

[[test]]
name = "prop_cas"
path = "tests/prop_cas.rs"
