language = "C"
include_guard = "CORELINK_CLIENT_VERIFY_H"
header = "/* Generated by cbindgen — do not edit by hand. */"
documentation = true
documentation_style = "doxy"
style = "type"

[parse]
parse_deps = false
include = ["corelink-client-verify"]

[export]
include = [
  "corelink_verifier_new_default_on",
  "corelink_verifier_new_disabled",
  "corelink_verifier_free",
  "corelink_verifier_verify",
  "corelink_verify_error_code_to_str",
  "corelink_verify_opt_out_total",
  "ClientVerifier",
  "COR_VERIFY_OK",
  "COR_VERIFY_ERR_MISMATCH",
  "COR_VERIFY_ERR_DISABLED",
  "COR_VERIFY_ERR_INVALID_INPUT",
  "COR_VERIFY_ERR_INVALID_DIGEST",
  "DIGEST_BYTES",
  "DIGEST_HEX_LEN",
]

[export.rename]
"ClientVerifier" = "CoreLinkClientVerifier"

[enum]
prefix_with_name = true

[fn]
prefix = ""
no_return = "_Noreturn"

[macro_expansion]
bitflags = false

# Map cargo feature flags to no-op `#define`s so cbindgen can parse
# `#[cfg(feature = "...")]` items and emit the gated public surface.
# The FFI module is gated behind `feature = "ffi"`; stream verify is
# gated behind `feature = "stream"`. Cbindgen's TOML schema for this
# table requires the key to NOT be wrapped in extra quotes (only the
# string-literal value is quoted).
[defines]
"feature = ffi" = "CORELINK_CLIENT_VERIFY_FFI"
"feature = stream" = "CORELINK_CLIENT_VERIFY_STREAM"
