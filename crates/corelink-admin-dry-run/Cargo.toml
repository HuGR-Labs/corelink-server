[package]
name = "corelink-admin-dry-run"
description = "WI-S13-006 dry-run harnesses for RB-FM-205 (admin mistake) + RB-FM-201 (config rate-limit drop) + RB-FM-206 (terraform drift) using the pure-logic in-memory fakes. Rust binaries per S-12 lessons (no bash > 30 lines). Cadence: RB-FM-205 annual, RB-FM-201 monthly, RB-FM-206 monthly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[dependencies]
corelink-dual-approval = { path = "../corelink-dual-approval" }
corelink-config-do = { path = "../corelink-config-do" }
corelink-terraform-drift-consumer = { path = "../corelink-terraform-drift-consumer" }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
tokio-test = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
rand = "0.9"
rand_chacha = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["v7", "js"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "rb_fm_205_dry_run"
path = "src/bin/rb_fm_205_dry_run.rs"

[[bin]]
name = "rb_fm_201_dry_run"
path = "src/bin/rb_fm_201_dry_run.rs"

[[bin]]
name = "rb_fm_206_dry_run"
path = "src/bin/rb_fm_206_dry_run.rs"
