[package]
name = "corelink-privacy-notice-emit"
description = "CoreLink privacy notice versioning + 3-locale publication emitter (WI-S11-004 — S-11 Privacy Pipeline HIGH_RISK lane). Delivers 2 CloudEvents canonical `dev.hugr.corelink.privacy_notice.{published,deprecated}.v1` with fail-CLOSED audit envelope (INV-AUDIT-APPEND-ONLY: emit BEFORE state mutation; abort deploy on emit failure per AC-008). Ships NoticeLocale `#[non_exhaustive]` 3-arm canonical enum (PtBr / EnUs / EsMx — LGPD primary / GDPR/CCPA secondary / LATAM tertiary), NoticeVersion semver validated (major > 0 || minor >= 0 valid; major bump = material change per ADR-S11-007; minor bump = silent clarification), VersionBump `#[non_exhaustive]` 2-arm enum (Major / Minor), NoticePublishedPayload + NoticeDeprecatedPayload (notice_text_hash SHA-256 per locale per version), 2 CloudEvent canonical envelope structs, NoticeAuditSink trait + InMemoryNoticeAuditSink capture + FailingNoticeAuditSink (fail-CLOSED), NoticeEmitter trait + InMemoryNoticeEmitter orchestrator (lookup → emit_audit → publish_state per Lote 10.6bis canonical order; audit failure aborts; state UNCHANGED on audit fail per AC-008), NoticeEmitterError `#[non_exhaustive]`. notice_text_hash deterministic canonical: CRLF→LF + trim trailing whitespace per line + UTF-8 NFC normalize + SHA-256 hex64 (cross-platform parity per AC-006 property test). Per-instance `Arc<Mutex<>>` F-001 closure. CTRL-PRIV-CONSENT-005 alignment: major bump triggers stale_consent_check flag; minor bump silent. wasm32-unknown-unknown clean (no ring / no C deps)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
proptest = { workspace = true }
uuid = { workspace = true, features = ["v7", "serde"] }

[[test]]
name = "prop_notice_hash_determinism"
path = "tests/prop_notice_hash_determinism.rs"

[[test]]
name = "prop_audit_fail_closed"
path = "tests/prop_audit_fail_closed.rs"

[[test]]
name = "regression_3locale_sync"
path = "tests/regression_3locale_sync.rs"
