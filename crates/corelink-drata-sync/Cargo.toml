[package]
name = "corelink-drata-sync"
description = "R5-prep SOC 2 Drata evidence collection pipeline (WI-R5P-SOC2-DRATA). Daily-cron pulls evidence records from internal CoreLink sources (D1 audit_outbox → audit logs; tenants + RBAC → access reviews; PAT issuance/revocation → credential mgmt; GitHub PR/merge webhooks → change mgmt; PagerDuty incident timeline → incident response; pentest findings → vulnerability mgmt) and POSTs them to the Drata REST API with Bearer-token auth (env DRATA_API_KEY), SHA-256 idempotency dedup, exponential-backoff retry on 5xx/429, fail-CLOSED audit emit `corelink.compliance.drata_evidence_sent` BEFORE network call, and CTRL-PRIV-001 redaction (only metadata + hashes pushed — no PII). Ships canonical traits, six EvidenceStream variants, DrataHttpClient real client, InMemoryDrataClient fake, idempotency ledger trait + in-memory + D1-backed adapters (D1 migration 0044 corelink_drata_sync_ledger), and a SyncRunner orchestrator the CF Cron Worker invokes at 03:00 UTC daily. Mockable via wiremock; no tokio in src (synchronous reqwest::blocking)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }

[dev-dependencies]
wiremock = "0.6"
tokio = { workspace = true }
proptest = { workspace = true }
