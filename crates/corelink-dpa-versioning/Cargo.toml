[package]
name = "corelink-dpa-versioning"
description = "CoreLink DPA versioning + re-acceptance flow + 30d grace + read-only degrade (WI-S19-003 — S-19 Onboarding HIGH_RISK lane). Lifecycle management of the DPA legal contract between CoreLink (Processor) and existing customers (Controller). Implements: (a) semver bump kind taxonomy (Major = material change requires re-acceptance; Minor / Patch = no re-acceptance); (b) Major bump triggers existing tenants email broadcast + 30d grace period (canonical UTC); (c) re-acceptance flow mirrors WI-S19-002 click-through (6-field consent + JWT receipt) but bumps the tenant's `current_dpa_version`; (d) daily cron `check_grace_expirations` flags tenants approaching grace (≤7d) and degrades tenants post-expiry; (e) PAT-DEGRADE-001 read-only middleware: tenant w/ expired grace rejects writes (POST / PUT / PATCH / DELETE) on all `/v1/*` endpoints except `/v1/dpa/re-accept` (consumer protection: reads always allowed); (f) D1 schema additive migration (`dpa_versions` table + `dpa_grace_expires_at` + `current_dpa_version` columns on `tenants`); (g) Prometheus snake_case metrics scaffolds (`re_acceptance_total{from_version, to_version, outcome}` + `grace_period_remaining_days` gauge + `degraded_tenants_count` gauge). Ships pure-logic skeleton: `DpaVersioning` trait + `InMemoryDpaVersioning` orchestrator + `ReadOnlyDegradeGate` middleware primitive + `GraceExpirationCron` scheduler primitive. Per-instance `Arc<Mutex<>>` F-001 closure. wasm32-unknown-unknown clean (no ring / no C deps). Production wiring (CF Worker `POST /v1/dpa/re-accept` route, D1 mirror, SES email broadcast, in-app banner backend, customer support escalation) deferred to WI-S19-008 PRR ship gate per `trait-abstraction-defer` charter pattern."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
proptest = { workspace = true }

