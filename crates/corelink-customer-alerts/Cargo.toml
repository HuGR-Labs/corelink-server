[package]
name = "corelink-customer-alerts"
description = "CoreLink multi-channel customer alert delivery — dashboard (D1 row + WebSocket fanout), email (SendGrid/SES), in-app notification, optional Slack webhook. Delivery confirmation via dashboard read. Used by WI-S14-006 kill switch. (S-14 BYOK HIGH_RISK lane)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
# Wave-35 Phase 2 — `corelink-byok-core` and `corelink-byok-revocation`
# were physically absorbed into the `corelink-byok` umbrella. Symbols
# reached at `corelink_byok::{KmsKeyId, KmsProviderKind}` (core re-export)
# and `corelink_byok::revocation::{CustomerAlerter, RevocationError,
# alerter::RevocationAlertPayload}` (always-on submodule).
corelink-byok = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tokio-test = { workspace = true }
