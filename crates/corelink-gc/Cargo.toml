[package]
name = "corelink-gc"
description = "CoreLink Garbage Collection worker skeleton + per-region cron scheduler (jitter ±10 min) + degrade-mode `gc-pause` emergency stop + manual admin trigger stub + `gc_run` D1 checkpoint schema (WI-S06-001). Production Cloudflare Cron Durable Object binding deferred to WI-S06-006 conformance suite per the trait-abstraction-defer charter pattern; in-memory fakes here exercise every load-bearing invariant of the production wiring (single-running per (tenant,region) partial UNIQUE, idempotent resume from checkpoint, monotone phase transitions, degrade-mode probe ≤100ms next batch boundary, mark_started_at_ms anchor immutability for INV-GC-004 sweep-phase-aware re-ref protection)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
proptest = { workspace = true }
rand = "0.9"
rand_chacha = "0.9"

[[bin]]
name = "gc_sweep"
path = "src/bin/gc_sweep.rs"

