[package]
name = "corelink-cf-bindings"
description = "Production Cloudflare Worker binding adapters (R2 / D1 / KV / Durable Object) implementing the trait surfaces declared in corelink-worker. wasm32-unknown-unknown ONLY — these adapters wrap `worker::*` types that depend on js-sys / wasm-bindgen JsValue and have no native shim. The trait-abstraction-defer pattern keeps `InMemoryR2 / InMemoryKv / ...` fakes intact for native unit tests; this crate provides the production-side wiring for R2-10."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# wasm32-unknown-unknown is the only target this crate is intended for.
# `cargo build --target wasm32-unknown-unknown -p corelink-cf-bindings` is
# the canonical build command. Do NOT attempt to link this crate into a
# native binary; it depends on worker-sys / wasm-bindgen JsValue types
# that have no native shim. The lib root carries
# `#![cfg(target_arch = "wasm32")]` so an accidental native build
# yields an empty crate (not a hard link error — by design, this keeps
# `cargo build --workspace` green on the host without per-crate
# `[target.'cfg(...)']` plumbing in every consumer's Cargo.toml).

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# CF Workers runtime — `d1` feature gates D1Database; `http` enables the
# http::Request / http::Response types used by event(fetch).
worker = { version = "0.8", features = ["d1", "http"] }

# Shared bytes type — used by R2Backend trait surface.
bytes = { workspace = true }

# Constant-time equality for tenant identifier comparisons across the
# real bindings: D1's bind-time tenant_id check, KV's TenantPrefix::eq
# and scoped_key prefix probe, R2's prefix-derivation path, DO's instance
# routing tenant check. CTRL-PRIV-001 defense-in-depth — prevents
# timing-side-channel leakage on cross-tenant probes.
subtle = { workspace = true }

# Trait surfaces we implement. `corelink-worker` is the canonical owner
# of R2Backend / KvBackend / CounterDoBackend; we depend on it for
# `default-features = false`-style compatibility (no native-only feature
# bleeds into the wasm32 build).
corelink-worker = { workspace = true }

# Error types.
thiserror = { workspace = true }

# wasm bindgen futures for async bridging in the worker handler.
wasm-bindgen-futures = { workspace = true }

# Wave-26 wasm32 baseline fix.
#
# `uuid 1.23.1` with `rng-getrandom` (used by tenant-path / corelink-audit
# / corelink-pat / corelink-reapi / corelink-survey / corelink-webauthn —
# all of which flow into this crate's reverse-dep chain via corelink-worker
# and corelink-ac) pulls `getrandom 0.4`. Without this explicit dep the
# `wasm_js` cargo feature is never enabled, the backend module is empty,
# and the E0425 errors documented in the wave-25 audit §8 break the
# wasm32-unknown-unknown build of corelink-clerk-cf,
# corelink-dsr-statuspage-scheduler, corelink-privacy-erasure-worker, and
# corelink-statuspage-real.
#
# The companion `--cfg=getrandom_backend="wasm_js"` rustflag is set in
# `<workspace>/.cargo/config.toml`. Both halves are required: the cfg
# selects the backend module, the feature pulls in the wasm-bindgen / js-sys
# deps that the backend module uses.
#
# Lives here (in cf-bindings) because every CF worker crate that targets
# wasm32 depends on this crate; feature unification therefore covers the
# whole CF surface without per-leaf-crate plumbing.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_v04 = { package = "getrandom", version = "0.4", default-features = false, features = ["wasm_js"] }

# Serde for D1 row deserialisation in `CfD1DatabaseReal::first` (the
# wasm32 production path delegates to `worker::D1PreparedStatement::first`
# which is generic over `for<'a> Deserialize<'a>`). The native stub does
# not exercise this surface but the trait bound still requires `serde`
# at the type-system layer.
serde = { workspace = true }


# Host-side native tests for INV-CAS-IDEMPOTENCY exercise the
# `corelink-worker::storage::r2::InMemoryR2` fake (same trait surface as
# the wasm32-only `CfR2BucketAdapter`). The native build of this crate is
# empty (cfg-gated at `target_arch = "wasm32"`), so the proptest under
# `tests/` runs against the trait-abstraction-defer fake and asserts the
# CAS contract that the production adapter MUST also satisfy.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = { workspace = true }
rand = "0.9"
rand_chacha = "0.9"
bytes = { workspace = true }
tokio = { workspace = true }
corelink-worker = { workspace = true }
