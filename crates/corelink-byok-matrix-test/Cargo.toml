[package]
name = "corelink-byok-matrix-test"
description = "16-combination matrix test (4 providers × 4 ops {write, read, wrap, unwrap}) + property tests (4 props × 10k iter) + adversarial regression tests per provider. WI-S14-005 HIGH_RISK CI gate: auto-fail PR if any cell breaks. Weekly staging cron via byok_matrix_weekly.yml."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
corelink-byok = { path = "../corelink-byok" }
corelink-byok-aws = { path = "../corelink-byok-aws" }
corelink-byok-gcp = { path = "../corelink-byok-gcp" }
corelink-byok-azure = { path = "../corelink-byok-azure" }
corelink-byok-vault = { path = "../corelink-byok-vault" }
async-trait = "0.1"
serde_json = { workspace = true }
tokio = { workspace = true }
proptest = { workspace = true }
