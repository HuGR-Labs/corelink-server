[package]
name = "corelink-clerk-cf"
description = "Production Cloudflare Worker bindings for corelink-clerk — KvJwksCache on CF KV + JwksFetcher on CF Fetch + GET /health proof-of-concept handler. Proves the trait-abstraction-defer pattern compiles to wasm32-unknown-unknown against real CF Worker D1 + KV bindings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# wasm32-unknown-unknown is the only target this crate is intended for.
# `cargo build --target wasm32-unknown-unknown -p corelink-clerk-cf` is
# the canonical build command. Do NOT attempt to link this crate into a
# native binary; it depends on worker-sys / wasm-bindgen JsValue types
# that have no native shim.

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# CF Workers runtime — gated with the `d1` feature so D1Database is
# available. The `http` feature enables the http::Request / http::Response
# types that the event(fetch) macro needs on workers-rs 0.8.
worker = { version = "0.8", features = ["d1", "http"] }

# The clerk logic crate; we implement its traits here.
# We use `default-features = false` to avoid pulling in `jsonwebtoken`
# (which depends on `ring`, which requires a C toolchain for wasm32).
# We only need the trait surfaces (JwksFetcher, KvJwksCache, Jwks, etc.)
# which live in modules that have no ring dependency.
corelink-clerk = { workspace = true, default-features = false }

# Serde for the health response JSON body.
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling.
thiserror = { workspace = true }

# Tracing (console-based; no subscriber needed on CF Workers — logs go
# to the CF Logs dashboard automatically via console_log!).
tracing = { workspace = true }

# wasm_bindgen_futures for async bridging inside the worker handler.
wasm-bindgen-futures = "0.4"

# wasm-bindgen — explicit dep so the `#[durable_object]` macro
# expansion (wave 16, `clerk_health_do.rs`) can resolve the
# `wasm_bindgen` proc-macro from the crate root scope. The worker crate
# also re-exports it via `::worker::wasm_bindgen`; we add it as a
# direct dep so the macro hygiene does not break when the expanded
# `#[wasm_bindgen(...)]` attribute references its own crate.
wasm-bindgen = { workspace = true }

# js-sys — required at crate root for the `#[durable_object]`-generated
# code which references `::js_sys::*` through the macro's expansion in
# some code paths (List/Map iteration in the actor's hot path).
js-sys = { workspace = true }

# subtle — constant-time byte comparison for the tenant-id segment
# check in `clerk_health_do::ParsedRoute::assert_tenant` (CTRL-PRIV-001
# defense-in-depth, same stance as `do_real::TenantScopedName`).
subtle = { workspace = true }

# R2-10 — production CF binding adapters (R2/D1/KV/DO) implementing the
# trait surfaces from corelink-worker. Wave 15 promotes this from an
# opportunistic surface-touch to the canonical binding-access path for
# the CF Worker boot — see `src/prod_wiring.rs`. The cf-bindings crate
# provides both the wasm32 production wrappers and host-side
# `stub_for_native_tests` constructors used by `tests/prod_wiring.rs`
# to exercise the boot path on native CI.
corelink-cf-bindings = { workspace = true }

# Wave-18 follow-on: optional billing materializer wrappers gated by
# the `cf-billing-real` feature. When on, `prod_wiring::build_billing_real_bindings`
# constructs the `CfD1BillingWriter` + `ArchiveProducerBillingEmitter`
# trait objects from the canonical `CfRealBindings` bundle so the CF
# Worker boot path can wire them into the Stripe materializer
# `WebhookDispatcher` without re-importing the binders at every call site.
corelink-billing-stripe-materializer = { workspace = true, optional = true }
corelink-audit-chain = { workspace = true, optional = true }

[features]
default = []

# Opt into the wave-18 wasm32 binders for the Stripe materializer.
# Pulls in `corelink-billing-stripe-materializer` + `corelink-audit-chain`
# and unlocks `prod_wiring::build_billing_real_bindings`. See
# `specs/_audits/2026-05-15-stripe-webhook-production.md` §materializers.wasm32-binders.
cf-billing-real = [
    "dep:corelink-billing-stripe-materializer",
    "dep:corelink-audit-chain",
    "corelink-billing-stripe-materializer/cf-billing-real",
]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Host-side integration tests in `tests/prod_wiring.rs` use tokio as
# the async test runtime. The wasm32 build does not use tokio (the
# canonical async surface there is the worker::* futures).
tokio = { workspace = true, features = ["macros", "rt"] }
