# Wrangler configuration for corelink-clerk-cf proof-of-concept.
#
# This file is intentionally separate from the root wrangler.toml which
# configures the main CoreLink Worker (containers + gRPC). This POC
# worker validates the trait binding surfaces; it is NOT a production
# worker deployment. To deploy (future, not for this POC):
#
#   cd crates/corelink-clerk-cf
#   wrangler deploy
#
# To run the local smoke test (future, requires wrangler dev support
# for Rust workers):
#
#   wrangler dev
#
# Compile:
#   cargo build --target wasm32-unknown-unknown -p corelink-clerk-cf
#   (or `wrangler build` which calls cargo under the hood)

name = "corelink-clerk-cf-poc"
main = "build/worker/shim.mjs"
compatibility_date = "2026-04-01"

# Native retained Workers Logs (zero-cost; queryable in the CF dashboard).
# Not Logpush to an external sink (that needs an owner-provided destination).
[observability]
enabled = true
head_sampling_rate = 1

[build]
command = "cargo build --target wasm32-unknown-unknown --release -p corelink-clerk-cf"

# Wave 15 — Production wiring exercises all 4 CF runtime surfaces
# through their real-binding wrappers in `corelink-cf-bindings`. The
# `crates/corelink-clerk-cf/src/prod_wiring.rs` boot path resolves the
# four bindings below and wraps each in its `Cf*Real` adapter (tenant-
# prefix enforced + audit-fenced).

# KV namespace binding — JWKS cache + health marker.
# PLACEHOLDER IDs: replace with real IDs from `wrangler kv namespace create`
# before deploying.
[[kv_namespaces]]
binding = "CLERK_JWKS_KV"
id = "PLACEHOLDER_KV_NAMESPACE_ID"
preview_id = "PLACEHOLDER_KV_PREVIEW_ID"

# D1 database binding — audit log for health probe rows.
# PLACEHOLDER ID: replace with real ID from `wrangler d1 create clerk-audit-db`
# before deploying.
[[d1_databases]]
binding = "CLERK_DB"
database_name = "clerk-audit-db"
database_id = "PLACEHOLDER_D1_DATABASE_ID"

# Wave-18 DSR Statuspage 24h publish cron — `dsr_erasure_log` D1
# binding. The wave-18 wasm32 cron handler in
# `src/dsr_statuspage_cron.rs` reads the canonical 24h slice of
# `dsr_erasure_log` rows through this binding (via the wave-14
# `CfD1DatabaseReal` tenant-scoped wrapper). The database is shared
# with the canonical DSR worker that writes per-backend tombstones —
# the cron is a read-only consumer.
[[d1_databases]]
binding = "DSR_LOG_DB"
database_name = "corelink-dsr-erasure-log"
database_id = "PLACEHOLDER_DSR_LOG_DATABASE_ID"

# R2 bucket binding — content-addressable store. The health probe
# issues a `head` against `<tenant>/health/probe` so the binding chain
# is exercised end-to-end even when CAS payloads are not in scope of
# the clerk-cf Worker. Bound via `CfR2BucketReal` in `prod_wiring.rs`.
[[r2_buckets]]
binding = "CAS_BUCKET"
bucket_name = "corelink-cas-bucket"
preview_bucket_name = "corelink-cas-bucket-preview"

# Durable Object namespace binding — per-tenant actors (counter,
# ratelimit, lease, health-record). Wave 16 wires the `ClerkHealthDo`
# actor class IN THIS worker (`corelink-clerk-cf-poc`) — `script_name`
# is now omitted so the DO is co-located with the consumer Worker.
# Bound via `CfDurableObjectReal` in `prod_wiring.rs` and consumed via
# `stub_by_name("health")` from `handle_health_real`.
#
# Wave 15 routed via `script_name = "corelink-server"` (the main Worker
# was assumed to own the class). Wave 16 reverses that: the class is
# defined here in `clerk_health_do.rs`, registered by the `worker-rs`
# `#[durable_object]` macro at module load time.
[[durable_objects.bindings]]
name = "CLERK_DO"
class_name = "ClerkHealthDo"

# Workers DO migrations: rows are NEVER mutated in-place once deployed
# (the CF Workers runtime stores the applied migration tag per script
# and refuses any retroactive change). New classes get APPENDED rows;
# class deletions / renames get APPENDED `deleted_classes` /
# `renamed_classes` rows.
#
# v1 (wave 15): no DO classes in this Worker — the `CLERK_DO` binding
# referenced the main Worker via `script_name = "corelink-server"`.
[[migrations]]
tag = "v1"
new_classes = []

# v2 (wave 16): introduce the `ClerkHealthDo` actor class in this
# Worker. Append-only; v1 stays untouched.
[[migrations]]
tag = "v2"
new_classes = ["ClerkHealthDo"]

[vars]
ENVIRONMENT = "dev"
# Wave-17 DSR Statuspage 24h publish scheduler — see
# `crates/corelink-clerk-cf/src/dsr_statuspage_cron.rs` + the
# `[triggers]` block below. The page-ID + metric-ID are non-credential
# config vars per `docs/internal/secrets-checklist.md` rows 116 / 117.
# The Statuspage API key (row 42) is ALWAYS a `wrangler secret put`
# (never a `[vars]` row); the `scheduled` handler resolves it via
# `env.secret(...)`.
STATUSPAGE_PAGE_ID = "PLACEHOLDER_STATUSPAGE_PAGE_ID"
STATUSPAGE_METRIC_DSR_RESOLUTION_HOURS = "PLACEHOLDER_STATUSPAGE_METRIC_DSR_RESOLUTION_HOURS"
# Wave-18 DSR Statuspage wasm32 real backend — tenant the cron read
# scopes against. CTRL-PRIV-001 / INV-TENANT-ISOLATION: every D1
# read flows through `CfD1DatabaseReal` which constant-time-checks
# the first bound parameter against this anchored tenant-id. The
# value is a 16-hex tenant prefix per `corelink-tenant-path`; in
# production set this via `wrangler.toml` `[vars]` per-environment
# to the operations-tenant that owns the cron job.
STATUSPAGE_TENANT_ID = "PLACEHOLDER_STATUSPAGE_TENANT_ID"

# Wave-17 DSR Statuspage 24h publish scheduler — cron trigger.
#
# Cron expression `0 6 * * *` = 06:00 UTC daily. Scheduled AFTER the
# audit-chain daily-verify at 02:00 UTC and BEFORE SF business start
# (08:00 PT = 16:00 UTC; gives a 10-hour buffer for ops to react to
# any `corelink.privacy.statuspage_publish_failed.v1` audit before
# the customer-facing business day opens).
#
# Pinned verbatim against `corelink-dsr-statuspage-scheduler::
# CRON_EXPRESSION` and `corelink-clerk-cf::dsr_statuspage_cron::
# CRON_EXPRESSION` — both constants assert against `"0 6 * * *"` in
# unit tests so drift between the wrangler row and the code-side
# constants fails CI.
[triggers]
crons = ["0 6 * * *"]

# Production environment override (deploy with --env prod).
[env.prod]
name = "corelink-clerk-cf-poc-prod"
vars = { ENVIRONMENT = "prod", STATUSPAGE_PAGE_ID = "PLACEHOLDER_STATUSPAGE_PAGE_ID_PROD", STATUSPAGE_METRIC_DSR_RESOLUTION_HOURS = "PLACEHOLDER_STATUSPAGE_METRIC_DSR_RESOLUTION_HOURS_PROD", STATUSPAGE_TENANT_ID = "PLACEHOLDER_STATUSPAGE_TENANT_ID_PROD" }

# Native retained Workers Logs (per-env; not inherited from top-level).
[env.prod.observability]
enabled = true
head_sampling_rate = 1
