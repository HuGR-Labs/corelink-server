[package]
name = "corelink-wasm"
description = "CoreLink JS/TS WASM wrapper via wasm-bindgen — Promise-based API; client-verify default-on per CTRL-CAS-002 (reuses corelink-client-verify single Rust truth). Published to npm as @corelink/client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
# cdylib required for wasm-pack to produce a .wasm module.
crate-type = ["cdylib"]
name = "corelink_wasm"

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[features]
default = []

[dependencies]
# wasm-bindgen: bridge Rust types to JS.
wasm-bindgen = { workspace = true }
# js-sys: access JS primitives (Uint8Array, Promise, etc.).
js-sys = { workspace = true }
# wasm-bindgen-futures: convert Rust futures to JS Promises.
wasm-bindgen-futures = { workspace = true }
# serde + serde-wasm-bindgen: serialize StatResult to/from JS objects.
serde = { workspace = true }
serde-wasm-bindgen = { workspace = true }
# corelink-client-verify: single Rust truth (S-02 SEAL).
# NOTE: do NOT enable the `ffi` feature here — wasm-bindgen uses a separate
# pipeline (no cbindgen). The `stream` feature is also omitted for WASM
# bundle size: async stream is handled at the JS layer.
corelink-client-verify = { path = "../corelink-client-verify" }
tracing = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }
proptest = { workspace = true }

# getrandom 0.3 enters the wasm32 TEST graph transitively via
# proptest -> rand 0.9 -> rand_core 0.9 -> getrandom 0.3.x. The workspace
# `.cargo/config.toml` sets `--cfg=getrandom_backend="wasm_js"` for EVERY
# getrandom version on wasm32, but that cfg REQUIRES the matching `wasm_js`
# cargo feature to be enabled per MAJOR (the cfg selects the backend module,
# the feature pulls the wasm-bindgen/js-sys deps it uses). The Wave-26 fix
# enabled it only for getrandom 0.4 (corelink-cf-bindings); without the 0.3
# pin here, `wasm-pack test --node` fails E0425 (fill_inner/inner_u32/inner_u64
# not found in `getrandom::backends`). Mirrors the cf-bindings 0.4 pin for the
# 0.3 major so the wasm-bindgen test graph compiles.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom_v03 = { package = "getrandom", version = "0.3", default-features = false, features = ["wasm_js"] }

[package.metadata.wasm-pack.profile.release]
# wasm-bindgen (rust 1.91) emits reference-types / bulk-memory / mutable-globals
# etc. wasm-opt's validator REJECTS those unless all features are enabled
# ("Fatal: error validating input" → wasm-pack build fails). Run its internal
# wasm-opt with `-all` so it accepts current wasm-bindgen output.
wasm-opt = ['-O3', '-all']
