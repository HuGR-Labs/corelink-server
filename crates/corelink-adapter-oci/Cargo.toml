[package]
name = "corelink-adapter-oci"
description = "Wave-34 OCI Distribution Spec v1.1 registry adapter — Docker/podman/buildah/containerd/crane consume CoreLink as a standard OCI registry endpoint. Implements the canonical /v2/ endpoint surface (push + pull, multi-step blob uploads, manifest mutation, bearer-realm scoped auth) with manifests cached in KV and blobs (layers + configs) stored in CAS. Per-tenant repository namespace; catalog endpoint DISABLED by default (cross-tenant leak risk). All credentials wrapped in `SecretWrap`; bearer-token verify is constant-time via `subtle::ConstantTimeEq`. Declared-digest verification fail-CLOSED on every `PUT /blobs/uploads/<uuid>?digest=X`. Audit emit-BEFORE-mutation on every state change (blob put, manifest put, tag update). See `specs/_proposals/adapters/oci.md` for the executable spec."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
# Apex types — TenantId, Digest, SecretWrap. Charter constraint:
# every secret in this crate (PAT, bearer token bytes) is held as
# `SecretWrap` so drops zeroize and Debug refuses to leak.
corelink-core = { workspace = true }
# Canonical audit chokepoint — emit BEFORE every state-mutating
# operation (blob put, manifest put, tag update) per
# INV-AUDIT-EMIT-ATOMIC-WITH-HANDLER.
corelink-audit = { workspace = true }
# Tracing fields for the OCI server.
tracing = { workspace = true }

# HTTP server stack — axum 0.7 + tower + http 1.x (hyper 1 underneath),
# matching the rest of the workspace.
axum = { workspace = true }
http = { workspace = true }
tower = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
# Async traits for the local ports (BlobStore / ManifestKvStore /
# TenantResolver) — same crate the rest of the workspace uses.
async-trait = { workspace = true }
# Panic-free Mutex on the hot in-memory ports + upload-session map.
# `parking_lot::Mutex` matches the workspace-wide perf-04 choice.
parking_lot = { workspace = true }

# Wire shape — manifest JSON + tag list + token response bodies.
serde = { workspace = true }
serde_json = { workspace = true }

# Errors.
thiserror = { workspace = true }
# UUID v4 for upload-session ids (no chronology requirement; v4 avoids
# leaking monotonic creation order across tenants).
uuid = { workspace = true }
# SHA-256 — OCI digest algorithm. CoreLink Digest is BLAKE3; the OCI
# digest is computed independently from the bytes on PUT to enforce
# the declared-digest fail-CLOSED check.
sha2 = { workspace = true }
# Hex encoding for `sha256:<hex>` digest serialization.
hex = { workspace = true }
# Base64 for the `Authorization: Basic <base64(user:pat)>` token
# challenge response leg.
base64 = { workspace = true }
# HMAC-SHA256 for the bearer-token signing (separate key from PAT
# signing — see config.rs `HUGR_OCI_TOKEN_KEY`).
hmac = { workspace = true }
# Constant-time compare for bearer-token verify per L2.10 (and the
# charter `subtle::ConstantTimeEq` rule for any authn-relevant path).
subtle = { workspace = true }
# `secrecy::ExposeSecret` is needed at the HMAC-key consume site
# (config sanity-check + auth.rs sign / verify). Same version as the
# `corelink-core::SecretWrap` impl uses (corelink-core/Cargo.toml).
secrecy = "0.10"

[dev-dependencies]
# Async test runtime for the integration tests.
tokio = { workspace = true }
# Property tests for the digest bridge + manifest schema validation.
proptest = { workspace = true }
# `tower::ServiceExt::oneshot` for direct axum router dispatch in
# integration tests (no live socket needed — keeps the suite fast +
# deterministic + crane-binary-independent).
tower = { workspace = true }
# `http_body_util::BodyExt::collect` for draining response bodies in
# the integration tests.
http-body-util = { workspace = true }
# Direct use of axum + http in the test rig for `Request`/`Body`/etc.
axum = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
# Required by `tests/common.rs` to construct the SecretWrap key + the
# audit emitter directly.
corelink-core = { workspace = true }
corelink-audit = { workspace = true }
