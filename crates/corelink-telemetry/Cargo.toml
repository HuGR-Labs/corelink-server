[package]
name = "corelink-telemetry"
description = "CoreLink canonical telemetry crate. W35-P2-TELEMETRY (2026-05-26) absorbed five sub-crates (`corelink-canary`, `corelink-lighthouse-tracker`, `corelink-logpush`, `corelink-otel-export`, `corelink-synthetic-pager`) as inline modules under `corelink_telemetry::{canary,lighthouse,logpush,otel,synthetic_pager}`. The remaining aggregator tenants (`corelink-tracing`, `corelink-slo`) are still re-exported under `corelink_telemetry::{tracing,slo}` pending Stage 1's consumer-migration sweep. Per `specs/_audits/sealed/2026-05-26-wave-33-34-closure-followups.md` §4."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Re-export targets — Stage 0 Option-A aggregator tenants whose
# physical absorption is still deferred to Stage 1+.
corelink-tracing = { workspace = true }
corelink-slo = { workspace = true }

# W35-P2-TELEMETRY absorbed deps — union of the 5 sub-crates physically
# moved into `src/{canary,lighthouse,logpush,otel,synthetic_pager}/`.
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v7", "v4", "serde"] }
subtle = { workspace = true }
tracing = { workspace = true }
corelink-analytics = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
rand = "0.10"
rand_chacha = "0.10"

[[test]]
name = "prop_canary"
path = "tests/prop_canary.rs"

[[test]]
name = "prop_logpush"
path = "tests/prop_logpush.rs"

[[test]]
name = "pii_redaction_100k_synthetic"
path = "tests/pii_redaction_100k_synthetic.rs"

[[test]]
name = "migration_canonical_0016"
path = "tests/migration_canonical_0016.rs"

[[test]]
name = "prop_otel_export"
path = "tests/prop_otel_export.rs"

[[test]]
name = "prop_synthetic_pager"
path = "tests/prop_synthetic_pager.rs"
