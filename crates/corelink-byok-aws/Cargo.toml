[package]
name = "corelink-byok-aws"
description = "CoreLink BYOK AWS KMS adapter — AwsKmsProvider implements KmsProvider trait (WI-S14-004). FIPS 140-3 Level 1 (AWS KMS default). Envelope: wrap_dek (kms:Encrypt) + unwrap_dek (kms:Decrypt) + check_access (kms:DescribeKey). IAM minimal scope: kms:Encrypt + kms:Decrypt + kms:DescribeKey only. AAD encryption_context mandatory binding {tenant_id, blob_hash}. Latency SLO p99 ≤ 30 ms region-co-located."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[features]
default = []
# `real` opts in to the live AWS KMS path (`AwsKmsRealProvider`); without
# it the crate only exposes `AwsKmsProvider` (mock + ARN validation +
# constants). The server crate exposes `byok-aws-real` which forwards
# here. The `real` feature has no effect on `wasm32-unknown-unknown` —
# wasm32 always links the `AwsKmsWasmStub`.
real = []

[dependencies]
corelink-byok = { path = "../corelink-byok" }

# Async
async-trait = { workspace = true }

# Serde
serde = { workspace = true }
serde_json = { workspace = true }

# RFC 8785 JCS canonical JSON — used for AAD / encryption_context
# canonicalization per INV-BYOK-CRYPTO-SOVEREIGNTY (the same canonical
# bytes must be reproducible across architectures including wasm32 so
# that AAD-bound ciphertext can be verified anywhere).
serde_jcs = { workspace = true }

# Constant-time byte comparison for AAD fingerprint / digest checks.
subtle = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Observability
tracing = { workspace = true }

# ── Native-only AWS SDK stack ─────────────────────────────────────────────
# The official `aws-sdk-kms` crate uses tokio + hyper + OS-level TLS and
# does not build for `wasm32-unknown-unknown`. On wasm32 (Cloudflare
# Worker) we instead link `AwsKmsWasmStub` (see `src/real.rs`) which
# returns an explicit `BYOKError::Provider` from every call; the
# production wasm path uses the Workers-side AWS SDK binding via fetch.
# See `specs/_audits/2026-05-15-byok-real-provider-pattern.md`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aws-config = { workspace = true }
aws-sdk-kms = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
tokio = { workspace = true }
getrandom = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }

[[test]]
name = "aws_unit"
path = "tests/aws_unit.rs"

[[test]]
name = "real_unit"
path = "tests/real_unit.rs"

[[test]]
name = "e2e_byok_aws_kms"
path = "tests/e2e_byok_aws_kms.rs"
