[package]
name = "corelink-byok"
description = "Wave-35 Phase 2 — physically absorbs the 6 former byok-* sub-crates (core / revocation / aws / gcp / azure / vault) into a single canonical umbrella. Preserves the Wave-33 microkernel public surface: `corelink_byok::*` re-exports the BYOK core (KmsProvider trait + envelope encryption + DekCache + types), `corelink_byok::revocation::*` exposes the always-on CMK kill-switch detector, and the 4 per-provider namespaces (`corelink_byok::{aws,gcp,azure,vault}`) remain MUTUALLY EXCLUSIVE at compile time behind cargo features (`aws` / `gcp` / `azure` / `vault`). The `compile_error!` denial of multi-provider builds (charter Hard Pause Trigger 2) is preserved unchanged on the public namespace surface. Internal `byok_<provider>` modules are unconditionally compiled so the matrix integration tests can exercise the full 4-provider × 4-op surface without activating mutually-exclusive features; this matches the pre-absorption behaviour where matrix tests linked all 4 provider crates as dev-dependencies (dev-deps never trigger umbrella feature gates). cargo-deny enforces the single-provider-SDK contract per binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Default = no provider namespace re-exported. The core trait
# surface + revocation detector are always reachable.
default = []

# ── Public provider namespace features ────────────────────────────────────
# MUTUALLY EXCLUSIVE at compile time (see lib.rs `compile_error!`
# gates). Selecting more than one is a build error, preserving the
# wave-33 reorg spec §3 microkernel contract on the public API
# surface. Each public feature transitively activates the matching
# `_internal-<provider>` module-compile feature plus the
# real/production sub-feature; the mutual-exclusion guard checks
# ONLY the public features, so combining `_internal-*` flags for
# matrix-test purposes does NOT trip the guard.
aws = ["_internal-aws", "real-aws"]
gcp = ["_internal-gcp", "production-gcp"]
azure = ["_internal-azure", "production-azure"]
vault = ["_internal-vault", "real-vault"]

# ── Internal module-compile gates ─────────────────────────────────────────
# These exist solely to drive `#[cfg(feature = "_internal-<X>")]` on
# the `mod byok_<X>;` declarations. They are an implementation
# detail and intentionally underscored — downstream consumers must
# NEVER activate them directly. The matrix integration tests
# (`tests/matrix*.rs`) declare `required-features` against all four
# `_internal-*` flags so the mock-mode provider trait surface is
# reachable in a single test binary without engaging the public
# mutual-exclusion gates.
_internal-aws = []
_internal-gcp = []
_internal-azure = []
_internal-vault = []
_matrix-test = ["_internal-aws", "_internal-gcp", "_internal-azure", "_internal-vault"]

# Production / real flavour sub-features for the absorbed providers.
# `production-gcp` activates the live Cloud KMS HTTPS client
# (reqwest + jsonwebtoken + base64 + regex); `production-azure`
# activates the live Key Vault REST client (reqwest + regex).
# `real-vault` opts in to the live Vault Transit HTTPS path.
# `real-aws` is currently a no-op flavour gate (AWS SDK is
# unconditional on native targets; preserved for forward-compat).
# The original `corelink-byok-{gcp,azure}/production` and
# `corelink-byok-vault/real` pass-through features from the
# pre-absorption umbrella are folded into these.
production-gcp = ["_internal-gcp", "dep:jsonwebtoken"]
production-azure = ["_internal-azure"]
real-vault = ["_internal-vault"]
real-aws = ["_internal-aws"]

[dependencies]
# Wave-35 Phase 2 absorbed-crate union — formerly split across
# `corelink-byok-{core,revocation,aws,gcp,azure,vault}`. Direct
# dependency on the workspace, third-party-only.

# Error handling
thiserror = { workspace = true }

# Serde
serde = { workspace = true }
serde_json = { workspace = true }

# Async (trait — wasm32-safe, header-only proc-macro)
async-trait = { workspace = true }

# Crypto — AES-256-GCM body encryption (envelope + Azure composite AAD wrap)
aes-gcm = { workspace = true }

# Crypto — memory safety
zeroize = { workspace = true }
subtle = { workspace = true }

# Observability
tracing = { workspace = true }

# LRU cache (byok_core::dek_cache)
lru = { workspace = true }

# RFC 8785 JCS canonical JSON — AAD canonicalization shared by every
# provider (AWS / GCP / Azure / Vault). INV-BYOK-CRYPTO-SOVEREIGNTY:
# the same canonical bytes must be reproducible across native and
# wasm32 so AAD-bound ciphertext can be verified anywhere.
serde_jcs = { workspace = true }

# HKDF-SHA256 — convergent (Mode A) DEK + nonce derivation from the
# per-tenant Tenant Convergence Secret (TCS). `sha2` is also used for
# the DEK-cache enc-context hash. Both are pure-Rust and compile to
# wasm32; the convergence layer must derive identically across targets.
hkdf = { workspace = true }
sha2 = { workspace = true }

# Base64 — Azure RSA-OAEP wrapped-key body + Vault transit context.
base64 = { workspace = true }

# ── Native (non-wasm32) deps ──────────────────────────────────────────────
# Workspace `tokio = { features = ["full"] }` pulls `mio` + `net` +
# `rt-multi-thread` which do not compile for `wasm32-unknown-unknown`.
# Gating native preserves `tokio = "full"` on all server / native paths
# while letting wasm32 link a minimal `sync`-only tokio.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
getrandom = { workspace = true }

# Vault HTTP path is always linked on native (matches pre-absorption
# behaviour of `corelink-byok-vault`, where `reqwest` was unconditional
# on the non-wasm32 dep block). Vault Enterprise FIPS mTLS binding
# preserved.
reqwest = { workspace = true }
regex = "1"

# AWS SDK stack — always linked on native (matches pre-absorption
# behaviour of `corelink-byok-aws`, where `aws-sdk-kms` + `aws-config`
# were unconditional non-wasm32 deps; the `real` feature was a no-op).
aws-config = { workspace = true }
aws-sdk-kms = { workspace = true }

# GCP production deps — gated by `production-gcp` (or transitively
# by the public `gcp` namespace feature). Without `production-gcp`,
# `byok_gcp::real::*` falls back to the mock stub.
jsonwebtoken = { version = "10.4", optional = true }

# ── wasm32 enablement (R-prep BYOK unblock 2026-05-15) ────────────────────
# `getrandom` 0.2 fails to compile on `wasm32-unknown-unknown` unless the
# `js` feature is enabled (routes CSPRNG calls through WebCrypto via
# `js-sys`). `tokio` is reduced to the `sync` feature only — the lib
# touches `tokio::sync::Mutex` and nothing else from tokio at runtime
# (no `net` / `rt-multi-thread` / `time`). All HTTP clients (aws-sdk-kms,
# reqwest, jsonwebtoken) are native-only; wasm32 links the matching
# `*WasmStub` types instead. See specs/_audits/sealed/2026-05-15-byok-real-provider-pattern.md.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
tokio = { version = "1", default-features = false, features = ["sync"] }

[dev-dependencies]
proptest = { workspace = true }
tokio-test = { workspace = true }
tokio = { workspace = true }
getrandom = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
criterion = { workspace = true }
# Wasm32 stub tests use `futures::executor::block_on` to drive the
# non-yielding stub future without a full async runtime.
futures = { workspace = true }
# Native HTTP mock harness for byok_gcp / byok_azure / byok_vault real
# provider unit tests.
wiremock = "0.6"

[[bench]]
name = "envelope_roundtrip"
harness = false

