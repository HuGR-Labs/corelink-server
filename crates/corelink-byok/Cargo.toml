[package]
name = "corelink-byok"
description = "Wave-33 Stage 1 Stream B sub-step B.2b — canonical BYOK microkernel umbrella aggregator. Re-exports `corelink-byok-core` (KmsProvider trait + envelope encryption + DekCache) at the crate root for backwards-compatible consumer paths (`use corelink_byok::KmsProvider;`), and exposes per-provider adapter modules behind 4 cargo features (`aws` / `gcp` / `azure` / `vault`) that are MUTUALLY EXCLUSIVE at compile time. The `revocation` submodule is always-on (it composes with whatever provider is enabled). This is the modular monolith × microkernel boundary per `specs/_audits/2026-05-22-wave33-code-reorg-spec.md` §3: one provider per deployment, selected at build time, with `compile_error!` denial of multi-provider builds (charter Hard Pause Trigger 2 — BYOK mutual-exclusion enforcement at compile time)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[features]
# Default = no provider selected. Builds the trait surface + revocation
# detector only, which is what apps/server consumes when wiring tests
# against InMemoryFake providers; matches the pre-wave-33 default
# build behaviour of the original `corelink-byok` crate.
default = []

# Provider features — MUTUALLY EXCLUSIVE at compile time (see lib.rs
# `compile_error!` gate). Selecting more than one is a build error,
# preserving the wave-33 reorg spec §3 microkernel contract.
aws = ["dep:corelink-byok-aws"]
gcp = ["dep:corelink-byok-gcp"]
azure = ["dep:corelink-byok-azure"]
vault = ["dep:corelink-byok-vault"]

# Wave-33 Stage 1 Stream B sub-step B.2c — preserved from the
# absorbed `corelink-byok-matrix-test` crate. These features opt the
# matrix integration tests (`tests/matrix.rs`, `tests/matrix_prop.rs`,
# `tests/matrix_adversarial.rs`) into REAL provider mode when the
# matching env var (`GCP_TEST_KEY_RESOURCE` / `AZURE_TEST_KEY_RESOURCE`)
# is set. Default off — CI runs in mock mode without provider creds.
# These features DO NOT enable the matching provider's main `aws` /
# `gcp` / `azure` / `vault` feature on the umbrella, so they do not
# trigger the mutual-exclusion `compile_error!` gates. The integration
# tests reference the provider crates as direct dev-dependencies; the
# `corelink-byok-{gcp,azure}/production` sub-feature is forwarded so
# the real HTTPS client is linkable inside the test crate.
production-gcp = ["corelink-byok-gcp/production"]
production-azure = ["corelink-byok-azure/production"]

[dependencies]
# Core trait + types (always present; re-exported at crate root for
# backwards-compatible `use corelink_byok::KmsProvider;` paths).
corelink-byok-core = { workspace = true }

# Revocation detector — always-on; composes with whichever provider is
# enabled (or none, in InMemoryFake test wiring).
corelink-byok-revocation = { workspace = true }

# Provider adapters — optional, gated by mutually-exclusive features.
corelink-byok-aws = { workspace = true, optional = true }
corelink-byok-gcp = { workspace = true, optional = true }
corelink-byok-azure = { workspace = true, optional = true }
corelink-byok-vault = { workspace = true, optional = true }

[dev-dependencies]
# Wave-33 Stage 1 Stream B sub-step B.2c — folded matrix tests
# (formerly `corelink-byok-matrix-test`, 31 LOC src/ shell dropped
# as unused). The 3 matrix test files (`matrix.rs`,
# `matrix_adversarial.rs`, `matrix_prop.rs`) exercise the full
# 4-provider × 4-op matrix + adversarial + property-test surface.
# They directly link every provider adapter — this DOES NOT
# violate the BYOK microkernel mutual-exclusion contract because
# the `compile_error!` guards live in this crate's `lib.rs` (gated
# by FEATURES of `corelink-byok`, not by direct dependencies of
# integration tests). Integration test crates have their own
# crate boundary and do not activate the umbrella's feature flags.
corelink-byok-core = { workspace = true }
corelink-byok-aws = { workspace = true }
corelink-byok-gcp = { workspace = true }
corelink-byok-azure = { workspace = true }
corelink-byok-vault = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
proptest = { workspace = true }
