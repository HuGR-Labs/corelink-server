# the public mutual-exclusion gate is NOT engaged because no public
# namespace feature is activated). Drive the 4 providers × 4 ops
# matrix + adversarial regressions + property tests.
[[test]]
name = "matrix"
path = "tests/matrix.rs"
required-features = ["_matrix-test"]

[[test]]
name = "matrix_adversarial"
path = "tests/matrix_adversarial.rs"
required-features = ["_matrix-test"]

[[test]]
