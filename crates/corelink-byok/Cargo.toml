[package]
name = "corelink-byok"
description = "Wave-33 Stage 1 Stream B sub-step B.2b — canonical BYOK microkernel umbrella aggregator. Re-exports `corelink-byok-core` (KmsProvider trait + envelope encryption + DekCache) at the crate root for backwards-compatible consumer paths (`use corelink_byok::KmsProvider;`), and exposes per-provider adapter modules behind 4 cargo features (`aws` / `gcp` / `azure` / `vault`) that are MUTUALLY EXCLUSIVE at compile time. The `revocation` submodule is always-on (it composes with whatever provider is enabled). This is the modular monolith × microkernel boundary per `specs/_audits/2026-05-22-wave33-code-reorg-spec.md` §3: one provider per deployment, selected at build time, with `compile_error!` denial of multi-provider builds (charter Hard Pause Trigger 2 — BYOK mutual-exclusion enforcement at compile time)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[features]
# Default = no provider selected. Builds the trait surface + revocation
# detector only, which is what apps/server consumes when wiring tests
# against InMemoryFake providers; matches the pre-wave-33 default
# build behaviour of the original `corelink-byok` crate.
default = []

# Provider features — MUTUALLY EXCLUSIVE at compile time (see lib.rs
# `compile_error!` gate). Selecting more than one is a build error,
# preserving the wave-33 reorg spec §3 microkernel contract.
aws = ["dep:corelink-byok-aws"]
gcp = ["dep:corelink-byok-gcp"]
azure = ["dep:corelink-byok-azure"]
vault = ["dep:corelink-byok-vault"]

[dependencies]
# Core trait + types (always present; re-exported at crate root for
# backwards-compatible `use corelink_byok::KmsProvider;` paths).
corelink-byok-core = { workspace = true }

# Revocation detector — always-on; composes with whichever provider is
# enabled (or none, in InMemoryFake test wiring).
corelink-byok-revocation = { workspace = true }

# Provider adapters — optional, gated by mutually-exclusive features.
corelink-byok-aws = { workspace = true, optional = true }
corelink-byok-gcp = { workspace = true, optional = true }
corelink-byok-azure = { workspace = true, optional = true }
corelink-byok-vault = { workspace = true, optional = true }

[dev-dependencies]
# Smoke tests rely on these being reachable via the public surface.
