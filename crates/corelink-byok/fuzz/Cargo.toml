[workspace]

[package]
name = "corelink-byok-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "UNLICENSED"
description = "cargo-fuzz harnesses for corelink-byok envelope encryption (pre-pentest hardening). Targets: wrapped_dek_parse — arbitrary bytes through serde + envelope decrypt; envelope_roundtrip — encrypt-then-decrypt invariant under random key/aad/plaintext."

[package.metadata]
cargo-fuzz = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"

[dependencies]
libfuzzer-sys = "0.4"
corelink-byok = { path = ".." }
serde_json = "1"
arbitrary = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt"] }
async-trait = "0.1"

[[bin]]
name = "wrapped_dek_parse"
path = "fuzz_targets/wrapped_dek_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "envelope_roundtrip"
path = "fuzz_targets/envelope_roundtrip.rs"
test = false
doc = false
bench = false
