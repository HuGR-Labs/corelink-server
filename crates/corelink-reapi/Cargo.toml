path = "tests/prop_cross_tenant_read.rs"

[[test]]
name = "read_handler_e2e"
path = "tests/read_handler_e2e.rs"

[[test]]
name = "prop_find_missing_batch"
path = "tests/prop_find_missing_batch.rs"

[[test]]
name = "find_missing_handler_e2e"
path = "tests/find_missing_handler_e2e.rs"

[[test]]
name = "batch_read_blobs_e2e"
path = "tests/batch_read_blobs_e2e.rs"

[[test]]
name = "timing_padding_grpc_e2e"
path = "tests/timing_padding_grpc_e2e.rs"

[[test]]
