[package]
name = "corelink-reapi"
description = "CoreLink REAPI v2 handlers — `BatchUpdateBlobs`, `ByteStream::Write`, `Capabilities::GetCapabilities` (WI-S01-005). Tonic-based gRPC services that orchestrate `corelink-hash` (BLAKE3 verify), `corelink-worker` (R2 PUT), and `corelink-meta` (D1 batch + audit outbox) into the canonical CAS write path."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[features]
# `host-server` pulls the tonic + tokio runtime that lets the handlers run as
# a host-side gRPC server (developer machines, CI integration tests). Real
# Cloudflare Workers deploy uses `tonic-web` + `worker::Router` integration in
# a follow-up WI; that path stays out of `host-server`. The crate's pure-logic
# modules (`audit`, `error_map`, `pat`, `capabilities`, `orchestrator`)
# compile to wasm32 without `host-server`.
#
# The `host-server` feature ALSO opts into uuid's `v7` + `rng-getrandom` so
# the gRPC handler can mint correlation ids when the client omits
# `x-request-id`. The wasm32 build path does not need a runtime UUID
# generator (it uses content-derived deterministic ids only) so we keep
# `getrandom` out of the wasm closure.
default = ["host-server"]
host-server = [
    "dep:tonic",
    "dep:prost",
    "dep:prost-types",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:async-trait",
    "dep:tower",
    "dep:tower-layer",
    "dep:http",
    "dep:axum",
    "dep:http-body-util",
    "uuid/v7",
    "uuid/rng-getrandom",
    # Pull the WI-S02-004 timing-padding middleware into the host-server
    # build so the canonical layer is mounted on `cas_get_router` (HTTP
    # REST) and on the gRPC stack via the `MissMarker` extension.
    "corelink-worker/tower-middleware",
]

[dependencies]
corelink-hash = { workspace = true }
corelink-tenant-path = { workspace = true }
corelink-worker = { workspace = true }
corelink-meta = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["serde"] }
tracing = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
# `futures` is consumed by the pure-logic `find_missing` orchestrator
# (`stream::iter().buffer_unordered(MAX_PARALLEL_AUTHZ)`); the crate is
# `no_std`-friendly + wasm32-clean so it stays out of `host-server` so
# the find-missing batch dispatcher can be reused inside a Cloudflare
# Worker pure-logic build.
futures = { workspace = true }

# Host-server runtime (gated behind feature).
tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
prost-types = { version = "0.13", optional = true }
tokio = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
async-trait = { version = "0.1", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tower-layer = { version = "0.3", optional = true }
http = { version = "1", optional = true }
# HTTP REST surface (`GET /v1/cas/<digest>`) — host-server feature only.
axum = { version = "0.7", default-features = false, features = ["http1", "http2", "tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true }
zeroize = { workspace = true }
hex = { workspace = true }
async-trait = "0.1"
# WI-S02-006 cross-component property + bit-rot integration tests
# exercise the WI-S02-003 SDK verifier as a downstream consumer of the
# read path. Dev-only — production code does not link client-verify
# from the server crate (the SDK is consumed by client SDKs in S-15).
corelink-client-verify = { workspace = true }
# HTTP client for the read_handler_e2e tests (the production wire client
# is left to S-15 SDK; these tests use raw hyper to avoid pulling
# reqwest into the workspace just for tests).
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
http = "1"

[build-dependencies]
tonic-build = { workspace = true }

[[test]]
name = "canonical_vectors"
path = "tests/canonical_vectors.rs"

[[test]]
name = "prop_idempotency"
path = "tests/prop_idempotency.rs"

[[test]]
name = "handler_e2e"
path = "tests/handler_e2e.rs"

[[test]]
name = "capabilities"
path = "tests/capabilities.rs"

[[test]]
name = "prop_cas"
path = "tests/prop_cas.rs"

[[test]]
