[package]
name = "corelink-reapi-fuzz"
version = "0.1.0"
edition = "2021"
publish = false
license = "UNLICENSED"
description = "cargo-fuzz harnesses for corelink-reapi — protobuf BatchUpdate decode robustness, audit request-id totality, and ReadResource resource-name parser stability under arbitrary inputs."

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
prost = "0.13"
corelink-reapi = { path = ".." }

[[bin]]
name = "proto_decode_batch_update"
path = "fuzz_targets/proto_decode_batch_update.rs"
test = false
doc = false

[[bin]]
name = "audit_request_id_total"
path = "fuzz_targets/audit_request_id_total.rs"
test = false
doc = false

[[bin]]
name = "parse_read_resource_name"
path = "fuzz_targets/parse_read_resource_name.rs"
test = false
doc = false
