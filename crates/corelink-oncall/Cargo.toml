[package]
name = "corelink-oncall"
description = "CoreLink oncall scheduler + fatigue tracking + PagerDuty integration trait (WI-S17-005 — S-17 ops STANDARD lane). Ships Engineer + Rotation (`#[non_exhaustive]`) + Tier (`Tier1` / `Tier2` / `Tier3`) + ShiftId + PageEvent + Severity (`Sev0` / `Sev1` / `Sev2` / `Sev3`) + FatigueWindow (`Rolling7d` / `Rolling30d`) + FatigueScore (sum of pages per window) + FatigueThreshold canonical (Sev1HardHandoff>3/shift; Sev2HardHandoff>8/shift; PagesPerMonthHardBlock>15) + RotationLedger (per-engineer page log + handoff event log + Arc<Mutex<>> in-memory; audit-emit-BEFORE-mutation fail-CLOSED) + PagerDutyClient trait + InMemoryPagerDutyClient (rotation roster + page dispatch fake) + FailingPagerDutyClient adversarial fixture + ScheduleHandoffDecision (`KeepCurrent` / `RotateToBackup` / `MandatoryRotationBlock`) + OncallAuditEventType `#[non_exhaustive]` 5-canonical taxonomy (`corelink.oncall.{shift_started, shift_ended, page_recorded, fatigue_threshold_breached, handoff_executed}`) + OncallError `#[non_exhaustive]` taxonomy. Production PagerDuty Events API v2 + Schedule API HTTPS calls + Grafana dashboard wiring (`dashboards/grafana/DASH-ONCALL-FATIGUE.json`) + D1 migration `0036_oncall_pages.sql` + runbook `RB-ONCALL-POLICY.md` deferred to PRR ship gate per `trait-abstraction-defer` charter pattern; this crate ships the pure-logic skeleton + fakes + dashboard JSON + migration + policy doc."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
thiserror = { workspace = true }
# Optional — only pulled when the `production` feature is on. The
# blocking reqwest client gives us a tokio-free HTTPS POST surface
# (the crate-wide constraint forbids `tokio` in src/), while still
# leveraging rustls for TLS termination.
reqwest = { workspace = true, optional = true, features = ["blocking", "json", "rustls-tls"], default-features = false }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
default = []
# `production` enables the real PagerDuty Events API v2 HTTPS client +
# Slack webhook fallback on retry exhaustion (R2-3). Gated behind a
# feature so the pure-logic skeleton (WI-S17-005 default surface)
# stays I/O-free.
production = ["dep:reqwest", "dep:serde", "dep:serde_json"]

[dev-dependencies]
proptest = { workspace = true }
mockito = "1"
serde = { workspace = true }
serde_json = { workspace = true }

[[test]]
name = "prop_oncall"
path = "tests/prop_oncall.rs"
