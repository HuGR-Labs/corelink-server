[package]
name = "corelink-ops"
description = "Wave-33 Stage 1 Stream C sub-step C.2 — canonical ops-context aggregator façade. W35-P2 update: 15 of the 28 absorbed ops crates flipped to Option-B physical absorption (oncall, drata, deploy, customer-alerts, d1-migrations, survey, tenant-offboarding, admin-api, admin-dry-run, config-api, dr-drill, backup-verify, rotation-worker, supply-chain-policy, supply-verify). 13 still re-exported (statuspage, slack, handler-admin, dual-approval, enterprise-inquiry, runbook-tracker, terraform-drift-consumer, chaos-scheduler, rotation-adapters, dt-webhook, config-do; dt-cli + dt-reconcile are binary-only)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Re-export targets (Stage 1 Stream C Option-A aggregator: still-external
# crates re-exported as thin façades from `corelink_ops::<mod>`).
corelink-statuspage-real = { workspace = true }
corelink-slack-real = { workspace = true }
corelink-handler-admin = { workspace = true }
corelink-dual-approval = { workspace = true }
corelink-enterprise-inquiry = { workspace = true }
corelink-runbook-tracker = { workspace = true }
corelink-terraform-drift-consumer = { workspace = true }
corelink-chaos-scheduler = { workspace = true }
corelink-rotation-adapters = { workspace = true }
# `corelink-dt-cli` and `corelink-dt-reconcile` are binary-only crates
# (no `src/lib.rs`) so they cannot be re-exported into the umbrella's
# library surface. They remain workspace binary targets; see
# `src/dt.rs` for the canonical-import audit trail.
corelink-dt-webhook = { workspace = true }
corelink-config-do = { workspace = true }

# Cross-crate dependencies of the absorbed (W35-P2-OPS) modules.
# W35-P2-BYOK: byok-core + byok-revocation physically absorbed into
# corelink-byok umbrella; symbols reached via `corelink_byok::*` (core)
# and `corelink_byok::revocation::*`.
corelink-byok = { workspace = true }
corelink-failover-router = { workspace = true }
corelink-replica-worker = { workspace = true }
corelink-audit = { workspace = true }

# Direct third-party deps merged from the 15 absorbed crates:
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7", "serde"] }
async-trait = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
subtle = { workspace = true }
base64 = { workspace = true }
zeroize = { workspace = true }
anyhow = { workspace = true }
# tokio is required by customer-alerts + admin-dry-run library surfaces.
# Host-only on wasm32 (gated below).
tokio = { workspace = true }
# admin-dry-run binaries use tracing_subscriber + tokio_test runners.
tracing-subscriber = { workspace = true }
tokio-test = { workspace = true }
# d1-migrations: rusqlite with bundled libsqlite3 (CI host-only).
rusqlite = { version = "0.40", features = ["bundled"] }
# drata-sync: synchronous blocking HTTPS client (no tokio in src/).
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
# supply-verify CLI deps:
clap = { version = "4", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["v7", "serde", "js"] }

[features]
default = []
# `production` enables the real PagerDuty Events API v2 HTTPS client +
# Slack webhook fallback on retry exhaustion (R2-3). Gated behind a
# feature so the pure-logic skeleton (WI-S17-005 default surface)
# stays I/O-free. Inherited from absorbed `corelink-oncall`.
production = []

[dev-dependencies]
proptest = { workspace = true }
mockito = "1"
wiremock = "0.6"
rand = "0.9"
rand_chacha = "0.9"
# Cross-crate SLI binding tests (DR-16 wave-14, dr_backup_verify_sli_binding.rs):
corelink-slo = { workspace = true }

