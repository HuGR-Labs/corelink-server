[package]
name = "corelink-worker"
description = "CoreLink Worker storage adapters — R2 single-blob CAS writer/reader (WI-S01-003); HMAC tenant path enforcement; If-None-Match idempotent semantics. Optional Tower middleware (`tower-middleware` feature) hosts the constant-time 404 timing-padding layer (WI-S02-004) — INV-CAS-SIDE-CHANNEL-INDISTINGUISHABLE."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Default profile excludes the Tower middleware so the pure-logic
# storage-adapter modules (`storage::r2`, `storage::blob_store`, …) keep
# building cleanly to `wasm32-unknown-unknown` without pulling http /
# tower / tokio. The `tower-middleware` feature opts in to the
# WI-S02-004 constant-time 404 timing-padding layer; consumers that wire
# the middleware into the host-server gRPC/HTTP stack (corelink-reapi
# `host-server` feature) flip this on.
default = []
tower-middleware = [
    "dep:tower",
    "dep:tower-layer",
    "dep:tower-service",
    "dep:http",
    "dep:tokio",
    "dep:pin-project-lite",
    "dep:rand",
    "dep:rand_chacha",
    "dep:tracing",
    "dep:futures",
    "dep:corelink-clerk",
    "dep:corelink-pat",
    "dep:subtle",
    "dep:sha2",
    "dep:hmac",
    "dep:async-trait",
    "dep:serde",
]

[dependencies]
corelink-hash = { workspace = true }
corelink-tenant-path = { workspace = true }
corelink-ac = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }
# DEBT-013 OPT-04 phase 1 — replace `std::sync::Mutex` on CAS / AC
# in-memory backends with `parking_lot::Mutex` (no poisoning).
parking_lot = { workspace = true }

# Tower middleware (gated by `tower-middleware` feature).
tower = { version = "0.5", default-features = false, optional = true }
tower-layer = { version = "0.3", optional = true }
tower-service = { version = "0.3", optional = true }
http = { version = "1", optional = true }
tokio = { workspace = true, optional = true }
pin-project-lite = { version = "0.2", optional = true }
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "os_rng"], optional = true }
rand_chacha = { version = "0.9", default-features = false, features = ["std"], optional = true }
tracing = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
# Needs `jwt-adapter` so ClerkAdapter is available in the middleware;
# workspace entry now has `default-features = false` so we must be explicit.
corelink-clerk = { workspace = true, optional = true, features = ["jwt-adapter"] }
corelink-pat = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
async-trait = { version = "0.1", optional = true }
serde = { workspace = true, optional = true }

# R2-10 wasm32 enablement.
#
# The crate's default profile is intended to compile to
# `wasm32-unknown-unknown` (see the lib-level doc comment) so that
# `corelink-cf-bindings` can `impl R2Backend` / `impl KvBackend` over
# real `worker::r2::Bucket` / `worker::kv::KvStore` types. uuid v4 and
# both `getrandom` major versions need their `js` / `wasm_js` features
# gated by `cfg(target_arch = "wasm32")` so the browser/Worker CSPRNG
# is used instead of the host syscall (which has no wasm32 shim).
#
# This section only affects wasm32 builds — native `cargo test` is
# unchanged because cargo never resolves these entries for the host
# target. INV: native test count preserved at ≥ 314.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
# getrandom 0.4 entered the wasm graph via `uuid`'s `rng-getrandom` feature
# (tenant-path / corelink-audit / corelink-pat / …). Like 0.2/0.3 above it
# needs its wasm backend feature explicitly enabled here, or the 0.4.x
# `wasm32-unknown-unknown` build falls through to the `unsupported` backend
# stub (no `fill_inner`/`inner_u32`/`inner_u64` → E0425). The companion
# `--cfg=getrandom_backend="wasm_js"` rustflag is set in `.cargo/config.toml`.
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
futures = { workspace = true }
http = "1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tower-layer = "0.3"
tower-service = "0.3"
criterion = { workspace = true }
async-trait = "0.1"
# Both `jwt-adapter` (for ClerkAdapter) and `test-utils` (for TestRsaKey)
# are needed in tests; workspace entry now has default-features = false.
corelink-clerk = { workspace = true, features = ["jwt-adapter", "test-utils"] }
corelink-audit = { workspace = true }
corelink-pat = { workspace = true }
jsonwebtoken = "9.3"
serde_json = { workspace = true }
serde = { workspace = true }
rsa = "0.9"
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "os_rng"] }
# Cross-component prop test (`prop_auth_full.rs`) needs to inspect
# the PHC string parameters directly + craft fixed Argon2 salts.
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
password-hash = { version = "0.5", default-features = false, features = ["alloc"] }
base64 = { workspace = true }

[[test]]
name = "timing_indistinguishability"
path = "tests/timing_indistinguishability.rs"
required-features = ["tower-middleware"]

[[test]]
name = "prop_auth_middleware"
path = "tests/prop_auth_middleware.rs"
required-features = ["tower-middleware"]

[[test]]
name = "auth_middleware_smoke"
path = "tests/auth_middleware_smoke.rs"
required-features = ["tower-middleware"]

[[test]]
name = "prop_revocation"
path = "tests/prop_revocation.rs"
required-features = ["tower-middleware"]

[[test]]
name = "prop_auth_full"
path = "tests/prop_auth_full.rs"
required-features = ["tower-middleware"]

[[test]]
name = "prop_ac_handlers"
path = "tests/prop_ac_handlers.rs"
required-features = ["tower-middleware"]

[[test]]
name = "ac_handler_e2e"
path = "tests/ac_handler_e2e.rs"
required-features = ["tower-middleware"]

[[test]]
name = "prop_ac_ttl"
path = "tests/prop_ac_ttl.rs"
required-features = ["tower-middleware"]

[[test]]
name = "prop_split_splice"
path = "tests/prop_split_splice.rs"
required-features = ["tower-middleware"]

[[test]]
name = "prop_multipart_full"
path = "tests/prop_multipart_full.rs"
required-features = ["tower-middleware"]

[[test]]
name = "reapi_v2_split_splice_conformance"
path = "tests/reapi_v2_split_splice_conformance.rs"
required-features = ["tower-middleware"]

# WI-S12-006 — reproducible builds (no feature gate; host-only logic).
[[test]]
name = "prop_reproducible"
path = "tests/prop_reproducible.rs"

[[test]]
name = "adversarial_reproducible"
path = "tests/adversarial_reproducible.rs"

[[bench]]
name = "side_channel"
path = "benches/side_channel.rs"
harness = false
required-features = ["tower-middleware"]
