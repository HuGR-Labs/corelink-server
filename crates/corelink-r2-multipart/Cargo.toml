[package]
name = "corelink-r2-multipart"
description = "CoreLink R2 multipart adapter (WI-S05-003) — `MultipartAdapter` trait + `InMemoryMultipartAdapter` fake honouring the canonical R2 multipart contract: tenant-prefix-scoped object keys (5-Layer Defense Layer 4), idempotent initiate/upload_part/complete/abort, ETag-ordered Complete payload, per-tenant bounded concurrency semaphore, orphan multipart enumeration for the WI-S05-006 sweeper. Production shim wrapping `aws-sdk-s3` Cloudflare R2 binding deferred to WI-S05-006 conformance suite per charter trait-abstraction-defer pattern. wasm32-clean; same crate compiles into the Cloudflare Workers WASM bundle and the host-side test harness."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
corelink-tenant-path = { workspace = true }
bytes = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", default-features = false, features = ["sync"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
futures = { workspace = true }
zeroize = { workspace = true }

[[test]]
name = "prop_r2_multipart"
path = "tests/prop_r2_multipart.rs"

[[test]]
name = "chaos_r2_multipart"
path = "tests/chaos_r2_multipart.rs"
