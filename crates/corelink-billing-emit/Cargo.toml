[package]
name = "corelink-billing-emit"
description = "CoreLink CloudEvents 1.0 usage-event emitter + R2 append-only NDJSON sink + (tenant_id, request_id)-keyed idempotency tracker (WI-S10-001 — S-10 billing pipeline HIGH_RISK lane). Ships UsageEvent (CloudEvents 1.0 aligned: id / source / specversion=\"1.0\" / type=\"corelink.billing.usage.recorded\" / time / data + datacontenttype) extended with `idem_key` derived via BLAKE3-256 of the JCS (RFC 8785) canonical event bytes (with the idem_key slot zeroed for the link input — the key IS a function of the canonical payload). UsageEventKind `#[non_exhaustive]` 6-canonical taxonomy (StorageBytesHourly / EgressBytes / AcLookup / CasGet / CasPut / ReplayRequest). IdempotencyTracker trait + InMemoryIdempotencyTracker (set semantics on idem_key; insert returns IdempotencyDecision::Accepted on first sight + DuplicateRejected on replay). UsageEventEmitter trait + InMemoryUsageEventEmitter orchestrator (audit-emit-BEFORE-mutation per S-07 P1-1 + Lote 10.6bis envelope; idempotency check + R2 NDJSON write + audit at every decision arm: usage_emitted / duplicate_rejected / sink_failure / idempotency_collision). R2UsageSink trait + InMemoryR2UsageSink append-only NDJSON layout `usage/{tenant_id}/{billing_period YYYY-MM}/{seq:08}.usage.ndjson` (INV-BILLING-APPEND-ONLY: rejects overwrite at existing (tenant, billing_period, seq) key — analogous to INV-AUDIT-APPEND-ONLY). BillingEmitError `#[non_exhaustive]` taxonomy. Per-instance Arc<Mutex<>> F-001 closure. Production CF R2 PutObject + Cron drain + Cloudflare Queue retry + (tenant_id, request_id) UNIQUE D1 staging table mirror deferred to WI-S10-007 PRR ship gate per `trait-abstraction-defer` charter pattern."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_jcs = "0.2"
blake3 = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true, features = ["v7", "serde"] }
corelink-analytics = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
rand = "0.9"
rand_chacha = "0.9"

[[test]]
name = "prop_billing_emit"
path = "tests/prop_billing_emit.rs"
