[package]
name = "corelink-cas"
description = "Wave-33 Stage 1 Stream A sub-step A.1 — canonical Content-Addressable Storage (CAS) bounded-context aggregator façade. Re-exports the 10 absorbed crates that historically partitioned the CAS hot path (chunker, dedup, edge cache, eviction, LRU tracker, R2 multipart, multipart schema, meta-store, manifest, CAS handler) under a single canonical import surface (`corelink_cas::chunker`, `corelink_cas::dedup`, `corelink_cas::edge`, `corelink_cas::eviction`, `corelink_cas::lru_tracker`, `corelink_cas::r2_multipart`, `corelink_cas::multipart_schema`, `corelink_cas::meta`, `corelink_cas::manifest`, `corelink_cas::handler`). Stage 1 ships this crate as a re-export aggregator (Option-A least-invasive interpretation per Stage 0 SEAL §4) so downstream crates can adopt the canonical paths without disturbing existing CAS tests/benches/fuzz harnesses. Physical absorption of source modules is deferred to Stage 2 once consumers have migrated; see `specs/_audits/2026-05-22-wave33-code-reorg-spec.md` §6 + Stream A SEAL audit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
# Stage 0 cross-cutting deps (canonical import targets for any new
# code that lands inside this crate post-aggregator).
corelink-core = { workspace = true }
corelink-crypto = { workspace = true }
corelink-audit = { workspace = true }

# Re-export targets (Stage 1 Stream A sub-step A.1 Option-A aggregator:
# physical absorption deferred to Stage 2).
corelink-chunker = { workspace = true }
corelink-dedup = { workspace = true }
corelink-edge = { workspace = true }
corelink-eviction = { workspace = true }
corelink-lru-tracker = { workspace = true }
corelink-r2-multipart = { workspace = true }
corelink-multipart-schema = { workspace = true }
corelink-meta = { workspace = true }
corelink-manifest = { workspace = true }
corelink-handler-cas = { workspace = true }
