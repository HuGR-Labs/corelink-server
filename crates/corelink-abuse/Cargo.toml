[package]
name = "corelink-abuse"
description = "CoreLink heuristic abuse-detection scoring (WI-S08-004 — camada 4 of the 4-layer rate-limit bulkhead PAT-RATE-LIMIT-001). Ships AbuseScorer trait + InMemoryAbuseScorer orchestrator + AbuseFeatures (cpu_wallclock_ratio + egress_bytes_per_min + action_digest_entropy_bits + concurrent_exec_count per sprint contract §5 R-S08-7) + AbuseScore newtype clamped [0.0, 1.0] + AbuseDecision `#[non_exhaustive]` 3-arm gradient (Benign / Suspicious / Malicious) + canonical 4-feature weighted-sum scoring (canonical weights 0.30 cpu / 0.25 egress / 0.25 entropy / 0.20 exec sum 1.0 per WI §6.1.3) + automated response gradient (CAP-ABUSE-002: silent downgrade via tenant_rate_override + admin review trigger + extreme suspend NEVER auto-applied per LGPD Art. 20 + GDPR Art. 22 humane response sprint contract §7.10.s08.3) + audit fail-closed (corelink.abuse.{score_computed, decision_benign, decision_suspicious, decision_malicious, downgrade_applied, admin_review_triggered, suspend_applied}) + canonical D1 migration `0013_abuse_scores.sql` durable per-tenant score history (companion tables abuse_appeals / abuse_response_actions / abuse_calibration_weights deferred to WI-S08-006 PRR ship gate per `trait-abstraction-defer` charter pattern). Statistical calibration: n=50 benign + n=50 abusive synthetic workloads + 95% CI FP rate ≤ 5% upper-bound + 95% CI TP rate ≥ 80% lower-bound (Lote 10.8bis P0-E corrected; sprint contract §6 DoD)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
corelink-eviction = { workspace = true }
corelink-ratelimit = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
rand = "0.9"
rand_chacha = "0.9"

[[test]]
name = "prop_abuse"
path = "tests/prop_abuse.rs"

[[test]]
name = "calibration_abuse"
path = "tests/calibration_abuse.rs"

[[test]]
name = "migration_canonical_0013"
path = "tests/migration_canonical_0013.rs"
