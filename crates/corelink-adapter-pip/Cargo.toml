[package]
name = "corelink-adapter-pip"
description = "Wave-34 — PyPI caching proxy adapter for CoreLink. Implements PEP 503 (HTML Simple Repository API) + PEP 691 (JSON Simple Index). `pip install` (and `uv` / `poetry` / `pdm`) consult this adapter as a transparent caching mirror in front of `pypi.org`. Wheels (`.whl`) and source dists (`.tar.gz`) stored in CoreLink CAS keyed by their `#sha256=` URL-fragment digest; index JSON cached in tenant-scoped KV with TTL. Read-only mirror (no `twine` / upload). Mandatory pre-CAS-store integrity check rejects wheels whose downloaded bytes do not match the upstream `#sha256=` fragment. See spec `specs/_proposals/adapters/pip.md`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true, features = ["query"] }
tower = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
subtle = { workspace = true }
reqwest = { workspace = true }
url = "2"
secrecy = "0.10"
uuid = { workspace = true }
corelink-core = { workspace = true }
corelink-audit = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
tower = { workspace = true, features = ["util"] }
