[package]
name = "corelink-supply-verify"
description = "CoreLink SLSA L3 build provenance verifier (WI-S12-001): Fulcio keyless OIDC chain validation + Rekor transparency log inclusion proof + in-toto v1.0 attestation schema verification + customer-side CLI (`corelink-supply-verify verify|lookup|extract`). Implements SlsaProvenanceVerifier trait; emits 4 Prometheus metrics (supply/slsa/rekor/fulcio); OTel trace spans slsa.attestation.verify + slsa.attestation.generate. Mandatory gate: INV-SUPPLY-PROVENANCE-IN-REKOR (Rekor inclusion required; no graceful bypass). Foundation consumed by WI-S12-003 CF deploy webhook verifier."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
# Async runtime
tokio = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Serde
serde = { workspace = true }
serde_json = { workspace = true }

# Observability
tracing = { workspace = true }

# CLI
clap = { version = "4", features = ["derive"] }

# Base64 (DSSE envelope decode)
base64 = { workspace = true }

# Hex (digest display)
hex = { workspace = true }

# Async trait
async-trait = "0.1"

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[[bin]]
name = "corelink-supply-verify"
path = "src/bin/cli.rs"

[[test]]
name = "prop_verify"
path = "tests/prop_verify.rs"

[[test]]
name = "adversarial"
path = "tests/adversarial.rs"

[[example]]
name = "verify_basic"
path = "examples/verify_basic.rs"

[[example]]
name = "paranoid_mode"
path = "examples/paranoid_mode.rs"

[[example]]
name = "lookup"
path = "examples/lookup.rs"
