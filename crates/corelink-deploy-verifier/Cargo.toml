[package]
name = "corelink-deploy-verifier"
description = "CoreLink Cloudflare Workers deploy webhook verifier — hard gate non-bypassable: Cosign signature + Rekor inclusion proof + Fulcio chain validation before CF Workers rollout. Enforces INV-SUPPLY-SIGNED-DEPLOY (CRITICAL). Zero long-lived secrets (Cosign keyless OIDC). Audit emit fail-CLOSED (CTRL-AUDIT-002). HIGH_RISK lane FF-HR-005."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7", "serde"] }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
subtle = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tracing-subscriber = { workspace = true }

[[test]]
name = "prop_verify"
path = "tests/prop_verify.rs"

[[test]]
name = "adversarial"
path = "tests/adversarial.rs"

[[test]]
name = "chaos"
path = "tests/chaos.rs"

[[example]]
name = "verify_signed_deploy"
path = "examples/verify_signed_deploy.rs"

[[example]]
name = "unsigned_deploy_blocked"
path = "examples/unsigned_deploy_blocked.rs"

[[example]]
name = "audit_fail_closed"
path = "examples/audit_fail_closed.rs"
