[package]
name = "corelink-privacy"
description = "Wave-35 Phase 2 canonical privacy umbrella. Physically absorbs 6 privacy-context sub-crates (corelink-privacy-{breach-emit, consent-ledger, notice-emit, residency-enforcement, sub-processor-emit} + corelink-dpa-versioning) into a single workspace member exposing the canonical import surface `corelink_privacy::{dsr, breach, consent, dpa, erasure, notice, pseudonymize, residency, sub_processor}`. Still re-exports (as thin facades) the 4 privacy-related crates kept external for charter / blocker reasons: corelink-dsr + corelink-dsr-statuspage-scheduler (W36 Trigger B — wasm32 tokio leak — handled in dedicated platform-gating sprint), corelink-privacy-erasure-worker (kept separate per W35 inventory; couples to Ed25519 attestation signing path at `corelink_crypto::ed25519::attestation`), corelink-privacy-pseudonymize (kept separate per W35 inventory), and corelink-dpa-acceptance (kept separate per W35 inventory). Charter preserved: INV-AUDIT (privacy emits → audit chain BEFORE state mutation), INV-NO-PII-IN-LOGS (privacy crates handle PII; tracing macros verified leak-free), 7y R2 Object Lock retention, pseudonymization HMAC-SHA-256 + subtle::ConstantTimeEq, DSR / erasure flows. Public-API surface preserved at the umbrella import path — every absorbed crate's symbols remain reachable at `corelink_privacy::<mod>::*`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
# External re-exports kept as workspace deps (charter / blocker reasons —
# see crate-level doc above).
corelink-dsr = { workspace = true }
corelink-dsr-statuspage-scheduler = { workspace = true }
corelink-privacy-erasure-worker = { workspace = true }
corelink-privacy-pseudonymize = { workspace = true }
corelink-dpa-acceptance = { workspace = true }

# Absorbed-module deps (merged union of the 6 absorbed crates).
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["serde"] }
hmac = { workspace = true }
sha2 = { workspace = true }
hkdf = { workspace = true }
hex = { workspace = true }
subtle = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
rand = "0.9"
rand_chacha = "0.9"
uuid = { workspace = true, features = ["v7", "serde"] }
