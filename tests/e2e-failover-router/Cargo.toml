[package]
name = "e2e-failover-router"
description = "DR-16 end-to-end failover-router harness: 5 canonical scenarios pinning the active-region warm failover lifecycle (primary-up, primary-degraded, split-brain prevention, failback after recovery, partial-region). Drives the canonical `corelink-failover-router::InMemoryFailoverRouter` + `InMemoryHealthProbe` + `InMemoryFailoverAuditSink` orchestrators under a deterministic logical clock so the suite is byte-for-byte reproducible. Every state transition asserts audit-emit-BEFORE-mutation (fail-CLOSED) and split-brain absence per `INV-REGION-NO-SPLIT-BRAIN`. Companion to `specs/_compliance/ACTIVE-FAILOVER-DRILL-SPEC.md` and `scripts/active-failover-drill.sh`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[lib]
path = "src/lib.rs"

[dependencies]
corelink-failover-router = { path = "../../crates/corelink-failover-router" }
corelink-replica-worker = { path = "../../crates/corelink-replica-worker" }
thiserror = { workspace = true }

[dev-dependencies]

[[test]]
name = "scenarios"
path = "tests/scenarios.rs"
