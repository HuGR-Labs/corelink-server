[package]
name = "e2e-chaos"
description = "R3-4 end-to-end chaos drill harness: ChaosScheduler runs each of the 8 canonical chaos experiment types (+ 3 post-GA kinds — cpu pressure, memory pressure, dns failure, clerk outage, kv/d1 cold start), asserts steady-state hypothesis holds, rollback fires within blast-radius ≤ 5 min, audit lifecycle emits `corelink.chaos.run.started` → `.completed`|`.aborted`, and `corelink_chaos_slo_violation_total` is recorded. Three cross-WI invariants pinned: INV-S17-OPS-EXCLUSIVITY (concurrent chaos + DR drill rejected via shared mutex), INV-S17-SEV1-DRILL-PAUSE (SEV-1 active → auto-defer), INV-S17-CHAOS-STAGING-ONLY (prod target → pre-flight reject). 200-case property test pins deterministic-seed replay (FNV-1a hash bit-identical across replays). All in-memory fakes; no network IO; charter charter-trait-abstraction-defer applies — no production HTTPS endpoints reached by default `cargo test -p e2e-chaos`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
corelink-chaos-scheduler = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

