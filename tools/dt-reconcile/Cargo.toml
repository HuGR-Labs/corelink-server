[package]
name = "corelink-dt-reconcile"
description = "Daily reconciliation job for Dependency-Track alert gaps (WI-S12-005). Compares DT findings (via API) against alert delivery log; identifies gaps; replays DLQ. Emits SEV-2 alert if reconciliation gap detected. Runs as CF Cron Trigger or standalone binary at 06:00 UTC daily."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[dependencies]
corelink-dt-webhook = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }

[[bin]]
name = "corelink-dt-reconcile"
path = "src/main.rs"
