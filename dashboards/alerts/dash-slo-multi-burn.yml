# DASH-SLO multi-burn-rate alert rules — WI-S09-006 §6.1 + §6.2 +
# sprint contract §5.5 R-S09-13 + Google SRE Workbook Ch 5 Table 4.
#
# Rule shape per Google SRE Workbook canonical Multi-Window
# Multi-Burn-Rate Alerting (https://sre.google/workbook/alerting-on-slos/):
# for each SLI declared in `specs/03_architecture/slo_catalog.md §4`,
# emit four alert rules — one per window (Fast1h / Medium6h / Slow24h
# / Long3d) — with the canonical threshold multipliers 14.4× / 6× /
# 3× / 1× of `error_budget_pct`.
#
# Severity routing per `observability_model.md §3.1` SEV taxonomy:
# - sev0 (oncall page + escalation; 5min MTTA target sprint contract
#   §10.s09.4): Fast1h × 14.4× breach.
# - sev1 (oncall page; 5min MTTA target): Medium6h × 6× breach.
# - sev2 (admin notification; 1h response): Slow24h × 3× breach.
# - sev3 (visibility channel; 24h response): Long3d × 1× breach.
#
# Total rule count discipline (Lote 10.8-tris P1-NEW-1 lesson
# absorbed): rigorous 28 alert rules + 7 recording rules = 35 total.
# Falsified by `prop_alert_yaml_rule_count_canonical` invariant (CI
# gate counts rules + asserts == narrative claim).
#
# Runbook URL annotation (sprint contract §14.s09.3) is mandatory on
# every alert; CI hook runbook-coverage rejects PRs adding alerts
# without `annotations.runbook_url`.
#
# Production calibration (deferred to WI-S09-007 PRR ship gate):
# - PagerDuty Events API v2 routing keys per service (corelink-staging
#   / corelink-prod-us / corelink-prod-eu) bound via Worker secret.
# - Alertmanager → PagerDuty webhook; runbook_url propagated.
# - `promtool test rules dashboards/alerts/dash-slo-multi-burn.yml` CI
#   gate at `.github/workflows/alert-rules-validate.yml`.

groups:
  # -----------------------------------------------------------------
  # SLI-AVAIL-CAS-GET (slo_catalog §4.2; target 99.9% team / 99.95%
  # enterprise; 0.1% / 0.05% error budget respectively).
  # -----------------------------------------------------------------
  - name: slo-avail-cas-get-multi-burn
    interval: 30s
    rules:
      - record: slo:cas_get_error_rate:1h
        expr: |
          sum(rate(corelink_cas_get_errors_total[1h]))
          /
          sum(rate(corelink_cas_get_total[1h]))

      - alert: SloAvailCasGet_Fast1h_BurnRate_Sev0
        expr: slo:cas_get_error_rate:1h > (14.4 * 0.001)
        for: 2m
        labels:
          severity: sev0
          slo: SLI-AVAIL-CAS-GET
          burn_rate_window: fast_1h
          sprint: S-09
          gate: ship
        annotations:
          summary: "SLI-AVAIL-CAS-GET fast burn (1h × 14.4×) — page imediato"
          description: |
            Error budget burning at {{ $value | humanizePercentage }}
            sustained 1h. Per Google SRE Workbook Ch 5 Table 4 row 1:
            14.4× burn over 1h consumes 2% of monthly budget per
            hour sustained — projected exhaustion in 50h without
            mitigation. Page on-call SEV-0 immediately.
          runbook_url: "https://corelink.io/runbooks/RB-SLO-SLI-AVAIL-CAS-GET-fast_1h.md"

      - alert: SloAvailCasGet_Medium6h_BurnRate_Sev1
        expr: sum(rate(corelink_cas_get_errors_total[6h])) / sum(rate(corelink_cas_get_total[6h])) > (6 * 0.001)
        for: 15m
        labels:
          severity: sev1
          slo: SLI-AVAIL-CAS-GET
          burn_rate_window: medium_6h
          sprint: S-09
          gate: ship
        annotations:
          summary: "SLI-AVAIL-CAS-GET medium burn (6h × 6×) — page"
          description: |
            Error budget burning at {{ $value | humanizePercentage }}
            sustained 6h. Per Google SRE Workbook Ch 5 Table 4 row 2:
            6× burn over 6h consumes 5% of monthly budget per 6h
            sustained. Page on-call SEV-1.
          runbook_url: "https://corelink.io/runbooks/RB-SLO-SLI-AVAIL-CAS-GET-medium_6h.md"

      - alert: SloAvailCasGet_Slow24h_BurnRate_Sev2
        expr: sum(rate(corelink_cas_get_errors_total[24h])) / sum(rate(corelink_cas_get_total[24h])) > (3 * 0.001)
        for: 1h
        labels:
          severity: sev2
          slo: SLI-AVAIL-CAS-GET
          burn_rate_window: slow_24h
          sprint: S-09
        annotations:
          summary: "SLI-AVAIL-CAS-GET slow burn (24h × 3×) — admin ticket"
          description: |
            Error budget burning at {{ $value | humanizePercentage }}
            sustained 24h. Per Google SRE Workbook Ch 5 Table 4 row 3:
            3× burn over 24h consumes 10% of monthly budget per day
            sustained. Admin ticket; review during business hours.
          runbook_url: "https://corelink.io/runbooks/RB-SLO-SLI-AVAIL-CAS-GET-slow_24h.md"

      - alert: SloAvailCasGet_Long3d_BurnRate_Sev3
        expr: sum(rate(corelink_cas_get_errors_total[3d])) / sum(rate(corelink_cas_get_total[3d])) > (1 * 0.001)
        for: 4h
        labels:
          severity: sev3
          slo: SLI-AVAIL-CAS-GET
          burn_rate_window: long_3d
          sprint: S-09
        annotations:
          summary: "SLI-AVAIL-CAS-GET long burn (3d × 1×) — visibility ticket"
          description: |
            Error budget burning at {{ $value | humanizePercentage }}
            sustained 3d. Per Google SRE Workbook Ch 5 Table 4 row 4:
            1× burn over 3d consumes 10% of monthly budget per 3d
            sustained. Visibility ticket; SRE planning review.
          runbook_url: "https://corelink.io/runbooks/RB-SLO-SLI-AVAIL-CAS-GET-long_3d.md"

