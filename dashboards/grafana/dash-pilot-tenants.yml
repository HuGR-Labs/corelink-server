#   [ ] Land in dashboards/grafana/ alongside the other DASH-*.json
#   [ ] Wire the 10 corelink_pilot_* metrics in apps/server/src/admin/pilot_metrics.rs
#   [ ] Add panel to docs/internal/pilot-dashboard-checklist.md cross-reference
