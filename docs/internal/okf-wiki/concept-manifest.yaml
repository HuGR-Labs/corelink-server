# PURPOSE: the FROZEN enumerated universe of concept candidates the architecture
#   wiki must cover (architecture-core + re-indexed ADRs + doc-extraction). Every
#   candidate starts status: planned (contract C10); a concept-authoring WP flips
#   its candidates to active and lands the docs in the same PR.
#
# THIS FILE IS THE C10 / C10b ORACLE (01-okf-corelink-profile.contract.md §4):
#   - C10  : every candidate with status: active has a concept doc OR a deferred: marker.
#   - C10b : the manifest itself is cross-checked against the mechanically-enumerable
#            repo surface — every specs/03_architecture/adrs/*.md, every
#            crates/corelink-container/src/routes/*.rs, every crates/* dir, AND the
#            Worker EDGE PLANE + apps/ workers (BR5 root fix): worker/src/*.ts,
#            worker/src/lib/*.ts, apps/{signup,cas,analytics}-worker/src/**/*.ts, and
#            apps/migrate-single-to-multi-region/src/main.rs — each maps to a candidate
#            (via id/seed_from) OR an explicit excludes: entry. A future load-bearing
#            edge file with no concept therefore REDs the gate (no silent edge gaps).
#
# Transcribed from a frozen contract (W-MANIFEST). Agents do not design or deviate.
# ============================================================================
