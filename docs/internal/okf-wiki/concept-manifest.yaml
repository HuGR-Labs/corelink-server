    reason: "Pure BLAKE3-256 hash primitive (self-contained, dependency-free) used only by the dormant runner-job exact-key narrowing (cf-multitenant WP5a) — a stateless crypto helper pinned to the official test vectors, no cross-crate architecture narrative; same class as region-map.ts. The narrowing SEMANTICS live in auth/edge-pat-mint-lifecycle."
