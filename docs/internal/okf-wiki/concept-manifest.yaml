    reason: "TypeScript compiler config — tooling config, no architecture concept."
  # ---- App-internal glue helpers (C10b file-granular) ----
  # gate v5 (audit #3 HIGH #5) UNDID the v4 massaging: three of these apps/ FILE
  # surfaces were LOAD-BEARING enforcers wrongly labeled "plumbing" and are now
  # AUTHORED (declared+cited in a concept's source_files), NOT excluded:
  #   - apps/signup-worker/src/lib/erase-auth-key.ts  -> compliance/dsr-edge-crons
  #     (the per-consumer erase-auth-key split, resolveEraseAuthKey);
  #   - apps/signup-worker/src/lib/d1.ts              -> flows/signup-auto-provision
  #     (tenant_state='active' provision, PAT shown_once_consumed, email_hash seat
  #      isolation);
  #   - apps/signup-worker/src/lib/clerk-metadata.ts  -> flows/signup-auto-provision
  #     (public-vs-private metadata secret-classification boundary);
  #   - apps/analytics-worker/src/ingest.ts           -> ops/audit-analytics-plane
  #     (the edge ingest privacy gate forbidding email/IP + constant-time key auth).
  # The remainder below are GENUINELY-trivial app-internal glue (thin typed HTTP
  # clients, router wiring, request-tap middleware, a static security-header bag):
  # no standalone enforcement, narrated by an already-existing parent concept.
  # Excluded with reason (the sanctioned alternative to a per-file cite) rather
  # than left as a silent gap. Each was re-examined in gate v5; corelink-internal.ts
  # and security-headers.ts re-confirmed trivial (a mint-proxy that defers all
  # enforcement to the container; a static header table).
  - surface: "apps/signup-worker/src/lib/analytics-server.ts"
    reason: "Server-side analytics emit helper (signup-worker lib glue) — plumbing under ops/audit-analytics-plane; no standalone architecture narrative."
  - surface: "apps/signup-worker/src/lib/corelink-internal.ts"
    reason: "Thin typed HTTP client for the container's /_internal/pat/mint (signup-worker lib glue) — it only forwards the shared internal-auth secret; ALL mint enforcement (HMAC, Argon2id, scope, D1 write) lives in the container (auth/* concepts). Re-examined gate v5: genuinely trivial, no standalone enforcement."
  - surface: "apps/cas-worker/src/middleware/analytics.ts"
    reason: "CAS-worker analytics middleware (request-tap glue) — plumbing under ops/audit-analytics-plane; no standalone architecture narrative."
  - surface: "apps/analytics-worker/src/cron/weekly-email.ts"
    reason: "Weekly-email cron handler (analytics-worker) — operational glue under ops/audit-analytics-plane; no standalone architecture narrative."
  - surface: "apps/analytics-worker/src/index.ts"
    reason: "analytics-worker entrypoint/router wiring — operational glue under ops/audit-analytics-plane; no standalone architecture narrative."
  - surface: "apps/analytics-worker/src/sentry-scrub.ts"
    reason: "Pure dependency-free Sentry event PII/secret scrubber (a verbatim mirror of worker/src/sentry-scrub.ts, which planes/worker-edge grounds, and apps/signup-worker/src/sentry-scrub.ts, which flows/signup-auto-provision grounds) — registered in analytics-worker's beforeSend; a small utility module with no standalone architecture narrative, same operational-glue class as the analytics-worker/src/index.ts exclude under ops/audit-analytics-plane."
  - surface: "apps/analytics-worker/src/security-headers.ts"
    reason: "analytics-worker security-header middleware (mirror of signup-worker's, which security/posture-overview cites) — a static header bag + merge helper, no standalone enforcement. Re-examined gate v5: genuinely trivial/declarative."
  # ---- Container route-subdir test modules (C10b is now RECURSIVE over routes/) ----
  # The recursive routes/**/*.rs enumeration surfaces the route subdirs' inline test
  # modules. These are test-only (genuine non-handlers); the REAL handlers in the same
  # subdirs are covered by their parent concept's seed_from (compliance/dsr-erasure,
  # ops/audit-analytics-plane).
  - surface: "crates/corelink-container/src/routes/**/tests_*.rs"
    reason: "Inline test modules under a route subdir (audit_export/audit_analytics) — test-only, not a load-bearing handler. ANTI-SHADOW (fix #5): the `tests_` BASENAME PREFIX is, by repo convention, exclusive to inline-test modules — no production route handler is named `tests_*.rs` (handlers are `<noun>.rs` / `handler*.rs`), AND `_is_test_cite` independently classifies the same prefix as test, so this exclude cannot hide a real handler. Accepted residual: a future handler deliberately misnamed `tests_foo.rs` would be masked — caught by review (the same place a handler hidden in a test file is caught) and by the convention that handlers are never `tests_`-prefixed."
  # ---- Container src file-granular trivial wiring (gate v6 fix #1) ----
  # gate v6 made the container src tree FILE-GRANULAR-STRICT: directory/cluster
  # adoption (the whole-crate `crates/corelink-container` seed) no longer auto-covers
  # an individual .rs, so each file is now covered by a per-file cite OR an honest
  # exclude. These two are GENUINELY-trivial non-handlers (crate-root module wiring /
  # a pure type+constant carrier) — the sanctioned alternative to a per-file cite.
  - surface: "crates/corelink-container/src/lib.rs"
    reason: "Crate-root library wiring (`pub mod` declarations + the INV-pin doc map) — no runtime enforcement of its own; every module it declares is grounded by its owning concept (auth/*, storage/*, surfaces/*, tenancy/*). mod.rs/lib.rs wiring, not a request-reachable handler."
  - surface: "crates/corelink-container/src/routes/audit_analytics/types.rs"
    reason: "Pure type + constant carrier for the audit-analytics routes (route-path consts, the audit-row data shape, query/response structs) — declarations only, no enforcement (parallel to the `apps/*/src/types/**` and `analytics-worker/src/types.ts` type-declaration excludes). The behaviour these types serve is grounded in the handler files of ops/audit-analytics-plane."

