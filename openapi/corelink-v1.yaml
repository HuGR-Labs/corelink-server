components:
  securitySchemes:
    BearerPAT:
      type: http
      scheme: bearer
      bearerFormat: PAT
      description: |
        `Authorization: Bearer <PAT>` where PAT is a 32-byte UUIDv7-derived
        opaque token (BLAKE3-keyed hash in DB). Tier 1 of the canonical
        auth ladder per `corelink-pat`. Scopes encoded in PAT row.
    ClerkSessionCookie:
      type: apiKey
      in: cookie
      name: __session
      description: Clerk browser session cookie (alternative to PAT for the
        web onboarding flow).
    StripeSignature:
      type: apiKey
      in: header
      name: Stripe-Signature
      description: HMAC-SHA256 webhook signature; verified by
        `apps/server::webhook::stripe_webhook_handler` against the
        secret in `STRIPE_WEBHOOK_SECRET` env var with a 5-minute
        replay window.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: Client-generated idempotency token. Same key replays the
        original response (no duplicate provisioning).
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
      description: PAT-CORRELATION-ID-001 propagation token.
    PatId:
      name: pat_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AdminOperationReason:
      name: X-Admin-Operation-Reason
      in: header
      required: true
      schema:
        type: string
        minLength: 4
        maxLength: 512
      description: Free-text justification recorded in the audit envelope for
        every admin mutation. Required for all `/v1/admin/*` write endpoints.
    AdminOpId:
      name: op_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: Authenticated but not authorized for this resource.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: Idempotency or uniqueness conflict.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unprocessable:
      description: Schema-valid but semantically invalid payload.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RateLimited:
      description: Rate-limit exceeded.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    InternalError:
      description: Server error. Safe to retry idempotent operations.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  examples:
    SignupRequestMinimal:
      summary: Minimal valid signup request.
      value:
        clerk_event_id: "evt_2NmPsl2HxqGq7BhM4VqW8Y3JxAa"
        email_hash: "8a5b6f0e3e2c1d4b9a7c0e5d2b8a9f4e3c6d1a0b4e7c2f1d9a6b3e0c5d8a4b7e"
        locale: "en-US"
        idempotency_key: "idem-2026-05-14-1f3c"
        correlation_id: "evt_2NmPsl2HxqGq7BhM4VqW8Y3JxAa"
  schemas:
    CustomerPat:
      type: object
      description: |
        One PAT row as returned by the `/v1/customer/keys` family. Metadata
        only — raw token material appears exactly once, in
        `CustomerKeyCreateResponse.token`, and never again.
      required: [pat_id, name, scopes, created_at]
      properties:
        pat_id:
          type: string
          description: Opaque PAT identifier.
        name:
          type: string
          description: Human-readable name given at creation.
        scopes:
          type: array
          items: { type: string }
          description: Granted scopes (e.g. `cas:r`, `cas:rw`).
        created_at:
          type: string
          description: ISO-8601 creation timestamp.
        last_used_at:
          type: [string, "null"]
          description: ISO-8601 timestamp of last use; `null` if never used.
        revoked_at:
          type: [string, "null"]
          description: ISO-8601 revocation timestamp; `null` while active.
    CustomerByokStatus:
      type: object
      description: BYOK posture for the tenant, returned alongside the PAT list.
      required: [status]
      properties:
        status:
          type: string
          enum: [none, active, rotation_pending]
        cmk_id:
          type: [string, "null"]
          description: CMK identifier when `status` is not `none`.
        last_rotated_at:
          type: [string, "null"]
          description: ISO-8601 timestamp of the last rotation, when present.
    CustomerKeysListResponse:
      type: object
      required: [pats, byok]
      properties:
        pats:
          type: array
          items: { $ref: "#/components/schemas/CustomerPat" }
        byok: { $ref: "#/components/schemas/CustomerByokStatus" }
    CustomerKeyCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Human-readable name for the new PAT.
        scopes:
          type: array
          items: { type: string }
          default: []
          description: |
            Scopes to grant. Requesting any write/admin scope requires the
            caller to already hold a cache-write capability.
    CustomerKeyCreateResponse:
      type: object
      required: [pat, token]
      properties:
        pat: { $ref: "#/components/schemas/CustomerPat" }
        token:
          type: string
          description: |
            Raw bearer token. Shown **once**; it is hashed before storage and
            is not recoverable afterwards.
    CustomerKeyRevokeResponse:
      type: object
      required: [pat]
      properties:
        pat: { $ref: "#/components/schemas/CustomerPat" }
    DpaAcceptRequest:
      type: object
      additionalProperties: false
      required: [dpa_version, dpa_locale, notice_text_hash]
      description: |
        Unknown fields are rejected (`400 bad_request`) — in particular a
        smuggled `tenant_id`, which is header-bound at the edge and never read
        from the body.
      properties:
        dpa_version:
          type: string
          description: |
            DPA template version accepted. Must equal the server's current
            version, else `400 dpa_version_mismatch`.
        dpa_locale:
          type: string
          enum: [en, pt, es, en-US, pt-BR, es-419]
          description: |
            UI locale. Closed GA set — anything outside it (`de` included) is
            `400 unsupported_locale`.
        notice_text_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Client-computed SHA-256 (hex64) of the rendered notice text.
        ui_capture_ts:
          type: integer
          format: int64
          description: |
            Client-captured click timestamp (ms since epoch). Optional for
            older clients; when absent the server uses its own time.
    DpaAcceptResponse:
      type: object
      required: [audit_event_id, dpa_version, dpa_locale, dpa_accepted_at]
      properties:
        audit_event_id:
          type: string
          description: Immutable audit reference (the RS256 receipt `jti`).
        dpa_version:
          type: string
          description: Accepted DPA version (echoed).
        dpa_locale:
          type: string
          description: Accepted locale, canonicalised to BCP-47.
        dpa_accepted_at:
          type: string
          description: Acceptance time (ms since epoch, as a string).
    DpaAcceptError:
      type: object
      required: [error]
      description: |
        The DPA-accept route returns this bare envelope, NOT the shared
        `ErrorEnvelope`.
      properties:
        error:
          type: string
          enum:
            - unauthenticated
            - no_verified_tenant
            - bad_request
            - unsupported_locale
            - dpa_version_mismatch
            - internal
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code from the canonical
                error taxonomy (`error_taxonomy.md`).
              examples: ["COR_ABUSE_DETECTED", "COR_DPA_REQUIRED",
                "COR_MFA_STEP_UP_REQUIRED", "COR_RATE_LIMITED"]
            message:
              type: string
              description: Human-readable explanation (locale-neutral; do
                NOT echo back PII).
            request_id:
              type: string
              format: uuid
              description: Server-assigned request id for support
                correlation.
            details:
              type: object
              additionalProperties: true
    SignupRequest:
      type: object
      required: [clerk_event_id, email_hash, locale, idempotency_key, correlation_id]
      properties:
        clerk_event_id:
          type: string
          description: Clerk webhook event id (idempotency anchor at the
            identity provider).
        email_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 hex of normalized email. **Raw email is NEVER
            transmitted to the server** (CTRL-PRIV-001).
        locale:
          $ref: "#/components/schemas/Bcp47Locale"
        idempotency_key:
          type: string
        correlation_id:
          type: string
    SignupResponse:
      type: object
      required: [signup_id, tenant_id, outcome, first_pat]
      properties:
        signup_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        outcome:
          type: string
          enum: [Provisioned, Deferred, Duplicate, Rejected]
        billing_intent:
          type: string
          enum: [Linked, PendingBillingLink, Deferred]
        first_pat:
          $ref: "#/components/schemas/PatShownOnce"
        primary_region:
          $ref: "#/components/schemas/PrimaryRegion"
    ConsentProofPayload:
      type: object
      required: [notice_text_hash, notice_version, locale, wording_id, ui_capture_ts]
      properties:
        notice_text_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 of the notice text the user saw.
        notice_version:
          type: string
          examples: ["dpa.v3.2.0", "consent.analytics.v1.4.0"]
        locale:
          $ref: "#/components/schemas/Bcp47Locale"
        wording_id:
          type: string
          format: uuid
          description: UUIDv7 deterministically derived from `notice_version`.
        ui_capture_ts:
          type: integer
          format: int64
          description: Client-side `Date.now()` at click.
        submission_ts:
          type: integer
          format: int64
          description: Server-assigned (overwrites any client value).
          readOnly: true
    SubscriptionTier:
      type: string
      enum: [free, team, business, enterprise]
    TierSelectRequest:
      type: object
      required: [tier]
      properties:
        tier: { $ref: "#/components/schemas/SubscriptionTier" }
        success_url:
          type: string
          format: uri
          description: Stripe Checkout success redirect.
        cancel_url:
          type: string
          format: uri
    TierSelectResponse:
      type: object
      required: [checkout_session_url, checkout_session_id, tier]
      properties:
        checkout_session_url: { type: string, format: uri }
        checkout_session_id: { type: string }
        tier: { $ref: "#/components/schemas/SubscriptionTier" }
    PatMetadata:
      type: object
      description: |
        PAT metadata as returned by the **signup** flow (`/v1/signup`). This is
        NOT the shape of the `/v1/customer/keys` family — that surface returns
        `CustomerPat`, whose field names differ (`name`/`created_at` rather
        than `label`/`created_at_ms`, and no `prefix`).
      required: [pat_id, label, scopes, created_at_ms, prefix]
      properties:
        pat_id: { type: string, format: uuid }
        label: { type: string }
        scopes:
          type: array
          items: { type: string }
        created_at_ms: { type: integer, format: int64 }
        last_used_at_ms: { type: [integer, "null"], format: int64 }
        expires_at_ms: { type: [integer, "null"], format: int64 }
        revoked_at_ms: { type: [integer, "null"], format: int64 }
        prefix:
          type: string
          description: First 8 chars of the raw token (display only).
    PatShownOnce:
      allOf:
        - $ref: "#/components/schemas/PatMetadata"
        - type: object
          required: [shown_once_token]
          properties:
            shown_once_token: { type: string }
    StripeWebhookEnvelope:
      type: object
      description: The Stripe-shaped event envelope; only fields the
        handler reads are typed here.
      required: [id, type]
      properties:
        id: { type: string, examples: ["evt_1NXYZabcDEFghi"] }
        type:
          type: string
          examples: ["checkout.session.completed",
            "customer.subscription.created",
            "customer.subscription.updated",
            "customer.subscription.deleted",
            "invoice.payment_succeeded",
            "invoice.payment_failed"]
        created: { type: integer, format: int64 }
        livemode: { type: boolean }
        data:
          type: object
          additionalProperties: true
        api_version: { type: string }
    DsrAction:
      type: string
      enum: [access, portability, rectification, erasure, restriction, objection]
    DsrJurisdiction:
      type: string
      enum: [Lgpd, Gdpr, Ccpa]
    DsrStatus:
      type: string
      enum: [Pending, InProgress, Completed, Rejected]
    DsrRequest:
      type: object
      required: [data_subject_id, jurisdiction]
      properties:
        data_subject_id:
          type: string
          description: Pseudonymized subject id (per `corelink-privacy-pseudonymize`).
        jurisdiction: { $ref: "#/components/schemas/DsrJurisdiction" }
        request_payload_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 of the rectification / portability payload (when
            applicable). Used as part of the idempotency 4-tuple.
        notes:
          type: string
          maxLength: 4096
    DsrAcceptedReceipt:
      type: object
      required: [request_id, status, sla_deadline_ms, jwt_receipt]
      properties:
        request_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/DsrStatus" }
        sla_deadline_ms: { type: integer, format: int64 }
        jwt_receipt:
          type: string
          description: RS256-signed JWT (90-day validity per
            `RECEIPT_EXPIRY_DAYS`).
    DsrTicket:
      type: object
      required: [request_id, status, sla_deadline_ms]
      properties:
        request_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/DsrStatus" }
        sla_deadline_ms: { type: integer, format: int64 }
        rejected_reason:
          type: [string, "null"]
        receipt:
          $ref: "#/components/schemas/DsrAcceptedReceipt"
    AdminOpType:
      type: string
      enum:
        - ConfigRollback
        - SecretRotationStart
        - TenantTombstone
        - GlobalCircuitOverride
        - RegionMigration
        - PatRevokeAll
        - AbuseAppeal
    AuditEvent:
      type: object
      required: [event_id, event_type, occurred_at_ms]
      properties:
        event_id: { type: string, format: uuid }
        event_type:
          type: string
          examples: ["corelink.signup.completed",
            "corelink.dsr.request_received",
            "corelink.consent.granted",
            "corelink.admin.op.approved"]
        tenant_id: { type: [string, "null"], format: uuid }
        occurred_at_ms: { type: integer, format: int64 }
        correlation_id: { type: [string, "null"] }
        payload:
          type: object
          additionalProperties: true
    TenantSummary:
      type: object
      required: [tenant_id, region, tier, state, created_at_ms]
      properties:
        tenant_id: { type: string, format: uuid }
        region: { $ref: "#/components/schemas/PrimaryRegion" }
        tier: { $ref: "#/components/schemas/SubscriptionTier" }
        state:
          type: string
          enum: [active, deferred_billing, read_only_frozen, tombstoned]
        created_at_ms: { type: integer, format: int64 }
        primary_contact_email_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 hex; raw email NOT exposed.
    UserProfile:
      type: object
      required: [user_id, email_hash, locale, created_at_ms]
      properties:
        user_id: { type: string, format: uuid }
        email_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        locale: { $ref: "#/components/schemas/Bcp47Locale" }
        display_name: { type: [string, "null"] }
        created_at_ms: { type: integer, format: int64 }
        active_tenants:
          type: array
          items: { type: string, format: uuid }
    UserProfilePatch:
      type: object
      properties:
        locale: { $ref: "#/components/schemas/Bcp47Locale" }
        display_name: { type: [string, "null"], maxLength: 128 }
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [SERVING, NOT_SERVING]
        version: { type: string, examples: ["0.1.0"] }
        commit: { type: string, examples: ["445e3cc"] }
    Bcp47Locale:
      type: string
      examples: ["en-US", "pt-BR", "fr-FR"]
      description: BCP-47 locale (Lote 10.16 canonical 3-locale set
        currently — en-US, pt-BR, fr-FR).
    PrimaryRegion:
      type: string
      enum: [Enam, Sam, Eu]
      description: 3-region canonical map per `corelink-region` / Lote
        10.16 locale→region binding.

    # ----------------------------------------------------------
    # Reconciled 2026-05-27 — schemas for the SERVER-ONLY routes
    # added to the contract per
    # specs/_audits/2026-05-27-openapi-reconciliation-seal.md.
    # ----------------------------------------------------------

    PilotSignupRequest:
      type: object
      required: [email, company_name, tier_hint, expected_use_case]
      properties:
        email:
          type: string
          format: email
          maxLength: 256
        company_name:
          type: string
          maxLength: 256
        tier_hint:
          type: string
          enum: [free, pro, enterprise]
        expected_use_case:
          type: string
          maxLength: 256
      description: |
        Request body for `POST /v1/signup/pilot/{token}`. All four fields
        are required; each is capped at 256 chars
        (`MAX_FIELD_LEN` in `crates/corelink-container/src/routes/signup.rs`).

    PilotSignupResponse:
      type: object
      required: [tenant_id, activation_url, state]
      properties:
        tenant_id:
          type: string
          format: uuid
          description: UUIDv7 assigned to the reserved pilot tenant.
        activation_url:
          type: string
          format: uri
          description: >-
            Where the applicant completes account creation. Points at the live
            Clerk sign-up surface, carrying the reservation id as the `pilot`
            query parameter.
          examples: ["https://humangr.com/corelink/sign-up?pilot=01J..."]
        state:
          type: string
          enum: [RESERVED]

    AdminMutateBody:
      type: object
      required: [op_kind, initiator, initiator_is_admin]
      properties:
        op_kind:
          type: string
          enum: [set_tenant_tier, rotate_admin_token]
        tenant:
          type: string
          description: Tenant id (required for `set_tenant_tier`).
        tier:
          type: string
          description: Target tier (required for `set_tenant_tier`).
        token_id:
          type: string
          description: Token id (required for `rotate_admin_token`).
        initiator:
          type: string
          description: Principal initiating the mutation.
        initiator_is_admin:
          type: boolean
        approval_id:
          type: string
          description: |
            Dual-approval ledger id (omit = rejected — handler emits
            `MutateDualApprovalRejected` BEFORE the 403).
        approver:
          type: string
          description: Second approver principal (must differ from initiator).

    PilotState:
      type: string
      enum: [NEW, ACTIVE, GRADUATED, TERMINATED]

    PilotTenant:
      type: object
      required: [tenant_id, slug, tier, cap_bytes, pilot_state, signup_at_ms]
      properties:
        tenant_id: { type: string, format: uuid }
        slug: { type: string }
        tier: { type: string }
        cap_bytes:
          type: integer
          format: int64
          minimum: 0
        pilot_state:
          $ref: "#/components/schemas/PilotState"
        signup_at_ms:
          type: integer
          format: int64
          minimum: 0
        tier_granted_at_ms:
          type: [integer, "null"]
          format: int64
          minimum: 0
        first_blob_at_ms:
          type: [integer, "null"]
          format: int64
          minimum: 0

    ListPilotsResponse:
      type: object
      required: [state, rows, offset, limit]
      properties:
        state:
          $ref: "#/components/schemas/PilotState"
        rows:
          type: array
          items: { $ref: "#/components/schemas/PilotTenant" }
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 200

    GrantTierBody:
      type: object
      required: [tier, cap_bytes]
      properties:
        tier:
          type: string
          description: Target tier (mirrors `grant-pilot-tier.sh` taxonomy).
        cap_bytes:
          type: integer
          format: int64
          minimum: 0

    GrantTierResponse:
      type: object
      required: [tenant]
      properties:
        tenant:
          $ref: "#/components/schemas/PilotTenant"

    EventCountEntry:
      type: object
      required: [event_type, count]
      properties:
        event_type: { type: string }
        count:
          type: integer
          format: int64
          minimum: 0

    EventCountResponse:
      type: object
      required: [buckets]
      properties:
        buckets:
          type: array
          items: { $ref: "#/components/schemas/EventCountEntry" }

    TimelineEntry:
      type: object
      required: [bucket_start_ms, count]
      properties:
        bucket_start_ms:
          type: integer
          format: int64
          minimum: 0
        count:
          type: integer
          format: int64
          minimum: 0

    TimelineResponse:
      type: object
      required: [buckets, granularity_ms]
      properties:
        buckets:
          type: array
          items: { $ref: "#/components/schemas/TimelineEntry" }
        granularity_ms:
          type: integer
          format: int64
          minimum: 1
          maximum: 86400000
