      the gRPC ActionCache service. Cross-tenant denials emit
      `AuditEventKind::LookupDenied` / `UpdateDenied` BEFORE the 403.
    get:
      tags: [reapi-http]
      summary: Look up an Action Cache result.
      operationId: acLookup
      security:
        - BearerPAT: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema: { type: string }
        - name: action_digest
          in: path
          required: true
          schema:
            type: string
            description: Hex digest of the action's `ActionResult` key.
      responses:
        "200":
          description: ActionResult payload.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Cross-tenant attempt.
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [reapi-http]
      summary: Upsert an Action Cache result.
      operationId: acUpdate
      security:
        - BearerPAT: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema: { type: string }
        - name: action_digest
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
        description: Raw ActionResult bytes.
      responses:
        "201":
          description: Stored durably (fresh insert). Body echoes the action digest.
          content:
            text/plain:
              schema: { type: string }
        "200":
          description: Idempotent re-write (already existed).
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Cross-tenant attempt — audit row emitted before 403.

  # ============================================================
  # HEALTH — server-only liveness probe
  # ============================================================

  /_health:
    x-status: implemented
    x-implementing-handler: crates/corelink-container/src/main.rs (health_handler)
    x-reconciliation-note: |
      Mounted directly in main.rs as `.route("/_health", get(health_handler))`.
      Used by the Cloudflare Durable Object `waitForContainerHealth` probe
      (expects HTTP 200 + application/json) and by `scripts/smoke-prod-corelink.sh`.
      Returns `{"status":"ok"}` — no storage field yet (A4 may add it).
    get:
      tags: [ops]
      summary: Container liveness / readiness probe for the DO health check.
      operationId: containerHealth
      security: []
      responses:
        "200":
          description: Container is healthy.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
              example:
                status: ok

  # ============================================================
  # TURBO v8 — Turborepo remote-cache bridge
  # ============================================================

  /v8/artifacts/events:
    x-status: implemented
    x-implementing-handler: crates/corelink-container/src/routes/turbo_v8.rs (handle_events)
    post:
      tags: [turbo-v8]
      summary: Accept-and-drop Turborepo telemetry events.
      operationId: turboEvents
      security:
        - BearerPAT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Events acknowledged (dropped — telemetry is fire-and-forget).
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v8/artifacts/status:
    x-status: implemented
    x-implementing-handler: crates/corelink-container/src/routes/turbo_v8.rs (handle_status)
    post:
      tags: [turbo-v8]
      summary: Static remote-cache enabled check (Turbo status probe).
      operationId: turboStatus
      security:
        - BearerPAT: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Remote cache is enabled.
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v8/artifacts/{hash}:
    x-status: implemented
    x-implementing-handler: crates/corelink-container/src/routes/turbo_v8.rs (handle_get, handle_put)
    x-reconciliation-note: |
      Route constants `TURBO_GET_ROUTE`/`TURBO_PUT_ROUTE` = `/v8/artifacts/:hash`.
      Query parameter `teamId` is **required**; must match the authenticated
      caller's tenant (cross-tenant guard). `slug` is optional/informational.
    get:
      tags: [turbo-v8]
      summary: Download a Turborepo build artifact.
      operationId: turboArtifactGet
      security:
        - BearerPAT: []
      parameters:
        - name: hash
          in: path
          required: true
          schema: { type: string }
          description: Artifact hash (Turborepo-generated key).
        - name: teamId
          in: query
          required: true
          schema: { type: string }
          description: Vercel team identifier — used as the storage partition key.
        - name: slug
          in: query
          required: false
          schema: { type: string }
          description: Informational repo slug (logged, not partitioned).
      responses:
        "200":
          description: Artifact bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400":
          description: Missing required `teamId` query parameter.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Cross-tenant attempt (teamId does not match authenticated tenant).
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [turbo-v8]
      summary: Upload a Turborepo build artifact.
      operationId: turboArtifactPut
      security:
        - BearerPAT: []
      parameters:
        - name: hash
          in: path
          required: true
          schema: { type: string }
        - name: teamId
          in: query
          required: true
          schema: { type: string }
        - name: slug
          in: query
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Artifact stored. Body is `{"urls":["..."]}` per Vercel spec.
          content:
            application/json:
              schema:
                type: object
                required: [urls]
                properties:
                  urls:
                    type: array
                    items: { type: string }
        "400":
          description: Missing required `teamId` query parameter.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Cross-tenant attempt.

  # ============================================================
  # BAZEL v2 — REAPI HTTP bridge
  # ============================================================

  /bazel/v2/{instance}/blobs/{hash}/{size}:
    x-status: implemented
    x-implementing-handler: crates/corelink-container/src/routes/bazel_v2.rs (handle_cas_read, handle_cas_write via uploads sub-path)
    x-reconciliation-note: |
      Axum resolves `/blobs/ac/:hash/:size` before `/blobs/:hash/:size`
      because the literal `ac` segment wins the matchit priority.
      Tenant is resolved from the `:instance` path segment (treated as
      the storage partition key); cross-tenant guard enforced.
    get:
      tags: [bazel-v2]
      summary: Read a CAS blob (Bazel REAPI ByteStream GET).
      operationId: bazelCasRead
      security:
        - BearerPAT: []
      parameters:
        - name: instance
          in: path
          required: true
          schema: { type: string }
          description: Bazel instance name (used as tenant partition key).
        - name: hash
          in: path
          required: true
          schema: { type: string }
          description: Hex SHA-256 digest.
        - name: size
          in: path
          required: true
          schema: { type: integer, format: int64 }
          description: Expected blob size in bytes (REAPI digest component).
      responses:
        "200":
          description: Blob bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Cross-tenant attempt.
        "404": { $ref: "#/components/responses/NotFound" }

  /bazel/v2/{instance}/uploads/{uuid}/blobs/{hash}/{size}:
    x-status: implemented
    x-implementing-handler: crates/corelink-container/src/routes/bazel_v2.rs (handle_cas_write)
    put:
      tags: [bazel-v2]
      summary: Write a CAS blob (Bazel REAPI ByteStream PUT).
      operationId: bazelCasWrite
      security:
        - BearerPAT: []
      parameters:
        - name: instance
          in: path
          required: true
          schema: { type: string }
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Upload UUID (REAPI upload id, used for dedup).
        - name: hash
          in: path
          required: true
          schema: { type: string }
        - name: size
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Blob stored.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Cross-tenant attempt.
        "413":
          description: Batch / blob too large.

  /bazel/v2/{instance}/blobs/ac/{hash}/{size}:
    x-status: implemented
    x-implementing-handler: crates/corelink-container/src/routes/bazel_v2.rs (handle_ac_read, handle_ac_write)
    get:
      tags: [bazel-v2]
      summary: Read an Action Cache result (Bazel REAPI AC GET).
      operationId: bazelAcRead
      security:
        - BearerPAT: []
      parameters:
        - name: instance
          in: path
          required: true
          schema: { type: string }
        - name: hash
          in: path
          required: true
          schema: { type: string }
        - name: size
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: ActionResult bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Cross-tenant attempt.
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [bazel-v2]
      summary: Write an Action Cache result (Bazel REAPI AC PUT).
      operationId: bazelAcWrite
      security:
        - BearerPAT: []
      parameters:
        - name: instance
          in: path
          required: true
          schema: { type: string }
        - name: hash
          in: path
          required: true
          schema: { type: string }
        - name: size
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: ActionResult stored.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Cross-tenant attempt.

  /bazel/v2/{instance}/findMissingBlobs:
    x-status: implemented
    x-implementing-handler: crates/corelink-container/src/routes/bazel_v2.rs (handle_find_missing)
    post:
      tags: [bazel-v2]
      summary: Find missing blobs (Bazel REAPI FindMissingBlobs POST).
      operationId: bazelFindMissingBlobs
      security:
        - BearerPAT: []
      parameters:
        - name: instance
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: REAPI FindMissingBlobsRequest (JSON-encoded proto).
      responses:
        "200":
          description: List of digests not present in the cache.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Cross-tenant attempt.
        "413":
          description: Batch too large.

components:
  securitySchemes:
    BearerPAT:
      type: http
      scheme: bearer
      bearerFormat: PAT
      description: |
        `Authorization: Bearer <PAT>` where PAT is a 32-byte UUIDv7-derived
        opaque token (BLAKE3-keyed hash in DB). Tier 1 of the canonical
        auth ladder per `corelink-pat`. Scopes encoded in PAT row.
    ClerkSessionCookie:
      type: apiKey
      in: cookie
      name: __session
      description: Clerk browser session cookie (alternative to PAT for the
        web onboarding flow).
    StripeSignature:
      type: apiKey
      in: header
      name: Stripe-Signature
      description: HMAC-SHA256 webhook signature; verified by
        `apps/server::webhook::stripe_webhook_handler` against the
        secret in `STRIPE_WEBHOOK_SECRET` env var with a 5-minute
        replay window.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: Client-generated idempotency token. Same key replays the
        original response (no duplicate provisioning).
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
      description: PAT-CORRELATION-ID-001 propagation token.
    PatId:
      name: pat_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConsentPurpose:
      name: purpose
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ConsentPurpose"
    AdminOperationReason:
      name: X-Admin-Operation-Reason
      in: header
      required: true
      schema:
        type: string
        minLength: 4
        maxLength: 512
      description: Free-text justification recorded in the audit envelope for
        every admin mutation. Required for all `/v1/admin/*` write endpoints.
    AdminOpId:
      name: op_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: Authenticated but not authorized for this resource.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: Idempotency or uniqueness conflict.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unprocessable:
      description: Schema-valid but semantically invalid payload.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RateLimited:
      description: Rate-limit exceeded.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    InternalError:
      description: Server error. Safe to retry idempotent operations.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  examples:
    SignupRequestMinimal:
      summary: Minimal valid signup request.
      value:
        clerk_event_id: "evt_2NmPsl2HxqGq7BhM4VqW8Y3JxAa"
        email_hash: "8a5b6f0e3e2c1d4b9a7c0e5d2b8a9f4e3c6d1a0b4e7c2f1d9a6b3e0c5d8a4b7e"
        locale: "en-US"
        idempotency_key: "idem-2026-05-14-1f3c"
        correlation_id: "evt_2NmPsl2HxqGq7BhM4VqW8Y3JxAa"
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code from the canonical
                error taxonomy (`error_taxonomy.md`).
              examples: ["COR_ABUSE_DETECTED", "COR_DPA_REQUIRED",
                "COR_MFA_STEP_UP_REQUIRED", "COR_RATE_LIMITED"]
            message:
              type: string
              description: Human-readable explanation (locale-neutral; do
                NOT echo back PII).
            request_id:
              type: string
              format: uuid
              description: Server-assigned request id for support
                correlation.
            details:
              type: object
              additionalProperties: true
    SignupRequest:
      type: object
      required: [clerk_event_id, email_hash, locale, idempotency_key, correlation_id]
      properties:
        clerk_event_id:
          type: string
          description: Clerk webhook event id (idempotency anchor at the
            identity provider).
        email_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 hex of normalized email. **Raw email is NEVER
            transmitted to the server** (CTRL-PRIV-001).
        locale:
          $ref: "#/components/schemas/Bcp47Locale"
        idempotency_key:
          type: string
        correlation_id:
          type: string
    SignupResponse:
      type: object
      required: [signup_id, tenant_id, outcome, first_pat]
      properties:
        signup_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        outcome:
          type: string
          enum: [Provisioned, Deferred, Duplicate, Rejected]
        billing_intent:
          type: string
          enum: [Linked, PendingBillingLink, Deferred]
        first_pat:
          $ref: "#/components/schemas/PatShownOnce"
        primary_region:
          $ref: "#/components/schemas/PrimaryRegion"
    ConsentProofPayload:
      type: object
      required: [notice_text_hash, notice_version, locale, wording_id, ui_capture_ts]
      properties:
        notice_text_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 of the notice text the user saw.
        notice_version:
          type: string
          examples: ["dpa.v3.2.0", "consent.analytics.v1.4.0"]
        locale:
          $ref: "#/components/schemas/Bcp47Locale"
        wording_id:
          type: string
          format: uuid
          description: UUIDv7 deterministically derived from `notice_version`.
        ui_capture_ts:
          type: integer
          format: int64
          description: Client-side `Date.now()` at click.
        submission_ts:
          type: integer
          format: int64
          description: Server-assigned (overwrites any client value).
          readOnly: true
    DpaAcceptanceRequest:
      type: object
      required: [proof]
      properties:
        proof:
          $ref: "#/components/schemas/ConsentProofPayload"
    DpaAcceptanceReceipt:
      type: object
      required: [jwt_receipt, jti, accepted_at_ms]
      properties:
        jwt_receipt:
          type: string
          description: RS256-signed compact JWT (header.payload.sig).
        jti:
          type: string
          description: JWT id; primary key into `dpa_acceptances`.
        accepted_at_ms:
          type: integer
          format: int64
    SubscriptionTier:
      type: string
      enum: [free, team, business, enterprise]
    TierSelectRequest:
      type: object
      required: [tier]
      properties:
        tier: { $ref: "#/components/schemas/SubscriptionTier" }
        success_url:
          type: string
          format: uri
          description: Stripe Checkout success redirect.
        cancel_url:
          type: string
          format: uri
    TierSelectResponse:
      type: object
      required: [checkout_session_url, checkout_session_id, tier]
      properties:
        checkout_session_url: { type: string, format: uri }
        checkout_session_id: { type: string }
        tier: { $ref: "#/components/schemas/SubscriptionTier" }
    PatIssueRequest:
      type: object
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 64
          examples: ["ci-runner-build-cache"]
        scopes:
          type: array
          items:
            type: string
            enum: [cas.read, cas.write, ac.read, ac.write, admin]
          default: [cas.read, cas.write, ac.read, ac.write]
        expires_at_ms:
          type: integer
          format: int64
          nullable: true
    PatIssueResponse:
      allOf:
        - $ref: "#/components/schemas/PatMetadata"
        - type: object
          required: [shown_once_token]
          properties:
            shown_once_token:
              type: string
              description: Raw PAT material — **shown exactly once**. Stored
                BLAKE3-keyed; never retrievable again.
    PatMetadata:
      type: object
      required: [pat_id, label, scopes, created_at_ms, prefix]
      properties:
        pat_id: { type: string, format: uuid }
        label: { type: string }
        scopes:
          type: array
          items: { type: string }
        created_at_ms: { type: integer, format: int64 }
        last_used_at_ms: { type: integer, format: int64, nullable: true }
        expires_at_ms: { type: integer, format: int64, nullable: true }
        revoked_at_ms: { type: integer, format: int64, nullable: true }
        prefix:
          type: string
          description: First 8 chars of the raw token (display only).
    PatShownOnce:
      allOf:
        - $ref: "#/components/schemas/PatMetadata"
        - type: object
          required: [shown_once_token]
          properties:
            shown_once_token: { type: string }
    StripeWebhookEnvelope:
      type: object
      description: The Stripe-shaped event envelope; only fields the
        handler reads are typed here.
      required: [id, type]
      properties:
        id: { type: string, examples: ["evt_1NXYZabcDEFghi"] }
        type:
          type: string
          examples: ["checkout.session.completed",
            "customer.subscription.created",
            "customer.subscription.updated",
            "customer.subscription.deleted",
            "invoice.payment_succeeded",
            "invoice.payment_failed"]
        created: { type: integer, format: int64 }
        livemode: { type: boolean }
        data:
          type: object
          additionalProperties: true
        api_version: { type: string }
    DsrAction:
      type: string
      enum: [access, portability, rectification, erasure, restriction, objection]
    DsrJurisdiction:
      type: string
      enum: [Lgpd, Gdpr, Ccpa]
    DsrStatus:
      type: string
      enum: [Pending, InProgress, Completed, Rejected]
    DsrRequest:
      type: object
      required: [data_subject_id, jurisdiction]
      properties:
        data_subject_id:
          type: string
          description: Pseudonymized subject id (per `corelink-privacy-pseudonymize`).
        jurisdiction: { $ref: "#/components/schemas/DsrJurisdiction" }
        request_payload_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 of the rectification / portability payload (when
            applicable). Used as part of the idempotency 4-tuple.
        notes:
          type: string
          maxLength: 4096
    DsrAcceptedReceipt:
      type: object
      required: [request_id, status, sla_deadline_ms, jwt_receipt]
      properties:
        request_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/DsrStatus" }
        sla_deadline_ms: { type: integer, format: int64 }
        jwt_receipt:
          type: string
          description: RS256-signed JWT (90-day validity per
            `RECEIPT_EXPIRY_DAYS`).
    DsrTicket:
      type: object
      required: [request_id, status, sla_deadline_ms]
      properties:
        request_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/DsrStatus" }
        sla_deadline_ms: { type: integer, format: int64 }
        rejected_reason:
          type: string
          nullable: true
        receipt:
          $ref: "#/components/schemas/DsrAcceptedReceipt"
    ConsentPurpose:
      type: string
      description: 12 canonical purposes per `privacy_model.md §5.6.1`.
      enum:
        - service_provisioning
        - billing_invoicing
        - support_communication
        - product_analytics
        - security_telemetry
        - marketing_email
        - marketing_inapp
        - third_party_research
        - personalization
        - regulatory_reporting
        - law_enforcement_response
        - subprocessor_share
    ConsentGrantRequest:
      type: object
      required: [proof]
      properties:
        proof: { $ref: "#/components/schemas/ConsentProofPayload" }
    ConsentRevokeRequest:
      type: object
      required: [proof]
      properties:
        proof: { $ref: "#/components/schemas/ConsentProofPayload" }
    ConsentGrantResponse:
      type: object
      required: [consent_id, signature, granted_at_ms]
      properties:
        consent_id: { type: string, format: uuid }
        signature:
          type: string
          description: HMAC-SHA256 hex; verifiable via `/v1/consent/verify`.
        granted_at_ms: { type: integer, format: int64 }
    ConsentRevokeResponse:
      type: object
      required: [revocation_id, signature, revoked_at_ms]
      properties:
        revocation_id: { type: string, format: uuid }
        signature: { type: string }
        revoked_at_ms: { type: integer, format: int64 }
    ConsentVerifyResponse:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean }
        purpose: { $ref: "#/components/schemas/ConsentPurpose" }
        notice_text_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        notice_version: { type: string }
        signed_at_ms: { type: integer, format: int64 }
    ConsentHistoryEntry:
      type: object
      required: [purpose, state, at_ms]
      properties:
        purpose: { $ref: "#/components/schemas/ConsentPurpose" }
        state:
          type: string
          enum: [granted, revoked]
        at_ms: { type: integer, format: int64 }
        consent_id: { type: string, format: uuid, nullable: true }
        revocation_id: { type: string, format: uuid, nullable: true }
        notice_version: { type: string }
    ConsentHistoryResponse:
      type: object
      required: [active, history]
      properties:
        active:
          type: array
          items: { $ref: "#/components/schemas/ConsentHistoryEntry" }
        history:
          type: array
          items: { $ref: "#/components/schemas/ConsentHistoryEntry" }
    AdminOpType:
      type: string
      enum:
        - ConfigRollback
        - SecretRotationStart
        - TenantTombstone
        - GlobalCircuitOverride
        - RegionMigration
        - PatRevokeAll
        - AbuseAppeal
    AdminOpRequest:
      type: object
      required: [op_type, op_payload, approver_user_id, approver_signature, nonce]
      properties:
        op_type: { $ref: "#/components/schemas/AdminOpType" }
        op_payload:
          type: object
          additionalProperties: true
        approver_user_id: { type: string, format: uuid }
        approver_signature:
          type: string
          description: HMAC-SHA256 over `(payload || nonce || ts_ms)` with
            the admin signing key.
        nonce:
          type: string
          description: 16 random bytes hex-encoded (replay protection).
    AdminOpAccepted:
      type: object
      required: [op_id, status]
      properties:
        op_id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending_approval, approved, executed]
    AdminOpResult:
      type: object
      required: [op_id, op_type, status]
      properties:
        op_id: { type: string, format: uuid }
        op_type: { $ref: "#/components/schemas/AdminOpType" }
        status:
          type: string
          enum: [pending_approval, approved, executed, rejected, failed]
        caller_user_id: { type: string, format: uuid }
        approver_user_id: { type: string, format: uuid }
        executed_at_ms: { type: integer, format: int64, nullable: true }
        result:
          type: object
          additionalProperties: true
    AuditEvent:
      type: object
      required: [event_id, event_type, occurred_at_ms]
      properties:
        event_id: { type: string, format: uuid }
        event_type:
          type: string
          examples: ["corelink.signup.completed",
            "corelink.dsr.request_received",
            "corelink.consent.granted",
            "corelink.admin.op.approved"]
        tenant_id: { type: string, format: uuid, nullable: true }
        occurred_at_ms: { type: integer, format: int64 }
        correlation_id: { type: string, nullable: true }
        payload:
          type: object
          additionalProperties: true
    AuditEventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        next_cursor:
          type: string
          nullable: true
    TenantSummary:
      type: object
      required: [tenant_id, region, tier, state, created_at_ms]
      properties:
        tenant_id: { type: string, format: uuid }
        region: { $ref: "#/components/schemas/PrimaryRegion" }
        tier: { $ref: "#/components/schemas/SubscriptionTier" }
        state:
          type: string
          enum: [active, deferred_billing, read_only_frozen, tombstoned]
        created_at_ms: { type: integer, format: int64 }
        primary_contact_email_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 hex; raw email NOT exposed.
    TenantPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TenantSummary" }
        next_cursor:
          type: string
          nullable: true
    EnterpriseInquiryRequest:
      type: object
      required: [name, work_email, company, message]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        work_email:
          type: string
          format: email
          examples: ["test-tenant@example.com"]
        company: { type: string, minLength: 1, maxLength: 128 }
        message: { type: string, minLength: 10, maxLength: 4096 }
        expected_egress_gb_month: { type: integer, minimum: 0, nullable: true }
        byok_provider:
          type: string
          enum: [aws, gcp, azure, vault]
          nullable: true
    EnterpriseInquiryResponse:
      type: object
      required: [inquiry_id, received_at_ms]
      properties:
        inquiry_id: { type: string, format: uuid }
        received_at_ms: { type: integer, format: int64 }
        auto_reply_sla_hours:
          type: integer
          default: 24
    UserProfile:
      type: object
      required: [user_id, email_hash, locale, created_at_ms]
      properties:
        user_id: { type: string, format: uuid }
        email_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        locale: { $ref: "#/components/schemas/Bcp47Locale" }
        display_name: { type: string, nullable: true }
        created_at_ms: { type: integer, format: int64 }
        active_tenants:
          type: array
          items: { type: string, format: uuid }
    UserProfilePatch:
      type: object
      properties:
        locale: { $ref: "#/components/schemas/Bcp47Locale" }
        display_name: { type: string, nullable: true, maxLength: 128 }
    DataCategory:
      type: object
      required: [id, name, legal_basis]
      properties:
        id:
          type: string
          examples: ["account_identity", "build_cache_artifact", "usage_telemetry"]
        name:
          type: string
        legal_basis:
          type: string
          enum: [contract, consent, legitimate_interest, legal_obligation]
        retention_days:
          type: integer
          minimum: 0
        description:
          type: string
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [SERVING, NOT_SERVING]
        version: { type: string, examples: ["0.1.0"] }
        commit: { type: string, examples: ["445e3cc"] }
    CspReport:
      type: object
      description: Schema accepts the legacy `csp-report` envelope and the
        new Reporting API `csp-violation` payload.
      additionalProperties: true
      properties:
        csp-report:
          type: object
          additionalProperties: true
    Bcp47Locale:
      type: string
      examples: ["en-US", "pt-BR", "fr-FR"]
      description: BCP-47 locale (Lote 10.16 canonical 3-locale set
        currently — en-US, pt-BR, fr-FR).
    PrimaryRegion:
      type: string
      enum: [Enam, Sam, Eu]
      description: 3-region canonical map per `corelink-region` / Lote
        10.16 locale→region binding.

    # ----------------------------------------------------------
    # Reconciled 2026-05-27 — schemas for the SERVER-ONLY routes
    # added to the contract per
    # specs/_audits/2026-05-27-openapi-reconciliation-seal.md.
    # ----------------------------------------------------------

    PilotSignupRequest:
      type: object
      required: [email, company_name, tier_hint, expected_use_case]
      properties:
        email:
          type: string
          format: email
          maxLength: 256
        company_name:
          type: string
          maxLength: 256
        tier_hint:
          type: string
          enum: [free, pro, enterprise]
        expected_use_case:
          type: string
          maxLength: 256
      description: |
        Request body for `POST /v1/signup/pilot/{token}`. All four fields
        are required; each is capped at 256 chars
        (`MAX_FIELD_LEN` in `crates/corelink-container/src/routes/signup.rs`).

    PilotSignupResponse:
      type: object
      required: [tenant_id, activation_url, state]
      properties:
        tenant_id:
          type: string
          format: uuid
          description: UUIDv7 assigned to the reserved pilot tenant.
        activation_url:
          type: string
          format: uri
          examples: ["https://signup.corelink.humangr.com/pilot/activate/01J..."]
        state:
          type: string
          enum: [RESERVED]

    AdminMutateBody:
      type: object
      required: [op_kind, initiator, initiator_is_admin]
      properties:
        op_kind:
          type: string
          enum: [set_tenant_tier, rotate_admin_token]
        tenant:
          type: string
          description: Tenant id (required for `set_tenant_tier`).
        tier:
          type: string
          description: Target tier (required for `set_tenant_tier`).
        token_id:
          type: string
          description: Token id (required for `rotate_admin_token`).
        initiator:
          type: string
          description: Principal initiating the mutation.
        initiator_is_admin:
          type: boolean
        approval_id:
          type: string
          description: |
            Dual-approval ledger id (omit = rejected — handler emits
            `MutateDualApprovalRejected` BEFORE the 403).
        approver:
          type: string
          description: Second approver principal (must differ from initiator).

    PilotState:
      type: string
      enum: [NEW, ACTIVE, GRADUATED, TERMINATED]

    PilotTenant:
      type: object
      required: [tenant_id, slug, tier, cap_bytes, pilot_state, signup_at_ms]
      properties:
        tenant_id: { type: string, format: uuid }
        slug: { type: string }
        tier: { type: string }
        cap_bytes:
          type: integer
          format: int64
          minimum: 0
        pilot_state:
          $ref: "#/components/schemas/PilotState"
        signup_at_ms:
          type: integer
          format: int64
          minimum: 0
        tier_granted_at_ms:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        first_blob_at_ms:
          type: integer
          format: int64
          minimum: 0
          nullable: true

    ListPilotsResponse:
      type: object
      required: [state, rows, offset, limit]
      properties:
        state:
          $ref: "#/components/schemas/PilotState"
        rows:
          type: array
          items: { $ref: "#/components/schemas/PilotTenant" }
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 200

    GrantTierBody:
      type: object
      required: [tier, cap_bytes]
      properties:
        tier:
          type: string
          description: Target tier (mirrors `grant-pilot-tier.sh` taxonomy).
        cap_bytes:
          type: integer
          format: int64
          minimum: 0

    GrantTierResponse:
      type: object
      required: [tenant]
      properties:
        tenant:
          $ref: "#/components/schemas/PilotTenant"

    EventCountEntry:
      type: object
      required: [event_type, count]
      properties:
        event_type: { type: string }
        count:
          type: integer
          format: int64
          minimum: 0

    EventCountResponse:
      type: object
      required: [buckets]
      properties:
        buckets:
          type: array
          items: { $ref: "#/components/schemas/EventCountEntry" }

    TimelineEntry:
      type: object
      required: [bucket_start_ms, count]
      properties:
        bucket_start_ms:
          type: integer
          format: int64
          minimum: 0
        count:
          type: integer
          format: int64
          minimum: 0

    TimelineResponse:
      type: object
      required: [buckets, granularity_ms]
      properties:
        buckets:
          type: array
          items: { $ref: "#/components/schemas/TimelineEntry" }
        granularity_ms:
          type: integer
          format: int64
          minimum: 1
          maximum: 86400000
