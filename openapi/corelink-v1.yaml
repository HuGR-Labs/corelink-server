openapi: 3.1.0
info:
  title: CoreLink Customer & Privacy REST API
  version: 0.1.0
  summary: REST surface for CoreLink customer onboarding, privacy (DSR / consent / DPA),
    billing webhooks, admin operations and health.
  description: |
    Hand-authored OpenAPI 3.1 contract for the **non-REAPI** surface of CoreLink.
    The high-volume CAS / AC / ByteStream / Capabilities surface is gRPC
    (Remote Execution API v2) and documented separately under
    `docs/reference/reapi/`.

    Endpoint canonical paths are sourced from the implementing crates' doc-comments:
    `corelink-signup`, `corelink-dpa-acceptance`, `corelink-dpa-versioning`,
    `corelink-tier-selection`, `corelink-pat`, `corelink-dsr`,
    `corelink-privacy-consent-ledger`, `corelink-admin-api`,
    `corelink-enterprise-inquiry`, plus `apps/server::webhook` (Stripe).

    **Stability:** `v1` — public, semver-compatible. Breaking changes require a
    new major path prefix (`/v2/...`).
  termsOfService: https://corelink.humangr.com/legal/terms
  contact:
    name: CoreLink Support
    email: test-tenant@example.com
    url: https://corelink.humangr.com/support
  license:
    name: Proprietary
    url: https://corelink.humangr.com/legal/terms
servers:
  - url: https://corelink-api.humangr.com
    description: Production (Cloudflare Durable Object + container)
  - url: http://localhost:50051
    description: Local dev (axum container, PORT env default)
tags:
  - name: signup
    description: Customer onboarding orchestration (atomic tenant + DPA + first PAT
      provisioning).
  - name: dpa
    description: Data Processing Addendum click-through acceptance and re-acceptance.
  - name: tier
    description: Subscription tier selection + Stripe Checkout handoff.
  - name: pat
    description: Personal Access Token CRUD (token material shown once).
  - name: billing
    description: Stripe billing webhook ingestion.
  - name: privacy-dsr
    description: GDPR / LGPD / CCPA Data Subject Request self-service.
  - name: privacy-consent
    description: Consent ledger — symmetric grant / revoke with HMAC proof.
  - name: admin
    description: Admin operations (dual-approval gated, MFA-fresh, audit-emit-BEFORE-mutate).
  - name: enterprise
    description: Enterprise sales inquiry intake.
  - name: users
    description: Current-user profile (Clerk-authenticated).
  - name: data-categories
    description: Reference list of canonical data-category enums (privacy_model §5.6).
  - name: ops
    description: Operational health and browser CSP report intake.
  - name: signup-pilot
    description: Pilot-programme signup-token redemption (HMAC-gated, 14d TTL).
  - name: admin-read-mutate
    description: Admin read + dual-approval-gated mutate (in-memory wire-up
      demonstration; production binding pending).
  - name: admin-pilot
    description: Pilot tenant admin (list / grant-tier / 24h checkin).
  - name: audit-export
    description: Bulk audit-chain export from R2 (per-tenant, signed window).
  - name: audit-analytics
    description: Audit-event analytics aggregates (event-count + timeline).
  - name: reapi-http
    description: HTTP surface for the Remote Execution API v2 (CAS / AC). Backed
      by R2 storage in production; falls back to in-memory for local dev.
  - name: turbo-v8
    description: Turborepo remote-cache bridge (Vercel v8 protocol) — `GET/PUT /v8/artifacts/{hash}`, events, status.
  - name: bazel-v2
    description: Bazel REAPI v2 HTTP bridge — `/bazel/v2/{instance}/blobs/...` and `/bazel/v2/{instance}/findMissingBlobs`.
security:
  - BearerPAT: []
  - ClerkSessionCookie: []
paths:
  /v1/signup:
    x-status: planned
    x-binding: cf-worker-pending
    x-implementing-crate: corelink-signup
    x-reconciliation-note: |
      Distinct intent from the SERVER-ONLY `/v1/signup/pilot/{token}`
      (pilot-program HMAC-token redemption, axum-mounted in
      `crates/corelink-container/src/routes/signup.rs`). The customer-
      facing self-service signup endpoint is the one documented here;
      `crates/corelink-signup` ships the orchestrator + atomic-
      provisioning logic, awaiting the CF Worker entry crate to bind it.
    post:
      tags: [signup]
      summary: Provision a new tenant from a verified Clerk identity.
      operationId: signup
      description: |
        Idempotent signup orchestration. The orchestrator wraps tenant row +
        DPA acceptance row + first PAT issuance in a single atomic D1
        transaction (`INV-ONBOARD-ATOMIC-PROVISIONING`). Stripe customer
        creation is a best-effort saga step — Stripe outage degrades to
        `Deferred` with `billing_intent="deferred"`; the tenant is still
        provisioned and signed up.

        Request body intentionally has **no PAT field** (`CTRL-CRED-001`);
        the first PAT is returned in the response (shown-once token).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
            examples:
              minimal:
                $ref: "#/components/examples/SignupRequestMinimal"
      responses:
        "201":
          description: Tenant provisioned (atomic D1 commit succeeded).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupResponse"
        "202":
          description: Tenant provisioned, billing deferred (Stripe outage / chaos).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          description: Transient backend outage (Stripe or D1); safe to retry with
            same `Idempotency-Key`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/dpa/accept:
    post:
      tags: [dpa]
      summary: Record click-through acceptance of the current DPA version.
      operationId: dpaAccept
      x-status: planned
      x-binding: cf-worker-pending
      x-implementing-crate: corelink-dpa-acceptance
      x-reconciliation-note: |
        Business-logic crate `corelink-dpa-acceptance` ships the service +
        schema (doc-comments mark `POST /v1/dpa/accept` as canonical). Axum
        binding is deferred to PRR per `trait-abstraction-defer` charter
        (tools/openapi/src/lib.rs L29-39 — utoipa derives land with the
        CF Worker entry crate). Reconciled 2026-05-27 per
        specs/_audits/2026-05-27-openapi-reconciliation-seal.md.
      description: |
        Records 6-field consent proof (`notice_text_hash`, `notice_version`,
        `locale`, `wording_id`, `ui_capture_ts`, `submission_ts` server-set)
        and emits an RS256-signed JWT receipt. Idempotent on
        `(tenant_id, notice_text_hash, ui_capture_ts)`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DpaAcceptanceRequest"
      responses:
        "201":
          description: Acceptance recorded; JWT receipt returned and emailed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DpaAcceptanceReceipt"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Idempotent replay — original receipt returned unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DpaAcceptanceReceipt"
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/dpa/re-accept:
    post:
      tags: [dpa]
      summary: Re-accept a major-bumped DPA notice within the 30-day grace window.
      operationId: dpaReAccept
      x-status: planned
      x-binding: cf-worker-pending
      x-implementing-crate: corelink-privacy (dpa::versioning::middleware)
      x-reconciliation-note: |
        `RE_ACCEPT_PATH` const in
        `crates/corelink-privacy/src/dpa/versioning/middleware.rs:67` is the
        canonical gate token used by the read-only-degrade middleware. The
        middleware identifies this path but the actual handler axum mount
        is deferred to the CF Worker entry crate.
      description: |
        When a new DPA version is published the tenant enters a 30-day grace
        window; `corelink-dpa-versioning` middleware flips writes to read-only
        until the customer self-recovers via this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DpaAcceptanceRequest"
      responses:
        "201":
          description: Re-acceptance recorded; tenant returns to read-write.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DpaAcceptanceReceipt"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Grace window expired; tenant is now read-only-frozen and
            requires manual unfreeze via admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/onboarding/tier-select:
    post:
      tags: [tier]
      summary: Select a subscription tier and receive a Stripe Checkout session URL.
      operationId: tierSelect
      x-status: planned
      x-binding: cf-worker-pending
      x-implementing-crate: corelink-tier-selection
      x-reconciliation-note: |
        `crates/corelink-tier-selection/src/lib.rs` doc-comments mark
        `POST /v1/onboarding/tier-select` as canonical (Lote 10.16 fix).
        Sprint S-19 WI-S19-004 (sealed) scopes the handler; the axum
        mount lives in the deferred CF Worker entry crate.
      description: |
        Enforces `INV-ONBOARD-DPA-FIRST` via a D1 lock — tier selection is
        rejected until a DPA acceptance row exists for the tenant.
        Returns a Stripe Checkout session URL; final activation happens
        when the corresponding `checkout.session.completed` event lands
        on `/v1/billing/stripe-webhook`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TierSelectRequest"
      responses:
        "200":
          description: Checkout session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TierSelectResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: DPA-first lock — caller must accept current DPA before
            selecting a tier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/pats:
    x-status: planned
    x-binding: cf-worker-pending
    x-implementing-crate: corelink-pat
    x-reconciliation-note: |
      PAT primitives (`mint`, `verify`, `format`, `argon`, `scopes`) all
      ship in `crates/corelink-pat`. SDK quickstarts (`quickstart_put.py`,
      `quickstart_list.py`) target this path; the binding is on the
      CF Worker entry-crate deferral list.
    post:
      tags: [pat]
      summary: Issue a new Personal Access Token.
      operationId: patIssue
      description: |
        Returns the raw token material **once** (`shown_once`). The token is
        hashed (BLAKE3-keyed) before storage; subsequent reads only ever
        return the hash prefix and metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatIssueRequest"
      responses:
        "201":
          description: PAT issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatIssueResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      tags: [pat]
      summary: List the caller's Personal Access Tokens.
      operationId: patList
      responses:
        "200":
          description: PAT list (metadata only — no raw token material).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PatMetadata"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/pats/{pat_id}:
    x-status: planned
    x-binding: cf-worker-pending
    x-implementing-crate: corelink-pat
    delete:
      tags: [pat]
      summary: Revoke a Personal Access Token by id.
      operationId: patRevoke
      parameters:
        - $ref: "#/components/parameters/PatId"
      responses:
        "204":
          description: Revoked. Subsequent uses MUST fail closed (`INV-PAT-REVOKE-PROPAGATION`).
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/billing/stripe-webhook:
    post:
      tags: [billing]
      summary: Receive a Stripe webhook event (HMAC-SHA256 signature required).
      operationId: stripeWebhook
      description: |
        Implemented at `apps/server::webhook::stripe_webhook_handler`.
        Validates the `Stripe-Signature` header (5-minute replay window),
        deduplicates on `event.id`, then dispatches to the subscription
        handler. Unknown / out-of-scope event types are acknowledged with
        200 OK (fire-and-forget contract).

        **NOT secured by BearerPAT / Clerk** — see `StripeSignature` scheme.
      security:
        - StripeSignature: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
          description: Stripe HMAC-SHA256 signature header (`t=<unix>,v1=<sig>`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StripeWebhookEnvelope"
      responses:
        "200":
          description: Event accepted (including idempotent replays and
            acknowledged unknown event types).
          content:
            text/plain:
              schema:
                type: string
                examples: ["ok"]
        "400":
          description: Missing or invalid signature, or malformed event body.
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Transient backend error; Stripe will retry.
          content:
            text/plain:
              schema:
                type: string
  /v1/privacy/dsr/{action}:
    x-status: planned
    x-binding: cf-worker-pending
    x-implementing-crate: corelink-dsr
    x-reconciliation-note: |
      `crates/corelink-dsr/src/endpoint.rs` marks
      `POST /v1/privacy/dsr/{access|portability|...}` as canonical;
      Sprint S-11 WI-S11-001 (sealed) scopes the 7-endpoint surface.
      Axum mount deferred to CF Worker entry crate.
    post:
      tags: [privacy-dsr]
      summary: Submit a Data Subject Request (GDPR / LGPD / CCPA).
      operationId: dsrSubmit
      description: |
        6 supported actions per `corelink-dsr::event::DsrRequestKind`:
        `access`, `portability`, `rectification`, `erasure`, `restriction`,
        `objection`. Destructive arms (`erasure`, `rectification`) require
        a fresh MFA step-up token via `X-MFA-Step-Up-Token`.

        Returns an RS256-signed JWT receipt (90-day validity) on
        acceptance. SLA deadline is jurisdiction-bound (GDPR 30d / LGPD
        15d / CCPA 45d).
      parameters:
        - name: action
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/DsrAction"
        - name: X-MFA-Step-Up-Token
          in: header
          required: false
          schema:
            type: string
          description: Required when `action` is `erasure` or `rectification`
            (per `corelink-dsr::mfa`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DsrRequest"
      responses:
        "202":
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DsrAcceptedReceipt"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: MFA step-up required (destructive arm) or token expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/privacy/dsr/{request_id}/status:
    x-status: planned
    x-binding: cf-worker-pending
    x-implementing-crate: corelink-dsr
    get:
      tags: [privacy-dsr]
      summary: Poll the status of a previously submitted DSR.
      operationId: dsrStatus
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: UUIDv7 of the DSR request.
      responses:
        "200":
          description: Current status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DsrTicket"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/consent/{purpose}:
    x-status: planned
    x-binding: cf-worker-pending
    x-implementing-crate: corelink-privacy (consent::ledger)
    x-reconciliation-note: |
      Consent data layer present in `corelink-privacy::consent::ledger`
      (doc-comments mark `POST /v1/consent/<purpose>` + `DELETE` symmetric
      revoke as canonical). No axum mount yet; deferred to CF Worker.
    post:
      tags: [privacy-consent]
      summary: Grant consent for one canonical purpose.
      operationId: consentGrant
      description: |
        12 canonical purposes per `privacy_model.md §5.6.1`. Records 6-field
        proof (`notice_text_hash`, `notice_version`, `locale`, `wording_id`,
        `ui_capture_ts`, `submission_ts`) and HMAC-SHA256 signs with
        tenant-scoped key (HKDF `corelink/v1/consent-hmac`).
      parameters:
        - $ref: "#/components/parameters/ConsentPurpose"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentGrantRequest"
      responses:
        "201":
          description: Grant recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentGrantResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [privacy-consent]
      summary: Revoke consent for one canonical purpose (symmetric proof).
      operationId: consentRevoke
      description: |
        Per Lote 9.4 H-05 the revocation row carries the **same 6-field
        proof shape** as the grant. Cascade to downstream processing
        within 24h (`CTRL-PRIV-CONSENT-002`).
      parameters:
        - $ref: "#/components/parameters/ConsentPurpose"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentRevokeRequest"
      responses:
        "200":
          description: Revocation recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentRevokeResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/consent:
    x-status: planned
    x-binding: cf-worker-pending
    x-implementing-crate: corelink-privacy (consent::ledger)
    get:
      tags: [privacy-consent]
      summary: List all grants + revocations for the calling subject.
      operationId: consentHistory
      responses:
        "200":
          description: Consent history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentHistoryResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/consent/verify:
    x-status: planned
    x-binding: cf-worker-pending
    x-implementing-crate: corelink-privacy (consent::hmac_sign)
    get:
      tags: [privacy-consent]
      summary: Public stateless verify of a grant signature.
      operationId: consentVerifyGrant
      security: []
      parameters:
        - name: signature
          in: query
          required: true
          schema:
            type: string
        - name: consent_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: tenant_short
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Verification result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentVerifyResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/consent/revocation/verify:
    x-status: planned
    x-binding: cf-worker-pending
    x-implementing-crate: corelink-privacy (consent::hmac_sign)
    get:
      tags: [privacy-consent]
      summary: Public stateless verify of a revocation signature.
      operationId: consentVerifyRevocation
      security: []
      parameters:
        - name: revocation_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Verification result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentVerifyResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/admin/ops:
    x-status: planned
    x-binding: cf-worker-pending
    x-implementing-crate: corelink-ops (admin::api) + corelink-dual-approval
    x-reconciliation-note: |
      `crates/corelink-ops/src/admin/api.rs` carries the `corelink-admin-api`
      pipeline + dual-approval gate. Distinct intent from the SERVER-ONLY
      `/v1/admin/read/:resource` + `/v1/admin/mutate` placeholder routes,
      which expose an in-memory admin handler used for the wave-11 wire-up
      demonstration. The dual-approval-gated `/v1/admin/ops*` family is the
      production surface; CF Worker entry crate binds it.
    post:
      tags: [admin]
      summary: Submit a dual-approval-gated admin operation.
      operationId: adminOpsSubmit
      description: |
        Implemented by `corelink-admin-api::middleware::AdminApiPipeline`.
        Enforces `INV-ADMIN-DUAL-APPROVAL` (caller + distinct approver
        with fresh MFA) and audit-emit-BEFORE-handler atomically.
        Op taxonomy: `ConfigRollback`, `SecretRotationStart`,
        `TenantTombstone`, plus runbook-specific variants.
      security:
        - BearerPAT: [admin]
      parameters:
        - $ref: "#/components/parameters/AdminOperationReason"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminOpRequest"
      responses:
        "202":
          description: Op accepted; result available at
            `GET /v1/admin/ops/{op_id}`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOpAccepted"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Approver collision (caller == approver) or duplicate nonce.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/admin/ops/{op_id}:
    x-status: planned
    x-binding: cf-worker-pending
    x-implementing-crate: corelink-ops (admin::api)
    get:
      tags: [admin]
      summary: Inspect an admin op (status + audit envelope).
      operationId: adminOpGet
      security:
        - BearerPAT: [admin]
      parameters:
        - $ref: "#/components/parameters/AdminOpId"
      responses:
        "200":
