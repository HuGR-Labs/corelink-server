  /v1/signup/pilot/{token}:
    x-status: implemented
    x-implementing-handler: crates/corelink-container/src/routes/signup.rs (handle_pilot_signup)
    post:
      tags: [signup-pilot]
      summary: Redeem an HMAC-signed pilot signup token.
      operationId: pilotSignup
      description: |
        Server-only route (axum-mounted). Token format
        `pilot_<env>_<unix_ms>_<16-hex-random>.<hmac-hex>` verified in
        constant time via `subtle::ConstantTimeEq`. TTL 14 days from mint.
        Rate-limited 5/IP/hour. Audit-emit fail-CLOSED per
        `INV-AUDIT-EMIT-ATOMIC-WITH-HANDLER`.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            pattern: "^pilot_(staging|prod)_[0-9]+_[0-9a-f]{16}\\.[0-9a-f]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PilotSignupRequest"
      responses:
        "201":
          description: Pilot tenant reserved; activation URL returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotSignupResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Malformed / expired / forged token.
          content:
            text/plain:
              schema: { type: string }
        "429":
          description: Per-IP rate limit exceeded.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
        "503":
          description: Audit pipeline or signup store unavailable (fail-CLOSED).
          content:
            text/plain:
              schema: { type: string }

