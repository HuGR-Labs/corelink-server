  /v1/audit/{tenant}/export:
    x-status: implemented
    x-implementing-handler: crates/corelink-container/src/routes/audit_export/handler.rs (handle_export)
    x-served-at: crates/corelink-container/src/routes/audit_export/types.rs:20 (AUDIT_EXPORT_ROUTE)
    get:
      tags: [audit-export]
      summary: Stream a bulk audit-chain export from R2.
      operationId: auditExport
      description: |
        Streams the per-tenant audit chain over the supplied `[from, to)`
        window. Window bounds accept either ISO 8601 UTC
        (`YYYY-MM-DDTHH:MM:SSZ`) or raw Unix epoch milliseconds. Cross-
        tenant attempts emit a security audit row BEFORE the 403.
      security:
        - BearerPAT: [admin]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
          description: Inclusive lower bound (ISO 8601 UTC or Unix ms).
        - name: to
          in: query
          required: true
          schema: { type: string }
          description: Exclusive upper bound (same shapes as `from`).
        - name: tenant
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: |
            The tenant whose chain is exported. When it differs from the
            authenticated principal's tenant, the route emits a cross-tenant
            attempt audit row and returns 403.
        - name: X-Tenant-Id
          in: header
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: NDJSON stream of audit events.
          content:
            application/x-ndjson:
              schema:
                type: string
          headers:
            X-Chain-Head-Anchor:
              schema: { type: string }
              description: Hex BLAKE3 hash anchor for client verification.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Cross-tenant attempt or canceled tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429":
          description: Per-tenant rate limit exceeded.
          headers:
            Retry-After:
              schema: { type: integer }

