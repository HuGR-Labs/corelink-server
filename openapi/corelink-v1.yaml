    x-binding-note: |
      Backed by R2 storage in production (falls back to InMemory when creds
      absent). Cross-tenant denials are enforced at the route boundary and
      emit audit rows before the 403. Route constant:
      `CAS_READ_ROUTE = "/v1/cas/:tenant/:hash"`.
    get:
      tags: [reapi-http]
      summary: Read a CAS blob by `(tenant, content-hash)`.
      operationId: casRead
      security:
        - BearerPAT: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema: { type: string }
        - name: hash
          in: path
          required: true
          schema:
            type: string
            description: Hex BLAKE3 digest.
      responses:
        "200":
          description: Blob bytes (opaque payload).
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Cross-tenant attempt — audit row emitted before 403.
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [reapi-http]
      summary: Write a CAS blob by `(tenant, content-hash)`.
      operationId: casWrite
      security:
        - BearerPAT: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema: { type: string }
        - name: hash
          in: path
          required: true
          schema:
            type: string
            description: Hex BLAKE3 digest the caller claims for this body.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
        description: Raw blob bytes. The handler verifies the hash against the path parameter before committing.
      responses:
        "201":
          description: Blob stored (durable commit). Body echoes the content hash.
          content:
            text/plain:
              schema: { type: string }
        "200":
          description: Idempotent re-write — blob already existed with identical hash.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Cross-tenant attempt.
        "422":
          description: Hash mismatch — body bytes do not match the claimed digest.

