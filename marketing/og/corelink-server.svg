<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B0F14;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2235" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>
  <!-- Subtle grid overlay -->
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.4"/>

  <!-- Accent line top -->
  <rect x="0" y="0" width="1280" height="4" fill="#22D3EE"/>

  <!-- Left accent bar -->
  <rect x="80" y="160" width="4" height="280" fill="#22D3EE" rx="2"/>

  <!-- Accent glow blob top-right -->
  <ellipse cx="1100" cy="120" rx="200" ry="120" fill="#22D3EE" opacity="0.04"/>

  <!-- Title: CoreLink -->
  <text x="112" y="300"
    font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-size="96"
    font-weight="700"
    fill="#F8FAFC"
    letter-spacing="-2">CoreLink</text>

  <!-- Subtitle -->
  <text x="112" y="375"
    font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-size="36"
    font-weight="400"
    fill="#94A3B8">REAPI v2 build cache. BYOK. Verifiable audit log.</text>

  <!-- Accent separator -->
  <rect x="112" y="415" width="120" height="3" fill="#22D3EE" rx="1.5"/>

  <!-- Bottom-right watermark -->
  <text x="1200" y="615"
    font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-size="24"
    font-weight="400"
    fill="#475569"
    text-anchor="end">humangr.com</text>

  <!-- Bottom accent line -->
  <rect x="0" y="636" width="1280" height="4" fill="#22D3EE" opacity="0.3"/>
</svg>
