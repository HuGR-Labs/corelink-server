<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B0F14;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2235" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.4"/>

  <!-- Accent line top -->
  <rect x="0" y="0" width="1280" height="4" fill="#22D3EE"/>

  <!-- Left accent bar -->
  <rect x="80" y="160" width="4" height="280" fill="#22D3EE" rx="2"/>

  <!-- Accent glow blob -->
  <ellipse cx="1100" cy="120" rx="200" ry="120" fill="#22D3EE" opacity="0.04"/>

  <!-- Terminal prompt icon area (top-right) -->
  <rect x="900" y="160" width="300" height="200" rx="12" fill="#0D1117" opacity="0.6"/>
  <text x="920" y="200"
    font-family="'SF Mono', 'Fira Code', 'Courier New', monospace"
    font-size="18"
    fill="#22D3EE">$</text>
  <text x="940" y="200"
    font-family="'SF Mono', 'Fira Code', 'Courier New', monospace"
    font-size="18"
    fill="#94A3B8"> corelink import .</text>
  <text x="920" y="228"
    font-family="'SF Mono', 'Fira Code', 'Courier New', monospace"
    font-size="16"
    fill="#475569">✓ 847 artifacts cached</text>
  <text x="920" y="254"
    font-family="'SF Mono', 'Fira Code', 'Courier New', monospace"
    font-size="16"
    fill="#475569">✓ BLAKE3 verified</text>
  <text x="920" y="280"
    font-family="'SF Mono', 'Fira Code', 'Courier New', monospace"
    font-size="16"
    fill="#475569">✓ audit log sealed</text>
  <text x="920" y="340"
    font-family="'SF Mono', 'Fira Code', 'Courier New', monospace"
    font-size="18"
    fill="#22D3EE">_</text>

  <!-- Title: corelink CLI -->
  <text x="112" y="300"
    font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-size="96"
    font-weight="700"
    fill="#F8FAFC"
    letter-spacing="-2">corelink CLI</text>

  <!-- Subtitle -->
  <text x="112" y="375"
    font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-size="36"
    font-weight="400"
    fill="#94A3B8">Bazel · Buck2 · Cargo · npm · OCI</text>

  <!-- Accent separator -->
  <rect x="112" y="415" width="120" height="3" fill="#22D3EE" rx="1.5"/>

  <!-- Bottom-right watermark -->
  <text x="1200" y="615"
    font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-size="24"
    font-weight="400"
    fill="#475569"
    text-anchor="end">humangr.com</text>

  <!-- Bottom accent line -->
  <rect x="0" y="636" width="1280" height="4" fill="#22D3EE" opacity="0.3"/>
</svg>
