<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B0F14;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2235" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.4"/>

  <!-- Accent line top -->
  <rect x="0" y="0" width="1280" height="4" fill="#22D3EE"/>

  <!-- Left accent bar -->
  <rect x="80" y="160" width="4" height="280" fill="#22D3EE" rx="2"/>

  <!-- Accent glow blob -->
  <ellipse cx="1100" cy="120" rx="200" ry="120" fill="#22D3EE" opacity="0.04"/>

  <!-- Step indicators (top right) -->
  <g transform="translate(880, 170)">
    <!-- Step 1 -->
    <circle cx="20" cy="20" r="18" fill="#22D3EE" opacity="0.15"/>
    <circle cx="20" cy="20" r="18" fill="none" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#22D3EE" text-anchor="middle">1</text>
    <text x="48" y="26" font-family="system-ui, sans-serif" font-size="16" fill="#94A3B8">Add .bazelrc snippet</text>

    <!-- Step 2 -->
    <circle cx="20" cy="72" r="18" fill="#22D3EE" opacity="0.15"/>
    <circle cx="20" cy="72" r="18" fill="none" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="20" y="78" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#22D3EE" text-anchor="middle">2</text>
    <text x="48" y="78" font-family="system-ui, sans-serif" font-size="16" fill="#94A3B8">Set CORELINK_TOKEN</text>

    <!-- Step 3 -->
    <circle cx="20" cy="124" r="18" fill="#22D3EE" opacity="0.15"/>
    <circle cx="20" cy="124" r="18" fill="none" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="20" y="130" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#22D3EE" text-anchor="middle">3</text>
    <text x="48" y="130" font-family="system-ui, sans-serif" font-size="16" fill="#94A3B8">bazel build //...</text>

    <!-- Step 4 -->
    <circle cx="20" cy="176" r="18" fill="#22D3EE" opacity="0.15"/>
    <circle cx="20" cy="176" r="18" fill="none" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="20" y="182" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#22D3EE" text-anchor="middle">4</text>
    <text x="48" y="182" font-family="system-ui, sans-serif" font-size="16" fill="#94A3B8">Cache hits verified</text>

    <!-- Step 5 -->
    <circle cx="20" cy="228" r="18" fill="#22D3EE" opacity="0.15"/>
    <circle cx="20" cy="228" r="18" fill="none" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="20" y="234" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#22D3EE" text-anchor="middle">5</text>
    <text x="48" y="234" font-family="system-ui, sans-serif" font-size="16" fill="#94A3B8">Done — &lt;5 min total</text>
  </g>

  <!-- Title: CoreLink + Bazel -->
  <text x="112" y="300"
    font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-size="88"
    font-weight="700"
    fill="#F8FAFC"
    letter-spacing="-2">CoreLink + Bazel</text>

  <!-- Subtitle -->
  <text x="112" y="375"
    font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-size="36"
    font-weight="400"
    fill="#94A3B8">5-minute setup walkthrough</text>

  <!-- Accent separator -->
  <rect x="112" y="415" width="120" height="3" fill="#22D3EE" rx="1.5"/>

  <!-- Bottom-right watermark -->
  <text x="1200" y="615"
    font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-size="24"
    font-weight="400"
    fill="#475569"
    text-anchor="end">humangr.com</text>

  <!-- Bottom accent line -->
  <rect x="0" y="636" width="1280" height="4" fill="#22D3EE" opacity="0.3"/>
</svg>
