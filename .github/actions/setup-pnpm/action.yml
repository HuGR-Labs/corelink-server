name: Set up pnpm (offline-first)
description: >-
  Make pnpm available without the shared-directory race that corrupts it on our
  self-hosted runners. `pnpm/action-setup` installs pnpm into a shared,
  non-ephemeral location (~/setup-pnpm); because all of our self-hosted runners
  share a single $HOME on one physical Mac, concurrent runs overwrite each
  other's install mid-flight and leave it half-written (e.g. a missing
  pnpm/dist/worker.js → MODULE_NOT_FOUND during `pnpm install`). That made
  admin-ui CI fail nondeterministically for dozens of runs.

  This action prefers the runner's pre-installed pnpm (pinned to the same
  version as package.json's `packageManager`) — zero network, zero shared-dir
  writes — and only falls back to the pinned `pnpm/action-setup` download when a
  runner genuinely lacks pnpm (e.g. a future hosted/Linux runner). On runners
  that already have pnpm, the fallback never runs, so the race is eliminated.

inputs:
  version:
    description: pnpm version to require (and to download in the fallback).
    required: false
    default: "10.32.1"

runs:
  using: composite
  steps:
    - name: Use pre-installed pnpm if it matches the pinned version
      id: preinstalled
      shell: bash
      run: |
        set -euo pipefail
        want="${{ inputs.version }}"
        if command -v pnpm >/dev/null 2>&1 && [ "$(pnpm --version 2>/dev/null)" = "$want" ]; then
          echo "Using pre-installed pnpm $want at $(command -v pnpm) — no network, no shared-dir race."
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          found="$(command -v pnpm >/dev/null 2>&1 && pnpm --version 2>/dev/null || echo none)"
          echo "pnpm $want not pre-installed (found: $found) — falling back to the pinned download."
          echo "ok=false" >> "$GITHUB_OUTPUT"
        fi

    # Insurance for runners without a system pnpm. Never executes on our
    # self-hosted Mac fleet (which has pnpm), so it cannot reintroduce the race.
    - name: Fall back to the pinned pnpm download
      if: steps.preinstalled.outputs.ok != 'true'
      uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v4.1.0
      with:
        version: ${{ inputs.version }}

    # The SAME shared-$HOME race as above, one layer down. The steps above
    # isolated the pnpm BINARY; every runner still wrote to ONE content-
    # addressable STORE (~/Library/pnpm/store/v10). Concurrent installs across
    # the runners on this one Mac corrupt it — observed 2026-08-02:
    #   ERR_PNPM_ENOENT  the source path is not an existing regular file,
    #   reflink '…/store/v10/files/a7/499a…' -> '…/node_modules/…'
    # i.e. a store entry vanished mid-install because a sibling job was mutating
    # it. `pnpm store prune` then also failed — the store was genuinely damaged,
    # and every job sharing it stayed broken until it was repaired by hand.
    #
    # Give each runner its OWN store. Still persistent, so the offline-first
    # cache benefit is kept (this is deliberately NOT $RUNNER_TEMP) — just no
    # longer shared. Hosted runners have a private $HOME, so this is a no-op
    # there. Verified on a run with 7 pnpm workflows on the mac fleet: the same
    # lighthouse job that failed with ERR_PNPM_ENOENT passed once the store was
    # per-runner.
    - name: Isolate the pnpm store per runner (shared-$HOME race, store layer)
      shell: bash
      run: |
        set -euo pipefail
        slug="$(printf '%s' "${RUNNER_NAME:-default}" | tr -c 'A-Za-z0-9_.-' '-')"
        store="${HOME}/.pnpm-store-${slug}"
        mkdir -p "$store"
        # pnpm honours npm-style config env vars; this scopes every later
        # `pnpm install` in the job without touching any workflow file.
        echo "npm_config_store_dir=${store}" >> "$GITHUB_ENV"
        echo "pnpm store for ${RUNNER_NAME:-default}: ${store}"
