name: Audit finding coverage

on:
  pull_request:
    paths:
      - 'BACKLOG.md'
      - 'docs/security/2026-06-15-launch-due-diligence-audit.md'
      - 'reports/audits/2026-08-26-go-live-readiness.md'
      - 'docs/security/2026-07-02-pilot-identity-brutal-audit.md'
      - 'reports/audit-finding-decisions/v1.json'
      - 'scripts/verify_audit_finding_coverage.py'
      - 'tests/test_audit_finding_coverage.py'
      - '.github/workflows/audit-finding-coverage.yml'
  push:
    branches: [main]
    paths:
      - 'BACKLOG.md'
      - 'docs/security/2026-06-15-launch-due-diligence-audit.md'
      - 'reports/audits/2026-08-26-go-live-readiness.md'
      - 'docs/security/2026-07-02-pilot-identity-brutal-audit.md'
      - 'reports/audit-finding-decisions/v1.json'
      - 'scripts/verify_audit_finding_coverage.py'
      - 'tests/test_audit_finding_coverage.py'
      - '.github/workflows/audit-finding-coverage.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: audit-finding-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # This gate deliberately stays on the existing self-hosted fleet: parsing
    # local evidence needs no paid hosted runner and must not be cost-gated.
    runs-on: corelink
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
      - name: Re-derive every source finding and its decision
        run: python3 scripts/verify_audit_finding_coverage.py --format json
      - name: Install test dependency in a local virtual environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python3 -m pip install --quiet --upgrade pip
          .venv/bin/python3 -m pip install --quiet -r requirements-ci.txt
      - name: Prove red controls are still red
        run: .venv/bin/python3 -m pytest tests/test_audit_finding_coverage.py -q
