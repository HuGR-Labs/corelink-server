name: B-165 latency evidence monitor

# The scheduled run keeps the unauthenticated refusal population fresh while
# the customer-PAT prerequisite for the served population remains unresolved.
# A refusal-only run is intentionally partial/open and never reports closure.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "Population to measure"
        required: true
        default: refusal
        type: choice
        options:
          - refusal
          - served

permissions:
  contents: read

concurrency:
  group: b165-latency-monitor
  cancel-in-progress: true

jobs:
  refusal:
    if: github.event_name == 'schedule' || inputs.mode != 'served'
    name: measure refusal and control populations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run bounded refusal probe
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set -u -o pipefail
          raw="$RUNNER_TEMP/b165-refusal.tsv"
          B165_MODE=refusal B165_SAMPLES=10 B165_RAW_OUT="$raw" \
            scripts/probe-wp-b165-latency.sh
          rc=$?
          printf '%s\n' "$rc" > "$RUNNER_TEMP/b165-exit-code"
          python3 scripts/verify_b165_latency.py "$raw" --samples 10 > "$RUNNER_TEMP/b165-verdict.json"
          verifier_rc=$?
          printf '%s\n' "$verifier_rc" > "$RUNNER_TEMP/b165-verifier-exit-code"
          # Exit 2 is the expected partial/open result until served credentials
          # are provisioned. Transport or shape failures remain visible as red.
          if [[ "$rc" -ne 2 || "$verifier_rc" -ne 2 ]]; then
            exit 1
          fi

      - name: Upload latency evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: b165-latency-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/b165-refusal.tsv
            ${{ runner.temp }}/b165-verdict.json
            ${{ runner.temp }}/b165-exit-code
            ${{ runner.temp }}/b165-verifier-exit-code
          if-no-files-found: error
          retention-days: 30

      - name: Surface unexpected probe or verifier result
        if: always()
        shell: bash
        run: |
          probe_rc="$(cat "$RUNNER_TEMP/b165-exit-code")"
          verifier_rc="$(cat "$RUNNER_TEMP/b165-verifier-exit-code")"
          if [[ "$probe_rc" != 2 || "$verifier_rc" != 2 ]]; then
            echo "B-165 monitor did not produce the expected partial/open refusal result." >&2
            exit 1
          fi

  served:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'served'
    name: measure two existing served objects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CANARY_PAT: ${{ secrets.CORELINK_CANARY_PAT }}
      DOGFOOD_PAT: ${{ secrets.CORELINK_SCCACHE_TOKEN }}
      CANARY_TENANT: 93da3f7a-984d-4ef9-86e0-b0bd9fd0252e
      DOGFOOD_TENANT: ee30f7ba-fc25-4d71-939e-ebe130b4c6a3
      CANARY_DIGEST: 28cf8cf855dbf4f9a40949d44d4ba5ce2db8d0386e08105c52244f495ab0b441
      DOGFOOD_DIGEST: 725ef6c9168c2409ddbe2ef07a8b3648712580398a281c7581d85c3595c44525
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Measure only authenticated served populations
        shell: bash
        run: |
          set -euo pipefail
          : "${CANARY_PAT:?CORELINK_CANARY_PAT is not bound}"
          : "${DOGFOOD_PAT:?CORELINK_SCCACHE_TOKEN is not bound}"
          api=https://corelink-api.humangr.com
          served_a="/v1/cas/$CANARY_TENANT/$CANARY_DIGEST"
          served_b="/v1/cas/$DOGFOOD_TENANT/$DOGFOOD_DIGEST"

          raw="$RUNNER_TEMP/b165-served-only.tsv"
          timing="$RUNNER_TEMP/b165-served-timing.tsv"
          : > "$raw"
          : > "$timing"
          sample_one() {
            local surface="$1" request_path="$2" token="$3" sample="$4"
            local line headers server_total_ms transport_ms
            headers="$RUNNER_TEMP/b165-$surface-$sample.headers"
            line="$(curl --connect-timeout 10 --max-time 20 --silent --show-error \
              --output /dev/null --dump-header "$headers" \
              --write-out '%{http_code}\t%{time_total}\t%{exitcode}' \
              -H "Authorization: Bearer $token" "$api$request_path")"
            IFS=$'\t' read -r status seconds curl_rc <<<"$line"
            printf 'served\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$surface" "$request_path" "$sample" "$status" "$curl_rc" "$seconds" >> "$raw"
            server_total_ms="$(tr -d '\r' < "$headers" | awk 'BEGIN{IGNORECASE=1}
              /^server-timing:/ { sub(/^[^:]+:[[:space:]]*/, ""); n=split($0,p,",");
                for(i=1;i<=n;i++){gsub(/^[[:space:]]+|[[:space:]]+$/, "", p[i]);
                  if(p[i] ~ /^total;dur=[0-9]+([.][0-9]+)?$/){sub(/^total;dur=/,"",p[i]); print p[i]; exit}}}')"
            test -n "$server_total_ms"
            transport_ms="$(awk -v curl_s="$seconds" -v server_ms="$server_total_ms" \
              'BEGIN { printf "%.3f", curl_s * 1000 - server_ms }')"
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$surface" "$request_path" "$sample" "$seconds" "$server_total_ms" "$transport_ms" >> "$timing"
            rm -f "$headers"
          }
          for sample in {1..10}; do sample_one served_a "$served_a" "$CANARY_PAT" "$sample"; done
          for sample in {1..10}; do sample_one served_b "$served_b" "$DOGFOOD_PAT" "$sample"; done

          composite="$RUNNER_TEMP/b165-complete.tsv"
          awk -F '\t' '$2 != "v2"' evidence/owner-actions/B-165/rejection-raw-2026-09-09.tsv > "$composite"
          cat evidence/owner-actions/B-165/oci-recovery-raw-2026-09-09.tsv "$raw" >> "$composite"
          fp_a="sha256:$(printf '%s' "$CANARY_PAT" | sha256sum | awk '{print $1}')"
          fp_b="sha256:$(printf '%s' "$DOGFOOD_PAT" | sha256sum | awk '{print $1}')"
          test "$fp_a" != "$fp_b"
          python3 scripts/verify_b165_latency.py "$composite" --samples 10 --require-served \
            --tenant-a "$CANARY_TENANT" --tenant-b "$DOGFOOD_TENANT" \
            --pat-fingerprint-a "$fp_a" --pat-fingerprint-b "$fp_b" \
            --server-timing-tsv "$timing" \
            > "$RUNNER_TEMP/b165-served-verdict.json"

      - name: Upload sanitized served evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: b165-served-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/b165-served-only.tsv
            ${{ runner.temp }}/b165-served-timing.tsv
            ${{ runner.temp }}/b165-complete.tsv
            ${{ runner.temp }}/b165-served-verdict.json
          if-no-files-found: error
          retention-days: 30
