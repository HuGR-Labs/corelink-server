name: issue 2374 hosted policy proof

# This proof executes the original commands and pinned mutating actions against
# a local in-memory GitHub API. The full coverage command runs on GitHub-hosted
# Ubuntu and its artifact receipt is checked in the same workflow run.
on:
  pull_request:
    paths:
      - ".github/workflows/bot-pr-has-checks.yml"
      - ".github/workflows/coverage.yml"
      - ".github/workflows/dependabot-auto-merge.yml"
      - ".github/workflows/dependabot-policy-trust-boundary.yml"
      - ".github/workflows/dependabot-policy.yml"
      - ".github/workflows/lockfile-diff.yml"
      - ".github/workflows/permission-matrix.yml"
      - ".github/workflows/pr-labels.yml"
      - ".github/workflows/stale.yml"
      - ".github/workflows/welcome-first-pr.yml"
      - ".github/workflows/issue-2374-hosted-policy-proof.yml"
      - "scripts/verify_hosted_runner_migration_contract.py"
      - "scripts/verify_issue_2374_hosted_proof.py"
      - "scripts/test_dependabot_policy_trust_boundary.sh"
      - "scripts/test_ci_use_host_toolchain.sh"
      - "scripts/validate_permission_matrix.py"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full commit SHA to inspect and execute through the safe proof
        required: true
        type: string
      baseline_sha:
        description: Full immutable base SHA whose workflow protections must be retained
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: issue-2374-hosted-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: scoped policy commands and pinned actions against local GitHub mock
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require the exact candidate SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" || "$GITHUB_EVENT_NAME" == "pull_request" ]]

      - name: Checkout candidate without persisting credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout immutable policy baseline without persisting credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.baseline_sha }}
          path: _baseline
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout the scoped pinned labeler action
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: actions/labeler
          ref: b8dd2d9be0f68b860e7dae5dae7d772984eacd6d
          path: _proof_actions/labeler
          persist-credentials: false

      - name: Checkout the scoped pinned stale action
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: actions/stale
          ref: 1e223db275d687790206a7acac4d1a11bd6fe629
          path: _proof_actions/stale
          persist-credentials: false

      - name: Install the workspace-pinned Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # workspace pin
        with:
          toolchain: 1.91.1

      - name: Install cargo-deny at the workflow-pinned version
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-deny@0.19.8

      - name: Verify exact candidate checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.expected_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$EXPECTED_SHA" ]]

      - name: Verify immutable baseline checkout
        shell: bash
        env:
          BASELINE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.baseline_sha }}
        run: |
          set -euo pipefail
          [[ "$BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual="$(git -C _baseline rev-parse HEAD)"
          [[ "$actual" == "$BASELINE_SHA" ]]

      - name: Install checksum-pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" \
            --output "${archive}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${archive}" \
            | sha256sum --check --status
          mkdir -p "${RUNNER_TEMP}/actionlint"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/actionlint" actionlint
          "${RUNNER_TEMP}/actionlint/actionlint" -version

      - name: Lint all issue-scoped workflows and proof workflow
        run: >-
          "${RUNNER_TEMP}/actionlint/actionlint" -color -config-file .actionlint.yaml
          .github/workflows/bot-pr-has-checks.yml
          .github/workflows/coverage.yml
          .github/workflows/dependabot-auto-merge.yml
          .github/workflows/dependabot-policy-trust-boundary.yml
          .github/workflows/dependabot-policy.yml
          .github/workflows/lockfile-diff.yml
          .github/workflows/permission-matrix.yml
          .github/workflows/pr-labels.yml
          .github/workflows/stale.yml
          .github/workflows/welcome-first-pr.yml
          .github/workflows/issue-2374-hosted-policy-proof.yml

      - name: Check the closed hosted inventory and runner regressions
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.expected_sha }}
        run: >-
          python3 -S scripts/verify_hosted_runner_migration_contract.py
          --root . --inventory bundle-2374 --expected-head "$EXPECTED_SHA"

      - name: Exercise static inventory negative controls
        run: python3 -S scripts/verify_hosted_runner_migration_contract.py --self-test

      - name: Install pytest for the published permission matrix regression suite
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python3 -m pip install --quiet --upgrade pip
          .venv/bin/python3 -m pip install --quiet -r requirements-ci.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run the published permission matrix regression suite
        run: python3 -m pytest -q tests/test_validate_permission_matrix.py

      - name: Execute workflow commands and pinned actions against disposable fixtures
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.expected_sha }}
        run: >-
          python3 -S scripts/verify_issue_2374_hosted_proof.py
          --root . --baseline-root _baseline --actions-root _proof_actions
          --expected-head "$EXPECTED_SHA"

  coverage:
    name: full hosted coverage workload and artifact receipt
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate without persisting credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install workspace-pinned Rust toolchain with coverage component
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # workspace pin
        with:
          toolchain: 1.91.1
          components: llvm-tools-preview

      - name: Cache Cargo registry and build outputs
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        if: runner.environment == 'github-hosted'
        with:
          shared-key: coverage-proof

      - name: Install protoc
        uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-llvm-cov@0.6.16

      - name: Run the production coverage command
        run: bash scripts/coverage.sh

      - name: Upload coverage report and capture artifact receipt
        id: coverage-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-2374-coverage-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.expected_sha }}
          path: target/coverage/html/
          retention-days: 90
          if-no-files-found: error

      - name: Verify coverage output and upload receipt
        env:
          COVERAGE_ARTIFACT_ID: ${{ steps.coverage-artifact.outputs.artifact-id }}
          COVERAGE_ARTIFACT_URL: ${{ steps.coverage-artifact.outputs.artifact-url }}
          COVERAGE_ARTIFACT_DIGEST: ${{ steps.coverage-artifact.outputs.artifact-digest }}
        run: python3 -S scripts/verify_issue_2374_hosted_proof.py --root . --verify-coverage-receipt
