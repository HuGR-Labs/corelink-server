name: S-08 ship gate (WI-S08-006)

# Sprint-level ship-gate workflow per WI-S08-006 §6.1.10. Drives the
# host-side cross-component prop suite + RB-FM-250 dry-run + validators
# chain so a regression cannot land without a CI failure.
#
# This workflow runs:
#   1. Validators (specs + INV promotion + migration additivity).
#   2. Cross-component property tests at 10k iter PR speed.
#   3. RB-FM-250 host-side dry-run script.
#   4. DASH-RATE dashboard JSON parse smoke.
#   5. DASH-RATE alert rules YAML parse smoke.
#   6. Aggregate gate (fan-in for required-status-checks branch
#      protection rule).
#
# All gates fail-closed (HIGH_RISK lane FF-HR-005 + FF-HR-002).
# Per WI §6.1.10 dependency chain: WI-S08-001..005 SEALED is a
# prerequisite; this workflow runs at WI-S08-006 SEAL + on every
# subsequent PR that touches ratelimit / edge / quota-cas / abuse /
# rate-headers code, the canonical migration files, the runbooks,
# the dashboard JSON, or the alert rules YAML.

on:
  pull_request:
    paths:
      - 'crates/corelink-ratelimit/**'
      - 'crates/corelink-cas/**'
      - 'crates/corelink-billing/**'
      - 'crates/corelink-rate-headers/**'
      - 'specs/05_quality/runbooks/RB-FM-250-ddos-volumetric.md'
      - 'scripts/rb_fm_250_dry_run.sh'
      - 'dashboards/grafana/DASH-RATE.json'
      - 'dashboards/alerts/dash-rate-alerts.yml'
      - 'specs/04_sprints/S08/**'
      - '.github/workflows/s08-ship-gate.yml'
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # --------------------------------------------------------------------
  # NOTE (CI-OPT-003): The `validators` job (validate_specs/inv/refs +
  # check_migrations_additive) has been moved to `spec_validation.yml` as
  # the single source of truth. Branch protection requires
  # `spec_validation / spec-validation` as a separate REQUIRED status
  # check on all PRs touching `specs/**`, so removing the duplicate
  # validators job here does not weaken the gate.
  # --------------------------------------------------------------------
  # 1. Cross-component property tests + lib unit at PR speed.
  # --------------------------------------------------------------------
  prop-and-tests:
    name: corelink-{ratelimit,cas,billing,rate-headers} tests (lib + prop @ 10k iter)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-04-29

      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        with:
          workspaces: ". -> target"

      - uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: cargo test -p corelink-ratelimit --all-targets
        run: cargo test -p corelink-ratelimit --all-targets

      - name: cargo test -p corelink-cas --all-targets
        run: cargo test -p corelink-cas --all-targets

      - name: cargo test -p corelink-billing --all-targets
        run: cargo test -p corelink-billing --all-targets

      - name: cargo test -p corelink-rate-headers --all-targets
        run: cargo test -p corelink-rate-headers --all-targets

      - name: cargo clippy -- -D warnings
        run: cargo clippy --workspace --all-targets --features corelink-worker/tower-middleware -- -D warnings

  # --------------------------------------------------------------------
  # 2. RB-FM-250 host-side dry-run script.
  # --------------------------------------------------------------------
  rb-dry-runs:
    name: RB-FM-250 host-side dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [prop-and-tests]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-04-29

      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        with:
          workspaces: ". -> target"

      - uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: RB-FM-250 dry-run (DDoS volumetric)
        run: bash scripts/rb_fm_250_dry_run.sh

  # --------------------------------------------------------------------
  # 3. DASH-RATE dashboard JSON + alert rules YAML parse smoke.
  # --------------------------------------------------------------------
  dashboard-smoke:
    name: DASH-RATE parse smoke
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # No actions/setup-python: the self-hosted mac fleet cannot provision
      # Python via setup-python (RUNNER_TOOL_CACHE is unset, falls back to
      # the unwritable /Users/runner hosted path and dies with
      # `mkdir: /Users/runner: Permission denied`). Use system python3
      # and ensure pyyaml is available (mirrors spec_validation.yml). (2026-06-03)
      - name: Ensure pyyaml (system python3)
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null && exit 0
          python3 -m venv .venv-smoke
          .venv-smoke/bin/pip install --quiet pyyaml
          echo "$PWD/.venv-smoke/bin" >> "$GITHUB_PATH"

      - name: DASH-RATE.json parse smoke
        run: python3 -c "import json; json.load(open('dashboards/grafana/DASH-RATE.json'))"

      - name: dash-rate-alerts.yml parse smoke
        run: python3 -c "import yaml; yaml.safe_load(open('dashboards/alerts/dash-rate-alerts.yml'))"

  # --------------------------------------------------------------------
  # 4. Aggregate gate (fan-in for required-status-checks branch
  #    protection rule).
  # --------------------------------------------------------------------
  s08-ship-gate:
    name: S-08 ship gate (aggregate)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: [prop-and-tests, rb-dry-runs, dashboard-smoke]
    steps:
      - name: Aggregate
        run: echo "S-08 ship gate green; all canonical sub-gates passed."
