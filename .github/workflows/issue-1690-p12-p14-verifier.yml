name: issue-1690 P12-P14 current-main verifier

# Manual evidence lane only.  The historical integration was squash-merged in
# #1746, so the source commits are retained as inventory while the reachable
# merge commit and its landed path blobs prove current-main content.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-1690-p12-p14-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify P12-P14 current-main provenance
    if: ${{ github.repository == 'HuGR-dev/corelink-server' && github.repository_id == '1232040291' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Retain merged PR source objects
        shell: bash
        run: |
          set -euo pipefail
          # fetch-depth: 0 covers all objects reachable from main, but the
          # squash source commits are reachable only from merged PR #1746's
          # retained head ref. Pin that ref to the anchored P14 source so a
          # changed or missing retention ref fails closed.
          git fetch --no-tags origin \
            '+refs/pull/1746/head:refs/remotes/origin/pr-1746-head'
          test "$(git rev-parse refs/remotes/origin/pr-1746-head)" = \
            59cfb2ca01c0732cede1d2a2693a3dea7ef1da59
          for source in \
            2963bd510ff03df932c8a60e91b1c23742fbe1b6 \
            4e1844f7f5c644b5f4f01fc32653399e70918124 \
            59cfb2ca01c0732cede1d2a2693a3dea7ef1da59; do
            git cat-file -e "${source}^{commit}"
          done

      - name: Verify current-main inventory and squash provenance
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/issue-1690
          test "${GITHUB_REF}" = refs/heads/main
          head_sha="$(git rev-parse HEAD)"
          test "${head_sha}" = "${GITHUB_SHA}"
          python3 scripts/verify_issue_1690_p12_p14.py \
            --manifest scripts/issue_1690_p12_p14_provenance.json \
            --head "${head_sha}" \
            --github-sha "${GITHUB_SHA}" \
            > artifacts/issue-1690/p12-p14-main-verification.json
          cat artifacts/issue-1690/p12-p14-main-verification.json

      - name: Upload redacted verification receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-1690-p12-p14-main-verification-${{ github.run_id }}
          path: artifacts/issue-1690/p12-p14-main-verification.json
          retention-days: 30
          if-no-files-found: error
