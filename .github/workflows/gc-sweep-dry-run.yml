name: GC sweep (dry-run)

# Wires the EXISTING corelink-gc reclaim logic into a scheduled sweep
# that finds reclaimable bytes (tombstoned / erased / over-cap R2
# objects classified by the physical-delete gate) and REPORTS them.
#
# DRY-RUN ONLY. This lane always passes `GC_LIVE_DELETE=false`, clears any
# Cloudflare credential variables, and therefore cannot run a destructive
# sweep. The fixture proves candidate and byte reporting while retaining zero
# deletes. Production R2/D1 bindings and any first destructive execution stay
# owner-gated follow-up work.
#
# Runs the corelink-gc test suite (proves the dry-run/live gate +
# non-destructiveness invariants) and the gc_sweep binary against its
# deterministic in-memory fixture.

on:
  schedule:
    # 04:17 UTC daily — staggered away from the other GC crons
    # (gc-ship-gate @ 11:00, ac-bucket-acl @ 02:30).
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gc-sweep-dry-run-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  sweep:
    name: gc sweep (credentialless dry-run)
    # Hosted runner only: this job executes the in-memory fixture and receives
    # no D1/R2 bindings or Cloudflare credentials.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install workspace-pinned Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable toolchain action
        with:
          toolchain: 1.91.1
          components: clippy

      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        with:
          workspaces: ". -> target"

      - name: corelink-gc tests (gate + non-destructiveness invariants)
        run: cargo test -p corelink-gc --all-targets

      - name: cargo clippy -p corelink-gc -D warnings
        run: cargo clippy -p corelink-gc --all-targets -- -D warnings

      - name: Run gc_sweep (credentialless dry-run report)
        env:
          GC_LIVE_DELETE: "false"
        run: |
          set -euo pipefail
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
            cargo run -p corelink-gc --bin gc_sweep | tee gc-sweep-report.txt
          report="$(cat gc-sweep-report.txt)"
          printf '%s\n' "$report" | grep -F 'mode               = dry_run'
          printf '%s\n' "$report" | grep -F 'candidates_scanned        = 3'
          printf '%s\n' "$report" | grep -F 'reclaimable_count         = 1'
          printf '%s\n' "$report" | grep -F 'reclaimable_bytes         = 4096'
          printf '%s\n' "$report" | grep -F 'deleted_count             = 0'
          printf '%s\n' "$report" | grep -F 'deleted_bytes             = 0'

      - name: Upload fixture report artifact
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gc-sweep-dry-run-report-${{ github.run_id }}
          path: gc-sweep-report.txt
          if-no-files-found: error
          retention-days: 7
