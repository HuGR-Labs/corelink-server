name: GC sweep (dry-run)

# Wires the EXISTING corelink-gc reclaim logic into a scheduled sweep
# that finds reclaimable bytes (tombstoned / erased / over-cap R2
# objects classified by the physical-delete gate) and REPORTS them.
#
# DRY-RUN ONLY. This lane always passes `GC_LIVE_DELETE=false`, clears any
# Cloudflare credential variables, and therefore cannot run a destructive
# sweep. The fixture proves candidate and byte reporting while retaining zero
# deletes. Production R2/D1 bindings and any first destructive execution stay
# owner-gated follow-up work.
#
# Runs the corelink-gc test suite (proves the dry-run/live gate +
# non-destructiveness invariants) and the gc_sweep binary in the
# configured mode.

on:
  schedule:
    # 04:17 UTC daily — staggered away from the other GC crons
    # (gc-ship-gate @ 11:00, ac-bucket-acl @ 02:30).
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gc-sweep-dry-run-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  sweep:
    name: gc sweep (credentialless dry-run)
    # Self-hosted `corelink` (ephemeral CF-Container Ubuntu 24.04) — pure Rust job,
    # no prod side-effects (the in-memory fixture is forced to dry-run). Runs at
    # zero hosted-Actions cost. Per the zero-hosted-CI mandate.
    runs-on: corelink
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Use the runner image's PRE-INSTALLED, workspace-pinned toolchain rather
      # than provisioning one. A self-hosted job must not run
      # dtolnay/rust-toolchain (validate_no_shared_rustup_mutation.py) — the
      # `corelink` image bakes 1.91.1 (the rust-toolchain.toml pin) WITH clippy,
      # which the clippy step below needs. HOST_TRIPLE selects the Linux triple
      # (the script defaults to apple-darwin for the Mac fleet).
      - name: Use host toolchain (baked, workspace-pinned)
        env:
          HOST_TRIPLE: x86_64-unknown-linux-gnu
        run: bash scripts/ci-use-host-toolchain.sh

      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          workspaces: ". -> target"

      - name: corelink-gc tests (gate + non-destructiveness invariants)
        run: cargo test -p corelink-gc --all-targets

      - name: cargo clippy -p corelink-gc -D warnings
        run: cargo clippy -p corelink-gc --all-targets -- -D warnings

      - name: Run gc_sweep (credentialless dry-run report)
        env:
          GC_LIVE_DELETE: "false"
        run: |
          set -euo pipefail
          report="$(env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID cargo run -p corelink-gc --bin gc_sweep)"
          printf '%s\n' "$report"
          printf '%s\n' "$report" | grep -F 'mode               = dry_run'
          printf '%s\n' "$report" | grep -F 'reclaimable_count         = 1'
          printf '%s\n' "$report" | grep -F 'reclaimable_bytes         = 4096'
          printf '%s\n' "$report" | grep -F 'deleted_count             = 0'
          printf '%s\n' "$report" | grep -F 'deleted_bytes             = 0'
