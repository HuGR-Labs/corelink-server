name: GC sweep (dry-run)

# Wires the EXISTING corelink-gc reclaim logic into a scheduled sweep
# that finds reclaimable bytes (tombstoned / erased / over-cap R2
# objects classified by the physical-delete gate) and REPORTS them.
#
# DRY-RUN BY DEFAULT. The sweep deletes NOTHING unless GC_LIVE_DELETE
# is explicitly set to `true`. The daily cron ALWAYS runs dry-run; only
# a manual workflow_dispatch can request live mode (and even then, this
# build sweeps an in-memory fixture — production live-delete requires
# the real R2/D1 bindings wired into corelink_gc::GcSweepRunner, an
# owner-gated follow-up). 100% non-destructive as shipped.
#
# Runs the corelink-gc test suite (proves the dry-run/live gate +
# non-destructiveness invariants) and the gc_sweep binary in the
# configured mode.

on:
  schedule:
    # 04:17 UTC daily — staggered away from the other GC crons
    # (gc-ship-gate @ 11:00, ac-bucket-acl @ 02:30).
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      live_delete:
        description: "Set true to ARM the live-delete path (default false = dry-run). Even when true, this build sweeps an in-memory fixture; prod live-delete needs the real R2/D1 bindings (owner-gated)."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: gc-sweep-dry-run-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  sweep:
    name: gc sweep (mode-gated, dry-run default)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-04-29

      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        with:
          workspaces: ". -> target"

      # Resolve GC_LIVE_DELETE: cron is ALWAYS dry-run; only a manual
      # dispatch with live_delete=true arms the live path. Fails closed.
      - name: Resolve sweep mode
        id: mode
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.live_delete }}" == "true" ]]; then
            echo "gc_live_delete=true" >> "$GITHUB_OUTPUT"
            echo "::warning::GC live-delete ARMED via manual dispatch. This run sweeps an IN-MEMORY fixture only; production live-delete requires the real R2/D1 bindings wired into GcSweepRunner (owner-gated)."
          else
            echo "gc_live_delete=false" >> "$GITHUB_OUTPUT"
            echo "Dry-run mode (default). Zero deletes."
          fi

      - name: corelink-gc tests (gate + non-destructiveness invariants)
        run: cargo test -p corelink-gc --all-targets

      - name: cargo clippy -p corelink-gc -D warnings
        run: cargo clippy -p corelink-gc --all-targets -- -D warnings

      - name: Run gc_sweep
        env:
          GC_LIVE_DELETE: ${{ steps.mode.outputs.gc_live_delete }}
        run: cargo run -p corelink-gc --bin gc_sweep
