name: issue-2182 REAPI ActionCache contract

on:
  pull_request:
    paths:
      - ".github/workflows/issue-2182-reapi-action-cache-contract.yml"
      - "crates/corelink-container/src/lib.rs"
      - "crates/corelink-container/src/reapi_action_cache.rs"
      - "crates/corelink-container/src/reapi_action_cache/**"
      - "crates/corelink-reapi/proto/build/bazel/remote/execution/v2/remote_execution.proto"
      - "scripts/verify_i2182_reapi_action_cache.py"
      - "apps/docs/docs/reference/reapi/_generated/**"
permissions:
  contents: read

concurrency:
  group: issue-2182-reapi-action-cache-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  action-cache-contract:
    name: exact-head Rust ActionCache behavior and adversarial contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout the exact pull request head without write credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Assert the exact revision under review
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install the workspace-pinned Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable toolchain action
        with:
          toolchain: 1.91.1
      - name: Install the pinned Protobuf compiler required by corelink-reapi
        uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0
      - name: Check issue-specific source mutations
        run: python3 -S scripts/verify_i2182_reapi_action_cache.py --self-test --json
      - name: Compile and run authenticated ActionCache behavior cases
        run: cargo test --locked -p corelink-server --lib reapi_action_cache::tests -- --nocapture
