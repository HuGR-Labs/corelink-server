name: corelink-adapter-host

# Off-Mac PR gate for the `corelink-adapter-host` crate (the brew/npm/pip/oci
# cache adapters). It runs crate-scoped clippy (-D warnings) and tests on the
# GitHub-hosted ubuntu-24.04 runner.
# Workspace-wide gates live in cas_foundation.yml::workspace-build-test (nightly
# + on-demand) per CI-OPT-001; this lane is the fast, targeted PR coverage.

on:
  pull_request:
    paths:
      - 'crates/corelink-adapter-host/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/corelink-adapter-host.yml'
  # No `push: branches:[main]` — re-running the compile on every main merge fed
  # the heavy-gate stampede. The PR `paths:` lane + the nightly workspace gate
  # keep continuous + targeted coverage.
  # ⛔ CRON REMOVED 2026-08-02 — redundant: this workflow already has a
  # `pull_request` trigger, so the code IS verified when it changes. The
  # nightly re-verified BYTE-IDENTICAL code: 10 of the last 14 days had
  # ZERO commits to main, and the self-hosted Mac (the founder's own
  # machine) was spending ~8.8 h/day on scheduled jobs, 75% of which
  # failed. A clock only earns its keep when something can change
  # WITHOUT a commit — CVE feeds, prod state, backups, certs. This
  # workflow is none of those.
  # Restore by uncommenting if this ever stops being PR-gated.
  # - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  pr-gate:
    name: PR gate (crate-scoped clippy + tests)
    # GitHub-hosted ubuntu-24.04. The cargo cache step below is enabled for
    # GitHub-hosted runners; the pinned toolchain assertion keeps Rust aligned
    # with rust-toolchain.toml.
    runs-on: ubuntu-24.04
    # Bound setup, cache restore, clippy, and tests to 30 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # actions/checkout@v7.0.0
        with:
          persist-credentials: false

      # `dtolnay/rust-toolchain` removed. It asked for `stable` + clippy/rustfmt;
      # `rust-toolchain.toml` pins 1.91.1 and lists both components, and rustup
      # honours that file over any `rustup default` — so 1.91.1's clippy is what
      # has always run here, hosted included. The assertion makes that provable
      # per run, so an image drift fails loudly instead of silently changing the
      # compiler.
      - name: Assert the workspace-pinned toolchain (rust-toolchain.toml)
        run: bash scripts/ci-assert-pinned-toolchain.sh

      - name: Cargo cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # Swatinem/rust-cache@v2.9.1
        if: runner.environment == 'github-hosted'
        with:
          workspaces: ". -> target"

      # corelink-reapi (a transitive dep) has a prost-build script that needs protoc.
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b  # arduino/setup-protoc@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: cargo clippy (corelink-adapter-host, -D warnings)
        run: cargo clippy --package corelink-adapter-host --all-targets -- -D warnings

      # Full crate-scoped tests incl. the tests/ integration suite (the in-process
      # spin_adapter conformance tests). Restored to --all-targets now that the
      # stale cargo_adversarial::invalid_key_format_returns_400 fixture is fixed
      # (it expected 400 for `/shortkey`, but sccache-compat made non-hex CONTROL
      # keys valid — the test now asserts the real contract: over-length → 400,
      # `.sccache_check` → 404-accepted).
      - name: cargo test (corelink-adapter-host)
        run: cargo test --package corelink-adapter-host --all-targets
