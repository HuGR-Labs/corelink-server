name: corelink-adapter-host

# Hosted PR gate for the `corelink-adapter-host` crate (the brew/npm/pip/oci
# cache adapters). PR lane: crate-scoped clippy (-D warnings) + tests on
# GitHub-HOSTED ubuntu-latest, so adapter changes verify in CI WITHOUT loading
# the self-hosted macOS builder fleet (mirrors corelink-meta.yml::pr-gate).
# Workspace-wide gates live in cas_foundation.yml::workspace-build-test (nightly
# + on-demand) per CI-OPT-001; this lane is the fast, targeted PR coverage.

on:
  pull_request:
    paths:
      - 'crates/corelink-adapter-host/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/corelink-adapter-host.yml'
  # No `push: branches:[main]` — re-running the compile on every main merge fed
  # the heavy-gate stampede. The PR `paths:` lane + the nightly workspace gate
  # keep continuous + targeted coverage.
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  pr-gate:
    name: PR gate (crate-scoped clippy + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # actions/checkout@v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # dtolnay/rust-toolchain@stable@2026-05-15
        with:
          components: clippy, rustfmt

      - name: Cargo cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # Swatinem/rust-cache@v2.9.1
        with:
          workspaces: ". -> target"

      # corelink-reapi (a transitive dep) has a prost-build script that needs protoc.
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b  # arduino/setup-protoc@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # clippy --all-targets COMPILES the integration tests too (catches compile
      # breakage there), so the lib-scoped test run below still has full compile
      # coverage of the crate.
      - name: cargo clippy (corelink-adapter-host, -D warnings)
        run: cargo clippy --package corelink-adapter-host --all-targets -- -D warnings

      # Lib (unit) tests only on the PR lane. The in-process-server integration
      # tests under tests/ (cargo_adversarial.rs etc.) run in the nightly workspace
      # gate on the macOS fleet (cas_foundation.yml). One of them —
      # cargo_adversarial::invalid_key_format_returns_400 — is RED on main
      # (the cargo adapter returns non-400 for a sub-64-char key; pre-existing,
      # unrelated to this gate); tracked separately. Gating the PR lane on --lib
      # keeps fast crate-scoped coverage without blocking on that pre-existing red.
      - name: cargo test (corelink-adapter-host, lib)
        run: cargo test --package corelink-adapter-host --lib
