name: cargo-deny (WI-S12-004)

# Standalone cargo-deny policy gate — license allowlist, yanked deps,
# banned sources, RUSTSEC advisories, bans. Runs on every PR touching
# Rust code or manifests, and on a daily cron for continuous monitoring.
#
# Policy canonical source: deny.toml (root of workspace).
# Enforces:
#   - INV-SUPPLY-NO-YANKED (yanked = "deny" in deny.toml [advisories])
#   - INV-SUPPLY-LICENSE-ALLOWLIST (7 OSI-approved licenses + explicit ban list)
#
# Note: cargo-deny is ALSO run inside cas_foundation.yml as job `cargo-deny`
# for the PR convergence gate. This standalone workflow adds:
#   1. Daily cron continuous monitoring.
#   2. Explicit `--all-features` + wasm32 target coverage.
#   3. Structured step summaries per rule violation type.
#
# Implements: WI-S12-004 §6.1.3 (ST-002) + §6.1.2 (deny.toml canonical)
# Cap: CAP-SUPPLY-004
#
# SHA-pinned per HIGH_RISK lane FF-HR-005 + ADR-S12-045 §6 tooling-pin policy.

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'apps/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/cargo-deny.yml'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'apps/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
  schedule:
    # Daily at 06:30 UTC — 30 min after cargo-audit cron to avoid I/O
    # contention on advisory-db fetch.
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny (license + advisories + sources + bans)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run cargo-deny (EmbarkStudios action — SHA-pinned)
        # EmbarkStudios/cargo-deny-action v2.0.4 SHA-pinned.
        # Version bump requires ADR + Security review per §14.s12.004.1.
        # `--all-features` ensures wasm32 + host-server features both audited.
        # `--hide-inclusion-graph` reduces noise on large dep trees.
        uses: EmbarkStudios/cargo-deny-action@df3b2489a2ea6e663bae7ac3784afc3231452051 # v2.0.4
        with:
          command: check
          arguments: --all-features --hide-inclusion-graph

      - name: Emit step summary on success
        if: success()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## cargo-deny Policy Check: PASSED

          All deny.toml rules satisfied:
          - **Advisories**: 0 RUSTSEC vulnerabilities / 0 yanked deps
          - **Licenses**: all deps within 7-OSI-approved allowlist
          - **Sources**: all deps from crates.io (no unknown registry/git)
          - **Bans**: no banned crates detected

          INV-SUPPLY-NO-YANKED: ENFORCED
          INV-SUPPLY-LICENSE-ALLOWLIST: ENFORCED
          SUMMARY
