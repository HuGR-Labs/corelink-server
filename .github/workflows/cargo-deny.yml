name: cargo-deny (WI-S12-004)

# Standalone cargo-deny policy gate — license allowlist, yanked deps,
# banned sources, RUSTSEC advisories, bans. Runs on every PR touching
# Rust code or manifests, and on a daily cron for continuous monitoring.
#
# Policy canonical source: deny.toml (root of workspace).
# Enforces:
#   - INV-SUPPLY-NO-YANKED (yanked = "deny" in deny.toml [advisories])
#   - INV-SUPPLY-LICENSE-ALLOWLIST (7 OSI-approved licenses + explicit ban list)
#
# Note: cargo-deny is ALSO run inside cas_foundation.yml as job `cargo-deny`
# for the PR convergence gate. This standalone workflow adds:
#   1. Daily cron continuous monitoring.
#   2. Explicit `--all-features` + wasm32 target coverage.
#   3. Structured step summaries per rule violation type.
#
# Implements: WI-S12-004 §6.1.3 (ST-002) + §6.1.2 (deny.toml canonical)
# Cap: CAP-SUPPLY-004
#
# SHA-pinned per HIGH_RISK lane FF-HR-005 + ADR-S12-045 §6 tooling-pin policy.

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'apps/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/cargo-deny.yml'
  # NOTE: no `push: branches:[main]` — `cargo deny check` resolves + builds the
  # full dependency graph on the self-hosted macOS fleet, so re-running it on
  # every main merge fed the heavy-gate stampede (load 398/665, 2026-06-04;
  # extends the 977225d3 "stop heavy-gate stampede" sweep). The daily cron below
  # + the PR `paths:` lane above keep continuous + targeted coverage; on-demand
  # via workflow_dispatch.
  # ⛔ CRON REMOVED 2026-08-02 — redundant: this workflow already has a
  # `pull_request` trigger, so the code IS verified when it changes. The
  # nightly re-verified BYTE-IDENTICAL code: 10 of the last 14 days had
  # ZERO commits to main, and the self-hosted Mac (the founder's own
  # machine) was spending ~8.8 h/day on scheduled jobs, 75% of which
  # failed. A clock only earns its keep when something can change
  # WITHOUT a commit — CVE feeds, prod state, backups, certs. This
  # workflow is none of those.
  # Restore by uncommenting if this ever stops being PR-gated.
  # # Daily at 06:30 UTC — 30 min after cargo-audit cron to avoid I/O
  # # contention on advisory-db fetch.
  # - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny (license + advisories + sources + bans)
    # Runner: `corelink` — the product's own ephemeral runner fabric (wave 3 of
    # the migration off GitHub-hosted runners, 2026-08-03; wave 1 moved gitleaks
    # + trivy, wave 2 the four Rust crate lanes). Cheap per run but very frequent:
    # 99 runs over 2026-08-01→03, median 34 s, 101 BILLED minutes ≈ $0.61 in 3
    # days — GitHub bills `ceil(duration/60)`, so a 34 s job costs a full minute.
    # A minute on `corelink` costs $0 of GitHub billing.
    #
    # The box is 4 vCPU / 12.5 GB against ubuntu-latest's 2 vCPU / 7 GB on a
    # private repo. This lane never compiles the workspace — cargo-deny arrives
    # prebuilt and resolves Cargo.lock — so it holds a box for well under a
    # minute.
    #
    # ⚠️ Ephemeral-runner reality — a box is minted per job and destroyed after,
    # so nothing is cached between runs and the dependency graph is resolved cold
    # every time. The image's pre-seeded `~/.cargo` (415 MB, 362 registry
    # entries) is what keeps that cheap. There is deliberately no
    # `Swatinem/rust-cache` step here to "fix" it: on the MAC fleet that action's
    # prune step deletes a sibling job's registry mid-compile (`os error 2`,
    # #979/#980), which is why every cache step in this repo is gated
    # `runner.environment == 'github-hosted'` (machine-checked by
    # scripts/validate_shared_home_cache_guard.py).
    #
    # ⚠️ A refused or dropped spawn leaves the job QUEUED, and `timeout-minutes`
    # does NOT bound queued time — it starts counting once the job is RUNNING.
    # That is a stall, not a false pass: `scripts/pre-merge-gate-check.sh` scores
    # a pending check as ⛔ DO NOT MERGE, so a stranded box blocks the PR rather
    # than waving it through.
    runs-on: corelink
    # Unchanged at 15 min: median is 34 s, so this is already ~26× headroom, and
    # it bounds a wedged run well inside GitHub's 360-min default.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # EmbarkStudios/cargo-deny-action is a Docker container action and is
      # Linux-only ("Container action is only supported on Linux"); it hard-fails
      # on our macOS self-hosted fleet, and the `corelink` box image ships no
      # docker at all. Run cargo-deny NATIVELY instead, mirroring the
      # dependabot-policy.yml gate. Both pin cargo-deny@0.19.8 via taiki-e.
      # Version bump requires ADR + Security review per §14.s12.004.1
      # (ADR-S12-045 v1.2.0: 0.16.4 → 0.19.8 — CVSS 4.0 advisory parse fix).
      #
      # `dtolnay/rust-toolchain` removed — see rustfmt.yml for the full argument.
      # In short: it asked for `stable`, `rust-toolchain.toml` pins 1.91.1, and
      # rustup honours the file over any `rustup default`, so the action never
      # determined what ran here. `cargo deny` only needs a working `cargo` shim,
      # which the assertion below both provisions (the first in-repo cargo call
      # installs the pinned channel) and verifies — so an image drift fails
      # loudly instead of silently resolving the graph with a different cargo.
      - name: Assert the workspace-pinned toolchain (rust-toolchain.toml)
        run: bash scripts/ci-assert-pinned-toolchain.sh

      # ⛔ KEEP taiki-e/install-action even though the box image currently ships
      # cargo-deny 0.19.8 — the exact version pinned below. This is a decision,
      # not an oversight: the runner image changes WITHOUT notice (its default
      # rustc moved 1.91.1 → 1.96.0 in two days, 2026-08-01 → 08-03) and nobody
      # monitors it. Dropping the action to "reuse what's on the box" would
      # silently couple a security gate — the version of which needs an ADR +
      # Security review to move — to an unversioned, unwatched image. The action
      # is a cheap SHA-pinned prebuilt download; keep paying it.
      - name: Install cargo-deny (native — taiki-e/install-action, SHA-pinned)
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-deny@0.19.8
      # `--all-features` ensures wasm32 + host-server features both audited.
      # `--hide-inclusion-graph` reduces noise on large dep trees.
      - name: Run cargo-deny (license + advisories + sources + bans)
        run: cargo deny --all-features check --hide-inclusion-graph

      - name: Emit step summary on success
        if: success()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## cargo-deny Policy Check: PASSED

          All deny.toml rules satisfied:
          - **Advisories**: 0 RUSTSEC vulnerabilities / 0 yanked deps
          - **Licenses**: all deps within 7-OSI-approved allowlist
          - **Sources**: all deps from crates.io (no unknown registry/git)
          - **Bans**: no banned crates detected

          INV-SUPPLY-NO-YANKED: ENFORCED
          INV-SUPPLY-LICENSE-ALLOWLIST: ENFORCED
          SUMMARY
