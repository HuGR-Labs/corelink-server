name: cargo-deny (WI-S12-004)

# Standalone cargo-deny policy gate — license allowlist, yanked deps,
# banned sources, RUSTSEC advisories, bans. Runs on every PR touching
# Rust code or manifests, and on a daily cron for continuous monitoring.
#
# Policy canonical source: deny.toml (root of workspace).
# Enforces:
#   - INV-SUPPLY-NO-YANKED (yanked = "deny" in deny.toml [advisories])
#   - INV-SUPPLY-LICENSE-ALLOWLIST (7 OSI-approved licenses + explicit ban list)
#
# Note: cargo-deny is ALSO run inside cas_foundation.yml as job `cargo-deny`
# for the PR convergence gate. This standalone workflow adds:
#   1. Daily cron continuous monitoring.
#   2. Explicit `--all-features` + wasm32 target coverage.
#   3. Structured step summaries per rule violation type.
#
# Implements: WI-S12-004 §6.1.3 (ST-002) + §6.1.2 (deny.toml canonical)
# Cap: CAP-SUPPLY-004
#
# SHA-pinned per HIGH_RISK lane FF-HR-005 + ADR-S12-045 §6 tooling-pin policy.

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'apps/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/cargo-deny.yml'
  # NOTE: no `push: branches:[main]` — `cargo deny check` resolves + builds the
  # full dependency graph on the self-hosted macOS fleet, so re-running it on
  # every main merge fed the heavy-gate stampede (load 398/665, 2026-06-04;
  # extends the 977225d3 "stop heavy-gate stampede" sweep). The daily cron below
  # + the PR `paths:` lane above keep continuous + targeted coverage; on-demand
  # via workflow_dispatch.
  schedule:
    # Daily at 06:30 UTC — 30 min after cargo-audit cron to avoid I/O
    # contention on advisory-db fetch.
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny (license + advisories + sources + bans)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # EmbarkStudios/cargo-deny-action is a Docker container action and is
      # Linux-only ("Container action is only supported on Linux"); it hard-fails
      # on our macOS self-hosted fleet. Run cargo-deny NATIVELY instead, mirroring
      # the dependabot-policy.yml gate. Both pin cargo-deny@0.19.8 via taiki-e.
      # Version bump requires ADR + Security review per §14.s12.004.1
      # (ADR-S12-045 v1.2.0: 0.16.4 → 0.19.8 — CVSS 4.0 advisory parse fix).
      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-04-29
      - name: Install cargo-deny (native — taiki-e/install-action, SHA-pinned)
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2.81.9
        with:
          tool: cargo-deny@0.19.8
      # `--all-features` ensures wasm32 + host-server features both audited.
      # `--hide-inclusion-graph` reduces noise on large dep trees.
      - name: Run cargo-deny (license + advisories + sources + bans)
        run: cargo deny --all-features check --hide-inclusion-graph

      - name: Emit step summary on success
        if: success()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## cargo-deny Policy Check: PASSED

          All deny.toml rules satisfied:
          - **Advisories**: 0 RUSTSEC vulnerabilities / 0 yanked deps
          - **Licenses**: all deps within 7-OSI-approved allowlist
          - **Sources**: all deps from crates.io (no unknown registry/git)
          - **Bans**: no banned crates detected

          INV-SUPPLY-NO-YANKED: ENFORCED
          INV-SUPPLY-LICENSE-ALLOWLIST: ENFORCED
          SUMMARY
