name: issue-1720 Cloudflare drift credential bootstrap

# A single, operator-confirmed recovery path for #1720. It never writes
# Cloudflare infrastructure: it creates only the dedicated read token,
# performs six GET receipts, and stores the returned token in GitHub Secrets.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type issue-1720-create-drift-token to authorize this one-time bootstrap
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  bootstrap:
    if: github.event.inputs.confirm == 'issue-1720-create-drift-token'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CF_BOOTSTRAP_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify bounded inputs
        shell: bash
        run: |
          set -euo pipefail
          for key in CF_BOOTSTRAP_TOKEN CF_ACCOUNT_ID CF_ZONE_ID; do
            [[ -n "${!key:-}" ]] || { echo "::error::Missing required $key"; exit 1; }
          done
          echo "::notice::Bootstrap inputs are present; values remain masked."

      - name: Create least-privilege token, store it, and verify six reads
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          response_dir="$RUNNER_TEMP/issue-1720"
          mkdir -p "$response_dir"
          groups="$response_dir/permission-groups.json"
          create="$response_dir/create-token.json"
          stored=0
          token_id=""
          CF_ACCESS_TOKEN="$CF_BOOTSTRAP_TOKEN"
          cleanup() {
            if [[ "$stored" != 1 && -n "$token_id" ]]; then
              curl --silent --show-error --output /dev/null --request DELETE \
                --header "Authorization: Bearer $CF_BOOTSTRAP_TOKEN" \
                "https://api.cloudflare.com/client/v4/user/tokens/$token_id" || true
              echo "::warning::Unstored token was revoked."
            fi
            rm -rf "$response_dir"
          }
          trap cleanup EXIT

          cloudflare_get() {
            local url="$1" output="$2" status
            status="$(curl --silent --show-error --output "$output" --write-out '%{http_code}' \
              --header "Authorization: Bearer $CF_ACCESS_TOKEN" "$url")"
            if [[ "$status" != 2* ]]; then
              codes="$(jq -r '[.errors[]?.code] | join(",")' "$output" 2>/dev/null || true)"
              echo "::error::Cloudflare GET denied: HTTP $status provider_codes=${codes:-none}"
              return 1
            fi
            jq -e '.success == true' "$output" >/dev/null
          }

          cloudflare_get "https://api.cloudflare.com/client/v4/user/tokens/permission_groups" "$groups"
          required_account=("Workers R2 Storage" "D1" "Workers KV Storage" "Workers Scripts")
          required_zone=("DNS" "Workers Routes")
          account_group_ids=()
          zone_group_ids=()
          for group in "${required_account[@]}" "${required_zone[@]}"; do
            ids="$(jq -r --arg name "$group" '[.result[] | select(.name == $name) | .id] | .[]' "$groups")"
            if [[ "$(printf '%s\n' "$ids" | sed '/^$/d' | wc -l | tr -d ' ')" != 1 ]]; then
              candidates="$(jq -r '[.result[] | .name] | unique[] | select(test("workers|d1|dns"; "i"))' "$groups" | paste -sd ',' -)"
              echo "::error::Required Cloudflare permission group '$group' was not unique; candidates=$candidates"
              exit 1
            fi
            if [[ " ${required_account[*]} " == *" $group "* ]]; then
              account_group_ids+=("$ids")
            else
              zone_group_ids+=("$ids")
            fi
          done

          account_ids_json="$(printf '%s\n' "${account_group_ids[@]}" | jq -R . | jq -sc .)"
          zone_ids_json="$(printf '%s\n' "${zone_group_ids[@]}" | jq -R . | jq -sc .)"
          policy="$(jq -n \
            --arg account "com.cloudflare.api.account.$CF_ACCOUNT_ID" \
            --arg zone "com.cloudflare.api.account.zone.$CF_ZONE_ID" \
            --argjson account_ids "$account_ids_json" \
            --argjson zone_ids "$zone_ids_json" \
            --arg name "corelink-terraform-drift-$(date -u +%Y%m%d)-$GITHUB_RUN_ID" \
            '{name:$name, policies:[
              {effect:"allow", resources:{($account):"*"}, permission_groups:($account_ids | map({id:.}))},
              {effect:"allow", resources:{($zone):"*"}, permission_groups:($zone_ids | map({id:.}))}
            ]}')"
          status="$(curl --silent --show-error --output "$create" --write-out '%{http_code}' \
            --request POST --header "Authorization: Bearer $CF_BOOTSTRAP_TOKEN" \
            --header 'Content-Type: application/json' --data "$policy" \
            'https://api.cloudflare.com/client/v4/user/tokens')"
          if [[ "$status" != 2* ]] || ! jq -e '.success == true' "$create" >/dev/null; then
            codes="$(jq -r '[.errors[]?.code] | join(",")' "$create" 2>/dev/null || true)"
            echo "::error::Cloudflare token creation denied: HTTP $status provider_codes=${codes:-none}"
            exit 1
          fi
          token_id="$(jq -er '.result.id' "$create")"
          token="$(jq -er '.result.value' "$create")"
          echo "::add-mask::$token"
          printf '%s' "$token" | gh secret set CF_TERRAFORM_DRIFT_API_TOKEN --repo "$GITHUB_REPOSITORY"
          stored=1
          CF_ACCESS_TOKEN="$token"
          unset token

          declare -a reads=(
            "Workers R2 Storage|https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/r2/buckets?per_page=1"
            "D1|https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/d1/database?per_page=1"
            "Workers KV Storage|https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces?per_page=1"
            "Workers Scripts|https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts?per_page=1"
            "DNS|https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records?per_page=1"
            "Workers Routes|https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/workers/routes?per_page=1"
          )
          for read in "${reads[@]}"; do
            label="${read%%|*}"
            endpoint="${read#*|}"
            receipt="$response_dir/$(printf '%s' "$label" | tr ' ' '-').json"
            cloudflare_get "$endpoint" "$receipt"
            echo "::notice::Read receipt PASS: $label"
          done
          account_receipt="${CF_ACCOUNT_ID:0:6}...${CF_ACCOUNT_ID: -4}"
          zone_receipt="${CF_ZONE_ID:0:6}...${CF_ZONE_ID: -4}"
          echo "::notice::Scope receipt: account=$account_receipt zone=$zone_receipt account_reads=4 zone_reads=2"
          unset CF_ACCESS_TOKEN
          echo "::notice::Stored CF_TERRAFORM_DRIFT_API_TOKEN with four account and two humangr.com zone read groups."

      - name: Dispatch one exact-main Terraform drift run
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          gh workflow enable terraform-drift.yml --repo "$GITHUB_REPOSITORY"
          gh workflow run terraform-drift.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_SHA" --field region=wnam
          echo "::notice::Terraform Drift Detection dispatched once at $GITHUB_SHA."

      - name: Disable both bounded workflows
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          gh workflow disable terraform-drift.yml --repo "$GITHUB_REPOSITORY" || true
          gh workflow disable "$GITHUB_WORKFLOW" --repo "$GITHUB_REPOSITORY" || true
          echo "::notice::Bounded workflows disabled after this attempt."
