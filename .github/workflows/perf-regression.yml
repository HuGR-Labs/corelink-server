name: perf-regression (r-prep)

# Perf-regression gate: runs criterion benches on PRs that touch
# perf-critical crates (or carry the `perf-sensitive` label) and
# fails when any tracked bench regresses beyond its tolerance class.
#
# Wave-22 (2026-05-16) tightening for pre-GA pilot tenant workloads:
#   - CRITICAL benches (tenant-path derive, blake3 chunk, JCS
#     canonicalize, audit-chain merkle append, JWT verify under
#     DPA accept, plus envelope_roundtrip / orchestrator / tier
#     selection on the request-hot path) gate at >5% p99 regression.
#   - Non-critical benches gate at >15% p99 regression.
#   - Per-bench `tolerance_pct` override (in the baseline JSON)
#     wins over the class default.
#
# Baselines are committed under `reports/perf/`; operators refresh
# them via `scripts/refresh-perf-baseline.sh`. The canonical
# pre-GA snapshot is tagged `perf-baseline-ga-2026-05-16` (wave-29
# stream-9, supersedes the wave-22 `perf-baseline-pre-ga-2026-05-16`
# tag — see `specs/_audits/2026-05-16-perf-baseline-ga-freeze.md`).
#
# Triage on failure: specs/_runbooks/RB-PERF-REGRESSION.md
#
# SHA-pinned per HIGH_RISK lane FF-HR-005 + ADR-S12-045 §6.
# Action version bumps require ADR + Eng-Lead review.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'crates/corelink-audit-chain/**'
      - 'crates/corelink-byok/**'
      - 'crates/corelink-signup/**'
      - 'crates/corelink-tier-selection/**'
      - 'crates/corelink-hash/**'
      - 'crates/corelink-rate-limit/**'
      - 'crates/corelink-tenant-path/**'
      - 'crates/tenant-path/**'
      - 'crates/corelink-dpa-acceptance/**'
      - 'crates/corelink-stripe-real/**'
      - 'crates/corelink-client-verify/**'
      - 'crates/corelink-worker/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'reports/perf/**'
      - 'scripts/perf-regression-check.py'
      - 'scripts/refresh-perf-baseline.sh'
      - '.github/workflows/perf-regression.yml'
  workflow_dispatch:
    inputs:
      critical_threshold_pct:
        description: 'CRITICAL bench regression threshold (percent). Default 5 (wave-22).'
        required: false
        default: '5'
      default_threshold_pct:
        description: 'Non-critical bench regression threshold (percent). Default 15 (wave-22).'
        required: false
        default: '15'
      legacy_threshold_pct:
        description: 'Optional legacy single threshold (overrides both above). Leave empty for split mode.'
        required: false
        default: ''

permissions:
  contents: read
  checks: write
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pinned criterion measurement parameters; bumps require ADR.
  PERF_BENCH_WARMUP_TIME: "1"
  PERF_BENCH_MEASUREMENT_TIME: "5"
  # Wave-22 split thresholds; per-bench `tolerance_pct` overrides win.
  PERF_REGRESS_CRITICAL_PCT_DEFAULT: "5"
  PERF_REGRESS_DEFAULT_PCT_DEFAULT: "15"

jobs:
  # Gate the job: only run when (a) PR carries `perf-sensitive` label,
  # or (b) PR touches one of the perf-critical paths above (handled by
  # the `paths:` filter), or (c) workflow_dispatch.
  perf-regression:
    name: criterion regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request'
          && (github.event.action != 'labeled'
              || github.event.label.name == 'perf-sensitive'))
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Install Rust toolchain (stable, pinned)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-04-29

      - name: Cargo cache
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        with:
          shared-key: perf-regression

      - name: Cache criterion target dir
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: target/criterion
          key: criterion-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            criterion-${{ runner.os }}-

      - name: Setup Python (for regression check)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Run criterion bench suite (scoped)
        env:
          # Keep measurement fast on CI; statistical noise is OK because
          # the regression threshold is well above CI jitter (>10% p99).
          CRITERION_WARMUP: ${{ env.PERF_BENCH_WARMUP_TIME }}
          CRITERION_MEASUREMENT: ${{ env.PERF_BENCH_MEASUREMENT_TIME }}
        # Run only the tracked bench targets. Keep this list in lock-
        # step with scripts/refresh-perf-baseline.sh and
        # reports/perf/README.md.
        run: |
          set -euo pipefail
          BENCHES=(
            "corelink-tenant-path:derive"
            "corelink-tenant-path:derive_prefix_v2"
            "corelink-hash:blake3_bench"
            "corelink-hash:blake3"
            "corelink-byok:envelope_roundtrip"
            "corelink-audit-chain:merkle_append"
            "corelink-audit-chain:jcs_canonicalize"
            "corelink-signup:orchestrator"
            "corelink-tier-selection:select"
            "corelink-dpa-acceptance:accept_and_verify_jwt"
            "corelink-stripe-real:webhook_verify"
          )
          for entry in "${BENCHES[@]}"; do
            crate="${entry%%:*}"
            bench="${entry##*:}"
            echo "::group::${crate} :: ${bench}"
            cargo bench -p "${crate}" --bench "${bench}" -- \
              --warm-up-time "${CRITERION_WARMUP}" \
              --measurement-time "${CRITERION_MEASUREMENT}" \
              || echo "::warning::bench ${crate}::${bench} failed; treated as missing result"
            echo "::endgroup::"
          done

      - name: Perf-regression check (p99, split thresholds)
        env:
          PERF_REGRESS_CRITICAL_PCT: ${{ github.event.inputs.critical_threshold_pct || env.PERF_REGRESS_CRITICAL_PCT_DEFAULT }}
          PERF_REGRESS_DEFAULT_PCT: ${{ github.event.inputs.default_threshold_pct || env.PERF_REGRESS_DEFAULT_PCT_DEFAULT }}
          LEGACY_OVERRIDE: ${{ github.event.inputs.legacy_threshold_pct || '' }}
        run: |
          set -euo pipefail
          ARGS=( --metric p99 --json-out perf-regression-report.json )
          if [[ -n "${LEGACY_OVERRIDE}" ]]; then
            echo "::warning::legacy single-threshold override active (${LEGACY_OVERRIDE}%) — splits ignored"
            ARGS+=( --threshold-pct "${LEGACY_OVERRIDE}" )
          fi
          python3 scripts/perf-regression-check.py "${ARGS[@]}"

      - name: Capture flame-graph on regression (best-effort)
        if: failure()
        continue-on-error: true
        run: |
          set -euo pipefail
          if ! command -v cargo-flamegraph >/dev/null 2>&1; then
            echo "::notice::cargo-flamegraph not installed on runner; skipping flame capture"
            exit 0
          fi
          mkdir -p perf-flames
          # Best-effort: capture flame for the first CRITICAL bench so the
          # operator has a starting point. Non-fatal if it can't run.
          cargo flamegraph --bench derive_prefix_v2 -p corelink-tenant-path \
            -o perf-flames/tenant-path-derive-prefix-v2.svg \
            -- --bench --warm-up-time 1 --measurement-time 3 \
            || echo "::warning::flamegraph capture failed (non-fatal)"

      - name: Upload flame-graph artifact
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: perf-flames-${{ github.run_id }}
          path: perf-flames
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload criterion HTML + JSON artifact
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: criterion-report-${{ github.run_id }}
          path: |
            target/criterion
            perf-regression-report.json
          retention-days: 14
          if-no-files-found: warn
