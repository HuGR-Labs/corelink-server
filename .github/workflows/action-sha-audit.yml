# =============================================================================
# action-sha-audit — DEBT-018+019 CI gate
# -----------------------------------------------------------------------------
# Runs scripts/verify-action-sha-pinning.py on every PR touching workflow files
# or the verifier itself. Fails the PR if any `uses:` line references an action
# by tag/branch instead of a 40-char commit SHA.
#
# Policy reference: supply-chain security (SOC2 CC7.1 rollup) — mutable refs
# (`@v4`, `@stable`) are forbidden because a compromised maintainer (or
# compromised CI of the upstream action) can re-point them at malicious code.
# =============================================================================
name: action-sha-audit

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/verify-action-sha-pinning.py"
      - ".github/workflows/action-sha-audit.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/verify-action-sha-pinning.py"

# Cancel superseded runs on the same branch to save CI minutes.
concurrency:
  group: action-sha-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-sha-pinning:
    name: Verify all GHA actions SHA-pinned
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # actions/checkout@v6.0.3
        with:
          # Shallow clone is fine — we only read .github/workflows tree.
          fetch-depth: 1

      # No actions/setup-python: the self-hosted mac fleet can't reliably
      # provision Python via setup-python (RUNNER_TOOL_CACHE is unset, so it
      # falls back to the unwritable /Users/runner hosted path). This script
      # only needs `python3`, which ships on every runner. (2026-06-02)
      - name: Run SHA pinning verifier
        run: |
          python3 scripts/verify-action-sha-pinning.py
