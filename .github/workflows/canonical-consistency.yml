name: Canonical Consistency (R-PREP canonical-lint)

# Cross-validates INV registry × TLA+ × code × tests against the locked
# baseline in `specs/_audits/sealed/2026-05-15-canonical-consistency-baseline.md`.
#
# Fires on PRs that touch ANY of:
# - `specs/**`              — registry / TLA / docs corpus drift
# - `crates/*/src/**`       — production code INV-* comments
# - `crates/*/tests/**`     — test references
# - `specs/tla/**`          — formal proof corpus
# - the validator script + the baseline itself
#
# Behaviour:
# - Hard-fails the PR if any NEW orphan INV-* reference appears in code.
# - Hard-fails the PR if code_referenced / test_referenced /
#   critical_referenced drop below baseline floors.
# - Uploads the JSON report as an artifact (30d) so the R-7 GA evidence
#   pack assembly has direct access to historical snapshots.
#
# Pin policy (Lote 9.5b CI hardening): all third-party actions pinned to
# 40-char SHA + version comment.

on:
  pull_request:
    paths:
      - 'specs/**'
      - 'crates/*/src/**'
      - 'crates/*/tests/**'
      - 'specs/tla/**'
      - 'scripts/validate_canonical_consistency.py'
      - '.github/workflows/canonical-consistency.yml'
  push:
    branches: [main]
    paths:
      - 'specs/03_architecture/invariant_registry.md'
      - 'specs/_audits/sealed/2026-05-15-canonical-consistency-baseline.md'
      - 'scripts/validate_canonical_consistency.py'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-consistency:
    name: Cross-validate INV registry × TLA × code × tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # No actions/setup-python: the self-hosted mac fleet can't reliably
      # provision Python via setup-python (RUNNER_TOOL_CACHE is unset → it
      # falls back to the unwritable /Users/runner hosted path and dies with
      # `mkdir: /Users/runner: Permission denied`). This validator only needs
      # `python3` (stdlib only), which ships on every runner. (2026-06-03)
      - name: Run canonical consistency validator
        id: validator
        run: |
          mkdir -p target/canonical-consistency
          python3 scripts/validate_canonical_consistency.py \
            --out target/canonical-consistency/report.json \
            | tee target/canonical-consistency/report.txt
        # The script exits 1 if orphan refs OR baseline regressions are
        # detected. The pipefail-aware behaviour preserves that exit code.
        shell: bash

      - name: Summarize results in PR
        if: always()
        run: |
          if [ -f target/canonical-consistency/report.txt ]; then
            {
              echo "## Canonical consistency report"
              echo ""
              echo '```'
              head -20 target/canonical-consistency/report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        shell: bash

      - name: Upload JSON report (30-day retention)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-consistency-report
          path: target/canonical-consistency/
          retention-days: 30
          if-no-files-found: warn
