name: B-152 Actions evidence monitor

# This job is an evidence collector, not a closure gate. It runs on a hosted
# runner so a self-hosted runner death cannot also kill the observer. Every
# report is retained as metadata only; the collector never writes log bodies.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: b152-actions-monitor
  cancel-in-progress: true

jobs:
  collect:
    name: collect bounded Actions window
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Collect the previous 20 minutes
        id: collect
        continue-on-error: true
        shell: bash
        run: |
          set -u -o pipefail
          end="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          start="$(date -u -d '20 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
          report="$RUNNER_TEMP/b152-actions-report.json"
          PYTHONPATH=scripts python3 scripts/b152_actions_diagnostic.py \
            --start "$start" --end "$end" --fetch-logs --output "$report"
          rc=$?
          printf '%s\n' "$rc" > "$RUNNER_TEMP/b152-exit-code"
          if [[ ! -s "$report" ]]; then
            # Keep an explicit indeterminate artifact when the API walk itself
            # failed; never substitute an empty successful report.
            python3 - "$start" "$end" "$rc" > "$report" <<'PY'
          import json, sys
          start, end, rc = sys.argv[1:]
          print(json.dumps({
              "schema": "b152-actions-monitor/v1",
              "status": "indeterminate",
              "window": {"start": start, "end_exclusive": end},
              "collector_exit_code": int(rc),
              "reason": "collector did not produce a complete report",
              "zero_window_jobs_is_not_closure": True,
          }, indent=2, sort_keys=True))
          PY
          fi
          # Print only aggregate metadata into the Actions log.
          python3 - "$report" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          print(json.dumps({
              "status": report.get("causal_classification", {}).get("status", report.get("status", "indeterminate")),
              "run_count": report.get("run_count"),
              "failed_run_count": report.get("failed_run_count"),
              "window_job_count": len(report.get("window_jobs", [])),
              "non_success_run_count": report.get("non_success_run_count"),
          }, sort_keys=True))
          PY
          exit "$rc"

      - name: Upload metadata evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: b152-actions-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/b152-actions-report.json
            ${{ runner.temp }}/b152-exit-code
          if-no-files-found: error
          retention-days: 30

      - name: Surface collector unavailability
        if: always()
        shell: bash
        run: |
          rc="$(cat "$RUNNER_TEMP/b152-exit-code")"
          if [[ "$rc" != 0 ]]; then
            echo "B-152 monitor is indeterminate (collector exit $rc); artifact retained for diagnosis." >&2
            exit "$rc"
          fi
