name: release-cli

# CoreLink CLI cross-platform release pipeline (Stream 2.8).
#
# Triggers on version tags cli-v* in humangr-labs/corelink-server.
# Builds 5 platform binaries via cargo-zigbuild (Option A: single
# ubuntu-22.04 runner, zig cross-compile toolchain), then creates a
# GitHub Release in the SEPARATE repo humangr-labs/corelink-cli.
#
# Binary names match the install script contract:
#   URL="${RELEASE_ORIGIN}/corelink-${OS}-${ARCH}"
#   (apps/get-corelink-worker/src/install.ts)
#
# Platforms:
#   corelink-linux-x86_64       x86_64-unknown-linux-gnu
#   corelink-linux-aarch64      aarch64-unknown-linux-gnu
#   corelink-darwin-x86_64      x86_64-apple-darwin
#   corelink-darwin-aarch64     aarch64-apple-darwin
#   corelink-windows-x86_64.exe x86_64-pc-windows-gnu
#
# Required GH Secret (set MANUALLY by operator):
#   CORELINK_CLI_RELEASE_TOKEN  PAT with `repo` scope on
#                               humangr-labs/corelink-cli
#
# TODO (v2): cosign keyless signing via GH OIDC.
#   Wired as a placeholder below; un-stub when ready.
#   Ref: sigstore/cosign-installer@1aa8e0f2454b781fbf0fbf306a4c9533a0c57409

on:
  push:
    tags:
      - "cli-v*"

# Workflow-level least-privilege.
# The cross-repo release write is handled by CORELINK_CLI_RELEASE_TOKEN.
# id-token: write is reserved for cosign keyless (v2 TODO).
permissions:
  contents: read
  id-token: write

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # -------------------------------------------------------------------
  # build — cargo-zigbuild matrix (Option A: 5 targets, 1 runner type)
  # -------------------------------------------------------------------
  build:
    name: build (${{ matrix.target.name }})
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - triple: x86_64-unknown-linux-gnu
            name: corelink-linux-x86_64
            ext: ""
          - triple: aarch64-unknown-linux-gnu
            name: corelink-linux-aarch64
            ext: ""
          - triple: x86_64-apple-darwin
            name: corelink-darwin-x86_64
            ext: ""
          - triple: aarch64-apple-darwin
            name: corelink-darwin-aarch64
            ext: ""
          - triple: x86_64-pc-windows-gnu
            name: corelink-windows-x86_64
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 1

      - name: Install Rust toolchain (stable, pinned)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable 2026-04-29
        with:
          targets: ${{ matrix.target.triple }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c  # v2.7.7
        with:
          workspaces: ". -> target"
          shared-key: cli-release-${{ matrix.target.triple }}

      # zig cross-toolchain: provides libc headers + linker for all targets.
      # OPERATOR: verify SHA for mlugg/setup-zig@v2 at
      # https://github.com/mlugg/setup-zig/releases/tag/v2 before first run.
      - name: Install Zig
        uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild (pinned version, locked)
        run: cargo install --locked --version "0.19.8" cargo-zigbuild

      # Reproducible build: SOURCE_DATE_EPOCH from git commit timestamp.
      - name: Set SOURCE_DATE_EPOCH
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" >> "$GITHUB_ENV"

      - name: Build (cargo zigbuild, release, locked)
        # --locked = exit if Cargo.lock would change (pins exact deps);
        # --frozen would ALSO disable network access, which breaks first-
        # time builds where cargo-zigbuild + zig need to fetch glibc/musl
        # cross-compile artifacts. Lockfile is still pinned by --locked.
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        run: |
          cargo zigbuild \
            -p corelink-cli \
            --release \
            --locked \
            --target ${{ matrix.target.triple }}

      # Binary stripping is handled by [profile.release] strip = true
      # in the workspace Cargo.toml — no explicit strip step needed.
      - name: Prepare artifact (rename + SHA-256 checksum)
        shell: bash
        run: |
          SRC="target/${{ matrix.target.triple }}/release/corelink"
          SRC="${SRC}${{ matrix.target.ext }}"
          ASSET="${{ matrix.target.name }}${{ matrix.target.ext }}"
          mkdir -p out
          cp "$SRC" "out/${ASSET}"
          # sha256sum (Linux); shasum -a 256 fallback (macOS).
          if command -v sha256sum > /dev/null 2>&1; then
            (cd out && sha256sum "${ASSET}" > "${ASSET}.sha256")
          else
            (cd out && shasum -a 256 "${ASSET}" > "${ASSET}.sha256")
          fi
          echo "ASSET=${ASSET}" >> "$GITHUB_ENV"

      # TODO (v2): cosign keyless signing
      # Ref: sigstore/cosign-installer@1aa8e0f2454b781fbf0fbf306a4c9533a0c57409
      - name: "[TODO v2] cosign sign (placeholder)"
        run: |
          echo "SIGNING PLACEHOLDER: cosign keyless signing not yet wired."
          echo "Tracked as Stream 2.8 v2 TODO."

      - name: Upload artifact
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b  # v4.5.0
        with:
          name: ${{ matrix.target.name }}
          path: out/
          retention-days: 1

  # -------------------------------------------------------------------
  # release — collect artifacts, create GH Release in THIS repo
  #
  # Same-repo release simplification (2026-05-29):
  # - Original design used a separate humangr-labs/corelink-cli repo +
  #   CORELINK_CLI_RELEASE_TOKEN PAT for cross-repo upload. That required
  #   a manual operator step (PAT creation + secret config) per the
  #   release-procedure runbook.
  # - Switched to publishing in this repo's Releases. The default
  #   GITHUB_TOKEN (with contents:write below) handles upload. Zero
  #   secret config. corelink-cli repo can be archived / repurposed.
  # - The install script (apps/get-corelink-worker) is updated in lock-
  #   step to point at humangr-labs/corelink-server/releases/latest.
  # -------------------------------------------------------------------
  release:
    name: create release (humangr-labs/corelink-server)
    needs: build
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 15
    permissions:
      contents: write  # default GITHUB_TOKEN writes to this repo's Releases

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          path: dist/
          merge-multiple: true

      - name: Verify artifact count (expect 10 = 5 binaries + 5 checksums)
        shell: bash
        run: |
          echo "=== dist/ contents ==="
          find dist/ -maxdepth 1 -type f | sort
          EXPECTED=10
          ACTUAL=$(find dist/ -maxdepth 1 -type f | wc -l | tr -d ' ')
          if [ "$ACTUAL" -ne "$EXPECTED" ]; then
            echo "ERROR: expected ${EXPECTED} files, got ${ACTUAL}" >&2
            exit 1
          fi

      - name: Build combined checksums.txt
        run: |
          cat dist/*.sha256 > dist/checksums.txt
          echo "=== checksums.txt ==="
          cat dist/checksums.txt

      - name: Write release notes
        shell: bash
        run: |
          # Static section (single-quoted heredoc: no variable expansion).
          cat > /tmp/release-notes.md << 'NOTES_EOF'
          ## Install

          ```sh
          curl -fsSL https://corelink-get.humangr.com | sh -s -- --token=<PAT>
          ```

          ## Platforms

          | Binary | OS | Arch |
          |--------|-----|------|
          | `corelink-linux-x86_64`      | Linux   | x86_64  |
          | `corelink-linux-aarch64`     | Linux   | aarch64 |
          | `corelink-darwin-x86_64`     | macOS   | x86_64  |
          | `corelink-darwin-aarch64`    | macOS   | aarch64 |
          | `corelink-windows-x86_64.exe`| Windows | x86_64  |

          ## Checksums

          See `checksums.txt` for SHA-256 digests of all artifacts.

          ## Source
          NOTES_EOF
          # Dynamic line: GITHUB_REF_NAME expands at runtime.
          # shellcheck disable=SC2016
          echo "Built from \`humangr-labs/corelink-server\` tag \`${GITHUB_REF_NAME}\`." \
            >> /tmp/release-notes.md

      - name: Create GitHub Release in this repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "CoreLink CLI ${GITHUB_REF_NAME#cli-}" \
            --notes-file /tmp/release-notes.md

      - name: Upload binaries + checksums to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
