name: release-cli

# CoreLink CLI cross-platform release pipeline (Stream 2.8).
#
# Triggers on version tags cli-v* in HumanGuardrail/corelink-server.
# Builds 5 platform binaries via cargo-zigbuild (Option A: single
# ubuntu-22.04 runner, zig cross-compile toolchain), then creates a
# GitHub Release in the SEPARATE repo HuGR-Labs/corelink-cli.
#
# Binary names match the install script contract:
#   URL="${RELEASE_ORIGIN}/corelink-${OS}-${ARCH}"
#   (apps/get-corelink-worker/src/install.ts)
#
# Platforms:
#   corelink-linux-x86_64       x86_64-unknown-linux-gnu
#   corelink-linux-aarch64      aarch64-unknown-linux-gnu
#   corelink-darwin-x86_64      x86_64-apple-darwin
#   corelink-darwin-aarch64     aarch64-apple-darwin
#   corelink-windows-x86_64.exe x86_64-pc-windows-gnu
#
# Required GH Secret (set MANUALLY by operator, used only by `release`):
#   CORELINK_CLI_RELEASE_TOKEN  PAT with `repo` scope on
#                               HuGR-Labs/corelink-cli. Build jobs never receive
#                               this credential.
#
# TODO (v2): cosign keyless signing via GH OIDC.
#   Wired as a placeholder below; un-stub when ready.
#   Ref: sigstore/cosign-installer@1aa8e0f2454b781fbf0fbf306a4c9533a0c57409

on:
  push:
    tags:
      - "cli-v*"

# Workflow-level least-privilege.
# The cross-repo release write is handled by CORELINK_CLI_RELEASE_TOKEN.
# id-token: write is reserved for cosign keyless (v2 TODO).
permissions:
  contents: read
  id-token: write

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # sccache: shared compilation cache across matrix targets.
  # Pre-installed on the self-hosted runner host (`/usr/local/bin/sccache`).
  # Cache dir is host-wide so multiple matrix jobs (one per runner) share
  # crate-compilation results — `tokio`, `reqwest`, `rustls` etc. compile
  # ONCE total instead of N times per target.
  RUSTC_WRAPPER: sccache
  SCCACHE_DIR: /Users/gustavoschneiter/.cache/sccache-corelink-cli
  SCCACHE_CACHE_SIZE: "20G"
  # CARGO_INCREMENTAL=0 is required for sccache to deduplicate properly;
  # without it cargo embeds per-invocation timestamps that bust the cache.
  CARGO_INCREMENTAL: "0"

jobs:
  # -------------------------------------------------------------------
  # build — cargo-zigbuild matrix (Option A: 5 targets, 1 runner type)
  # -------------------------------------------------------------------
  build:
    name: build (${{ matrix.target.name }})
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # max-parallel: 3 instead of unbounded.
      #
      # The 5-runner host is one physical Mac (12 cores / 16 GB). Running
      # all 5 builds simultaneously drives load average to >100 and per-
      # job wall time to 30+ minutes (vs ~10 min unblocked). Cap to 3 in
      # parallel so the host has CPU/RAM headroom and each build proceeds
      # at native speed. Total wall clock for 5 jobs:
      #   5/3 = 2 batches (3 jobs, then 2 jobs).
      #   batch 1 ~10 min cold cache, batch 2 ~5 min warm (sccache hits).
      #   total ≈ 15 min vs ≈ 30 min with full parallelism + contention.
      max-parallel: 3
      matrix:
        target:
          - triple: x86_64-unknown-linux-gnu
            name: corelink-linux-x86_64
            signer_name: corelink-linux-x86_64
            ext: ""
          - triple: aarch64-unknown-linux-gnu
            name: corelink-linux-aarch64
            signer_name: corelink-linux-arm64
            ext: ""
          - triple: x86_64-apple-darwin
            name: corelink-darwin-x86_64
            signer_name: corelink-darwin-x86_64
            ext: ""
          - triple: aarch64-apple-darwin
            name: corelink-darwin-aarch64
            signer_name: corelink-darwin-arm64
            ext: ""
          - triple: x86_64-pc-windows-gnu
            name: corelink-windows-x86_64
            signer_name: corelink-windows-x86_64
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 1

      # Do NOT provision a toolchain on the self-hosted fleet. Per its own action.yml,
      # `dtolnay/rust-toolchain` runs `rustup toolchain install` + `rustup default`
      # against the SHARED `~/.rustup` (5 runners, one `$HOME`). That (a) can make
      # `rustc` unexecutable mid-build for every other job — it took the host down
      # for a day on 2026-06-15 — and (b) `rustup default` rewrites the MACHINE-GLOBAL
      # default, silently moving every concurrent job off the ADR-0015 reproducibility
      # pin. Full reasoning: scripts/ci-use-host-toolchain.sh header.
      - name: Use the workspace-pinned host toolchain (provisions nothing)
        run: bash scripts/ci-use-host-toolchain.sh ${{ matrix.target.triple }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c  # v2.7.7
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          workspaces: ". -> target"
          shared-key: cli-release-${{ matrix.target.triple }}

      # zig cross-toolchain: provides libc headers + linker for Linux + Windows.
      # SKIPPED for darwin targets: on a macOS host, native `cargo build`
      # cross-compiles fine using the system linker; using zigcc for
      # darwin-on-darwin triggers an upstream iconv/charset linker bug.
      #
      # Do not treat an arbitrary Homebrew Zig as good enough: cargo-zigbuild's
      # generated wrappers are coupled to Zig's CLI. The failed release chain
      # had no recorded tool versions, so an incompatible host upgrade was
      # indistinguishable from a source failure. This pin is checked, not
      # assumed, before every cross build.
      - name: Verify pinned Zig (Linux + Windows)
        if: ${{ !contains(matrix.target.triple, 'apple-darwin') }}
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_ZIG_VERSION=0.16.0
          command -v zig
          ACTUAL_ZIG_VERSION="$(zig version)"
          if [ "$ACTUAL_ZIG_VERSION" != "$EXPECTED_ZIG_VERSION" ]; then
            echo "::error::release-cli needs Zig ${EXPECTED_ZIG_VERSION}, got ${ACTUAL_ZIG_VERSION}. Install the pinned Zig on the builder before dispatching cli-v*." >&2
            exit 1
          fi
          zig version

      # Prebuilt binary, NOT `cargo install`. The old form compiled cargo-zigbuild
      # from source into the SHARED `~/.cargo` that all 5 self-hosted runners use
      # at once — the documented `os error 2` race. The "install once and reuse"
      # guard did NOT make that safe: it only narrowed the window to the first
      # build after a version bump, and the whole matrix hits that window at the
      # same moment. Same reasoning as mutation-pr.yml / lockfile-diff.yml.
      # install-action is a no-op when the pinned version is already on the host.
      - name: Install cargo-zigbuild (prebuilt, Linux + Windows only)
        if: ${{ !contains(matrix.target.triple, 'apple-darwin') }}
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-zigbuild@0.19.8

      # cargo-zigbuild places linker wrappers in its cache. That cache was
      # previously shared through $HOME; a non-executable restored wrapper led
      # to exit 126 and, worse, one matrix leg could reuse another's partial
      # wrapper. A per-job cache makes wrapper creation atomic from this job's
      # point of view and removes the chmod-after-the-fact race.
      - name: Verify cargo-zigbuild and isolate its wrapper cache
        if: ${{ !contains(matrix.target.triple, 'apple-darwin') }}
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_CARGO_ZIGBUILD_VERSION=0.19.8
          ACTUAL_CARGO_ZIGBUILD_VERSION="$(cargo zigbuild --version | awk '{print $2}')"
          if [ "$ACTUAL_CARGO_ZIGBUILD_VERSION" != "$EXPECTED_CARGO_ZIGBUILD_VERSION" ]; then
            echo "::error::release-cli needs cargo-zigbuild ${EXPECTED_CARGO_ZIGBUILD_VERSION}, got ${ACTUAL_CARGO_ZIGBUILD_VERSION}." >&2
            exit 1
          fi
          ZIGBUILD_CACHE="${RUNNER_TEMP}/cargo-zigbuild/${{ matrix.target.triple }}"
          mkdir -p "$ZIGBUILD_CACHE"
          echo "CARGO_ZIGBUILD_CACHE_DIR=${ZIGBUILD_CACHE}" >> "$GITHUB_ENV"
          cargo zigbuild --version

      # Reproducible build: SOURCE_DATE_EPOCH from git commit timestamp.
      - name: Set SOURCE_DATE_EPOCH
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" >> "$GITHUB_ENV"

      # Windows fix: the `windows_x86_64_gnu` crate ships a static archive
      # (libwindows.0.52.0.a) inside its source distribution that lld-link
      # consumes at build time. Swatinem/rust-cache occasionally restores
      # the partial registry src without the `lib/` subdir — re-extract
      # the package to guarantee the .a is present.
      - name: Re-fetch windows-rs deps (cache integrity fix)
        if: matrix.target.triple == 'x86_64-pc-windows-gnu'
        run: |
          rm -rf "$HOME"/.cargo/registry/src/index.crates.io-*/windows_x86_64_gnu-*
          rm -rf "$HOME"/.cargo/registry/src/index.crates.io-*/windows-targets-*
          cargo fetch --target "${{ matrix.target.triple }}"

      # Strip absolute dev-host paths from the binary (CTRL-PATH-HYGIENE).
      # Without this, `strings` on the binary exposes
      # `/Users/<runner-user>/.cargo/registry/...` and similar — username
      # leak with no functional value. Map all known prefixes to short
      # placeholders so debug strings carry semantics but not paths.
      - name: Set RUSTFLAGS path-remap
        run: |
          REMAP=""
          REMAP="$REMAP --remap-path-prefix=$HOME/.cargo/registry=cargo-registry"
          REMAP="$REMAP --remap-path-prefix=$HOME/.cargo/git=cargo-git"
          REMAP="$REMAP --remap-path-prefix=$HOME/.rustup=rustup"
          REMAP="$REMAP --remap-path-prefix=$GITHUB_WORKSPACE=corelink"
          echo "RUSTFLAGS=$REMAP" >> "$GITHUB_ENV"

      - name: Build (cargo zigbuild) — Linux + Windows
        if: ${{ !contains(matrix.target.triple, 'apple-darwin') }}
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
          RUSTFLAGS: ${{ env.RUSTFLAGS }}
        run: |
          cargo zigbuild \
            -p corelink-cli \
            --release \
            --locked \
            --target ${{ matrix.target.triple }}

      - name: Build (cargo build, native) — macOS targets
        # The runner host is macOS x86_64. cargo can natively cross-compile
        # to x86_64-apple-darwin (no-op) and aarch64-apple-darwin using the
        # system linker (ld). No cargo-zigbuild dependency.
        if: ${{ contains(matrix.target.triple, 'apple-darwin') }}
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
          RUSTFLAGS: ${{ env.RUSTFLAGS }}
        run: |
          cargo build \
            -p corelink-cli \
            --release \
            --locked \
            --target ${{ matrix.target.triple }}

      # Binary stripping is handled by [profile.release] strip = true
      # in the workspace Cargo.toml — no explicit strip step needed.
      #
      # Keep the raw binary for the public installer AND publish the archive
      # consumed by sign-linux/sign-windows/notarize-macos. Previously only the
      # former existed, so every downstream signer asked the release root for a
      # .tar.gz/.zip that did not exist.
      - name: Prepare installer + signer artifacts and SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          SRC="target/${{ matrix.target.triple }}/release/corelink"
          SRC="${SRC}${{ matrix.target.ext }}"
          ASSET="${{ matrix.target.name }}${{ matrix.target.ext }}"
          mkdir -p out
          cp "$SRC" "out/${ASSET}"
          PACKAGE_DIR="${RUNNER_TEMP}/corelink-package-${{ matrix.target.name }}"
          mkdir -p "$PACKAGE_DIR"
          cp "$SRC" "$PACKAGE_DIR/corelink${{ matrix.target.ext }}"
          if [ "${{ matrix.target.triple }}" = "x86_64-pc-windows-gnu" ]; then
            ARCHIVE="${{ matrix.target.signer_name }}.zip"
            # ditto is supplied by the macOS builder and preserves the expected
            # `corelink.exe` member name consumed by sign-windows.yml.
            ditto -c -k --sequesterRsrc --keepParent \
              "$PACKAGE_DIR/corelink.exe" "out/${ARCHIVE}"
          else
            ARCHIVE="${{ matrix.target.signer_name }}.tar.gz"
            tar -czf "out/${ARCHIVE}" -C "$PACKAGE_DIR" "corelink${{ matrix.target.ext }}"
          fi
          for FILE in "$ASSET" "$ARCHIVE"; do
            (cd out && shasum -a 256 "$FILE" > "${FILE}.sha256")
            (cd out && shasum -a 256 -c "${FILE}.sha256")
          done
          echo "ASSET=${ASSET}" >> "$GITHUB_ENV"

      # TODO (v2): cosign keyless signing
      # Ref: sigstore/cosign-installer@1aa8e0f2454b781fbf0fbf306a4c9533a0c57409
      - name: "[TODO v2] cosign sign (placeholder)"
        run: |
          echo "SIGNING PLACEHOLDER: cosign keyless signing not yet wired."
          echo "Tracked as Stream 2.8 v2 TODO."

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.target.name }}
          path: out/
          retention-days: 1

  # -------------------------------------------------------------------
  # release — collect artifacts and create the public CLI release
  #
  # ⚠️ STALE COMMENT CORRECTED 2026-08-02. The block here claimed the release
  # had been "switched to publishing in this repo's Releases" and that the
  # separate corelink-cli repo "can be archived / repurposed". The release
  # history says otherwise — all three on 2026-05-29:
  #     20:09  corelink-server  cli-v0.1.0   (the switch)
  #     21:35  corelink-cli     v0.1.0
  #     22:04  corelink-cli     v0.1.1   <- newest, 11 assets incl. windows
  # i.e. publishing moved BACK to the separate repo and the comment was never
  # updated. The installer downloads from corelink-cli, so the latest CLI a
  # customer can install is v0.1.1 — not the cli-v0.1.0 in this repo.
  #
  # REPOINTED 2026-08-31 (WP-E): the five `HumanGuardrail/corelink-cli` strings in
  # this file — including the two `gh release create` / `gh release upload`
  # `--repo` flags below — named a repo that returns 404. `gh api
  # repos/HumanGuardrail/corelink-cli` → `404 Not Found`, while the control
  # `gh api repos/HuGR-Labs/corelink-cli` resolves. So the `release` job could
  # not have succeeded even with a fully green build matrix, and the comment
  # immediately below had said the canonical home was HuGR-Labs since 2026-08-02
  # while the code two dozen lines down was never updated to match.
  #
  # NOTE the asymmetry, deliberately left alone: the `HumanGuardrail/corelink-server`
  # strings elsewhere in this file are NOT broken and were NOT touched. GitHub
  # keeps a permanent redirect after a transfer, and `gh api
  # repos/HumanGuardrail/corelink-server` resolves to `HuGR-Labs/corelink-server`.
  # `corelink-cli` has no such redirect because it came from a personal account,
  # not from that org — which is exactly why one 404s and the other does not.
  #
  # Canonical home is now HuGR-Labs/corelink-cli (transferred 2026-08-02 off the
  # personal gmhelmold account; the get-corelink-worker RELEASE_ORIGIN is pinned
  # to it). Anyone changing where releases are published MUST repin that var and
  # redeploy the worker, or the installer keeps fetching the old location.
  # -------------------------------------------------------------------
  release:
    name: create release (HuGR-Labs/corelink-cli)
    needs: build
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 15
    # The source-repo GITHUB_TOKEN cannot publish cross-repo. The only write
    # credential is injected in the two release steps below as the external,
    # manually provisioned CORELINK_CLI_RELEASE_TOKEN.
    permissions:
      contents: read

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist/
          merge-multiple: true

      - name: Verify artifact inventory and individual checksums
        shell: bash
        run: |
          set -euo pipefail
          echo "=== dist/ contents ==="
          find dist/ -maxdepth 1 -type f | sort
          # 5 installer binaries + 5 signer archives, each with its own digest.
          EXPECTED=20
          ACTUAL=$(find dist/ -maxdepth 1 -type f | wc -l | tr -d ' ')
          if [ "$ACTUAL" -ne "$EXPECTED" ]; then
            echo "ERROR: expected ${EXPECTED} files, got ${ACTUAL}" >&2
            exit 1
          fi
          for CHECKSUM in dist/*.sha256; do
            (cd dist && shasum -a 256 -c "$(basename "$CHECKSUM")")
          done

      - name: Build combined checksums.txt
        shell: bash
        run: |
          set -euo pipefail
          LC_ALL=C sort dist/*.sha256 > dist/checksums.txt
          echo "=== checksums.txt ==="
          cat dist/checksums.txt

      - name: Write release notes
        shell: bash
        run: |
          # Static section (single-quoted heredoc: no variable expansion).
          cat > /tmp/release-notes.md << 'NOTES_EOF'
          ## Install

          ```sh
          curl -fsSL https://corelink-get.humangr.com | sh -s -- --token=<PAT>
          ```

          ## Platforms

          | Binary | OS | Arch |
          |--------|-----|------|
          | `corelink-linux-x86_64`      | Linux   | x86_64  |
          | `corelink-linux-aarch64`     | Linux   | aarch64 |
          | `corelink-darwin-x86_64`     | macOS   | x86_64  |
          | `corelink-darwin-aarch64`    | macOS   | aarch64 |
          | `corelink-windows-x86_64.exe`| Windows | x86_64  |

          ## Checksums

          See `checksums.txt` for SHA-256 digests of all artifacts.

          ## Source
          NOTES_EOF
          # Dynamic line: GITHUB_REF_NAME expands at runtime.
          # shellcheck disable=SC2016
          echo "Built from \`HumanGuardrail/corelink-server\` tag \`${GITHUB_REF_NAME}\`." \
            >> /tmp/release-notes.md

      - name: Assert external cross-repository release credential
        env:
          GH_TOKEN: ${{ secrets.CORELINK_CLI_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::CORELINK_CLI_RELEASE_TOKEN is required only to publish to HuGR-Labs/corelink-cli; it is intentionally unavailable to build jobs." >&2
            exit 1
          fi
          gh api --method GET repos/HuGR-Labs/corelink-cli >/dev/null

      - name: Create GitHub Release in HuGR-Labs/corelink-cli
        env:
          GH_TOKEN: ${{ secrets.CORELINK_CLI_RELEASE_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo HuGR-Labs/corelink-cli \
            --title "CoreLink CLI ${GITHUB_REF_NAME#cli-}" \
            --notes-file /tmp/release-notes.md

      - name: Upload binaries + checksums to release
        env:
          GH_TOKEN: ${{ secrets.CORELINK_CLI_RELEASE_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/* --repo HuGR-Labs/corelink-cli --clobber

      - name: Read back published artifacts and verify release-root digests
        env:
          GH_TOKEN: ${{ secrets.CORELINK_CLI_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHED="${RUNNER_TEMP}/corelink-release-readback"
          mkdir -p "$PUBLISHED"
          gh release download "${GITHUB_REF_NAME}" \
            --repo HuGR-Labs/corelink-cli \
            --dir "$PUBLISHED" \
            --pattern 'corelink-*' \
            --pattern 'checksums.txt' \
            --clobber
          ACTUAL=$(find "$PUBLISHED" -maxdepth 1 -type f | wc -l | tr -d ' ')
          if [ "$ACTUAL" -ne 21 ]; then
            echo "::error::release root must expose 20 artifacts plus checksums.txt; got ${ACTUAL}." >&2
            find "$PUBLISHED" -maxdepth 1 -type f -print | sort >&2
            exit 1
          fi
          (cd "$PUBLISHED" && shasum -a 256 -c checksums.txt)
