name: secrets-drift (R-PREP)

# Secrets-matrix drift gate (Python validator) — complements
# `secrets-checklist-verify.sh` (bash, deploy-gate in cf-deploy-prod.yml).
#
# This workflow runs:
#   1. Daily at 04:00 UTC — continuous monitoring; uploads JSON report
#      artifact for SOC 2 CC6.1 sampling + dashboards.
#   2. On every PR that touches Cargo.toml / Cargo.lock / wrangler.toml
#      / .github/workflows/** / docs/internal/secrets-checklist.md —
#      fails the PR if any new `code-only` env var is introduced without
#      a matching matrix row.
#
# Triage on failure: specs/_runbooks/RB-SECRETS-DRIFT.md
# Cross-refs: docs/internal/secrets-checklist.md, ROADMAP-TO-GA.md §9,
#             specs/_compliance/SOC2-EVIDENCE-ROLLUP-2026-05-15.md (CC6.1).

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**/Cargo.toml'
      - 'apps/**/Cargo.toml'
      - 'apps/**/package.json'
      - '**/wrangler.toml'
      - '.github/workflows/**'
      - 'docs/internal/secrets-checklist.md'
      - 'scripts/validate_secrets_matrix.py'
      - 'scripts/secrets-checklist-verify.sh'
  push:
    branches: [main]
    paths:
      - 'docs/internal/secrets-checklist.md'
      - 'scripts/validate_secrets_matrix.py'
  schedule:
    # Daily 04:00 UTC — between cargo-audit (06:00) and cf-deploy-prod
    # gate so any overnight code-side drift is visible before the deploy
    # window opens.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-drift:
    name: secrets-matrix drift gate
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # No actions/setup-python: the self-hosted mac fleet can't reliably
      # provision Python via setup-python (RUNNER_TOOL_CACHE unset → falls
      # back to the unwritable /Users/runner path). These scripts only need
      # `python3`, which ships on every runner. (2026-06-02)
      - name: Run drift validator (fail on code-only drift)
        id: drift
        # Exits 1 if any new env-var reference exists in code without a
        # matrix row. PRs MUST add a row to docs/internal/secrets-checklist.md
        # or add the var to the allowlist in scripts/validate_secrets_matrix.py.
        run: |
          mkdir -p artifacts
          python3 scripts/validate_secrets_matrix.py \
            --json-out artifacts/secrets-drift-report.json

      - name: Cross-check with bash deploy-gate verifier
        # Belt-and-suspenders: the bash verifier is the production deploy
        # gate. Running it here guarantees PR-time parity with cf-deploy-prod.
        if: success() || failure()
        run: bash scripts/secrets-checklist-verify.sh

      - name: Upload drift report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secrets-drift-report
          path: artifacts/secrets-drift-report.json
          retention-days: 90
