name: secrets-drift (R-PREP)

# Secrets-matrix drift gate (Python validator) — complements
# `secrets-checklist-verify.sh` (bash, deploy-gate in cf-deploy-prod.yml).
#
# This workflow runs:
#   1. Daily at 04:00 UTC — continuous monitoring; uploads JSON report
#      artifact for SOC 2 CC6.1 sampling + dashboards.
#   2. On every PR that touches Cargo.toml / Cargo.lock / wrangler.toml
#      / .github/workflows/** / docs/internal/secrets-checklist.md —
#      fails the PR if any new `code-only` env var is introduced without
#      a matching matrix row.
#
# Triage on failure: specs/_runbooks/RB-SECRETS-DRIFT.md
# Cross-refs: docs/internal/secrets-checklist.md, ROADMAP-TO-GA.md §9,
#             specs/_compliance/SOC2-EVIDENCE-ROLLUP-2026-05-15.md (CC6.1).

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**/Cargo.toml'
      - 'apps/**/Cargo.toml'
      - 'apps/**/package.json'
      - '**/wrangler.toml'
      - '.github/workflows/**'
      # Any Rust/TS source can introduce a new `env::var(...)` / `env.X` secret
      # read; the scan itself is whole-repo, so widen the PR trigger beyond just
      # the container crate (previously only crates/corelink-container/src/**).
      - 'crates/**/*.rs'
      - 'apps/**/*.ts'
      - 'apps/**/*.tsx'
      - 'worker/**/*.ts'
      - 'docs/internal/secrets-checklist.md'
      - 'scripts/validate_secrets_matrix.py'
      - 'scripts/secrets-checklist-verify.sh'
      # Container env-contract gate (CAA-360 F8): every env var the container
      # reads must be forwarded by the Worker DO. Trigger on both sides.
      - 'scripts/check-env-contract.py'
      - 'worker/src/durable_object.ts'
      - 'crates/corelink-container/src/**'
  push:
    branches: [main]
    paths:
      - 'docs/internal/secrets-checklist.md'
      - 'scripts/validate_secrets_matrix.py'
      - 'scripts/check-env-contract.py'
      - 'worker/src/durable_object.ts'
      - 'crates/corelink-container/src/**'
  schedule:
    # Daily 04:00 UTC — between cargo-audit (06:00) and cf-deploy-prod
    # gate so any overnight code-side drift is visible before the deploy
    # window opens.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-drift:
    name: secrets-matrix drift gate
    # Runner (CI cost diet 2026-08-01): SPLIT by event on purpose.
    #   pull_request / push -> self-hosted mac fleet. This is a sub-minute
    #     stdlib-python3 + bash scan, but its `paths:` surface is so wide that it
    #     fired 490 times in June 2026 — 490 paid minutes under the hosted
    #     1-MINUTE-PER-JOB FLOOR. A gate failure here is a visible red/pending
    #     check on the PR, so a fleet outage can never pass silently.
    #   schedule -> stays GitHub-hosted. The DAILY run is SOC 2 CC6.1 evidence
    #     (it uploads the JSON report artifact); a scheduled run that silently
    #     does not happen because the fleet is offline would be an invisible
    #     evidence gap, which is exactly the failure mode compliance can't
    #     tolerate. Cost of keeping it hosted: ~30 min/month.
    runs-on: ${{ github.event_name == 'schedule' && 'ubuntu-latest' || fromJSON('["self-hosted","mac","corelink-builder"]') }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # No actions/setup-python: the self-hosted mac fleet can't reliably
      # provision Python via setup-python (RUNNER_TOOL_CACHE unset → falls
      # back to the unwritable /Users/runner path). These scripts only need
      # `python3`, which ships on every runner. (2026-06-02)
      - name: Run drift validator (fail on code-only drift)
        id: drift
        # Exits 1 if any new env-var reference exists in code without a
        # matrix row. PRs MUST add a row to docs/internal/secrets-checklist.md
        # or add the var to the allowlist in scripts/validate_secrets_matrix.py.
        run: |
          mkdir -p artifacts
          python3 scripts/validate_secrets_matrix.py \
            --json-out artifacts/secrets-drift-report.json

      - name: Container env-contract gate (forward-list parity)
        # CAA-360 F8: every env var the container reads (env::var /
        # non_empty_env / env_or, incl. const-aliased names like
        # HUGR_OCI_TOKEN_KEY) MUST appear in the Worker DO
        # container.start({ env: { ... } }) forward-list, else setting the
        # Cloudflare secret is a silent no-op. Pure grep — exits 1 on drift.
        if: success() || failure()
        run: python3 scripts/check-env-contract.py

      - name: Cross-check with bash deploy-gate verifier
        # Belt-and-suspenders: the bash verifier is the production deploy
        # gate. Running it here guarantees PR-time parity with cf-deploy-prod.
        if: success() || failure()
        run: bash scripts/secrets-checklist-verify.sh

      - name: Upload drift report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secrets-drift-report
          path: artifacts/secrets-drift-report.json
          retention-days: 90
