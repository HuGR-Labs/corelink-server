name: secrets-drift (R-PREP)

# Secrets-matrix drift gate (Python validator) — complements
# `secrets-checklist-verify.sh` (bash, deploy-gate in cf-deploy-prod.yml).
#
# This workflow runs:
#   1. Daily at 04:00 UTC — continuous monitoring on an ephemeral GitHub-hosted
#      Linux runner; uploads JSON report
#      artifact for SOC 2 CC6.1 sampling + dashboards. The separate
#      `secrets-drift-evidence-watchdog.yml` checks that this run and artifact
#      exist, including the never-started-run case.
#   2. On every PR_TARGET that touches Cargo.toml / Cargo.lock / wrangler.toml
#      / .github/workflows/** / docs/internal/secrets-checklist.md —
#      fails the PR if any new `code-only` env var is introduced without
#      a matching matrix row.
#
# Triage on failure: specs/_runbooks/RB-SECRETS-DRIFT.md
# Cross-refs: docs/internal/secrets-checklist.md, ROADMAP-TO-GA.md §9,
#             specs/_compliance/SOC2-EVIDENCE-ROLLUP-2026-05-15.md (CC6.1).

on:
  pull_request_target:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**/Cargo.toml'
      - 'apps/**/Cargo.toml'
      - 'apps/**/package.json'
      - '**/wrangler.toml'
      - '.github/workflows/**'
      # Any Rust/TS source can introduce a new `env::var(...)` / `env.X` secret
      # read; the scan itself is whole-repo, so widen the PR trigger beyond just
      # the container crate (previously only crates/corelink-container/src/**).
      - 'crates/**/*.rs'
      - 'apps/**/*.ts'
      - 'apps/**/*.tsx'
      - 'worker/**/*.ts'
      - 'docs/internal/secrets-checklist.md'
      - 'scripts/validate_secrets_matrix.py'
      - 'scripts/secrets-checklist-verify.sh'
      # Container env-contract gate (CAA-360 F8): every env var the container
      # reads must be forwarded by the Worker DO. Trigger on both sides.
      - 'scripts/check-env-contract.py'
      - 'worker/src/durable_object.ts'
      - 'crates/corelink-container/src/**'
  push:
    branches: [main]
    paths:
      - 'docs/internal/secrets-checklist.md'
      - 'scripts/validate_secrets_matrix.py'
      - 'scripts/check-env-contract.py'
      - 'worker/src/durable_object.ts'
      - 'crates/corelink-container/src/**'
  schedule:
    # Daily 04:00 UTC — between cargo-audit (06:00) and cf-deploy-prod
    # gate so any overnight code-side drift is visible before the deploy
    # window opens.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-drift:
    name: secrets-matrix drift gate
    # This scanner is credentialless: it reads repository source and emits
    # redacted metadata only. Keep it on an ephemeral hosted Linux runner so
    # daily evidence does not depend on the product runner fleet.
    # Manual dispatch is accepted only from trusted main; pull_request_target
    # loads this workflow from the trusted base and treats PR content as data.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted tooling # nosemgrep: yaml.github-actions.security.pull-request-target-code-checkout.pull-request-target-code-checkout # reason: immutable trusted tooling tree; ADR-0101
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .trusted
          persist-credentials: false

      - name: Checkout pull-request tree as data # nosemgrep: yaml.github-actions.security.pull-request-target-code-checkout.pull-request-target-code-checkout # reason: candidate is data-only; trusted validator runs from BASE; ADR-0101
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .candidate
          fetch-depth: 1
          persist-credentials: false

      # No actions/setup-python: the self-hosted mac fleet can't reliably
      # provision Python via setup-python (RUNNER_TOOL_CACHE unset → falls
      # back to the unwritable /Users/runner path). These scripts only need
      # `python3`, which ships on every runner. (2026-06-02)
      - name: Run drift validator (fail on code-only drift)
        id: drift
        # Exits 1 if any new env-var reference exists in code without a
        # matrix row. PRs MUST add a row to docs/internal/secrets-checklist.md
        # or add the var to the allowlist in scripts/validate_secrets_matrix.py.
        run: |
          set -euo pipefail
          candidate_root="${GITHUB_WORKSPACE}/.trusted"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request_target" ]]; then
            candidate_root="${GITHUB_WORKSPACE}/.candidate"
          fi
          mkdir -p artifacts
          python3 "${GITHUB_WORKSPACE}/.trusted/scripts/validate_secrets_matrix.py" \
            --repo-root "${candidate_root}" \
            --json-out artifacts/secrets-drift-report.json

      - name: Record run manifest
        if: always()
        run: |
          set -euo pipefail
          # This is metadata only; it makes a validator invocation failure
          # explicit in the retained artifact rather than leaving an empty
          # artifact directory.
          cat > artifacts/secrets-drift-run.json <<EOF
          {
            "schema_version": "1",
            "workflow": "secrets-drift.yml",
            "event": "${{ github.event_name }}",
            "run_id": "${{ github.run_id }}",
            "ref": "${{ github.ref }}"
          }
          EOF

      - name: Require primary drift report
        if: always()
        run: |
          set -euo pipefail
          test -s artifacts/secrets-drift-report.json || {
            echo 'secrets-drift validator produced no primary report; refusing evidence upload' >&2
            exit 1
          }

      - name: Container env-contract gate (forward-list parity)
        # CAA-360 F8: every env var the container reads (env::var /
        # non_empty_env / env_or, incl. const-aliased names like
        # HUGR_OCI_TOKEN_KEY) MUST appear in the Worker DO
        # container.start({ env: { ... } }) forward-list, else setting the
        # Cloudflare secret is a silent no-op. Pure grep — exits 1 on drift.
        if: success() || failure()
        run: |
          set -euo pipefail
          candidate_root="${GITHUB_WORKSPACE}/.trusted"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request_target" ]]; then
            candidate_root="${GITHUB_WORKSPACE}/.candidate"
          fi
          python3 "${GITHUB_WORKSPACE}/.trusted/scripts/check-env-contract.py" \
            --repo-root "${candidate_root}"

      - name: Cross-check with bash deploy-gate verifier
        # Belt-and-suspenders: the bash verifier is the production deploy
        # gate. Running it here guarantees PR-time parity with cf-deploy-prod.
        if: success() || failure()
        run: |
          set -euo pipefail
          candidate_root="${GITHUB_WORKSPACE}/.trusted"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request_target" ]]; then
            candidate_root="${GITHUB_WORKSPACE}/.candidate"
          fi
          bash "${GITHUB_WORKSPACE}/.trusted/scripts/secrets-checklist-verify.sh" \
            --repo-root "${candidate_root}"

      - name: Upload drift report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secrets-drift-report
          path: artifacts/secrets-drift-report.json
          retention-days: 90
          if-no-files-found: error

      - name: Upload run manifest artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secrets-drift-run-manifest
          path: artifacts/secrets-drift-run.json
          retention-days: 90
          if-no-files-found: error
