name: docs a11y (WCAG 2.2 AA axe-core sweep)

# WI-S18-005 deliverable 4 — WCAG 2.2 AA accessibility CI gate.
# Playwright + @axe-core/playwright sweep over every docs route; zero
# serious/critical violations allowed.
# Spec contract S-18 §5.6 R-S18-14 + Quality Standard 14.s18.4.

on:
  pull_request:
    paths:
      - "apps/docs/**"
      - ".github/workflows/docs-a11y.yml"
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - ".github/workflows/docs-a11y.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a11y-sweep:
    name: axe-core WCAG 2.2 AA sweep (0 serious/critical)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v4.1.0
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build docs
        run: pnpm build

      - name: Run a11y sweep
        run: pnpm exec playwright test --config playwright-a11y.config.ts

      - name: Upload a11y report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-a11y-report
          path: apps/docs/playwright-report/
          retention-days: 14
