name: i1639 signup-worker entitlement Vitest

# Manual, credentialless evidence lane for the Stripe entitlement writer.
# The repository's historical signup-worker workflow is disabled and targets
# the zero-hosted runner; this lane is intentionally GitHub-hosted and has no
# deployment, provider, or secret access.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signup-worker-vitest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/signup-worker
    steps:
      - name: Check out the dispatched revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile --filter @corelink/signup-worker... --ignore-scripts

      - name: Verify signup-worker lockfile pin
        working-directory: .
        run: python3 scripts/check_signup_worker_pin.py

      - name: Run signup-worker Vitest suite
        run: pnpm exec vitest run
