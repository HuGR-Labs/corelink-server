name: file-size ratchet (god files, B-126)

# The owner's 2026-08-31 decision — every source file above 1000 lines gets
# refactored into smaller files — needs a gate, or the 81 files in the baseline
# keep growing while the campaign runs and it never converges.
#
# The PR event is `pull_request_target` deliberately: GitHub loads this workflow
# from the trusted base commit, while the validator reads only candidate Git
# blobs. This prevents a PR from replacing its own validator or baseline.
# A push lane covers direct commits to main as well as the PR path.
#
# Runs on the `corelink` self-hosted fleet: the zero-hosted-spend mandate is
# absolute (`ubuntu-latest` is billing-blocked). Needs nothing but python3 and
# git — no toolchain, no cargo, no cache — so it is seconds, not minutes, and
# adds no meaningful load to a machine that is also the CI runner.

on:
  pull_request_target:
    paths:
      - '**'
  push:
    branches: [main]
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: file-size-ratchet-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ratchet:
    name: no file grows past the god-file baseline
    runs-on: corelink
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Candidate blobs are inspected by object id; no candidate code is
          # executed. Full history supplies both base and head objects.
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Ratchet
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # On PRs, execute the validator from the trusted base commit. The
          # checked-out head is data only, never executable policy.
          git show "${BASE_REF}:scripts/validate_file_size_ratchet.py" > "$RUNNER_TEMP/validate_file_size_ratchet.py"
          GODFILE_REPO_ROOT="$GITHUB_WORKSPACE" \
            python3 "$RUNNER_TEMP/validate_file_size_ratchet.py" \
              --base-ref "$BASE_REF" --head-ref "$HEAD_REF"
