# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: actionlint

# Static lint of every workflow file in .github/workflows. Catches:
#   - invalid YAML syntax
#   - unknown contexts / undefined expression variables
#   - shellcheck violations in `run:` blocks
#   - unknown runner labels (e.g. retired `macos-13`)
#   - deprecated set-env / add-path commands
#   - unused step IDs, wrong job-needs references, etc.
#
# Also runs scripts/validate_shared_home_cache_guard.py, which fails the PR if a
# cargo-cache step is not gated to github-hosted runners. Five self-hosted
# runners share ONE ~/.cargo, and Swatinem/rust-cache's save step prunes
# $CARGO_HOME/registry/src while another runner's rustc compiles from it —
# reddening unrelated PRs with `os error 2`. See the script's docstring.
#
# DEBT-020 closure: gate workflow drift before merge.
# Sprint / WI link: WI-R-PREP §workflows
# Quality lane: STANDARD
# Fail-closed: YES (any actionlint violation fails the PR)

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.actionlint.yaml'
      - '.github/actionlint.yaml'
      - '.github/workflows/actionlint.yml'
      - 'scripts/validate_shared_home_cache_guard.py'
      - 'scripts/validate_no_shared_rustup_mutation.py'
      - 'scripts/validate_workflow_path_filters.py'
      - 'scripts/ci-use-host-toolchain.sh'
      - 'scripts/verify_b254_actionlint_config.py'
      - 'tests/test_pull_request_target_spawn_boundary.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.actionlint.yaml'
      - '.github/actionlint.yaml'
      - 'scripts/validate_shared_home_cache_guard.py'
      - 'scripts/validate_no_shared_rustup_mutation.py'
      - 'scripts/validate_workflow_path_filters.py'
      - 'scripts/ci-use-host-toolchain.sh'
      - 'scripts/verify_b254_actionlint_config.py'
      - 'tests/test_pull_request_target_spawn_boundary.py'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    name: actionlint (native, SHA-pinned tool)
    # Runner: GitHub-hosted ubuntu-24.04 (Bundle 6 migration from self-hosted).
    # actionlint 1.7.12 fetched via pinned release installer; shellcheck from runner image.
    # Hosted minutes bill with 1-minute floor — acceptable for this sub-minute gate.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # actions/checkout@v7.0.0
        with:
          persist-credentials: false

      # Native actionlint on GitHub-hosted ubuntu-24.04. The docker://rhysd/actionlint
      # is a Docker container action (Linux-only) but we use the host binary via the
      # pinned release installer which auto-detects Linux. taiki-e/install-action does
      # NOT package actionlint (it is not a cargo crate), so we run the host binary,
      # falling back to the official pinned 1.7.12 release installer if needed.
      # (2026-06-02, migrated to hosted 2026-09-22)
      - name: Run actionlint (native binary)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v actionlint >/dev/null 2>&1; then
            echo "actionlint not on PATH — fetching pinned 1.7.12 release"
            bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
            export PATH="$PWD:$PATH"
          fi
          actionlint -version
          actionlint -color -verbose

      # B-254: .actionlint.yaml is canonical and the .github path is only its
      # discovery-compatible symlink. Exercise both explicit paths plus
      # negative label/config mutations so a green discovery run cannot mask a
      # second, divergent authority.
      - name: Canonical actionlint config and mutation gate (B-254)
        shell: bash
        run: python3 -S scripts/verify_b254_actionlint_config.py

      # Fleet-safety gates: validate ALL workflows for shared-$HOME cache race
      # and rustup mutation on the self-hosted mac fleet. This job now runs on
      # ubuntu-24.04 (hosted), but the gates still scan every workflow file.
      # stdlib-only python3, no setup-python (RUNNER_TOOL_CACHE is unset on
      # the fleet — see action-sha-audit.yml).
      - name: Cargo-cache steps must be gated to github-hosted runners
        shell: bash
        run: python3 scripts/validate_shared_home_cache_guard.py

      # Sibling of the gate above: protects the shared ~/.rustup on the fleet.
      # A self-hosted job must never run rustup toolchain install/default (it
      # can make rustc unexecutable for every other job, and silently moves the
      # whole host off the ADR-0015 reproducibility pin). Also bans hardcoding a
      # versioned toolchain path, which is a second copy of that pin that nothing
      # keeps in sync. Fails closed if it inspects zero self-hosted jobs.
      - name: Self-hosted jobs must not provision a Rust toolchain
        shell: bash
        run: python3 scripts/validate_no_shared_rustup_mutation.py

      # A `paths:` glob that matches nothing does not fail — it just stops
      # triggering its workflow, which looks exactly like "no problem found".
      # Three such globs were live on 2026-08-03: two crate paths misspelled in
      # perf-regression.yml, and `apps/server/**` in tenant-path.yml, a tree
      # absorbed into crates/corelink-container in May and never re-pointed.
      # actionlint does not check this (it validates syntax, not whether a glob
      # resolves), so this gate does. stdlib-only python3, same as its siblings.
      - name: Workflow path filters must match at least one tracked file
        shell: bash
        run: python3 scripts/validate_workflow_path_filters.py

      # B-141: every pull_request_target job that can allocate the ephemeral
      # fabric must be actor-gated, and write scopes must stay least-privilege.
      # This suite includes negative mutations so a permissive gate cannot turn
      # green merely because the workflow still parses.
      - name: Pull request target spawn boundary (B-141)
        shell: bash
        run: python3 tests/test_pull_request_target_spawn_boundary.py

      # The boundary parser is intentionally stdlib-only. -S disables site
      # packages, proving this gate does not depend on the runner image's
      # unprovisioned PyYAML (or any other ambient package).
      - name: Pull request target spawn boundary (B-141, hermetic)
        shell: bash
        run: python3 -S tests/test_pull_request_target_spawn_boundary.py
