# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: actionlint

# Static lint of every workflow file in .github/workflows. Catches:
#   - invalid YAML syntax
#   - unknown contexts / undefined expression variables
#   - shellcheck violations in `run:` blocks
#   - unknown runner labels (e.g. retired `macos-13`)
#   - deprecated set-env / add-path commands
#   - unused step IDs, wrong job-needs references, etc.
#
# DEBT-020 closure: gate workflow drift before merge.
# Sprint / WI link: WI-R-PREP §workflows
# Quality lane: STANDARD
# Fail-closed: YES (any actionlint violation fails the PR)

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.actionlint.yaml'
      - '.github/actionlint.yaml'
      - '.github/workflows/actionlint.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.actionlint.yaml'
      - '.github/actionlint.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    name: actionlint (native, SHA-pinned tool)
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # actions/checkout@v6.0.3

      # Native actionlint on the macOS self-hosted fleet. The previous
      # docker://rhysd/actionlint is a Docker container action (Linux-only)
      # AND this job was pinned to [self-hosted, Linux, X64] — a label set
      # matching ZERO runners on our macOS-only fleet — so it hung pending
      # forever, jamming the pre-merge gate-check. The fleet ships actionlint
      # on PATH (1.7.12, built from source); taiki-e/install-action does NOT
      # package actionlint (it is not a cargo crate), so we run the host
      # binary, falling back to the official pinned 1.7.12 release installer
      # if a runner lacks it. (2026-06-02)
      - name: Run actionlint (native binary)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v actionlint >/dev/null 2>&1; then
            echo "actionlint not on PATH — fetching pinned 1.7.12 release"
            bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
            export PATH="$PWD:$PATH"
          fi
          actionlint -version
          actionlint -color -verbose
