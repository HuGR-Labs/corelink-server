name: Dashboard Validation (WI-S09-005)

# Runs canonical-12 Grafana dashboard structural validation per WI-S09-005:
# - JSON parses
# - Canonical 12 count discipline (Lote 10.8-tris P1-NEW-1 lesson absorbed)
# - Required template variables (region/tenant_tier/tenant)
# - Datasource consistency ($DS_PROMETHEUS)
# - lastUpdated annotation per sprint contract §14.s09.6
# - cardinality_budget_used annotation per WI-S09-001 inheritance

on:
  pull_request:
    paths:
      - 'dashboards/grafana/**'
      - 'scripts/validate_dashboards.py'
      - '.github/workflows/dashboard_validation.yml'
  push:
    branches: [main]
    paths:
      - 'dashboards/grafana/**'
      - 'scripts/validate_dashboards.py'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard-validation:
    # Runner: GitHub-hosted Ubuntu 24.04 (wave 3 migration from corelink fabric).
    # stdlib-only python3 validator; sub-minute check.
    runs-on: ubuntu-24.04
    # Bound the hosted job so a wedged validation run cannot consume runner
    # time indefinitely. This check is sub-minute.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # actions/checkout@v7.0.0
        with:
          persist-credentials: false

      # No actions/setup-python needed: the GitHub-hosted Ubuntu image ships
      # with python3, and this validator uses only the standard library.
      - name: Validate dashboards (canonical-12 + structural)
        run: python3 scripts/validate_dashboards.py

      - name: Verify all dashboards parse
        run: |
          python3 -c "
          import json, glob, sys
          ok = True
          for f in sorted(glob.glob('dashboards/grafana/DASH-*.json')):
              try:
                  with open(f) as fh:
                      json.load(fh)
                  print(f'  [OK] {f}')
              except Exception as e:
                  print(f'  [FAIL] {f}: {e}')
                  ok = False
          sys.exit(0 if ok else 1)
          "
