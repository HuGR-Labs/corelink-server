name: Dashboard Validation (WI-S09-005)

# Runs canonical-12 Grafana dashboard structural validation per WI-S09-005:
# - JSON parses
# - Canonical 12 count discipline (Lote 10.8-tris P1-NEW-1 lesson absorbed)
# - Required template variables (region/tenant_tier/tenant)
# - Datasource consistency ($DS_PROMETHEUS)
# - lastUpdated annotation per sprint contract §14.s09.6
# - cardinality_budget_used annotation per WI-S09-001 inheritance

on:
  pull_request:
    paths:
      - 'dashboards/grafana/**'
      - 'scripts/validate_dashboards.py'
      - '.github/workflows/dashboard_validation.yml'
  push:
    branches: [main]
    paths:
      - 'dashboards/grafana/**'
      - 'scripts/validate_dashboards.py'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard-validation:
    # Runner: self-hosted mac fleet (CI cost diet 2026-08-01).
    # stdlib-only python3 validator; the step comment below already
    # documents it was written to be fleet-safe.
    # Hosted minutes bill with a 1-MINUTE-PER-JOB FLOOR, so this sub-minute
    # check costs a full paid minute every run; on the fleet it costs $0.
    # Verified running natively on the fleet host (macOS/BSD userland).
    runs-on: [self-hosted, mac, corelink-builder]
    # Bound the job (CI cost diet 2026-08-01): a self-hosted job with no
    # timeout inherits GitHub's 360-min default, so one wedged run can hold
    # 1 of the 4 `corelink-builder` runners for 6h and stall
    # `scripts/pre-merge-gate-check.sh` (the mandatory merge gate) for every
    # other PR. This check is sub-minute.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # actions/checkout@v7.0.0

      # No actions/setup-python: the self-hosted mac fleet can't reliably
      # provision Python via setup-python (RUNNER_TOOL_CACHE is unset → it
      # falls back to the unwritable /Users/runner hosted path and dies with
      # `mkdir: /Users/runner: Permission denied`). This validator only needs
      # `python3` (stdlib only), which ships on every runner. (2026-06-03)
      - name: Validate dashboards (canonical-12 + structural)
        run: python3 scripts/validate_dashboards.py

      - name: Verify all dashboards parse
        run: |
          python3 -c "
          import json, glob, sys
          ok = True
          for f in sorted(glob.glob('dashboards/grafana/DASH-*.json')):
              try:
                  with open(f) as fh:
                      json.load(fh)
                  print(f'  [OK] {f}')
              except Exception as e:
                  print(f'  [FAIL] {f}: {e}')
                  ok = False
          sys.exit(0 if ok else 1)
          "
