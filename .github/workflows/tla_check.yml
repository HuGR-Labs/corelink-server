name: TLA+ Model Check (Lote 10.11.0-bis-prime cycle 2)

# Runs TLC v1.8.0 SHA-256 pinned (ADR-0042 §A1) sobre specs/tla/*.tla.
# Gates each spec via scripts/run_tlc_corelink.sh which enforces:
#   1. TLC binary SHA-256 supply-chain pin (mandatory por default; opt-out apenas local dev)
#   2. .tla + .cfg presence
#   3. TLC invariant + property check verde
#
# CI block on any spec failure (exit code != 0).

on:
  pull_request:
    paths:
      - 'specs/tla/**'
      - 'scripts/run_tlc_corelink.sh'
      - '.github/workflows/tla_check.yml'
      # S-06 contract trigger surface (Lote 10.6 cycle 2 fix CAP-GC-008):
      - 'crates/corelink-gc/**'              # GC worker implementation
      - 'crates/corelink-storage/**'         # blob_meta + ac_meta schema-touching code
      - 'migrations/**'                      # D1 schema migrations (canonical column names)
      - 'specs/03_architecture/data_model.md'  # canonical schema docs
      - 'specs/03_architecture/invariant_registry.md'  # INV definition changes
      - 'specs/03_architecture/adrs/ADR-0042-gc-worker-scheduler.md'  # TLC bootstrap ceremony
      # S-11 trigger surface
      - 'crates/corelink-privacy-erasure-worker/**'
      - 'crates/corelink-privacy/**'
  push:
    branches: [main]
    paths:
      # Mirror PR trigger surface (Lote 10.6 cycle 4 fix CAP-GC-008: post-merge history
      # must observe same surface as PR gate; codex cycle 3 finding push.main narrower).
      - 'specs/tla/**'
      - 'scripts/run_tlc_corelink.sh'
      - '.github/workflows/tla_check.yml'
      - 'crates/corelink-gc/**'
      - 'crates/corelink-storage/**'
      - 'migrations/**'
      - 'specs/03_architecture/data_model.md'
      - 'specs/03_architecture/invariant_registry.md'
      - 'specs/03_architecture/adrs/ADR-0042-gc-worker-scheduler.md'
      - 'crates/corelink-privacy-erasure-worker/**'
      - 'crates/corelink-privacy/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  tla-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout@v4.3.1

      - name: Setup Java (TLC requires JVM)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # actions/setup-java@v4.8.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install pinned TLC v1.8.0 (SHA-256 verified — ADR-0042 §A1)
        env:
          TLC_VERSION: '1.8.0'
          TLC_SHA256_PINNED: 'd5d07d5dab38ddb840c91ec48fa02f28b37a608d5af9a73570018591dbc8ef7f'
        run: |
          set -euo pipefail
          # Download tla2tools.jar from GitHub Releases per pinned version + verify SHA-256.
          # The runner script (run_tlc_corelink.sh) hashes ${TLC_JAR} when set — this avoids
          # the prior cycle 4 bug where the wrapper SHA was hashed instead of the jar (codex P0).
          mkdir -p "$RUNNER_TEMP/tla"
          curl -fsSL -o "$RUNNER_TEMP/tla/tla2tools.jar" \
            "https://github.com/tlaplus/tlaplus/releases/download/v${TLC_VERSION}/tla2tools.jar"
          ACTUAL_SHA="$(sha256sum "$RUNNER_TEMP/tla/tla2tools.jar" | awk '{print $1}')"
          echo "TLC SHA-256 actual: ${ACTUAL_SHA}"
          echo "TLC SHA-256 expect: ${TLC_SHA256_PINNED}"
          # HARD-FAIL on hash drift (Lote 10.11.0-bis-prime cycle 3: SHA pin é mandatory CI gate
          # per ADR-0042 §A1). Re-pin requires Security review + ADR-0042 §A1 update + Architect sign-off.
          if [[ "${ACTUAL_SHA}" != "${TLC_SHA256_PINNED}" ]]; then
            echo "::error::TLC SHA-256 supply-chain pin violation (ADR-0042 §A1)" >&2
            echo "::error::expected: ${TLC_SHA256_PINNED}" >&2
            echo "::error::actual:   ${ACTUAL_SHA}" >&2
            echo "::error::Re-pin requires Security review + ADR-0042 §A1 update" >&2
            exit 1
          fi
          # Wrapper script: tlc invokes Java + tla2tools.jar.
          # Runner verifies $TLC_JAR (the jar) via SHA-256, not the wrapper itself
          # (Lote 10.11.0-bis-prime cycle 5 fix codex P0: prior cycle hashed wrapper
          # against jar SHA, which would always fail).
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/tlc" <<EOF
          #!/usr/bin/env bash
          exec java -cp "$RUNNER_TEMP/tla/tla2tools.jar" tlc2.TLC "\$@"
          EOF
          chmod +x "$HOME/.local/bin/tlc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "TLC_JAR=$RUNNER_TEMP/tla/tla2tools.jar" >> "$GITHUB_ENV"

      # CI MUST verify TLC SHA-256 pin per ADR-0042 §A1.
      # NOTE: TLC_SHA256_SKIP NOT set — runner enforces mandatory SHA check.
      # Install step above already validated; runner re-validates as defense-in-depth.

      - name: TLC verify dsr_erasure_atomicity (S-11 WI-S11-008)
        run: bash scripts/run_tlc_corelink.sh dsr_erasure_atomicity

      - name: TLC verify tenant_isolation (S-02 cross-tenant)
        run: bash scripts/run_tlc_corelink.sh tenant_isolation

      - name: TLC verify gc_correctness (S-06)
        run: bash scripts/run_tlc_corelink.sh gc_correctness

      - name: TLC verify cas_integrity (S-04)
        run: bash scripts/run_tlc_corelink.sh cas_integrity

      - name: TLC verify audit_immutability (S-09)
        run: bash scripts/run_tlc_corelink.sh audit_immutability

      - name: TLC verify auth_revocation (R-PREP 2026-05-15; auth-revocation cluster)
        # Added by `specs/_audits/2026-05-15-tla-coverage-audit.md` closing the
        # 3 CRITICAL gaps (INV-AUTH-REVOCATION-IDEMPOTENT, INV-AUTH-REVOCATION-
        # SLO-60S, INV-AUTH-MASS-REVOKE-ATOMIC) + 1 HIGH (INV-AUTH-PROPAGATION-
        # AT-LEAST-ONCE) per invariant_registry.md §3.14 obligation matrix.
        run: bash scripts/run_tlc_corelink.sh auth_revocation

      - name: TLC verify auth_pat_hybrid (DEBT-014 FT-1)
        # Added by DEBT-014 dispatch 2026-05-15 closing FT-1
        # (`specs/_audits/tla-followup-tickets.md`): proves the PAT verify
        # hybrid path short-circuits BEFORE DB hit on HMAC mismatch.
        # Closes INV-AUTH-PAT-HMAC-SIG-VERIFIED (CRITICAL) +
        # INV-AUTH-PAT-VERIFY-CONSTANT-TIME + INV-AUTH-PAT-HASH-ARGON2ID-2024.
        run: bash scripts/run_tlc_corelink.sh auth_pat_hybrid

      - name: TLC verify auth_pat_revoke (Wave-24 R-PREP — INV-PAT-REVOKE-PROPAGATION)
        # Added by Wave-24 R-PREP dispatch 2026-05-16
        # (`specs/_audits/2026-05-16-auth-pat-revoke-tla.md`): closes the
        # Wave-23 INV-DRAFT sweep CRITICAL PLANNED obligation
        # INV-PAT-REVOKE-PROPAGATION (registry §3.28). Proves the verify
        # path short-circuits to 401 on a revoked SoT regardless of region
        # cache propagation lag ("no edge cache lookahead") + audit row
        # durable BEFORE 204 response + idempotent retry collapse.
        # Sibling of auth_pat_hybrid.tla (mint side); disjoint from
        # auth_revocation.tla (queue side).
        run: bash scripts/run_tlc_corelink.sh auth_pat_revoke

      - name: TLC verify key_lifecycle (DEBT-014 FT-2)
        # Added by DEBT-014 dispatch 2026-05-15 closing FT-2. Per-asset
        # rotation state machine with overlap window. Closes INV-KEY-NO-SKIP,
        # INV-KEY-OVERLAP, INV-ADMIN-DUAL-APPROVAL (HIGH × 3) +
        # INV-KEY-AUDIT (inherited).
        run: bash scripts/run_tlc_corelink.sh key_lifecycle

      - name: TLC verify gc_lock_protocol (DEBT-014 FT-5)
        # Added by DEBT-014 dispatch 2026-05-15 closing FT-5. Distributed
        # lock protocol singleton-per-(tenant,region) under leader handoff
        # + DO crash + reconcile sweep. Closes INV-GC-SINGLE-RUNNING-PER-
        # TENANT-REGION (HIGH) + INV-GC-RECONCILE-AUDIT-FAIL-CLOSED
        # (CRITICAL, inherited from audit_immutability append-only chain).
        run: bash scripts/run_tlc_corelink.sh gc_lock_protocol

      - name: TLC verify multipart_finalize (DEBT-014 FT-6)
        # Added by DEBT-014 dispatch 2026-05-16 closing FT-6. Multipart
        # session state machine live -> {finalized, aborted} with
        # concurrent abort+finalize race + idempotent re-finalize.
        # Closes INV-MULTIPART-FINALIZE-IRREVOCABLE,
        # INV-MULTIPART-STATE-MONOTONIC,
        # INV-MULTIPART-CONCURRENCY-BOUNDED (HIGH × 3).
        run: bash scripts/run_tlc_corelink.sh multipart_finalize

      - name: TLC verify byok_dek_race (DEBT-014 FT-7)
        # Added by DEBT-014 dispatch 2026-05-16 closing FT-7 (CRITICAL
        # upgrade). Per-region DEK cache eviction race across regions
        # when KMS is revoked — lifts the runbook spec's single-cache
        # abstraction. Closes INV-BYOK-CRYPTO-SOVEREIGNTY (CRITICAL).
        run: bash scripts/run_tlc_corelink.sh byok_dek_race

      - name: TLC verify signup_resignup (DEBT-014 FT-9)
        # Added by DEBT-014 dispatch 2026-05-16 closing FT-9. Extends the
        # signup_atomic runbook with explicit ReSignupSameEmail action +
        # late Stripe webhook arrival. Closes INV-SIGNUP-RESIGNUP-
        # IDEMPOTENT (HIGH) + inherits INV-ONBOARD-DPA-FIRST.
        run: bash scripts/run_tlc_corelink.sh signup_resignup

      - name: TLC verify signup_token_idempotent (Wave-30 R-PREP — INV-SIGNUP-TOKEN-IDEMPOTENT)
        # Added by Wave-30 stream-4 R-PREP dispatch 2026-05-16
        # (`specs/_audits/2026-05-16-inv-signup-token-tla.md`): promotes the
        # wave-29 stream-10 closure §6.2 DRAFT candidate to PROMOTED +
        # TLA-VERIFIED. Proves the pilot signup route (POST /v1/signup/
        # pilot/{token}, wave-29 stream-1 commit b3c359f) exhibits
        # exactly-once tenant allocation per email AND per token (any
        # replay returns the original tenant_id + emits a `duplicate`-
        # tagged audit row, never a second `reserved`). Sibling of
        # signup_resignup.tla (production-onboarding path with Stripe
        # webhook + DPA-first) and disjoint from it; inherits the
        # audit_emit_atomic.tla atomic-pairing pattern.
        run: bash scripts/run_tlc_corelink.sh signup_token_idempotent
      # DEBT-005 batch 1 (5 net-new TLA specs, 2026-05-15) — close 5 CRITICAL
      # gaps from canonical-consistency baseline §4 (critical_no_tla 40 → 35).
      - name: TLC verify auth_jwt_validation (DEBT-005 batch 1)
        run: bash scripts/run_tlc_corelink.sh auth_jwt_validation

      - name: TLC verify tenant_ctx_propagation (DEBT-005 batch 1)
        run: bash scripts/run_tlc_corelink.sh tenant_ctx_propagation

      - name: TLC verify merkle_integrity (DEBT-005 batch 1)
        run: bash scripts/run_tlc_corelink.sh merkle_integrity

      - name: TLC verify byok_envelope_aad (DEBT-005 batch 1)
        run: bash scripts/run_tlc_corelink.sh byok_envelope_aad

      - name: TLC verify failover_no_split_brain (DEBT-005 batch 1)
        run: bash scripts/run_tlc_corelink.sh failover_no_split_brain

      # DEBT-005 batch 2 (5 net-new TLA specs, 2026-05-15) — close 5 more
      # CRITICAL gaps from canonical-consistency baseline §4 (critical_no_tla
      # 35 → 30). Covers INV-ROLLOUT-COSIGN-GATE + INV-SUPPLY-SIGNED-DEPLOY +
      # INV-BACKUP-RESTORE-EPHEMERAL + INV-GC-SWEEP-AUDIT-FAIL-CLOSED +
      # INV-GC-RECONCILE-AUDIT-FAIL-CLOSED + INV-AC-EVICT-REGION-PINNED +
      # INV-AC-EVICT-TENANT-SCOPED + INV-AUDIT-EMIT-ATOMIC-WITH-HANDLER.
      - name: TLC verify rollout_cosign_gate (DEBT-005 batch 2)
        run: bash scripts/run_tlc_corelink.sh rollout_cosign_gate

      - name: TLC verify backup_restore_ephemeral (DEBT-005 batch 2)
        run: bash scripts/run_tlc_corelink.sh backup_restore_ephemeral

      - name: TLC verify gc_sweep_audit_fail_closed (DEBT-005 batch 2)
        run: bash scripts/run_tlc_corelink.sh gc_sweep_audit_fail_closed

      - name: TLC verify ac_eviction_isolation (DEBT-005 batch 2)
        run: bash scripts/run_tlc_corelink.sh ac_eviction_isolation

      - name: TLC verify audit_emit_atomic (DEBT-005 batch 2)
        run: bash scripts/run_tlc_corelink.sh audit_emit_atomic

      # DEBT-005 batch 3 (5 net-new TLA specs, 2026-05-15) — close 8 more
      # CRITICAL/HIGH INV-granularity gaps from canonical-consistency
      # baseline §4 (critical_no_tla 34 → 26; tla_verified 33 → 49).
      # Covers INV-OBS-NO-PII + INV-OFFBOARDING-AUDIT-COMPLETE +
      # INV-OFFBOARDING-GRACE-RESPECTED + INV-BILLING-CHAIN-INTEGRITY +
      # INV-GC-GRACE-BOUNDARY-STRICT + INV-GC-MARK-TENANT-SCOPED +
      # INV-GC-SWEEP-TENANT-SCOPED + INV-BACKUP-FRESH +
      # INV-BACKUP-INTEGRITY-SAMPLE-CAP.
      - name: TLC verify obs_no_pii (DEBT-005 batch 3)
        run: bash scripts/run_tlc_corelink.sh obs_no_pii

      - name: TLC verify offboarding_audit_complete (DEBT-005 batch 3)
        run: bash scripts/run_tlc_corelink.sh offboarding_audit_complete

      - name: TLC verify billing_chain_integrity (DEBT-005 batch 3)
        run: bash scripts/run_tlc_corelink.sh billing_chain_integrity

      - name: TLC verify gc_grace_boundary (DEBT-005 batch 3)
        run: bash scripts/run_tlc_corelink.sh gc_grace_boundary

      - name: TLC verify backup_fresh (DEBT-005 batch 3)
        run: bash scripts/run_tlc_corelink.sh backup_fresh

      # DEBT-005 batch 4 (5 net-new TLA specs, 2026-05-15) — close 10 more
      # CRITICAL INV-granularity gaps from canonical-consistency baseline
      # §4 (critical_no_tla 26 → 16; tla_verified 49 → 59).
      # Covers INV-AC-DIGEST-SIGNED + INV-AC-MERKLE-DETERMINISTIC +
      # INV-AC-TENANT-SCOPED + INV-AUTH-WEBAUTHN-ORIGIN-EXACT +
      # INV-AUTH-WEBAUTHN-RP-ID-CANONICAL + INV-DIGEST-VERIFICATION +
      # INV-GC-MARK-STARTED-AT-ATOMIC + INV-GC-MARK-STARTED-AT-IMMUTABLE +
      # INV-MULTIPART-CHUNK-DETERMINISTIC + INV-MULTIPART-PATH-TENANT-SCOPED.
      - name: TLC verify ac_integrity (DEBT-005 batch 4)
        run: bash scripts/run_tlc_corelink.sh ac_integrity

      - name: TLC verify webauthn_origin (DEBT-005 batch 4)
        run: bash scripts/run_tlc_corelink.sh webauthn_origin

      - name: TLC verify digest_verification (DEBT-005 batch 4)
        run: bash scripts/run_tlc_corelink.sh digest_verification

      - name: TLC verify gc_mark_started_at (DEBT-005 batch 4)
        run: bash scripts/run_tlc_corelink.sh gc_mark_started_at

      - name: TLC verify multipart_determinism (DEBT-005 batch 4)
        run: bash scripts/run_tlc_corelink.sh multipart_determinism

      # DEBT-005 batch 5 (5 net-new TLA specs, 2026-05-15) — close further
      # CRITICAL INV-granularity gaps from canonical-consistency baseline
      # §4 (critical_no_tla 16 → 6; tla_verified 59 → 71).
      # Covers INV-AUDIT-NO-RAW-PII + INV-NO-PII-IN-LOGS +
      # INV-NO-BODY-IN-LOGS + INV-AUTH-PAT-PLAINTEXT-NEVER-PERSISTED +
      # INV-AUTH-WEBAUTHN-UV-REQUIRED-ADMIN +
      # INV-AUTH-WEBAUTHN-ATTESTATION-VERIFIED + INV-CAS-IMMUTABILITY +
      # INV-CAS-IDEMPOTENCY + INV-CAS-CORRECTNESS +
      # INV-AUTH-SCHEMA-RLS-DEFAULT-ON + INV-AUTH-PII-ENCRYPTED.
      - name: TLC verify audit_no_raw_pii (DEBT-005 batch 5)
        run: bash scripts/run_tlc_corelink.sh audit_no_raw_pii

      - name: TLC verify auth_pat_plaintext_never_persisted (DEBT-005 batch 5)
        run: bash scripts/run_tlc_corelink.sh auth_pat_plaintext_never_persisted

      - name: TLC verify auth_webauthn_uv_admin (DEBT-005 batch 5)
        run: bash scripts/run_tlc_corelink.sh auth_webauthn_uv_admin

      - name: TLC verify cas_immutability (DEBT-005 batch 5)
        run: bash scripts/run_tlc_corelink.sh cas_immutability

      - name: TLC verify auth_schema_rls_default_on (DEBT-005 batch 5)
        run: bash scripts/run_tlc_corelink.sh auth_schema_rls_default_on

      # DEBT-005 batch 6 FINAL (5 net-new TLA specs, 2026-05-15) — closes the
      # last 5 CRITICAL INV-no-TLA gaps from canonical-consistency baseline
      # §4 (critical_no_tla 5 → 0; tla_verified 71 → 76). DEBT-005 SEALED.
      # Covers INV-AUTH-AUDIT-PSEUDONYMIZATION + INV-AUTH-CONSTANT-TIME-COLD-PAD +
      # INV-CONSENT-PROOF-VERIFIABLE + INV-GC-REACHABLE-SET-COMPLETE +
      # INV-SUB-PROCESSOR-AUDIT-FAIL-CLOSED.
      - name: TLC verify auth_audit_pseudonymization (DEBT-005 batch 6 FINAL)
        run: bash scripts/run_tlc_corelink.sh auth_audit_pseudonymization

      - name: TLC verify auth_constant_time_cold_pad (DEBT-005 batch 6 FINAL)
        run: bash scripts/run_tlc_corelink.sh auth_constant_time_cold_pad

      - name: TLC verify consent_proof_verifiable (DEBT-005 batch 6 FINAL)
        run: bash scripts/run_tlc_corelink.sh consent_proof_verifiable

      - name: TLC verify gc_reachable_set_complete (DEBT-005 batch 6 FINAL)
        run: bash scripts/run_tlc_corelink.sh gc_reachable_set_complete

      - name: TLC verify sub_processor_audit_fail_closed (DEBT-005 batch 6 FINAL)
        run: bash scripts/run_tlc_corelink.sh sub_processor_audit_fail_closed
