name: TLA+ Model Check (Lote 10.11.0-bis-prime cycle 2)

# Runs TLC v1.8.0 SHA-256 pinned (ADR-0042 §A1) over every .tla in the runner's
# SPEC_DIRS via scripts/run_tla_suite.sh, which discovers each spec, bounds it
# with its own timeout, and reconciles failures against specs/tla/QUARANTINE.md.
#
# This is the ONLY TLA+ gate. The four per-spec workflows that used to sit beside
# it were retired on 2026-08-02 as exact duplicates.
#
# CI blocks on any non-quarantined spec failure, on a quarantined spec that has
# started passing, and on a spec with no .cfg.

on:
  # PR trigger restored 2026-08-02, PATH-SCOPED.
  #
  # It was removed twice for two different reasons, and both are now addressed:
  #   - 2026-06-02, cost: this was a heavy per-PR gate on the self-hosted mac
  #     fleet. Still true in general — which is why this trigger fires only on
  #     PRs that touch the specs, the runner, or this workflow. The .tla files
  #     change on the order of months, so for almost every PR this costs nothing.
  #   - 2026-08-02, honesty: the gate had 0 successes in 195 runs (the TLC pin
  #     was stale AND 44 serial steps shared one 30-minute budget behind a
  #     non-terminating spec). A PR trigger then would have blocked every pull
  #     request while proving nothing. The pin was re-pinned in ADR-0042 §A1 and
  #     the suite now verifies 44 specs in ~5 minutes.
  #
  # The scheduled run stays: it covers a spec breaking because the TLC jar or
  # the runner environment changed underneath us, which no path filter can see.
  pull_request:
    paths:
      - 'specs/tla/**'
      - 'specs/03_architecture/tla+/runbooks/**'
      - 'scripts/run_tla_suite.sh'
      - 'scripts/run_tlc_corelink.sh'
      - '.github/workflows/tla_check.yml'
  # ⛔ CRON REMOVED 2026-08-02 — redundant: this workflow already has a
  # `pull_request` trigger, so the code IS verified when it changes. The
  # nightly re-verified BYTE-IDENTICAL code: 10 of the last 14 days had
  # ZERO commits to main, and the self-hosted Mac (the founder's own
  # machine) was spending ~8.8 h/day on scheduled jobs, 75% of which
  # failed. A clock only earns its keep when something can change
  # WITHOUT a commit — CVE feeds, prod state, backups, certs. This
  # workflow is none of those.
  # Restore by uncommenting if this ever stops being PR-gated.
  # # CI cost diet 2026-08-02: daily -> WEEKLY. TLA+ model check — the .tla specs change on the order of months.
  # # Kept the same minute/hour (spread out, low-traffic window); only the
  # # weekday field is added. Per-PR gating is unchanged.
  # - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  tla-check:
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # actions/checkout@v7.0.0

      - name: Setup Java (TLC requires JVM)
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95  # actions/setup-java@v5.6.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install pinned TLC v1.8.0 (SHA-256 verified — ADR-0042 §A1)
        env:
          TLC_VERSION: '1.8.0'
          TLC_SHA256_PINNED: 'e22f8ffb4bacdea0a871f444dd94fe5fb0d8013b3388ae39e82e26f852c735d5'
        run: |
          set -euo pipefail
          # Download tla2tools.jar from GitHub Releases per pinned version + verify SHA-256.
          # The runner script (run_tlc_corelink.sh) hashes ${TLC_JAR} when set — this avoids
          # the prior cycle 4 bug where the wrapper SHA was hashed instead of the jar (codex P0).
          mkdir -p "$RUNNER_TEMP/tla"
          curl -fsSL -o "$RUNNER_TEMP/tla/tla2tools.jar" \
            "https://github.com/tlaplus/tlaplus/releases/download/v${TLC_VERSION}/tla2tools.jar"
          ACTUAL_SHA="$(sha256sum "$RUNNER_TEMP/tla/tla2tools.jar" | awk '{print $1}')"
          echo "TLC SHA-256 actual: ${ACTUAL_SHA}"
          echo "TLC SHA-256 expect: ${TLC_SHA256_PINNED}"
          # HARD-FAIL on hash drift (Lote 10.11.0-bis-prime cycle 3: SHA pin é mandatory CI gate
          # per ADR-0042 §A1). Re-pin requires Security review + ADR-0042 §A1 update + Architect sign-off.
          if [[ "${ACTUAL_SHA}" != "${TLC_SHA256_PINNED}" ]]; then
            echo "::error::TLC SHA-256 supply-chain pin violation (ADR-0042 §A1)" >&2
            echo "::error::expected: ${TLC_SHA256_PINNED}" >&2
            echo "::error::actual:   ${ACTUAL_SHA}" >&2
            echo "::error::Re-pin requires Security review + ADR-0042 §A1 update" >&2
            exit 1
          fi
          # Wrapper script: tlc invokes Java + tla2tools.jar.
          # Runner verifies $TLC_JAR (the jar) via SHA-256, not the wrapper itself
          # (Lote 10.11.0-bis-prime cycle 5 fix codex P0: prior cycle hashed wrapper
          # against jar SHA, which would always fail).
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/tlc" <<EOF
          #!/usr/bin/env bash
          exec java -cp "$RUNNER_TEMP/tla/tla2tools.jar" tlc2.TLC "\$@"
          EOF
          chmod +x "$HOME/.local/bin/tlc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "TLC_JAR=$RUNNER_TEMP/tla/tla2tools.jar" >> "$GITHUB_ENV"

      # One runner over the whole directory, replacing 44 hand-maintained steps.
      #
      # The step list was why this gate had 0 successes in 195 runs: 44 steps
      # shared ONE 30-minute budget, and the spec listed first
      # (`dsr_erasure_atomicity`) does not terminate at its current bounds — so it
      # consumed the entire budget and the other 43 were skipped on every run. The
      # gate appeared scheduled and verified nothing.
      #
      # The list had also drifted: `replica_failover` was in no workflow at all.
      # Discovery removes that class of gap for every directory in the runner's
      # SPEC_DIRS — which is TWO, not one: `specs/tla/` (47 specs) and
      # `specs/03_architecture/tla+/runbooks/` (4). The second was reachable only
      # through a separate weekly workflow until 2026-08-02; it runs here now, and
      # the four sibling per-spec workflows (billing / dsr-erasure /
      # region-residency / runbooks) were retired, because each ran the SAME specs
      # through the SAME .cfg files — four extra self-hosted mac jobs a week to
      # duplicate this one, three of them chronically red.
      #
      # Per-spec timeout so one runaway cannot starve the suite. 300 s is ~3x the
      # slowest passing spec measured (`sub_processor_audit_fail_closed`, 98 s at
      # -workers 2) — enough headroom that CI contention cannot turn a pass into
      # a flake, tight enough that a genuinely diverging spec is caught fast.
      # Quarantined specs get a smaller budget (see the runner) so the two that
      # provably diverge do not burn 300 s each re-proving a measured fact.
      - name: TLA+ suite (discovery + per-spec timeout + honest quarantine)
        run: bash scripts/run_tla_suite.sh --timeout 300 --workers 2
