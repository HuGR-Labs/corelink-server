# PR-blocking rustfmt gate (weld-the-door).
#
# The per-crate lanes (corelink-server.yml etc.) run `cargo fmt` only under a
# `paths:` filter + nightly, so formatting drift on an un-filtered path merged
# to main unnoticed (17 files were dirty on main when this gate was added). This
# lane runs `cargo fmt --all --check` over the WHOLE workspace on every PR that
# can possibly change the formatted surface, so no formatting drift can land
# again. It is fast (fmt needs no build) and its ONLY job is the format check,
# so it stays green in seconds.
#
# `paths:` (CI cost diet 2026-08-01): the door stays welded, but ONLY because
# the filter below is the COMPLETE input surface of `cargo fmt --all --check`,
# not a convenient subset. That verdict depends on four inputs, all filtered:
#   1. Rust source                -> `**.rs`
#   2. the rustfmt config         -> `**rustfmt.toml`  (also matches
#                                    `.rustfmt.toml`, at any depth INCLUDING
#                                    the repo root — the repo has none today,
#                                    so a future one must still trigger this)
#   3. the workspace member list AND `edition`, both of which `cargo fmt --all`
#      reads and `edition` of which CHANGES the formatting rules
#                                 -> `**Cargo.toml`   (root + every member)
#   4. the rustfmt VERSION, pinned by the toolchain file
#                                 -> `rust-toolchain.toml`
# NOTE the glob form: GitHub's `paths:` `**/` requires at least one slash, so
# `**/*.rs` / `**/rustfmt.toml` / `**/Cargo.toml` would MISS a root-level file.
# `**.rs` / `**rustfmt.toml` / `**Cargo.toml` is the form GitHub documents for
# "any depth, including the root" — the same form `mutation-pr.yml` uses.
# (The original "no paths: filter" wording was aimed at per-CRATE path lists,
# which DO leave un-filtered Rust paths uncovered; this filter does not.)
# What this buys: the job installs a Rust toolchain before it can run, so every
# docs-only, spec-only or workflow-only PR was paying a hosted minute to
# format-check a tree with no Rust in the diff (~110 runs/month measured).
name: rustfmt

on:
  pull_request:
    paths:
      - '**.rs'
      - '**rustfmt.toml'
      - '**Cargo.toml'
      - 'rust-toolchain.toml'
      - '.github/workflows/rustfmt.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustfmt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: cargo fmt --all --check
    # Runner: `corelink` — the product's own ephemeral runner fabric (wave 2 of
    # the migration off GitHub-hosted runners, 2026-08-03; wave 1 moved gitleaks
    # + trivy). This lane is the cheapest possible tenant of that fabric: it
    # never compiles, so it holds a box for well under a minute.
    #
    # ⚠️ Ephemeral-runner reality — a box is minted per job and destroyed after,
    # so nothing is cached between runs. This job cached nothing to begin with.
    # The real exposure is the opposite one: if the fabric refuses or drops the
    # spawn, the job sits QUEUED, and `timeout-minutes` does NOT apply to queued
    # time (it starts counting once a job is RUNNING). GitHub cancels a job left
    # queued for 24 h. That is a stall, not a false pass:
    # `scripts/pre-merge-gate-check.sh` scores a pending check as ⛔ DO NOT MERGE
    # (`order = {"fail": 0, "cancel": 0, "pending": 1, …}`), so a stranded box
    # blocks the PR rather than waving it through.
    runs-on: corelink
    # Bound the job: a job with no timeout inherits GitHub's 360-min default, so
    # one wedged run can burn 6h. Measured runs are under a minute; generous.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # actions/checkout@v7.0.0

      # `dtolnay/rust-toolchain` was REMOVED here, and that is a no-op for what
      # this gate checks — not a shortcut. It requested `stable` + the `rustfmt`
      # component, but `rust-toolchain.toml` pins channel 1.91.1 WITH rustfmt in
      # its `components` list, and rustup's shims honour that file over any
      # `rustup default`. So `cargo fmt` has always run 1.91.1's rustfmt on this
      # lane, on hosted runners too; the action's `stable` never reached it. What
      # changes is only that an ephemeral box no longer re-downloads an unused
      # toolchain on every run. The step below now PROVES the pinned rustfmt is
      # the one doing the checking — a guarantee this lane did not have before.
      - name: Assert the workspace-pinned toolchain (rust-toolchain.toml)
        run: bash scripts/ci-assert-pinned-toolchain.sh

      - name: cargo fmt --all --check
        run: cargo fmt --all --check
