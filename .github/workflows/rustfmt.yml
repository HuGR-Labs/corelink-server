# PR-blocking rustfmt gate (weld-the-door).
#
# The per-crate lanes (corelink-server.yml etc.) run `cargo fmt` only under a
# `paths:` filter + nightly, so formatting drift on an un-filtered path merged
# to main unnoticed (17 files were dirty on main when this gate was added). This
# lane runs `cargo fmt --all --check` over the WHOLE workspace on every PR that
# can possibly change the formatted surface, so no formatting drift can land
# again. It is fast (fmt needs no build) and its ONLY job is the format check,
# so it stays green in seconds.
#
# The check runs for every pull request so the required status is always
# reported, including for docs-only and workflow-only changes. The formatting
# command still evaluates the whole workspace. Its verdict depends on four
# inputs:
#   1. Rust source                -> `**.rs`
#   2. the rustfmt config         -> `**rustfmt.toml`  (also matches
#                                    `.rustfmt.toml`, at any depth INCLUDING
#                                    the repo root — the repo has none today,
#                                    so a future one must still trigger this)
#   3. the workspace member list AND `edition`, both of which `cargo fmt --all`
#      reads and `edition` of which CHANGES the formatting rules
#                                 -> `**Cargo.toml`   (root + every member)
#   4. the rustfmt VERSION, pinned by the toolchain file
#                                 -> `rust-toolchain.toml`
# The push trigger remains path-filtered because branch protection applies to
# pull requests; every pull request must emit this required context.
name: rustfmt

on:
  # PUSH on main as well as PR (2026-08-29). The PR-only trigger left a hole
  # that was not theoretical: #1406 — titled "apply cargo fmt --all to fix
  # rustfmt CI gate" — merged the INVERSE of correct formatting while red, and
  # `main` then sat rustfmt-red with nothing to report it. The next PR author
  # inherits a red gate they did not cause. This is not a cron (CLAUDE.md's rule
  # stands: formatting changes only when code changes), it is the push half of
  # the same trigger, on the same `paths:` filter.
  push:
    branches: [main]
    paths:
      - '**.rs'
      - '**rustfmt.toml'  # path-filter-allow: mirrors the pull_request filter below
      - '**Cargo.toml'
      - 'rust-toolchain.toml'
      - '.github/workflows/rustfmt.yml'
  pull_request:
    # Keep the required context present for docs-only and workflow-only PRs.
    paths:
      - '**'
      - '**.rs'
      - '**rustfmt.toml'  # path-filter-allow: repo has no rustfmt.toml today; a future one MUST trigger fmt
      - '**Cargo.toml'
      - 'rust-toolchain.toml'
      - '.github/workflows/rustfmt.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustfmt-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: cargo fmt --all --check
    # Formatting is CPU-light and self-contained; use a hosted runner so the
    # required context cannot queue behind the local runner fleet.
    #
    runs-on: ubuntu-latest
    # Bound the job; measured runs are under a minute.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # actions/checkout@v7.0.0

      # `dtolnay/rust-toolchain` was REMOVED here, and that is a no-op for what
      # this gate checks — not a shortcut. It requested `stable` + the `rustfmt`
      # component, but `rust-toolchain.toml` pins channel 1.91.1 WITH rustfmt in
      # its `components` list, and rustup's shims honour that file over any
      # `rustup default`. So `cargo fmt` has always run 1.91.1's rustfmt on this
      # lane, on hosted runners too; the action's `stable` never reached it. What
      # changes is only that an ephemeral box no longer re-downloads an unused
      # toolchain on every run. The step below now PROVES the pinned rustfmt is
      # the one doing the checking — a guarantee this lane did not have before.
      - name: Assert the workspace-pinned toolchain (rust-toolchain.toml)
        run: bash scripts/ci-assert-pinned-toolchain.sh

      - name: cargo fmt --all --check
        run: cargo fmt --all --check
