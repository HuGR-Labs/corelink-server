# PR-blocking rustfmt gate (weld-the-door).
#
# The per-crate lanes (corelink-server.yml etc.) run `cargo fmt` only under a
# `paths:` filter + nightly, so formatting drift on an un-filtered path merged
# to main unnoticed (17 files were dirty on main when this gate was added). This
# lane runs `cargo fmt --all --check` over the WHOLE workspace on every PR that
# can possibly change the formatted surface, so no formatting drift can land
# again. It is fast (fmt needs no build) and its ONLY job is the format check,
# so it stays green in seconds.
#
# `paths:` (CI cost diet 2026-08-01): the door stays welded. `cargo fmt --check`
# reads exactly two kinds of input — Rust source and the rustfmt config — so a
# PR that touches NEITHER is provably incapable of changing this gate's verdict,
# and the filter below is the whole input surface, not a subset of it (the
# original "no paths: filter" wording was aimed at per-CRATE path lists, which
# DO leave un-filtered Rust paths uncovered; `**/*.rs` does not). What this buys:
# the job installs a Rust toolchain before it can run, so every docs-only,
# spec-only or workflow-only PR was paying ~2 hosted minutes to format-check a
# tree with no Rust in the diff.
name: rustfmt

on:
  pull_request:
    paths:
      - '**/*.rs'
      - '**/rustfmt.toml'
      - '**/.rustfmt.toml'
      - '.github/workflows/rustfmt.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustfmt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: cargo fmt --all --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # actions/checkout@v7.0.0

      - name: Install Rust toolchain (stable + rustfmt)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # dtolnay/rust-toolchain@stable@2026-05-15
        with:
          components: rustfmt

      - name: cargo fmt --all --check
        run: cargo fmt --all --check
