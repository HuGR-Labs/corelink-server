name: changelog-validate

# Enforces that every PR carrying a `feat:` or `fix:` Conventional Commit
# records its change — EITHER by adding a `changelog.d/<pr>-<slug>.md` fragment
# (preferred; a new file per PR cannot conflict with another PR's new file) OR
# by the legacy route of touching `CHANGELOG.md` under the `[Unreleased]`
# section. Dual acceptance is deliberate and stays until the in-flight merge
# queue drains: on 2026-08-29, 10 of the 13 open PRs (#1389 #1393 #1395 #1396
# #1398 #1399 #1400 #1402 #1410 #1412) edited CHANGELOG.md, and a fragment-only
# gate would turn all ten red. `scripts/assemble_changelog.py` splices the
# fragments back into `## [Unreleased]` at release time.
#
# The legacy half additionally asserts that it adds
# EXACTLY ONE entry for the change, not two. Prevents (a) the common drift
# where the changelog falls behind the actual feature/bug trajectory, and
# (b) the rebase-duplication observed on PR #955 (2026-08-01): a
# `1 insertion(+), 1 deletion(-)` CHANGELOG commit silently became
# insertion-only when upstream moved the context the deletion was anchored to,
# leaving BOTH the stale entry and its replacement — with the stale one still
# asserting what the replacement was written to retract. This job was green
# throughout, because "has an entry" was the only assertion it made.
# The duplicate half lives in `scripts/check_changelog_duplicates.py`. It links
# entries on THREE independent signals — lead-prefix, body-shingle containment,
# and cited-evidence containment — because a retraction rewrites the lead, so a
# lead-only check is weakest exactly where the duplicate is most dangerous (a
# corrected entry whose stale predecessor asserts something false). Findings are
# reported as transitive-closure GROUPS with a redundant-entry count, never as
# raw pairs. All three thresholds are justified there against the measured
# corpus (the empty band between honest siblings and real duplicates).
#
# Implements: WI-S20-008 (release engineering) + Keep-A-Changelog v1.1.0
# Reference : https://keepachangelog.com/en/1.1.0/
#
# SHA-pinned per ADR-S12-045 §6 tooling-pin policy.
# Version bump requires Security review (sibling of cargo-audit policy).

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog-required:
    name: CHANGELOG.md updated when feat/fix present
    # Runner: GitHub-hosted ubuntu-latest (wave 3 migration from corelink fabric).
    # Pure git + stdlib-python3 diff parse; sub-minute check.
    runs-on: ubuntu-latest
    # Bound the job: a self-hosted job with no timeout inherits GitHub's 360-min
    # default, so one wedged run can hold a runner for 6h and stall
    # `scripts/pre-merge-gate-check.sh` (the mandatory merge gate) for every
    # other PR. This check is sub-minute.
    timeout-minutes: 5
    steps:
      - name: Checkout (full history; needed to diff against base ref)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Detect feat/fix commits in PR range
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          echo "diff range: ${BASE}..${HEAD}"

          # Look for Conventional Commit prefixes in the subject lines.
          # `feat:` and `fix:` (with optional scope `(...)` and breaking `!`)
          # are the two prefixes that REQUIRE a CHANGELOG entry per
          # Keep-A-Changelog v1.1.0.
          FEAT_FIX_COMMITS=$(git log --format='%s' "${BASE}..${HEAD}" \
            | grep -E '^(feat|fix)(\([^)]+\))?!?:' || true)

          if [[ -z "$FEAT_FIX_COMMITS" ]]; then
            echo "no feat:/fix: commits — CHANGELOG update not required"
            echo "required=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "feat:/fix: commits detected:"
          echo "$FEAT_FIX_COMMITS"
          echo "required=true" >> "$GITHUB_OUTPUT"

      - name: Detect changelog.d/ fragment added by this PR
        id: fragment
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          # A fragment is an ADDED (`--diff-filter=A`) `.md` file under
          # `changelog.d/`. Modifying an existing fragment is not a new entry,
          # and `changelog.d/README.md` documents the mechanism rather than
          # recording a change, so neither satisfies the gate.
          #
          # `git diff --name-only` is asked for the single pathspec directly and
          # its output captured, NOT piped into `grep -q`: under `pipefail` the
          # quiet-grep idiom inverts (grep exits at the first match, git takes
          # SIGPIPE 141, the pipeline reports failure) exactly on the large PRs
          # whose name list outruns the 64 KiB pipe buffer. Same defect the
          # legacy step below documents from PR #1271.
          ADDED=$(git diff --name-only --diff-filter=A "${BASE}..${HEAD}" \
                    -- 'changelog.d/*.md')
          ADDED=$(printf '%s\n' "$ADDED" | grep -v '^changelog.d/README.md$' || true)
          ADDED=$(printf '%s\n' "$ADDED" | grep -v '^[[:space:]]*$' || true)

          if [[ -z "$ADDED" ]]; then
            echo "no new changelog.d/ fragment in this PR"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changelog fragment(s) added:"
          echo "$ADDED"
          echo "present=true" >> "$GITHUB_OUTPUT"
          {
            echo "paths<<EOF"
            echo "$ADDED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Validate changelog fragment format
        # Runs whenever a fragment is added, feat:/fix: or not. A malformed
        # fragment that is never linted is a silently-dropped changelog entry —
        # the same drift this whole workflow exists to prevent, moved one file
        # sideways.
        if: steps.fragment.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Word-split intentionally: one path per line from the step output.
          # shellcheck disable=SC2046
          python3 scripts/assemble_changelog.py --lint $(printf '%s\n' "${{ steps.fragment.outputs.paths }}")

      # ---------------------------------------------------------------------
      # DUAL ACCEPTANCE (transition, 2026-08-29).
      # A feat:/fix: PR satisfies the changelog requirement with EITHER a new
      # `changelog.d/` fragment (preferred, conflict-free) OR the legacy
      # `## [Unreleased]` entry in CHANGELOG.md. The legacy check below is
      # therefore skipped — and only skipped — when a fragment is present.
      # Both halves stay live until the in-flight queue drains: 10 of the 13
      # open PRs on 2026-08-29 carry a CHANGELOG.md edit and would break under
      # a fragment-only gate.
      # ---------------------------------------------------------------------
      - name: Verify CHANGELOG.md is touched under [Unreleased]
        if: steps.detect.outputs.required == 'true' && steps.fragment.outputs.present != 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          # 1. CHANGELOG.md must appear in the PR diff.
          #    Ask git for the single path directly instead of piping the whole
          #    name list into `grep -q`. Under `set -o pipefail` that idiom is
          #    inverted: `grep -q` exits at the FIRST match, `git diff` — still
          #    writing the remaining names — takes SIGPIPE and exits 141, and
          #    pipefail reports the whole pipeline as failed. The `if !` then
          #    fires the error branch. It misreports ONLY when the file IS in
          #    the diff and the name list outruns the 64 KiB pipe buffer, i.e.
          #    exactly on the large PRs that most need a changelog entry.
          #    Measured on PR #1271 (326 changed files): the gate reported
          #    "not modified" for a CHANGELOG.md carrying a 24-line diff.
          if [[ -z "$(git diff --name-only "${BASE}..${HEAD}" -- CHANGELOG.md)" ]]; then
            echo "::error file=CHANGELOG.md::PR contains feat:/fix: commits but has neither a new changelog.d/ fragment nor a CHANGELOG.md edit. Preferred: add changelog.d/<pr-number>-<slug>.md (see changelog.d/README.md). Legacy: add an entry under '## [Unreleased]'."
            exit 1
          fi

          # 2. Inspect the diff for CHANGELOG.md; require that at least one
          #    added line (prefix '+ ') lives inside the `[Unreleased]`
          #    section (lines between '## [Unreleased]' and the next
          #    `^## \[` boundary).
          DIFF=$(git diff "${BASE}..${HEAD}" -- CHANGELOG.md)
          if [[ -z "$DIFF" ]]; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md diff is empty."
            exit 1
          fi

          # Apply the diff and grep the resulting file. Simpler: parse the
          # checked-out (HEAD) CHANGELOG.md and confirm the Unreleased
          # section is non-empty AND that the diff added something within it.
          python3 - <<'PY'
          import re, subprocess, sys
          diff = subprocess.check_output(
              ["git", "diff", "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}", "--", "CHANGELOG.md"],
              text=True,
          )
          # Identify hunks whose `@@ ... @@` context falls within the
          # `[Unreleased]` section. Naive but adequate: look for any added
          # line ('^\+ ' but not '^\+\+\+ ') whose nearest preceding section
          # heading in the post-image is `## [Unreleased]`.
          # We re-read HEAD's CHANGELOG.md and use line numbers from the
          # `+++ b/CHANGELOG.md` hunk headers.
          with open("CHANGELOG.md", encoding="utf-8") as fh:
              file_lines = fh.read().splitlines()
          unreleased_start = None
          unreleased_end = len(file_lines)
          for i, ln in enumerate(file_lines):
              if ln.strip() == "## [Unreleased]":
                  unreleased_start = i
              elif unreleased_start is not None and re.match(r"^## \[", ln):
                  unreleased_end = i
                  break
          if unreleased_start is None:
              print("::error file=CHANGELOG.md::missing '## [Unreleased]' heading")
              sys.exit(1)
          # Scan diff hunks for added lines whose POST-image line number
          # falls in (unreleased_start, unreleased_end).
          touched_unreleased = False
          post_line = None
          for line in diff.splitlines():
              m = re.match(r"^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@", line)
              if m:
                  post_line = int(m.group(1))
                  continue
              if post_line is None:
                  continue
              if line.startswith("+++"):
                  continue
              if line.startswith("+"):
                  # +1-indexed; convert to 0-indexed for comparison
                  if unreleased_start < (post_line - 1) < unreleased_end:
                      touched_unreleased = True
                      break
                  post_line += 1
              elif line.startswith("-"):
                  pass  # removal doesn't advance post-line
              else:
                  post_line += 1
          if not touched_unreleased:
              print("::error file=CHANGELOG.md::CHANGELOG.md was modified but no addition fell under '## [Unreleased]'. feat:/fix: PRs must add an entry there.")
              sys.exit(1)
          print("OK: CHANGELOG.md [Unreleased] section was updated.")
          PY

      - name: Self-test the duplicate detector
        # The detector is only worth its exit code if it is shown to catch the
        # real incident AND to leave this repo's honest sibling entries alone
        # (several related `fix(admin-ui):` / `fix(container):` entries ship per
        # release). Seven embedded fixtures assert both directions: three
        # duplicate shapes (lead intact / lead rewritten / lead AND body
        # rewritten) must fail, and four honest shapes must pass.
        # Pure stdlib python3, ~50 ms — cheaper than being wrong.
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_changelog_duplicates.py --self-test

      - name: Verify no duplicated [Unreleased] entry (rebase guard)
        # Runs on EVERY PR, not just feat:/fix: ones — a rebase can duplicate an
        # entry in a PR that carries no feat:/fix: commit of its own (e.g. a
        # docs: or chore: PR that rebased over one).
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_changelog_duplicates.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"

      - name: Verify Keep-A-Changelog header is intact
        shell: bash
        run: |
          set -euo pipefail
          # Defensive check: PR cannot remove the canonical header lines.
          for needle in \
            "^# Changelog" \
            "Keep a Changelog" \
            "Semantic Versioning" \
            "## \[Unreleased\]"
          do
            if ! grep -qE "$needle" CHANGELOG.md; then
              echo "::error file=CHANGELOG.md::missing canonical header pattern: $needle"
              exit 1
            fi
          done
