# PR labels — path-based labels + size bucket, in ONE workflow.
# -----------------------------------------------------------------------------
# Merged from the former `labeler.yml` (PR Auto-Label) + `size-label.yml` (PR Size
# Label): identical trigger (`pull_request_target` [opened, synchronize, reopened,
# ready_for_review]) + identical runner, both just label the PR. Folding them into
# one workflow with two jobs halves the workflow-run count per PR event without
# changing behavior — the job names ("Apply path-based labels" / "Compute size
# bucket") are preserved so the pre-merge gate check still finds them.
#
# Cross-link: .github/labeler.yml (path rules), .github/PULL_REQUEST_TEMPLATE.md,
# docs/internal/CODE-REVIEW-CHECKLIST.md L0.2 (size guidance).

name: PR labels

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Apply path-based labels
    runs-on: [self-hosted, mac, corelink-builder]
    steps:
      - name: Apply labels
        uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6.2.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          # Never strip labels a human triaged in.
          sync-labels: false
          # Operate on the PR's diff (default true on v5 — explicit for clarity).
          dot: true

  size:
    name: Compute size bucket
    runs-on: [self-hosted, mac, corelink-builder]
    steps:
      # Native implementation (no container action). The previous
      # `codelytv/pr-size-labeler` is a Docker container action — Linux-only —
      # which HARD-FAILS on the macOS self-hosted fleet ("Container action is
      # only supported on Linux"), red-flagging every PR. This step computes the
      # same buckets via `gh` and runs on any runner. (2026-06-02)
      - name: Apply size:* label
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Sum additions+deletions, excluding lockfiles + generated artifacts
          # (same ignore set as the old action) so a Cargo.lock/pnpm regen
          # doesn't inflate a legitimately small change.
          total=0
          while IFS=$'\t' read -r file add del; do
            case "$file" in
              Cargo.lock|pnpm-lock.yaml|package-lock.json|yarn.lock) continue ;;
              *.snap|*.lock) continue ;;
              */generated/*|*/__generated__/*) continue ;;
              docs/api/reference/*) continue ;;
            esac
            total=$(( total + add + del ))
          done < <(gh api --paginate "repos/$REPO/pulls/$PR/files" \
                     --jq '.[] | [.filename, .additions, .deletions] | @tsv')

          # Thresholds: XS<10  S<50  M<200  L<500  XL>=500.
          if   [ "$total" -lt 10  ]; then bucket="size:XS"
          elif [ "$total" -lt 50  ]; then bucket="size:S"
          elif [ "$total" -lt 200 ]; then bucket="size:M"
          elif [ "$total" -lt 500 ]; then bucket="size:L"
          else bucket="size:XL"; fi
          echo "changed (excl. lockfiles/generated) = $total -> $bucket"

          gh label create "$bucket" --repo "$REPO" --color ededed 2>/dev/null || true
          # Drop any stale size:* label, then apply the computed one.
          for l in $(gh pr view "$PR" --repo "$REPO" --json labels \
                       --jq '.labels[].name | select(startswith("size:"))'); do
            [ "$l" = "$bucket" ] || gh pr edit "$PR" --repo "$REPO" --remove-label "$l" || true
          done
          gh pr edit "$PR" --repo "$REPO" --add-label "$bucket"

          # XL → leave the split-it-up guidance once (idempotent via marker).
          if [ "$bucket" = "size:XL" ]; then
            marker="<!-- size-xl-note -->"
            if ! gh pr view "$PR" --repo "$REPO" --json comments \
                  --jq '.comments[].body' | grep -qF "$marker"; then
              gh pr comment "$PR" --repo "$REPO" --body "$marker
          This PR is labelled **\`size:XL\`** (>= 500 lines changed, excluding
          lockfiles and generated artifacts). Per
          \`docs/internal/CODE-REVIEW-CHECKLIST.md\` L0.2, consider splitting
          (one PR per concern / per crate, or a stacked-PR chain)."
            fi
          fi
