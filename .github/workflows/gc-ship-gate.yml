name: GC ship gate (WI-S06-007)

# Sprint-level ship-gate workflow per WI-S06-007 §13. Drives the
# host-side cross-component prop suite + 3 RB dry-runs + validators
# chain so a regression cannot land without a CI failure.
#
# This workflow runs:
#   1. Validators (specs + INV promotion + migration additivity).
#   2. Cross-component property tests at 10k iter PR speed.
#   3. RB-FM-300 + RB-FM-404 + RB-FM-305 host-side dry-run scripts.
#   4. DASH-GC dashboard JSON parse smoke.
#   5. DASH-GC alert rules YAML parse smoke.
#
# All gates fail-closed (HIGH_RISK lane FF-HR-011). Per WI §13 dependency
# chain: WI-S06-001..006 SEALED is a prerequisite; this workflow runs
# at WI-S06-007 SEAL + on every subsequent PR that touches GC code,
# the canonical migration files, the runbooks, the dashboard JSON, or
# the alert rules YAML.

on:
  pull_request:
    paths:
      - 'crates/corelink-gc/**'
      - 'specs/05_quality/runbooks/RB-FM-300-gc-refcount-bug.md'
      - 'specs/05_quality/runbooks/RB-FM-404-gc-write-race.md'
      - 'specs/05_quality/runbooks/RB-FM-305-tombstone-lost.md'
      - 'scripts/rb_fm_300_dry_run.sh'
      - 'scripts/rb_fm_404_dry_run.sh'
      - 'scripts/rb_fm_305_dry_run.sh'
      - 'dashboards/grafana/DASH-GC.json'
      - 'dashboards/alerts/dash-gc-alerts.yml'
      - 'specs/04_sprints/S06/**'
      - '.github/workflows/gc-ship-gate.yml'
  # Cadence: daily -> WEEKLY (CI cost diet 2026-08-01). The `pull_request`
  # paths: lane above still gates EVERY diff that can regress this sprint's
  # surface; the schedule is only belt-and-braces re-execution for a SEALED
  # sprint, and it fans out to 4 hosted jobs (2 of them full Rust builds).
  schedule:
    - cron: '0 11 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # --------------------------------------------------------------------
  # NOTE (CI-OPT-003): The `validators` job (validate_specs/inv/refs +
  # check_migrations_additive) has been moved to `spec_validation.yml` as
  # the single source of truth. Branch protection requires
  # `spec_validation / spec-validation` as a separate REQUIRED status
  # check on all PRs touching `specs/**`, so removing the duplicate
  # validators job here does not weaken the gate.
  # --------------------------------------------------------------------
  # 1. Cross-component property tests + lib unit + chaos suite at PR speed.
  # --------------------------------------------------------------------
  prop-and-tests:
    name: corelink-gc tests (lib + prop @ 10k iter + chaos)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-04-29

      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        with:
          workspaces: ". -> target"

      - uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: cargo test -p corelink-gc --all-targets
        run: cargo test -p corelink-gc --all-targets

      - name: cargo clippy -- -D warnings
        run: cargo clippy --workspace --all-targets --features corelink-worker/tower-middleware -- -D warnings

      - name: cargo test --release prop_inv_gc_004_race
        run: cargo test --release -p corelink-gc --test prop_inv_gc_004_race

  # --------------------------------------------------------------------
  # 2. RB-FM-300 + RB-FM-404 + RB-FM-305 host-side dry-run scripts.
  # --------------------------------------------------------------------
  rb-dry-runs:
    name: RB-FM-300 / RB-FM-404 / RB-FM-305 host-side dry-runs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [prop-and-tests]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-04-29

      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        with:
          workspaces: ". -> target"

      - uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: RB-FM-300 dry-run
        run: bash scripts/rb_fm_300_dry_run.sh

      - name: RB-FM-404 dry-run
        run: bash scripts/rb_fm_404_dry_run.sh

      - name: RB-FM-305 dry-run
        run: bash scripts/rb_fm_305_dry_run.sh

  # --------------------------------------------------------------------
  # 3. DASH-GC dashboard JSON + alert rules YAML parse smoke.
  # --------------------------------------------------------------------
  dashboard-smoke:
    name: DASH-GC parse smoke
    # Runner: self-hosted mac fleet (CI cost diet 2026-08-01) — a JSON/YAML
    # parse smoke that still costs a full paid minute under the hosted
    # 1-MINUTE-PER-JOB FLOOR. The step comment below already documents the
    # system-python3 idiom written FOR this fleet.
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # No actions/setup-python: the self-hosted mac fleet cannot provision
      # Python via setup-python (RUNNER_TOOL_CACHE is unset, falls back to
      # the unwritable /Users/runner hosted path and dies with
      # `mkdir: /Users/runner: Permission denied`). Use system python3
      # and ensure pyyaml is available (mirrors spec_validation.yml). (2026-06-03)
      - name: Ensure pyyaml (system python3)
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null && exit 0
          python3 -m venv .venv-smoke
          .venv-smoke/bin/pip install --quiet pyyaml
          echo "$PWD/.venv-smoke/bin" >> "$GITHUB_PATH"

      - name: DASH-GC.json parse smoke
        run: python3 -c "import json; json.load(open('dashboards/grafana/DASH-GC.json'))"

      - name: dash-gc-alerts.yml parse smoke
        run: python3 -c "import yaml; yaml.safe_load(open('dashboards/alerts/dash-gc-alerts.yml'))"

  # --------------------------------------------------------------------
  # 4. Aggregate gate (fan-in for required-status-checks branch
  #    protection rule).
  # --------------------------------------------------------------------
  gc-ship-gate:
    name: GC ship gate (aggregate)
    # Runner: self-hosted mac fleet (CI cost diet 2026-08-01) — a fan-in
    # `echo` that still costs a full paid minute under the hosted
    # 1-MINUTE-PER-JOB FLOOR.
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 1
    needs: [prop-and-tests, rb-dry-runs, dashboard-smoke]
    steps:
      - name: Aggregate
        run: echo "GC ship gate green; all canonical sub-gates passed."
