name: issue-2386 hosted runner contract

# This is a static, credentialless proof only.  It neither invokes candidate
# code nor deploys, publishes, signs, loads, or mutates an external system.
on:
  pull_request:
    paths:
      - ".github/workflows/mutation-nightly.yml"
      - ".github/workflows/mutation-pr.yml"
      - ".github/workflows/nightly.yml"
      - ".github/workflows/proptest-density-gate.yml"
      - ".github/workflows/region_pinning.yml"
      - ".github/workflows/tenant-path.yml"
      - ".github/workflows/workspace-lint.yml"
      - "scripts/verify_i2368_hosted_bundle.py"
      - "scripts/verify_hosted_runner_migration_contract.py"
      - ".github/workflows/issue-2386-hosted-runner-contract.yml"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full SHA of the candidate checkout to inspect as inert YAML
        required: true
        type: string
      inventory:
        description: Closed workflow/job inventory to inspect
        required: true
        type: choice
        options: [bundle-2367, bundle-2368, bundle-2369, bundle-2370, bundle-2371, bundle-2372, bundle-2373, bundle-2374, bundle-2375, bundle-2376]
      candidate_repository:
        description: Repository holding the candidate (must equal this repository)
        required: true
        type: string
      candidate_ref:
        description: Candidate branch or full ref; its resolved SHA must equal candidate_sha
        required: true
        type: string

permissions:
  contents: read

jobs:
  self-test:
    name: "#2368 exact-head hosted workflow pack"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout protected PR base for immutable semantic comparison
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - name: Checkout exact candidate head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false

      - name: Install checksum-pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" \
            --output "${archive}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${archive}" \
            | sha256sum --check --status
          mkdir -p "${RUNNER_TEMP}/actionlint"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/actionlint" actionlint
          "${RUNNER_TEMP}/actionlint/actionlint" -version

      - name: Lint the exact bundle workflows and pack
        working-directory: candidate
        run: >-
          "${RUNNER_TEMP}/actionlint/actionlint" -color -config-file .actionlint.yaml
          .github/workflows/mutation-nightly.yml
          .github/workflows/mutation-pr.yml
          .github/workflows/nightly.yml
          .github/workflows/proptest-density-gate.yml
          .github/workflows/region_pinning.yml
          .github/workflows/tenant-path.yml
          .github/workflows/workspace-lint.yml
          .github/workflows/issue-2386-hosted-runner-contract.yml

      - name: Run negative controls, exact 20-job census, and immutable-semantics proof
        working-directory: candidate
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 -S scripts/verify_i2368_hosted_bundle.py --self-test
          python3 -S scripts/verify_i2368_hosted_bundle.py \
            --base-root ../baseline \
            --candidate-root . \
            --expected-head "$EXPECTED_HEAD"

  inspect-candidate:
    name: exact-SHA static inventory
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject a repository mismatch before checkout
        env:
          CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository }}
        run: test "$CANDIDATE_REPOSITORY" = "$GITHUB_REPOSITORY"
      - name: Checkout trusted contract
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          path: trusted-contract
          persist-credentials: false
      - name: Checkout candidate YAML as inert data
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ inputs.candidate_repository }}
          ref: ${{ inputs.candidate_ref }}
          path: candidate
          persist-credentials: false
      - name: Validate the closed candidate inventory
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          INVENTORY: ${{ inputs.inventory }}
        run: >-
          python3 -S trusted-contract/scripts/verify_hosted_runner_migration_contract.py
          --root candidate --inventory "$INVENTORY" --expected-head "$CANDIDATE_SHA"
