name: dependabot-policy (license + status-check enforcement)

# Policy gate for Dependabot PRs. Runs BEFORE auto-merge can fire.
# Failure here marks the dependabot-policy required check red, which blocks
# `gh pr merge --auto --squash` from completing.
#
# What this gate enforces:
#   1. License allowlist (cross-checked against deny.toml).
#      Any Cargo.lock entry whose license is in the banned list
#      (CDLA-OTHER, AGPL, GPL, SSPL, Commons-Clause, BUSL-1.1, …) causes
#      the gate to FAIL — even if the rest of CI is green.
#   2. Required status checks present on the PR head SHA.
#      If a required check is missing/skipped (not just failing), the gate
#      FAILS — closes the "skip check by event filter" bypass.
#      The required list is RESOLVED PER PR from the changed-file set, by
#      mirroring each producing workflow's own `paths:` filter (see Step 7).
#      A flat list is wrong here: `PR gate (crate-scoped clippy + tests)` is
#      `paths:`-filtered to Cargo.*/crates/**, so requiring it on an npm-only
#      Dependabot PR made that PR red BY CONSTRUCTION, forever (#801, #914,
#      #919 all reported "Required status checks missing on head SHA").
#   3. PR does NOT skip git hooks: scans commit messages on the PR for
#      `--no-verify`, `--no-gpg-sign`, or `[skip ci]`.
#   4. PR does NOT include suspicious file paths (release manifests,
#      signing keys, CODEOWNERS) — defence in depth against compromised
#      registry packages adding unrelated diffs.
#
# Cross-references:
#   - License source of truth: deny.toml [licenses] (R1-9 + WI-S12-004).
#   - Runbook on failure:      specs/_runbooks/RB-DEPENDABOT-INCIDENT.md §4.
#   - Audit baseline:          specs/_audits/sealed/2026-05-15-dependabot-policy.md.
#
# Implements: WI-S12-004 §6.1.5 (ST-005) + R-PREP audit policy gate.
# SHA-pinned per HIGH_RISK lane FF-HR-005.

# ============================================================================
# SECURITY SENTINEL — pull_request_target + self-hosted runner WARNING
#
# This workflow uses `pull_request_target` (trusted context, write permissions)
# and runs on the self-hosted mac runner (the founder's machine). It checks out
# PR-HEAD content via `refs/pull/N/merge` in the policy-gate job below.
#
# This combination is safe ONLY because the SOLE consumer of the checked-out
# code is `cargo deny check licenses bans` (~line 111) — a STATIC ANALYZER
# that reads Cargo.lock/deny.toml but NEVER executes build scripts, proc
# macros, or any other PR-supplied code.
#
# DO NOT add any of the following to this job without a dedicated security
# review and explicit sign-off from the repo owner:
#   - cargo build / cargo test / cargo run
#   - npm install / npm run / npx (on checked-out sources)
#   - Any shell step that executes code from the PR branch
#   - Any step that installs or invokes build tooling from the PR tree
#   - Any action that triggers Rust/Node/Python evaluation of PR files
#
# Violating this constraint turns any PR author into an RCE actor on the
# founder's machine. The policy-gate job MUST remain a pure static-analysis
# pass. (Ref: GHSA-2022-0001, GitHub Actions security hardening guide §5.4)
# ============================================================================
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, ready_for_review]

concurrency:
  group: dependabot-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  # -----------------------------------------------------------------------
  # Sentinel job — always green for non-dependabot PRs (so this workflow
  # can be a `required` check without blocking normal contributor PRs).
  # -----------------------------------------------------------------------
  sentinel:
    name: dependabot-policy sentinel
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 1
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Pass-through (non-dependabot PR)
        run: |
          echo "::notice::Non-dependabot PR — policy gate not applicable. Pass."

  # -----------------------------------------------------------------------
  # The actual policy gate (Dependabot-only).
  # -----------------------------------------------------------------------
  policy-gate:
    name: Dependabot policy gate
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 10
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'

    # Pass the PR base branch via env (NOT interpolated directly into run: shell) —
    # template-injection-safe (a branch name can carry shell metacharacters). The
    # actor-guard above already restricts this pull_request_target job to dependabot,
    # so this is defense-in-depth.
    env:
      BASE_REF: ${{ github.event.pull_request.base.ref }}

    steps:
      # ---------------------------------------------------------------------
      # Step 1 — Checkout the PR head so we can inspect Cargo.lock diffs.
      # We use the merge-ref so the lockfile reflects post-merge state.
      #
      # SECURITY NOTE: this step checks out PR-HEAD content (refs/pull/N/merge)
      # on a SELF-HOSTED runner. This is intentional and safe ONLY because no
      # subsequent step executes code from the checked-out tree (see the
      # pull_request_target sentinel comment at the top of this file). The
      # only consumer is `cargo deny check licenses bans` — a static analyzer.
      # Any future step that builds, installs, or runs PR-supplied code MUST
      # undergo a security review before being added here.
      # ---------------------------------------------------------------------
      - name: Checkout PR merge ref (SHA-pinned)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # ---------------------------------------------------------------------
      # Step 2 — License allowlist cross-check.
      #
      # Strategy: parse deny.toml's [licenses].allow + bans list, then run
      # `cargo metadata --format-version 1` and verify every crate's
      # license expression is on the allowlist. Use a fail-closed check
      # so an unparseable SPDX (e.g., `SEE LICENSE IN <file>`) fails the
      # gate and forces human review.
      # ---------------------------------------------------------------------
      - name: Set up Rust toolchain (SHA-pinned)
        if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b  # stable 1.83
        with:
          toolchain: stable

      - name: Install cargo-deny (SHA-pinned)
        if: hashFiles('Cargo.toml') != ''
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b  # v2.83.4
        with:
          tool: cargo-deny@0.19.8

      - name: Run cargo-deny licenses (fail-closed)
        if: hashFiles('Cargo.toml') != ''
        run: |
          set -euo pipefail
          echo "::group::cargo-deny licenses"
          # Fail fast on any banned license OR yanked crate OR advisory.
          cargo deny --all-features check licenses bans
          echo "::endgroup::"

      # ---------------------------------------------------------------------
      # Step 3 — Explicit banned-license signature scan over Cargo.lock.
      #
      # Belt-and-braces over cargo-deny: a regex sweep for AGPL/GPL/SSPL/
      # Commons-Clause/CDLA-Sharing/BUSL strings inside Cargo.lock. Catches
      # cases where cargo-deny misclassifies a SPDX expression.
      # ---------------------------------------------------------------------
      - name: Banned-license signature scan (Cargo.lock)
        if: hashFiles('Cargo.lock') != ''
        run: |
          set -euo pipefail
          banned_regex='(AGPL|GPL-[23]|SSPL|Commons-Clause|BUSL|CDLA-Sharing|CDLA-Permissive-1\.0$)'
          # Search every license-bearing field in Cargo.lock. Empty match => pass.
          # NOTE: cargo-deny is the primary gate; this is the second-line check.
          if grep -E "${banned_regex}" Cargo.lock; then
            echo "::error::Banned license signature detected in Cargo.lock."
            echo "::error::Cross-reference deny.toml [licenses] + escalate per RB-DEPENDABOT-INCIDENT §4.2."
            exit 1
          fi
          echo "::notice::Cargo.lock license scan clean."

      # ---------------------------------------------------------------------
      # Step 4 — npm license scan (if PR touches a package-lock).
      # ---------------------------------------------------------------------
      - name: npm banned-license scan
        run: |
          set -euo pipefail
          banned_regex='(AGPL|GPL-[23]|SSPL|Commons-Clause|BUSL|CDLA-Sharing)'
          found=0
          for f in $(git diff --name-only "origin/$BASE_REF"...HEAD -- '*package-lock.json' '*pnpm-lock.yaml' 'apps/**/package.json' 'crates/**/package.json' 'package.json' 2>/dev/null || true); do
            if grep -E "\"license\".*${banned_regex}" "$f" 2>/dev/null; then
              echo "::error::Banned license in $f"
              found=1
            fi
          done
          if [[ "$found" == "1" ]]; then
            exit 1
          fi
          echo "::notice::npm license scan clean."

      # ---------------------------------------------------------------------
      # Step 5 — Commit-message hygiene: forbid skip-hook flags.
      # ---------------------------------------------------------------------
      - name: Forbid skip-hook / skip-ci flags
        run: |
          set -euo pipefail
          base="origin/$BASE_REF"
          if git log "${base}"..HEAD --format=%B | grep -E -- '--no-verify|--no-gpg-sign|\[skip ci\]|\[ci skip\]'; then
            echo "::error::Dependabot PR contains skip-hook/skip-ci marker — policy violation."
            exit 1
          fi
          echo "::notice::Commit hygiene clean."

      # ---------------------------------------------------------------------
      # Step 6 — Defence-in-depth: forbid PRs that modify governance files.
      # A dependency PR has NO business touching CODEOWNERS, signing keys,
      # release manifests, or workflow files. If it does, fail closed.
      # ---------------------------------------------------------------------
      - name: Forbid governance-file modifications
        run: |
          set -euo pipefail
          base="origin/$BASE_REF"
          mapfile -t changed < <(git diff --name-only "${base}"...HEAD)
          forbidden_regex='^(\.github/(CODEOWNERS|workflows/.*\.yml|dependabot\.yml)|SECURITY\.md|deny\.toml|cosign\.pub|\.well-known/.*|specs/_security/.*)$'
          violations=()
          for f in "${changed[@]}"; do
            if [[ "${f}" =~ ${forbidden_regex} ]]; then
              violations+=("${f}")
            fi
          done
          if (( ${#violations[@]} > 0 )); then
            echo "::error::Dependabot PR modifies forbidden files:"
            printf '::error:: - %s\n' "${violations[@]}"
            echo "::error::See RB-DEPENDABOT-INCIDENT §4.3 — manual review required."
            exit 1
          fi
          echo "::notice::No governance-file violations."

      # ---------------------------------------------------------------------
      # Step 7 — Required status checks must be present (not just green).
      #
      # A check that is `skipped` due to a path filter can let a PR slip
      # through branch protection. Verify the canonical required checks
      # have actually executed on this PR's head SHA.
      #
      # The required set is RESOLVED PER PR from the changed-file list. A flat
      # list is not just imprecise here, it is unsatisfiable: every check below
      # except `dco` is produced by a `paths:`-filtered workflow, so demanding
      # all of them on every Dependabot PR guaranteed a red gate on any PR that
      # did not touch Rust. Confirmed on #801 / #914 / #919, each of which had
      # cargo-deny + cargo-audit + secrets-matrix + dco + pnpm-audit present and
      # was failed solely on the missing crate-scoped Rust gate.
      #
      # Each regex below MIRRORS the `paths:` of the workflow that produces the
      # check. If you change a producing workflow's `paths:`, change its regex
      # here in the same PR or this gate silently drifts.
      # ---------------------------------------------------------------------
      - name: Verify required checks are present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          base="origin/$BASE_REF"
          mapfile -t changed < <(git diff --name-only "${base}"...HEAD)
          echo "::group::Changed files (${#changed[@]})"
          printf '  %s\n' "${changed[@]}"
          echo "::endgroup::"

          # --- path -> producing-workflow trigger map -------------------------
          # .github/workflows/corelink-server.yml + corelink-adapter-host.yml
          re_rust_pr_gate='^(Cargo\.(toml|lock)|crates/corelink-(container|handler-customer|adapter-host)/.+|migrations/d1/.+|\.github/workflows/corelink-(server|adapter-host)\.yml)$'
          # .github/workflows/cargo-deny.yml
          re_cargo_deny='^(crates/.+|apps/.+|Cargo\.(toml|lock)|deny\.toml|\.github/workflows/cargo-deny\.yml)$'
          # .github/workflows/cargo-audit.yml
          re_cargo_audit='^(crates/.+|apps/.+|Cargo\.(toml|lock)|deny\.toml|\.cargo/audit\.toml|\.github/workflows/cargo-audit\.yml)$'
          # .github/workflows/secrets-drift.yml
          re_secrets='^(Cargo\.(toml|lock)|crates/.+/Cargo\.toml|apps/.+/Cargo\.toml|apps/.+/package\.json|.*wrangler\.toml|\.github/workflows/.+|crates/.+\.rs|apps/.+\.tsx?|worker/.+\.ts|docs/internal/secrets-checklist\.md|scripts/(validate_secrets_matrix|check-env-contract)\.py|scripts/secrets-checklist-verify\.sh)$'
          # .github/workflows/pnpm-audit.yml — the npm lane's presence check.
          # NOTE: this step asserts PRESENCE, never conclusion, so the chronic
          # advisory red on this job does not make the gate unsatisfiable; it
          # only proves the npm supply-chain lane actually executed.
          re_pnpm_audit='^(pnpm-lock\.yaml|package\.json|apps/.+/package\.json|worker/package\.json|crates/corelink-wasm/package\.json|\.github/workflows/pnpm-audit\.yml)$'

          matches() {
            local re="$1" f
            for f in "${changed[@]}"; do
              if [[ "$f" =~ $re ]]; then
                return 0
              fi
            done
            return 1
          }

          # dco-check.yml has NO `paths:` filter — it runs on every PR, so it is
          # unconditionally required.
          required=("dco")
          if matches "$re_rust_pr_gate"; then required+=("PR gate (crate-scoped clippy + tests)"); fi
          if matches "$re_cargo_deny";   then required+=("cargo-deny (license + advisories + sources + bans)"); fi
          if matches "$re_cargo_audit";  then required+=("cargo-audit PR gate"); fi
          if matches "$re_secrets";      then required+=("secrets-matrix drift gate"); fi
          if matches "$re_pnpm_audit";   then required+=("pnpm advisory audit"); fi

          echo "::group::Resolved required checks (${#required[@]})"
          printf '  %s\n' "${required[@]}"
          echo "::endgroup::"

          # Degradation guard: if nothing beyond `dco` resolved, this PR touches
          # no path any supply-chain gate watches. That is legitimate today only
          # for the pip lanes (requirements-ci.txt / tools/sdks/python — no
          # dedicated PR gate exists), so warn loudly instead of silently
          # passing a no-op gate.
          if (( ${#required[@]} == 1 )); then
            echo "::warning::Only \`dco\` resolved as required — no ecosystem-specific PR gate watches the changed paths. Review this Dependabot PR by hand."
          fi

          checks_json=$(gh api "repos/${REPO}/commits/${PR_HEAD_SHA}/check-runs?per_page=100")
          missing=()
          for r in "${required[@]}"; do
            if ! echo "${checks_json}" | jq -e --arg name "$r" '.check_runs[] | select(.name == $name)' > /dev/null; then
              missing+=("${r}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Required status checks missing on head SHA ${PR_HEAD_SHA}:"
            printf '::error:: - %s\n' "${missing[@]}"
            echo "::error::Dependabot PR may not be auto-mergeable until all checks run."
            exit 1
          fi
          echo "::notice::All ${#required[@]} resolved required status checks are present."

      # ---------------------------------------------------------------------
      # Step 8 — Annotate audit-log emission (deferred to audit-chain).
      # ---------------------------------------------------------------------
      - name: Policy-gate audit log
        run: |
          cat <<EOF
          {
            "event": "corelink.security.dependabot_policy_gate_pass",
            "schema": "corelink.audit.v1",
            "pr_number": ${{ github.event.pull_request.number }},
            "ecosystem": "${{ steps.metadata.outputs.package-ecosystem }}",
            "dependency_names": "${{ steps.metadata.outputs.dependency-names }}",
            "update_type": "${{ steps.metadata.outputs.update-type }}",
            "head_sha": "${{ github.event.pull_request.head.sha }}",
            "ts": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
