name: dependabot-policy (license + status-check enforcement)

# Policy gate for Dependabot PRs. Runs BEFORE auto-merge can fire.
# Failure here marks the dependabot-policy required check red, which blocks
# `gh pr merge --auto --squash` from completing.
#
# What this gate enforces:
#   1. License allowlist (cross-checked against deny.toml).
#      Any Cargo.lock entry whose license is in the banned list
#      (CDLA-OTHER, AGPL, GPL, SSPL, Commons-Clause, BUSL-1.1, …) causes
#      the gate to FAIL — even if the rest of CI is green.
#   2. Required status checks present on the PR head SHA.
#      If a required check is missing/skipped (not just failing), the gate
#      FAILS — closes the "skip check by event filter" bypass.
#      The required list is RESOLVED PER PR from the changed-file set, by
#      mirroring each producing workflow's own `paths:` filter (see Step 7).
#      A flat list is wrong here: `PR gate (crate-scoped clippy + tests)` is
#      `paths:`-filtered to Cargo.*/crates/**, so requiring it on an npm-only
#      Dependabot PR made that PR red BY CONSTRUCTION, forever (#801, #914,
#      #919 all reported "Required status checks missing on head SHA").
#   3. PR does NOT skip git hooks: scans commit messages on the PR for
#      `--no-verify`, `--no-gpg-sign`, or `[skip ci]`.
#   4. PR does NOT include suspicious file paths (release manifests,
#      signing keys, CODEOWNERS) — defence in depth against compromised
#      registry packages adding unrelated diffs.
#
# Cross-references:
#   - License source of truth: deny.toml [licenses] (R1-9 + WI-S12-004).
#   - Runbook on failure:      specs/_runbooks/RB-DEPENDABOT-INCIDENT.md §4.
#   - Audit baseline:          specs/_audits/sealed/2026-05-15-dependabot-policy.md.
#
# Implements: WI-S12-004 §6.1.5 (ST-005) + R-PREP audit policy gate.
# SHA-pinned per HIGH_RISK lane FF-HR-005.

# ============================================================================
# SECURITY SENTINEL — pull_request_target + self-hosted runner WARNING
#
# This workflow uses `pull_request_target` (trusted context, write permissions)
# and runs on the self-hosted mac runner (the founder's machine). It checks out
# PR-HEAD content via `refs/pull/N/merge` in the policy-gate job below.
#
# This combination is safe ONLY because the SOLE consumer of the checked-out
# code is `cargo deny check licenses bans` (~line 111) — a STATIC ANALYZER
# that reads Cargo.lock/deny.toml but NEVER executes build scripts, proc
# macros, or any other PR-supplied code.
#
# DO NOT add any of the following to this job without a dedicated security
# review and explicit sign-off from the repo owner:
#   - cargo build / cargo test / cargo run
#   - npm install / npm run / npx (on checked-out sources)
#   - Any shell step that executes code from the PR branch
#   - Any step that installs or invokes build tooling from the PR tree
#   - Any action that triggers Rust/Node/Python evaluation of PR files
#
# Violating this constraint turns any PR author into an RCE actor on the
# founder's machine. The policy-gate job MUST remain a pure static-analysis
# pass. (Ref: GHSA-2022-0001, GitHub Actions security hardening guide §5.4)
# ============================================================================
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, ready_for_review]

concurrency:
  group: dependabot-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  # -----------------------------------------------------------------------
  # Sentinel job — always green for non-dependabot PRs (so this workflow
  # can be a `required` check without blocking normal contributor PRs).
  # -----------------------------------------------------------------------
  sentinel:
    name: dependabot-policy sentinel
    # zero-hosted (WP-CI): gh + cargo-deny assados; e o merge-ref do PR passa a ser avaliado em microVM descartável, não no Mac do owner
    runs-on: corelink
    timeout-minutes: 1
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Pass-through (non-dependabot PR)
        run: |
          echo "::notice::Non-dependabot PR — policy gate not applicable. Pass."

  # -----------------------------------------------------------------------
  # The actual policy gate (Dependabot-only).
  # -----------------------------------------------------------------------
  policy-gate:
    name: Dependabot policy gate
    # zero-hosted (WP-CI): gh + cargo-deny assados; e o merge-ref do PR passa a ser avaliado em microVM descartável, não no Mac do owner
    runs-on: corelink
    timeout-minutes: 10
    # `github.actor` is whoever caused this event (for example, an owner
    # adding a label), not necessarily the PR author. Gate on the immutable PR
    # author from the event so a maintainer-triggered synchronize/label cannot
    # downgrade a Dependabot PR into the pass-through sentinel.
    if: github.event.pull_request.user.login == 'dependabot[bot]'

    # Pass the PR base branch via env (NOT interpolated directly into run: shell) —
    # template-injection-safe (a branch name can carry shell metacharacters). The
    # actor-guard above already restricts this pull_request_target job to dependabot,
    # so this is defense-in-depth.
    env:
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      # These must remain process-level sinks, never PR-controlled config.
      # Individual steps that consume PR data set HOME/CARGO_HOME to fresh
      # runner.temp directories below.  HOME cannot be changed at job scope:
      # the preceding BASE-only host-toolchain assertion deliberately reads the
      # preinstalled toolchain from the runner's real home.
      # Cargo config is untrusted input in the PR tree.  The policy check runs
      # from POLICY_TREE (a config-free git archive below), and these explicit
      # empty values are a second boundary against a runner-level wrapper.
      CARGO_BUILD_RUSTC_WRAPPER: ""
      CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER: ""
      CARGO_BUILD_RUSTFLAGS: ""
      RUSTC_WRAPPER: ""
      RUSTC_WORKSPACE_WRAPPER: ""
      # The BASE-only host-toolchain step prepends its direct rustc binary to
      # PATH. Naming the command resets any inherited RUSTC override without
      # using an empty value (which Cargo treats as an executable named "").
      RUSTC: rustc
      RUSTFLAGS: ""
      CARGO_NET_GIT_FETCH_WITH_CLI: "false"
      # cargo-deny calls cargo-metadata directly and its dependency honors
      # $CARGO. A direct cargo-deny binary is not enough if this inherited
      # executable selector points at an attacker wrapper. `cargo` resolves
      # through the trusted host-toolchain path added before this step.
      CARGO: cargo
      CARGO_REGISTRY_TOKEN: ""
      CARGO_REGISTRIES_CRATES_IO_TOKEN: ""
      CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: ""
      CARGO_REGISTRIES_CRATES_IO_CREDENTIAL_PROVIDER: ""
      CARGO_ALIAS_DENY: ""
      BASH_ENV: /dev/null
      ENV: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_COUNT: "0"
      GIT_CONFIG_KEY_0: ""
      GIT_CONFIG_VALUE_0: ""
      GIT_CONFIG_PARAMETERS: ""
      GIT_EXTERNAL_DIFF: /bin/false
      GIT_PAGER: cat
      GIT_TERMINAL_PROMPT: "0"
      GIT_ASKPASS: /bin/false
      GIT_SSH_COMMAND: "ssh -F /dev/null -oBatchMode=yes -oIdentitiesOnly=yes"

    steps:
      # ---------------------------------------------------------------------
      # Step 1 — Checkout the PR head so we can inspect Cargo.lock diffs.
      # We use the merge-ref so the lockfile reflects post-merge state.
      #
      # SECURITY NOTE: this step checks out PR-HEAD content (refs/pull/N/merge)
      # on a SELF-HOSTED runner. That is safe ONLY while no subsequent step
      # executes code — or reads trust-bearing DATA — from this tree. The
      # intended consumer is `cargo deny check licenses bans`, a static
      # analyzer. Any future step that builds, installs, or runs PR-supplied
      # code MUST undergo a security review before being added here.
      #
      # B-133: that invariant WAS violated, and this note asserted it anyway —
      # the prose stayed true-sounding while the file stopped obeying it. The
      # "Use the workspace-pinned host toolchain" step below ran
      # `bash scripts/ci-use-host-toolchain.sh` straight out of THIS tree, i.e.
      # the PR's version of the script. Fixed below by running it from a
      # separate BASE-ref checkout (`_base/`).
      #
      # The second half, which B-133 did not name and which the code half alone
      # would NOT have closed: that script reads the toolchain channel from
      # `rust-toolchain.toml` and `cd`s to the git toplevel of its WORKING
      # DIRECTORY — so running trusted code with the PR tree as cwd still fed it
      # attacker-controlled data. `CHANNEL` was interpolated unvalidated into
      # `TC="$HOME/.rustup/toolchains/${CHANNEL}-${HOST_TRIPLE}"`, and `$TC/bin`
      # is appended to `$GITHUB_PATH`. A channel of `../../../<workspace>/evil`
      # therefore pointed at a directory inside the PR checkout itself — where
      # the attacker controls `bin/cargo` and `bin/rustc`, executable bits and
      # all — and every later step would have run their `cargo`. Closed twice
      # over: `working-directory: _base` below (so the toml is read from the
      # base tree too), and a hard character-class check on `CHANNEL` in the
      # script, which protects all 25 of its callers rather than just this lane.
      # ---------------------------------------------------------------------
      - name: Checkout PR merge ref (SHA-pinned)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      # ---------------------------------------------------------------------
      # Step 1b — the TRUSTED tree (B-133).
      #
      # `github.event.pull_request.base.sha` is the base commit this PR targets,
      # supplied by the event payload, NOT by the PR's contents. Checked out to
      # its own path so it cannot be reached by anything the PR wrote, and AFTER
      # the PR checkout — actions/checkout cleans its destination, so a `_base`
      # created first would be swept away by the checkout above.
      #
      # Sparse: only what the toolchain step reads. A full second checkout would
      # be pure cost, and a narrow one makes the trusted surface auditable at a
      # glance — if a future step needs another file from base, adding it here is
      # a visible decision.
      # ---------------------------------------------------------------------
      - name: Checkout BASE ref into _base (trusted tree; SHA-pinned)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: _base
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/dependabot-policy.yml
            scripts/ci-use-host-toolchain.sh
            scripts/check_dependabot_policy_trusted_tree.py
            .github/workflows/dependabot-policy-trust-boundary.yml
            rust-toolchain.toml
            deny.toml
          sparse-checkout-cone-mode: false

      # ---------------------------------------------------------------------
      # Step 1c — make a data-only Cargo tree.
      #
      # cargo metadata (which cargo-deny calls) asks rustc for version/target
      # information.  Cargo loads .cargo/config.toml before doing that, and a
      # PR-controlled [build] rustc-wrapper is therefore executable code, not
      # inert data.  A separate archive removes every Cargo config and
      # rust-toolchain override before the analyzer sees the PR manifests.
      # CARGO_HOME is also empty/ephemeral, so runner credentials and global
      # credential providers cannot cross this boundary.
      # ---------------------------------------------------------------------
      - name: Assert trust-boundary wiring (BASE checker)
        # This checker is code from the BASE ref, not `scripts/...` from the
        # merge ref.  It proves that every post-checkout executable step has a
        # declared trust source before any PR data is consumed.
        working-directory: _base
        run: python3 scripts/check_dependabot_policy_trusted_tree.py

      - name: Prepare isolated Cargo policy tree (PR data only)
        env:
          POLICY_TREE: ${{ runner.temp }}/corelink-dependabot-policy-tree
          POLICY_HOME: ${{ runner.temp }}/corelink-dependabot-policy-home
          HOME: ${{ runner.temp }}/corelink-dependabot-policy-home
          CARGO_HOME: ${{ runner.temp }}/corelink-dependabot-cargo-home
          DENY_CONFIG: ${{ runner.temp }}/corelink-dependabot-deny.toml
          POLICY_ARCHIVE: ${{ runner.temp }}/corelink-dependabot-policy-tree.tar
        run: |
          set -euo pipefail
          rm -rf "$POLICY_TREE" "$POLICY_HOME" "$CARGO_HOME" "$POLICY_ARCHIVE" "$DENY_CONFIG"
          mkdir -p "$POLICY_TREE" "$POLICY_HOME" "$CARGO_HOME"
          chmod 700 "$POLICY_HOME" "$CARGO_HOME"

          # `git archive | tar -x` is not a data boundary if the archive can
          # carry symlinks: an attacker can make a later "regular" filename
          # resolve outside POLICY_TREE. Reject every symlink/submodule while
          # still in Git's typed tree, before tar receives any PR bytes.
          unsafe_entries="$(git ls-tree -r --full-tree HEAD | awk '$1 == "120000" || $1 == "160000" { print $1 " " $4 }')"
          if [ -n "$unsafe_entries" ]; then
            echo "::error::Refusing PR archive with symlink/submodule entries before extraction:" >&2
            printf '%s\n' "$unsafe_entries" >&2
            exit 1
          fi

          git archive --format=tar --output="$POLICY_ARCHIVE" HEAD
          tar -x -f "$POLICY_ARCHIVE" -C "$POLICY_TREE"
          rm -rf "$POLICY_TREE/.cargo"
          rm -f "$POLICY_TREE/rust-toolchain" "$POLICY_TREE/rust-toolchain.toml"
          test ! -e "$POLICY_TREE/.cargo"
          test ! -e "$POLICY_TREE/rust-toolchain"
          test ! -e "$POLICY_TREE/rust-toolchain.toml"
          for manifest in Cargo.toml Cargo.lock deny.toml; do
            if [ ! -f "$POLICY_TREE/$manifest" ] || [ -L "$POLICY_TREE/$manifest" ]; then
              echo "::error::Refusing PR: required regular $manifest is missing after archive extraction." >&2
              exit 1
            fi
          done

          # This is the no-network source preflight. `deny.toml` permits only
          # crates.io and no Git sources, so reject every resolved source that
          # could make Cargo contact or inspect a different origin before the
          # trusted cargo-deny binary gets a turn. Workspace packages omit
          # `source` and remain legitimate.
          invalid_sources="$(awk '
            /^[[:space:]]*source[[:space:]]*=[[:space:]]*/ {
              source_value = $0
              sub(/^[[:space:]]*source[[:space:]]*=[[:space:]]*/, "", source_value)
              if (source_value != "\"registry+https://github.com/rust-lang/crates.io-index\"") {
                print FNR ": " $0
              }
            }
          ' "$POLICY_TREE/Cargo.lock")"
          if [ -n "$invalid_sources" ]; then
            echo "::error::Refusing Cargo.lock with non-crates.io source before Cargo/network:" >&2
            printf '%s\n' "$invalid_sources" >&2
            exit 1
          fi

          # The graph (Cargo.toml/Cargo.lock) is PR data; the policy deciding
          # whether that graph is acceptable is from the trusted BASE ref.
          # Copy it outside POLICY_TREE and pass it explicitly below so the PR
          # cannot replace or remove the enforcement policy.
          if [ ! -f _base/deny.toml ] || [ -L _base/deny.toml ]; then
            echo "::error::Trusted BASE deny.toml is missing or not a regular file." >&2
            exit 1
          fi
          cp _base/deny.toml "$DENY_CONFIG"
          test -f "$DENY_CONFIG" && test ! -L "$DENY_CONFIG"

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # ---------------------------------------------------------------------
      # Step 2 — License allowlist cross-check.
      #
      # Strategy: parse deny.toml's [licenses].allow + bans list, then run
      # `cargo metadata --format-version 1` and verify every crate's
      # license expression is on the allowlist. Use a fail-closed check
      # so an unparseable SPDX (e.g., `SEE LICENSE IN <file>`) fails the
      # gate and forces human review.
      # ---------------------------------------------------------------------
      # Do NOT provision a toolchain on the self-hosted fleet. Per its own action.yml,
      # `dtolnay/rust-toolchain` runs `rustup toolchain install` + `rustup default`
      # against the SHARED `~/.rustup` (5 runners, one `$HOME`). That (a) can make
      # `rustc` unexecutable mid-build for every other job — it took the host down
      # for a day on 2026-06-15 — and (b) `rustup default` rewrites the MACHINE-GLOBAL
      # default, silently moving every concurrent job off the ADR-0015 reproducibility
      # pin. Full reasoning: scripts/ci-use-host-toolchain.sh header.
      #
      # ⚠️ `HOST_TRIPLE` is set EXPLICITLY, and that is what keeps this PR
      # independent of merge order. The script on `main` today resolves the
      # triple as `HOST_TRIPLE="${HOST_TRIPLE:-x86_64-apple-darwin}"` — a default
      # from when the only self-hosted fleet was the owner's Macs. On this job's
      # new Linux host it would look for
      # `$HOME/.rustup/toolchains/<channel>-x86_64-apple-darwin`, not find it,
      # and exit 1: this PR alone on `main` would break the Dependabot
      # supply-chain gate. #1501 teaches the script to detect the triple from
      # `uname`, but naming it here costs two lines and removes the coupling
      # entirely — correct whether #1501 lands first, later, or never.
      # B-133: `working-directory: _base` is LOAD-BEARING, not tidiness. The
      # script does `cd "$(git rev-parse --show-toplevel)"`, so the cwd decides
      # which `rust-toolchain.toml` it reads. Running trusted code from the PR's
      # directory would still hand it the PR's channel string. Both halves —
      # the script and the toml — come from `_base`.
      - name: Use the workspace-pinned host toolchain (from the BASE tree; provisions nothing)
        working-directory: _base
        env:
          HOST_TRIPLE: x86_64-unknown-linux-gnu
        run: bash scripts/ci-use-host-toolchain.sh

      - name: Install cargo-deny (SHA-pinned)
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b  # v2.83.4
        env:
          # install-action falls back to $HOME/.install-action/bin when the
          # trusted host Cargo is outside this per-job CARGO_HOME. Both
          # possible install locations are therefore runner.temp, never the
          # shared runner home or its credential/config stores.
          HOME: ${{ runner.temp }}/corelink-dependabot-policy-home
          CARGO_HOME: ${{ runner.temp }}/corelink-dependabot-cargo-home
        with:
          tool: cargo-deny@0.19.8
          # Never compile a fallback from PR-provided Cargo.toml, and never
          # give the installer a token it could pass to a fallback client.
          fallback: none

      - name: Run cargo-deny licenses (fail-closed)
        working-directory: ${{ runner.temp }}/corelink-dependabot-policy-tree
        env:
          POLICY_TREE: ${{ runner.temp }}/corelink-dependabot-policy-tree
          HOME: ${{ runner.temp }}/corelink-dependabot-policy-home
          CARGO_HOME: ${{ runner.temp }}/corelink-dependabot-cargo-home
          DENY_CONFIG: ${{ runner.temp }}/corelink-dependabot-deny.toml
          # install-action's pinned implementation uses this deterministic
          # per-job location when host Cargo is outside the empty CARGO_HOME.
          # Invoke its binary directly: `cargo deny` could resolve a Cargo
          # alias from an ancestor config or CARGO_ALIAS_DENY instead.
          CARGO_DENY_BIN: ${{ runner.temp }}/corelink-dependabot-policy-home/.install-action/bin/cargo-deny
        run: |
          set -euo pipefail
          echo "::group::cargo-deny licenses"
          test -x "$CARGO_DENY_BIN"
          # Source policy is intentionally included after its static lockfile
          # preflight above. The correct cargo-deny grammar puts --config on
          # the `check` subcommand, before all required checks.
          "$CARGO_DENY_BIN" --all-features --locked check --config "$DENY_CONFIG" sources licenses bans
          echo "::endgroup::"

      # ---------------------------------------------------------------------
      # Step 3 — Explicit banned-license signature scan over Cargo.lock.
      #
      # Belt-and-braces over cargo-deny: a regex sweep for AGPL/GPL/SSPL/
      # Commons-Clause/CDLA-Sharing/BUSL strings inside Cargo.lock. Catches
      # cases where cargo-deny misclassifies a SPDX expression.
      # ---------------------------------------------------------------------
      - name: Banned-license signature scan (Cargo.lock)
        env:
          HOME: ${{ runner.temp }}/corelink-dependabot-policy-home
          CARGO_HOME: ${{ runner.temp }}/corelink-dependabot-cargo-home
        run: |
          set -euo pipefail
          banned_regex='(AGPL|GPL-[23]|SSPL|Commons-Clause|BUSL|CDLA-Sharing|CDLA-Permissive-1\.0$)'
          # Search every license-bearing field in Cargo.lock. Empty match => pass.
          # NOTE: cargo-deny is the primary gate; this is the second-line check.
          if grep -E "${banned_regex}" Cargo.lock; then
            echo "::error::Banned license signature detected in Cargo.lock."
            echo "::error::Cross-reference deny.toml [licenses] + escalate per RB-DEPENDABOT-INCIDENT §4.2."
            exit 1
          fi
          echo "::notice::Cargo.lock license scan clean."

      # ---------------------------------------------------------------------
      # Step 4 — npm license scan (if PR touches a package-lock).
      # ---------------------------------------------------------------------
      - name: npm banned-license scan
        env:
          HOME: ${{ runner.temp }}/corelink-dependabot-policy-home
          CARGO_HOME: ${{ runner.temp }}/corelink-dependabot-cargo-home
        run: |
          set -euo pipefail
          banned_regex='(AGPL|GPL-[23]|SSPL|Commons-Clause|BUSL|CDLA-Sharing)'
          found=0
          mapfile -t changed_npm < <(git diff --no-ext-diff --name-only "origin/$BASE_REF"...HEAD -- '*package-lock.json' '*pnpm-lock.yaml' 'apps/**/package.json' 'crates/**/package.json' 'package.json')
          for f in "${changed_npm[@]}"; do
            if grep -E "\"license\".*${banned_regex}" -- "$f" 2>/dev/null; then
              echo "::error::Banned license in $f"
              found=1
            fi
          done
          if [[ "$found" == "1" ]]; then
            exit 1
          fi
          echo "::notice::npm license scan clean."

      # ---------------------------------------------------------------------
      # Step 5 — Commit-message hygiene: forbid skip-hook flags.
      # ---------------------------------------------------------------------
      - name: Forbid skip-hook / skip-ci flags
        env:
          HOME: ${{ runner.temp }}/corelink-dependabot-policy-home
          CARGO_HOME: ${{ runner.temp }}/corelink-dependabot-cargo-home
        run: |
          set -euo pipefail
          base="origin/$BASE_REF"
          if git log "${base}"..HEAD --format=%B | grep -E -- '--no-verify|--no-gpg-sign|\[skip ci\]|\[ci skip\]'; then
            echo "::error::Dependabot PR contains skip-hook/skip-ci marker — policy violation."
            exit 1
          fi
          echo "::notice::Commit hygiene clean."

      # ---------------------------------------------------------------------
      # Step 6 — Defence-in-depth: forbid PRs that modify governance files.
      # A dependency PR has NO business touching CODEOWNERS, signing keys,
      # release manifests, or workflow files. If it does, fail closed.
      # ---------------------------------------------------------------------
      - name: Forbid governance-file modifications
        env:
          HOME: ${{ runner.temp }}/corelink-dependabot-policy-home
          CARGO_HOME: ${{ runner.temp }}/corelink-dependabot-cargo-home
        run: |
          set -euo pipefail
          base="origin/$BASE_REF"
          mapfile -t changed < <(git diff --no-ext-diff --name-only "${base}"...HEAD)
          forbidden_regex='^(\.github/(CODEOWNERS|workflows/.*\.yml|dependabot\.yml)|SECURITY\.md|deny\.toml|cosign\.pub|\.well-known/.*|specs/_security/.*)$'
          violations=()
          for f in "${changed[@]}"; do
            if [[ "${f}" =~ ${forbidden_regex} ]]; then
              violations+=("${f}")
            fi
          done
          if (( ${#violations[@]} > 0 )); then
            echo "::error::Dependabot PR modifies forbidden files:"
            printf '::error:: - %s\n' "${violations[@]}"
            echo "::error::See RB-DEPENDABOT-INCIDENT §4.3 — manual review required."
            exit 1
          fi
          echo "::notice::No governance-file violations."

      # ---------------------------------------------------------------------
      # Step 7 — Required status checks must be present (not just green).
      #
      # A check that is `skipped` due to a path filter can let a PR slip
      # through branch protection. Verify the canonical required checks
      # have actually executed on this PR's head SHA.
      #
      # The required set is RESOLVED PER PR from the changed-file list. A flat
      # list is not just imprecise here, it is unsatisfiable: every check below
      # except `dco` is produced by a `paths:`-filtered workflow, so demanding
      # all of them on every Dependabot PR guaranteed a red gate on any PR that
      # did not touch Rust. Confirmed on #801 / #914 / #919, each of which had
      # cargo-deny + cargo-audit + secrets-matrix + dco + pnpm-audit present and
      # was failed solely on the missing crate-scoped Rust gate.
      #
      # Each regex below MIRRORS the `paths:` of the workflow that produces the
      # check. If you change a producing workflow's `paths:`, change its regex
      # here in the same PR or this gate silently drifts.
      # ---------------------------------------------------------------------
      - name: Verify required checks are present
        env:
          HOME: ${{ runner.temp }}/corelink-dependabot-policy-home
          CARGO_HOME: ${{ runner.temp }}/corelink-dependabot-cargo-home
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          base="origin/$BASE_REF"
          mapfile -t changed < <(git diff --no-ext-diff --name-only "${base}"...HEAD)
          echo "::group::Changed files (${#changed[@]})"
          printf '  %s\n' "${changed[@]}"
          echo "::endgroup::"

          # --- path -> producing-workflow trigger map -------------------------
          # .github/workflows/corelink-server.yml + corelink-adapter-host.yml
          re_rust_pr_gate='^(Cargo\.(toml|lock)|crates/corelink-(container|handler-customer|adapter-host)/.+|migrations/d1/.+|\.github/workflows/corelink-(server|adapter-host)\.yml)$'
          # .github/workflows/cargo-deny.yml
          re_cargo_deny='^(crates/.+|apps/.+|Cargo\.(toml|lock)|deny\.toml|\.github/workflows/cargo-deny\.yml)$'
          # .github/workflows/cargo-audit.yml
          re_cargo_audit='^(crates/.+|apps/.+|Cargo\.(toml|lock)|deny\.toml|\.cargo/audit\.toml|\.github/workflows/cargo-audit\.yml)$'
          # .github/workflows/secrets-drift.yml
          re_secrets='^(Cargo\.(toml|lock)|crates/.+/Cargo\.toml|apps/.+/Cargo\.toml|apps/.+/package\.json|.*wrangler\.toml|\.github/workflows/.+|crates/.+\.rs|apps/.+\.tsx?|worker/.+\.ts|docs/internal/secrets-checklist\.md|scripts/(validate_secrets_matrix|check-env-contract)\.py|scripts/secrets-checklist-verify\.sh)$'
          # .github/workflows/pnpm-audit.yml — the npm lane's presence check.
          # NOTE: this step asserts PRESENCE, never conclusion, so the chronic
          # advisory red on this job does not make the gate unsatisfiable; it
          # only proves the npm supply-chain lane actually executed.
          re_pnpm_audit='^(pnpm-lock\.yaml|package\.json|apps/.+/package\.json|worker/package\.json|crates/corelink-wasm/package\.json|\.github/workflows/pnpm-audit\.yml)$'

          matches() {
            local re="$1" f
            for f in "${changed[@]}"; do
              if [[ "$f" =~ $re ]]; then
                return 0
              fi
            done
            return 1
          }

          # dco-check.yml has NO `paths:` filter — it runs on every PR, so it is
          # unconditionally required.
          required=("dco")
          if matches "$re_rust_pr_gate"; then required+=("PR gate (crate-scoped clippy + tests)"); fi
          if matches "$re_cargo_deny";   then required+=("cargo-deny (license + advisories + sources + bans)"); fi
          if matches "$re_cargo_audit";  then required+=("cargo-audit PR gate"); fi
          if matches "$re_secrets";      then required+=("secrets-matrix drift gate"); fi
          if matches "$re_pnpm_audit";   then required+=("pnpm advisory audit"); fi

          echo "::group::Resolved required checks (${#required[@]})"
          printf '  %s\n' "${required[@]}"
          echo "::endgroup::"

          # Degradation guard: if nothing beyond `dco` resolved, this PR touches
          # no path any supply-chain gate watches. That is legitimate today only
          # for the pip lanes (requirements-ci.txt / tools/sdks/python — no
          # dedicated PR gate exists), so warn loudly instead of silently
          # passing a no-op gate.
          if (( ${#required[@]} == 1 )); then
            echo "::warning::Only \`dco\` resolved as required — no ecosystem-specific PR gate watches the changed paths. Review this Dependabot PR by hand."
          fi

          checks_json=$(gh api "repos/${REPO}/commits/${PR_HEAD_SHA}/check-runs?per_page=100")
          missing=()
          for r in "${required[@]}"; do
            if ! echo "${checks_json}" | jq -e --arg name "$r" '.check_runs[] | select(.name == $name)' > /dev/null; then
              missing+=("${r}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Required status checks missing on head SHA ${PR_HEAD_SHA}:"
            printf '::error:: - %s\n' "${missing[@]}"
            echo "::error::Dependabot PR may not be auto-mergeable until all checks run."
            exit 1
          fi
          echo "::notice::All ${#required[@]} resolved required status checks are present."

      # ---------------------------------------------------------------------
      # Step 8 — Annotate audit-log emission (deferred to audit-chain).
      # ---------------------------------------------------------------------
      - name: Policy-gate audit log
        # Dependabot metadata is data, not shell source. Passing it through
        # env and jq --arg preserves arbitrary dependency names as JSON values
        # rather than letting a quote/newline alter this `run:` program.
        env:
          AUDIT_PR_NUMBER: ${{ github.event.pull_request.number }}
          AUDIT_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          AUDIT_DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          AUDIT_UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          AUDIT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$AUDIT_PR_NUMBER" in
            ''|*[!0-9]*) echo "::error::invalid PR number in event payload" >&2; exit 1 ;;
          esac
          jq -n \
            --arg event "corelink.security.dependabot_policy_gate_pass" \
            --arg schema "corelink.audit.v1" \
            --argjson pr_number "$AUDIT_PR_NUMBER" \
            --arg ecosystem "$AUDIT_ECOSYSTEM" \
            --arg dependency_names "$AUDIT_DEPENDENCY_NAMES" \
            --arg update_type "$AUDIT_UPDATE_TYPE" \
            --arg head_sha "$AUDIT_HEAD_SHA" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{event: $event, schema: $schema, pr_number: $pr_number, ecosystem: $ecosystem,
              dependency_names: $dependency_names, update_type: $update_type,
              head_sha: $head_sha, ts: $ts}'
