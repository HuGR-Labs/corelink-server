name: corelink-reapi (WI-S01-005 + WI-S02-001)

# CI gate for the corelink-reapi crate per WI-S01-005 §13 + §14 +
# WI-S02-001 §13 (CAS read path: ByteStream::Read + HTTP GET surface +
# tenant-isolation 100k concurrent property test + read_handler_e2e
# 14 e2e scenarios + parse_read_resource_name fuzz target).
#
# PR lane: build/clippy/tests (debug + release)/doc/canonical-vectors
# smoke + WASM target build (pure-logic core, no host-server feature).
# Nightly lane: cargo-mutants kill rate + cargo-audit advisory DB scan.

on:
  pull_request:
    paths:
      - 'crates/corelink-reapi/**'
      - 'crates/corelink-hash/**'
      - 'crates/corelink-meta/**'
      - 'crates/corelink-worker/**'
      - 'crates/tenant-path/**'
      - 'specs/03_architecture/error_taxonomy.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/corelink-reapi.yml'
  # NOTE: no `push: branches:[main]`. The build/clippy/test lane compiles the
  # crate (debug + release, incl. the 100k-concurrent isolation property test) on
  # the self-hosted macOS fleet; re-running it on every main merge fed the
  # heavy-gate stampede (load 398/665, 2026-06-04; extends the 977225d3 "stop
  # heavy-gate stampede" sweep). The nightly cron below + the PR `paths:` lane
  # above keep continuous + targeted coverage.
  # ⛔ CRON REMOVED 2026-08-02 — redundant: this workflow already has a
  # `pull_request` trigger, so the code IS verified when it changes. The
  # nightly re-verified BYTE-IDENTICAL code: 10 of the last 14 days had
  # ZERO commits to main, and the self-hosted Mac (the founder's own
  # machine) was spending ~8.8 h/day on scheduled jobs, 75% of which
  # failed. A clock only earns its keep when something can change
  # WITHOUT a commit — CVE feeds, prod state, backups, certs. This
  # workflow is none of those.
  # Restore by uncommenting if this ever stops being PR-gated.
  # # Nightly full lane (mutants + audit).
  # - cron: '53 4 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # PR gate is crate-scoped only. Workspace-wide gates (fmt, clippy --workspace,
  # test --workspace, doc --workspace) live in cas_foundation.yml::workspace-build-test
  # per CI-OPT-001. cargo-audit advisory DB scan lives in cargo-audit.yml
  # per CI-OPT-004 (removes floating rustsec/audit-check@v1 ref).
  pr-gate:
    name: PR gate (crate-scoped clippy + tests + canonical vectors)
    # Runner: `corelink` — the product's own ephemeral runner fabric (wave 2,
    # 2026-08-03). This was the most expensive hosted Rust job in the repo
    # (54 min of ubuntu-latest across 5 PR runs in the 2 days to 2026-08-03),
    # which is why it leads the wave.
    #
    # The box is 4 vCPU / 12.5 GB (probe run 30825772599) against ubuntu-latest's
    # 2 vCPU / 7 GB on a private repo — twice the cores. That headroom is what
    # pays for the cache loss described below.
    #
    # ⚠️ Ephemeral-runner reality — the box carries NO cache between runs, and the
    # `Swatinem/rust-cache` step below is gated `runner.environment ==
    # 'github-hosted'` (the shared-$HOME guard), so on a corelink box it SKIPS and
    # the crate compiles cold every time. Measured, that costs far less than it
    # sounds: the image ships a pre-seeded ~/.cargo (415 MB, 362 registry entries),
    # so `cargo fetch --locked` took 12 s and a cold clippy+test+release-test cycle
    # for a crate lane ran in ~105 s on 4 cores — comparable to the warm-cache
    # hosted runs. Do NOT "fix" this by re-enabling the cache step on self-hosted:
    # that guard exists because the MAC fleet shares one $HOME and rust-cache's
    # prune step deletes a sibling job's registry mid-compile (#979/#980).
    #
    # ⚠️ A refused or dropped spawn leaves the job QUEUED, and `timeout-minutes`
    # does not bound queued time — it starts once a job is RUNNING. That is a
    # stall, not a false pass: `scripts/pre-merge-gate-check.sh` scores a pending
    # check as ⛔ DO NOT MERGE, so a stranded box blocks the PR.
    runs-on: corelink
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # actions/checkout@v7.0.0

      # `dtolnay/rust-toolchain` removed. It asked for `stable` + clippy/rustfmt,
      # but `rust-toolchain.toml` pins 1.91.1 and lists BOTH components, and
      # rustup honours that file over any `rustup default` — so 1.91.1's clippy
      # has always been what ran here, hosted included. Measured on the image
      # (probe 30825772599): the first in-repo cargo call provisioned 1.91.1 with
      # rustfmt 1.8.0 + clippy 0.1.91 in 15 s. The step below asserts it, so a
      # future image drift fails loudly instead of compiling with the wrong rustc.
      - name: Assert the workspace-pinned toolchain (rust-toolchain.toml)
        run: bash scripts/ci-assert-pinned-toolchain.sh

      - name: Cargo cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # Swatinem/rust-cache@v2.9.1
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          workspaces: ". -> target"

      # ── sccache -> CoreLink's own /cargo surface (pilot, 2026-08-03) ──────────
      #
      # This lane already runs on `corelink` (wave 2), and the rust-cache step
      # above is correctly gated to github-hosted, so it SKIPS here and the lane
      # compiles COLD every run — measured 676 s. That is the cost this removes.
      #
      # An ephemeral box has no disk to cache to, which is precisely the problem
      # CoreLink sells the answer to. `/cargo/<tenant>/<key>` is a live sccache
      # WebDAV surface on the product itself (crates/corelink-container/src/
      # routes/cargo.rs implements MKCOL/PROPFIND/DELETE for sccache's opendal
      # backend; probed in prod 2026-08-03 — GET/PUT/PROPFIND returned 401 from
      # the handler vs 404 for an unmounted path). The cache lives in the
      # product, not on the runner, so it survives the box being destroyed.
      #
      # FAIL-OPEN BY CONSTRUCTION. `SCCACHE_IGNORE_SERVER_IO_ERROR=1` degrades a
      # miss, a 5xx, or an expired token into a normal cold compile — never a red
      # gate. A build cache that can fail a build is not a cache, it is a
      # dependency. The token check below is inside the script rather than in an
      # `if:` for the same reason: no secret, no wiring, no failure.
      #
      # CARGO_INCREMENTAL=0 is required — incremental artifacts embed
      # per-invocation paths, which would make sccache store and never hit.
      - name: Point sccache at CoreLink (no-op without the secret)
        env:
          SCCACHE_TOKEN: ${{ secrets.CORELINK_SCCACHE_TOKEN }}
          SCCACHE_TENANT: ee30f7ba-fc25-4d71-939e-ebe130b4c6a3
        run: |
          set -euo pipefail
          if [ -z "${SCCACHE_TOKEN:-}" ]; then
            echo "::notice::CORELINK_SCCACHE_TOKEN absent (fork PR?) — lane compiles cold, unchanged"
            exit 0
          fi
          if ! command -v sccache >/dev/null 2>&1; then
            echo "::notice::sccache not on the box image — lane compiles cold, nothing breaks"
            exit 0
          fi
          {
            echo "RUSTC_WRAPPER=sccache"
            echo "CARGO_INCREMENTAL=0"
            echo "SCCACHE_WEBDAV_ENDPOINT=https://corelink-api.humangr.com/cargo/${SCCACHE_TENANT}"
            echo "SCCACHE_WEBDAV_TOKEN=${SCCACHE_TOKEN}"
            echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1"
          } >> "$GITHUB_ENV"
          echo "sccache -> CoreLink /cargo (fail-open)"
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b  # arduino/setup-protoc@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: cargo clippy (corelink-reapi, -D warnings)
        run: cargo clippy --package corelink-reapi --all-targets -- -D warnings

      - name: cargo test (corelink-reapi, debug)
        run: cargo test --package corelink-reapi --all-targets

      - name: cargo test (release — perf + property gates)
        run: cargo test --release --package corelink-reapi

      - name: cargo test (canonical regression vectors — fast smoke)
        run: cargo test --package corelink-reapi --test canonical_vectors

      - name: cargo test (capabilities gRPC harness)
        run: cargo test --package corelink-reapi --test capabilities

      - name: cargo test (handler e2e gRPC scenarios)
        run: cargo test --package corelink-reapi --test handler_e2e

      - name: cargo test (read handler e2e — gRPC + HTTP, WI-S02-001)
        run: cargo test --package corelink-reapi --test read_handler_e2e

      - name: cargo test (cross-tenant isolation property — 10k iter + 100k concurrent, WI-S02-001)
        run: cargo test --release --package corelink-reapi --test prop_cross_tenant_read
      # The number this pilot exists to produce. Report-only and `always()`: a
      # cache that must not fail the build must not fail its own measurement
      # either. Compare "Cache hits" vs "Cache misses" across two consecutive
      # runs — run 1 populates the cache, run 2 is the real signal.
      - name: sccache stats
        if: always()
        run: |
          command -v sccache >/dev/null 2>&1 || { echo "sccache absent — lane compiled cold"; exit 0; }
          sccache --show-stats || echo "::notice::sccache inactive on this run"

  wasm-build:
    name: WASM target build (CF Workers compile compatibility — pure-logic core)
    # Runner: `corelink` (wave 2, 2026-08-03) — see the pr-gate job above for the
    # ephemeral-box caveats (no cache between runs; a dropped spawn stalls the
    # job as ⛔ pending rather than passing it).
    runs-on: corelink
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # actions/checkout@v7.0.0
      # `dtolnay/rust-toolchain@stable` with `targets: wasm32-unknown-unknown`
      # removed — and the target question is the one worth spelling out, because
      # the image itself does NOT ship wasm32 (probe 30825772599: the box's only
      # installed target is x86_64-unknown-linux-gnu on a 1.96.0 default).
      # It is `rust-toolchain.toml` that provides it: the pin declares
      # `targets = ["wasm32-unknown-unknown", "x86_64-unknown-linux-musl"]`, and
      # rustup installs the file's targets along with the channel on first use.
      # Measured: after the 15 s provision, `rustup target add
      # wasm32-unknown-unknown` reported "up to date" and took 0 s, and
      # `cargo check --target wasm32-unknown-unknown` succeeded in 4 s.
      # Note what the removed action actually did: it added wasm32 to `stable`,
      # a toolchain cargo never uses in this repo. The assertion below verifies
      # the target on the toolchain that DOES compile, which the action never did.
      - name: Assert the workspace-pinned toolchain + wasm32 target
        run: bash scripts/ci-assert-pinned-toolchain.sh wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # Swatinem/rust-cache@v2.9.1
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          workspaces: ". -> target"
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b  # arduino/setup-protoc@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # The host-server feature pulls tonic + tokio (not wasm-friendly); we
      # check the pure-logic core (no default features) which IS the surface
      # a future tonic-web / `worker::Router` adapter will reuse on CF
      # Workers. The host-server runtime stays out of the wasm closure.
      - name: cargo check (corelink-reapi default-features off, wasm32)
        run: cargo check --package corelink-reapi --no-default-features --target wasm32-unknown-unknown

  mutants-nightly:
    name: cargo-mutants kill-rate ≥ 80%
    runs-on: [self-hosted, mac, corelink-builder]
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # actions/checkout@v7.0.0
      # Self-hosted Macs already ship rustup+cargo; re-provisioning via
      # dtolnay/rust-toolchain collides on `bin/cargo`. Put the pre-installed
      # host toolchain (workspace pins 1.91.1 via rust-toolchain.toml) on PATH
      # instead — see CLAUDE.md "the rustup proxy is broken" note.
      - name: Use the workspace-pinned host toolchain (channel read from rust-toolchain.toml)
        run: bash scripts/ci-use-host-toolchain.sh
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # Swatinem/rust-cache@v2.9.1
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          workspaces: ". -> target"
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b  # arduino/setup-protoc@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-mutants
      - run: cargo mutants --package corelink-reapi --no-shuffle --minimum-test-timeout=600
