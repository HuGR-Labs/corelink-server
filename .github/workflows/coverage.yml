name: coverage (R7-1 supply-quality rollup)

# Workspace test-coverage report (cargo-llvm-cov).
#
# Triggered on every PR touching Rust code or coverage tooling. Runs
# `scripts/coverage.sh`, uploads the HTML report as a 90-day artifact and
# surfaces the per-crate summary table in a sticky PR comment.
#
# SHA-pinned per HIGH_RISK lane FF-HR-005 + ADR-S12-045 §6 tooling-pin policy.
#
# Reference: scripts/coverage.sh, specs/_audits/sealed/2026-05-14-coverage-baseline.md

on:
  # Moved OFF per-PR 2026-06-02 to keep PRs fast (was a heavy gate). Runs
  # on a staggered schedule + on-demand. There is NO `pull_request` lane and
  # NO `push` lane — re-add one only if this must block PRs again.
  #
  # Cadence: daily -> WEEKLY Tue (CI cost diet 2026-08-01).
  # WHAT IS ACTUALLY LOST: this workflow has no PR lane, so between scheduled
  # runs there is no coverage measurement at all — the honest cost of weekly is
  # up to 7 days of coverage-trend latency, not "zero". That is acceptable here
  # and NOWHERE ELSE in this diet, because:
  #   - nothing blocks on it: it emits a trend report, not a threshold gate;
  #   - it is the single most expensive scheduled lane in the repo — measured
  #     21-46 hosted min per run on the paid 4-core runner (median ~34), i.e.
  #     ~860 min/month at daily cadence;
  #   - it produced ZERO successful scheduled runs in July 2026 (6 failure /
  #     15 cancelled out of 21), so daily cadence is currently buying no signal
  #     at all.
  # Stays `workflow_dispatch`-able for a pre-release coverage snapshot.
  schedule:
    - cron: '0 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# Serialize the heavy release/coverage cargo builds across the self-hosted
# mac fleet so two never compile against the SAME checkout `target/` dir at
# once. The group name is a SHARED LITERAL (intentionally NOT
# `${{ github.workflow }}`) so this workflow serializes AGAINST
# cas_foundation.yml's heavy build legs too: when both land on the same
# `corelink-builder-N` runner they race `target/**/deps/*.d` and fail
# intermittently with "No such file or directory" / "rustc never executed".
# `cancel-in-progress: false` queues the second run (no lost coverage); these
# are nightly crons hours apart so the queue is effectively never >1 deep.
# Keep this group name in lockstep with cas_foundation.yml.
jobs:
  coverage:
    name: cargo-llvm-cov (workspace HTML + summary)
    runs-on: ubuntu-x64-4core  # 4-core hosted: cargo-llvm-cov instruments the whole workspace (heavy link); 2-core OOMs (ld Bus error, signal 7)
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain (stable + llvm-tools-preview)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-04-29
        with:
          components: llvm-tools-preview

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        with:
          shared-key: coverage

      - name: Install protoc
        uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-llvm-cov@0.6.16

      - name: Run coverage (HTML + SUMMARY.txt)
        run: bash scripts/coverage.sh

      - name: Upload HTML report (90d retention)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html-${{ github.event.pull_request.number || 'main' }}
          path: target/coverage/html/
          retention-days: 90
          if-no-files-found: error

      - name: Render PR comment body
        id: render
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # GHA expressions + markdown backticks are
          # evaluated before bash; single-quoting them is intentional.
          {
              echo 'COMMENT<<EOF'
              echo '## Coverage report (cargo-llvm-cov)'
              echo ''
              echo 'Per-crate summary (workspace, `--no-default-features`):'
              echo ''
              echo '```'
              head -200 target/coverage/SUMMARY.txt
              echo '```'
              echo ''
              echo 'Full HTML report uploaded as GHA artifact `coverage-html-${{ github.event.pull_request.number || 'main' }}` (90d retention).'
              echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Sticky PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: corelink-coverage
          message: ${{ steps.render.outputs.COMMENT }}

      - name: Append step summary
        run: |
          set -euo pipefail
          {
              echo '## Coverage summary'
              echo ''
              echo '```'
              head -200 target/coverage/SUMMARY.txt
              echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
