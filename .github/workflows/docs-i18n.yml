name: docs i18n coverage

# WI-S18-005 deliverable 2 — i18n coverage CI gate.
# Asserts every English page has pt-BR + es-419 counterparts (or explicit
# `<!-- i18n:TODO -->` marker). Fails PR if coverage < 80 %.
# Spec contract S-18 §5.6 R-S18-12 + Quality Standard 14.s18.5.

on:
  pull_request:
    paths:
      - "apps/docs/docs/**"
      - "apps/docs/i18n/**"
      - "apps/docs/scripts/i18n-coverage.ts"
      - ".github/workflows/docs-i18n.yml"
  push:
    branches: [main]
    paths:
      - "apps/docs/docs/**"
      - "apps/docs/i18n/**"
      - "apps/docs/scripts/i18n-coverage.ts"
      - ".github/workflows/docs-i18n.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-i18n-${{ github.ref }}
  cancel-in-progress: true

jobs:
  i18n-coverage:
    name: i18n coverage (≥ 80 % en→{pt-BR, es-419})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v4.1.0
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run i18n coverage script
        working-directory: apps/docs
        run: pnpm i18n-coverage --threshold 0.8
