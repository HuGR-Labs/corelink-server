name: issue-1724-cli-provenance

on:
  pull_request:
    paths:
      - ".github/workflows/issue-1724-cli-provenance.yml"
      - ".github/workflows/issue-2050-cli-release-dry-run.yml"
      - "scripts/verify_i2050_release_dryrun_contract.py"
      - ".github/workflows/release-cli.yml"
      - ".github/workflows/release-slsa3.yml"
      - "scripts/verify_cli_release_inventory.py"
      - "tools/cli/tests/release_workflow_contract.rs"
      - "tools/cli/tests/release_workflow_contract/**"
      - "tools/cli/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: validate managed CLI provenance contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable toolchain action
        with:
          toolchain: 1.91.1
      - name: Reject provenance builder, identity, issuer, and subject mutations
        run: cargo test --locked -p corelink-cli --test release_workflow_contract -- --nocapture
      - name: Verify issue 2050's nonpublishing release dry-run contract
        run: python3 -S scripts/verify_i2050_release_dryrun_contract.py contract
      - name: Install checksum-pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" \
            --output "${archive}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${archive}" \
            | sha256sum --check --status
          mkdir -p "${RUNNER_TEMP}/actionlint"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/actionlint" actionlint
          "${RUNNER_TEMP}/actionlint/actionlint" -version
      - name: Validate the dry-run trigger and workflow schema
        run: '"${RUNNER_TEMP}/actionlint/actionlint" -color .github/workflows/issue-2050-cli-release-dry-run.yml'
