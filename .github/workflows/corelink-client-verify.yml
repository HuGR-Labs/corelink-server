name: corelink-client-verify (WI-S02-003)

# CI gate for the corelink-client-verify crate per WI-S02-003 §13 + §17.
# PR lane: build/clippy/tests (debug + release)/doc/canonical vectors smoke +
# stand-alone (no-default-features) build + WASM target build + cbindgen
# header drift + cargo-fuzz 60s smoke (both targets).
# Nightly lane: 1h fuzz + cargo-mutants kill rate + audit.

on:
  pull_request:
    paths:
      - 'crates/corelink-client-verify/**'
      - 'crates/corelink-hash/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/corelink-client-verify.yml'
  # NOTE: no `push: branches:[main]`. The build/clippy/test lane compiles the
  # crate (debug + release, stream + ffi features) on the self-hosted macOS fleet;
  # re-running it on every main merge fed the heavy-gate stampede (load 398/665,
  # 2026-06-04; extends the 977225d3 "stop heavy-gate stampede" sweep). The
  # nightly cron below + the PR `paths:` lane above keep continuous + targeted
  # coverage.
  # ⛔ CRON REMOVED 2026-08-02 — redundant: this workflow already has a
  # `pull_request` trigger, so the code IS verified when it changes. The
  # nightly re-verified BYTE-IDENTICAL code: 10 of the last 14 days had
  # ZERO commits to main, and the self-hosted Mac (the founder's own
  # machine) was spending ~8.8 h/day on scheduled jobs, 75% of which
  # failed. A clock only earns its keep when something can change
  # WITHOUT a commit — CVE feeds, prod state, backups, certs. This
  # workflow is none of those.
  # Restore by uncommenting if this ever stops being PR-gated.
  # # Nightly full lane.
  # - cron: '41 4 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # PR gate is crate-scoped only. Workspace-wide gates (fmt, clippy --workspace,
  # test --workspace, doc --workspace) live in cas_foundation.yml::workspace-build-test
  # per CI-OPT-001. cargo-audit advisory DB scan lives in cargo-audit.yml
  # per CI-OPT-004 (removes floating rustsec/audit-check@v1 ref).
  pr-gate:
    name: PR gate (crate-scoped clippy + tests + canonical vectors)
    # Runner: GitHub-hosted ubuntu-24.04 (wave 3 migration from corelink fabric).
    # Toolchain asserted via ci-assert-pinned-toolchain.sh; rust-cache gated to github-hosted.
    # Measured median ~1m57s on fabric; 30 min timeout provides ~15x headroom.
    runs-on: ubuntu-24.04
    # Sized from the measurement, not from a guess: this lane runs cold in
    # ~1 m 57 s on the fabric, and the heaviest crate lane already on it
    # (corelink-reapi::pr-gate, 8 cargo invocations incl. two release builds and
    # the 100k-concurrent isolation proptest) takes ~409-423 s. 30 min is ~4x
    # headroom over the heavier neighbour.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # actions/checkout@v7.0.0
        with:
          persist-credentials: false

      # `dtolnay/rust-toolchain` removed. It asked for `stable` + clippy/rustfmt;
      # `rust-toolchain.toml` pins 1.91.1 and lists both components, and rustup
      # honours that file over any `rustup default` — so 1.91.1's clippy is what
      # has always run here, hosted included. The assertion makes that provable
      # per run, so an image drift fails loudly instead of silently changing the
      # compiler.
      - name: Assert the workspace-pinned toolchain (rust-toolchain.toml)
        run: bash scripts/ci-assert-pinned-toolchain.sh

      - name: Cargo cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # Swatinem/rust-cache@v2.9.1
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          workspaces: ". -> target"

      - name: cargo clippy (corelink-client-verify, all features)
        run: cargo clippy --package corelink-client-verify --all-targets --features stream,ffi -- -D warnings

      - name: cargo test (client-verify, stream + ffi)
        run: cargo test --package corelink-client-verify --features stream,ffi --all-targets

      # ⚠️ The one step in this lane whose result depends on the MACHINE, not just
      # the code: `constant_time_variance_on_verify` (tests/prop_verify.rs) is a
      # nanosecond timing measurement with a 5% variance ceiling, and it has a
      # history of flaking on the shared founder Mac under load. Moving the lane
      # changes the machine, so it was measured on the destination rather than
      # assumed: this exact step passed on a corelink box (cf-runner-8e55183d) in
      # 47 s on run 30862512340, the run that introduced this change. The sibling
      # gate it was modelled on — `corelink-hash`'s `constant_time_variance`, same
      # trimmed-mean technique, same 5% threshold — likewise passed on the fabric
      # in run 30825772599. The reasoning both support: a dedicated, idle 4-vCPU
      # box is a quieter place to measure timing than a 2-vCPU hosted runner.
      # One green run is not a flake rate, though. The threshold is untouched — if
      # this starts flaking here, the fix is to move THIS lane back, not to loosen
      # the gate.
      - name: cargo test (release — perf + ct-variance gates)
        run: cargo test --release --package corelink-client-verify --features stream

      - name: cargo test (canonical vectors — fast smoke)
        run: cargo test --package corelink-client-verify canonical_vectors_verify_against_known_hex

  standalone-build:
    name: Stand-alone build (no Worker deps; AC §6.1 — FFI distribution friction)
    # Runner: GitHub-hosted ubuntu-24.04 (wave 3 migration from corelink fabric).
    # Toolchain asserted via ci-assert-pinned-toolchain.sh; rust-cache gated to github-hosted.
    # One debug build + cargo tree — lighter than pr-gate; 20 min timeout provides headroom.
    runs-on: ubuntu-24.04
    # One debug build + a `cargo tree` — strictly lighter than pr-gate's ~409 s.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # actions/checkout@v7.0.0
        with:
          persist-credentials: false
      # `dtolnay/rust-toolchain@stable` removed — `rust-toolchain.toml` pins
      # 1.91.1 and rustup honours it over any default, so 1.91.1 is what has
      # always compiled here. Asserted instead of assumed.
      - name: Assert the workspace-pinned toolchain (rust-toolchain.toml)
        run: bash scripts/ci-assert-pinned-toolchain.sh
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # Swatinem/rust-cache@v2.9.1
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          workspaces: ". -> target"
      - name: cargo build (no default features)
        run: cargo build --package corelink-client-verify --no-default-features
      - name: cargo tree (assert no Worker deps)
        run: |
          set -eux
          # Stand-alone tree must not pull `corelink-worker`, `corelink-meta`,
          # `corelink-reapi`, `corelink-tenant-path`, `tonic`, `prost`, or `worker`.
          # This is the canonical guarantee called out in WI-S02-003 §6.1
          # and §10.3.4.
          UNEXPECTED='corelink-worker|corelink-meta|corelink-reapi|corelink-tenant-path|tonic|prost|worker'
          if cargo tree --package corelink-client-verify --no-default-features --edges normal | grep -E "$UNEXPECTED"; then
            echo "ERROR: corelink-client-verify must not depend on Worker internals"
            exit 1
          fi

  wasm-build:
    name: WASM target builds (CF Workers compile compatibility)
    # Runner: GitHub-hosted ubuntu-24.04 (wave 3 migration from corelink fabric).
    # Toolchain + wasm32 target asserted via ci-assert-pinned-toolchain.sh; rust-cache gated to github-hosted.
    # Single cargo check --target wasm32 — ~4s + 15s toolchain; 20 min timeout provides headroom.
    runs-on: ubuntu-24.04
    # A single `cargo check --target wasm32` — measured at 4 s on the box for a
    # comparable crate, plus the ~15 s toolchain provision.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # actions/checkout@v7.0.0
        with:
          persist-credentials: false
      # `dtolnay/rust-toolchain@stable` with `targets: wasm32-unknown-unknown`
      # removed. The image does NOT ship wasm32 (probe 30825772599: its only
      # installed target is x86_64-unknown-linux-gnu on a 1.96.0 default) —
      # `rust-toolchain.toml` does, via
      # `targets = ["wasm32-unknown-unknown", "x86_64-unknown-linux-musl"]`,
      # which rustup installs with the channel on first use. Measured on the box:
      # after the 15 s provision, `rustup target add wasm32-unknown-unknown` said
      # "up to date" and took 0 s. The removed action added wasm32 to `stable`, a
      # toolchain cargo never uses in this repo; the assertion below checks the
      # target on the toolchain that actually compiles.
      - name: Assert the workspace-pinned toolchain + wasm32 target
        run: bash scripts/ci-assert-pinned-toolchain.sh wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # Swatinem/rust-cache@v2.9.1
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          workspaces: ". -> target"
      - name: cargo check (corelink-client-verify on wasm32-unknown-unknown)
        run: cargo check --package corelink-client-verify --target wasm32-unknown-unknown

  cbindgen-header-stable:
    name: cbindgen header drift gate (ABI stability)
    # Moved OFF ubuntu-latest 2026-08-24. The previous note kept it hosted on
    # a cost argument — `cargo install cbindgen --locked` is a source build of
    # cbindgen and its dependency tree, and only a github-hosted runner gets
    # `Swatinem/rust-cache` (the corelink fabric is ephemeral with a private
    # $HOME, so the cache step SKIPs and the build would repeat every run). The
    # note put the saving at "~$0.20/3d of hosted time" and concluded the move
    # would be net-negative.
    #
    # That arithmetic is void: hosted Actions are payment-blocked, so this job
    # does not run at all. It fails in ~2 s with no steps and an empty runner
    # name — the billing-block signature — and it blocks every PR that touches
    # this workflow. The cost of staying hosted is not $0.20, it is the gate.
    #
    # The old note named the honest fix: use a prebuilt instead of a source
    # build, "confirm `taiki-e/install-action` actually publishes a cbindgen
    # manifest (checked, not assumed — cargo-fuzz turned out to have none)".
    # Checked: it does NOT. `manifests/cbindgen.json` is a 404, exactly the
    # case that note warned about. So the prebuilt comes from upstream's own
    # release instead, SHA-256 pinned like every other tool this repo installs.
    #
    # The version is pinned to 0.29.4, which is what `cargo install cbindgen`
    # resolves to today (crates.io max_version 0.29.4) — so the generated
    # header is unchanged by this move, and a future cbindgen release can no
    # longer silently rewrite the header this gate diffs against.
    # Runner: GitHub-hosted ubuntu-24.04 (wave 3 migration from corelink fabric).
    # Prebuilt cbindgen from upstream releases; SHA-256 pinned; no toolchain provisioning.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # actions/checkout@v7.0.0
        with:
          persist-credentials: false

      # `dtolnay/rust-toolchain` removed with the move off hosted: the fleet
      # shares one $HOME, so a job that provisions a toolchain mutates
      # ~/.rustup underneath every other running job (this is what
      # scripts/validate_no_shared_rustup_mutation.py exists to stop, and it
      # caught this migration). The same pattern the sibling `corelink` lanes
      # in this file already use: assert the workspace pin instead of
      # installing one, so an image drift fails loudly rather than silently
      # changing the compiler under a header-diff gate.
      - name: Assert the workspace-pinned toolchain (rust-toolchain.toml)
        run: bash scripts/ci-assert-pinned-toolchain.sh

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # Swatinem/rust-cache@v2.9.1
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          workspaces: ". -> target"
      - name: Install cbindgen (pinned prebuilt, SHA-256 verified)
        env:
          CBINDGEN_VERSION: '0.29.4'
          CBINDGEN_SHA256_X86_64: '27ac237e2ad3ffaffc8ecce0c03e3caa1d1b09e691906c3cb0967367ff6d783d'
          CBINDGEN_SHA256_AARCH64: '1838dfc7ddfb7e941556505fa6eebc5c28553eb03118980262c760594e240bdb'
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)          asset="cbindgen-ubuntu22.04";          want="${CBINDGEN_SHA256_X86_64}" ;;
            aarch64|arm64)   asset="cbindgen-ubuntu22.04-aarch64";  want="${CBINDGEN_SHA256_AARCH64}" ;;
            *) echo "::error::no pinned cbindgen prebuilt for $(uname -m)"; exit 1 ;;
          esac
          curl -fsSL -o "${RUNNER_TEMP}/cbindgen" \
            "https://github.com/mozilla/cbindgen/releases/download/${CBINDGEN_VERSION}/${asset}"
          got="$(sha256sum "${RUNNER_TEMP}/cbindgen" | cut -d' ' -f1)"
          if [ "${got}" != "${want}" ]; then
            echo "::error::cbindgen SHA-256 pin violation"
            echo "::error::expected: ${want}"
            echo "::error::actual:   ${got}"
            exit 1
          fi
          chmod +x "${RUNNER_TEMP}/cbindgen"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/cbindgen" --version
      - name: Regenerate header
        run: |
          cbindgen \
            --crate corelink-client-verify \
            --config crates/corelink-client-verify/cbindgen.toml \
            --output /tmp/corelink_client_verify.h
      - name: Diff against committed header
        run: |
          set -eux
          diff -u \
            crates/corelink-client-verify/include/corelink_client_verify.h \
            /tmp/corelink_client_verify.h

  fuzz-smoke:
    name: cargo-fuzz smoke (60s, both targets)
    runs-on: [self-hosted, mac, corelink-builder]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # actions/checkout@v7.0.0
      # ROOT FIX (2026-06-17): do NOT use `dtolnay/rust-toolchain@nightly` here.
      # It runs `rustup` channel-update + component ops against the SHARED
      # ~/.rustup on the self-hosted Mac, deleting the `rustup` shim mid-run so
      # every ~/.cargo/bin/cargo symlink dangles → `os error 2` / exit-127
      # `cargo: command not found` on every other Rust gate AND the clw build box
      # (same host). The 89270bb9 fix did this for the other fuzz jobs but missed
      # this file. Put the pre-installed host nightly toolchain on PATH instead.
      - name: Put host nightly toolchain on PATH (cargo-fuzz needs nightly)
        run: echo "$HOME/.rustup/toolchains/nightly-x86_64-apple-darwin/bin" >> "$GITHUB_PATH"
      # `cargo install` compiles cargo-fuzz's OWN dependency tree (aws-lc-sys, syn,
      # tokio, ctutils, parking_lot …) into whatever CARGO_HOME points at. Pointed at
      # the SHARED `~/.cargo`, it mutates the registry that every other concurrent
      # Rust job on this 5-runner Mac is compiling from — and those are exactly the
      # crate names in the `os error 2` failures. cargo-fuzz is NOT pre-installed on
      # the host, so this ran on EVERY fuzz job, not just after a version bump.
      #
      # Same class as the 2026-06-15 rustup incident documented in fuzz-nightly.yml
      # (shared `~/.rustup` mutated mid-run), one level down: shared `~/.cargo`.
      # There is no prebuilt binary to switch to — cargo-fuzz has no manifest in
      # taiki-e/install-action at the SHA this repo pins, so it would silently fall
      # back to this same from-source install.
      #
      # Fix: build it into a PER-RUNNER CARGO_HOME. Isolated, so the shared registry
      # is never written; persistent, so each runner pays the compile at most once.
      - name: Install cargo-fuzz (isolated CARGO_HOME — never the shared one)
        run: |
          set -euo pipefail
          TOOLS="$HOME/.cargo-tools/${RUNNER_NAME:-default}"
          mkdir -p "$TOOLS/bin"
          echo "$TOOLS/bin" >> "$GITHUB_PATH"
          if "$TOOLS/bin/cargo-fuzz" --version 2>/dev/null | grep '0.13.1' >/dev/null; then
            echo "cargo-fuzz 0.13.1 already in $TOOLS — no compile, no shared-registry write"
          else
            echo "compiling cargo-fuzz 0.13.1 into $TOOLS (isolated from ~/.cargo)"
            CARGO_HOME="$TOOLS" cargo install cargo-fuzz --locked --version =0.13.1
          fi
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # Swatinem/rust-cache@v2.9.1
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          workspaces: "crates/corelink-client-verify/fuzz -> target"
      - name: verify_sync 60s
        working-directory: crates/corelink-client-verify
        run: cargo fuzz run verify_sync -- -max_total_time=60
      - name: verify_ffi 60s
        working-directory: crates/corelink-client-verify
        run: cargo fuzz run verify_ffi -- -max_total_time=60

  fuzz-nightly:
    name: cargo-fuzz nightly (1h each)
    runs-on: [self-hosted, mac, corelink-builder]
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # actions/checkout@v7.0.0
      # ROOT FIX (2026-06-17): do NOT use `dtolnay/rust-toolchain@nightly` here.
      # It runs `rustup` channel-update + component ops against the SHARED
      # ~/.rustup on the self-hosted Mac, deleting the `rustup` shim mid-run so
      # every ~/.cargo/bin/cargo symlink dangles → `os error 2` / exit-127
      # `cargo: command not found` on every other Rust gate AND the clw build box
      # (same host). The 89270bb9 fix did this for the other fuzz jobs but missed
      # this file. Put the pre-installed host nightly toolchain on PATH instead.
      - name: Put host nightly toolchain on PATH (cargo-fuzz needs nightly)
        run: echo "$HOME/.rustup/toolchains/nightly-x86_64-apple-darwin/bin" >> "$GITHUB_PATH"
      # `cargo install` compiles cargo-fuzz's OWN dependency tree (aws-lc-sys, syn,
      # tokio, ctutils, parking_lot …) into whatever CARGO_HOME points at. Pointed at
      # the SHARED `~/.cargo`, it mutates the registry that every other concurrent
      # Rust job on this 5-runner Mac is compiling from — and those are exactly the
      # crate names in the `os error 2` failures. cargo-fuzz is NOT pre-installed on
      # the host, so this ran on EVERY fuzz job, not just after a version bump.
      #
      # Same class as the 2026-06-15 rustup incident documented in fuzz-nightly.yml
      # (shared `~/.rustup` mutated mid-run), one level down: shared `~/.cargo`.
      # There is no prebuilt binary to switch to — cargo-fuzz has no manifest in
      # taiki-e/install-action at the SHA this repo pins, so it would silently fall
      # back to this same from-source install.
      #
      # Fix: build it into a PER-RUNNER CARGO_HOME. Isolated, so the shared registry
      # is never written; persistent, so each runner pays the compile at most once.
      - name: Install cargo-fuzz (isolated CARGO_HOME — never the shared one)
        run: |
          set -euo pipefail
          TOOLS="$HOME/.cargo-tools/${RUNNER_NAME:-default}"
          mkdir -p "$TOOLS/bin"
          echo "$TOOLS/bin" >> "$GITHUB_PATH"
          if "$TOOLS/bin/cargo-fuzz" --version 2>/dev/null | grep '0.13.1' >/dev/null; then
            echo "cargo-fuzz 0.13.1 already in $TOOLS — no compile, no shared-registry write"
          else
            echo "compiling cargo-fuzz 0.13.1 into $TOOLS (isolated from ~/.cargo)"
            CARGO_HOME="$TOOLS" cargo install cargo-fuzz --locked --version =0.13.1
          fi
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # Swatinem/rust-cache@v2.9.1
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          workspaces: "crates/corelink-client-verify/fuzz -> target"
      - name: verify_sync 3600s
        working-directory: crates/corelink-client-verify
        run: cargo fuzz run verify_sync -- -max_total_time=3600
      - name: verify_ffi 3600s
        working-directory: crates/corelink-client-verify
        run: cargo fuzz run verify_ffi -- -max_total_time=3600

  mutants-nightly:
    name: cargo-mutants kill-rate >= 80%
    runs-on: [self-hosted, mac, corelink-builder]
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # actions/checkout@v7.0.0
      # Do NOT provision a toolchain on the self-hosted fleet. Per its own action.yml,
      # `dtolnay/rust-toolchain` runs `rustup toolchain install` + `rustup default`
      # against the SHARED `~/.rustup` (5 runners, one `$HOME`). That (a) can make
      # `rustc` unexecutable mid-build for every other job — it took the host down
      # for a day on 2026-06-15 — and (b) `rustup default` rewrites the MACHINE-GLOBAL
      # default, silently moving every concurrent job off the ADR-0015 reproducibility
      # pin. Full reasoning: scripts/ci-use-host-toolchain.sh header.
      - name: Use the workspace-pinned host toolchain (provisions nothing)
        run: bash scripts/ci-use-host-toolchain.sh
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # Swatinem/rust-cache@v2.9.1
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          workspaces: ". -> target"
      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-mutants
      - run: cargo mutants --package corelink-client-verify --features stream --no-shuffle
