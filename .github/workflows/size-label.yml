# Auto-label PRs with a size bucket (XS / S / M / L / XL).
# -----------------------------------------------------------------------------
# Thresholds (lines changed = additions + deletions):
#   XS  <    10
#   S   <    50
#   M   <   200
#   L   <   500
#   XL  >=  500   → reviewer SHOULD ask author to split (see PR template L0.2).
#
# We exclude lock files and generated artifacts from the size count so a
# legitimate small change isn't punished by a `Cargo.lock` regen or pnpm
# lockfile churn.
#
# Cross-link: docs/internal/CODE-REVIEW-CHECKLIST.md L0.2 (scope < 2000 LoC,
# or clearly partitioned), .github/PULL_REQUEST_TEMPLATE.md.

name: PR Size Label

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: size-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  size:
    name: Compute size bucket
    runs-on: [self-hosted, mac, corelink-builder]
    steps:
      - name: Apply size:* label
        uses: codelytv/pr-size-labeler@4ec67706cd878fbc1c8db0a5dcd28b6bb412e85a # v1.10.2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: "size:XS"
          xs_max_size: "9"
          s_label: "size:S"
          s_max_size: "49"
          m_label: "size:M"
          m_max_size: "199"
          l_label: "size:L"
          l_max_size: "499"
          xl_label: "size:XL"
          message_if_xl: |
            This PR is labelled **`size:XL`** (>= 500 lines changed,
            excluding lockfiles and generated artifacts).

            Reviewers: per `docs/internal/CODE-REVIEW-CHECKLIST.md` row
            **L0.2**, a PR should be < 2000 LoC *or* clearly partitioned.
            Please consider asking the author to split this into:

            - one PR per logical concern (refactor → feature → tests),
            - one PR per crate or app surface, or
            - a stacked-PR chain (`main` ← `wt/foo-1` ← `wt/foo-2`).

            If the size is genuinely unavoidable (e.g. mechanical rename,
            generated code regeneration, vendored dependency), leave a
            comment explaining why and proceed with review.
          files_to_ignore: |
            "Cargo.lock"
            "pnpm-lock.yaml"
            "package-lock.json"
            "yarn.lock"
            "**/*.snap"
            "**/*.lock"
            "**/generated/**"
            "**/__generated__/**"
            "docs/api/reference/**"
