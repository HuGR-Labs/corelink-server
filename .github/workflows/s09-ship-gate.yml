name: S-09 ship gate (WI-S09-007)

# Sprint-level ship-gate workflow per WI-S09-007 §6.1.10. Drives the
# host-side cross-component prop suite + 2 RB dry-runs (RB-FM-153 +
# RB-OBS-CARDINALITY-001) + dashboard validator + validators chain so
# a regression cannot land without a CI failure.
#
# This workflow runs:
#   1. Validators (specs + INV promotion + migration additivity +
#      dashboards canonical-12 + JSON parse).
#   2. Cross-component property tests at 10k iter PR speed across the
#      6 S-09 crates (analytics + logpush + tracing + audit-chain +
#      slo + canary).
#   3. RB-FM-153 + RB-OBS-CARDINALITY-001 host-side dry-run scripts.
#   4. 12 canonical Grafana dashboards JSON parse smoke + alert rules
#      YAML parse smoke.
#   5. Aggregate gate (fan-in for required-status-checks branch
#      protection rule).
#
# All gates fail-closed (HIGH_RISK lane FF-HR-003 + FF-HR-005). Per
# WI §6.1.10 dependency chain: WI-S09-001..006 SEALED is a
# prerequisite; this workflow runs at WI-S09-007 SEAL + on every
# subsequent PR that touches analytics / logpush / tracing / audit-
# chain / slo / canary code, the canonical dashboards, the RB dry-run
# scripts, the runbooks, the alert rules YAML, or the spec contract.

on:
  pull_request:
    paths:
      - 'crates/corelink-analytics/**'
      - 'crates/corelink-logpush/**'
      - 'crates/corelink-tracing/**'
      - 'crates/corelink-audit-chain/**'
      - 'crates/corelink-slo/**'
      - 'crates/corelink-canary/**'
      - 'specs/05_quality/runbooks/RB-FM-153-grafana-cloud-outage.md'
      - 'specs/05_quality/runbooks/RB-OBS-CARDINALITY-001.md'
      - 'scripts/rb_fm_153_dry_run.sh'
      - 'scripts/rb_obs_cardinality_001_dry_run.sh'
      - 'dashboards/grafana/DASH-*.json'
      - 'dashboards/alerts/dash-slo-multi-burn.yml'
      - 'specs/04_sprints/S09/**'
      - '.github/workflows/s09-ship-gate.yml'
  push:
    branches: [main]
    paths:
      - 'crates/corelink-analytics/**'
      - 'crates/corelink-logpush/**'
      - 'crates/corelink-tracing/**'
      - 'crates/corelink-audit-chain/**'
      - 'crates/corelink-slo/**'
      - 'crates/corelink-canary/**'
      - 'specs/05_quality/runbooks/RB-FM-153-grafana-cloud-outage.md'
      - 'specs/05_quality/runbooks/RB-OBS-CARDINALITY-001.md'
      - 'scripts/rb_fm_153_dry_run.sh'
      - 'scripts/rb_obs_cardinality_001_dry_run.sh'
      - 'dashboards/grafana/DASH-*.json'
      - 'dashboards/alerts/dash-slo-multi-burn.yml'
      - 'specs/04_sprints/S09/**'
      - '.github/workflows/s09-ship-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # --------------------------------------------------------------------
  # 1. Validators chain (specs schema + INV promotion + migration additivity + dashboards canonical-12).
  # --------------------------------------------------------------------
  validators:
    name: validators (specs + INV + migrations + dashboards)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install -r requirements-ci.txt

      - name: validate_specs.py
        run: python3 scripts/validate_specs.py

      - name: validate_inv_promotion.py
        run: python3 scripts/validate_inv_promotion.py

      - name: validate_references.py
        run: python3 scripts/validate_references.py

      - name: check_migrations_additive.py
        run: python3 scripts/check_migrations_additive.py

      - name: validate_dashboards.py
        run: python3 scripts/validate_dashboards.py

  # --------------------------------------------------------------------
  # 2. Cross-component property tests + lib unit at PR speed.
  # --------------------------------------------------------------------
  prop-and-tests:
    name: corelink-{analytics,logpush,tracing,audit-chain,slo,canary} tests (lib + prop @ 10k iter)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-04-29

      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        with:
          workspaces: ". -> target"

      - uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: cargo test -p corelink-analytics --all-targets
        run: cargo test -p corelink-analytics --all-targets

      - name: cargo test -p corelink-logpush --all-targets
        run: cargo test -p corelink-logpush --all-targets

      - name: cargo test -p corelink-tracing --all-targets
        run: cargo test -p corelink-tracing --all-targets

      - name: cargo test -p corelink-audit-chain --all-targets
        run: cargo test -p corelink-audit-chain --all-targets

      - name: cargo test -p corelink-slo --all-targets
        run: cargo test -p corelink-slo --all-targets

      - name: cargo test -p corelink-canary --all-targets
        run: cargo test -p corelink-canary --all-targets

      - name: cargo clippy -- -D warnings
        run: cargo clippy --workspace --all-targets --features corelink-worker/tower-middleware -- -D warnings

  # --------------------------------------------------------------------
  # 3. RB-FM-153 + RB-OBS-CARDINALITY-001 host-side dry-run scripts.
  # --------------------------------------------------------------------
  rb-dry-runs:
    name: RB-FM-153 + RB-OBS-CARDINALITY-001 host-side dry-runs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [prop-and-tests]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-04-29

      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        with:
          workspaces: ". -> target"

      - uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: RB-FM-153 dry-run (Grafana Cloud outage)
        run: bash scripts/rb_fm_153_dry_run.sh

      - name: RB-OBS-CARDINALITY-001 dry-run (cardinality explosion)
        run: bash scripts/rb_obs_cardinality_001_dry_run.sh

  # --------------------------------------------------------------------
  # 4. 12 canonical Grafana dashboards JSON + alert rules YAML parse smoke.
  # --------------------------------------------------------------------
  dashboard-smoke:
    name: DASH-* + dash-slo-multi-burn parse smoke
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Install Python deps (yaml + json)
        run: pip install pyyaml

      - name: 12 canonical DASH-*.json parse smoke
        run: |
          python3 -c "
          import json, glob, sys
          paths = sorted(glob.glob('dashboards/grafana/DASH-*.json'))
          assert len(paths) >= 12, f'expected ≥ 12 canonical dashboards; found {len(paths)}'
          for p in paths:
              with open(p) as f:
                  json.load(f)
              print(f'parsed: {p}')
          "

      - name: dash-slo-multi-burn.yml parse smoke
        run: python3 -c "import yaml; yaml.safe_load(open('dashboards/alerts/dash-slo-multi-burn.yml'))"

  # --------------------------------------------------------------------
  # 5. Aggregate gate (fan-in for required-status-checks branch
  #    protection rule).
  # --------------------------------------------------------------------
  s09-ship-gate:
    name: S-09 ship gate (aggregate)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: [validators, prop-and-tests, rb-dry-runs, dashboard-smoke]
    steps:
      - name: Aggregate
        run: echo "S-09 ship gate green; all canonical sub-gates passed."
