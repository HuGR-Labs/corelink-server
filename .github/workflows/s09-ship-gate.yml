name: S-09 ship gate (WI-S09-007)

# Sprint-level ship-gate workflow per WI-S09-007 §6.1.10. Drives the
# host-side cross-component prop suite + 2 RB dry-runs (RB-FM-153 +
# RB-OBS-CARDINALITY-001) + dashboard validator + validators chain so
# a regression cannot land without a CI failure.
#
# This workflow runs:
#   1. Validators (specs + INV promotion + migration additivity +
#      dashboards canonical-12 + JSON parse).
#   2. Cross-component property tests at 10k iter PR speed across the
#      6 S-09 crates (analytics + logpush + tracing + audit-chain +
#      slo + canary).
#   3. RB-FM-153 + RB-OBS-CARDINALITY-001 host-side dry-run scripts.
#   4. 12 canonical Grafana dashboards JSON parse smoke + alert rules
#      YAML parse smoke.
#   5. Aggregate gate (fan-in for required-status-checks branch
#      protection rule).
#
# All gates fail-closed (HIGH_RISK lane FF-HR-003 + FF-HR-005). Per
# WI §6.1.10 dependency chain: WI-S09-001..006 SEALED is a
# prerequisite; this workflow runs at WI-S09-007 SEAL + on every
# subsequent PR that touches analytics / logpush / tracing / audit-
# chain / slo / canary code, the canonical dashboards, the RB dry-run
# scripts, the runbooks, the alert rules YAML, or the spec contract.

on:
  pull_request:
    paths:
      - 'crates/corelink-analytics/**'
      - 'crates/corelink-telemetry/**'
      - 'crates/corelink-tracing/**'
      - 'crates/corelink-audit-chain/**'
      - 'crates/corelink-slo/**'
      - 'specs/05_quality/runbooks/RB-FM-153-grafana-cloud-outage.md'
      - 'specs/05_quality/runbooks/RB-OBS-CARDINALITY-001.md'
      - 'scripts/rb_fm_153_dry_run.sh'
      - 'scripts/rb_obs_cardinality_001_dry_run.sh'
      - 'dashboards/grafana/DASH-*.json'
      - 'dashboards/alerts/dash-slo-multi-burn.yml'
      - 'specs/04_sprints/S09/**'
      - '.github/workflows/s09-ship-gate.yml'
  # Cadence: daily -> WEEKLY (CI cost diet 2026-08-01). The `pull_request`
  # paths: lane above still gates EVERY diff that can regress this sprint's
  # surface; the schedule is only belt-and-braces re-execution for a SEALED
  # sprint, and it fans out to 4 hosted jobs (2 of them full Rust builds).
  schedule:
    - cron: '0 9 * * 4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # --------------------------------------------------------------------
  # NOTE (CI-OPT-003): The `validators` job (validate_specs/inv/refs +
  # check_migrations_additive + validate_dashboards) has been moved to
  # `spec_validation.yml` + `dashboard_validation.yml` as the single
  # sources of truth. Branch protection requires
  # `spec_validation / spec-validation` AND
  # `dashboard_validation / dashboard-validation` as separate REQUIRED
  # status checks on all PRs touching `specs/**` or `dashboards/**`, so
  # removing the duplicate validators job here does not weaken the gate.
  # --------------------------------------------------------------------
  # 1. Cross-component property tests + lib unit at PR speed.
  # --------------------------------------------------------------------
  prop-and-tests:
    name: corelink-{analytics,telemetry,tracing,audit-chain,slo} tests (lib + prop @ 10k iter)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-04-29

      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        with:
          workspaces: ". -> target"

      - uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: cargo test -p corelink-analytics --all-targets
        run: cargo test -p corelink-analytics --all-targets

      - name: cargo test -p corelink-telemetry --all-targets
        run: cargo test -p corelink-telemetry --all-targets

      - name: cargo test -p corelink-tracing --all-targets
        run: cargo test -p corelink-tracing --all-targets

      - name: cargo test -p corelink-audit-chain --all-targets
        run: cargo test -p corelink-audit-chain --all-targets

      - name: cargo test -p corelink-slo --all-targets
        run: cargo test -p corelink-slo --all-targets

      - name: cargo clippy -- -D warnings
        run: cargo clippy --workspace --all-targets --features corelink-worker/tower-middleware -- -D warnings

  # --------------------------------------------------------------------
  # 2. RB-FM-153 + RB-OBS-CARDINALITY-001 host-side dry-run scripts.
  # --------------------------------------------------------------------
  rb-dry-runs:
    name: RB-FM-153 + RB-OBS-CARDINALITY-001 host-side dry-runs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [prop-and-tests]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-04-29

      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        with:
          workspaces: ". -> target"

      - uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: RB-FM-153 dry-run (Grafana Cloud outage)
        run: bash scripts/rb_fm_153_dry_run.sh

      - name: RB-OBS-CARDINALITY-001 dry-run (cardinality explosion)
        run: bash scripts/rb_obs_cardinality_001_dry_run.sh

  # --------------------------------------------------------------------
  # 3. 12 canonical Grafana dashboards JSON + alert rules YAML parse smoke.
  # --------------------------------------------------------------------
  dashboard-smoke:
    name: DASH-* + dash-slo-multi-burn parse smoke
    # Runner: self-hosted mac fleet (CI cost diet 2026-08-01) — a JSON/YAML
    # parse smoke that still costs a full paid minute under the hosted
    # 1-MINUTE-PER-JOB FLOOR. The step comment below already documents the
    # system-python3 idiom written FOR this fleet.
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # No actions/setup-python: the self-hosted mac fleet cannot provision
      # Python via setup-python (RUNNER_TOOL_CACHE is unset, falls back to
      # the unwritable /Users/runner hosted path and dies with
      # `mkdir: /Users/runner: Permission denied`). Use system python3
      # and ensure pyyaml is available (mirrors spec_validation.yml). (2026-06-03)
      - name: Ensure pyyaml (system python3)
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null && exit 0
          python3 -m venv .venv-smoke
          .venv-smoke/bin/pip install --quiet pyyaml
          echo "$PWD/.venv-smoke/bin" >> "$GITHUB_PATH"

      - name: 12 canonical DASH-*.json parse smoke
        run: |
          python3 -c "
          import json, glob, sys
          paths = sorted(glob.glob('dashboards/grafana/DASH-*.json'))
          assert len(paths) >= 12, f'expected ≥ 12 canonical dashboards; found {len(paths)}'
          for p in paths:
              with open(p) as f:
                  json.load(f)
              print(f'parsed: {p}')
          "

      - name: dash-slo-multi-burn.yml parse smoke
        run: python3 -c "import yaml; yaml.safe_load(open('dashboards/alerts/dash-slo-multi-burn.yml'))"

  # --------------------------------------------------------------------
  # 4. Aggregate gate (fan-in for required-status-checks branch
  #    protection rule).
  # --------------------------------------------------------------------
  s09-ship-gate:
    name: S-09 ship gate (aggregate)
    # Runner: self-hosted mac fleet (CI cost diet 2026-08-01) — a fan-in
    # `echo` that still costs a full paid minute under the hosted
    # 1-MINUTE-PER-JOB FLOOR.
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 1
    needs: [prop-and-tests, rb-dry-runs, dashboard-smoke]
    steps:
      - name: Aggregate
        run: echo "S-09 ship gate green; all canonical sub-gates passed."
