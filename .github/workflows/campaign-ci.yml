name: billing campaign CI

# Deliberately manual: this is the single remote entry point for the billing
# campaign.  Every suite below is versioned here and selected by a closed
# choice; no input is ever interpolated into a shell command.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Campaign suite to run
        required: true
        type: choice
        options:
          - i1629
          - i1630
          - i1631
          - i1632
          - i1636
          - i1638
          - i1639
          - i1639-ts
          - i1628
          - i1685
          - i1675
          - i1686
          - i1662
          - i1678
          - i1666
          - i1672
          - i1669
          - i1671
          - i1668
          - i1673
          - i1670
          - i1722
          - i1721
          - i1665
          - i1700
          - i1687
          - i1688
          - i1663
          - i1674
          - i1650-contract
          - i1649-contract
          - i1659-dry
          - i1809-b063-archive-replay
          - i1810-b046-object-lock
          - i1811-b032-vendor-review
          - i1641-pagerduty-contract
          - i1654-d1-residency-contract
          - i1655-sla-credit-contract
          - i1670-enospc-linker
          - i1680-schema-contract
          - i1792-miniflare-epoch
          - i2013-migration-replay

permissions:
  contents: read

concurrency:
  group: campaign-ci-${{ github.ref }}-${{ inputs.suite }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  signup-worker-vitest:
    name: campaign i1639 TypeScript entitlement tests
    if: ${{ inputs.suite == 'i1639-ts' && github.repository == 'HuGR-dev/corelink-server' && github.repository_id == '1232040291' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the dispatched revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @corelink/signup-worker... --ignore-scripts

      - name: Verify signup-worker lockfile pin
        run: python3 scripts/check_signup_worker_pin.py

      - name: Run signup-worker provider authority and D1 batch test
        working-directory: apps/signup-worker
        run: pnpm exec vitest run tests/runner_entitlement_authority.test.ts

  campaign:
    name: campaign ${{ inputs.suite }}
    if: ${{ inputs.suite != 'i1639-ts' && github.repository == 'HuGR-dev/corelink-server' && github.repository_id == '1232040291' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install the workspace Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable toolchain action
        with:
          toolchain: 1.91.1
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: . -> target
          shared-key: campaign-${{ inputs.suite }}

      - name: Install Python for seam checks
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.6.0
        with:
          python-version: '3.12'

      - name: Set up pnpm for the worker lane
        if: ${{ inputs.suite == 'i1662' || inputs.suite == 'i1671' || inputs.suite == 'i1678' || inputs.suite == 'i1792-miniflare-epoch' }}
        uses: ./.github/actions/setup-pnpm

      - name: Set up Node.js for the worker lane
        if: ${{ inputs.suite == 'i1662' || inputs.suite == 'i1671' || inputs.suite == 'i1678' || inputs.suite == 'i1792-miniflare-epoch' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pinned worker dependencies
        if: ${{ inputs.suite == 'i1662' || inputs.suite == 'i1671' }}
        shell: bash
        run: pnpm install --frozen-lockfile --filter worker... --ignore-scripts

      - name: Install pinned signup-worker dependencies
        if: ${{ inputs.suite == 'i1678' }}
        shell: bash
        run: pnpm install --frozen-lockfile --filter @corelink/signup-worker... --ignore-scripts

      - name: Install pytest for seam checks
        shell: bash
        run: python -m pip install pytest pyyaml

      - name: Install protoc for the Rust lanes
        if: ${{ inputs.suite == 'i1629' || inputs.suite == 'i1630' || inputs.suite == 'i1631' || inputs.suite == 'i1632' || inputs.suite == 'i1636' || inputs.suite == 'i1638' || inputs.suite == 'i1639' || inputs.suite == 'i1628' || inputs.suite == 'i1671' || inputs.suite == 'i1668' || inputs.suite == 'i1722' || inputs.suite == 'i1665' || inputs.suite == 'i1663' || inputs.suite == 'i1809-b063-archive-replay' }}
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0

      - name: Prepare bounded campaign log directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/campaign-ci
          echo "ref=${GITHUB_REF} sha=${GITHUB_SHA}" | tee artifacts/campaign-ci/run.txt

      - name: i1629 exact focused container SQL test
        if: ${{ inputs.suite == 'i1629' }}
        shell: bash
        run: |
          set -euo pipefail
          test_name='webhook_inbox_d1::tests::effect_witness_and_completion_share_one_fenced_transaction'
          cargo test --locked -p corelink-server --lib "$test_name" -- --exact --nocapture 2>&1 | tee artifacts/campaign-ci/i1629.log
          grep -F "test ${test_name} ... ok" artifacts/campaign-ci/i1629.log

      - name: i1631 multi-period, seam, and migration checks
        if: ${{ inputs.suite == 'i1631' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            python3 -m pytest -q tests/test_billing_aggregate_runner_multi_period.py tests/test_runner_aggregate_durable_state.py
            python3 scripts/test_billing_aggregate_runner_multi_period.py
            cargo test --locked -p corelink-runner-aggregate --all-targets -- --nocapture
            cargo test --locked -p corelink-ops --test migrations_d1_migration_integration -- --nocapture
          } 2>&1 | tee artifacts/campaign-ci/i1631.log

      - name: i1630 cumulative shadow concurrency fence
        if: ${{ inputs.suite == 'i1630' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            python3 -m pytest -q tests/test_billing_aggregate_runner_multi_period.py
            python3 scripts/test_billing_aggregate_runner_multi_period.py
            cargo test --locked -p corelink-runner-aggregate --all-targets -- --nocapture
            cargo clippy --locked -p corelink-runner-aggregate --all-targets -- -D warnings
            cargo fmt --all --check
          } 2>&1 | tee artifacts/campaign-ci/i1630.log

      - name: i1632 format, runner checkout, Stripe, and container checks
        if: ${{ inputs.suite == 'i1632' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            cargo fmt --all --check
            cargo test --locked -p corelink-tier-selection --lib runner_checkout -- --nocapture
            cargo clippy --locked -p corelink-tier-selection --all-targets -- -D warnings
            cargo test --locked -p corelink-stripe-real --tests -- --nocapture
            cargo clippy --locked -p corelink-stripe-real --all-targets -- -D warnings
            cargo check --locked -p corelink-server --all-targets
          } 2>&1 | tee artifacts/campaign-ci/i1632.log

      - name: i1636 billing ingest domain checks
        if: ${{ inputs.suite == 'i1636' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            cargo fmt --all --check
            cargo test --locked -p corelink-server --lib billing_ingest::tests_ -- --nocapture
            cargo clippy --locked -p corelink-server --all-targets -- -D warnings
          } 2>&1 | tee artifacts/campaign-ci/i1636.log

      - name: i1638 materializer, E2E, billing D1, and clippy checks
        if: ${{ inputs.suite == 'i1638' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            cargo test --locked -p corelink-billing-stripe-materializer --lib --tests -- --nocapture
            cargo test --locked -p corelink-billing-stripe-materializer --test materializers_e2e -- --nocapture
            cargo test --locked -p corelink-server --lib billing_d1 -- --nocapture
            cargo clippy --locked -p corelink-billing-stripe-materializer --all-targets -- -D warnings
            cargo clippy --locked -p corelink-server --all-targets -- -D warnings
          } 2>&1 | tee artifacts/campaign-ci/i1638.log

      - name: i1639 provider authority and D1 fence behavior
        if: ${{ inputs.suite == 'i1639' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            cargo test --locked -p corelink-billing-stripe-materializer runner_cas_ -- --nocapture
            cargo test --locked -p corelink-billing-stripe-materializer same_second_reversed_id -- --nocapture
            cargo test --locked -p corelink-billing-stripe-materializer authority_mismatch_and_non_runner_fail_closed -- --exact --nocapture
            cargo test --locked -p corelink-server --lib current_subscription_authority::tests -- --nocapture
          } 2>&1 | tee artifacts/campaign-ci/i1639.log

      - name: i1628 focused CAS liability and decorator checks
        if: ${{ inputs.suite == 'i1628' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            cargo test --locked -p corelink-server --lib cas -- --nocapture
            cargo test --locked -p corelink-billing --test quota_cas_prop_quota_cas -- --nocapture
            cargo fmt --all --check
            cargo clippy --locked -p corelink-server --all-targets -- -D warnings
            cargo clippy --locked -p corelink-billing --all-targets -- -D warnings
            cargo test --locked -p corelink-ops --test migrations_d1_migration_integration -- --nocapture
          } 2>&1 | tee artifacts/campaign-ci/i1628.log

      - name: i1685 exact Buck2 CI test
        if: ${{ inputs.suite == 'i1685' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_i1685_buck2_ci.py 2>&1 | tee artifacts/campaign-ci/i1685.log

      - name: i1675 exact timeout receipt test
        if: ${{ inputs.suite == 'i1675' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_i1675_timeout_receipts.py 2>&1 | tee artifacts/campaign-ci/i1675.log

      - name: i1686 exact fuzz nightly checks
        if: ${{ inputs.suite == 'i1686' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            python3 scripts/verify_i1686_fuzz_nightly.py --self-test
            python3 -m pytest -q tests/test_verify_i1686_fuzz_nightly.py
          } 2>&1 | tee artifacts/campaign-ci/i1686.log

      - name: i1662 exact worker cache and auth tests
        if: ${{ inputs.suite == 'i1662' }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir worker exec vitest run tests/pat_verify_cache.test.ts tests/runner_mint.test.ts tests/auth_rotate.test.ts 2>&1 | tee artifacts/campaign-ci/i1662.log

      - name: i1678 exact DSR queue isolation checks
        if: ${{ inputs.suite == 'i1678' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            pnpm --dir apps/signup-worker test -- dsr_consumer.test.ts
            pnpm --dir apps/signup-worker typecheck
          } 2>&1 | tee artifacts/campaign-ci/i1678.log

      - name: i1666 exact nightly mutants lane contract checks
        if: ${{ inputs.suite == 'i1666' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            python3 -m pytest -q tests/test_verify_b113_lane_population.py
            python3 scripts/verify_b113_lane_population.py
          } 2>&1 | tee artifacts/campaign-ci/i1666.log

      - name: i1672 exact smoke-install contract check
        if: ${{ inputs.suite == 'i1672' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_i1672_smoke_install_contract.py 2>&1 | tee artifacts/campaign-ci/i1672.log

      - name: i1669 exact residency writer checks
        if: ${{ inputs.suite == 'i1669' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            python3 -m pytest -q tests/test_audit_outbox_residency_runtime.py
            python3 -m pytest -q tests/test_probe_i1669_readonly.py
            python3 scripts/verify_b071_fence.py
          } 2>&1 | tee artifacts/campaign-ci/i1669.log

      - name: i1671 exact Server-Timing attribution checks
        if: ${{ inputs.suite == 'i1671' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            cargo test --locked -p corelink-server --lib origin_timing -- --nocapture
            python3 scripts/test_b103_b129_attribution.py
            pnpm --dir worker exec vitest run tests/server_timing_origin_subphases.test.ts
          } 2>&1 | tee artifacts/campaign-ci/i1671.log

      - name: i1668 exact audit drain fallback checks
        if: ${{ inputs.suite == 'i1668' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p corelink-server --lib audit_drain -- --nocapture 2>&1 | tee artifacts/campaign-ci/i1668.log

      - name: i1673 exact Semgrep policy checks
        if: ${{ inputs.suite == 'i1673' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            python3 scripts/verify_b139_semgrep.py --self-test
            python3 -m pytest -q tests/test_verify_b139_prtarget_data_boundary.py
            python3 -m pytest -q tests/test_b139_semgrep_bundle.py tests/test_b139_ffi_pinned_install.py tests/test_b139_shell_a.py tests/test_b139_shell_b.py
          } 2>&1 | tee artifacts/campaign-ci/i1673.log

      - name: i1670 exact runner classification checks
        if: ${{ inputs.suite == 'i1670' }}
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test_classify_runner_failure.sh 2>&1 | tee artifacts/campaign-ci/i1670.log

      - name: i1722 exact sanitized Terraform evidence checks
        if: ${{ inputs.suite == 'i1722' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            python3 scripts/test_sanitize_terraform_drift.py
            python3 scripts/test_terraform_drift_auth_contract.py
            cargo test --locked -p corelink-terraform-drift-consumer --all-targets -- --nocapture
          } 2>&1 | tee artifacts/campaign-ci/i1722.log

      - name: i1721 exact Terraform state topology checks
        if: ${{ inputs.suite == 'i1721' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            python3 scripts/test_terraform_drift_region_contract.py
            python3 scripts/test_terraform_drift_state_contract.py
            bash -n scripts/terraform_drift_plan.sh
          } 2>&1 | tee artifacts/campaign-ci/i1721.log

      - name: i2013 migration replay and additive property gates
        if: ${{ inputs.suite == 'i2013-migration-replay' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            python3 scripts/test_terraform_drift_region_contract.py
            cargo test --locked -p corelink-ops \
              --test migrations_d1_migration_integration -- --nocapture
            cargo test --locked -p corelink-ops \
              --test migrations_prop_migration_additivity -- --nocapture
          } 2>&1 | tee artifacts/campaign-ci/i2013-migration-replay.log

      - name: i1665 B-112 hosted release-chain contract
        if: ${{ inputs.suite == 'i1665' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            python3 scripts/verify_b112_release_root_cause.py
            python3 -m pytest -q tests/test_cli_release_b112_behavior.py
            cargo test --locked -p corelink-cli --test release_workflow_contract -- --nocapture
            cargo fmt --all --check
          } 2>&1 | tee artifacts/campaign-ci/i1665.log

      - name: i1700 staging target contract
        if: ${{ inputs.suite == 'i1700' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            python3 scripts/verify_staging_target.py
            python3 scripts/verify_staging_topology_contract.py --expect ready
            python3 -m unittest -q \
              tests/test_verify_staging_target.py \
              tests/test_verify_staging_topology_contract.py
          } 2>&1 | tee artifacts/campaign-ci/i1700.log

      - name: i1687 endurance lane contract
        if: ${{ inputs.suite == 'i1687' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_i1687_endurance_lane.py 2>&1 | tee artifacts/campaign-ci/i1687.log

      - name: i1688 bounded load lane contract
        if: ${{ inputs.suite == 'i1688' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -q tests/test_validate_load_target_receipt.py 2>&1 | tee artifacts/campaign-ci/i1688.log

      - name: i1663 exact adapter cache store phase test
        if: ${{ inputs.suite == 'i1663' }}
        shell: bash
        run: |
          set -euo pipefail
          test_name='adapter_cache::tests::put_records_the_store_phase_exactly_once'
          cargo test --locked -p corelink-server --lib "$test_name" -- --exact --nocapture 2>&1 | tee artifacts/campaign-ci/i1663.log
          grep -F "test ${test_name} ... ok" artifacts/campaign-ci/i1663.log

      - name: i1670 bounded ENOSPC and linker classification
        if: ${{ inputs.suite == 'i1670-enospc-linker' }}
        shell: bash
        run: |
          set -euo pipefail
          # /dev/shm is a runner-provided tmpfs writable by the job user.  The
          # fixture fills only that bounded filesystem, so setup needs no
          # mount, sudo, or privileged loop device and cannot consume the
          # runner's workspace disk.
          root="${RUNNER_TEMP:-/tmp}/i1670"
          fs_root="/dev/shm/corelink-i1670-${GITHUB_RUN_ID:-$$}"
          mkdir -p "$root" "$fs_root" artifacts/campaign-ci/i1670
          cleanup() {
            set +e
            rm -rf "$root"
            rm -rf "$fs_root"
          }
          trap cleanup EXIT

          fill_to_margin() {
            local fill="$1"
            local available
            available="$(df --output=avail -B1 "$fs_root" | awk 'NR == 2 { print $1 }')"
            test -n "$available"
            test "$available" -gt $((1024 * 1024))
            python3 - "$fill" $((available - 64 * 1024)) <<'PY'
          import os
          import sys

          path, target = sys.argv[1], int(sys.argv[2])
          chunk = b"\0" * (1024 * 1024)
          with open(path, "wb", buffering=0) as handle:
              remaining = target
              while remaining:
                  written = handle.write(chunk[: min(len(chunk), remaining)])
                  if written <= 0:
                      raise SystemExit("bounded tmpfs fill made no progress")
                  remaining -= written
              os.fsync(handle.fileno())
          PY
          }

          # The margin fill leaves setup headroom for metadata, but a tiny
          # linker output can still fit in that margin.  Consume the measured
          # remaining blocks with a bounded second file after every setup step;
          # commands, objects, logs, and reports stay outside this tmpfs while
          # the output directory metadata is created before the drain.
          drain_remaining_blocks() {
            local fill="$1" available block_size max_blocks drain_rc remaining
            block_size="$(stat -fc '%S' "$fs_root")"
            available="$(df --output=avail -B1 "$fs_root" | awk 'NR == 2 { print $1 }')"
            test "$block_size" -gt 0
            test "$available" -ge "$block_size"
            max_blocks=$((available / block_size + 2))
            test "$max_blocks" -le 1048576
            set +e
            timeout --signal=TERM 30s \
              dd if=/dev/zero of="$fill" bs="$block_size" count="$max_blocks" status=none
            drain_rc=$?
            set -e
            remaining="$(df --output=avail -B1 "$fs_root" | awk 'NR == 2 { print $1 }')"
            case "$drain_rc" in
              0|1) ;;
              *) echo "bounded tmpfs drain failed with status $drain_rc" >&2; return 1 ;;
            esac
            test "$remaining" -lt "$block_size"
            printf '%s\n' "$remaining"
          }

          mkdir -p "$fs_root/out"
          fill_to_margin "$fs_root/fill.bin"
          enospc_remaining="$(drain_remaining_blocks "$fs_root/enospc-drain.bin")"
          set +e
          CORELINK_CLASSIFICATION_ARTIFACT="$PWD/artifacts/campaign-ci/i1670/enospc-classification.json" \
            scripts/run-with-infra-classification.sh \
            dd if=/dev/zero of="$fs_root/write.bin" bs=1M count=1 status=none \
            >artifacts/campaign-ci/i1670/enospc.log 2>&1
          enospc_rc=$?
          set -e
          test "$enospc_rc" -ne 0
          grep -Eq '^classification: (ENOSPC|LINKER_FAILURE)$' artifacts/campaign-ci/i1670/enospc.log

          rm -rf "$fs_root"
          mkdir -p "$fs_root"
          mkdir -p "$fs_root/out"
          cat >"$root/main.c" <<'EOF'
          int main(void) { return 0; }
          EOF
          cc -c "$root/main.c" -o "$root/main.o"
          linker_cmd="$root/linker.sh"
          cat >"$linker_cmd" <<'EOF'
          set -e
          cc "$1" -o "$2"
          EOF
          chmod 700 "$linker_cmd"
          fill_to_margin "$fs_root/fill.bin"
          linker_remaining="$(drain_remaining_blocks "$fs_root/linker-drain.bin")"
          set +e
          CORELINK_CLASSIFICATION_ARTIFACT="$PWD/artifacts/campaign-ci/i1670/linker-classification.json" \
            scripts/run-with-infra-classification.sh \
            bash "$linker_cmd" "$root/main.o" "$fs_root/out/linked" \
            >artifacts/campaign-ci/i1670/linker.log 2>&1
          linker_rc=$?
          set -e
          test "$linker_rc" -ne 0
          grep -Eq '^classification: (ENOSPC|LINKER_FAILURE)$' artifacts/campaign-ci/i1670/linker.log
          grep -Eq 'No space left on device|os error 28|ENOSPC|collect2|ld:' artifacts/campaign-ci/i1670/linker.log
          test -s artifacts/campaign-ci/i1670/enospc-classification.json
          test -s artifacts/campaign-ci/i1670/linker-classification.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/campaign-ci/i1670")
          for name in ("enospc-classification.json", "linker-classification.json"):
              classification = json.loads((root / name).read_text())["classification"]
              if classification not in {"ENOSPC", "LINKER_FAILURE"}:
                  raise SystemExit(f"unexpected classifier receipt: {classification}")
          PY
          SHM_SIZE="$(df --output=size -B1 "$fs_root" | awk 'NR == 2 { print $1 }')" \
          SHM_BLOCK_SIZE="$(stat -fc '%S' "$fs_root")" \
          ENOSPC_REMAINING="$enospc_remaining" LINKER_REMAINING="$linker_remaining" \
          ENOSPC_RC="$enospc_rc" LINKER_RC="$linker_rc" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path("artifacts/campaign-ci/i1670")
          report = {
              "schema": "corelink.issue-1670.hosted-classification.v1",
              "runner": "ubuntu-24.04",
              "filesystem": "/dev/shm tmpfs",
              "bounded_filesystem_bytes": int(os.environ["SHM_SIZE"]),
              "filesystem_block_bytes": int(os.environ["SHM_BLOCK_SIZE"]),
              "enospc_remaining_bytes": int(os.environ["ENOSPC_REMAINING"]),
              "linker_remaining_bytes": int(os.environ["LINKER_REMAINING"]),
              "enospc_exit": int(os.environ["ENOSPC_RC"]),
              "linker_exit": int(os.environ["LINKER_RC"]),
              "enospc_classification": json.loads((root / "enospc-classification.json").read_text())["classification"],
              "linker_classification": json.loads((root / "linker-classification.json").read_text())["classification"],
              "cleanup": "EXIT trap removes the bounded tmpfs fixture",
          }
          (root / "report.json").write_text(json.dumps(report, indent=2) + "\n")
          PY

      - name: i1680 credentialless schema and contract checks
        if: ${{ inputs.suite == 'i1680-schema-contract' }}
        shell: bash
        run: |
          set -euo pipefail
          # No identity inputs and no opt-in wall-clock probe are accepted in
          # this lane; it validates only the product PR's parser/schema guard.
          python3 -m pytest -q tests/test_run_b251_latency_probe.py \
            2>&1 | tee artifacts/campaign-ci/i1680-schema-contract.log
          python3 scripts/verify_b251_quota_cas_budget.py \
            2>&1 | tee -a artifacts/campaign-ci/i1680-schema-contract.log
          if test -f .github/workflows/b251-d03-read-only-probe.yml; then
            if rg -n 'K6_|STRIPE|CLOUDFLARE|DATABASE_URL' \
              .github/workflows/b251-d03-read-only-probe.yml; then
              echo "forbidden live-target marker in B-251 workflow" >&2
              exit 1
            fi
          fi

      - name: i1792 exact Miniflare workerd epoch test
        if: ${{ inputs.suite == 'i1792-miniflare-epoch' }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --filter @corelink/worker...
          pnpm --dir worker exec vitest run --config vitest.miniflare.config.mts \
            tests/keyed_epoch_disposable.miniflare.test.ts \
            2>&1 | tee artifacts/campaign-ci/i1792-miniflare-epoch.log

      - name: i1650 credential-free ignored-harness manifest contract
        if: ${{ inputs.suite == 'i1650-contract' }}
        shell: bash
        run: |
          set -euo pipefail
          # This verifier is static and mutation based.  It must never receive
          # the protected real-integration environment or invoke a provider.
          python3 -S scripts/verify_real_ignored_harnesses.py 2>&1 | tee artifacts/campaign-ci/i1650-contract.log

      - name: i1649 read-only Stripe contract tests
        if: ${{ inputs.suite == 'i1649-contract' }}
        shell: bash
        run: |
          set -euo pipefail
          # Both suites replace D1/Stripe subprocesses with fakes; no key or
          # provider CLI is installed and no live readback is attempted.
          python3 -m pytest -q \
            tests/test_check_billing_health.py \
            tests/test_verify_stripe_webhook_destinations.py \
            2>&1 | tee artifacts/campaign-ci/i1649-contract.log

      - name: i1659 B-103 reproducer dry contract
        if: ${{ inputs.suite == 'i1659-dry' }}
        shell: bash
        run: |
          set -euo pipefail
          # This runs only the credentialless behavior and adversarial tests.
          # The staging load job is a separate protected workflow_dispatch.
          python3 -m unittest -v scripts.test_b103_cargo_write_contract \
            2>&1 | tee artifacts/campaign-ci/i1659-dry.log

      - name: i1809 B-063 archive replay and route checks
        if: ${{ inputs.suite == 'i1809-b063-archive-replay' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input --quiet -r requirements-ci.txt
          {
            python3 -m pytest -q tests/test_b063_archive_replay.py
            # The package has two pre-existing route orchestration functions
            # with intentional argument shape; keep every other warning fatal
            # while this focused lane checks the archive replay module.
            cargo clippy --locked --package corelink-server --all-targets -- -D warnings -A clippy::too_many_arguments
            cargo test --locked --package corelink-server --lib audit_archive -- --nocapture
          } 2>&1 | tee artifacts/campaign-ci/i1809-b063-archive-replay.log

      - name: i1810 B-046 object-lock receipt checks
        if: ${{ inputs.suite == 'i1810-b046-object-lock' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            python3 scripts/verify_b046_object_lock_probe.py
            python3 -m unittest -q tests/test_verify_b046_object_lock_probe.py
          } 2>&1 | tee artifacts/campaign-ci/i1810-b046-object-lock.log

      - name: i1811 B-032 vendor-review manifest checks
        if: ${{ inputs.suite == 'i1811-b032-vendor-review' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_1644_vendor_review_manifest.py 2>&1 | tee artifacts/campaign-ci/i1811-b032-vendor-review.log

      - name: i1641 PagerDuty contract (credentialless)
        if: ${{ inputs.suite == 'i1641-pagerduty-contract' }}
        shell: bash
        run: |
          set -euo pipefail
          # Static repository proof only: no PagerDuty endpoint, secret, or
          # acknowledgement is reachable from this lane.
          python3 -S scripts/verify_i1641_pagerduty_contract.py 2>&1 | tee artifacts/campaign-ci/i1641-pagerduty-contract.log

      - name: i1654 D1 residency contract (credentialless)
        if: ${{ inputs.suite == 'i1654-d1-residency-contract' }}
        shell: bash
        run: |
          set -euo pipefail
          # Static repository proof only: no D1 provider state, credentials,
          # database provisioning, or legal instrument mutation.
          python3 -S scripts/verify_b086_d1_residency.py 2>&1 | tee artifacts/campaign-ci/i1654-d1-residency-contract.log

      - name: i1655 SLA credit contract (credentialless)
        if: ${{ inputs.suite == 'i1655-sla-credit-contract' }}
        shell: bash
        run: |
          set -euo pipefail
          # Repository guard only: Stripe remains unreachable and production
          # credit gates stay disabled.
          python3 -S scripts/verify_b089_sla_credits.py 2>&1 | tee artifacts/campaign-ci/i1655-sla-credit-contract.log

      - name: i1674 exact B-132 and B-142 hosted contract suites
        if: ${{ inputs.suite == 'i1674' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            python3 -S scripts/verify_b142_workflows.py
            python3 -m unittest -q \
              tests/test_b132_secrets_evidence.py \
              tests/test_b142_codeql_selfhost.py \
              tests/test_b142_workflow_predicate.py
          } 2>&1 | tee artifacts/campaign-ci/i1674.log

      - name: Upload compact campaign logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: campaign-ci-${{ inputs.suite }}-logs
          path: artifacts/campaign-ci/
          if-no-files-found: ignore
          retention-days: 7
