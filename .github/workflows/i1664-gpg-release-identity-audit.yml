name: i1664 GPG release identity audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: read public release-key identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
    steps:
      - name: Import the existing release key into an ephemeral keyring
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GPG_PRIVATE_KEY}"
          test -n "${GPG_KEY_ID}"
          export GNUPGHOME="${RUNNER_TEMP}/i1664-gpg-audit"
          mkdir -p "${GNUPGHOME}"
          chmod 700 "${GNUPGHOME}"
          trap 'rm -rf "${GNUPGHOME}"' EXIT
          printf '%s' "${GPG_PRIVATE_KEY}" | gpg --batch --import

          fingerprint="$(gpg --with-colons --fingerprint "${GPG_KEY_ID}" | awk -F: '$1 == "fpr" {print $10; exit}')"
          case "${fingerprint}" in
            [0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F]) ;;
            *) echo '::error::release key has no valid public fingerprint' >&2; exit 1 ;;
          esac
          expected_key_id="${GPG_KEY_ID#0x}"
          expected_key_id="${expected_key_id#0X}"
          expected_key_id="${expected_key_id^^}"
          if [[ ! "${expected_key_id}" =~ ^[0-9A-F]{16}$ ]]; then
            echo '::error::GPG_KEY_ID must be exactly 16 hexadecimal characters' >&2
            exit 1
          fi
          test "${fingerprint: -16}" = "${expected_key_id}"

          expires_at="$(gpg --with-colons --list-keys "${GPG_KEY_ID}" | awk -F: '$1 == "pub" {print $7; exit}')"
          test -n "${expires_at}"
          test "${expires_at}" -gt "$(date +%s)"
          printf 'fingerprint=%s\n' "${fingerprint}" >> "${GITHUB_STEP_SUMMARY}"
          printf 'expires_at=%s\n' "$(date -u -d "@${expires_at}" +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_STEP_SUMMARY}"
          echo "::notice title=Release GPG identity::fingerprint=${fingerprint}; expiry=$(date -u -d "@${expires_at}" +%Y-%m-%dT%H:%M:%SZ)"
