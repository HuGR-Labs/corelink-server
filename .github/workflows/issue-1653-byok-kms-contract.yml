name: Issue 1653 — BYOK KMS lifecycle evidence contract

on:
  pull_request:
    paths:
      - 'BACKLOG.md'
      - 'docs/handoff/2026-09-05-owner-action-packets-b008-b154.json'
      - 'evidence/owner-actions/B-083/**'
      - 'scripts/verify_b083_kms_lifecycle_evidence.py'
      - 'scripts/verify_b083_aws_probe_receipt.py'
      - 'scripts/verify_owner_action_packets.py'
      - 'tests/test_verify_b083_kms_lifecycle_evidence.py'
      - 'tests/test_verify_b083_aws_probe_receipt.py'
      - 'tests/test_verify_b083_byok.py'
      - 'tests/test_owner_action_packets.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Redacted lifecycle contract and adversarial mutations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Verify the current exact external blocker
        run: python3 scripts/verify_b083_kms_lifecycle_evidence.py
      - name: Verify the B-083 owner-action packet
        run: python3 scripts/verify_owner_action_packets.py --id B-083
      - name: Reject forged lifecycle evidence
        run: python3 tests/test_verify_b083_kms_lifecycle_evidence.py
      - name: Reject B-083 owner-packet omissions
        run: python3 -m unittest -q tests.test_owner_action_packets.OwnerActionPacketTests.test_b083_owner_packet_lifecycle_contract_rejects_omissions
      - name: Verify the redacted isolated provider probe boundary
        run: python3 scripts/verify_b083_aws_probe_receipt.py
      - name: Reject forged partial-provider completion
        run: python3 tests/test_verify_b083_aws_probe_receipt.py
