---
# WI-S12-002: SBOM CycloneDX 1.5+ generation + NTIA validation + RFC 3161 TSA + DT ingestion.
#
# Trigger:
#   - release: { types: [published] }        — primary gate (release asset upload)
#   - workflow_dispatch                        — manual run (ops / dev)
#   - schedule (weekly)                        — drift check (SBOM freshness)
#
# All SHA-pinned per CoreLink hard constraints.
# Permissions: contents:write (release asset upload), id-token:write (OIDC for future Cosign).

name: "SBOM — CycloneDX 1.5+ (WI-S12-002)"

concurrency:
  # Escopo por ref. Grupo CONSTANTE torna o grupo repo-global: duas execucoes
  # `workflow_dispatch` deste mesmo workflow em branches DIFERENTES cancelam uma
  # a outra. Foi o que matou tres dispatches em 2026-08-31.
  group: "ci-sbom-cyclonedx-1-5-wi-s12-002-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version override (e.g. 0.1.2)"
        required: false
        default: ""
  # The weekly `schedule: cron "17 3 * * 2"` was removed 2026-08-31 (WP-E).
  # This SBOM is derived from `Cargo.lock` + the workspace manifests, so it
  # cannot drift WITHOUT a commit — and the standing rule in CLAUDE.md is that a
  # cron earns its keep only for what changes without one (CVE feeds, prod
  # state, backups, cert drift, billing reconciliation). Advisory drift is
  # already `cargo-audit.yml`'s job, not this lane's. What the cron actually did
  # was fire 16 red runs at the founder's Mac — which IS the runner — for an
  # `ls` that could never find its file. `release: published` + dispatch cover
  # the real need. Re-add a cron only with a reason that survives that test.

permissions:
  contents: write   # upload release assets
  id-token: write   # OIDC (reserved for future Cosign keyless; no-op now)

env:
  CYCLONEDX_CLI_VERSION: "0.27.2"
  # SHA-256 digests of the cyclonedx-cli release binaries, pinned for supply
  # chain and ENFORCED in the install step below. The previous entry here was
  # `CYCLONEDX_CLI_LINUX_SHA256: "placeholder-pin-at-first-use"` — a literal
  # placeholder that no step ever read, i.e. a pin that pinned nothing, on a
  # Linux asset this macOS job could not have executed anyway.
  CYCLONEDX_CLI_OSX_X64_SHA256: "331c2245ef7dadf09fa3d2710a2aaab071ff6bea2ba3e5df8f95a4f3f6e825e9"
  CYCLONEDX_CLI_OSX_ARM64_SHA256: "2d24c331c2ccc5e4061722bd4780c8b295041b2569d130bbe80cf7da95b97171"
  TSA_URL: "https://tsa.sigstore.dev/api/v1/timestamp"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Setup + SBOM generation
  # ---------------------------------------------------------------------------
  sbom-generate:
    name: "Verify committed Cargo.lock SBOM"
    runs-on: [self-hosted, mac, corelink-builder]
    outputs:
      version: ${{ steps.version.outputs.version }}
      sbom_path: sbom.cdx.json
      tsr_path: sbom.cdx.json.tsr

    steps:
      - name: Checkout
        # SHA-pinned: actions/checkout v4.2.2
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # Do NOT provision a toolchain on the self-hosted fleet. Per its own action.yml,
      # `dtolnay/rust-toolchain` runs `rustup toolchain install` + `rustup default`
      # against the SHARED `~/.rustup` (5 runners, one `$HOME`). That (a) can make
      # `rustc` unexecutable mid-build for every other job — it took the host down
      # for a day on 2026-06-15 — and (b) `rustup default` rewrites the MACHINE-GLOBAL
      # default, silently moving every concurrent job off the ADR-0015 reproducibility
      # pin. Full reasoning: scripts/ci-use-host-toolchain.sh header.
      - name: Use the workspace-pinned host toolchain (provisions nothing)
        run: bash scripts/ci-use-host-toolchain.sh

      - name: Cache Cargo registry
        # SHA-pinned: actions/cache v4.2.3
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-sbom-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-sbom-

      - name: Determine release version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            echo "version=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=drift-check-$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          fi

      # The committed SBOM is a deterministic projection of the complete
      # Cargo.lock population.  Unlike a cargo-cyclonedx binary aggregate, this
      # cannot lose inactive lock entries, include host paths, or get a fresh
      # timestamp/UUID on each run.  The harness calls `cargo metadata --locked`
      # and fails closed when metadata, the artifact, or the population differs.
      - name: Verify committed Cargo.lock SBOM is reproducible and complete
        run: |
          set -euo pipefail
          python3 tests/verify_rust_sbom.py --check
          cp .sbom/cyclonedx-rust.json sbom.cdx.json
          echo "SBOM reproducibility and lock coverage verified"
          ls -lh sbom.cdx.json

      - name: Upload SBOM artifact (between jobs)
        # SHA-pinned: actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom-cdx-json
          path: sbom.cdx.json
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 2: NTIA minimum elements validation (CI gate)
  # ---------------------------------------------------------------------------
  sbom-ntia-validate:
    name: "NTIA minimum elements check"
    runs-on: [self-hosted, mac, corelink-builder]
    needs: sbom-generate

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Download SBOM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sbom-cdx-json

      # This job runs on the macOS fleet, and the download below asked for
      # `cyclonedx-linux-x64` — a Linux ELF binary that macOS cannot exec. It was
      # a second wall standing behind the job-1 failure and had never been
      # reached, so it had never been observed. Same fault class as
      # `reproducible-build`: a lane naming an artifact the platform cannot use.
      #
      # Arch is now selected from `uname -m` (the fleet self-reports the `X64`
      # label, which does not settle whether the host is Apple Silicon), and the
      # binary is verified against a SHA-256 pinned in the `env:` block above
      # BEFORE it is made executable. The previous pin,
      # `CYCLONEDX_CLI_LINUX_SHA256: "placeholder-pin-at-first-use"`, was a
      # literal placeholder referenced by nothing — a supply-chain pin that
      # pinned nothing. Digests computed from the upstream v0.27.2 release
      # assets on 2026-08-31.
      - name: Install CycloneDX CLI ${{ env.CYCLONEDX_CLI_VERSION }}
        run: |
          set -euo pipefail
          case "$(uname -s)/$(uname -m)" in
            Darwin/arm64)  ASSET="cyclonedx-osx-arm64"; WANT="${CYCLONEDX_CLI_OSX_ARM64_SHA256}" ;;
            Darwin/x86_64) ASSET="cyclonedx-osx-x64";   WANT="${CYCLONEDX_CLI_OSX_X64_SHA256}" ;;
            *)
              echo "::error::Unsupported host $(uname -s)/$(uname -m) for cyclonedx-cli. This job targets the macOS corelink-builder fleet; add the digest for this platform rather than dropping the pin."
              exit 1
              ;;
          esac
          CDXCLI_URL="https://github.com/CycloneDX/cyclonedx-cli/releases/download/v${CYCLONEDX_CLI_VERSION}/${ASSET}"
          echo "Downloading ${ASSET} from ${CDXCLI_URL}"
          curl -fsSL --retry 3 -o cyclonedx-cli "$CDXCLI_URL"
          GOT="$(shasum -a 256 cyclonedx-cli | awk '{print $1}')"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::cyclonedx-cli SHA-256 pin violation for ${ASSET}: expected ${WANT}, got ${GOT}. Do NOT re-pin against the mutable upstream URL without a Security review."
            exit 1
          fi
          echo "SHA-256 pin OK: ${GOT}"
          chmod +x cyclonedx-cli
          # Verify binary works
          ./cyclonedx-cli --version

      - name: Validate NTIA minimum elements (strict gate)
        run: |
          ./cyclonedx-cli validate \
            --input-file sbom.cdx.json \
            --minimum-required-fields ntia \
            --output-format text
          echo "NTIA validation PASSED"

      - name: Validate SBOM JSON is well-formed
        run: |
          python3 -c "import json; json.load(open('sbom.cdx.json'))"
          echo "SBOM JSON is valid"

  # ---------------------------------------------------------------------------
  # Job 3: RFC 3161 TSA timestamp via Sigstore TSA
  # ---------------------------------------------------------------------------
  sbom-tsa-attest:
    name: "RFC 3161 TSA timestamp (Sigstore)"
    runs-on: [self-hosted, mac, corelink-builder]
    needs: sbom-ntia-validate
    outputs:
      tsr_present: ${{ steps.tsa.outputs.tsr_present }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Download SBOM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sbom-cdx-json

      # Do NOT provision a toolchain on the self-hosted fleet. Per its own action.yml,
      # `dtolnay/rust-toolchain` runs `rustup toolchain install` + `rustup default`
      # against the SHARED `~/.rustup` (5 runners, one `$HOME`). That (a) can make
      # `rustc` unexecutable mid-build for every other job — it took the host down
      # for a day on 2026-06-15 — and (b) `rustup default` rewrites the MACHINE-GLOBAL
      # default, silently moving every concurrent job off the ADR-0015 reproducibility
      # pin. Full reasoning: scripts/ci-use-host-toolchain.sh header.
      - name: Use the workspace-pinned host toolchain (provisions nothing)
        run: bash scripts/ci-use-host-toolchain.sh

      - name: Build sbom-publish binary
        run: cargo build --release -p sbom-publish

      - name: Request RFC 3161 TSA timestamp
        id: tsa
        run: |
          if ./target/release/sbom-publish attest-tsa \
                --input sbom.cdx.json \
                --tsa-url "$TSA_URL" \
                --output-tsr sbom.cdx.json.tsr; then
            echo "tsr_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "tsr_present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TSA timestamp failed (SEV-3); SBOM will be published without TSR"
          fi

      - name: Upload TSR artifact
        if: steps.tsa.outputs.tsr_present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom-tsr
          path: sbom.cdx.json.tsr
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 4: Dependency-Track ingestion
  # ---------------------------------------------------------------------------
  sbom-dt-ingest:
    name: "Dependency-Track ingestion"
    runs-on: [self-hosted, mac, corelink-builder]
    needs: [sbom-generate, sbom-ntia-validate]
    # DT ingestion is non-blocking: continue even if DT is down
    continue-on-error: true
    # Gate the WHOLE job, not just the POST: the steps below compile
    # `sbom-publish` from source on the founder's Mac before they would discover
    # there is nowhere to send the result. See the note on the ingest step.
    if: vars.DT_ENDPOINT != ''

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Download SBOM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sbom-cdx-json

      # Do NOT provision a toolchain on the self-hosted fleet. Per its own action.yml,
      # `dtolnay/rust-toolchain` runs `rustup toolchain install` + `rustup default`
      # against the SHARED `~/.rustup` (5 runners, one `$HOME`). That (a) can make
      # `rustc` unexecutable mid-build for every other job — it took the host down
      # for a day on 2026-06-15 — and (b) `rustup default` rewrites the MACHINE-GLOBAL
      # default, silently moving every concurrent job off the ADR-0015 reproducibility
      # pin. Full reasoning: scripts/ci-use-host-toolchain.sh header.
      - name: Use the workspace-pinned host toolchain (provisions nothing)
        run: bash scripts/ci-use-host-toolchain.sh

      - name: Build sbom-publish binary
        run: cargo build --release -p sbom-publish

      # The hard-coded fallback `https://dt.corelink.humangr.com` is NXDOMAIN
      # (checked 2026-08-31; the control `corelink-api.humangr.com` resolves), so
      # with `vars.DT_ENDPOINT` unset this step could only ever warn — after
      # paying for a full `cargo build --release -p sbom-publish` on the founder's
      # Mac. The endpoint is now required rather than defaulted: no
      # Dependency-Track configured means the job says so and skips, instead of
      # compiling a binary to POST at a host that does not exist.
      - name: Ingest SBOM into Dependency-Track
        env:
          DT_API_KEY: ${{ secrets.DT_API_KEY }}
          DT_ENDPOINT: ${{ vars.DT_ENDPOINT }}
        run: |
          VERSION="${{ needs.sbom-generate.outputs.version }}"
          DT_URL="${DT_ENDPOINT:-}"
          if [ -z "$DT_URL" ]; then
            echo "::notice::vars.DT_ENDPOINT is not set — no Dependency-Track instance is configured for this repo, so there is nothing to ingest into. Skipping (not a failure). Set the variable to enable ingestion."
            exit 0
          fi

          ./target/release/sbom-publish ingest-dt \
            --input sbom.cdx.json \
            --dt-url "$DT_URL" \
            --api-key-env DT_API_KEY \
            --project-name corelink-server \
            --project-version "$VERSION" \
          && echo "DT ingestion succeeded" \
          || echo "::warning::DT ingestion failed (SEV-3 alert); fallback queue triggered"

  # ---------------------------------------------------------------------------
  # Job 5: Upload release assets (sbom.cdx.json + sbom.cdx.json.tsr)
  # ---------------------------------------------------------------------------
  sbom-release-upload:
    name: "Upload release assets"
    runs-on: [self-hosted, mac, corelink-builder]
    # `sbom-dt-ingest` was dropped from `needs` on 2026-08-31 (WP-E). Now that it
    # is conditional on `vars.DT_ENDPOINT`, keeping it here would SKIP the
    # release upload whenever Dependency-Track is unconfigured — a skipped
    # dependency skips its dependents. That is the wrong coupling regardless:
    # this job publishes the SBOM and its RFC-3161 timestamp as release assets,
    # and it needs neither the existence nor the success of an external
    # vulnerability-tracker POST (which was already `continue-on-error: true`,
    # i.e. explicitly declared non-blocking).
    needs: [sbom-tsa-attest]
    if: github.event_name == 'release'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Download SBOM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sbom-cdx-json

      - name: Download TSR artifact (optional)
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sbom-tsr

      - name: Upload SBOM to GitHub release
        # SHA-pinned: softprops/action-gh-release v2.2.2
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda
        with:
          files: |
            sbom.cdx.json
            sbom.cdx.json.tsr
          fail_on_unmatched_files: false
          tag_name: ${{ github.event.release.tag_name }}
