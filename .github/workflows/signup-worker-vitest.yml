name: signup-worker vitest

# Gates the TypeScript `apps/signup-worker/` vitest suite (previously ungated in
# PR CI — only the e2e workflows installed it, none ran its unit/integration
# suite). This is the AUTHORITATIVE billing + downgrade handler, so its tests —
# including the handled-stripe-events single-source-of-truth guardrail (which
# fails if a downgrade-critical event is dropped) — must be load-bearing in CI.

on:
  pull_request:
    paths:
      - "apps/signup-worker/**"
      - ".github/workflows/signup-worker-vitest.yml"
      - ".github/actions/setup-pnpm/action.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "scripts/check_signup_worker_pin.py"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    runs-on: corelink  # zero-hosted: node/python already baked into the corelink image
    defaults:
      run:
        working-directory: apps/signup-worker
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # B-090, same change as signup-worker-deploy.yml and for the same reason:
      # this package is already a pnpm-workspace member with a pinned entry in
      # the committed `pnpm-lock.yaml`. `npm install --legacy-peer-deps` re-floated
      # the tree on every run, so the versions the tests ran against were not the
      # versions anything else pinned — and `--legacy-peer-deps` was only needed
      # BECAUSE the install floated. Frozen install removes both.
      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile --filter @corelink/signup-worker... --ignore-scripts

      - name: Verify signup-worker lockfile pin
        working-directory: .
        run: python3 scripts/check_signup_worker_pin.py

      - name: Run vitest + coverage floor
        # `--coverage` is LOAD-BEARING: vitest only evaluates the
        # `coverage.thresholds` block in vitest.config.ts when the provider is
        # enabled. Dropping this flag disarms the floor without failing anything,
        # which is exactly how the sibling worker/ floor sat dormant for months.
        # Exit code is vitest's own (no pipe, no `|| true`).
        run: npx vitest run --coverage
