name: signup-worker vitest

# Gates the TypeScript `apps/signup-worker/` vitest suite (previously ungated in
# PR CI — only the e2e workflows installed it, none ran its unit/integration
# suite). This is the AUTHORITATIVE billing + downgrade handler, so its tests —
# including the handled-stripe-events single-source-of-truth guardrail (which
# fails if a downgrade-critical event is dropped) — must be load-bearing in CI.

on:
  pull_request:
    paths:
      - "apps/signup-worker/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    runs-on: corelink
    defaults:
      run:
        working-directory: apps/signup-worker
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        # package-lock.json is gitignored (.gitignore **/package-lock.json), so
        # `npm ci` cannot run — use `npm install` like worker-vitest.yml.
        # --legacy-peer-deps: wrangler ≥4.108 declares a peerOPTIONAL on
        # @cloudflare/workers-types@^5, but this worker pins workers-types 4.x (for
        # @sentry/cloudflare compat, which peers workers-types ^4). Since the
        # lockfile is gitignored here, a fresh npm install floats wrangler and
        # strict peer resolution ERESOLVEs on that OPTIONAL peer. --legacy-peer-deps
        # skips the optional-peer check (it does not weaken anything real) so the
        # node vitest can install+run. Mirrors worker-vitest.yml.
        run: npm install --legacy-peer-deps

      - name: Run vitest
        run: npx vitest run
