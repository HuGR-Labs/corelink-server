name: signup-worker vitest

# Gates the TypeScript `apps/signup-worker/` vitest suite (previously ungated in
# PR CI — only the e2e workflows installed it, none ran its unit/integration
# suite). This is the AUTHORITATIVE billing + downgrade handler, so its tests —
# including the handled-stripe-events single-source-of-truth guardrail (which
# fails if a downgrade-critical event is dropped) — must be load-bearing in CI.

on:
  pull_request:
    paths:
      - "apps/signup-worker/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/signup-worker
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install dependencies
        # package-lock.json is gitignored (.gitignore **/package-lock.json), so
        # `npm ci` cannot run — use `npm install` like worker-vitest.yml.
        run: npm install

      - name: Run vitest
        run: npx vitest run
