name: issue #1863 hosted mutants contract

on:
  pull_request:
    paths:
      - ".github/workflows/issue-1863-mutants-hosted.yml"
      - ".github/workflows/issue-1863-mutants-contract.yml"
      - ".github/workflows/nightly.yml"
      - "BACKLOG.md"
      - "docs/internal/b113-six-lanes-owner-actions.md"
      - "scripts/verify_i1863_mutants_hosted.py"
      - "scripts/verify_i1666_mutants_evidence.py"
      - "scripts/verify_i2457_mutants_shards.py"
      - "tests/test_i1863_mutants_hosted_receipt.py"
      - "tests/test_i2457_mutants_shards.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: verify dispatch-only hosted mutants lane
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify hosted mutants contract
        run: |
          set -euo pipefail
          python3 scripts/verify_i1863_mutants_hosted.py
          python3 -m unittest -q tests/test_i1863_mutants_hosted_receipt.py tests/test_i2457_mutants_shards.py
