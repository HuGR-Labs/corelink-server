name: Python tests

# The repo carries six top-level python test files. Until this workflow existed,
# exactly ONE of them ran in CI (`tests/test_validate_docs_reality_hostnames.py`,
# named explicitly by `docs-reality.yml`). The other five — 129 assertions across
# the billing-health checker, the GA-freeze gate, the INV inheritance validator,
# the pentest-finding triage and the beta-feedback triage — ran nowhere. They
# passed when invoked by hand, which is the point: an ungated suite does not fail
# loudly when it rots, it just quietly stops describing the code.
#
# Discovery is a glob, not an allowlist, so a NEW top-level test file is gated the
# day it lands. Only `tests/*.py` is collected: the subdirectories (chaos/, dr/,
# e2e-*/) are credentialed suites with their own lanes and must not be dragged in.
#
# `docs-reality.yml` keeps its own pytest step on purpose — a docs-only PR does
# not touch `tests/` or `scripts/` and so does not trigger this lane, and that
# validator's regression net must still run there. That step relies on the mac
# fleet's ambient pytest; if it ever fails with "No module named pytest", the
# venv step below is the fix to port over.

on:
  pull_request:
    paths:
      - 'tests/*.py'
      - 'scripts/**'
      - 'BACKLOG.md'
      - 'docs/internal/org-migration/**'
      - 'docs/internal/secrets-checklist.md'
      - '.claude/skills/corelink-org-migration/**'
      - 'CHANGELOG.md'
      - '.github/workflows/release-cli.yml'
      - 'docs/campaigns/remediation/BACKLOG-WP-LEDGER.md'
      - 'docs/campaigns/remediation/work-packages/**'
      - 'requirements-ci.txt'
      - 'Cargo.lock'
      # cargo metadata reads every workspace member manifest. Keep the root
      # entry below as a visible anchor and the recursive entry as the actual
      # coverage for current and future members.
      - 'Cargo.toml'
      - '**/Cargo.toml'
      - '.sbom/cyclonedx-rust.json'
      # Explicit SBOM census: these inputs must run the read-only teeth and
      # SBOM verifier on every regular PR before a release can publish assets.
      - 'requirements-sbom.txt'
      - '.github/workflows/sbom.yml'
      - 'tests/verify_rust_sbom.py'
      - 'tests/test_sbom_workflow_dependencies.py'
      - '.github/workflows/python-tests.yml'
      - '.github/workflows/bot-pr-has-checks.yml'
      - '.github/workflows/cas_foundation.yml'
      - '.github/workflows/mutation-nightly.yml'
      - '.github/workflows/perf-production-evidence.yml'
      - '.github/workflows/real-ignored-harnesses.yml'
      - '.github/workflows/terraform-drift.yml'
      - '.github/workflows/release-cli.yml'
      - '.github/workflows/release-slsa3.yml'
      - '.github/workflows/runner-fleet-health.yml'
      - '.github/workflows/semgrep.yml'
      - '.github/workflows/workflow-state-guard.yml'
      - '.github/ISSUE_TEMPLATE/config.yml'
      - '.github/CODEOWNERS'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'apps/get-corelink-worker/README.md'
      - 'apps/docs/src/pages/compare/vs-bazel-remote-s3.mdx'
      - 'apps/docs/src/pages/compare/vs-buildbuddy.mdx'
      - 'apps/docs/src/pages/compare/vs-engflow.mdx'
      - 'apps/docs/src/pages/compare/vs-nx-cloud.mdx'
      - 'apps/docs/src/pages/compare/vs-sccache-s3.mdx'
      - 'apps/docs/src/pages/compare/vs-turborepo.mdx'
      - 'crates/**'
      - 'docs/build/reproducible.md'
      - 'docs/internal/ci-runner-fabric-box.md'
      - 'docs/internal/ENGINEERING-ONBOARDING.md'
      - 'docs/internal/FORENSICS-GUIDE.md'
      - 'docs/internal/pentest-engagement-checklist.md'
      - 'docs/internal/slsa-l3-pipeline.md'
      - 'docs/security/report-security.md'
      - 'docs/OSS_STRATEGY.md'
      - 'docs/operator/e2e-ci-2026-05-30.md'
      - 'docs/internal/OSS-VS-CLOSED-MATRIX.md'
      - 'infra/**'
      - 'marketing/**'
      - 'apps/docs/lychee.toml'
      - 'specs/_dashboards/**'
      - 'examples/**'
      - 'tools/sbom-publish/**'
  push:
    branches: [main]
    paths:
      - 'tests/*.py'
      - 'scripts/**'
      - 'BACKLOG.md'
      - 'docs/internal/org-migration/**'
      - 'docs/internal/secrets-checklist.md'
      - '.claude/skills/corelink-org-migration/**'
      - 'CHANGELOG.md'
      - '.github/workflows/release-cli.yml'
      - 'docs/campaigns/remediation/BACKLOG-WP-LEDGER.md'
      - 'docs/campaigns/remediation/work-packages/**'
      - 'requirements-ci.txt'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '**/Cargo.toml'
      - '.sbom/cyclonedx-rust.json'
      - 'requirements-sbom.txt'
      - '.github/workflows/sbom.yml'
      - 'tests/verify_rust_sbom.py'
      - 'tests/test_sbom_workflow_dependencies.py'
      - '.github/workflows/python-tests.yml'
      - '.github/workflows/bot-pr-has-checks.yml'
      - '.github/workflows/cas_foundation.yml'
      - '.github/workflows/mutation-nightly.yml'
      - '.github/workflows/perf-production-evidence.yml'
      - '.github/workflows/real-ignored-harnesses.yml'
      - '.github/workflows/terraform-drift.yml'
      - '.github/workflows/release-cli.yml'
      - '.github/workflows/release-slsa3.yml'
      - '.github/workflows/runner-fleet-health.yml'
      - '.github/workflows/semgrep.yml'
      - '.github/workflows/workflow-state-guard.yml'
      - '.github/ISSUE_TEMPLATE/config.yml'
      - '.github/CODEOWNERS'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'apps/get-corelink-worker/README.md'
      - 'apps/docs/src/pages/compare/vs-bazel-remote-s3.mdx'
      - 'apps/docs/src/pages/compare/vs-buildbuddy.mdx'
      - 'apps/docs/src/pages/compare/vs-engflow.mdx'
      - 'apps/docs/src/pages/compare/vs-nx-cloud.mdx'
      - 'apps/docs/src/pages/compare/vs-sccache-s3.mdx'
      - 'apps/docs/src/pages/compare/vs-turborepo.mdx'
      - 'crates/**'
      - 'docs/build/reproducible.md'
      - 'docs/internal/ci-runner-fabric-box.md'
      - 'docs/internal/ENGINEERING-ONBOARDING.md'
      - 'docs/internal/FORENSICS-GUIDE.md'
      - 'docs/internal/pentest-engagement-checklist.md'
      - 'docs/internal/slsa-l3-pipeline.md'
      - 'docs/security/report-security.md'
      - 'docs/OSS_STRATEGY.md'
      - 'docs/operator/e2e-ci-2026-05-30.md'
      - 'docs/internal/OSS-VS-CLOSED-MATRIX.md'
      - 'infra/**'
      - 'marketing/**'
      - 'apps/docs/lychee.toml'
      - 'specs/_dashboards/**'
      - 'examples/**'
      - 'tools/sbom-publish/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Top-level python test suite
    # Runner: `corelink` (zero-hosted). python3 + pytest are baked into the box
    # image; no actions/setup-python (the self-hosted fleet cannot provision it).
    runs-on: corelink
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The ledger verifier checks its immutable D03 base is reachable and
          # an ancestor of the checked head; shallow checkout would make that
          # provenance check fail closed even when the tree is correct.
          fetch-depth: 0

      # No actions/setup-python — the self-hosted fleets can't provision it
      # (RUNNER_TOOL_CACHE unset → it dies on an unwritable path). Same venv
      # idiom as spec_validation.yml. pytest is NOT assumed to be present:
      # `python3 -m pytest` resolves against whatever interpreter leads that
      # box's PATH, and the `corelink` image's /usr/bin/python3 carries no
      # pytest, so the first run of this lane failed with "No module named
      # pytest" while the identical step in docs-reality.yml passed on the mac
      # fleet. A gate whose result depends on which machine picks up the job is
      # not a gate.
      - name: Install pytest (venv on system python3)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python3 -m pip install --quiet --upgrade pip
          .venv/bin/python3 -m pip install --quiet -r requirements-ci.txt
          # The SBOM script is intentionally outside requirements-ci.txt.
          # Install its exact closure into this job-private venv so the
          # top-level suite can import it and the explicit check below can run.
          .venv/bin/python3 -m pip install \
            --quiet \
            --disable-pip-version-check \
            --no-input \
            --require-hashes \
            --only-binary=:all: \
            --no-deps \
            -r requirements-sbom.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify SBOM lock coverage (read-only)
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python3 tests/verify_rust_sbom.py --check

      - name: Verify backlog work-package ledger
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python3 scripts/verify_backlog_wp_ledger.py

      - name: Collect and run
        shell: bash
        run: |
          set -euo pipefail
          # Prove which interpreter is about to run, so a future PATH surprise
          # is visible in the log rather than inferred from a failure.
          command -v python3
          python3 -m pytest --version
          shopt -s nullglob
          FILES=(tests/*.py)
          # A glob that matched nothing must fail, not pass. A green check over
          # zero collected tests is the exact failure mode this lane exists to
          # end, and it would be indistinguishable from a healthy run.
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::no top-level test files matched tests/*.py — refusing to report green over an empty collection"
            exit 1
          fi
          # The SBOM dependency/isolation regression is a required piece of
          # this lane, not merely an optional file that happens to match today.
          case " ${FILES[*]} " in
            *" tests/test_sbom_workflow_dependencies.py "*) ;;
            *)
              echo "::error::SBOM dependency teeth file was not collected by tests/*.py"
              exit 1
              ;;
          esac
          # B-152's diagnostic is deliberately kept next to its executable
          # collector in scripts/, rather than pretending it is a generic
          # tests/ fixture.  Keep it explicit and assert its presence: a glob
          # change must never make this CI gate green over a missing suite.
          # The migration auditor and ledger regressions also live under
          # scripts/; register both explicitly and execute this full array below.
          REQUIRED_SUITES=(
            scripts/test_b152_actions_diagnostic.py
            scripts/test_b250_deleted_workflow_startup_failure.py
            scripts/test_org_migration_audit.py
            scripts/test_org_migration_gate_check.py
            scripts/test_server_repository_identity.py
            scripts/test_terraform_drift_auth_contract.py
          )
          for suite in "${REQUIRED_SUITES[@]}"; do
            if [ ! -f "$suite" ]; then
              echo "::error::required Python regression suite is missing: $suite"
              exit 1
            fi
          done
          echo "Collected ${#FILES[@]} file(s):"
          printf '  %s\n' "${FILES[@]}"
          printf '  %s\n' "${REQUIRED_SUITES[@]}"
          python3 -m pytest "${FILES[@]}" "${REQUIRED_SUITES[@]}" -q
