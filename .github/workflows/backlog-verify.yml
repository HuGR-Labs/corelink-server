      - "apps/docs/i18n/pt-BR/docusaurus-plugin-content-docs/current/explanation/rbac/role-catalog.mdx"
      - "apps/docs/docs/tutorials/quickstart-10min.mdx"
      - "apps/docs/i18n/de/docusaurus-plugin-content-docs/current/tutorials/quickstart-10min.mdx"
      - "apps/docs/i18n/es-419/docusaurus-plugin-content-docs/current/tutorials/quickstart-10min.mdx"
      - "apps/docs/i18n/pt-BR/docusaurus-plugin-content-docs/current/tutorials/quickstart-10min.mdx"
      - "apps/docs/docs/integrations/homebrew.md"
      - "apps/docs/i18n/de/docusaurus-plugin-content-docs/current/integrations/homebrew.md"
      - "apps/docs/i18n/es-419/docusaurus-plugin-content-docs/current/integrations/homebrew.md"
      - "apps/docs/i18n/pt-BR/docusaurus-plugin-content-docs/current/integrations/homebrew.md"
      - "apps/docs/tests/homebrew-security.test.ts"
      - "apps/docs/tests/fixtures/homebrew-no-env-proof.txt"
  schedule:
    # Daily, early UTC. Cheap: a handful of greps and gh API calls.
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  # Two items ask the Actions API which workflows are disabled. Without this the
  # token gets 403 and the item reports DRIFTED for a reason that has nothing to
  # do with the item — a false red is as corrosive as a false green.
  actions: read

env:
  # B-094 and the gitleaks history guards execute the real scanner. This job
  # runs on ephemeral machines, so provisioning is explicit, version-pinned,
  # and checksum-verified rather than relying on runner ambient state.
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  verify:
    # Self-hosted fleet — zero GitHub-hosted spend, per the standing mandate.
    runs-on: corelink
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3
        with:
          # Four backlog `verify` commands ask git about HISTORY (merge-base,
          # rev-list, git log). The default shallow clone has none, so those
          # checks cannot answer here — and a check that cannot answer is worse
          # than a red one, because it reports green. Full history or nothing.
          fetch-depth: 0

      - name: Install gitleaks for executable backlog proofs
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          curl -fsSL -o "${tarball}" "${url}"
          test -s "${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/gitleaks-bin"
          tar -xzf "${tarball}" -C "${RUNNER_TEMP}/gitleaks-bin" gitleaks
          rm -f "${tarball}"
          echo "${RUNNER_TEMP}/gitleaks-bin" >> "${GITHUB_PATH}"
          installed_version="$("${RUNNER_TEMP}/gitleaks-bin/gitleaks" version)"
          test "${installed_version}" = "${GITLEAKS_VERSION}"

      # B-161 and B-082 execute focused Vitest suites. Prepare only those
      # workspaces and their dependencies, with the lockfile immutable.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v4.1.0
        with:
          version: 10.32.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: prepare docs and Worker dependencies for B-161/B-082
        # B-160 and B-082 both execute Worker focal tests. Keep installation
        # frozen and package-scoped; ignore lifecycle scripts just as B-160's
        # independently reviewed guard requires.
        run: pnpm install --frozen-lockfile --filter @corelink/docs... --filter @corelink/worker... --ignore-scripts

      # The gate's own gate. A checker nobody has watched fail proves nothing, so
      # the self-test runs FIRST: if it cannot produce a red verdict on a backlog
      # designed to fail, the real run below is worthless and we stop here.
      - name: the gate can go red (self-test)
        run: bash scripts/test_backlog_verify.sh

      - name: B-160 verifier mutation suite
        run: python3 tests/test_verify_b160_pat_limit.py

      - name: DPA acceptance fixture guard and mutations
        run: python3 scripts/verify_dpa_acceptance_fixture.py --self-test

      - name: B-155 verifier mutation suite
        run: python3 tests/test_verify_b155_backlog_grep_population.py
      - name: Prepare Python verifier dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python3 -m pip install -r requirements-ci.txt
      - name: B-061 remediation roadmap verifier and mutations
        run: |
          python3 scripts/verify_b061_remediation_roadmap.py
          python3 -m pytest -q tests/test_verify_b061_remediation_roadmap.py
      - name: B-262/B-263 module-path and lockfile guards
        run: |
          python3 scripts/verify_b262_neon_shadow_module_paths.py
          python3 -m pytest -q scripts/test_b262_neon_shadow_module_paths.py
          python3 scripts/verify_b263_audit_module_paths.py
          python3 -m pytest -q tests/test_verify_b263_audit_module_paths.py
      - name: B-264 through B-267 bundle-repair guard and mutations
        run: |
          python3 scripts/verify_b264_b267_bundle_repairs.py
          python3 -m pytest -q tests/test_verify_b264_b267_bundle_repairs.py
      - name: B-268 customer BYOK import guard and mutations
        run: |
          python3 scripts/verify_b268_handler_byok_import.py
          python3 -m pytest -q tests/test_verify_b268_handler_byok_import.py
      - name: B-269 pilot harness path guard and mutations
        run: |
          python3 scripts/verify_b269_pilot_harness_module_path.py
          python3 -m pytest -q tests/test_verify_b269_pilot_harness_module_path.py
      - name: B-270 through B-281 final D03 Rust guards and mutations
        run: |
          python3 scripts/verify_b270_b281_bundle_repairs.py
          python3 -m pytest -q tests/test_verify_b270_b281_bundle_repairs.py
      - name: B-282 through B-290 D03 bundle residual guards and mutations
        run: |
          python3 scripts/verify_b282_b290_bundle_residuals.py
          python3 -m pytest -q tests/test_verify_b282_b290_bundle_residuals.py
      - name: B-291 through B-293 second D03 residual guards and mutations
        run: |
          python3 scripts/verify_b291_b293_bundle_residuals.py
          python3 -m pytest -q tests/test_verify_b291_b293_bundle_residuals.py
      - name: B-294 through B-296 third D03 residual guards and mutations
        run: |
          python3 scripts/verify_b294_b296_bundle_residuals.py
          python3 -m pytest -q tests/test_verify_b294_b296_bundle_residuals.py
      - name: B-297 through B-312 fourth D03 residual guards and mutations
        run: |
          python3 scripts/verify_b297_b312_bundle_residuals.py
          python3 -m pytest -q tests/test_verify_b297_b312_bundle_residuals.py
      - name: B-094 published-claims guard and mutations
        run: |
          command -v gitleaks
          python3 -m pytest -q \
            tests/test_verify_b094_published_claims.py \
            tests/test_gitleaks_b094_manifest.py
      - name: B-169 evidence-pack guard and mutations
        run: python3 -m unittest tests/test_verify_b169_evidence_pack.py
      - name: B-082 verifier, mutations, and focal health tests
        run: python3 scripts/verify_b082_health_probe.py

      - name: B-056 CAS read budget verifier and mutations
        run: python3 scripts/verify_b056_cas_budget.py --self-test --expect 'done'

      - name: B-053 failover verifier, mutations, and focal Rust test
        run: |
          python3 scripts/verify_b053_failover.py
          cargo test -p corelink-server --lib routes::failover::tests

      - name: B-088 published pentest claim verifier and mutations
        run: python3 -m unittest tests/b088_pentest_claims_test.py

      - name: B-095 interface contract verifier
        run: python3 scripts/verify_b095_interface_contract.py --expect 'done'
      - name: B-095 verifier mutation tests
        run: python3 -m unittest tests/test_verify_b095_interface_contract.py

      - name: B-144 PAT revoke verifier and mutations
        run: |
          python3 scripts/verify_b144_pat_revoke.py --expect 'done' --self-test
          python3 -m pytest -q tests/test_verify_b144_pat_revoke.py

      - name: B-259 npm cap verifier, prose, and inverse mutations
        run: |
          python3 scripts/verify_f008_npm_storage_cap.py
          python3 -m pytest -q tests/test_f008_npm_storage_cap.py

      - name: BACKLOG.md agrees with the repo
        # Items that query the Actions API need gh authenticated. Items about
        # SIBLING repos are deliberately `verify: manual` — the Actions token is
        # scoped to this repo, and pretending otherwise would produce a red that
        # says nothing about the item. They still decay after 14 days.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/backlog_verify.py
