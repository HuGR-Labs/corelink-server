# The backlog gate — make BACKLOG.md unable to lie for long.
#
# Every item in BACKLOG.md carries a command that decides whether its own claim is
# still true. This runs them. An item whose declared status no longer matches the
# repo is DRIFTED; an unverifiable item that has aged past its freshness limit is
# STALE. Either fails the job.
#
# WHY A CRON IS JUSTIFIED HERE, given this repo's rule that a schedule earns its
# keep only when something changes WITHOUT a commit: a backlog item closes when
# work lands in ANOTHER repo (corelink-runners, corelink-workspaces) or when live
# state changes. Neither produces a commit here, so a PR trigger alone would let
# the file drift silently between merges — which is the exact failure this replaces.
name: backlog-verify

# The group MUST vary by ref. With a constant group and `cancel-in-progress`,
# every PR in the repo shares ONE slot: the next PR to touch BACKLOG.md cancels
# the gate of the one before it. That is not a slow gate — it is a gate that
# silently stops having an opinion, and a cancelled check looks like "no failure"
# to anyone who asks "are there failures?" instead of counting the set.
#
# Measured 2026-08-31: this lane was cancelled twice on one PR and only went
# green after a manual `gh run rerun`. The re-runs I issued across the queue all
# day were this, not flake.
#
# `github.ref` is the PR's merge ref on `pull_request` and the branch on `push`,
# so a new push to the SAME PR still cancels its own stale run — which is the
# behaviour cancel-in-progress is for.
concurrency:
  group: "ci-backlog-verify-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "BACKLOG.md"
      - "scripts/backlog_verify.py"
      - "scripts/test_backlog_verify.sh"
      - "scripts/verify_b155_backlog_grep_population.py"
      - "scripts/repair_b155_grep_population.py"
      - "tests/test_verify_b155_backlog_grep_population.py"
      # B-094 hashes and semantically classifies the complete published corpus.
      - "scripts/verify_b094_published_claims.py"
      - "scripts/b094_published_inventory.json"
      - "tests/test_verify_b094_published_claims.py"
      - "tests/test_gitleaks_b094_manifest.py"
      - "requirements-ci.txt"
      - ".gitleaks.toml"
      - "README.md"
      - "apps/docs/**"
      - "marketing/**"
      - "crates/corelink-container/src/routes/bazel_v2.rs"
      - "scripts/verify_b169_evidence_pack.py"
      - "tests/test_verify_b169_evidence_pack.py"
      # B-160's verifier executes the Worker PAT-limiter focal and its mutation teeth.
      - "scripts/verify_b160_pat_limit.py"
      - "tests/test_verify_b160_pat_limit.py"
      - "worker/src/pat_issue_rate_limit.ts"
      - "worker/src/durable_object.ts"
      - "worker/src/index.ts"
      - "worker/tests/pat_issue_rate_limit.test.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "worker/package.json"
      - "worker/vitest.config.mts"
      - "worker/tsconfig.test.json"
      - "worker/tests/setup.ts"
      - "crates/corelink-container/src/routes/customer.rs"
      # B-082's executable verifier reads the Worker route/auth source and its
      # focal test harness. Keep every direct input in the trigger set so a
      # security regression cannot land without rerunning the inverted guard.
      - "scripts/verify_b082_health_probe.py"
      - "worker/package.json"
      - "worker/vitest.config.mts"
      - "worker/src/**"
      - "worker/tests/index.test.ts"
      - "worker/tests/setup.ts"
      - "worker/tests/d1_batch_mock.ts"
      - "pnpm-lock.yaml"
      - "marketing/sales/legal-questionnaires/EVIDENCE-PACK-INDEX.md"
      # B-161's verifier reads exactly these published pages and its focused test.
      - "apps/docs/docs/integrations/homebrew.md"
      - "apps/docs/i18n/de/docusaurus-plugin-content-docs/current/integrations/homebrew.md"
      - "apps/docs/i18n/es-419/docusaurus-plugin-content-docs/current/integrations/homebrew.md"
      - "apps/docs/i18n/pt-BR/docusaurus-plugin-content-docs/current/integrations/homebrew.md"
      - "apps/docs/tests/homebrew-security.test.ts"
      - "apps/docs/tests/fixtures/homebrew-no-env-proof.txt"
      - ".github/workflows/backlog-verify.yml"
      # Any workflow can change the truth of a backlog verify command. Keep the
      # complete workflow surface in the trigger so those changes cannot land
      # without the backlog gate running on the same PR.
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "BACKLOG.md"
      - "scripts/backlog_verify.py"
      - "scripts/test_backlog_verify.sh"
      - "scripts/verify_b155_backlog_grep_population.py"
      - "scripts/repair_b155_grep_population.py"
      - "tests/test_verify_b155_backlog_grep_population.py"
      - "scripts/verify_b094_published_claims.py"
      - "scripts/b094_published_inventory.json"
      - "tests/test_verify_b094_published_claims.py"
      - "tests/test_gitleaks_b094_manifest.py"
      - "requirements-ci.txt"
      - ".gitleaks.toml"
      - "README.md"
      - "apps/docs/**"
      - "marketing/**"
      - "crates/corelink-container/src/routes/bazel_v2.rs"
      - ".github/workflows/**"
      - "scripts/verify_b169_evidence_pack.py"
      - "marketing/sales/legal-questionnaires/EVIDENCE-PACK-INDEX.md"
      - "scripts/verify_b160_pat_limit.py"
      - "tests/test_verify_b160_pat_limit.py"
      - "worker/src/pat_issue_rate_limit.ts"
      - "worker/src/durable_object.ts"
      - "worker/src/index.ts"
      - "worker/tests/pat_issue_rate_limit.test.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "worker/package.json"
      - "worker/vitest.config.mts"
      - "worker/tsconfig.test.json"
      - "worker/tests/setup.ts"
      - "crates/corelink-container/src/routes/customer.rs"
      - "scripts/verify_b082_health_probe.py"
      - "worker/package.json"
      - "worker/vitest.config.mts"
      - "worker/src/**"
      - "worker/tests/index.test.ts"
      - "worker/tests/setup.ts"
      - "worker/tests/d1_batch_mock.ts"
      - "pnpm-lock.yaml"
      - "apps/docs/docs/integrations/homebrew.md"
      - "apps/docs/i18n/de/docusaurus-plugin-content-docs/current/integrations/homebrew.md"
      - "apps/docs/i18n/es-419/docusaurus-plugin-content-docs/current/integrations/homebrew.md"
      - "apps/docs/i18n/pt-BR/docusaurus-plugin-content-docs/current/integrations/homebrew.md"
      - "apps/docs/tests/homebrew-security.test.ts"
      - "apps/docs/tests/fixtures/homebrew-no-env-proof.txt"
  schedule:
    # Daily, early UTC. Cheap: a handful of greps and gh API calls.
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  # Two items ask the Actions API which workflows are disabled. Without this the
  # token gets 403 and the item reports DRIFTED for a reason that has nothing to
  # do with the item — a false red is as corrosive as a false green.
  actions: read

jobs:
  verify:
    # Self-hosted fleet — zero GitHub-hosted spend, per the standing mandate.
    runs-on: corelink
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3
        with:
          # Four backlog `verify` commands ask git about HISTORY (merge-base,
          # rev-list, git log). The default shallow clone has none, so those
          # checks cannot answer here — and a check that cannot answer is worse
          # than a red one, because it reports green. Full history or nothing.
          fetch-depth: 0

      # B-161 and B-082 execute focused Vitest suites. Prepare only those
      # workspaces and their dependencies, with the lockfile immutable.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v4.1.0
        with:
          version: 10.32.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: prepare docs and Worker dependencies for B-161/B-082
        # B-160 and B-082 both execute Worker focal tests. Keep installation
        # frozen and package-scoped; ignore lifecycle scripts just as B-160's
        # independently reviewed guard requires.
        run: pnpm install --frozen-lockfile --filter @corelink/docs... --filter @corelink/worker... --ignore-scripts

      # The gate's own gate. A checker nobody has watched fail proves nothing, so
      # the self-test runs FIRST: if it cannot produce a red verdict on a backlog
      # designed to fail, the real run below is worthless and we stop here.
      - name: the gate can go red (self-test)
        run: bash scripts/test_backlog_verify.sh

      - name: B-160 verifier mutation suite
        run: python3 tests/test_verify_b160_pat_limit.py

      - name: B-155 verifier mutation suite
        run: python3 tests/test_verify_b155_backlog_grep_population.py
      - name: Prepare Python verifier dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python3 -m pip install -r requirements-ci.txt
      - name: B-094 published-claims guard and mutations
        run: |
          command -v gitleaks
          python3 -m pytest -q \
            tests/test_verify_b094_published_claims.py \
            tests/test_gitleaks_b094_manifest.py
      - name: B-169 evidence-pack guard and mutations
        run: python3 -m unittest tests/test_verify_b169_evidence_pack.py
      - name: B-082 verifier, mutations, and focal health tests
        run: python3 scripts/verify_b082_health_probe.py

      - name: BACKLOG.md agrees with the repo
        # Items that query the Actions API need gh authenticated. Items about
        # SIBLING repos are deliberately `verify: manual` — the Actions token is
        # scoped to this repo, and pretending otherwise would produce a red that
        # says nothing about the item. They still decay after 14 days.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/backlog_verify.py
