name: tls-floor drift

# CTRL-CRYPTO-001 lives in a Cloudflare zone setting, not in this repo. Anyone
# with zone-edit access can change `min_tls_version` from the dashboard and
# nothing here would notice — that is ADR-0072's "Drift risk" section, and it
# is exactly the kind of state this repo's cron rule says a schedule is FOR:
# something that can change without a commit.
#
# Both directions are an incident. Raised back to 1.3 and sccache (native-tls /
# SecureTransport) stops being able to handshake against the live product.
# Lowered under 1.2 and the security model plus every compliance crosswalk
# citing it overstate the control to an auditor.

on:
  schedule:
    # Daily 07:10 UTC — off the hour, so it does not pile onto the other crons.
    - cron: '10 7 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/check_tls_floor.py'
      - '.github/workflows/tls-floor-drift.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tls-floor:
    name: the live TLS floor matches the documented one
    runs-on: corelink
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Compare the zone setting against ADR-0072
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 scripts/check_tls_floor.py
