name: admin-ui e2e

# Combined Playwright e2e workflow:
#  - legacy WI-S16-007 suite at apps/admin-ui/playwright/e2e (a11y sweep,
#    onboarding, consent, csp). Chromium-only.
#  - wt-r3-7 critical-flow suite at apps/admin-ui/tests/e2e (auth, tenants,
#    audit, byok rotate, dsr approve). Matrix: chromium / firefox / webkit.
#
# Action SHAs are pinned (no floating tags) — security requirement.

on:
  pull_request:
    paths:
      - "apps/admin-ui/**"
      - ".github/workflows/admin-ui-e2e.yml"
  push:
    branches: [main]
    paths:
      - "apps/admin-ui/**"
      - ".github/workflows/admin-ui-e2e.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-ui-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-e2e:
    name: playwright legacy (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/admin-ui
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_E2E_TEST_MODE: "1"
      PROJECTS: chromium
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v4.1.0
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm e2e:install

      - name: Build
        run: pnpm build

      - name: Run legacy Playwright suite
        run: pnpm e2e --reporter=line

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-legacy
          path: apps/admin-ui/playwright-report/
          retention-days: 14

  critical-e2e:
    name: playwright critical-flows (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: apps/admin-ui
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_E2E_TEST_MODE: "1"
      NEXT_PUBLIC_CORELINK_API_URL: "/api"
      PROJECTS: ${{ matrix.browser }}
      PORT: "3010"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v4.1.0
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run critical-flow Playwright suite
        run: pnpm exec playwright test --config=playwright.tests.config.ts --reporter=line

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-critical-${{ matrix.browser }}
          path: apps/admin-ui/playwright-report/
          retention-days: 14
