name: admin-ui e2e

# Combined Playwright e2e workflow:
#  - legacy WI-S16-007 suite at apps/admin-ui/playwright/e2e (a11y sweep,
#    onboarding, consent, csp). Chromium-only.
#  - wt-r3-7 critical-flow suite at apps/admin-ui/tests/e2e (auth, tenants,
#    audit, byok rotate, dsr approve). Matrix: chromium / firefox / webkit.
#
# Action SHAs are pinned (no floating tags) — security requirement.

on:
  pull_request:
    paths:
      - "apps/admin-ui/**"
      - ".github/workflows/admin-ui-e2e.yml"
  push:
    branches: [main]
    paths:
      - "apps/admin-ui/**"
      - ".github/workflows/admin-ui-e2e.yml"
  schedule:
    # Cadence: daily -> WEEKLY Thu (CI cost diet 2026-08-01). This workflow was
    # the single most expensive line item in the repo (~3,480 modeled billable
    # min in June 2026 — 4 hosted Playwright jobs at ~7 min each). The
    # `pull_request` + `push:main` lanes above already run it on every
    # admin-ui change; the cron only re-runs an UNCHANGED tree, so its job is
    # drift detection against prod-ish deps — weekly-shaped.
    - cron: "0 6 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-ui-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-e2e:
    name: playwright legacy (chromium)
    # TEMPORARY (2026-08-02): GitHub-hosted runners are billing-blocked
    # (jobs die in ~2s, zero steps, runner=""). Moved to the self-hosted
    # mac fleet to keep the PR gates ALIVE. Revert to ubuntu-latest once
    # billing clears or the corelink runner fleet is generally available.
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/admin-ui
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_E2E_TEST_MODE: "1"
      PROJECTS: chromium
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm e2e:install

      - name: Build
        run: pnpm build

      - name: Run legacy Playwright suite
        run: pnpm e2e --reporter=line

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-legacy
          path: apps/admin-ui/playwright-report/
          retention-days: 14

  critical-e2e:
    name: playwright critical-flows (${{ matrix.browser }})
    # TEMPORARY (2026-08-02): GitHub-hosted runners are billing-blocked
    # (jobs die in ~2s, zero steps, runner=""). Moved to the self-hosted
    # mac fleet to keep the PR gates ALIVE. Revert to ubuntu-latest once
    # billing clears or the corelink runner fleet is generally available.
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Browser fan-out is EVENT-SCOPED (CI cost diet 2026-08-01). Each entry
        # is a separate hosted job that installs its own Playwright browser +
        # deps and then runs the suite (~7 paid min each), so the 3-browser
        # matrix cost ~21 paid min on EVERY admin-ui PR push. Chromium is the
        # engine the product is developed against and catches essentially all
        # functional regressions; firefox + webkit exist to catch ENGINE drift,
        # which is a weekly-shaped signal, not a per-commit one. So:
        #   pull_request        -> chromium only
        #   push / schedule / workflow_dispatch -> full 3-engine matrix
        # Cross-engine coverage is therefore still enforced on every merge to
        # main and on the weekly cron — it is not deleted, only de-duplicated
        # off the per-push lane.
        browser: ${{ github.event_name == 'pull_request' && fromJSON('["chromium"]') || fromJSON('["chromium","firefox","webkit"]') }}
    defaults:
      run:
        working-directory: apps/admin-ui
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_E2E_TEST_MODE: "1"
      # basePath (`/corelink`) is ON, so the same-origin mock is served under
      # `/corelink/api/*`; a bare `/api` 404s (Next never auto-prefixes fetch()).
      # The config's webServer.env sets the same value as the single source of
      # truth via APP_BASE_PATH — kept here in lockstep so the intent is explicit.
      NEXT_PUBLIC_CORELINK_API_URL: "/corelink/api"
      PROJECTS: ${{ matrix.browser }}
      PORT: "3010"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install ${{ matrix.browser }}

      - name: Run critical-flow Playwright suite
        run: pnpm exec playwright test --config=playwright.tests.config.ts --reporter=line

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-critical-${{ matrix.browser }}
          path: apps/admin-ui/playwright-report/
          retention-days: 14
