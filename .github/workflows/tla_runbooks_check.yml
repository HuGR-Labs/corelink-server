name: TLA+ Model Check — Runbooks (DEBT-014 FT-8)

# Runs TLC v1.8.0 SHA-256 pinned (ADR-0042 §A1) over the runbook TLA+ specs
# under `specs/03_architecture/tla+/runbooks/`. These specs cover CRITICAL
# invariants (INV-ONBOARD-DPA-FIRST via `signup_atomic.tla`,
# INV-DATA-RESIDENCY failover side via `residency_failover.tla`,
# INV-BYOK-CRYPTO-SOVEREIGNTY via `byok_kill_switch.tla`, consent
# proof-per-version via `dpa_versioning_grace.tla`) and previously had NO
# PR-gate CI exposure — see `specs/_audits/sealed/tla-followup-tickets.md` FT-8.
#
# CI block on any spec failure (exit code != 0).

on:
  # NO pull_request trigger — deliberately. 7 successes in the last 25 runs
  # (measured 2026-08-02): the shared TLC install step fails the ADR-0042 §A1
  # SHA-256 pin, so a PR trigger would block pull requests on an infrastructure
  # fault rather than on a spec regression. Re-add it in the same change that
  # re-pins TLC (Security review + ADR-0042 §A1 update).
  # Moved OFF per-PR 2026-06-02 to keep PRs fast (was a heavy gate). Runs
  # nightly (staggered) + on-demand. Re-add pull_request only if
  # this must block PRs again.
  schedule:
    # CI cost diet 2026-08-02: daily -> WEEKLY. TLA+ model check — spec-driven, not code-driven.
    # Kept the same minute/hour (spread out, low-traffic window); only the
    # weekday field is added. Per-PR gating is unchanged.
    - cron: '20 8 * * 5'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  tla-runbooks-check:
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # actions/checkout@v7.0.0

      - name: Setup Java (TLC requires JVM)
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95  # actions/setup-java@v5.6.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install pinned TLC v1.8.0 (SHA-256 verified — ADR-0042 §A1)
        env:
          TLC_VERSION: '1.8.0'
          # DRIFT-WAIVED-FT-3 — this SHA-pin is the wave-20 archive value
          # tracked in `specs/_audits/sealed/2026-05-15-debt-014-ft3-ft4-waivers.md`
          # §FT-3 and audited in `specs/_audits/sealed/2026-05-16-wave21-adversarial-review.md`
          # §3.3 (W21-R-P2-02). Upstream v1.8.0 release artifact has drifted
          # to `25780ac95...` post-pin (release re-hash incident). Behaviour
          # is fail-CLOSED by design — the PR gate refuses to run until
          # Security WG + Architect re-pin per ADR-0042 §A1 governance.
          # The runbook gate therefore provides zero positive signal until
          # the waiver is re-closed; this is the explicitly-charted policy
          # (the workflow refusing to run IS the intended behaviour).
          TLC_SHA256_PINNED: '33de7da9ce1b7fffb9d1c184021178dbb051747be48504e65c584c423721a32e'
        run: |
          set -euo pipefail
          # Download tla2tools.jar from GitHub Releases per pinned version + verify SHA-256.
          # SHA pin governance per ADR-0042 §A1 — re-pin requires Security review + Architect.
          mkdir -p "$RUNNER_TEMP/tla"
          curl -fsSL -o "$RUNNER_TEMP/tla/tla2tools.jar" \
            "https://github.com/tlaplus/tlaplus/releases/download/v${TLC_VERSION}/tla2tools.jar"
          ACTUAL_SHA="$(sha256sum "$RUNNER_TEMP/tla/tla2tools.jar" | awk '{print $1}')"
          echo "TLC SHA-256 actual: ${ACTUAL_SHA}"
          echo "TLC SHA-256 expect: ${TLC_SHA256_PINNED}"
          if [[ "${ACTUAL_SHA}" != "${TLC_SHA256_PINNED}" ]]; then
            echo "::error::TLC SHA-256 supply-chain pin violation (ADR-0042 §A1)" >&2
            echo "::error::expected: ${TLC_SHA256_PINNED}" >&2
            echo "::error::actual:   ${ACTUAL_SHA}" >&2
            echo "::error::Re-pin requires Security review + ADR-0042 §A1 update" >&2
            exit 1
          fi
          mkdir -p "$HOME/.local/bin"
          # Build the tlc wrapper via an UNQUOTED heredoc so $RUNNER_TEMP is
          # expanded by the shell at write-time (\$@ stays literal in the file).
          # This mirrors tla_check.yml / tla_billing_check.yml exactly and is
          # robust to any character in the runner path — the prior `sed`-based
          # injection broke because the RUNNER_TEMP path's `/` slashes collided
          # with sed's substitution syntax ("sed: extra characters at the end of
          # g command"). Letting the shell expand the path avoids sed entirely.
          cat > "$HOME/.local/bin/tlc" <<EOF
          #!/usr/bin/env bash
          exec java -cp "$RUNNER_TEMP/tla/tla2tools.jar" tlc2.TLC "\$@"
          EOF
          chmod +x "$HOME/.local/bin/tlc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "TLC_JAR=$RUNNER_TEMP/tla/tla2tools.jar" >> "$GITHUB_ENV"

      # The runbook specs live under specs/03_architecture/tla+/runbooks/
      # rather than specs/tla/, so we invoke `tlc` directly with explicit
      # spec + cfg paths. Each step enforces the same supply-chain pin
      # validated above (the jar referenced by ${TLC_JAR} is the only
      # artifact the wrapper executes).

      - name: TLC verify signup_atomic (WI-S20-007 runbook 1/4)
        # INV-ONBOARD-DPA-FIRST + atomic-provisioning saga.
        working-directory: specs/03_architecture/tla+/runbooks
        run: |
          set -euo pipefail
          tlc -config signup_atomic.cfg signup_atomic.tla

      - name: TLC verify byok_kill_switch (WI-S20-007 runbook 3/4)
        # INV-BYOK-CRYPTO-SOVEREIGNTY (runbook side; per-region race is
        # covered separately in specs/tla/byok_dek_race.tla — FT-7).
        working-directory: specs/03_architecture/tla+/runbooks
        run: |
          set -euo pipefail
          tlc -config byok_kill_switch.cfg byok_kill_switch.tla

      - name: TLC verify residency_failover (WI-S20-007 runbook 2/4)
        # INV-DATA-RESIDENCY failover side; no split-brain on handoff.
        working-directory: specs/03_architecture/tla+/runbooks
        run: |
          set -euo pipefail
          tlc -config residency_failover.cfg residency_failover.tla

      - name: TLC verify dpa_versioning_grace (WI-S20-007 runbook 4/4)
        # Consent proof per dpa_version; grace window correctness.
        working-directory: specs/03_architecture/tla+/runbooks
        run: |
          set -euo pipefail
          tlc -config dpa_versioning_grace.cfg dpa_versioning_grace.tla
