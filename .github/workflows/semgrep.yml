name: Semgrep (R-prep static analysis)

# Semgrep CI gate — pre-pentest engagement R-prep wave companion to CodeQL.
#
# Why both Semgrep + CodeQL?
#   - CodeQL is excellent at dataflow/taint queries but has experimental
#     Rust support and slower run-time (~30 min).
#   - Semgrep gives us syntactic + lightweight semantic scanning across
#     all CoreLink languages (Rust, TS, Python, YAML/Dockerfile/Terraform)
#     in < 5 min, plus the ability to run custom CoreLink-specific rules
#     (see `semgrep.yml` at the repo root for the project-local rulepack).
#
# Triggers:
#   - pull_request: every PR.
#   - push to main: full sweep on default branch.
#   - schedule: weekly Mon 03:00 UTC (1h after CodeQL cron — staggered to
#     avoid runner contention).
#   - workflow_dispatch: manual trigger for ops re-run.
#
# Fail policy:
#   PR mode → fail-closed on any ERROR-severity finding from the bundled
#   rulesets OR any of the custom CoreLink rules in `semgrep.yml`. Lower
#   severities are surfaced as PR comments + SARIF upload but do not block.
#
# SARIF uploaded to GHA Security tab via github/codeql-action/upload-sarif
# (SAME action CodeQL uses for SARIF upload — only the upload step, not
# the init/analyze pair).
#
# SHA-pinned per HIGH_RISK lane FF-HR-005 + ADR-S12-045 §6.
#
# Cross-refs:
#   - SOC2 rollup: CC8.1 (change management — static-analysis gate evidence).
#   - ROADMAP-TO-GA.md §7 Wave R-7 (Evidence Gate).
#   - Pre-pentest cutoff 2026-06-15.
#   - Custom rule pack: `semgrep.yml` (repo root).
#   - Runbook: specs/_runbooks/RB-STATIC-ANALYSIS-TRIAGE.md.

on:
  # Moved OFF per-PR 2026-06-02 to keep PRs fast (was a heavy gate). Runs
  # nightly (staggered) + on-demand. Re-add pull_request only if
  # this must block PRs again.
  # PARKED 2026-08-10 (cost hygiene, owner-authorized): the daily cron is
  # commented out because this SAST lane produced ZERO successful runs of the
  # last 8 (0/8) while burning ~6 hosted min/day, and CodeQL (codeql.yml,
  # healthy 7/8) already provides the SAST gate — so this was a broken
  # duplicate paying for no signal. It stays workflow_dispatch-able. RESTORE the
  # schedule once the underlying failure is diagnosed + fixed (tracked as debt).
  # schedule:
  #   - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  # Required by codeql-action/upload-sarif.
  security-events: write
  contents: read
  actions: read
  # Required to leave the PR comment with finding summary.
  pull-requests: write

concurrency:
  group: semgrep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semgrep:
    name: Semgrep scan
    # Ephemeral Cloudflare fabric. The previous `runs-on: [self-hosted, Linux, X64]`
    # matched ZERO runners after the 2026-05-31 macOS-only cutover (the same
    # fault class the actionlint fix closed), so the job hung pending forever;
    # and the dead `returntocorp/semgrep@sha256:000…0` placeholder image + the
    # deprecated `returntocorp/semgrep-action` (returntocorp rebranded to
    # `semgrep/semgrep`) could never have run regardless. Job-`container:` also
    # needs Docker-on-Linux, which the fleet lacks, so we drop the container and
    # run Semgrep natively via the host `python3`/`pip3` — NOT
    # `actions/setup-python`, whose RUNNER_TOOL_CACHE provisioning is unwritable
    # on the fleet. (2026-06-02)
    #
    # 2026-08-31 (#1475, WP-E) — the `runs-on:` was the ONE line left behind by
    # that rewrite, and it is repointed here. But the 388-run / 0-success record
    # is NOT one story, and an earlier draft of this comment got it wrong in a
    # way worth leaving on the record, because the wrong version predicts a lane
    # that goes green and the right one predicts a lane that fails on its first
    # dispatch. Measured against the run history, the 0/388 has TWO historical
    # causes and neither is "billing will not grant a hosted box":
    #
    #   1. Dead label + placeholder image (346 of the 388 runs). `ubuntu-latest`
    #      only entered this file on 2026-06-19 (3b21a297, #389), so the
    #      MAJORITY of the record predates the label entirely: those runs asked
    #      for `[self-hosted, Linux, X64]` — matching zero runners — and/or the
    #      `returntocorp/semgrep@sha256:000…0` placeholder image.
    #   2. In the `ubuntu-latest` era the lane DID get a hosted runner and
    #      failed INSIDE the scan. Run 31365335113 (2026-08-10) reports
    #      `runner_name: "GitHub Actions 1000003886"`, ran 6m35s, and ended:
    #      `Ran 474 rules on 6345 files: 4228 findings (4228 blocking)` — with
    #      `--error`, that is exit 1. Same signature in 29481995796 and
    #      30801766782. A second, independent failure follows it: the SARIF
    #      upload needs Advanced Security enabled for code scanning, and it is
    #      not.
    #
    # So repointing `runs-on:` is necessary and not sufficient: the FIRST green
    # dispatch also needs the 4228 blocking findings triaged and an `--error`
    # policy decision. That is tracked as a backlog item, not fixed here.
    #
    # Temporal note, stated the way it measures: this lane has not executed
    # since 2026-08-10, and its `on:` block is `workflow_dispatch` ONLY (the
    # `schedule:` has been commented out since 2026-08-10). Nothing dispatches
    # it on a clock.
    #
    # 2026-08-31 (WP-CI) — the DESTINATION is the half that needed synthesis.
    # #1475 sent it to `[self-hosted, mac, corelink-builder]`, which is the
    # owner's Mac: the same machine that hit load average 234 and 95% disk on
    # 2026-08-30, and the machine this campaign exists to empty. Stated
    # precisely — because the `on:` block above is `workflow_dispatch` ONLY,
    # NEITHER destination generates automatic load; nothing schedules this scan.
    # The choice is therefore about where a ~20-minute multi-rulepack scan lands
    # WHEN someone dispatches it, and about not building a new dependency on the
    # Mac in the campaign whose whole purpose is to remove them.
    #
    # `corelink` runs it and the Mac does not have to. The body's two real
    # requirements are met there and were measured, not assumed:
    #   - "no docker": the fleet has no daemon, which is precisely why the
    #     container: form was dropped — the constraint is satisfied, not fought.
    #   - python3: 3.12.3 is baked into the image, and the install step below
    #     builds its OWN venv (`python3 -m venv .semgrep-venv`) and then uses
    #     that venv's pip. It never calls a host `pip3` — so the older comment's
    #     "host python3/pip3" overstated the dependency. `python3-venv` is an
    #     apt package in the runner image, so the venv resolves.
    # No `actions/setup-python` either way: RUNNER_TOOL_CACHE is unset on both
    # self-hosted fleets and the action dies on an unwritable path.
    runs-on: corelink
    timeout-minutes: 20

    # Skip duplicate runs on dependabot push events (PR already covers them).
    if: (github.actor != 'dependabot[bot]')

    steps:
      - name: Checkout
        # actions/checkout v7.0.0 — SHA-pinned (matches the verified ref).
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7.0.0

      - name: Run Semgrep (separate bundled and CoreLink packs)
        id: semgrep
        shell: bash
        # Semgrep 1.164.0 installed into a throwaway venv (no Docker, no
        # setup-python). Read off the `run:` block below, which is the only
        # authority here: the host `python3` is resolved with `command -v` and
        # used for exactly ONE thing — `python3 -m venv .semgrep-venv`. After
        # `source .semgrep-venv/bin/activate`, every install goes through THAT
        # venv's own pip (`python -m pip install …`). No host `pip3` is ever
        # invoked; the only host dependency is `python3` plus the `python3-venv`
        # apt package baked into the runner image. Pinned per HIGH_RISK
        # FF-HR-005 + ADR-S12-045 §6 — bump only via ADR + Security review
        # (§14.s12.004.1).
        #
        # The bundled and custom scans are intentionally separate so their
        # SARIF counts/severities cannot be conflated. Semgrep itself does not
        # receive `--error`: scripts/verify_b139_semgrep.py is the explicit
        # policy evaluator and fails closed only for SARIF level `error` or a
        # scanner/output failure. This preserves blocking semantics without
        # turning every finding into an implicit gate.
        run: |
          set -uo pipefail
          PYBIN="$(command -v python3)"
          echo "Using interpreter: ${PYBIN} ($(${PYBIN} --version 2>&1))"
          "${PYBIN}" -m venv .semgrep-venv
          # shellcheck disable=SC1091
          source .semgrep-venv/bin/activate
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "semgrep==1.164.0"
          semgrep --version
          set +e
          semgrep scan \
            --config p/security-audit \
            --config p/rust \
            --config p/typescript \
            --config p/python \
            --config p/owasp-top-ten \
            --config p/cwe-top-25 \
            --sarif --output semgrep-bundled.sarif \
            --metrics off
          BUNDLED_RC=$?
          semgrep scan \
            --config ./semgrep.yml \
            --sarif --output semgrep-custom.sarif \
            --metrics off
          CUSTOM_RC=$?
          set -e
          echo "bundled_rc=${BUNDLED_RC}" >> "$GITHUB_OUTPUT"
          echo "custom_rc=${CUSTOM_RC}" >> "$GITHUB_OUTPUT"
          test -f semgrep-bundled.sarif || echo "::error::bundled SARIF was not emitted"
          test -f semgrep-custom.sarif || echo "::error::custom SARIF was not emitted"
          exit 0
        env:
          # Consumed by `semgrep scan` for any GitHub-API interactions; granted
          # via the workflow `permissions` block above.
          SEMGREP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload bundled SARIF to GitHub Security tab
        # github/codeql-action/upload-sarif@v4.37.1 (same verified pin as codeql.yml
        # init/analyze; bump together via single ADR).
        #
        # SARIF upload requires GitHub Advanced Security (code scanning). The
        # upload outcome is recorded explicitly after both upload attempts;
        # a non-success is unavailable_or_unverified, never a claim that the
        # Security tab received this SARIF. `continue-on-error` keeps delivery
        # capability separate from the fail-closed Semgrep policy evaluator.
        continue-on-error: true
        id: upload_bundled
        if: always() && hashFiles('semgrep-bundled.sarif') != ''
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a  # github/codeql-action/upload-sarif@v4.37.1
        with:
          sarif_file: semgrep-bundled.sarif
          category: semgrep-bundled

      - name: Upload custom SARIF to GitHub Security tab
        # GHAS may be unavailable. A failed upload is retained as an explicit
        # unavailable_or_unverified outcome below, never reported as success.
        continue-on-error: true
        id: upload_custom
        if: always() && hashFiles('semgrep-custom.sarif') != ''
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a  # github/codeql-action/upload-sarif@v4.37.1
        with:
          sarif_file: semgrep-custom.sarif
          category: semgrep-custom

      - name: Evaluate explicit Semgrep ERROR policy
        id: policy
        if: always()
        run: |
          python3 scripts/verify_b139_semgrep.py --evaluate --bundled-sarif semgrep-bundled.sarif --custom-sarif semgrep-custom.sarif --bundled-rc "${{ steps.semgrep.outputs.bundled_rc }}" --custom-rc "${{ steps.semgrep.outputs.custom_rc }}" --report semgrep-b139-report.json

      - name: Record SARIF upload truth
        if: always()
        env:
          BUNDLED_UPLOAD_OUTCOME: ${{ steps.upload_bundled.outcome }}
          CUSTOM_UPLOAD_OUTCOME: ${{ steps.upload_custom.outcome }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          from pathlib import Path

          report_path = Path("semgrep-b139-report.json")
          if report_path.is_file():
              report = json.loads(report_path.read_text())
          else:
              report = {"schema_version": 1, "finding": "B-139", "status": "missing-policy-report"}
          def truth(name):
              return "uploaded" if os.environ.get(name) == "success" else "unavailable_or_unverified"
          report["sarif_upload"] = {
              "bundled": truth("BUNDLED_UPLOAD_OUTCOME"),
              "custom": truth("CUSTOM_UPLOAD_OUTCOME"),
              "advanced_security_claim": "verified" if (
                  truth("BUNDLED_UPLOAD_OUTCOME") == "uploaded"
                  and truth("CUSTOM_UPLOAD_OUTCOME") == "uploaded"
              ) else "unverified-until-upload-step-succeeds",
          }
          report_path.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          print(json.dumps(report["sarif_upload"], sort_keys=True))
          PYEOF

      - name: Retain Semgrep evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7.0.1
        with:
          name: semgrep-b139-evidence-${{ github.run_id }}
          path: |
            semgrep-bundled.sarif
            semgrep-custom.sarif
            semgrep-b139-report.json
          if-no-files-found: error
          retention-days: 90

      - name: Summarise findings in step output
        if: always()
        run: |
          if [ -f semgrep-b139-report.json ]; then
            cat semgrep-b139-report.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::No Semgrep policy report emitted — evidence gap."
          fi
