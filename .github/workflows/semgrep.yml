name: Semgrep (R-prep static analysis)

# Semgrep CI gate — pre-pentest engagement R-prep wave companion to CodeQL.
#
# Why both Semgrep + CodeQL?
#   - CodeQL is excellent at dataflow/taint queries but has experimental
#     Rust support and slower run-time (~30 min).
#   - Semgrep gives us syntactic + lightweight semantic scanning across
#     all CoreLink languages (Rust, TS, Python, YAML/Dockerfile/Terraform)
#     in < 5 min, plus the ability to run custom CoreLink-specific rules
#     (see `semgrep.yml` at the repo root for the project-local rulepack).
#
# Triggers:
#   - pull_request: every PR.
#   - push to main: full sweep on default branch.
#   - schedule: weekly Mon 03:00 UTC (1h after CodeQL cron — staggered to
#     avoid runner contention).
#   - workflow_dispatch: manual trigger for ops re-run.
#
# Fail policy:
#   PR mode → fail-closed on any ERROR-severity finding from the bundled
#   rulesets OR any of the custom CoreLink rules in `semgrep.yml`. Lower
#   severities are surfaced as PR comments + SARIF upload but do not block.
#
# SARIF uploaded to GHA Security tab via github/codeql-action/upload-sarif
# (SAME action CodeQL uses for SARIF upload — only the upload step, not
# the init/analyze pair).
#
# SHA-pinned per HIGH_RISK lane FF-HR-005 + ADR-S12-045 §6.
#
# Cross-refs:
#   - SOC2 rollup: CC8.1 (change management — static-analysis gate evidence).
#   - ROADMAP-TO-GA.md §7 Wave R-7 (Evidence Gate).
#   - Pre-pentest cutoff 2026-06-15.
#   - Custom rule pack: `semgrep.yml` (repo root).
#   - Runbook: specs/_runbooks/RB-STATIC-ANALYSIS-TRIAGE.md.

on:
  # Moved OFF per-PR 2026-06-02 to keep PRs fast (was a heavy gate). Runs
  # nightly (staggered) + on-demand. Re-add pull_request only if
  # this must block PRs again.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  # Required by codeql-action/upload-sarif.
  security-events: write
  contents: read
  actions: read
  # Required to leave the PR comment with finding summary.
  pull-requests: write

concurrency:
  group: semgrep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semgrep:
    name: Semgrep scan
    # macOS self-hosted fleet. The previous `runs-on: [self-hosted, Linux, X64]`
    # matched ZERO runners after the 2026-05-31 macOS-only cutover (the same
    # fault class the actionlint fix closed), so the job hung pending forever;
    # and the dead `returntocorp/semgrep@sha256:000…0` placeholder image + the
    # deprecated `returntocorp/semgrep-action` (returntocorp rebranded to
    # `semgrep/semgrep`) could never have run regardless. Job-`container:` also
    # needs Docker-on-Linux, which the fleet lacks, so we drop the container and
    # run Semgrep natively via the host `python3`/`pip3` — NOT
    # `actions/setup-python`, whose RUNNER_TOOL_CACHE provisioning is unwritable
    # on the fleet. (2026-06-02)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Skip duplicate runs on dependabot push events (PR already covers them).
    if: (github.actor != 'dependabot[bot]')

    steps:
      - name: Checkout
        # actions/checkout v4.2.2 — SHA-pinned (matches cargo-audit.yml).
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Run Semgrep (bundled rulesets + CoreLink custom pack)
        id: semgrep
        shell: bash
        # Semgrep 1.164.0 installed via the host pip3 into a throwaway venv (no
        # Docker, no setup-python). Pinned per HIGH_RISK FF-HR-005 + ADR-S12-045
        # §6 — bump only via ADR + Security review (§14.s12.004.1).
        #
        # The `--config` flags mirror the former SEMGREP_RULES list: bundled
        # rulepacks first, the repo-local CoreLink pack LAST (local wins
        # duplicate-rule-ID tie-breaks). `--sarif --output` feeds the upload
        # step below; we capture semgrep's exit code, expose `outputs.sarif`,
        # then re-exit with it so a blocking ERROR-severity finding (`--error`)
        # fails the job — replacing the old SEMGREP_FAIL_OPEN=false — WHILE the
        # SARIF still uploads (the upload step is `if: always()`).
        run: |
          set -uo pipefail
          PYBIN="$(command -v python3)"
          echo "Using interpreter: ${PYBIN} ($(${PYBIN} --version 2>&1))"
          "${PYBIN}" -m venv .semgrep-venv
          # shellcheck disable=SC1091
          source .semgrep-venv/bin/activate
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "semgrep==1.164.0"
          semgrep --version
          set +e
          semgrep scan \
            --config p/security-audit \
            --config p/rust \
            --config p/typescript \
            --config p/python \
            --config p/owasp-top-ten \
            --config p/cwe-top-25 \
            --config ./semgrep.yml \
            --error \
            --sarif --output semgrep.sarif \
            --metrics off
          SEMGREP_RC=$?
          set -e
          if [ -f semgrep.sarif ]; then
            echo "sarif=semgrep.sarif" >> "$GITHUB_OUTPUT"
          fi
          exit "${SEMGREP_RC}"
        env:
          # Consumed by `semgrep scan` for any GitHub-API interactions; granted
          # via the workflow `permissions` block above.
          SEMGREP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF to GitHub Security tab
        # github/codeql-action/upload-sarif@v3.27.0 (same pin as codeql.yml
        # init/analyze; bump together via single ADR).
        #
        # SARIF upload requires GitHub Advanced Security (code scanning), which
        # is NOT enabled on this private repo — the upload returns "Code scanning
        # is not enabled for this repository" and would otherwise red the whole
        # Semgrep job even though the scan above (which sets the job's pass/fail
        # via its own exit code) succeeded. `continue-on-error` keeps the JOB
        # status driven by the actual Semgrep result; until GHAS is enabled this
        # upload no-ops without failing the gate. The scan still runs. Once GHAS
        # is enabled the SARIF populates the Security tab with no further change.
        # (Mirrors the tfsec pattern in terraform-lint.yml + codeql.yml.)
        continue-on-error: true
        if: always() && steps.semgrep.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # github/codeql-action/upload-sarif@v4.36.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Summarise findings in step output
        if: always()
        run: |
          if [ -f semgrep.sarif ]; then
            python3 - <<'PYEOF'
          import json
          import os
          import sys

          try:
              with open("semgrep.sarif") as f:
                  sarif = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              print("No SARIF emitted.")
              sys.exit(0)

          totals = {"error": 0, "warning": 0, "note": 0, "none": 0}
          custom_corelink = 0
          for run in sarif.get("runs", []):
              for r in run.get("results", []):
                  lvl = r.get("level", "warning")
                  totals[lvl] = totals.get(lvl, 0) + 1
                  rid = r.get("ruleId", "")
                  if rid.startswith("corelink."):
                      custom_corelink += 1

          summary = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")
          with open(summary, "a") as f:
              f.write("## Semgrep findings\n\n")
              for k, v in totals.items():
                  f.write(f"- {k}: {v}\n")
              f.write(f"\nCoreLink custom-rule hits: **{custom_corelink}**\n")
          print(json.dumps({"totals": totals, "custom_corelink": custom_corelink}))
          PYEOF
          else
            echo "::warning::No semgrep.sarif emitted — check run logs."
          fi
