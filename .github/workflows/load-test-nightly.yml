name: load-test-nightly (R3-prep)

# Runner: `corelink` (the Cloudflare container fabric — Ubuntu 24.04, apt
# available, a datacenter IP). Previously pinned to a self-hosted Linux/X64
# triple that NO runner on the fleet carries, so the job could never start
# (B-029).
# `corelink` is the correct home: this job is a load GENERATOR firing k6 at a
# remote staging endpoint, so a stable datacenter uplink matters and the host's
# own CPU does not — which is also why it was never suitable for the residential
# macOS builder fleet.
#
# STILL dispatch-only, and the reason is now the TRUE one (B-029): there is no
# staging environment to fire at. `staging.corelink.humangr.com` does not
# resolve, and the `staging` GitHub environment carries none of the secrets this
# suite reads (K6_TARGET_HOST, K6_STAGING_PAT, …). The pre-flight target-host
# check below therefore fail-closes every run until staging exists. Standing up
# a staging deployment (or retiring the staging-targeted suites) is an owner
# cost decision — see docs/internal/2026-08-24-owner-decision-brief.md. Re-add
# the nightly `schedule` in the SAME change that wires the staging secrets;
# enabling it before then only manufactures a nightly red on missing infra.
#
# R3-prep load test suite — nightly run against staging.
#
# Five k6 scenarios cover the critical paths:
#   1. signup orchestration burst
#   2. Stripe webhook idempotency replay
#   3. DSR API "annual privacy week"
#   4. CAS hot path (PUT/GET)
#   5. BYOK kill-switch stampede
#
# Does not block merges (it is dispatch-only, not a PR check), but the run
# itself DOES go red: the `baseline-regression` job fails when a scenario's
# MEDIAN `http_req_duration` regresses more than REGRESSION_THRESHOLD versus
# the stored baseline. That baseline is persisted across runs in the GitHub
# Actions cache (restore by prefix key → compare → save under a run-unique
# key), not in this run's own artifacts.
#
# Median, not p99 — same measured reason perf-regression.yml gates on the
# median: p99 jitters ~22% run-to-run on identical work on shared hosts while
# the median holds to <4%, so a 20% band on p99 is noise. p99 is still
# recorded and printed for trend review.
#
# The ONLY non-failing path when the suite produced results is: within
# threshold, or no stored baseline yet (first run seeds it and says so
# explicitly). A run that produced no k6 summary at all is a FAILURE, not a
# pass — the matrix legs are `continue-on-error`, so an empty result set would
# otherwise be a silent green.
#
# Comparison logic: scripts/load-test-baseline-check.py (a file, so it is
# runnable and provable outside CI).
#
# SHA-pinned per ADR-S12-045 §6 tooling-pin policy.

on:
  # schedule disabled: the runner is fixed (now `corelink`), but there is no
  # staging environment to load-test against — the pre-flight check fail-closes
  # on the missing K6_TARGET_HOST secret every run. Re-add this cron in the SAME
  # change that stands up staging and wires its secrets, never before:
  #   schedule:
  #     # Sundays 02:00 UTC — out of normal business + after the weekly
  #     # staging redeploy completes (Sat 22:00 UTC).
  #     - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      scenarios:
        description: 'Comma-sep list of scenarios to run (default: all)'
        required: false
        default: 'signup,webhook,dsr,cas,byok'

permissions:
  contents: read
  id-token: none
  actions: read

concurrency:
  group: load-test-nightly
  cancel-in-progress: false

env:
  # A scenario fails when its current median is more than 20% above the stored
  # baseline median. Consumed by scripts/load-test-baseline-check.py.
  REGRESSION_THRESHOLD: '1.20'
  # Cache-key namespace for the persisted baseline. Bump the `v<N>` suffix to
  # deliberately discard every stored baseline (e.g. after a staging resize
  # makes the old numbers meaningless).
  BASELINE_CACHE_PREFIX: load-test-k6-baseline-v1

jobs:
  k6-staging:
    name: k6 load suite (staging)
    runs-on: corelink
    environment: staging        # binds the staging secrets scope
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - { id: signup,  script: tests/load/k6/signup-orchestration.js,  budget: 8 }
          - { id: webhook, script: tests/load/k6/stripe-webhook-burst.js,  budget: 5 }
          - { id: dsr,     script: tests/load/k6/dsr-api.js,                budget: 15 }
          - { id: cas,     script: tests/load/k6/cas-write-read.js,         budget: 10 }
          - { id: byok,    script: tests/load/k6/byok-revoke-stampede.js,   budget: 5 }
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: filter scenarios
        id: filter
        run: |
          REQUESTED="${{ github.event.inputs.scenarios || 'signup,webhook,dsr,cas,byok' }}"
          if [[ ",$REQUESTED," == *",${{ matrix.scenario.id }},"* ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: install k6
        if: steps.filter.outputs.enabled == 'true'
        # Direct install (avoids action wrapper version drift). The Grafana
        # k6 release artifacts are gpg-signed; we use the canonical apt repo.
        run: |
          set -euo pipefail
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
          k6 version

      - name: validate script syntax
        if: steps.filter.outputs.enabled == 'true'
        run: k6 inspect ${{ matrix.scenario.script }}

      - name: pre-flight target host check
        if: steps.filter.outputs.enabled == 'true'
        env:
          K6_TARGET_HOST: ${{ secrets.K6_TARGET_HOST }}
        run: |
          set -euo pipefail
          if [[ -z "${K6_TARGET_HOST:-}" ]]; then
            echo "::error::K6_TARGET_HOST secret missing in staging environment"
            exit 1
          fi
          # Refuse anything that doesn't look like staging.
          if [[ "$K6_TARGET_HOST" != *"staging."* && "$K6_TARGET_HOST" != *"dev."* ]]; then
            echo "::error::K6_TARGET_HOST=$K6_TARGET_HOST is not a staging hostname"
            exit 1
          fi
          echo "Target: $K6_TARGET_HOST"

      - name: prepare results dir
        if: steps.filter.outputs.enabled == 'true'
        run: mkdir -p tests/load/results/${{ matrix.scenario.id }}

      - name: run k6 scenario
        if: steps.filter.outputs.enabled == 'true'
        env:
          K6_TARGET_HOST:        ${{ secrets.K6_TARGET_HOST }}
          K6_AUTH_BEARER:        ${{ secrets.K6_STAGING_PAT }}
          K6_STRIPE_WHSEC:       ${{ secrets.K6_STAGING_STRIPE_WHSEC }}
          K6_MFA_STUB_TOKEN:     ${{ secrets.K6_STAGING_MFA_STUB }}
          K6_BYOK_TEST_CMK_ID:   ${{ secrets.K6_STAGING_BYOK_CMK_ID }}
        timeout-minutes: ${{ matrix.scenario.budget }}
        # `continue-on-error` so a single scenario failure does NOT block
        # the rest of the matrix; per-script thresholds still surface as
        # non-zero exit + annotated job step in the GH UI.
        continue-on-error: true
        run: |
          set -o pipefail
          k6 run \
            --out json=tests/load/results/${{ matrix.scenario.id }}/results.json \
            --summary-export tests/load/results/${{ matrix.scenario.id }}/summary.json \
            ${{ matrix.scenario.script }}

      - name: upload results
        if: steps.filter.outputs.enabled == 'true' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k6-${{ matrix.scenario.id }}-${{ github.run_id }}
          path: tests/load/results/${{ matrix.scenario.id }}/
          retention-days: 30
          if-no-files-found: warn

  baseline-regression:
    name: baseline regression check (median ≤ +20% vs stored baseline)
    runs-on: corelink
    needs: k6-staging
    if: always()
    permissions:
      contents: read
      actions: read
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: download current run artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: k6-*-${{ github.run_id }}
          path: tests/load/results/current
          merge-multiple: true
          # If matrix legs were skipped, we still continue.
          run-id: ${{ github.run_id }}

      # Restore the PREVIOUS run's baseline. The exact key embeds this run's
      # id and therefore never hits; the restore-key prefix falls back to the
      # most recently saved baseline, which is the point.
      - name: restore stored baseline
        id: baseline-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/load/baseline
          key: ${{ env.BASELINE_CACHE_PREFIX }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.BASELINE_CACHE_PREFIX }}-

      - name: report baseline provenance
        run: |
          set -euo pipefail
          if [[ -f tests/load/baseline/k6-baseline.json ]]; then
            echo "restored baseline from cache key: ${{ steps.baseline-restore.outputs.cache-matched-key }}"
            cat tests/load/baseline/k6-baseline.json
          else
            echo "no stored baseline found — this run will SEED one and cannot regress"
          fi

      - name: compare median vs stored baseline
        id: compare
        run: |
          set -euo pipefail
          python3 scripts/load-test-baseline-check.py \
            --results-dir tests/load/results/current \
            --baseline tests/load/baseline/k6-baseline.json \
            --threshold "${REGRESSION_THRESHOLD}"

      # Only reached when the comparison passed (the step above is NOT
      # continue-on-error), so a regressing run never publishes a new
      # baseline — a regression cannot ratchet itself in by repeating.
      - name: save baseline for the next run
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/load/baseline
          key: ${{ env.BASELINE_CACHE_PREFIX }}-${{ github.run_id }}

      - name: upload baseline artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k6-baseline-${{ github.run_id }}
          path: tests/load/baseline
          retention-days: 90
          if-no-files-found: warn
