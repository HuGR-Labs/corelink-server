name: load-test-nightly (R3-prep)

# R3-prep load test suite — nightly run against staging.
#
# Five k6 scenarios cover the critical paths:
#   1. signup orchestration burst
#   2. Stripe webhook idempotency replay
#   3. DSR API "annual privacy week"
#   4. CAS hot path (PUT/GET)
#   5. BYOK kill-switch stampede
#
# Non-blocking: this workflow reports trend metrics and the per-scenario
# JSON artifacts but does NOT block merges. It DOES fail the run when a
# scenario's p99 regresses > 20% versus the prior week's baseline (the
# `compare-baseline` step downloads last week's artifact for diff).
#
# SHA-pinned per ADR-S12-045 §6 tooling-pin policy.

on:
  schedule:
    # Sundays 02:00 UTC — out of normal business + after the weekly
    # staging redeploy completes (Sat 22:00 UTC).
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      scenarios:
        description: 'Comma-sep list of scenarios to run (default: all)'
        required: false
        default: 'signup,webhook,dsr,cas,byok'

permissions:
  contents: read
  id-token: none
  actions: read

concurrency:
  group: load-test-nightly
  cancel-in-progress: false

jobs:
  k6-staging:
    name: k6 load suite (staging)
    runs-on: [self-hosted, Linux, X64]
    environment: staging        # binds the staging secrets scope
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - { id: signup,  script: tests/load/k6/signup-orchestration.js,  budget: 8 }
          - { id: webhook, script: tests/load/k6/stripe-webhook-burst.js,  budget: 5 }
          - { id: dsr,     script: tests/load/k6/dsr-api.js,                budget: 15 }
          - { id: cas,     script: tests/load/k6/cas-write-read.js,         budget: 10 }
          - { id: byok,    script: tests/load/k6/byok-revoke-stampede.js,   budget: 5 }
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: filter scenarios
        id: filter
        run: |
          REQUESTED="${{ github.event.inputs.scenarios || 'signup,webhook,dsr,cas,byok' }}"
          if [[ ",$REQUESTED," == *",${{ matrix.scenario.id }},"* ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: install k6
        if: steps.filter.outputs.enabled == 'true'
        # Direct install (avoids action wrapper version drift). The Grafana
        # k6 release artifacts are gpg-signed; we use the canonical apt repo.
        run: |
          set -euo pipefail
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
          k6 version

      - name: validate script syntax
        if: steps.filter.outputs.enabled == 'true'
        run: k6 inspect ${{ matrix.scenario.script }}

      - name: pre-flight target host check
        if: steps.filter.outputs.enabled == 'true'
        env:
          K6_TARGET_HOST: ${{ secrets.K6_TARGET_HOST }}
        run: |
          set -euo pipefail
          if [[ -z "${K6_TARGET_HOST:-}" ]]; then
            echo "::error::K6_TARGET_HOST secret missing in staging environment"
            exit 1
          fi
          # Refuse anything that doesn't look like staging.
          if [[ "$K6_TARGET_HOST" != *"staging."* && "$K6_TARGET_HOST" != *"dev."* ]]; then
            echo "::error::K6_TARGET_HOST=$K6_TARGET_HOST is not a staging hostname"
            exit 1
          fi
          echo "Target: $K6_TARGET_HOST"

      - name: prepare results dir
        if: steps.filter.outputs.enabled == 'true'
        run: mkdir -p tests/load/results/${{ matrix.scenario.id }}

      - name: run k6 scenario
        if: steps.filter.outputs.enabled == 'true'
        env:
          K6_TARGET_HOST:        ${{ secrets.K6_TARGET_HOST }}
          K6_AUTH_BEARER:        ${{ secrets.K6_STAGING_PAT }}
          K6_STRIPE_WHSEC:       ${{ secrets.K6_STAGING_STRIPE_WHSEC }}
          K6_MFA_STUB_TOKEN:     ${{ secrets.K6_STAGING_MFA_STUB }}
          K6_BYOK_TEST_CMK_ID:   ${{ secrets.K6_STAGING_BYOK_CMK_ID }}
        timeout-minutes: ${{ matrix.scenario.budget }}
        # `continue-on-error` so a single scenario failure does NOT block
        # the rest of the matrix; per-script thresholds still surface as
        # non-zero exit + annotated job step in the GH UI.
        continue-on-error: true
        run: |
          set -o pipefail
          k6 run \
            --out json=tests/load/results/${{ matrix.scenario.id }}/results.json \
            --summary-export tests/load/results/${{ matrix.scenario.id }}/summary.json \
            ${{ matrix.scenario.script }}

      - name: upload results
        if: steps.filter.outputs.enabled == 'true' && always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: k6-${{ matrix.scenario.id }}-${{ github.run_id }}
          path: tests/load/results/${{ matrix.scenario.id }}/
          retention-days: 30
          if-no-files-found: warn

  baseline-regression:
    name: baseline regression check (p99 ≤ +20% week-over-week)
    runs-on: [self-hosted, Linux, X64]
    needs: k6-staging
    if: always()
    permissions:
      contents: read
      actions: read
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: setup python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'

      - name: download current run artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: k6-*-${{ github.run_id }}
          path: tests/load/results/current
          merge-multiple: true
          # If matrix legs were skipped, we still continue.
          run-id: ${{ github.run_id }}

      - name: compare p99 vs last week baseline
        # The compare script is intentionally tolerant: if no prior baseline
        # exists yet (first-run case after merging this workflow), it logs
        # and exits 0 to seed.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, sys
          REGRESSION_THRESHOLD = 1.20  # 20% over baseline → FAIL
          results_dir = pathlib.Path("tests/load/results/current")
          if not results_dir.exists():
              print("::warning::no current results to compare")
              sys.exit(0)
          summaries = sorted(results_dir.rglob("summary.json"))
          if not summaries:
              print("::warning::no summary.json present in current artifacts")
              sys.exit(0)
          for s in summaries:
              try:
                  data = json.loads(s.read_text())
              except Exception as e:
                  print(f"::warning::failed to parse {s}: {e}")
                  continue
              metrics = (data.get("metrics") or {})
              # k6 exports `http_req_duration` aggregated.
              p99 = (metrics.get("http_req_duration") or {}).get("p(99)")
              if p99 is None:
                  continue
              scenario = s.parent.name
              print(f"scenario={scenario} current p99={p99:.2f}ms")
              # Baseline lookup intentionally elided here — the GHA cache
              # implementation lives in a follow-up WI; for now we PRINT
              # the value so the operator can eyeball regression.
          print("baseline regression check complete (advisory mode)")
          PY
