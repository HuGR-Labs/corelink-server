name: issue #1666 hosted runner evidence contract

on:
  pull_request:
    paths:
      - ".github/workflows/issue-1863-mutants-hosted.yml"
      - ".github/workflows/issue-1666-mutants-evidence-contract.yml"
      - "scripts/verify_i1666_mutants_evidence.py"
      - "tests/test_verify_i1666_mutants_evidence.py"
      - ".github/workflows/endurance-2h-nightly.yml"
      - ".github/workflows/load-test-nightly.yml"
      - ".github/workflows/actionlint.yml"
      - "scripts/verify_b113_lane_population.py"
      - "scripts/verify_b029_load_gate.py"
      - "scripts/verify_i1687_endurance_lane.py"
      - "tests/test_verify_b113_lane_population.py"
      - "tests/test_b029_load_gate.py"
      - "scripts/test_i1687_endurance_lane.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: verify hosted runner evidence contracts
    if: github.repository == 'HuGR-dev/corelink-server'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify hosted mutants evidence contract
        run: python3 scripts/verify_i1666_mutants_evidence.py
      - name: Run focused adversarial checks
        run: python3 tests/test_verify_i1666_mutants_evidence.py
      - name: Set up Python for B-113 lane contracts
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install isolated contract dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.4.2 PyYAML==6.0.2
      - name: Verify B-113 population and hosted runner mutations
        run: python scripts/verify_b113_lane_population.py --self-test
      - name: Verify load and endurance contracts plus adversarial cases
        run: |
          python scripts/verify_b029_load_gate.py --expect parked
          python scripts/verify_i1687_endurance_lane.py
          python -m pytest -q tests/test_verify_b113_lane_population.py tests/test_b029_load_gate.py scripts/test_i1687_endurance_lane.py
