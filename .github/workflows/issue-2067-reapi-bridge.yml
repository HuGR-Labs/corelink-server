name: Issue 2067 — authenticated REAPI bridge

on:
  # This branch trigger lets the first introduction of this workflow execute
  # its own credentialless gate. Subsequent changes are covered by PR paths.
  push:
    branches:
      - "codex/i2067-reapi-bridge"
  pull_request:
    paths:
      - ".github/workflows/issue-2067-reapi-bridge.yml"
      - "scripts/verify_i2067_reapi_bridge.py"
      - "crates/corelink-container/src/grpc_reapi.rs"
      - "crates/corelink-container/src/main.rs"
      - "crates/corelink-container/src/routes/build.rs"
      - "crates/corelink-reapi/proto/build/bazel/remote/execution/v2/remote_execution.proto"
      - "examples/buck2-starter/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-2067-reapi-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Credentialless REAPI contract and mutations
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify ingress contract and negative mutations
        run: python3 scripts/verify_i2067_reapi_bridge.py
      - name: Compile and run focused ingress unit checks
        run: cargo test --locked -p corelink-server grpc_reapi::tests:: --lib
