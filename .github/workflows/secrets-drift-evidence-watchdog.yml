name: secrets-drift evidence watchdog

# The scanner runs on the product-owned `corelink` runner to preserve the
# zero-hosted-CI mandate. This is a separate scheduled workflow so a missing or
# never-started scanner run is observable; a step in the scanner cannot observe
# a job that never received a runner.
#
# The watchdog checks GitHub's platform truth (run status + retained artifact),
# not a local marker. A failure opens/updates one issue with a stable marker.

on:
  schedule:
    # One hour after the scanner's 04:00 UTC cron, leaving room for queueing.
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: secrets-drift-evidence-watchdog
  cancel-in-progress: false

jobs:
  inspect:
    name: Verify daily secrets-drift evidence exists
    # Prefer a separately hosted observer only when the owner has explicitly
    # enabled the repository variable. The variable is not provisioned here or
    # treated as proof that billing is available; when absent/false we remain on
    # the product-owned fabric and fail closed if that fabric cannot observe.
    runs-on: ${{ vars.HOSTED_ACTIONS_AVAILABLE == 'true' && 'ubuntu-latest' || 'corelink' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Inspect scheduled run and report artifact
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 scripts/check_secrets_drift_evidence.py \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow secrets-drift.yml \
            --max-age-hours 26 \
            --report artifacts/secrets-drift-evidence-watchdog.json

      - name: Upload watchdog evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secrets-drift-evidence-watchdog-${{ github.run_id }}
          path: artifacts/secrets-drift-evidence-watchdog.json
          retention-days: 90
          if-no-files-found: error

      - name: Open or update evidence-gap issue
        if: steps.evidence.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT_PATH: artifacts/secrets-drift-evidence-watchdog.json
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- secrets-drift-evidence-gap -->';
            const report = fs.existsSync(process.env.REPORT_PATH)
              ? JSON.parse(fs.readFileSync(process.env.REPORT_PATH, 'utf8'))
              : { status: 'watchdog_error', reason: 'watchdog report was not produced' };
            const { owner, repo } = context.repo;
            const title = '[SEV-2] secrets-drift daily evidence gap';
            const body = [
              marker,
              '## Daily secrets-drift evidence gap',
              '',
              `The watchdog could not prove that the daily SOC 2 CC6.1 report exists: **${report.reason}**.`,
              '',
              `- Status: ${report.status}`,
              `- Run: ${report.html_url || 'not observed'}`,
              `- Watchdog run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              '- Expected artifact: `secrets-drift-report` (90-day retention)',
              '',
              'Action: follow `specs/_runbooks/RB-SECRETS-DRIFT.md`, restore the scheduled scan, and attach the retained report before closing this issue.',
            ].join('\n');
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const existing = open.find((issue) => issue.body && issue.body.includes(marker));
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, title, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }

      - name: Fail closed on evidence gap
        if: steps.evidence.outcome == 'failure'
        run: |
          echo 'Daily secrets-drift evidence is absent or unhealthy; see the tracking issue and watchdog artifact.' >&2
          exit 1
