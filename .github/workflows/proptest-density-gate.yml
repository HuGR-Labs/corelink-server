name: proptest-density-gate

# Enforce proptest density (≥ 1.0 proptests per INV ref) across the
# workspace. Allowlist `scripts/proptest-density-allowlist.txt` tolerates
# pre-existing gaps (each tagged with a closing WI ID).
#
# Source audit:   specs/_audits/sealed/2026-05-15-proptest-density.md
# Follow-up WI:   WI-PROPTEST-FU-005 (DEBT-017)
# Gate script:    scripts/check_proptest_density_gate.sh

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'scripts/audit_proptest_density.sh'
      - 'scripts/check_proptest_density_gate.sh'
      - 'scripts/proptest-density-allowlist.txt'
      - '.github/workflows/proptest-density-gate.yml'
  # NOTE: no `push: branches:[main]`. The density audit compiles the workspace on
  # the self-hosted macOS fleet (5 runners = one Mac) and was a recurring near-OOM
  # driver — EVEN path-filtered, a crate-touching merge re-ran the full proptest
  # build on top of the rest of the heavy-gate fleet on every main merge (load
  # 398/665, 2026-06-04). Moved to nightly + on-demand, matching the 977225d3
  # "stop heavy-gate stampede" sweep (2026-06-02, ADR-S12-045 §Schedule). The PR
  # `paths:` lane above still enforces density on every crate/script change.
  schedule:
    # Nightly at 04:31 UTC — staggered into the Rust-compile nightly band
    # (between corelink-* component gates at 04:23 and 04:37) to spread fleet load.
    - cron: '31 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  density-gate:
    name: proptest density gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      - name: Run density audit
        id: audit
        run: |
          bash scripts/audit_proptest_density.sh | tee /tmp/proptest_density.csv

      - name: Enforce density gate
        run: bash scripts/check_proptest_density_gate.sh

      - name: Upload density report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proptest-density-report
          path: /tmp/proptest_density.csv
          retention-days: 14
