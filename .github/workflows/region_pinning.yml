name: Region pinning enforcement gate (WI-S14-002)

# CI gate for WI-S14-002 — Tenant region pinning enforcement + 30k property test.
#
# Enforces INV-REGION-NO-CROSS-LEAK CRITICAL (Schrems II + LGPD Art. 33 §1º):
#   - PR gate: 30k property test via PROPTEST_CASES=30000 (default in code).
#   - Nightly: 100k property test via PROPTEST_CASES=100000.
#   - Adversarial regression tests: 10 scenarios (subdomain spoof, header tamper,
#     cache poison, replay, D1 mutation, KV namespace, etc.).
#   - Migration additivity check (migration 0028 is additive-only).
#   - Clippy -D warnings clean.
#   - All tests fail-closed (HIGH_RISK lane FF-HR-002 + FF-HR-003).
#
# On PR: all jobs required.
# Nightly (cron 02:17 UTC): 100k iter extended run + nightly aggregate.

on:
  pull_request:
    paths:
      - 'crates/corelink-privacy/**'
      - 'migrations/d1/0028_tenant_primary_region.sql'
      - 'specs/04_sprints/S14/**'
      - 'specs/05_quality/runbooks/RB-region-leak.md'
      - 'specs/03_architecture/adrs/ADR-S14-002-region-pinning-enforcement.md'
      - '.github/workflows/region_pinning.yml'
  # ⛔ CRON REMOVED 2026-08-02 — redundant: this workflow already has a
  # `pull_request` trigger, so the code IS verified when it changes. The
  # nightly re-verified BYTE-IDENTICAL code: 10 of the last 14 days had
  # ZERO commits to main, and the self-hosted Mac (the founder's own
  # machine) was spending ~8.8 h/day on scheduled jobs, 75% of which
  # failed. A clock only earns its keep when something can change
  # WITHOUT a commit — CVE feeds, prod state, backups, certs. This
  # workflow is none of those.
  # Restore by uncommenting if this ever stops being PR-gated.
  # # 02:17 UTC nightly — staggered from existing nightly crons (:04, :23).
  # # CI cost diet 2026-08-02: daily -> WEEKLY. ~33 min/run and already tightly path-gated on PRs.
  # # Kept the same minute/hour (spread out, low-traffic window); only the
  # # weekday field is added. Per-PR gating is unchanged.
  # - cron: '17 2 * * 2'
  workflow_dispatch:
    inputs:
      proptest_cases:
        description: 'PROPTEST_CASES override (default: 30000 PR / 100000 nightly)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Migration additivity check — 0028 must be additive-only.
  # ────────────────────────────────────────────────────────────────────────────
  migration-check:
    name: migration additivity check (0028_tenant_primary_region)
    runs-on: corelink  # zero-hosted: pure python3 (baked into the corelink image)
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: check_migrations_additive.py
        run: python3 scripts/check_migrations_additive.py

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Clippy + all existing tests (lib + integration + property_20k + regression).
  # ────────────────────────────────────────────────────────────────────────────
  clippy-and-existing-tests:
    name: clippy -D warnings + corelink-privacy all tests
    runs-on: [self-hosted, mac, corelink-builder]
    # Timeout raised 20 → 35 (2026-08-01). The original 20 was never calibrated
    # against a real run — the authoring commit (cc65c4ee) sealed on a fabricated
    # verification block, so NO number in this workflow was ever observed green.
    # 20 min is a hard cold-compile + full-test-surface miss on the shared
    # self-hosted Mac (observed: cancelled at 20m51s, run 30715557213).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Self-hosted Macs already ship rustup+cargo; re-provisioning via
      # dtolnay/rust-toolchain collides on `bin/cargo`. Put the pre-installed
      # host toolchain (workspace pins 1.91.1 via rust-toolchain.toml) on PATH
      # instead — see CLAUDE.md "the rustup proxy is broken" note.
      - name: Use the workspace-pinned host toolchain (channel read from rust-toolchain.toml)
        run: bash scripts/ci-use-host-toolchain.sh

      # save-if: false — the SAVE post-step is disabled on this self-hosted fleet.
      # Measured 2026-08-01 (run 30715557213 / 30717730219, adversarial-tests job):
      # cache RESTORE took 5s and MISSED (restored nothing), while the `Post Run`
      # SAVE ran 3m36s and was still going when it consumed the job's entire
      # timeout budget — the test step itself had already SUCCEEDED at 21m11s.
      # These runners are persistent Macs with a fixed `_work/.../target` on local
      # disk, so the real cache is that directory, not a GitHub-hosted archive
      # uploaded off the founder's machine on every job. Restore is kept (5s, free
      # upside if a cache ever exists); only the save cost is dropped.
      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          workspaces: ". -> target"
          save-if: 'false'

      - name: clippy -D warnings
        run: >
          cargo clippy
          -p corelink-privacy
          --all-targets
          -- -D warnings

      - name: cargo test -p corelink-privacy --all-targets
        # `--all-targets` sweeps ALL 23 test binaries in the crate, which INCLUDES
        # residency_property_region_pinning_30k and residency_property_residency_20k.
        # Left unbounded, this job re-ran the 30k density a THIRD time (in DEBUG —
        # far slower than the dedicated `--release` job below), duplicating the
        # proptest-30k job for zero added assurance and driving the 20m timeout.
        # The MANDATED density is owned by proptest-30k (30k, release) and
        # proptest-100k-nightly (100k); here the proptest targets run at a smoke
        # density instead. 1000 is the floor asserted by
        # test_proptest_cases_runtime_configurable_s14 (`cases >= 1_000`).
        env:
          PROPTEST_CASES: '1000'
        run: cargo test -p corelink-privacy --all-targets

  # ────────────────────────────────────────────────────────────────────────────
  # 3. 30k property test (PR gate) — INV-REGION-NO-CROSS-LEAK.
  # ────────────────────────────────────────────────────────────────────────────
  proptest-30k:
    name: 30k property test — INV-REGION-NO-CROSS-LEAK (PR gate)
    runs-on: [self-hosted, mac, corelink-builder]
    # Timeout raised 30 → 50 (2026-08-01). Never calibrated against a real run
    # (see the clippy job's note); observed cancelled at 30m22s on the shared
    # self-hosted Mac (run 30715557213) — a cold `--release` build of the
    # corelink-privacy dep graph plus 4 × 30k proptest blocks does not fit 30 min
    # under fleet contention.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Self-hosted Macs already ship rustup+cargo; re-provisioning via
      # dtolnay/rust-toolchain collides on `bin/cargo`. Put the pre-installed
      # host toolchain (workspace pins 1.91.1 via rust-toolchain.toml) on PATH
      # instead — see CLAUDE.md "the rustup proxy is broken" note.
      - name: Use the workspace-pinned host toolchain (channel read from rust-toolchain.toml)
        run: bash scripts/ci-use-host-toolchain.sh

      # save-if: false — the SAVE post-step is disabled on this self-hosted fleet.
      # Measured 2026-08-01 (run 30715557213 / 30717730219, adversarial-tests job):
      # cache RESTORE took 5s and MISSED (restored nothing), while the `Post Run`
      # SAVE ran 3m36s and was still going when it consumed the job's entire
      # timeout budget — the test step itself had already SUCCEEDED at 21m11s.
      # These runners are persistent Macs with a fixed `_work/.../target` on local
      # disk, so the real cache is that directory, not a GitHub-hosted archive
      # uploaded off the founder's machine on every job. Restore is kept (5s, free
      # upside if a cache ever exists); only the save cost is dropped.
      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          workspaces: ". -> target"
          save-if: 'false'

      - name: 30k property test — residency_property_region_pinning_30k
        # PROPTEST_CASES defaults to 30_000 in code; CI env confirms it explicitly.
        env:
          PROPTEST_CASES: ${{ inputs.proptest_cases || '30000' }}
        run: >
          cargo test
          -p corelink-privacy
          --test residency_property_region_pinning_30k
          --release

  # ────────────────────────────────────────────────────────────────────────────
  # 4. Adversarial regression tests — 10 scenarios.
  # ────────────────────────────────────────────────────────────────────────────
  adversarial-tests:
    name: adversarial regression tests (10 scenarios)
    runs-on: [self-hosted, mac, corelink-builder]
    # Timeout raised 10 → 30 (2026-08-01). Never calibrated against a real run
    # (see the clippy job's note). Measured twice: cancelled at 10m31s under the
    # original 10 (run 30715557213), then under a first-pass 25 the TEST STEP
    # SUCCEEDED at 21m11s and the job was still cancelled — in the rust-cache
    # SAVE post-step, now disabled above. The 10 scenarios are sub-second; the
    # cost is the cold cargo build of the corelink-privacy dep graph, which this
    # job pays independently of the two jobs above.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Self-hosted Macs already ship rustup+cargo; re-provisioning via
      # dtolnay/rust-toolchain collides on `bin/cargo`. Put the pre-installed
      # host toolchain (workspace pins 1.91.1 via rust-toolchain.toml) on PATH
      # instead — see CLAUDE.md "the rustup proxy is broken" note.
      - name: Use the workspace-pinned host toolchain (channel read from rust-toolchain.toml)
        run: bash scripts/ci-use-host-toolchain.sh

      # save-if: false — the SAVE post-step is disabled on this self-hosted fleet.
      # Measured 2026-08-01 (run 30715557213 / 30717730219, adversarial-tests job):
      # cache RESTORE took 5s and MISSED (restored nothing), while the `Post Run`
      # SAVE ran 3m36s and was still going when it consumed the job's entire
      # timeout budget — the test step itself had already SUCCEEDED at 21m11s.
      # These runners are persistent Macs with a fixed `_work/.../target` on local
      # disk, so the real cache is that directory, not a GitHub-hosted archive
      # uploaded off the founder's machine on every job. Restore is kept (5s, free
      # upside if a cache ever exists); only the save cost is dropped.
      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          workspaces: ". -> target"
          save-if: 'false'

      - name: adversarial regression tests — residency_region_adversarial
        run: >
          cargo test
          -p corelink-privacy
          --test residency_region_adversarial

  # ────────────────────────────────────────────────────────────────────────────
  # 5. RB-region-leak dry-run script.
  # ────────────────────────────────────────────────────────────────────────────
  rb-region-leak-dry-run:
    name: RB-region-leak dry-run (INV-REGION-NO-CROSS-LEAK forensic)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: RB-region-leak dry-run
        run: bash scripts/rb_region_leak_dry_run.sh

  # ────────────────────────────────────────────────────────────────────────────
  # 6. Workflow YAML parse smoke.
  # ────────────────────────────────────────────────────────────────────────────
  workflow-yaml-smoke:
    name: region_pinning.yml YAML parse smoke
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: region_pinning.yml parse smoke
        run: python3 -c "import yaml; yaml.safe_load(open('.github/workflows/region_pinning.yml'))"

  # ────────────────────────────────────────────────────────────────────────────
  # 7. Aggregate gate (fan-in for required-status-checks branch protection).
  # ────────────────────────────────────────────────────────────────────────────
  region-pinning-gate:
    name: region pinning gate (aggregate — INV-REGION-NO-CROSS-LEAK)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs:
      - migration-check
      - clippy-and-existing-tests
      - proptest-30k
      - adversarial-tests
      - rb-region-leak-dry-run
      - workflow-yaml-smoke
    steps:
      - name: Aggregate
        run: echo "region pinning gate green — INV-REGION-NO-CROSS-LEAK ratificada; 0 leaks."

  # ────────────────────────────────────────────────────────────────────────────
  # 8. Nightly 100k iter (cron only — not required for PR gate).
  # ────────────────────────────────────────────────────────────────────────────
  proptest-100k-nightly:
    name: 100k property test NIGHTLY — sustained INV-REGION-NO-CROSS-LEAK
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 60
    # Only runs on schedule or manual dispatch with explicit override
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Self-hosted Macs already ship rustup+cargo; re-provisioning via
      # dtolnay/rust-toolchain collides on `bin/cargo`. Put the pre-installed
      # host toolchain (workspace pins 1.91.1 via rust-toolchain.toml) on PATH
      # instead — see CLAUDE.md "the rustup proxy is broken" note.
      - name: Use the workspace-pinned host toolchain (channel read from rust-toolchain.toml)
        run: bash scripts/ci-use-host-toolchain.sh

      # save-if: false — the SAVE post-step is disabled on this self-hosted fleet.
      # Measured 2026-08-01 (run 30715557213 / 30717730219, adversarial-tests job):
      # cache RESTORE took 5s and MISSED (restored nothing), while the `Post Run`
      # SAVE ran 3m36s and was still going when it consumed the job's entire
      # timeout budget — the test step itself had already SUCCEEDED at 21m11s.
      # These runners are persistent Macs with a fixed `_work/.../target` on local
      # disk, so the real cache is that directory, not a GitHub-hosted archive
      # uploaded off the founder's machine on every job. Restore is kept (5s, free
      # upside if a cache ever exists); only the save cost is dropped.
      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          workspaces: ". -> target"
          save-if: 'false'

      - name: 100k property test NIGHTLY — residency_property_region_pinning_30k
        env:
          PROPTEST_CASES: ${{ inputs.proptest_cases || '100000' }}
        run: >
          cargo test
          -p corelink-privacy
          --test residency_property_region_pinning_30k
          --release
