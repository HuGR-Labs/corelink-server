name: d1-migration-validate (R2-13)

# R2-13 — validation gate for any PR that touches `migrations/d1/**`.
#
# Three steps, all offline (no Cloudflare auth required):
#   1. python3 scripts/check_migrations_additive.py     — INV-AUTH-MIGRATION-ADDITIVE
#   2. python3 scripts/d1-migration-verify.py --schema-only — schema parser sanity
#   3. cargo test -p corelink-ops --test migrations_d1_migration_integration
#      — full SQL replay against in-memory SQLite (catches ordering bugs +
#        schema dependency hazards before they reach D1)
#
# Why offline only? Real `wrangler d1 migrations apply` against staging/prod
# happens via scripts/d1-migration-runner.sh from an operator workstation
# with Cloudflare auth + the staging/prod D1 binding ID. See
# specs/_runbooks/RB-D1-MIGRATION-APPLY.md.
#
# SHA-pinned per ADR-S12-045 §6 tooling-pin policy.

on:
  pull_request:
    paths:
      - 'migrations/**'
      - 'scripts/d1-migration-runner.sh'
      - 'scripts/d1-migration-verify.py'
      - 'scripts/check_migrations_additive.py'
      - 'scripts/check_migration_prefixes.py'
      - 'crates/corelink-ops/**'
      - '.github/workflows/d1-migration-validate.yml'
  push:
    branches: [main]
    paths:
      - 'migrations/**'
      - 'crates/corelink-ops/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: D1 migration validate
    # Runner: `corelink` (zero-hosted). Offline-only lane: python3 migration
    # gates + a `cargo test -p corelink-ops` replay + a bash dry-run — python3
    # and the pinned Rust toolchain are baked into the box image; no wrangler,
    # no secrets, no docker (see the "offline only" note above).
    runs-on: corelink
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run unique-prefix lint (no duplicate 4-digit prefixes)
        run: |
          python3 scripts/check_migration_prefixes.py

      - name: Run additive-only gate (INV-AUTH-MIGRATION-ADDITIVE)
        run: |
          python3 scripts/check_migrations_additive.py

      - name: Run schema-only verify (parse expected D1 schema)
        run: |
          python3 scripts/d1-migration-verify.py --schema-only migrations/d1/ > /tmp/expected-schema.json
          test -s /tmp/expected-schema.json

      - name: Upload expected-schema artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: expected-schema
          path: /tmp/expected-schema.json
          if-no-files-found: error
          retention-days: 30

      # `dtolnay/rust-toolchain` removed — it re-provisions cargo and collides
      # with the box image's pinned toolchain (validate_no_shared_rustup_mutation
      # forbids it on self-hosted, which `corelink` is). The workspace pins the
      # channel via rust-toolchain.toml; assert the pinned cargo is on PATH
      # instead, mirroring corelink-server.yml.
      - name: Assert the workspace-pinned toolchain (rust-toolchain.toml)
        run: bash scripts/ci-assert-pinned-toolchain.sh

      - name: Cargo cache
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          workspaces: '.'
          shared-key: d1-migration-validate

      - name: Run D1 migration replay integration test
        run: |
          cargo test -p corelink-ops \
            --test migrations_d1_migration_integration -- --nocapture

      - name: Run runner shell-script dry-run smoke
        run: |
          bash scripts/d1-migration-runner.sh --dry-run --env dev
