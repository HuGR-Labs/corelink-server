name: neon-shadow-reconcile-daily (Wave 19)

# Daily reconciliation cron for the Neon analytics shadow
# (`audit_events_shadow`) vs the canonical R2 NDJSON archive
# (`audit/<tenant>/<YYYY-MM-DD>/<seq>.cloudevent.ndjson`).
#
# Trigger:   cron 03:00 UTC daily (1h after `audit-chain-daily-verify`
#            so the canonical chain verify result is fresh when the
#            reconciliation reads R2; same low-traffic window per
#            WI-S09-004 §6.1.5).
#            + manual workflow_dispatch for ad-hoc reconcile after
#              incidents.
#
# Behaviour: For each active region (`Region` enum in
#            `crates/corelink-analytics/src/labels.rs`) the workflow:
#
#              1. Resolves the per-region Neon DSN from
#                 `NEON_DB_URL_<REGION>` env (per
#                 `corelink-audit-chain::neon_shadow::real::EnvVarResolver`).
#              2. For yesterday's UTC date `(YYYY-MM-DD)` queries the
#                 shadow row count via the canonical
#                 `SQL_RECONCILE_COUNT` constant (single source of
#                 truth pinned to the Rust driver).
#              3. Lists the R2 NDJSON archive for the same window via
#                 the paginated Cloudflare API v4
#                 `r2/buckets/{bucket}/objects?prefix=audit/.../<YYYY-MM-DD>/`
#                 (same pagination harness as
#                 `.github/workflows/audit-chain-daily-verify.yml`).
#              4. Compares the two counts. ZERO diff → green. NON-ZERO
#                 diff → SEV-2 PD page with
#                 `dedup_key=neon-shadow-drift-<region>-<date>`.
#              5. Per-region failures DO NOT short-circuit the matrix
#                 — each region's reconcile is independent (one bad
#                 region surfaces as a per-region PD page; other
#                 regions still get evaluated).
#
# Fail-CLOSED contract (per-region, surface at job end):
#   - any non-2xx from the Cloudflare R2 API
#   - any psql connection error against the per-region Neon project
#   - any JSON parse failure on a list page
#   - any non-zero diff (drift)
# Per-region fail-CLOSED -> per-region PD page -> continue matrix.
# Job ends with non-zero exit IFF any region surfaced a drift OR
# connection error.
#
# Enforces:  INV-OBS-AUDIT-CHAIN-INTEGRITY (HIGH; this cron is the
#            day-N+1 cross-tier integrity gate between R2 + Neon),
#            INV-DATA-RESIDENCY (CRITICAL; each region's reconcile
#            stays within its own Neon project + R2 prefix — never
#            cross-region).
#
# Implements: Wave-19 closure note for wave-18 caveat #3 (real Neon
#            shadow driver + per-region resolution + daily reconcile).
#            See `specs/_audits/2026-05-16-neon-shadow-real-driver.md`
#            §5 reconciliation contract.

on:
  schedule:
    - cron: "0 3 * * *"  # 03:00 UTC daily
  workflow_dispatch:
    inputs:
      target_date:
        description: "UTC date YYYY-MM-DD to reconcile (defaults to yesterday)"
        required: false
        type: string

permissions:
  contents: read
  # No `id-token: write` — this cron does NOT call CF Workers; the
  # PD page is via Events API v2 directly + the Neon queries go via
  # the per-region DSN.

concurrency:
  group: neon-shadow-reconcile-daily
  cancel-in-progress: false

env:
  # Regions matrix — kept in lockstep with the `Region` enum. Adding
  # a region requires:
  #   1. New variant in `corelink-analytics::labels::Region`.
  #   2. Secrets-checklist row for `NEON_DB_URL_<REGION>` (per-region).
  #   3. New entry in this list.
  # The reconcile script is fail-safe on a missing env var — it skips
  # the region (logs as warning, does NOT page).
  RECONCILE_REGIONS: "iad,fra,gru,nrt,syd"
  # Bucket default — overridable via repo/env `AUDIT_R2_BUCKET` (row
  # #118 of secrets-checklist). Same default as
  # `audit-chain-daily-verify.yml`.
  AUDIT_R2_BUCKET_DEFAULT: "corelink-audit-archive"

jobs:
  reconcile:
    name: neon-shadow-reconcile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Compute target date (UTC yesterday or input)
        id: date
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.target_date }}" ]]; then
            TARGET_DATE="${{ inputs.target_date }}"
          else
            TARGET_DATE=$(date -u -d "yesterday" +%Y-%m-%d)
          fi
          # Sanity-check the format (YYYY-MM-DD).
          if ! [[ "$TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Invalid target_date: $TARGET_DATE"
            exit 1
          fi
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "Reconciling for UTC date: $TARGET_DATE"

      - name: Install reconcile-script deps
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install 'psycopg[binary]==3.2.3' 'requests==2.32.5'

      - name: Run per-region reconciliation
        id: reconcile
        env:
          # Per-region DSNs — only the regions whose env var is set
          # will be reconciled. Missing env vars surface as warnings
          # (NOT failures) so this workflow is bring-up friendly.
          NEON_DB_URL_IAD: ${{ secrets.NEON_DB_URL_IAD }}
          NEON_DB_URL_FRA: ${{ secrets.NEON_DB_URL_FRA }}
          NEON_DB_URL_GRU: ${{ secrets.NEON_DB_URL_GRU }}
          NEON_DB_URL_NRT: ${{ secrets.NEON_DB_URL_NRT }}
          NEON_DB_URL_SYD: ${{ secrets.NEON_DB_URL_SYD }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          AUDIT_R2_BUCKET: ${{ vars.AUDIT_R2_BUCKET || env.AUDIT_R2_BUCKET_DEFAULT }}
          TARGET_DATE: ${{ steps.date.outputs.target_date }}
          REGIONS: ${{ env.RECONCILE_REGIONS }}
          PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/neon_shadow_reconcile.py \
            --regions "$REGIONS" \
            --target-date "$TARGET_DATE" \
            --bucket "$AUDIT_R2_BUCKET" \
            --emit-pd \
            --output-json reconcile-report.json | tee reconcile-stdout.log
          # The script exits non-zero IFF any region surfaced a drift
          # OR connection error. The PD page is dispatched per-region
          # with dedup_key=neon-shadow-drift-<region>-<date>.

      - name: Upload reconcile report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neon-shadow-reconcile-${{ steps.date.outputs.target_date }}-${{ github.run_id }}
          path: |
            reconcile-report.json
            reconcile-stdout.log
          retention-days: 90  # SOC 2 CC7.2 evidence sampling window.
