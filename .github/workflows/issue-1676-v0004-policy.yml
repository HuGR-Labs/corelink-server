name: issue-1676 trusted v0004 policy

on:
  pull_request:
    paths:
      - '.github/workflows/issue-1676-v0004-policy.yml'
      - 'scripts/backlog_ledger_successor.py'
      - 'scripts/backlog_verify.py'
      - 'scripts/verify_b154_instrument_claims.py'
      - 'tests/test_backlog_ledger_successor.py'
      - 'tests/test_backlog_verify_trust_boundary.py'
      - 'tests/test_verify_b154_instrument_claims.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: prove v0004 policy pins before data successor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout policy change without write credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install focused test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python3 -m pip install --quiet --upgrade pip
          .venv/bin/python3 -m pip install --quiet -r requirements-ci.txt
      - name: Prove the policy has no candidate-defined authorization path
        run: |
          .venv/bin/python3 -m pytest -q \
            tests/test_backlog_ledger_successor.py::test_v0004_reconciliation_is_byte_pinned_before_any_data_successor \
            tests/test_backlog_ledger_successor.py::test_v0004_policy_in_base_accepts_only_the_exact_dynamic_base_successor \
            tests/test_backlog_verify_trust_boundary.py::BacklogVerifyTrustBoundaryTests::test_b154_exception_requires_reviewed_fail_closed_command \
            tests/test_verify_b154_instrument_claims.py::test_current_instruments_find_bold_claims \
            tests/test_verify_b154_instrument_claims.py::test_current_capability_boundary_is_not_an_unconditional_501_claim \
            tests/test_verify_b154_instrument_claims.py::test_capability_evidence_drift_fails_closed
          python3 -S scripts/verify_b154_instrument_claims.py --self-test
