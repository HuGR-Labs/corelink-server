name: Issue 2623 ownership contract

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/issue-2623-ownership-contract.yml
      - crates/corelink-container/src/storage/staging_load_test_admission.rs
      - crates/corelink-container/src/storage/staging_load_test_ownership.rs
      - apps/signup-worker/src/staging_load_test_ownership.ts
      - apps/signup-worker/tests/staging_load_test_ownership.test.ts
      - migrations/d1/0149_staging_load_test_r2_intents.sql
      - scripts/verify_issue_2623_ownership_contract.py
      - tests/test_issue_2623_ownership_contract.py

permissions:
  contents: read

concurrency:
  group: issue-2623-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  contract:
    if: >-
      github.repository == 'HuGR-dev/corelink-server' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact candidate and protected base
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$EXPECTED_BASE" "$EXPECTED_HEAD")" = "$EXPECTED_BASE"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable toolchain action
        with:
          toolchain: 1.91.1

      - name: Install pinned Protobuf compiler
        uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0

      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install focused Worker dependencies
        run: pnpm install --frozen-lockfile --filter @corelink/signup-worker... --ignore-scripts

      - name: Verify frozen seam
        run: python3 -I scripts/verify_issue_2623_ownership_contract.py

      - name: Verify additive migrations and R2 state machine
        run: |
          python3 scripts/check_migration_prefixes.py
          python3 scripts/check_migrations_additive.py
          python3 -m pytest -q tests/test_issue_2623_ownership_contract.py

      - name: Check formatting and compile shared Rust API
        run: |
          cargo fmt --all -- --check
          cargo check --locked -p corelink-server --lib

      - name: Run focused Rust contract tests
        run: |
          cargo test --locked -p corelink-server --lib storage::staging_load_test_admission::tests::worker_ownership_envelope_is_domain_separated_bounded_and_request_bound -- --exact
          cargo test --locked -p corelink-server --lib storage::staging_load_test_ownership::tests::d1_and_r2_contracts_accept_only_bounded_canonical_inputs -- --exact

      - name: Typecheck and test focused Worker envelope
        run: |
          pnpm --filter @corelink/signup-worker typecheck
          pnpm --filter @corelink/signup-worker exec vitest run tests/staging_load_test_ownership.test.ts
