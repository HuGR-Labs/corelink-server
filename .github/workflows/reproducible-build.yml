name: Reproducible Build (2-leg byte diff)
# WI-S12-006 — CAP-SUPPLY-005 (reproducible builds best-effort).
# ADR-0015 ratifies the ≤ 5 % byte-diff tolerance and the roadmap to 100 %
# bit-identical post-GA. Non-determinism sources: docs/build/reproducible.md.
#
# WHAT THIS BUILDS, AND WHY IT CHANGED (2026-08-24, BACKLOG B-016)
#
# Until today this lane compiled `corelink-worker` for wasm32-unknown-unknown
# and hashed `target/wasm32-unknown-unknown/release/corelink_worker.wasm`.
# **That file has never existed.** `crates/corelink-worker/Cargo.toml` declares
# no `[lib] crate-type = ["cdylib"]`, so the crate can only ever emit an
# `.rlib`; every run died on `sha256sum: … No such file or directory` AFTER a
# successful compile. Reproducibility was therefore never measured once — the
# gate was red for a structural reason, not a flaky one.
#
# The artifact was also the wrong one on its own terms. `wrangler.toml:15` sets
# `main = "worker/src/index.ts"`: the deployed Worker is TypeScript, and
# `corelink-worker` survives as an ordinary Rust library that other crates link
# into the container. Nothing wasm ships. Meanwhile the artifacts users actually
# download and execute — the CLI binaries on the GitHub release — had no
# reproducibility check at all, even though GA-GATE-E09 names exactly those
# ("byte-identical release binaries", four target triples).
#
# So this lane now builds what release-cli.yml ships: `corelink-cli`, release
# profile, `--locked`, with the same SOURCE_DATE_EPOCH and the same
# `--remap-path-prefix` set that workflow uses. Same command, same artifact.
#
# WHAT THE RESULT PROVES, AND WHAT IT DOES NOT
#
# Both legs run on ONE self-hosted host, into two separate target directories.
# That measures determinism of the compiler and inputs given an identical
# environment. It does NOT prove cross-environment reproducibility — a second
# machine, a different OS image, or a different `$HOME` could still diverge.
# The previous version claimed the stronger property by running two hosted
# `ubuntu-latest` legs; it never once executed, so it proved neither. Hosted
# runners are also forbidden in this repo (zero GitHub-Actions spend), which is
# why the honest weaker claim on self-hosted is what we make.

on:
  # Dispatch-only, deliberately. Two full release builds of a 207-dependency
  # crate is not something to put on every pull request, and the self-hosted
  # fleet is the owner's own machine. Re-add a trigger only with a measured
  # duration from a real run to justify it.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"   # deterministic: no incremental state
  RUST_BACKTRACE: "1"
  # The host target of the self-hosted fleet. release-cli.yml builds this same
  # triple natively (no zig), so this leg needs no cross toolchain.
  TARGET: x86_64-apple-darwin

jobs:
  two-leg-diff:
    name: Build corelink-cli twice, diff the bytes
    runs-on: [self-hosted, mac, corelink-builder]
    # Two single-job release builds of a 207-dep crate, cold. Generous, because
    # a timeout here reads as "reproducibility failed" when it means "the box
    # was busy".
    timeout-minutes: 180

    steps:
      - name: Checkout (full history for SOURCE_DATE_EPOCH)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      # Do NOT provision a toolchain on this fleet: 5 runners share one $HOME,
      # so `rustup default` moves every concurrent job off the pinned toolchain
      # and a concurrent install can make rustc unexecutable mid-build. Full
      # reasoning in the script header.
      - name: Use the workspace-pinned host toolchain (provisions nothing)
        run: bash scripts/ci-use-host-toolchain.sh "${TARGET}"

      # Standard reproducible-builds.org variable, derived from the commit so it
      # is unique per revision but identical across both legs.
      - name: Set SOURCE_DATE_EPOCH and the path remap
        run: |
          EPOCH=$(git log -1 --pretty=%ct)
          echo "SOURCE_DATE_EPOCH=${EPOCH}" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=${EPOCH}"

          # Byte-for-byte the remap release-cli.yml applies. If these two ever
          # diverge, this lane measures an artifact the release does not ship.
          REMAP=""
          REMAP="$REMAP --remap-path-prefix=$HOME/.cargo/registry=cargo-registry"
          REMAP="$REMAP --remap-path-prefix=$HOME/.cargo/git=cargo-git"
          REMAP="$REMAP --remap-path-prefix=$HOME/.rustup=rustup"
          REMAP="$REMAP --remap-path-prefix=$GITHUB_WORKSPACE=corelink"
          echo "RUSTFLAGS=$REMAP" >> "$GITHUB_ENV"

      # Acquire dependencies BEFORE the compile. `--locked` pins every version
      # to Cargo.lock; fetching over the network here does not weaken the
      # hermeticity SLSA cares about, which is the compile.
      - name: Fetch dependencies (network allowed; --locked)
        run: cargo fetch --locked

      - name: Leg A — build corelink-cli
        run: |
          set -euo pipefail
          cargo build \
            -p corelink-cli \
            --release \
            --locked \
            --offline \
            --jobs 1 \
            --target "${TARGET}" \
            --target-dir target-repro-a

      # A missing artifact is the exact failure this lane shipped for a year.
      # Say so explicitly instead of letting `shasum` produce the error.
      - name: Leg A — hash the artifact
        id: leg_a
        run: |
          set -euo pipefail
          BIN="target-repro-a/${TARGET}/release/corelink"
          if [[ ! -f "${BIN}" ]]; then
            echo "::error::No binary at ${BIN}. The build succeeded but produced nothing to attest — this is the B-016 failure mode, and it means the artifact path and the build command disagree."
            exit 1
          fi
          HASH=$(shasum -a 256 "${BIN}" | awk '{print $1}')
          SIZE=$(wc -c < "${BIN}" | tr -d ' ')
          echo "leg A sha256=${HASH} size=${SIZE}"
          { echo "hash=${HASH}"; echo "size=${SIZE}"; } >> "$GITHUB_OUTPUT"

      # Separate target dir, so this is a genuine second compile rather than a
      # cache hit reading leg A's output back. A lane that re-hashes the same
      # file twice always reports bit-identical and proves nothing.
      - name: Leg B — build corelink-cli again, from scratch
        run: |
          set -euo pipefail
          cargo build \
            -p corelink-cli \
            --release \
            --locked \
            --offline \
            --jobs 1 \
            --target "${TARGET}" \
            --target-dir target-repro-b

      - name: Leg B — hash the artifact
        id: leg_b
        run: |
          set -euo pipefail
          BIN="target-repro-b/${TARGET}/release/corelink"
          if [[ ! -f "${BIN}" ]]; then
            echo "::error::No binary at ${BIN} — see the note on leg A."
            exit 1
          fi
          HASH=$(shasum -a 256 "${BIN}" | awk '{print $1}')
          echo "leg B sha256=${HASH}"
          echo "hash=${HASH}" >> "$GITHUB_OUTPUT"

      - name: Compare, and enforce the ADR-0015 threshold
        id: diff
        run: |
          set -uo pipefail
          A="target-repro-a/${TARGET}/release/corelink"
          B="target-repro-b/${TARGET}/release/corelink"
          HASH_A="${{ steps.leg_a.outputs.hash }}"
          HASH_B="${{ steps.leg_b.outputs.hash }}"
          SIZE="${{ steps.leg_a.outputs.size }}"

          echo "leg A: ${HASH_A}"
          echo "leg B: ${HASH_B}"

          if [[ "${HASH_A}" == "${HASH_B}" ]]; then
            {
              echo "outcome=bit_identical"
              echo "diff_bytes=0"
              echo "diff_pct=0.0000"
            } >> "$GITHUB_OUTPUT"
            echo "RESULT: bit-identical"
            exit 0
          fi

          DIFF=$(cmp -l "${A}" "${B}" 2>/dev/null | wc -l | tr -d ' ')
          PCT=$(awk "BEGIN {printf \"%.4f\", ${DIFF} / ${SIZE} * 100}")
          echo "RESULT: ${DIFF} differing bytes of ${SIZE} (${PCT}%)"
          {
            echo "diff_bytes=${DIFF}"
            echo "diff_pct=${PCT}"
          } >> "$GITHUB_OUTPUT"

          # ADR-0015 §3: ≤ 5 % is within tolerance, above it fails the gate.
          # Compared as a float — the old integer truncation passed 5.9 %.
          WITHIN=$(awk "BEGIN {print (${PCT} <= 5.0) ? 1 : 0}")
          if [[ "${WITHIN}" == "1" ]]; then
            echo "outcome=within_threshold" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "outcome=exceeds_threshold" >> "$GITHUB_OUTPUT"
          echo "::error::Reproducible-build diff ${PCT}% exceeds the ADR-0015 5% tolerance. See docs/build/reproducible.md for known non-determinism sources."
          exit 1

      - name: Report
        if: always()
        run: |
          {
            echo "## Reproducible build — corelink-cli (${TARGET})"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Outcome | \`${{ steps.diff.outputs.outcome }}\` |"
            echo "| Leg A sha256 | \`${{ steps.leg_a.outputs.hash }}\` |"
            echo "| Leg B sha256 | \`${{ steps.leg_b.outputs.hash }}\` |"
            echo "| Differing bytes | \`${{ steps.diff.outputs.diff_bytes }}\` |"
            echo "| Diff | \`${{ steps.diff.outputs.diff_pct }}%\` (tolerance 5%) |"
            echo ""
            echo "Both legs ran on one host into separate target directories:"
            echo "this measures build determinism, not cross-environment"
            echo "reproducibility. See the header of this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
