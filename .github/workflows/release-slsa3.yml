name: Release — SLSA L3 Build Provenance (WI-S12-001)

# Generates SLSA Level 3 build provenance for CoreLink releases.
#
# Trigger: GitHub release published OR manual dispatch.
#
# Architecture:
#   Job 1 (build-artifacts): Read the PUBLISHED release binaries + compute SHA-256 subjects.
#
# WHAT IS ATTESTED, AND WHY IT CHANGED (2026-08-24, BACKLOG B-016)
#   Until today this workflow compiled `corelink-worker` for
#   wasm32-unknown-unknown and attested
#   `target/wasm32-unknown-unknown/release/corelink_worker.wasm`. That file has
#   never existed -- the crate declares no `[lib] crate-type = ["cdylib"]`, so it
#   can only emit an `.rlib` -- and the deployed Worker is TypeScript anyway
#   (`wrangler.toml:15`). This lane has run exactly once, on 2026-05-29, and
#   failed. No SLSA provenance has ever been produced for anything.
#   Meanwhile the artifacts users download and execute -- the `corelink` CLI
#   binaries attached to the GitHub release by `release-cli.yml` -- carried no
#   provenance at all. Those are now the subjects: provenance covers the exact
#   bytes a user installs, which is the only version of this claim worth making.
#   Job 2 (slsa-provenance): slsa-github-generator reusable workflow — isolated VM,
#     hermetic build, Fulcio keyless OIDC signing, Rekor inclusion proof.
#
# Security properties:
#   - Hermetic builder: slsa-github-generator runs in GitHub-managed isolated VM.
#   - No long-lived secrets: Fulcio keyless OIDC (10 min cert, GitHub Actions identity).
#   - Rekor mandatory: INV-SUPPLY-PROVENANCE-IN-REKOR; no bypass, release blocked if down.
#   - Builder pinned: slsa-github-generator@v1.10.0 SHA-pinned (ADR-0045).
#   - All GitHub Actions SHA-pinned (no @latest, no @vN floating tags).
#
# Invariants:
#   INV-SUPPLY-PROVENANCE-IN-REKOR (HIGH): Rekor inclusion is mandatory.
#   INV-SUPPLY-SIGNED-DEPLOY (CRITICAL): inherited; WI-S12-003 enforce at deploy.
#
# References:
#   WI-S12-001 §6.1, §7, §8, ADR-0045
#   https://github.com/slsa-framework/slsa-github-generator/blob/main/internal/builders/generic/README.md

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to generate provenance for (e.g., v0.1.0)'
        required: true
        type: string

# Global permissions: minimal by default; each job overrides as needed.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Read the published release binaries and compute their SHA-256 subjects.
  # ---------------------------------------------------------------------------
  build-artifacts:
    name: Subjects from the published release binaries
    runs-on: [self-hosted, mac, corelink-builder]
    permissions:
      contents: read

    outputs:
      # base64-encoded SLSA subjects (one `sha256hex  name` line per binary)
      base64-subjects: ${{ steps.compute-digest.outputs.base64-subjects }}
      # newline-separated `sha256  name` list, re-verified in job 3
      subject-list: ${{ steps.compute-digest.outputs.subject-list }}

    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      # The binaries are built and uploaded by release-cli.yml. Attesting the
      # bytes that are actually on the release -- rather than rebuilding and
      # attesting a second, differently-produced artifact -- is what makes the
      # provenance answer the question a user asks: "is the file I just
      # downloaded the one you built?"
      - name: Download the published release binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir release-assets \
            --pattern 'corelink-*'
          # Checksums and signatures are not subjects; the executables are.
          find release-assets -name '*.sha256' -delete
          ls -l release-assets

      - name: Compute SHA-256 subjects
        id: compute-digest
        run: |
          set -euo pipefail
          cd release-assets
          COUNT=$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')
          if [[ "${COUNT}" -eq 0 ]]; then
            echo "::error::The release carries no corelink-* binaries. Nothing to attest — refusing to emit an empty provenance, which would assert coverage that does not exist."
            exit 1
          fi
          SUBJECTS=$(shasum -a 256 ./* | sed 's|\./||')
          echo "${SUBJECTS}"
          BASE64_SUBJECTS=$(printf '%s' "${SUBJECTS}" | base64 | tr -d '\n')
          {
            echo "base64-subjects=${BASE64_SUBJECTS}"
            echo "subject-list<<EOF"
            echo "${SUBJECTS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Job 2: SLSA L3 provenance generation via slsa-github-generator.
  #
  # This job calls the SLSA reusable workflow in an isolated, GitHub-managed VM.
  # The generator:
  #   - Produces in-toto v1.0 attestation (predicateType: https://slsa.dev/provenance/v1).
  #   - Signs via Fulcio keyless OIDC (GitHub Actions identity → 10 min cert).
  #   - Publishes inclusion proof to Rekor transparency log (mandatory; no bypass).
  #   - Outputs provenance.intoto.jsonl + provenance.intoto.bundle.
  #
  # SHA pin: SHA of the slsa-github-generator commit for v1.10.0 tag.
  # Bump requires ADR-0045 update + regression testing.
  # ---------------------------------------------------------------------------
  slsa-provenance:
    name: Generate SLSA L3 Provenance
    needs: [build-artifacts]
    # slsa-github-generator reusable workflow (SHA-pinned at v1.10.0)
    # See: https://github.com/slsa-framework/slsa-github-generator/releases/tag/v1.10.0
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a  # slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build-artifacts.outputs.base64-subjects }}
      provenance-name: "provenance.intoto.jsonl"
      # Upload provenance bundle to release assets
      upload-assets: true
    permissions:
      # OIDC token for Fulcio keyless signing (bound to GitHub Actions workflow identity)
      id-token: write
      # Read workflow context for provenance generation
      actions: read
      # Write release assets (provenance.intoto.bundle)
      contents: write

  # ---------------------------------------------------------------------------
  # Job 3: Attach build artifacts to release + validate provenance.
  # ---------------------------------------------------------------------------
  attach-release-assets:
    name: Re-verify the attested digests against the release
    needs: [build-artifacts, slsa-provenance]
    runs-on: [self-hosted, mac, corelink-builder]
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Provenance is only worth what the digests are worth. Re-download the
      # release assets AFTER signing and confirm they still hash to what was
      # attested: an asset replaced between job 1 and now would otherwise ship
      # with a valid-looking bundle that describes different bytes.
      - name: Re-download and re-hash the release binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p verify-assets
          gh release download "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir verify-assets \
            --pattern 'corelink-*'
          find verify-assets -name '*.sha256' -delete

          printf '%s\n' "${{ needs.build-artifacts.outputs.subject-list }}" > attested.txt
          cd verify-assets
          shasum -a 256 ./* | sed 's|\./||' > ../actual.txt
          cd ..

          if ! diff -u <(sort attested.txt) <(sort actual.txt); then
            echo "::error::A release asset changed after it was attested. The provenance bundle does not describe the bytes now on the release."
            exit 1
          fi
          echo "All attested digests still match the release assets."

      - name: Report what was attested
        env:
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          echo "Provenance generated for release: ${TAG}"
          echo "Rekor inclusion proof: mandatory (INV-SUPPLY-PROVENANCE-IN-REKOR)"
          echo "Subjects:"
          printf '%s\n' "${{ needs.build-artifacts.outputs.subject-list }}"
          echo "Customer verify command:"
          echo "  corelink-supply-verify verify \\"
          echo "    --bundle provenance.intoto.bundle \\"
          echo "    --release ${TAG} \\"
          echo "    --expected-builder HumanGuardrail/corelink-server"

      - name: Emit SLSA attestation metric (success)
        # Structured log event for Prometheus scrape (OTel collector parses)
        run: |
          echo '{"metric":"corelink_supply_slsa_attestations_total","outcome":"ok","plan":"internal","value":1,"release":"${{ github.event.release.tag_name || inputs.release_tag }}"}'
