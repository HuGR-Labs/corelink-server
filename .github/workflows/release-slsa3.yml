name: Release — SLSA L2 Build Provenance, self-hosted (WI-S12-001)

concurrency:
  # SEM cancelamento em voo, de proposito, por restauracao de intencao declarada.
  # O commit que introduziu estes blocos (50741f7c) afirma que seis workflows de
  # prod-build/signing/notarize OMITEM o flag porque "cancelar deploy/sign em-flight
  # e pior que enfileirar o proximo". Cinco dos seis honram; este NAO honrava —
  # uma build de proveniencia SLSA L2 em voo podia ser cancelada por um
  # segundo release ou dispatch, que e exatamente o desfecho contra o qual a decisao
  # foi tomada. Grupo constante e sem o flag = serializa em vez de matar.
  group: "ci-release-slsa-l2-build-provenance-self-hosted-wi-s12-001"

# Generates SLSA Build **Level 2** provenance for CoreLink releases on the
# self-hosted `corelink-builder` fleet.
#
# Trigger: typed reusable invocation from release-cli.yml only.  There is no
# manual dispatch path for provenance because the caller tag and source SHA
# must be the exact release identity.
#
# WHY THIS IS L2 AND NOT L3 (2026-08-25, BACKLOG B-031) — READ BEFORE EDITING
#   SLSA Build **L3** is defined by the provenance being produced by a
#   GitHub-MANAGED, isolated builder (the upstream SLSA framework's reusable
#   generator workflow, which runs in an ephemeral VM the release author cannot
#   influence). We deliberately no longer call that hosted generator.
#   The repo's standing rule is ZERO GitHub-hosted Actions spend, so we cannot
#   keep that hosted builder. Re-homing provenance generation onto our own
#   `[self-hosted, mac, corelink-builder]` fleet means the builder is no longer
#   isolated from the workload or GitHub-managed, which by the SLSA v1 spec is
#   **Build L2, not L3**. This was an explicit owner tradeoff: accept the honest
#   drop to L2 to keep zero hosted spend. Do NOT re-label this L3 or describe the
#   builder as hermetic/isolated/GitHub-managed — that would be false.
#
# WHAT IS ATTESTED (unchanged, 2026-08-24 BACKLOG B-016)
#   The subjects are every final artifact represented by `release-manifest.json`
#   (CLI binaries, signer archives, detached signatures, and checksum files)
#   attached to the GitHub release by `release-cli.yml`. This lane does not
#   rebuild them; it reads the final inventory and attests its SHA-256 digests,
#   so the provenance answers "is each file I just downloaded the one you
#   published?".
#
# Architecture:
#   Job 1 (build-artifacts):  read the PUBLISHED release binaries + compute SHA-256 subjects.
#   Job 2 (slsa-provenance):  build an in-toto v1 SLSA-v1 provenance statement on the
#                             self-hosted fleet, sign it KEYLESS with cosign (Fulcio
#                             OIDC + mandatory Rekor inclusion), self-verify the bundle,
#                             and upload it to the release. Self-hosted → SLSA Build L2.
#   Job 3 (attach-release-assets): re-download + re-hash the release assets and confirm
#                             they still match what was attested.
#
# Security properties (honest inventory for L2 on self-hosted):
#   - No long-lived signing keys: Fulcio keyless OIDC. The OIDC token is issued by
#     GitHub (`token.actions.githubusercontent.com`), NOT by the runner, so keyless
#     signing works on self-hosted; the Fulcio cert SAN is this workflow's ref.
#   - Rekor mandatory: INV-SUPPLY-PROVENANCE-IN-REKOR. cosign uploads the inclusion
#     proof by default and the job FAILS if signing or Rekor upload fails — no bypass.
#   - Self-proving lane: the just-signed bundle is verified with `cosign verify-blob`
#     in the same run; the job fails if the round-trip does not pass.
#   - NOT isolated / NOT hermetic: the builder is the shared self-hosted fleet. That
#     is the whole reason this is L2. State it plainly rather than implying otherwise.
#   - All third-party GitHub Actions SHA-pinned (no @latest, no @vN floating tags).
#
# Invariants:
#   INV-SUPPLY-PROVENANCE-IN-REKOR (HIGH): Rekor inclusion is mandatory.
#   INV-SUPPLY-SIGNED-DEPLOY (CRITICAL): inherited; WI-S12-003 enforces at deploy.
#
# References:
#   WI-S12-001 §6.1, §7, §8, ADR-0045 (see the 2026-08-25 L3→L2 addendum)
#   https://slsa.dev/spec/v1.0/provenance
#   https://slsa.dev/spec/v1.0/levels  (Build L2 vs L3 = isolated/managed builder)

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      manifest_sha256:
        required: true
        type: string
    secrets:
      CORELINK_CLI_RELEASE_TOKEN:
        required: true

# Global permissions: minimal by default; each job overrides as needed.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Read the exact final release inventory and compute SHA-256 subjects.
  # ---------------------------------------------------------------------------
  build-artifacts:
    name: Subjects from the final published release inventory
    runs-on: [self-hosted, mac, corelink-builder]
    permissions:
      contents: read

    outputs:
      # base64-encoded SLSA subjects (one `sha256hex  name` line per asset)
      base64-subjects: ${{ steps.compute-digest.outputs.base64-subjects }}
      # newline-separated `sha256  name` list, re-verified in job 3
      subject-list: ${{ steps.compute-digest.outputs.subject-list }}

    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      # The release root writes a final immutable inventory after all signer
      # lanes finish. Attest its exact members, rather than a glob whose
      # meaning could drift as public assets are added.
      - name: Download and validate the final published release inventory
        env:
          # The release root is distinct from this source repository. This
          # credential is available only to the gh release steps that need it.
          GH_TOKEN: ${{ secrets.CORELINK_CLI_RELEASE_TOKEN }}
          RELEASE_REPOSITORY: HuGR-Labs/corelink-cli
          TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          test "$(gh --version | awk 'NR == 1 {print $3}')" = "2.79.0"
          mkdir -p release-assets
          gh release download "${TAG}" \
            --repo "${RELEASE_REPOSITORY}" \
            --dir release-assets \
            --pattern 'corelink-*'
          gh release download "${TAG}" \
            --repo "${RELEASE_REPOSITORY}" \
            --dir release-assets \
            --pattern checksums.txt --clobber
          gh release download "${TAG}" \
            --repo "${RELEASE_REPOSITORY}" \
            --dir release-assets \
            --pattern release-manifest.json --clobber
          test -n "${MANIFEST_SHA256}"
          ACTUAL_MANIFEST_SHA256="$(shasum -a 256 release-assets/release-manifest.json | awk '{print $1}')"
          test "${ACTUAL_MANIFEST_SHA256}" = "${MANIFEST_SHA256}"
          python3 scripts/cli_release_manifest.py verify --directory release-assets \
            --manifest release-assets/release-manifest.json --tag "${TAG}" --source-sha "${SOURCE_SHA}"
          ls -l release-assets

      - name: Compute SHA-256 subjects
        id: compute-digest
        run: |
          set -euo pipefail
          cd release-assets
          rm -f release-manifest.json
          COUNT=$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')
          if [[ "${COUNT}" -eq 0 ]]; then
            echo "::error::The immutable release manifest carries no public assets. Refusing to emit empty provenance."
            exit 1
          fi
          SUBJECTS=$(shasum -a 256 ./* | sed 's|\./||')
          echo "${SUBJECTS}"
          BASE64_SUBJECTS=$(printf '%s' "${SUBJECTS}" | base64 | tr -d '\n')
          {
            echo "base64-subjects=${BASE64_SUBJECTS}"
            echo "subject-list<<EOF"
            echo "${SUBJECTS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Job 2: SLSA L2 provenance generation on the self-hosted fleet.
  #
  # This job runs on our own `corelink-builder` box (NOT a GitHub-managed
  # isolated VM — that is why this is Build L2, not L3; see the header). It:
  #   - Assembles an in-toto v1 Statement with a SLSA v1 provenance predicate,
  #     one subject per published release binary, using python3 (not a fragile
  #     shell heredoc) and validates the result is well-formed JSON.
  #   - Signs the statement KEYLESS with cosign (`sign-blob`): Fulcio short-lived
  #     cert bound to this workflow's OIDC identity, Rekor inclusion proof in the
  #     bundle. Rekor is MANDATORY (INV-SUPPLY-PROVENANCE-IN-REKOR); the job fails
  #     if signing or Rekor upload fails.
  #   - Self-verifies the bundle it just produced with `cosign verify-blob` and
  #     fails the job if the round-trip does not pass.
  #   - Uploads provenance.intoto.jsonl + the signature bundle to the release.
  # ---------------------------------------------------------------------------
  slsa-provenance:
    name: Generate SLSA L2 Provenance (self-hosted)
    needs: [build-artifacts]
    runs-on: [self-hosted, mac, corelink-builder]
    permissions:
      # OIDC token for Fulcio keyless signing. Issued by GitHub, not the runner,
      # so this works on the self-hosted fleet.
      id-token: write # Keyless Fulcio OIDC issuance for this tag-bound provenance job.
      # The release root is written only through the scoped cross-repo PAT.
      contents: read # No source-repository write permission is needed for provenance.

    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Bind OIDC provenance to the immutable release tag and source
        env:
          TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          case "${TAG}" in cli-v*) ;; *)
            echo "::error::provenance requires a cli-v* tag" >&2
            exit 1
          esac
          [[ "${TAG}" =~ ^cli-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
          test "${GITHUB_REF}" = "refs/tags/${TAG}"
          test "${GITHUB_SHA}" = "${SOURCE_SHA}"
          test "${CALLER_WORKFLOW_REF}" = "${GITHUB_REPOSITORY}/.github/workflows/release-cli.yml@refs/tags/${TAG}"

      # Cosign 2.x, SHA-pinned to the exact same release used by cosign-sign.yml
      # (WI-S12-003) so the whole supply-chain toolchain moves as one unit.
      - name: Install Cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1
        with:
          cosign-release: 'v2.4.3'

      # Build the in-toto v1 Statement (SLSA v1 provenance predicate) with
      # python3. The subject list, tag, repo, refs and run URL all arrive via the
      # environment — nothing is interpolated into the program text, so a binary
      # name with an odd character cannot corrupt the JSON. The script is the
      # single source of the statement shape; it validates its own output.
      - name: Build in-toto SLSA v1 provenance statement
        env:
          SUBJECT_LIST: ${{ needs.build-artifacts.outputs.subject-list }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          CALLED_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/release-slsa3.yml@${{ github.ref }}
          GITHUB_REF: ${{ github.ref }}
          COMMIT_SHA: ${{ inputs.source_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          # Write the generator to a file with a QUOTED heredoc: the shell does
          # not touch the body, so this is not a fragile-interpolation heredoc.
          cat > build_provenance.py <<'PY'
          import json
          import os
          import sys

          def env(name):
              v = os.environ.get(name, "")
              if v == "":
                  print(f"::error::missing required env {name}", file=sys.stderr)
                  sys.exit(1)
              return v

          repo = env("REPO")                    # e.g. HuGR-Labs/corelink-server
          server = os.environ.get("SERVER_URL", "https://github.com")
          release_tag = env("RELEASE_TAG")
          github_ref = env("GITHUB_REF")        # e.g. refs/tags/v0.1.0
          commit_sha = env("COMMIT_SHA")
          run_id = env("RUN_ID")
          run_attempt = os.environ.get("RUN_ATTEMPT", "1")

          # github.workflow_ref = "OWNER/REPO/.github/workflows/f.yml@REF".
          # The builder id must be a resolvable URI naming this exact workflow.
          caller_workflow_ref = env("WORKFLOW_REF")
          called_workflow_ref = env("CALLED_WORKFLOW_REF")
          expected_caller = f"{repo}/.github/workflows/release-cli.yml@{github_ref}"
          expected_called = f"{repo}/.github/workflows/release-slsa3.yml@{github_ref}"
          if caller_workflow_ref != expected_caller or called_workflow_ref != expected_called:
              print("::error::caller/called workflow identity is not bound to this release tag", file=sys.stderr)
              sys.exit(1)
          # OIDC's standard workflow_ref claim names the caller. The called
          # reusable workflow is pinned separately and carried as the builder.
          builder_id = f"{server}/{called_workflow_ref}"

          # Parse `SUBJECTS` = one `<sha256hex>  <name>` line per binary
          # (the exact output shape of `shasum -a 256 | sed 's|./||'`).
          subjects = []
          for raw in os.environ.get("SUBJECT_LIST", "").splitlines():
              line = raw.strip()
              if not line:
                  continue
              parts = line.split(None, 1)
              if len(parts) != 2:
                  print(f"::error::unparseable subject line: {line!r}", file=sys.stderr)
                  sys.exit(1)
              digest, name = parts[0], parts[1].strip()
              if len(digest) != 64 or any(c not in "0123456789abcdef" for c in digest.lower()):
                  print(f"::error::not a sha256 hex digest: {digest!r}", file=sys.stderr)
                  sys.exit(1)
              subjects.append({"name": name, "digest": {"sha256": digest.lower()}})

          if not subjects:
              print("::error::no subjects parsed — refusing to emit empty provenance", file=sys.stderr)
              sys.exit(1)

          invocation_id = f"{server}/{repo}/actions/runs/{run_id}/attempts/{run_attempt}"

          statement = {
              "_type": "https://in-toto.io/Statement/v1",
              "subject": subjects,
              "predicateType": "https://slsa.dev/provenance/v1",
              "predicate": {
                  "buildDefinition": {
                      # Stable URI naming THIS fleet build recipe.
                      "buildType": "https://corelink.humangr.com/slsa/selfhosted-release/v1",
                      "externalParameters": {
                          "release_tag": release_tag,
                          "repository": f"{server}/{repo}",
                          "ref": github_ref,
                      },
                      "internalParameters": {
                          # Honest: the builder is the shared self-hosted fleet,
                          # not an isolated/managed VM. This is Build L2, not L3.
                          "runner": "self-hosted:corelink-builder",
                          "isolated": False,
                      },
                      "resolvedDependencies": [
                          {
                              "uri": f"git+{server}/{repo}@{github_ref}",
                              "digest": {"gitCommit": commit_sha},
                          }
                      ],
                  },
                  "runDetails": {
                      "builder": {
                          # Non-isolated self-hosted builder → SLSA Build L2.
                          "id": builder_id,
                          "version": {
                              "corelink-slsa-build-level": "L2",
                              "corelink-builder-isolation": "self-hosted-non-isolated",
                          },
                      },
                      "metadata": {
                          "invocationId": invocation_id,
                      },
                  },
              },
          }

          with open("provenance.intoto.jsonl", "w", encoding="utf-8") as fh:
              # in-toto "jsonl": one JSON statement object per line.
              fh.write(json.dumps(statement, separators=(",", ":")))
              fh.write("\n")

          print(f"Wrote provenance.intoto.jsonl with {len(subjects)} subject(s).")
          PY

          python3 build_provenance.py

          # Fail loudly unless the emitted file is well-formed JSON.
          python3 -c "import json; json.load(open('provenance.intoto.jsonl'))"
          echo "provenance.intoto.jsonl is well-formed JSON."
          cat provenance.intoto.jsonl

      # Keyless sign with cosign. Fulcio issues a ≤10-min cert bound to this
      # workflow's OIDC identity; the Rekor inclusion proof is written into the
      # bundle. `sign-blob` uploads to Rekor by default and exits non-zero on
      # failure, so INV-SUPPLY-PROVENANCE-IN-REKOR is enforced with no bypass.
      - name: Sign provenance (cosign keyless OIDC → Fulcio + Rekor)
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --tlog-upload=true \
            --bundle provenance.intoto.jsonl.bundle \
            provenance.intoto.jsonl
          python3 scripts/verify_cli_rekor_bundle.py \
            --payload provenance.intoto.jsonl --bundle provenance.intoto.jsonl.bundle
          echo "Signed; Fulcio cert + Rekor inclusion proof written to provenance.intoto.jsonl.bundle."

      # Self-prove: verify the bundle we just produced, in the same run. A
      # provenance lane that never round-trips its own output is exactly the
      # failure mode this repo forbids — fail hard if verification does not pass.
      - name: Self-verify the signed provenance (cosign verify-blob)
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          # OIDC must attest this exact release-tag workflow ref, never a
          # similarly named branch invocation.
          ESCAPED_TAG="$(python3 -c 'import os,re; print(re.escape(os.environ["TAG"]))')"
          test "${CALLER_WORKFLOW_REF}" = "${REPO}/.github/workflows/release-cli.yml@refs/tags/${TAG}"
          IDENTITY_RE="^https://github\.com/${REPO}/\.github/workflows/release-cli\.yml@refs/tags/${ESCAPED_TAG}$"
          cosign verify-blob \
            --bundle provenance.intoto.jsonl.bundle \
            --certificate-identity-regexp "${IDENTITY_RE}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            provenance.intoto.jsonl
          echo "Self-verification passed: the bundle verifies against its own signed statement."

      - name: Upload provenance to the release
        env:
          GH_TOKEN: ${{ secrets.CORELINK_CLI_RELEASE_TOKEN }}
          RELEASE_REPOSITORY: HuGR-Labs/corelink-cli
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test "$(gh --version | awk 'NR == 1 {print $3}')" = "2.79.0"
          gh release upload "${TAG}" \
            --repo "${RELEASE_REPOSITORY}" \
            --clobber \
            provenance.intoto.jsonl \
            provenance.intoto.jsonl.bundle
          echo "Uploaded provenance.intoto.jsonl + provenance.intoto.jsonl.bundle to release ${TAG}."

  # ---------------------------------------------------------------------------
  # Job 3: Revalidate the exact inventory after provenance upload.
  # ---------------------------------------------------------------------------
  attach-release-assets:
    name: Re-verify the attested inventory against the release
    needs: [build-artifacts, slsa-provenance]
    runs-on: [self-hosted, mac, corelink-builder]
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Provenance is only worth what the digests are worth. Re-download the
      # release assets AFTER signing and confirm they still hash to what was
      # attested: an asset replaced between job 1 and now would otherwise ship
      # with a valid-looking bundle that describes different bytes.
      - name: Re-download and re-hash the final release inventory
        env:
          GH_TOKEN: ${{ secrets.CORELINK_CLI_RELEASE_TOKEN }}
          RELEASE_REPOSITORY: HuGR-Labs/corelink-cli
          TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          SUBJECT_LIST: ${{ needs.build-artifacts.outputs.subject-list }}
        run: |
          set -euo pipefail
          test "$(gh --version | awk 'NR == 1 {print $3}')" = "2.79.0"
          mkdir -p verify-assets
          gh release download "${TAG}" \
            --repo "${RELEASE_REPOSITORY}" \
            --dir verify-assets \
            --pattern 'corelink-*'
          gh release download "${TAG}" \
            --repo "${RELEASE_REPOSITORY}" \
            --dir verify-assets \
            --pattern checksums.txt --pattern release-manifest.json --clobber
          ACTUAL_MANIFEST_SHA256="$(shasum -a 256 verify-assets/release-manifest.json | awk '{print $1}')"
          test "${ACTUAL_MANIFEST_SHA256}" = "${MANIFEST_SHA256}"
          python3 scripts/cli_release_manifest.py verify --directory verify-assets \
            --manifest verify-assets/release-manifest.json --tag "${TAG}" --source-sha "${SOURCE_SHA}"
          rm -f verify-assets/release-manifest.json

          printf '%s\n' "${SUBJECT_LIST}" > attested.txt
          cd verify-assets
          shasum -a 256 ./* | sed 's|\./||' > ../actual.txt
          cd ..

          if ! diff -u <(sort attested.txt) <(sort actual.txt); then
            echo "::error::A release asset changed after it was attested. The provenance bundle does not describe the bytes now on the release."
            exit 1
          fi
          echo "All exact inventory digests still match the release assets."

      - name: Report what was attested
        env:
          TAG: ${{ inputs.release_tag }}
          SUBJECT_LIST: ${{ needs.build-artifacts.outputs.subject-list }}
        run: |
          set -euo pipefail
          echo "SLSA Build L2 provenance (self-hosted) generated for release: ${TAG}"
          echo "Rekor inclusion proof: mandatory (INV-SUPPLY-PROVENANCE-IN-REKOR)"
          echo "Subjects:"
          printf '%s\n' "${SUBJECT_LIST}"
          echo "Customer verify command:"
          echo "  corelink-supply-verify verify \\"
          echo "    --bundle provenance.intoto.jsonl.bundle \\"
          echo "    --release ${TAG} \\"
          echo "    --expected-builder HuGR-Labs/corelink-server"

      - name: Emit SLSA attestation metric (success)
        # Structured log event for Prometheus scrape (OTel collector parses)
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PY'
          import json
          import os

          print(json.dumps({
              "metric": "corelink_supply_slsa_attestations_total",
              "outcome": "ok",
              "slsa_build_level": "L2",
              "plan": "internal",
              "value": 1,
              "release": os.environ["RELEASE_TAG"],
          }, separators=(",", ":")))
          PY
