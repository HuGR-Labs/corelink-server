name: license-policy (R7-1 supply-quality rollup)

# Dependency-license policy gate. Companion to cargo-deny: human-readable
# license-audit on every PR. Fails the PR if any transitive dep lands
# outside deny.toml [licenses].allow.
#
# Block-list (informational — anything outside allow-list is blocked):
#   GPL-*, AGPL-*, SSPL-*, CDLA-Sharing-*, Commons-Clause, BUSL-*.
#
# SHA-pinned per HIGH_RISK lane FF-HR-005 + ADR-S12-045 §6 tooling-pin policy.
#
# Reference: scripts/license-audit.sh,
#            specs/_audits/sealed/2026-05-14-license-audit.md

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'apps/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'scripts/license-audit.sh'
      - '.github/workflows/license-policy.yml'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'apps/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
  schedule:
    # Weekly Monday 07:00 UTC — catches upstream license changes that
    # could shift a transitive dep out of the allow-list.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-policy:
    name: cargo-license + allowlist policy gate
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-04-29

      # The self-hosted Mac's rustup proxy is broken, so `cargo` is not on PATH
      # by default and license-audit.sh hard-fails with "cargo not on PATH".
      # Put the workspace-pinned host toolchain (1.91.1 via rust-toolchain.toml)
      # on PATH directly — same fix the other Rust gates use (corelink-reapi.yml).
      - name: Put host toolchain on PATH (workspace-pinned 1.91.1)
        run: echo "$HOME/.rustup/toolchains/1.91.1-x86_64-apple-darwin/bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        with:
          shared-key: license-policy
          cache-targets: 'false'

      - name: Install cargo-license
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: cargo-license@0.6.1

      - name: Run license-audit
        id: audit
        run: bash scripts/license-audit.sh

      - name: Check OSS crate license tags
        # Inverse of the dep-license audit: verify OUR OWN OSS-designated
        # crates carry the literal `license = "MIT OR Apache-2.0"` instead of
        # silently inheriting the UNLICENSED workspace default (the Wave
        # 33-36 regression that wiped the DEBT-002 tags).
        run: bash scripts/check-oss-license-tags.sh

      - name: Upload license artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: license-audit-${{ github.event.pull_request.number || github.run_id }}
          path: target/license-audit/
          retention-days: 30
          if-no-files-found: warn

      - name: Emit step summary on success
        if: success()
        run: |
          set -euo pipefail
          {
              echo '## License policy: PASSED'
              echo ''
              echo 'All workspace dependencies fall within the deny.toml allow-list.'
              echo 'INV-SUPPLY-LICENSE-ALLOWLIST: ENFORCED'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Emit step summary on failure
        if: failure()
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # backticks inside single quotes are
          # literal markdown, not shell command substitution.
          {
              echo '## License policy: FAILED'
              echo ''
              echo 'One or more dependencies use a disallowed license.'
              echo 'See artifact `license-audit-*` → `VIOLATIONS.txt` for details.'
              echo ''
              if [ -f target/license-audit/VIOLATIONS.txt ]; then
                  echo '```'
                  cat target/license-audit/VIOLATIONS.txt
                  echo '```'
              fi
          } >> "$GITHUB_STEP_SUMMARY"
