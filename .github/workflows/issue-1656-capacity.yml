name: issue-1656-capacity

on:
  pull_request:
    paths:
      - "wrangler.toml"
      - "config/capacity/**"
      - "scripts/verify_regional_capacity.py"
      - "scripts/test_verify_regional_capacity.py"
      - ".github/workflows/issue-1656-capacity.yml"
  push:
    branches: [main]
    paths:
      - "wrangler.toml"
      - "config/capacity/**"
      - "scripts/verify_regional_capacity.py"
      - "scripts/test_verify_regional_capacity.py"

permissions:
  contents: read

jobs:
  credentialless-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository budget
        run: python3 scripts/verify_regional_capacity.py
      - name: Exercise fail-closed tests
        run: python3 -m unittest scripts/test_verify_regional_capacity.py
