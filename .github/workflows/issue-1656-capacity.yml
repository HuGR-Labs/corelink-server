name: issue-1656-capacity

on:
  pull_request:
    paths:
      - "wrangler.toml"
      - "config/capacity/**"
      - "scripts/verify_regional_capacity.py"
      - "scripts/test_verify_regional_capacity.py"
      - "scripts/probe_i1656_capacity_readonly.py"
      - "scripts/test_probe_i1656_capacity_readonly.py"
      - ".github/workflows/issue-1656-capacity-refresh.yml"
      - ".github/workflows/issue-1656-capacity.yml"
  push:
    branches: [main]
    paths:
      - "wrangler.toml"
      - "config/capacity/**"
      - "scripts/verify_regional_capacity.py"
      - "scripts/test_verify_regional_capacity.py"
      - "scripts/probe_i1656_capacity_readonly.py"
      - "scripts/test_probe_i1656_capacity_readonly.py"
      - ".github/workflows/issue-1656-capacity-refresh.yml"

permissions:
  contents: read

jobs:
  credentialless-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Verify repository budget
        run: python3 scripts/verify_regional_capacity.py
      - name: Exercise fail-closed tests
        run: python3 -m unittest scripts/test_verify_regional_capacity.py scripts/test_probe_i1656_capacity_readonly.py
