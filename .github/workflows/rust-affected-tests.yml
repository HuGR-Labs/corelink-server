# Rust tests for the crates a PR can actually break (WP-TEST).
#
# WHY THIS EXISTS: of 75 crates, only 9 had a `cargo test -p` in a lane that
# runs. 16 more LOOK covered — they are named only in `nightly.yml` (zero
# successful runs) or `ffi-matrix-ci.yml` (never worked) — and 50 are named
# nowhere, including `corelink-auth` and `corelink-pat`, the two crates holding
# the auth primitives. A grep for "crates under test" answers 25; the truthful
# answer was 9.
#
# WHY SELECTION IS THE REVERSE CLOSURE, NOT "crates the diff touched":
# the dangerous regression comes from ANOTHER crate. Touching
# `corelink-ratelimit` must pull `corelink-billing`, because billing depends on
# it — and no curated list stays right about that. `cargo tree --invert` derives
# it from the Cargo graph instead, so it cannot silently go stale the way the
# "25 covered crates" list did.
#
# Measured closures (2026-08-30): ratelimit 4, billing-stripe-materializer 3,
# cas 10, auth 4, pat 13 — of 75. The largest is 13, so no ceiling is needed.
#
# WHY auth + pat ALWAYS, regardless of the diff: they are where "I did not touch
# that" is the sentence before the incident. Their closure is 13 crates and
# already includes cas, server, worker, reapi, privacy and adapter-host, so the
# unconditional floor buys most of the blast radius for free.
#
# WHY PROPTEST_CASES IS LOWERED HERE: `corelink-auth` takes 58 MINUTES at its
# default of 10 000 cases (measured; `webauthn_prop_webauthn.rs` alone is 3370 s
# of it) and `corelink-pat` takes 7m18s. That cost is very likely WHY these
# crates were never wired into CI — the honest reading is consequence, not
# oversight. The full-intensity run lives in `rust-deep-property.yml`; no
# property leaves the suite, only the iteration count changes per lane.
name: rust-affected-tests

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/rust-affected-tests.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: rust-affected-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: select affected crates (reverse closure)
    runs-on: corelink
    timeout-minutes: 10
    outputs:
      crates: ${{ steps.closure.outputs.crates }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Compute the reverse-dependency closure
        id: closure
        run: |
          set -euo pipefail

          BASE="${{ github.event.pull_request.base.sha }}"
          [ -n "$BASE" ] || BASE="$(git rev-parse HEAD~1)"

          # Crates the diff touched. An empty result is legitimate (a docs-only
          # or worker-only PR) and must not be confused with a failed diff, so
          # the git call is checked separately from the match count.
          if ! CHANGED_PATHS="$(git diff --name-only "$BASE" HEAD)"; then
            echo "::error::git diff failed against base $BASE — refusing to \
                  guess an empty change set"
            exit 1
          fi
          # Map each changed path to its OWNING package via cargo metadata,
          # not by regexing `crates/`. 20 of the 95 workspace packages live
          # outside it — 12 in tests/, 7 in tools/, 1 in apps/ — so a
          # `crates/`-only regex silently yields NO seed for a PR touching
          # `tools/corelink-cli` or `tests/e2e-dsr`, and those packages would go
          # untested even when directly edited.
          cargo metadata --no-deps --format-version 1 > /tmp/md.json
          python3 -c "import json,os;md=json.load(open('/tmp/md.json'));r=os.getcwd();print('\\n'.join(os.path.relpath(os.path.dirname(p['manifest_path']),r)+'\\t'+p['name'] for p in md['packages']))" > /tmp/pkgdirs.tsv

          # Longest directory first, so a nested package wins over its parent.
          : > /tmp/touched.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            while IFS=$'\t' read -r dir name; do
              case "$path" in
                "$dir"|"$dir"/*) printf '%s\n' "$name" >> /tmp/touched.txt; break ;;
              esac
            done < <(sort -rk1,1 /tmp/pkgdirs.tsv)
          done <<< "$CHANGED_PATHS"
          TOUCHED="$(sort -u /tmp/touched.txt)"

          # UNIVERSAL SEED: a change to the lockfile, the workspace manifest,
          # the toolchain pin or this workflow can break ANY package without
          # touching a single file inside it. Path-based closure is structurally
          # blind to that — a dependabot PR editing only `Cargo.lock` maps to no
          # package at all and would be tested against the 13-package floor.
          # Measured: those paths yield an EMPTY seed set today.
          # `grep -q` is forbidden here and the gate is right: -q exits on the
          # FIRST match, SIGPIPEs `printf`, and under `set -o pipefail` the
          # pipeline then reports the producer's failure — so it can go false
          # exactly when it FINDS the thing. Redirecting instead keeps the same
          # exit status, reads all input, and cannot SIGPIPE.
          if printf '%s\n' "$CHANGED_PATHS" | grep -xE 'Cargo\.lock|Cargo\.toml|rust-toolchain\.toml|\.github/workflows/rust-affected-tests\.yml' >/dev/null; then
            echo "universal seed: a root manifest/lockfile/toolchain change can break any package"
            printf '%s\n' corelink-py corelink-go corelink-wasm > /tmp/ffi-exclude.txt
            cut -f2 /tmp/pkgdirs.tsv | sort -u \
              | grep -Fxv -f /tmp/ffi-exclude.txt > /tmp/final.txt
            echo "selected $(wc -l < /tmp/final.txt | tr -d ' ') crates (whole workspace):"
            sed 's/^/  /' /tmp/final.txt
            echo "crates=$(tr '\n' ' ' < /tmp/final.txt)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # auth + pat are unconditional. See the header.
          SEEDS="$(printf '%s\ncorelink-auth\ncorelink-pat\n' "$TOUCHED" \
            | grep -v '^$' | sort -u)"

          # Everything below stays NEWLINE-delimited and is consumed with
          # `while read`, never by unquoted word-splitting. Splitting would work
          # here (crate names have no spaces) but it trips shellcheck SC2086,
          # and silencing a real warning to keep a shortcut is how the next
          # genuinely-unsafe expansion gets waved through too.
          : > /tmp/closure.txt
          while IFS= read -r c; do
            [ -n "$c" ] || continue
            # `cargo tree --invert <crate>` — NOT `-i -p <crate>`, which cargo
            # rejects ("the -i flag requires a package name") and which fails
            # into an empty parse that reads as "nothing depends on this".
            if ! OUT="$(cargo tree --invert "$c" --workspace --edges normal 2>/dev/null)"; then
              echo "::warning::cargo tree --invert failed for $c; including it alone"
              printf '%s\n' "$c" >> /tmp/closure.txt
              continue
            fi
            printf '%s' "$OUT" | grep -oE '[a-z0-9-]+ v[0-9]' \
              | sed 's/ v[0-9]//' >> /tmp/closure.txt
          done <<< "$SEEDS"

          # Workspace members from `cargo metadata`, NOT from `ls crates`.
          # Directory name != package name: `crates/corelink-container` is the
          # package `corelink-server`, and `crates/tenant-path` is
          # `corelink-tenant-path`. The first run of this lane died on
          # "package ID specification `corelink-container` did not match any
          # packages" for exactly that reason. cargo metadata is also the only
          # source that sees the 20 workspace packages living outside crates/.
          cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; [print(p["name"]) for p in json.load(sys.stdin)["packages"]]' \
            > /tmp/members.txt
          # FFI/SDK leaves need a non-Rust toolchain the fleet image does not
          # carry — `corelink-py` links against libpython3.12 and fails at
          # `rust-lld: unable to find library -lpython3.12`. They already have
          # their own lane (`ffi-matrix-ci.yml`), which is one of the 20
          # zero-success lanes and is parked; pulling them in here would make
          # this lane inherit a parked lane's blocker. Excluded WITH the reason,
          # and tracked, rather than silently dropped. See B-123.
          printf '%s\n' corelink-py corelink-go corelink-wasm > /tmp/ffi-exclude.txt

          sort -u /tmp/closure.txt | grep -Fx -f /tmp/members.txt \
            | grep -Fxv -f /tmp/ffi-exclude.txt > /tmp/final.txt || true

          if [ ! -s /tmp/final.txt ]; then
            echo "::error::closure came out EMPTY — auth and pat are unconditional seeds, so an empty set means the computation broke, not that there is nothing to test"
            exit 1
          fi

          echo "selected $(wc -l < /tmp/final.txt | tr -d ' ') crates:"
          sed 's/^/  /' /tmp/final.txt
          echo "crates=$(tr '\n' ' ' < /tmp/final.txt)" >> "$GITHUB_OUTPUT"

  test:
    name: cargo test (affected)
    needs: select
    runs-on: corelink
    # The floor (auth+pat closure) measured ~4 min of test time at the reduced
    # case count, plus a cold compile. Sized COLD on purpose: the `/cargo` cache
    # is not a premise, it is headroom if it works.
    timeout-minutes: 45
    env:
      # Default is 10 000 (see `proptest_cases()` in
      # crates/corelink-auth/tests/webauthn_prop_webauthn.rs). The full count
      # runs in rust-deep-property.yml.
      PROPTEST_CASES: '32'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # `corelink-reapi`'s build script needs protoc and the fleet image does
      # NOT ship it — the first run of this lane failed with
      # "Could not find `protoc`". reapi is in the unconditional floor (it sits
      # in corelink-auth's reverse closure), so every run reaches it. Same
      # action and same pin the existing corelink-reapi.yml lane already uses on
      # this fleet; adding it to the image is the better long-term fix and
      # belongs in corelink-runners, not here.
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b  # arduino/setup-protoc@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: cargo test (affected crates)
        run: |
          set -euo pipefail
          # Built as an ARRAY, not a string: `cargo test $ARGS` relies on
          # word-splitting (shellcheck SC2086) and would also break on any crate
          # name that ever gained a character needing quoting.
          read -ra SELECTED <<< "${{ needs.select.outputs.crates }}"
          ARGS=()
          for c in "${SELECTED[@]}"; do ARGS+=(-p "$c"); done
          echo "cargo test ${ARGS[*]} --all-targets"
          cargo test "${ARGS[@]}" --all-targets
