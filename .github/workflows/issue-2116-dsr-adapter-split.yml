name: issue #2116 DSR adapter split and B-126 gate

on:
  pull_request:
    paths:
      - '.github/workflows/issue-2116-dsr-adapter-split.yml'
      - 'crates/corelink-container/src/main_tests.rs'
      - 'crates/corelink-container/src/routes/dsr/adapter_d1.rs'
      - 'crates/corelink-container/src/routes/dsr/adapter_d1/**'
      - 'crates/corelink-container/src/routes/dsr/adapter_d1_registry.rs'
      - 'crates/corelink-container/src/routes/dsr/adapter_d1_tests.rs'
      - 'scripts/verify_b126_t1_refactor.py'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: issue-2116-dsr-adapter-split-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-gate:
    if: github.repository == 'HuGR-dev/corelink-server'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision without write credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable toolchain action
        with:
          toolchain: 1.91.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7

      - name: Install protoc
        uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run B-126 line-cap and mutation gate
        run: python3 -S scripts/verify_b126_t1_refactor.py --self-test

      - name: Compile and run D1 adapter tests
        run: cargo test --locked -p corelink-server --lib routes::dsr::adapter_d1::tests::

      - name: Run B-126 source-size regression tests
        run: cargo test --locked -p corelink-server --bin corelink-server b126_t1_
