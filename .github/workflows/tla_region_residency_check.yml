name: TLA+ region_residency Model Check (WI-S14-009)

# Runs TLC v1.8.0 SHA-256 pinned (ADR-0042 §A1) over
# specs/tla/region_residency.tla. Dedicated gate for S-14 WI-S14-009
# cross-region routing residency + no-cross-leak + tenant-isolation spec.
#
# Gates via scripts/run_tlc_corelink.sh which enforces:
#   1. TLC binary SHA-256 supply-chain pin (mandatory per ADR-0042 §A1)
#   2. .tla + .cfg presence verification
#   3. TLC INVARIANTS + PROPERTIES check (exit code 0 = all pass)
#
# Invariants checked (state predicates):
#   - TypeOK                  (type safety, shape of all variables)
#   - RegionResidencyHolds    (INV-DATA-RESIDENCY CRITICAL §3.11)
#   - NoCrossRegionWrite      (INV-DATA-RESIDENCY + INV-TENANT-ISOLATION CRITICAL)
#   - NoCrossRegionLeak       (INV-REGION-NO-CROSS-LEAK CRITICAL §3.12)
#
# Properties checked (temporal):
#   - ReplicationEventuallyConverges (liveness; FairExecution WF assumption)
#
# CI gate: exit code != 0 → PR blocked. Runtime budget: ≤ 60s.
# State space: Tenants=3, Blobs=5, Regions=4, MaxLag=2, MaxRequests=20.
#
# Reference: WI-S14-009 §6.1 + §9.1 + invariant_registry.md §3.11/§3.12.

on:
  # Moved OFF per-PR 2026-06-02 to keep PRs fast (was a heavy gate). Runs
  # nightly (staggered) + on-demand. Re-add pull_request only if
  # this must block PRs again.
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  tla-region-residency-check:
    name: TLC region_residency (WI-S14-009 INV-DATA-RESIDENCY + INV-REGION-NO-CROSS-LEAK)
    runs-on: ubuntu-latest
    timeout-minutes: 10   # hard ceiling; CI runtime target ≤ 60s; 10 min is generous guard
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Java (TLC requires JVM ≥ 11)
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install pinned TLC v1.8.0 (SHA-256 verified — ADR-0042 §A1)
        env:
          TLC_VERSION: '1.8.0'
          TLC_SHA256_PINNED: '33de7da9ce1b7fffb9d1c184021178dbb051747be48504e65c584c423721a32e'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tla"
          curl -fsSL -o "$RUNNER_TEMP/tla/tla2tools.jar" \
            "https://github.com/tlaplus/tlaplus/releases/download/v${TLC_VERSION}/tla2tools.jar"
          ACTUAL_SHA="$(sha256sum "$RUNNER_TEMP/tla/tla2tools.jar" | awk '{print $1}')"
          echo "TLC SHA-256 actual:   ${ACTUAL_SHA}"
          echo "TLC SHA-256 expected: ${TLC_SHA256_PINNED}"
          if [[ "${ACTUAL_SHA}" != "${TLC_SHA256_PINNED}" ]]; then
            echo "::error::TLC SHA-256 supply-chain pin violation (ADR-0042 §A1)" >&2
            echo "::error::expected: ${TLC_SHA256_PINNED}" >&2
            echo "::error::actual:   ${ACTUAL_SHA}" >&2
            echo "::error::Re-pin requires Security review + ADR-0042 §A1 update + Architect sign-off" >&2
            exit 1
          fi
          echo "TLC SHA-256 pin verified OK (ADR-0042 §A1)"
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/tlc" <<'WRAPPER'
          #!/usr/bin/env bash
          exec java -cp "$TLC_JAR" tlc2.TLC "$@"
          WRAPPER
          chmod +x "$HOME/.local/bin/tlc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "TLC_JAR=$RUNNER_TEMP/tla/tla2tools.jar" >> "$GITHUB_ENV"

      - name: TLC verify region_residency (WI-S14-009)
        # Checks:
        #   INVARIANTS: TypeOK + RegionResidencyHolds + NoCrossRegionWrite + NoCrossRegionLeak
        #   PROPERTIES: ReplicationEventuallyConverges (liveness — WF fairness)
        # State space: Tenants={t1,t2,t3}, Blobs={b1..b5}, Regions={WNAM,ENAM,WEUR,SAM},
        #              MaxLag=2, MaxRequests=20 (bounded for CI ≤ 60s).
        # TLC_SHA256_SKIP is NOT set — mandatory hash check enforced.
        run: bash scripts/run_tlc_corelink.sh region_residency

      - name: Assert invariant count in TLA+ spec (sanity gate)
        # Verify the spec file contains all 4 expected invariant definitions.
        # Guards against accidental deletion during refactors.
        run: |
          set -euo pipefail
          SPEC="specs/tla/region_residency.tla"
          REQUIRED_INVARIANTS=(
            "RegionResidencyHolds"
            "NoCrossRegionWrite"
            "NoCrossRegionLeak"
            "TypeOK"
          )
          all_ok=true
          for inv in "${REQUIRED_INVARIANTS[@]}"; do
            if ! grep -q "^${inv} ==" "${SPEC}"; then
              echo "::error::Required invariant missing from ${SPEC}: ${inv}" >&2
              all_ok=false
            else
              echo "Invariant present: ${inv}"
            fi
          done
          if ! grep -q "ReplicationEventuallyConverges" "${SPEC}"; then
            echo "::error::Liveness property ReplicationEventuallyConverges missing from ${SPEC}" >&2
            all_ok=false
          else
            echo "Liveness property present: ReplicationEventuallyConverges"
          fi
          if [[ "$all_ok" != "true" ]]; then
            echo "::error::region_residency.tla invariant sanity check failed" >&2
            exit 1
          fi
          echo "All 4 invariants + 1 liveness property verified present in spec."
