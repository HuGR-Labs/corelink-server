name: issue-2366 DSR redrive prerequisite contract

on:
  pull_request:
    paths:
      - 'migrations/d1/0145_dsr_dlq_redrive_authority.sql'
      - 'scripts/verify-signup-worker-dsr-redrive-schema.sh'
      - 'scripts/verify-signup-worker-secrets.sh'
      - 'scripts/verify_issue_2366_dsr_redrive_prereq.py'
      - 'tests/test_issue_2366_dsr_redrive_prereq.py'
      - 'apps/signup-worker/wrangler.toml'
      - '.github/workflows/signup-worker-deploy.yml'
      - '.github/workflows/staging-bootstrap.yml'
      - '.github/workflows/issue-2366-dsr-redrive-prereq.yml'
      - 'scripts/verify_staging_topology_contract.py'
      - 'infra/staging/topology.json'
      - 'docs/internal/secrets-checklist.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify frozen schema, deploy-fence, and secret-name contract
        run: python3 -I scripts/verify_issue_2366_dsr_redrive_prereq.py

      - name: Run adversarial contract mutations
        run: python3 -I tests/test_issue_2366_dsr_redrive_prereq.py

      - name: Run additive D1 migration gates
        run: |
          python3 scripts/check_migration_prefixes.py
          python3 scripts/check_migrations_additive.py
