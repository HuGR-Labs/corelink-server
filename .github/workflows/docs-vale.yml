name: docs vale (tone consistency lint)

# WI-S18-005 deliverable 9 — Vale tone-consistency CI gate.
# Microsoft style + custom CoreLink rules; PR fails on `error`-level Vale
# alerts. Spec contract S-18 §5.6 R-S18-15 + Quality Standard 14.s18.3.

on:
  pull_request:
    paths:
      - "apps/docs/docs/**"
      - "apps/docs/blog/**"
      - "apps/docs/i18n/**"
      - "apps/docs/.vale.ini"
      - "apps/docs/styles/**"
      - ".github/workflows/docs-vale.yml"
  push:
    branches: [main]
    paths:
      - "apps/docs/docs/**"
      - "apps/docs/blog/**"
      - "apps/docs/.vale.ini"
      - "apps/docs/styles/**"
      - ".github/workflows/docs-vale.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: docs-vale-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vale:
    name: vale lint (error → fail)
    # Native Vale binary. errata-ai/vale-action ships a reviewdog wrapper we
    # avoid (no-unpinned-action posture) — so install a checksum-pinned Vale
    # (Linux x86_64 release asset) and run it directly.
    #
    # RATCHET SCOPE: enforcement covers only the md/mdx files CHANGED by the
    # PR (diff vs the merge-commit's first parent). Full rule strength on
    # every touched file; the ~200-file legacy backlog does not block
    # unrelated PRs and burns down as files are edited. Full-tree visibility
    # lives in docs-ci.yml's advisory "Vale prose lint" job.
    # Runner: `corelink` (zero-hosted). This job already installs a
    # checksum-pinned Vale binary at runtime rather than via an action, so no box
    # image change is needed — the corelink box is Linux x86_64, same asset.
    runs-on: corelink
    timeout-minutes: 10
    env:
      VALE_VERSION: 3.9.1
      # sha256 from the official vale_3.9.1_checksums.txt release asset
      # (vale_3.9.1_Linux_64-bit.tar.gz). Both ubuntu-latest and the corelink
      # box are x86_64.
      VALE_SHA256_X86_64: fbc2eb47d0b8c50220ed1a2c5c611fbe0904ed567d638143d482016a18fd2db0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # HEAD^1 (PR base / pre-push main) must be resolvable for the
          # changed-files diff.
          fetch-depth: 2

      - name: Install Vale (pinned, checksum-verified)
        run: |
          set -euo pipefail
          TARBALL="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          SHA="$VALE_SHA256_X86_64"
          curl -fsSLo "$RUNNER_TEMP/$TARBALL" \
            "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/${TARBALL}"
          echo "$SHA  $RUNNER_TEMP/$TARBALL" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$TARBALL" -C "$RUNNER_TEMP" vale
          "$RUNNER_TEMP/vale" --version

      - name: Sync Vale packages (Microsoft style)
        run: |
          "$RUNNER_TEMP/vale" --config=apps/docs/.vale.ini sync

      - name: Lint changed prose files (error → fail)
        run: |
          set -euo pipefail
          # PR runs check out the merge commit (HEAD^1 = base branch);
          # push runs on main are merge/squash commits (HEAD^1 = previous
          # main) — in both cases HEAD^1..HEAD is exactly this change.
          # _generated/** is excluded: those MDX files mirror .proto comments
          # under the REAPI zero-drift gate — prose edits there are forbidden,
          # so prose-linting them would deadlock the two gates.
          CHANGED=$(git diff --name-only --diff-filter=d HEAD^1 HEAD -- \
              'apps/docs/docs/**/*.md' 'apps/docs/docs/**/*.mdx' \
              'apps/docs/blog/**/*.md' 'apps/docs/blog/**/*.mdx' \
            | grep -v '/_generated/' || true)
          if [ -z "$CHANGED" ]; then
            echo "No md/mdx prose files changed — nothing to lint."
            exit 0
          fi
          echo "Linting changed prose files:"
          printf '%s\n' "$CHANGED"
          printf '%s\n' "$CHANGED" \
            | xargs "$RUNNER_TEMP/vale" --config=apps/docs/.vale.ini \
                --minAlertLevel=error --output=line
