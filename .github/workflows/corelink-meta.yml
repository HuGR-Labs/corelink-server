name: corelink-meta (WI-S01-004)

# CI gate for the corelink-meta crate per WI-S01-004 §13 + §14.
# PR lane: build/clippy/tests (debug + release)/doc/canonical-vectors smoke +
# WASM target build + cargo-fuzz 60s smoke per target.
# Nightly lane: 1h fuzz per target + cargo-mutants kill rate + audit.

on:
  pull_request:
    paths:
      - 'crates/corelink-meta/**'
      - 'crates/corelink-hash/**'
      - 'migrations/d1/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/corelink-meta.yml'
  # NOTE: no `push: branches:[main]`. The build/clippy/test lane compiles the
  # crate (debug + release) on the self-hosted macOS fleet; re-running it on every
  # main merge fed the heavy-gate stampede (load 398/665, 2026-06-04; extends the
  # 977225d3 "stop heavy-gate stampede" sweep). The nightly cron below + the PR
  # `paths:` lane above keep continuous + targeted coverage.
  # ⛔ CRON REMOVED 2026-08-02 — redundant: this workflow already has a
  # `pull_request` trigger, so the code IS verified when it changes. The
  # nightly re-verified BYTE-IDENTICAL code: 10 of the last 14 days had
  # ZERO commits to main, and the self-hosted Mac (the founder's own
  # machine) was spending ~8.8 h/day on scheduled jobs, 75% of which
  # failed. A clock only earns its keep when something can change
  # WITHOUT a commit — CVE feeds, prod state, backups, certs. This
  # workflow is none of those.
  # Restore by uncommenting if this ever stops being PR-gated.
  # # Nightly full lane.
  # - cron: '47 4 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # PR gate is crate-scoped only. Workspace-wide gates (fmt, clippy --workspace,
  # test --workspace, doc --workspace) live in cas_foundation.yml::workspace-build-test
  # per CI-OPT-001. cargo-audit advisory DB scan lives in cargo-audit.yml
  # per CI-OPT-004 (removes floating rustsec/audit-check@v1 ref).
  pr-gate:
    name: PR gate (crate-scoped clippy + tests + canonical vectors)
    # Runner: `corelink` — the product's own ephemeral runner fabric (wave 4,
    # 2026-08-03). This job plus `wasm-build` below burned 61 billed minutes of
    # ubuntu-latest (~$0.37) in the 3 days to 2026-08-03; they are the whole
    # hosted footprint of this workflow, so the move takes all of it.
    #
    # The box is 4 vCPU / 12.5 GB (probe run 30825772599) against ubuntu-latest's
    # 2 vCPU / 7 GB on a private repo — twice the cores, and that headroom is what
    # pays for the cache loss described next.
    #
    # ⚠️ Ephemeral-runner reality — the box carries NO cache between runs, and the
    # `Swatinem/rust-cache` step below is gated `runner.environment ==
    # 'github-hosted'` (the shared-$HOME guard), so on a corelink box it SKIPS and
    # the crate compiles COLD every run. Measured, that costs far less than it
    # sounds: the image ships a pre-seeded ~/.cargo (415 MB, 362 registry
    # entries), so `cargo fetch --locked` took 12 s and a full cold
    # clippy + debug-test + release-test cycle for a crate lane ran in ~105 s on
    # 4 cores — comparable to the warm-cache hosted runs. Do NOT "fix" this by
    # re-enabling the cache step on self-hosted: that guard exists because the MAC
    # fleet shares one $HOME and rust-cache's prune step deletes a sibling job's
    # registry mid-compile (#979/#980).
    #
    # ⚠️ A refused or dropped spawn leaves the job QUEUED, and `timeout-minutes`
    # does not bound queued time — it starts once a job is RUNNING. That is a
    # stall, not a false pass: `scripts/pre-merge-gate-check.sh` scores a pending
    # check as ⛔ DO NOT MERGE, so a stranded box blocks the PR rather than
    # waving it through.
    runs-on: corelink
    # Sized from the measurement, not from a guess: the heaviest crate lane
    # already on this fabric (corelink-reapi::pr-gate, 8 cargo invocations incl.
    # two release builds and the 100k-concurrent isolation proptest) runs cold in
    # ~409-423 s. 30 min is ~4x headroom over that.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # actions/checkout@v7.0.0

      # `dtolnay/rust-toolchain` removed. It asked for `stable` + clippy/rustfmt;
      # `rust-toolchain.toml` pins 1.91.1 and lists both components, and rustup
      # honours that file over any `rustup default` — so 1.91.1's clippy is what
      # has always run here, hosted included. The assertion makes that provable
      # per run, so an image drift fails loudly instead of silently changing the
      # compiler.
      - name: Assert the workspace-pinned toolchain (rust-toolchain.toml)
        run: bash scripts/ci-assert-pinned-toolchain.sh

      - name: Cargo cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # Swatinem/rust-cache@v2.9.1
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          workspaces: ". -> target"

      - name: cargo clippy (corelink-meta, -D warnings)
        run: cargo clippy --package corelink-meta --all-targets -- -D warnings

      - name: cargo test (corelink-meta, debug)
        run: cargo test --package corelink-meta --all-targets

      - name: cargo test (release — perf + property gates)
        run: cargo test --release --package corelink-meta

      - name: cargo test (canonical schema vectors — fast smoke)
        run: cargo test --package corelink-meta --test schema_canonical

  wasm-build:
    name: WASM target build (CF Workers compile compatibility)
    # Runner: `corelink` (wave 4, 2026-08-03) — see the pr-gate job above for the
    # ephemeral-box caveats (4 vCPU / 12.5 GB vs 2 vCPU / 7 GB hosted; no cache
    # between runs so it compiles cold, kept competitive by the pre-seeded
    # ~/.cargo, 415 MB / 362 registry entries; a dropped spawn stalls the job as
    # ⛔ pending, which `timeout-minutes` cannot bound because it does not cover
    # queued time).
    runs-on: corelink
    # A single `cargo check --target wasm32` — measured at 4 s on the box for a
    # comparable crate, plus the ~15 s toolchain provision.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # actions/checkout@v7.0.0
      # `dtolnay/rust-toolchain@stable` with `targets: wasm32-unknown-unknown`
      # removed — and the target question is the one worth spelling out, because
      # the image itself does NOT ship wasm32 (probe 30825772599: the box's only
      # installed target is x86_64-unknown-linux-gnu on a 1.96.0 default).
      # It is `rust-toolchain.toml` that provides it: the pin declares
      # `targets = ["wasm32-unknown-unknown", "x86_64-unknown-linux-musl"]`, and
      # rustup installs the file's targets along with the channel on first use.
      # Measured: after the 15 s provision, `rustup target add
      # wasm32-unknown-unknown` reported "up to date" and took 0 s. The removed
      # action added wasm32 to `stable`, a toolchain cargo never uses in this
      # repo; the assertion below verifies the target on the toolchain that DOES
      # compile, which the action never did.
      - name: Assert the workspace-pinned toolchain + wasm32 target
        run: bash scripts/ci-assert-pinned-toolchain.sh wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # Swatinem/rust-cache@v2.9.1
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          workspaces: ". -> target"
      - name: cargo check (corelink-meta on wasm32-unknown-unknown)
        run: cargo check --package corelink-meta --target wasm32-unknown-unknown

  fuzz-smoke:
    name: cargo-fuzz smoke (60s, both targets)
    runs-on: [self-hosted, mac, corelink-builder]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # actions/checkout@v7.0.0
      # Self-hosted Macs already ship rustup+cargo; re-provisioning via
      # dtolnay/rust-toolchain collides on `bin/cargo`. Put the pre-installed
      # host nightly toolchain (cargo-fuzz requires nightly) on PATH instead —
      # see CLAUDE.md "the rustup proxy is broken" note.
      - name: Put host nightly toolchain on PATH (cargo-fuzz needs nightly)
        run: echo "$HOME/.rustup/toolchains/nightly-x86_64-apple-darwin/bin" >> "$GITHUB_PATH"
      # `cargo install` compiles cargo-fuzz's OWN dependency tree (aws-lc-sys, syn,
      # tokio, ctutils, parking_lot …) into whatever CARGO_HOME points at. Pointed at
      # the SHARED `~/.cargo`, it mutates the registry that every other concurrent
      # Rust job on this 5-runner Mac is compiling from — and those are exactly the
      # crate names in the `os error 2` failures. cargo-fuzz is NOT pre-installed on
      # the host, so this ran on EVERY fuzz job, not just after a version bump.
      #
      # Same class as the 2026-06-15 rustup incident documented in fuzz-nightly.yml
      # (shared `~/.rustup` mutated mid-run), one level down: shared `~/.cargo`.
      # There is no prebuilt binary to switch to — cargo-fuzz has no manifest in
      # taiki-e/install-action at the SHA this repo pins, so it would silently fall
      # back to this same from-source install.
      #
      # Fix: build it into a PER-RUNNER CARGO_HOME. Isolated, so the shared registry
      # is never written; persistent, so each runner pays the compile at most once.
      - name: Install cargo-fuzz (isolated CARGO_HOME — never the shared one)
        run: |
          set -euo pipefail
          TOOLS="$HOME/.cargo-tools/${RUNNER_NAME:-default}"
          mkdir -p "$TOOLS/bin"
          echo "$TOOLS/bin" >> "$GITHUB_PATH"
          if "$TOOLS/bin/cargo-fuzz" --version 2>/dev/null | grep -q '0.13.1'; then
            echo "cargo-fuzz 0.13.1 already in $TOOLS — no compile, no shared-registry write"
          else
            echo "compiling cargo-fuzz 0.13.1 into $TOOLS (isolated from ~/.cargo)"
            CARGO_HOME="$TOOLS" cargo install cargo-fuzz --locked --version =0.13.1
          fi
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # Swatinem/rust-cache@v2.9.1
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          workspaces: "crates/corelink-meta/fuzz -> target"
      - name: commit_put_roundtrip 60s
        working-directory: crates/corelink-meta
        run: cargo fuzz run commit_put_roundtrip -- -max_total_time=60
      - name: audit_idempotency 60s
        working-directory: crates/corelink-meta
        run: cargo fuzz run audit_idempotency -- -max_total_time=60

  fuzz-nightly:
    name: cargo-fuzz nightly (1h each)
    runs-on: [self-hosted, mac, corelink-builder]
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # actions/checkout@v7.0.0
      # Self-hosted Macs already ship rustup+cargo; re-provisioning via
      # dtolnay/rust-toolchain collides on `bin/cargo`. Put the pre-installed
      # host nightly toolchain (cargo-fuzz requires nightly) on PATH instead —
      # see CLAUDE.md "the rustup proxy is broken" note.
      - name: Put host nightly toolchain on PATH (cargo-fuzz needs nightly)
        run: echo "$HOME/.rustup/toolchains/nightly-x86_64-apple-darwin/bin" >> "$GITHUB_PATH"
      # `cargo install` compiles cargo-fuzz's OWN dependency tree (aws-lc-sys, syn,
      # tokio, ctutils, parking_lot …) into whatever CARGO_HOME points at. Pointed at
      # the SHARED `~/.cargo`, it mutates the registry that every other concurrent
      # Rust job on this 5-runner Mac is compiling from — and those are exactly the
      # crate names in the `os error 2` failures. cargo-fuzz is NOT pre-installed on
      # the host, so this ran on EVERY fuzz job, not just after a version bump.
      #
      # Same class as the 2026-06-15 rustup incident documented in fuzz-nightly.yml
      # (shared `~/.rustup` mutated mid-run), one level down: shared `~/.cargo`.
      # There is no prebuilt binary to switch to — cargo-fuzz has no manifest in
      # taiki-e/install-action at the SHA this repo pins, so it would silently fall
      # back to this same from-source install.
      #
      # Fix: build it into a PER-RUNNER CARGO_HOME. Isolated, so the shared registry
      # is never written; persistent, so each runner pays the compile at most once.
      - name: Install cargo-fuzz (isolated CARGO_HOME — never the shared one)
        run: |
          set -euo pipefail
          TOOLS="$HOME/.cargo-tools/${RUNNER_NAME:-default}"
          mkdir -p "$TOOLS/bin"
          echo "$TOOLS/bin" >> "$GITHUB_PATH"
          if "$TOOLS/bin/cargo-fuzz" --version 2>/dev/null | grep -q '0.13.1'; then
            echo "cargo-fuzz 0.13.1 already in $TOOLS — no compile, no shared-registry write"
          else
            echo "compiling cargo-fuzz 0.13.1 into $TOOLS (isolated from ~/.cargo)"
            CARGO_HOME="$TOOLS" cargo install cargo-fuzz --locked --version =0.13.1
          fi
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # Swatinem/rust-cache@v2.9.1
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          workspaces: "crates/corelink-meta/fuzz -> target"
      - name: commit_put_roundtrip 3600s
        working-directory: crates/corelink-meta
        run: cargo fuzz run commit_put_roundtrip -- -max_total_time=3600
      - name: audit_idempotency 3600s
        working-directory: crates/corelink-meta
        run: cargo fuzz run audit_idempotency -- -max_total_time=3600

  mutants-nightly:
    name: cargo-mutants kill-rate ≥ 80%
    runs-on: [self-hosted, mac, corelink-builder]
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # actions/checkout@v7.0.0
      # Self-hosted Macs already ship rustup+cargo; re-provisioning via
      # dtolnay/rust-toolchain collides on `bin/cargo`. Put the pre-installed
      # host toolchain (workspace pins 1.91.1 via rust-toolchain.toml) on PATH
      # instead — see CLAUDE.md "the rustup proxy is broken" note.
      - name: Use the workspace-pinned host toolchain (channel read from rust-toolchain.toml)
        run: bash scripts/ci-use-host-toolchain.sh
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # Swatinem/rust-cache@v2.9.1
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          workspaces: ". -> target"
      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-mutants
      # `cargo mutants` (no --check) actually runs the test suite against
      # each mutant; --check would only `cargo check` mutants. The
      # `--minimum-test-timeout` keeps slow proptest cases from being
      # misclassified as a timeout. The exit-code threshold is set so the
      # job fails if the kill rate drops below 80%.
      - run: cargo mutants --package corelink-meta --no-shuffle --minimum-test-timeout=600
