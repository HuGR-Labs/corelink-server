name: trivy (JS-deps CVE + IaC misconfig)

# Launch-hardening scan that closes the gap cargo-deny does NOT cover:
#   COVERS     → JS/npm dependency CVEs (worker/ + apps/* Node graph) and
#                IaC / Dockerfile / config misconfiguration.
#   DOES *NOT* → Rust crate advisories — cargo-deny + cargo-audit own those
#                (RustSec); trivy fs is run with `--scanners vuln` only and we
#                deliberately do not duplicate that Rust-advisory job here.
#
# Runner: `corelink` — the product's own ephemeral runner fabric (wave 1 of the
# migration off GitHub-hosted runners, 2026-08-03). This is a light download +
# filesystem scan (no Rust compilation), and the pinned Linux-64bit binary is
# exactly what a corelink box runs: Ubuntu 24.04 / x86_64 / 4 vCPU / 12.5 GB.
# curl, tar and sha256sum are all on the image, so the install step below does
# byte-for-byte the same work it did on ubuntu-latest — same tarball, same
# checksum, same two scans, same `--exit-code 1` failure mode.
#
# trivy and gitleaks were the ONLY two hosted workflows with an unfiltered
# `pull_request:` trigger, i.e. the two that ran on EVERY pull request. That is
# why they are wave 1: they carry the hosted PR bill almost by themselves.
#
# ⚠️ This job has an egress dependency the other wave-1 gate does not: trivy
# pulls its vulnerability DB and its misconfig-checks bundle as OCI artifacts
# from ghcr.io. It was already doing that on ubuntu-latest with no cache
# configured, so an ephemeral box costs nothing extra here — but ghcr.io
# reachability is a hard requirement for this gate specifically, and
# `runner-probe.yml` checks it.
#
# ⚠️ Ephemeral-runner reality. If the fabric refuses or drops the spawn, the job
# sits QUEUED, and `timeout-minutes` does NOT apply to queued time (it starts
# once a job is RUNNING); GitHub cancels a job left queued for 24 h. That is a
# stall, not a false pass — `scripts/pre-merge-gate-check.sh` scores a pending
# check as ⛔ DO NOT MERGE, so a stranded box blocks the PR.
#
# Trivy is installed as a VERSION-pinned release BINARY (curl the tarball +
# verify its sha256 checksum), not via a marketplace action — this matches the
# repo's no-unpinned-action posture (every `uses:` is a 40-char SHA) without
# taking on an action SHA. Bump of the trivy version / checksum requires the
# same tooling-pin review as an action SHA bump (FF-HR-005 / ADR-S12-045 §6).

on:
  pull_request:
    # Scoped to what trivy actually scans — the JS/npm dependency graph and
    # IaC/Dockerfile/config. A Rust-only PR (crates/** with no lockfile or
    # Dockerfile change) has nothing for trivy to scan, so it no longer fires
    # there. Kept deliberately GENEROUS (any package manifest/lockfile anywhere,
    # the whole worker/ + apps/ JS trees, every Dockerfile, terraform) so no CVE
    # surface slips through; self-path so editing this gate re-runs it.
    paths:
      - '**/package.json'
      - '**/pnpm-lock.yaml'
      - '**/package-lock.json'
      - '**/yarn.lock'
      - '**/Dockerfile*'
      - '**/*.tf'
      - '**/*.tfvars'
      - 'worker/**'
      - 'apps/**'
      - '.github/workflows/trivy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned trivy release + its published Linux-64bit tarball sha256 (the corelink
  # fabric hands out Linux x86_64 boxes, so this stays the Linux-64bit asset —
  # unchanged by the runner migration). Source of truth
  # (trivy_0.71.1_checksums.txt):
  # https://github.com/aquasecurity/trivy/releases/tag/v0.71.1
  TRIVY_VERSION: '0.71.1'
  TRIVY_SHA256: '3cbae37cd440cd8676e5ce9207fe460b5641c7579a17e9d00f8894928c41a88d'

jobs:
  trivy:
    name: trivy fs (JS vuln) + config (IaC misconfig)
    runs-on: corelink
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false  # scan-only job never pushes — don't keep the token

      - name: Install trivy (pinned binary + checksum verify)
        # Download the version-pinned release tarball and fail closed unless its
        # sha256 matches TRIVY_SHA256. No marketplace action, no unpinned curl.
        # Install into the workspace + prepend to $GITHUB_PATH (NOT `sudo install`
        # to /usr/local/bin — self-hosted runners often lack passwordless sudo).
        run: |
          set -euo pipefail
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${tarball}"
          curl -fsSL -o "${tarball}" "${url}"
          echo "${TRIVY_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/trivy-bin"
          tar -xzf "${tarball}" -C "${RUNNER_TEMP}/trivy-bin" trivy
          rm -f "${tarball}"
          echo "${RUNNER_TEMP}/trivy-bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/trivy-bin/trivy" --version

      - name: trivy fs — JS/npm dependency CVEs (vuln only)
        # Filesystem vuln scan. The VALUE is the JS lockfiles (pnpm-lock.yaml at
        # root + worker/ and apps/* package manifests) — cargo-deny is Rust-only
        # so the Node graph is otherwise unscanned by the Rust lane.
        # `--scanners vuln` keeps this to dependency CVEs (no secret/misconfig
        # noise here). Cargo.lock is SKIPPED on purpose: RustSec is cargo-deny's
        # lane (which already owns e.g. the pyo3 0.24.2 advisory via deny.toml) —
        # double-gating the same Rust advisory in two tools with two DBs is the
        # divergence we avoid. trivy here = the JS/npm graph cargo-deny can't see.
        run: |
          trivy fs . \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --skip-files Cargo.lock \
            --ignorefile .trivyignore.yaml \
            --exit-code 1 \
            --no-progress

      - name: trivy config — IaC / Dockerfile / config misconfig
        # Misconfiguration scan over Dockerfile + CI/wrangler/IaC config. This is
        # the net-new surface nothing else in the repo covers today.
        # NOTE: `trivy config` does NOT accept `--no-progress` in 0.71.1 (it is an
        # fs/image-scan flag) — passing it makes the subcommand FATAL. Use `-q`.
        run: |
          trivy config . \
            --severity HIGH,CRITICAL \
            --ignorefile .trivyignore.yaml \
            --exit-code 1 \
            -q
