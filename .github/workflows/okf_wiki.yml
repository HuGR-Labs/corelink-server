name: OKF-CoreLink Wiki Validation

# Gates the knowledge bundle (docs/knowledge/) against the FROZEN OKF-CoreLink
# profile contract (docs/internal/okf-wiki/01-okf-corelink-profile.contract.md)
# via scripts/validate_okf.py — checks C1-C10b (+ secondary C-AGE/C-REV nightly).
#
# Triggers on changes to the bundle OR to any grounding surface (crates/, specs/,
# worker/, apps/) OR to the validator itself: a code change can make a declared-
# and-cited line range drift (C5), so the gate must re-run when the cited files
# move. C5/C10b now cite+gate the TypeScript edge plane (worker/) and the apps/
# workers, so a PR touching ONLY worker/src or apps/*/src MUST run the gate too —
# omitting them was a silent bypass (the edge-plane concepts went un-revalidated).
on:
  pull_request:
    paths:
      - 'docs/knowledge/**'
      - 'docs/internal/okf-wiki/**'   # the oracle itself (manifest + contract) — editing it must re-run the gate
      - 'crates/**'
      - 'specs/**'
      - 'worker/**'
      - 'apps/**'
      - 'scripts/validate_okf.py'
      - 'scripts/validate_permission_matrix.py'
      - 'scripts/okf_git_batch.py'
      - 'scripts/okf_resolve_abbrev_cites.py'
      - 'scripts/okf_shift_citations.py'
      - 'scripts/okf_anchor_reverify.py'
      - 'tests/okf/**'
      - 'tests/test_okf_resolve_abbrev_cites.py'
      - 'tests/test_okf_shift_citations.py'
      - 'tests/test_okf_anchor_reverify.py'
      - 'docs/campaigns/remediation/WP-B044-orphan-teardown.md'
  push:
    branches: [main]
    paths:
      - 'docs/knowledge/**'
      - 'docs/internal/okf-wiki/**'
      - 'crates/**'
      - 'worker/**'
      - 'apps/**'
      - 'scripts/validate_okf.py'
      - 'scripts/validate_permission_matrix.py'
      - 'scripts/okf_git_batch.py'
      - 'scripts/okf_resolve_abbrev_cites.py'
      - 'scripts/okf_shift_citations.py'
      - 'scripts/okf_anchor_reverify.py'
      - 'tests/okf/**'
      - 'tests/test_okf_resolve_abbrev_cites.py'
      - 'tests/test_okf_shift_citations.py'
      - 'tests/test_okf_anchor_reverify.py'
      - 'docs/campaigns/remediation/WP-B044-orphan-teardown.md'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  okf-wiki-validation:
    # `corelink` ephemeral Linux (zero hosted spend, zero Mac load): the validator
    # is pure python3 with PyYAML, both baked into the runner image.
    runs-on: corelink
    steps:
      - name: Checkout
        # fetch-depth: 0 — C4/C5 need full history (checkpoint_sha lookup + the
        # two-tree `git diff <checkpoint_sha> HEAD` freshness diff). A shallow
        # checkout would make those checks error.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Install PyYAML (venv on system python3)
        # The validator runs on stdlib alone (hand-rolled YAML-subset reader for
        # frontmatter), but the nested concept-manifest.yaml (C10/C10b oracle)
        # needs a real YAML parser. Mirror the house venv idiom so the manifest
        # checks stay live. (No requirements file — PyYAML is the only dep.)
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python3 -m pip install --upgrade pip
          .venv/bin/python3 -m pip install pyyaml
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Validate OKF-CoreLink knowledge bundle
        run: python3 scripts/validate_okf.py

      # B-153 is part of the same published-claim freshness boundary: an OKF
      # run must not be green while the customer-facing role matrix disagrees
      # with a served authorization gate.
      - name: Validate published permission matrix
        run: python3 scripts/validate_permission_matrix.py

      - name: Test checkpoint reachability and first blob anchors (B-049)
        # Hermetic mutations prove unreachable checkpoints fail closed, first
        # blob anchors are created, and reachable cited drift remains red.
        run: python3 tests/test_okf_b049.py

      - name: Test C5c anchor re-verification regression (B-123)
        # This git-backed regression proves stale citations cannot survive a
        # moved source blob, a post-anchor source edit, or an orphaned checkpoint.
        run: python3 tests/test_okf_anchor_reverify.py

      - name: Test abbreviated-citation resolver contract (B-059)
        # The resolver is also integrated into validate_okf's C5/C6 collection;
        # this focused suite keeps inheritance, traversal, EOF, and malformed
        # range behavior explicit and mutation-tested.
        run: python3 tests/test_okf_resolve_abbrev_cites.py

      - name: Validate abbreviated OKF citations (B-059)
        # Exit 1 is a real finding and MUST fail this job; exit 2 means the
        # scan itself was not trustworthy and is likewise fatal.
        run: python3 scripts/okf_resolve_abbrev_cites.py

      - name: Test content-verified citation shifter (B-124)
        # Hermetic tests cover a real line insertion, the mixed hand-edit guard,
        # and ambiguous content.  A second invocation must never double-shift.
        run: python3 tests/test_okf_shift_citations.py

      - name: Validator acceptance suite (good + per-check bad fixtures)
        # Gates the validator's OWN correctness — proves every contract check
        # C1..C10b has a bad fixture it catches and the golden bundle passes
        # (C5b via a real throwaway-git two-revision harness). The done-oracle.
        run: bash tests/okf/run_fixtures.sh

      - name: Reconciliation worklist (only if validation failed)
        # Makes a RED freshness gate actionable: if the validator above failed
        # (most often C5 — a cited line-range drifted under a concept), print the
        # deterministic "what needs re-authoring" brief so the author sees exactly
        # which concepts to reconcile, which source files moved, and the diff
        # hunks — instead of re-deriving it by hand. Reporter, never blocks.
        if: failure()
        run: python3 scripts/okf_reconcile.py
