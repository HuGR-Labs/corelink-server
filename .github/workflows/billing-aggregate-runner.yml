name: billing-aggregate-runner

# WI-S10-007 Phase B (SHADOW) — the runner compute-overage aggregation cron.
#
# Drains the staged `runner_vcpu_seconds` meter from D1 `usage_event_staging`
# (populated by the spawn-Worker → container ingest, migrations 0017/0095),
# folds it into the dedicated runner counter lane `runner_usage_counter` +
# advances the per-region BLAKE3 tamper-chain `runner_hash_chain_head`
# (migration 0094), and computes the per-tenant SHADOW charge — what WOULD be
# billed — with NO Stripe contact. It bills NOTHING: the live Stripe submission
# is the separate, owner-gated flip (WP-8). This closes the last downstream gap
# the deep audit named (aggregate step was InMemory-only).
#
# ## Shape (mirrors billing-reconcile-daily.yml: pure bin + gated live lane)
#
#   1. Build the PURE `runner-aggregate-run` bin (JSON stdin→stdout, no creds,
#      no clock, no HTTP — the money/chain logic is unit-falsifiable; this
#      workflow owns all credentialed I/O, exactly as the reconcile cron does).
#   2. EXTRACT (live lane, gated on BILLING_AGGREGATE_LIVE=1 AND secrets):
#      bounded, read-only D1 queries assemble one v3 input per billing period:
#        - current period: up to 8,000 terms-backed staged rows;
#        - oldest historical period: at most one, up to 2,000 rows;
#        - immutable `runner_period_terms_snapshot`, durable consumption, and
#          `runner_hash_chain_head` — never a mutable current subscription plan.
#      The default (smoke) lane writes an EMPTY input so the cron is a green
#      no-op until the owner sets BILLING_AGGREGATE_LIVE=1 — the wiring ships,
#      the cron goes green the moment the secrets + migration 0096 are applied.
#   3. RUN the bin: exit 0 = ok (output.json on stdout); non-zero = malformed
#      input / hash-chain break → fail-CLOSED (job red, nothing written).
#   4. WRITE (live lane only): ONE atomic D1 batch — the additive
#      event claims (including evidence) + `runner_usage_counter` UPSERTs + the
#      `runner_hash_chain_head` advances + exact source watermarks — in a
#      single `{batch:[…]}` request (D1 batch = all-or-nothing, so a partial
#      write can NEVER mark a row aggregated without its usage being counted, nor
#      double-advance the chain). Fail-CLOSED on any non-2xx / success!=true.
#   5. Log the shadow ledger (charges nothing) + upload the artifact
#      (SOC 2 / GAAP ASC 606 evidence: input, output, write response).
#
# ## Safety / idempotency
#
#   - Watermark + LIMIT: each run drains only NEW rows (bounded); leftover rows
#     are picked up next run. Rows are marked by their EXACT (tenant_id,
#     request_id) PKs, so a row inserted between the SELECT and the WRITE is not
#     mis-marked — it is simply drained next run.
#   - The counter UPSERT is ADDITIVE (each run contributes only its delta), per
#     the watermark/delta contract of `corelink-runner-aggregate` (see the 0096
#     migration header correcting the 0094 doc-comment).
#   - Integer bind params are wrapped `CAST(? AS INTEGER)` — the D1 REST API
#     binds JSON numbers as REAL otherwise (documented footgun).
#   - A failed write leaves every drained row un-marked (NULL) → the next run
#     re-drains them cleanly. No page here (shadow charges nothing); PagerDuty is
#     the owner's add at the live flip.
#
# OWNER ACTION before flipping BILLING_AGGREGATE_LIVE=1 (names only; no values):
#   - CF_API_TOKEN                     (#50 variant — needs D1:Edit on the billing
#                                       DB: this cron WRITES the counter/chain/
#                                       watermark, unlike the read-only reconcile).
#   - CF_ACCOUNT_ID                    (#49) — EXISTS.
#   - CORELINK_BILLING_D1_DATABASE_ID  — the prod billing/usage D1 (corelink-prod-d1
#                                       = CONFIG_DB); same secret the reconcile cron
#                                       uses. EXISTS once reconcile was wired.
#   Also: migrations 0094/0095/0096 and 0134 (authoritative immutable terms +
#   event claims); 0139 is the #1630 compatibility no-op serialized after
#   the 0133–0137 migration queue.
#   MUST be applied to the prod D1 first, and
#   the container roll that activates the 0095 ingest MUST have shipped (so staged
#   rows carry `qty`), and every billable tenant-period needs an immutable
#   `runner_period_terms_snapshot` before it becomes eligible.
#
# SHA-pinned third-party actions per HIGH_RISK lane tooling-pin policy.

on:
  schedule:
    - cron: "0 5 * * *"  # 05:00 UTC daily — after audit-chain (02:00),
                          # neon-shadow (03:00), billing-reconcile (04:00);
                          # same low-traffic window, no collision.
  workflow_dispatch:
    inputs:
      billing_period:
        description: "Billing period YYYY-MM to aggregate (defaults to current UTC month)"
        required: false
        type: string

# The credentialed D1 write uses CF_API_TOKEN Bearer, not the GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: billing-aggregate-runner
  cancel-in-progress: false

jobs:
  aggregate:
    name: runner-aggregate-shadow
    # Self-hosted `corelink` (ephemeral CF-Container Ubuntu 24.04): pinned Rust
    # toolchain + python3-requests baked into the runner image → zero hosted-Actions
    # cost (zero-hosted-CI mandate). Until BILLING_AGGREGATE_LIVE=1 it runs the
    # SMOKE (empty-input) no-op lane, so it neither queries nor writes prod D1.
    runs-on: corelink
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Use the runner image's pre-installed, workspace-pinned toolchain — a
      # self-hosted job must not provision one (validate_no_shared_rustup_mutation.py).
      - name: Use host toolchain (baked, workspace-pinned)
        env:
          HOST_TRIPLE: x86_64-unknown-linux-gnu
        run: bash scripts/ci-use-host-toolchain.sh

      - name: Cache cargo
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          shared-key: billing-aggregate-runner

      - name: Build runner-aggregate-run binary
        run: cargo build -p corelink-runner-aggregate --bin runner-aggregate-run --release

      - name: Compute billing period (input or current UTC month)
        id: period
        env:
          BILLING_PERIOD_INPUT: ${{ inputs.billing_period }}
        run: |
          set -euo pipefail
          if [[ -n "$BILLING_PERIOD_INPUT" ]]; then
            PERIOD="$BILLING_PERIOD_INPUT"
          else
            PERIOD=$(date -u +%Y-%m)
          fi
          if ! [[ "$PERIOD" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]]; then
            echo "::error::Invalid billing_period: $PERIOD (want YYYY-MM)"
            exit 1
          fi
          echo "period=$PERIOD" >> "$GITHUB_OUTPUT"
          echo "run_date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "Aggregating runner overage for billing period: $PERIOD"

      # No pip install: `requests` is the python3-requests apt package baked into
      # the `corelink` image (Ubuntu 24.04 is PEP-668 externally-managed). The
      # smoke lane never imports it.

      - name: Extract bounded eligible periods (live lane gated)
        id: extract
        env:
          BILLING_AGGREGATE_LIVE: ${{ vars.BILLING_AGGREGATE_LIVE }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.CORELINK_BILLING_D1_DATABASE_ID }}
          PERIOD: ${{ steps.period.outputs.period }}
        run: |
          set -euo pipefail
          echo "::add-mask::${CF_API_TOKEN:-}"
          # Smoke / no-op lane: not live, or any required secret missing.
          if [[ "${BILLING_AGGREGATE_LIVE:-0}" != "1" || -z "${CF_API_TOKEN:-}" || -z "${CF_ACCOUNT_ID:-}" || -z "${D1_DATABASE_ID:-}" ]]; then
            echo "Smoke lane (BILLING_AGGREGATE_LIVE!=1 or secrets absent): empty input no-op."
            # heredoc body MUST be un-indented: <<'PY' does not strip leading
            # whitespace, so indented python would be an IndentationError.
          python3 - <<'PY'
          import json, os
          period = os.environ["PERIOD"]
          with open("aggregate-periods.json", "w") as f:
              json.dump([], f)
          with open("pending-missing-terms.json", "w") as f:
              json.dump([], f)
          PY
            echo "live=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Live lane: discovering the current and oldest historical eligible period."
          echo "live=1" >> "$GITHUB_OUTPUT"
          # Fail-CLOSED: any non-2xx, success!=true, or JSON error → non-zero exit.
          python3 - <<'PY'
          import json, os, sys
          import requests

          acct = os.environ["CF_ACCOUNT_ID"]
          db = os.environ["D1_DATABASE_ID"]
          token = os.environ["CF_API_TOKEN"]
          period = os.environ["PERIOD"]

          url = f"https://api.cloudflare.com/client/v4/accounts/{acct}/d1/database/{db}/query"
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          def d1_query(sql, params):
              r = requests.post(url, headers=headers, json={"sql": sql, "params": params}, timeout=60)
              if r.status_code != 200:
                  sys.stderr.write(f"AGGREGATE_ERROR: D1 query HTTP {r.status_code}: {r.text[:500]}\n")
                  sys.exit(3)
              body = r.json()
              if not body.get("success", False):
                  sys.stderr.write(f"AGGREGATE_ERROR: D1 success!=true: {body.get('errors')}\n")
                  sys.exit(3)
              rows = []
              for block in (body.get("result") or []):
                  rows.extend(block.get("results") or [])
              return rows

          # The one historical slot is the oldest pending period.  Always walk
          # periods ascending so a region's hash chain stays reproducible.
          historical = d1_query(
              "SELECT billing_period FROM usage_event_staging "
              "WHERE event_kind = 'runner_vcpu_seconds' AND qty IS NOT NULL "
              "AND runner_aggregated_at IS NULL AND billing_period < ? "
              "GROUP BY billing_period ORDER BY billing_period ASC LIMIT 1", [period])
          periods = [str(row["billing_period"]) for row in historical]
          periods.append(period)
          head_rows = d1_query(
              "SELECT region, current_head, next_sequence FROM runner_hash_chain_head "
              "WHERE chain_kind = 'runner_vcpu'",
              [],
          )
          prior_chain_heads = {}
          for row in head_rows:
              prior_chain_heads[str(row["region"])] = {
                  "current_head_hex": str(row["current_head"]),
                  "next_sequence": int(row["next_sequence"]),
              }

          with open("aggregate-periods.json", "w") as f:
              json.dump({"periods": periods, "prior_chain_heads": prior_chain_heads}, f)
          with open("pending-missing-terms.json", "w") as f:
              json.dump([], f)
          sys.stderr.write(f"Eligible periods (oldest historical then current): {periods}\n")
          PY

      - name: Run one v3 aggregation pass per eligible period
        id: run
        if: steps.extract.outputs.live == '1'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.CORELINK_BILLING_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, subprocess, sys, time
          import requests

          cfg = json.load(open("aggregate-periods.json"))
          if not cfg:
              sys.exit(0)
          acct, db, token = os.environ["CF_ACCOUNT_ID"], os.environ["D1_DATABASE_ID"], os.environ["CF_API_TOKEN"]
          url = f"https://api.cloudflare.com/client/v4/accounts/{acct}/d1/database/{db}/query"
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
          root = pathlib.Path("aggregate-runs"); root.mkdir(exist_ok=True)
          pending = []
          def query(sql, params):
              r = requests.post(url, headers=headers, json={"sql": sql, "params": params}, timeout=60)
              if r.status_code != 200 or not r.json().get("success", False):
                  raise RuntimeError(f"D1 extract failed: HTTP {r.status_code} {r.text[:500]}")
              return [row for block in r.json().get("result", []) for row in block.get("results", [])]
          heads = cfg["prior_chain_heads"]
          for index, period in enumerate(cfg["periods"]):
              cap = 8000 if period == cfg["periods"][-1] else 2000
              rows = query("SELECT tenant_id, request_id, region, qty, event_payload_hash, emitted_at FROM usage_event_staging WHERE event_kind='runner_vcpu_seconds' AND qty IS NOT NULL AND runner_aggregated_at IS NULL AND billing_period=? ORDER BY emitted_at, tenant_id, request_id LIMIT ?", [period, cap])
              terms = {str(row["tenant_id"]): row for row in query("SELECT tenant_id, allowance_vcpu_seconds, rate_cents_per_vcpu_hour, terms_snapshot_ref, terms_snapshot_digest_hex FROM runner_period_terms_snapshot WHERE billing_period=?", [period])}
              eligible = [row for row in rows if str(row["tenant_id"]) in terms]
              pending.extend({"billing_period": period, "tenant_id": str(row["tenant_id"]), "request_id": str(row["request_id"]), "reason": "missing_immutable_terms_snapshot"} for row in rows if str(row["tenant_id"]) not in terms)
              if not eligible:
                  print(f"period={period}: no terms-backed rows (pending missing terms={len(rows)})")
                  continue
              tenant_ids = sorted({str(row["tenant_id"]) for row in eligible})
              consumption = {str(row["tenant_id"]): int(row["vcpu_seconds"]) for row in query("SELECT tenant_id, COALESCE(SUM(vcpu_seconds), 0) AS vcpu_seconds FROM runner_usage_counter WHERE billing_period=? GROUP BY tenant_id", [period])}
              y, m = map(int, period.split("-")); start = int(datetime.datetime(y, m, 1, tzinfo=datetime.timezone.utc).timestamp() * 1000)
              ny, nm = (y + 1, 1) if m == 12 else (y, m + 1); end = int(datetime.datetime(ny, nm, 1, tzinfo=datetime.timezone.utc).timestamp() * 1000)
              document = {"artifact_contract_version": 3, "billing_period": period, "period_start_ms": start, "period_end_ms": end, "now_ms": int(time.time() * 1000), "staged": [{"tenant_id": str(r["tenant_id"]), "region": str(r["region"]), "qty_vcpu_seconds": int(r["qty"]), "idem_key_hex": str(r["event_payload_hash"]), "time_ms": int(r["emitted_at"])} for r in eligible], "tenant_period_terms": {tid: {"tenant_id": tid, "billing_period": period, "allowance_vcpu_seconds": int(terms[tid]["allowance_vcpu_seconds"]), "rate_cents_per_vcpu_hour": int(terms[tid]["rate_cents_per_vcpu_hour"]), "terms_snapshot_ref": str(terms[tid]["terms_snapshot_ref"]), "terms_snapshot_digest_hex": str(terms[tid]["terms_snapshot_digest_hex"])} for tid in tenant_ids}, "prior_consumption": {tid: {"product": "runner_vcpu_seconds", "billing_period": period, "cumulative_vcpu_seconds": consumption[tid], "terms_snapshot_ref": str(terms[tid]["terms_snapshot_ref"]), "terms_snapshot_digest_hex": str(terms[tid]["terms_snapshot_digest_hex"])} for tid in tenant_ids if consumption.get(tid, 0)}, "prior_chain_heads": heads}
              prefix = root / f"{index:02d}-{period}"; input_path = prefix.with_suffix(".input.json"); output_path = prefix.with_suffix(".output.json")
              input_path.write_text(json.dumps(document, sort_keys=True)); run = subprocess.run(["./target/release/runner-aggregate-run"], input=input_path.read_bytes(), stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=False)
              prefix.with_suffix(".stderr.log").write_bytes(run.stderr)
              if run.returncode:
                  sys.stderr.write(run.stderr.decode(errors="replace")); raise SystemExit(run.returncode)
              output_path.write_bytes(run.stdout); output = json.loads(run.stdout)
              if output.get("artifact_contract_version") != 3 or any(c["billing_period"] != period for c in output["counters"]): raise RuntimeError("cross-period or non-v3 aggregate output")
              heads = {h["region"]: {"current_head_hex": h["current_head_hex"], "next_sequence": h["next_sequence"]} for h in output["chain_head_updates"]} | {k: v for k, v in heads.items() if k not in {h["region"] for h in output["chain_head_updates"]}}
              (prefix.with_suffix(".events.json")).write_text(json.dumps([{**{"tenant_id": str(r["tenant_id"]), "request_id": str(r["request_id"])}, "claim_fingerprint": hashlib.sha256(json.dumps(r, sort_keys=True, separators=(",", ":")).encode()).hexdigest(), "terms_snapshot_ref": str(terms[str(r["tenant_id"])]["terms_snapshot_ref"]), "terms_snapshot_digest_hex": str(terms[str(r["tenant_id"])]["terms_snapshot_digest_hex"])} for r in eligible], sort_keys=True))
          json.dump(pending, open("pending-missing-terms.json", "w"), sort_keys=True)
          PY

      - name: Commit each period (claims, counters, heads, exact watermarks)
        id: write
        if: steps.extract.outputs.live == '1'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.CORELINK_BILLING_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          echo "::add-mask::${CF_API_TOKEN:-}"
          # Fail-CLOSED: a non-2xx / success!=true on the batch → non-zero exit.
          python3 - <<'PY'
          import json, os, sys
          import requests

          acct = os.environ["CF_ACCOUNT_ID"]
          db = os.environ["D1_DATABASE_ID"]
          token = os.environ["CF_API_TOKEN"]

          import hashlib, pathlib
          root = pathlib.Path("aggregate-runs")
          if not root.exists(): sys.exit(0)
          url = f"https://api.cloudflare.com/client/v4/accounts/{acct}/d1/database/{db}/query"
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
          responses = {}
          for input_path in sorted(root.glob("*.input.json")):
              prefix = input_path.with_suffix("").with_suffix("")
              out = json.loads(prefix.with_suffix(".output.json").read_text())
              inp = json.loads(input_path.read_text()); events = json.loads(prefix.with_suffix(".events.json").read_text())
              period, now_ms = inp["billing_period"], int(inp["now_ms"])
              evidence = hashlib.sha256(json.dumps({"period": period, "events": events}, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
              batch_id = f"runner-v3:{period}:{evidence}"
              for event in events: event.update({"aggregate_batch_id": batch_id, "billing_period": period, "evidence_ref": f"github://{os.environ.get('GITHUB_REPOSITORY', 'corelink')}/runner-aggregate/{period}/{evidence}", "evidence_digest_hex": evidence, "claimed_at_ms": now_ms})
              payload = json.dumps(events, sort_keys=True, separators=(",", ":"))
              # Frozen #1635 seam: an exact durable winner is Deduped; any
              # other winner is Conflict.  Discovery never replays a batch.
              discovery_sql = "WITH e AS (SELECT json_extract(value,'$.tenant_id') tenant_id,json_extract(value,'$.request_id') request_id FROM json_each(?)) SELECT e.tenant_id,e.request_id,c.claim_fingerprint,c.aggregate_batch_id,c.billing_period,c.terms_snapshot_ref,c.terms_snapshot_digest_hex,c.evidence_ref,c.evidence_digest_hex,c.claimed_at_ms,s.runner_aggregated_at FROM e LEFT JOIN runner_aggregate_event_claim c USING(tenant_id,request_id) LEFT JOIN usage_event_staging s USING(tenant_id,request_id)"
              seen = requests.post(url, headers=headers, json={"sql": discovery_sql, "params": [payload]}, timeout=60)
              if seen.status_code != 200 or not seen.json().get("success", False): raise RuntimeError(f"claim discovery failed: {seen.text[:500]}")
              winners = [x for b in seen.json().get("result", []) for x in b.get("results", [])]; expected = {(e["tenant_id"], e["request_id"]): e for e in events}
              if any(w["runner_aggregated_at"] is not None and w["claim_fingerprint"] is None for w in winners):
                  raise RuntimeError(f"period={period}: Conflict watermark without durable claim; no accounting mutation")
              def exact_winner(w):
                  e = expected[(w["tenant_id"], w["request_id"])]
                  return (w["claim_fingerprint"] == e["claim_fingerprint"] and w["aggregate_batch_id"] == e["aggregate_batch_id"] and w["billing_period"] == e["billing_period"] and w["terms_snapshot_ref"] == e["terms_snapshot_ref"] and w["terms_snapshot_digest_hex"] == e["terms_snapshot_digest_hex"] and w["evidence_ref"] == e["evidence_ref"] and w["evidence_digest_hex"] == e["evidence_digest_hex"] and w["runner_aggregated_at"] is not None)
              if any(w["claim_fingerprint"] is not None for w in winners):
                  exact = len(winners) == len(events) and all(exact_winner(w) for w in winners)
                  if exact: print(f"period={period}: Deduped durable batch; no replay."); continue
                  raise RuntimeError(f"period={period}: Conflict durable claim winner; no accounting mutation")
              batch = [{"sql": "INSERT INTO runner_aggregate_event_claim (tenant_id,request_id,aggregate_batch_id,billing_period,claim_fingerprint,terms_snapshot_ref,terms_snapshot_digest_hex,evidence_ref,evidence_digest_hex,claimed_at_ms) SELECT json_extract(value,'$.tenant_id'),json_extract(value,'$.request_id'),json_extract(value,'$.aggregate_batch_id'),json_extract(value,'$.billing_period'),json_extract(value,'$.claim_fingerprint'),t.terms_snapshot_ref,t.terms_snapshot_digest_hex,json_extract(value,'$.evidence_ref'),json_extract(value,'$.evidence_digest_hex'),CAST(json_extract(value,'$.claimed_at_ms') AS INTEGER) FROM json_each(?) JOIN usage_event_staging s ON s.tenant_id=json_extract(value,'$.tenant_id') AND s.request_id=json_extract(value,'$.request_id') JOIN runner_period_terms_snapshot t ON t.tenant_id=s.tenant_id AND t.billing_period=s.billing_period AND t.terms_snapshot_ref=json_extract(value,'$.terms_snapshot_ref') AND t.terms_snapshot_digest_hex=json_extract(value,'$.terms_snapshot_digest_hex') WHERE s.runner_aggregated_at IS NULL", "params": [payload]}, {"sql": "WITH e AS (SELECT value FROM json_each(?)) SELECT abs(CASE WHEN (SELECT count(*) FROM runner_aggregate_event_claim c JOIN e ON c.tenant_id=json_extract(e.value,'$.tenant_id') AND c.request_id=json_extract(e.value,'$.request_id') AND c.aggregate_batch_id=json_extract(e.value,'$.aggregate_batch_id') AND c.billing_period=json_extract(e.value,'$.billing_period') AND c.claim_fingerprint=json_extract(e.value,'$.claim_fingerprint') AND c.terms_snapshot_ref=json_extract(e.value,'$.terms_snapshot_ref') AND c.terms_snapshot_digest_hex=json_extract(e.value,'$.terms_snapshot_digest_hex') AND c.evidence_ref=json_extract(e.value,'$.evidence_ref') AND c.evidence_digest_hex=json_extract(e.value,'$.evidence_digest_hex') AND c.claimed_at_ms=CAST(json_extract(e.value,'$.claimed_at_ms') AS INTEGER)) = json_array_length(?) THEN 0 ELSE -9223372036854775808 END)", "params": [payload, payload]}]
              counters, heads = out.get("counters", []), out.get("chain_head_updates", [])

              for c in counters:
                  batch.append({"sql": "INSERT INTO runner_usage_counter (tenant_id,region,billing_period,vcpu_seconds,event_count,aggregated_at,prev_hash,own_digest,schema_version) VALUES (?,?,?,CAST(? AS INTEGER),CAST(? AS INTEGER),CAST(? AS INTEGER),?,?,'1.0.0') ON CONFLICT(tenant_id,region,billing_period) DO UPDATE SET vcpu_seconds=vcpu_seconds+excluded.vcpu_seconds,event_count=event_count+excluded.event_count,aggregated_at=excluded.aggregated_at,prev_hash=excluded.prev_hash,own_digest=excluded.own_digest", "params": [c["tenant_id"],c["region"],period,int(c["vcpu_seconds"]),int(c["event_count"]),now_ms,c["prev_hash_hex"],c["own_digest_hex"]]})
              for h in heads:
                  batch.append({"sql": "INSERT INTO runner_hash_chain_head (region,chain_kind,current_head,last_aggregated_period,updated_at,next_sequence) VALUES (?,'runner_vcpu',?,?,CAST(? AS INTEGER),CAST(? AS INTEGER)) ON CONFLICT(region,chain_kind) DO UPDATE SET current_head=excluded.current_head,last_aggregated_period=excluded.last_aggregated_period,updated_at=excluded.updated_at,next_sequence=excluded.next_sequence", "params": [h["region"],h["current_head_hex"],period,now_ms,int(h["next_sequence"])]})
              # json_each makes this one exact-PK watermark statement, even at
              # the 8,000-row cap; it cannot touch rows inserted after extract.
              batch.append({"sql": "UPDATE usage_event_staging SET runner_aggregated_at=CAST(? AS INTEGER) WHERE runner_aggregated_at IS NULL AND EXISTS (SELECT 1 FROM json_each(?) e WHERE tenant_id=json_extract(e.value,'$.tenant_id') AND request_id=json_extract(e.value,'$.request_id'))", "params": [now_ms,payload]})
              # This is the sole mutation request for the period. If its response
              # is ambiguous, discovery on a later run decides Deduped/Conflict;
              # this process never posts the logical batch again.
              response = requests.post(url, headers=headers, json={"batch": batch}, timeout=120)
              responses[period] = response.text
              if response.status_code != 200 or not response.json().get("success", False):
                  confirm = requests.post(url, headers=headers, json={"sql": discovery_sql, "params": [payload]}, timeout=60)
                  confirmed = [x for b in confirm.json().get("result", []) for x in b.get("results", [])] if confirm.status_code == 200 and confirm.json().get("success", False) else []
                  committed = len(confirmed) == len(events) and all(exact_winner(w) for w in confirmed)
                  if committed: print(f"period={period}: ambiguous response re-discovered committed batch; no replay."); continue
                  raise RuntimeError(f"period={period}: atomic D1 commit failed; durable discovery found no exact commit: {response.text[:500]}")
              print(f"period={period}: committed {len(events)} claims/watermarks, {len(counters)} counters, {len(heads)} heads")
          pathlib.Path("write-response.json").write_text(json.dumps(responses, sort_keys=True))
          PY

      - name: Upload aggregation artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: billing-aggregate-${{ steps.period.outputs.period }}-${{ github.run_id }}
          path: |
            aggregate-periods.json
            aggregate-runs
            pending-missing-terms.json
            write-response.json
          retention-days: 90  # SOC 2 CC7.2 / GAAP ASC 606 evidence window.
          if-no-files-found: ignore
