# CoreLink — Cloudflare Workers production deploy (WI-R2-14).
#
# Gates production deploys on:
#   1. Secrets-checklist drift verification (scripts/secrets-checklist-verify.sh).
#      Fails the deploy if the matrix is out of sync with the codebase.
#   2. CF secrets population sanity check (wrangler secret list), per env.
#   3. D1 migrations applied to the shared prod D1 BEFORE any container deploy
#      (brutal-audit H3): the container reads new tables/columns fail-closed
#      (customer_d1.rs audit/team/legal-hold reads 500 if the migration lags the
#      code). The migration step always runs first; it is idempotent
#      (additive + IF-NOT-EXISTS + ledger-guarded), so running it every deploy is
#      safe.
#
# Triggered manually (workflow_dispatch) or by an upstream release pipeline.
# This workflow is the canonical entry point for `wrangler deploy --env prod`;
# direct deploys from local machines are forbidden by policy.
#
# Fleet rollout (brutal-audit M5): all 5 live prod envs (prod + prod-{sam,lhr,
# nrt,syd}) serve traffic and MUST run the same code. A manual dispatch with NO
# `env` input deploys ALL 5 via a matrix so one dispatch converges the whole
# fleet (no undetected code skew where a fix landed on IAD only). Supplying a
# single `env` input still deploys just that one env (the prior per-env manual
# behavior is preserved). The release-pipeline trigger (no inputs) deploys all 5.

name: cf-deploy-prod

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-prod" to confirm production deploy'
        required: true
        type: string
      env:
        description: 'Which prod env to deploy. Leave BLANK to deploy ALL 5 (prod + prod-{sam,lhr,nrt,syd}) in one dispatch, or set one of: prod | prod-sam | prod-lhr | prod-nrt | prod-syd to deploy a single env.'
        required: false
        type: string
        default: ''
      skip_pin_freshness:
        description: 'RECYCLE the currently-pinned container image, bypassing the pin-freshness gate. Use ONLY to re-deploy the RUNNING bits (e.g. recycle instances to pick up a newly-forwarded secret/env, or a rollback) — deploy-container-prod.sh still deploys the pinned tag + poll-verifies the roll, so NO un-blessed code ships. NEVER set this to advance code onto prod (that path is: rebuild via container-build-push-prod.yml + repin to HEAD).'
        required: false
        type: boolean
        default: false
  workflow_run:
    workflows: ["release-cli"]
    types: [completed]

permissions:
  contents: read
  id-token: write  # for OIDC if we move CF auth to OIDC in future

jobs:
  # ---------------------------------------------------------------------------
  # Gate 1 — confirm input + secrets-checklist drift + compute the deploy matrix.
  # ---------------------------------------------------------------------------
  gate-secrets-checklist:
    name: gate — secrets checklist drift
    runs-on: corelink  # product's own ephemeral fabric (zero GitHub billing); wrangler/python/bash only, no docker
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Confirm intent (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "${CONFIRM}" != "deploy-prod" ]; then
            echo "ERROR: confirm input must be exactly 'deploy-prod'." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Run secrets-checklist drift verifier
        run: |
          chmod +x ./scripts/secrets-checklist-verify.sh
          ./scripts/secrets-checklist-verify.sh

      - name: Compute deploy matrix (all 5 envs unless one is specified)
        id: set-matrix
        env:
          # Empty for the release-pipeline (workflow_run) trigger, which has no
          # inputs → deploys the whole fleet.
          ENV_IN: ${{ github.event.inputs.env }}
        run: |
          if [ -z "${ENV_IN:-}" ]; then
            echo 'matrix={"env":["prod","prod-sam","prod-lhr","prod-nrt","prod-syd"]}' >> "$GITHUB_OUTPUT"
            echo "Deploy target: ALL 5 prod envs (no specific env given) — one dispatch converges the whole fleet."
          else
            case "$ENV_IN" in
              prod|prod-sam|prod-lhr|prod-nrt|prod-syd) ;;
              *)
                echo "::error ::Invalid env input: '${ENV_IN}' (must be one of prod | prod-sam | prod-lhr | prod-nrt | prod-syd, or blank for all 5)."
                exit 1
                ;;
            esac
            printf 'matrix={"env":["%s"]}\n' "$ENV_IN" >> "$GITHUB_OUTPUT"
            echo "Deploy target: single env ${ENV_IN}."
          fi

  # ---------------------------------------------------------------------------
  # Migrate — apply D1 migrations to the SHARED prod D1 BEFORE any deploy (H3).
  #
  # All 5 prod envs bind the SAME D1 database (corelink-config-prod,
  # d64742ea-…; see wrangler.toml [[env.*.d1_databases]]), so migrations are
  # applied exactly ONCE here — a single, non-matrix job — rather than per
  # deploy leg (5 concurrent `migrations apply` would race the d1_migrations
  # ledger). scripts/apply-d1-migrations-prod.sh targets that prod D1 directly
  # (DB_NAME=CONFIG_DB / --env prod, hardcoded; it takes only --apply) and is
  # idempotent — wrangler skips already-applied migrations. Runs before deploy
  # so code that reads a new table/column never lands ahead of its migration.
  # ---------------------------------------------------------------------------
  migrate-d1:
    name: apply D1 migrations (shared prod D1)
    needs: gate-secrets-checklist
    runs-on: corelink  # product's own ephemeral fabric (zero GitHub billing); wrangler/python/bash only, no docker
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install wrangler (pinned; version from scripts/_wrangler-pin.sh)
        run: |
          # Single source of truth for the pin — the same file the deploy
          # scripts read for their fallback, so the two cannot drift apart.
          # Pinned exact (audit 2026-06-11); v3 cannot parse [[env.*.containers]]
          # arrays (verified 2026-06-05).
          . ./scripts/_wrangler-pin.sh
          echo "installing wrangler@${WRANGLER_PINNED_VERSION}"
          npm install -g "wrangler@${WRANGLER_PINNED_VERSION}"
          wrangler --version

      - name: Apply D1 migrations (idempotent; shared prod D1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          # Use the globally-installed wrangler (no local node_modules path on the
          # ubuntu runner); the script honours the WRANGLER override.
          WRANGLER: wrangler
        run: |
          chmod +x ./scripts/apply-d1-migrations-prod.sh
          bash scripts/apply-d1-migrations-prod.sh --apply

  # ---------------------------------------------------------------------------
  # Gate 2 — verify required CF secrets are populated (per env, via the matrix).
  # ---------------------------------------------------------------------------
  gate-cf-secrets-populated:
    name: gate — CF secrets populated (${{ matrix.env }})
    needs: gate-secrets-checklist
    runs-on: corelink  # product's own ephemeral fabric (zero GitHub billing); wrangler/python/bash only, no docker
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.gate-secrets-checklist.outputs.matrix) }}
    env:
      WRANGLER_ENV: ${{ matrix.env }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install wrangler (pinned; version from scripts/_wrangler-pin.sh)
        run: |
          # Single source of truth for the pin — the same file the deploy
          # scripts read for their fallback, so the two cannot drift apart.
          # Pinned exact (audit 2026-06-11); v3 cannot parse [[env.*.containers]]
          # arrays (verified 2026-06-05).
          . ./scripts/_wrangler-pin.sh
          echo "installing wrangler@${WRANGLER_PINNED_VERSION}"
          npm install -g "wrangler@${WRANGLER_PINNED_VERSION}"
          wrangler --version

      - name: List CF Worker secrets (prod env)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          wrangler secret list --env "${WRANGLER_ENV}" > /tmp/wrangler-secrets.json
          cat /tmp/wrangler-secrets.json

      - name: Verify required prod secrets are populated
        run: |
          # Hard-required secrets for prod. If any of these are missing in
          # Cloudflare, fail before deploying — better to short-circuit than
          # to ship a Worker that 5xx's on first request.
          #
          # SLACK_WEBHOOK_URL_* are intentionally NOT gated: operational
          # alerting currently routes via PagerDuty (PAGERDUTY_ROUTING_KEY),
          # and direct Slack delivery is a not-yet-wired enhancement
          # (docs/internal/secrets-checklist.md §"not yet wired into a code
          # consumer"). corelink-slack-real degrades gracefully when a
          # channel's webhook is unset (WebhookRegistry::from_env omits it,
          # dispatch returns ChannelUnconfigured — no startup failure). Re-add
          # the SLACK_WEBHOOK_URL_* entries here if/when Slack becomes a
          # load-bearing alert path so the deploy can't ship without them.
          # CORE secrets — required on EVERY prod env (main + regionals), because
          # they gate the cache hot path that ALL envs serve. 2026-06-11 audit
          # Finding #3: forwarded into the container (durable_object.ts) and
          # degrade SILENTLY if unset — R2 keys unset → InMemory storage (DATA
          # LOSS); internal-auth / PAT-signing unset → internal/CAS routes break.
          REQUIRED=(
            CORELINK_INTERNAL_AUTH_KEY
            PAT_SIGNING_KEY
            R2_S3_ACCESS_KEY_ID
            R2_S3_SECRET_ACCESS_KEY
          )
          # Billing / auth / alerting secrets — required ONLY on the main `prod`
          # env, which is where signup, checkout, Stripe webhooks, Clerk login and
          # PagerDuty alerting run. The regional cache envs
          # (prod-{sam,lhr,nrt,syd}) serve PAT-authed CAS/AC only and never
          # exercise those paths, so requiring them there is a FALSE block
          # (verified: regionals carry only the CORE set). Env-aware so a regional
          # repin/deploy isn't gated on secrets it neither has nor needs.
          if [ "${WRANGLER_ENV}" = "prod" ]; then
            REQUIRED+=(
              STRIPE_SECRET_KEY
              STRIPE_WEBHOOK_SECRET
              STRIPE_PRICE_ID_PRO
              STRIPE_PRICE_ID_SOLO
              STRIPE_PRICE_ID_MAX
              CLERK_SECRET_KEY
              PAGERDUTY_ROUTING_KEY
            )
          fi
          MISSING=0
          for name in "${REQUIRED[@]}"; do
            if ! grep -q "\"${name}\"" /tmp/wrangler-secrets.json; then
              echo "::error ::Required ${WRANGLER_ENV} secret not populated in Cloudflare: ${name}"
              MISSING=$((MISSING+1))
            fi
          done
          if [ "${MISSING}" -gt 0 ]; then
            echo "::error ::${MISSING} required ${WRANGLER_ENV} secrets are missing. Run 'wrangler secret put <NAME> --env ${WRANGLER_ENV}' for each (see docs/internal/secrets-runbook.md §1)."
            exit 1
          fi
          echo "All required prod secrets are populated."

  # ---------------------------------------------------------------------------
  # Deploy — one matrix leg per target env. Runs only after both gates pass AND
  # the D1 migrations have been applied (migrate-d1) so the container never ships
  # ahead of its schema.
  # ---------------------------------------------------------------------------
  deploy:
    name: wrangler deploy --env ${{ matrix.env }}
    needs:
      - gate-secrets-checklist
      - gate-cf-secrets-populated
      - migrate-d1
    runs-on: corelink  # product's own ephemeral fabric (zero GitHub billing); wrangler/python/bash only, no docker
    environment: production
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.gate-secrets-checklist.outputs.matrix) }}
    env:
      WRANGLER_ENV: ${{ matrix.env }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history: the container-pin freshness gate (deploy-container-prod.sh →
          # check-container-pin-fresh.sh) diffs the pinned image SHA against HEAD, so the
          # pinned commit must be in history. depth-1 can't resolve it and the gate
          # fail-closes (as designed). The gate also self-heals via a targeted fetch, but
          # fetching the full history here is the clean, deterministic fix.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # The Worker (main = worker/src/index.ts) imports @clerk/backend +
      # @sentry/cloudflare; `wrangler deploy` esbuild-bundles it and needs
      # worker/node_modules present. On the self-hosted Mac these existed from
      # local dev; a clean ubuntu runner must install them. Repo is a pnpm
      # workspace (pnpm@10.32.1); `--filter worker...` installs the worker + its
      # deps only (not the heavy admin-ui/docs members).
      - name: Install worker deps (pnpm workspace)
        run: |
          npm install -g pnpm@10.32.1
          pnpm install --frozen-lockfile --filter worker...

      - name: Install wrangler (pinned; version from scripts/_wrangler-pin.sh)
        run: |
          # Single source of truth for the pin — the same file the deploy
          # scripts read for their fallback, so the two cannot drift apart.
          # Pinned exact (audit 2026-06-11); v3 cannot parse [[env.*.containers]]
          # arrays (verified 2026-06-05).
          . ./scripts/_wrangler-pin.sh
          echo "installing wrangler@${WRANGLER_PINNED_VERSION}"
          npm install -g "wrangler@${WRANGLER_PINNED_VERSION}"
          wrangler --version

      - name: Verify jq present (baked into the corelink box image)
        # jq is pre-baked in the corelink runner image (same as sbom-consolidated.yml).
        # No `sudo apt-get` — the ephemeral fabric box has no passwordless sudo and
        # apt egress is not configured; the tool is already on PATH.
        run: jq --version

      - name: Deploy Worker + verify container rollout (prod)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          # The container env blocks deploy via the auto-named registry image.
          # scripts/deploy-container-prod.sh runs `wrangler deploy` then POLLS the
          # CF Containers applications API until the running configuration.image
          # matches the wrangler.toml pin — re-deploying if the first deploy
          # didn't roll the running instances (a known CF Containers beta
          # behavior). Use the globally-installed wrangler (the pnpm step above
          # also drops a worker-local wrangler, but the audited pin is the global
          # one). This bare NAME was silently ignored until 2026-08-04 — the
          # script's resolver only did a path test, so every prod deploy actually
          # ran `npx wrangler@latest` (4.118.0 vs the 4.95.0 pin, runs
          # 30923390611 / 30918887614). The resolver now honours a bare name via
          # `command -v` and is FATAL on CI rather than falling back to npx.
          WRANGLER: wrangler
          # Recycle-only override: when the dispatch requested it, bypass the
          # container-pin freshness gate so the RUNNING pinned image is re-deployed
          # (deploy-container-prod.sh still poll-verifies the roll). Empty on the
          # workflow_run/release path → gate stays ON (fail-closed default).
          SKIP_PIN_FRESHNESS: ${{ github.event.inputs.skip_pin_freshness == 'true' && '1' || '' }}
        run: |
          bash scripts/deploy-container-prod.sh --apply --env "${WRANGLER_ENV}"

      - name: Emit deploy audit event
        if: success()
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          CF_DEPLOY_VERIFIER_URL: ${{ secrets.CF_DEPLOY_VERIFIER_URL }}
        run: |
          # Mirror to D1 audit_outbox via the deploy verifier service (see
          # docs/internal/secrets-runbook.md §4.2). Soft-fail (|| true) so the
          # deploy itself isn't reverted if the audit sink is briefly down.
          if [ -n "${CF_DEPLOY_VERIFIER_URL:-}" ] && [ -n "${DEPLOY_WEBHOOK_SECRET:-}" ]; then
            curl -fsS -X POST "${CF_DEPLOY_VERIFIER_URL}/audit" \
              -H "Authorization: Bearer ${DEPLOY_WEBHOOK_SECRET}" \
              -H "Content-Type: application/json" \
              -d "{\"kind\":\"deploy.prod\",\"actor\":\"${GITHUB_ACTOR}\",\"commit\":\"${GITHUB_SHA}\",\"workflow\":\"cf-deploy-prod\",\"env\":\"${WRANGLER_ENV}\"}" \
              || echo "::warning ::Audit sink unreachable; deploy proceeded but audit event not recorded."
          fi
