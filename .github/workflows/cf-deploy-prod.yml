# CoreLink — Cloudflare Workers production deploy (WI-R2-14).
#
# Gates production deploys on:
#   1. Secrets-checklist drift verification (scripts/secrets-checklist-verify.sh).
#      Fails the deploy if the matrix is out of sync with the codebase.
#   2. CF secrets population sanity check (wrangler secret list).
#
# Triggered manually (workflow_dispatch) or by an upstream release pipeline.
# This workflow is the canonical entry point for `wrangler deploy --env prod`;
# direct deploys from local machines are forbidden by policy.

name: cf-deploy-prod

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-prod" to confirm production deploy'
        required: true
        type: string
      env:
        description: 'Which prod env to deploy (prod | prod-sam | prod-lhr | prod-nrt | prod-syd). All 5 serve live traffic; dispatch once per env.'
        required: false
        type: string
        default: prod
  workflow_run:
    workflows: ["release-cli"]
    types: [completed]

permissions:
  contents: read
  id-token: write  # for OIDC if we move CF auth to OIDC in future

env:
  # Defaults to the main prod env (covers the workflow_run/release trigger which
  # has no inputs). Manual dispatch can target any of the 5 live prod envs so a
  # container repin can be rolled to all regions (prod + prod-{sam,lhr,nrt,syd}).
  WRANGLER_ENV: ${{ github.event.inputs.env || 'prod' }}

jobs:
  # ---------------------------------------------------------------------------
  # Gate 1 — confirm input + secrets-checklist drift.
  # ---------------------------------------------------------------------------
  gate-secrets-checklist:
    name: gate — secrets checklist drift
    runs-on: ubuntu-latest
    steps:
      - name: Confirm intent (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "${CONFIRM}" != "deploy-prod" ]; then
            echo "ERROR: confirm input must be exactly 'deploy-prod'." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Run secrets-checklist drift verifier
        run: |
          chmod +x ./scripts/secrets-checklist-verify.sh
          ./scripts/secrets-checklist-verify.sh

  # ---------------------------------------------------------------------------
  # Gate 2 — verify required CF secrets are populated.
  # ---------------------------------------------------------------------------
  gate-cf-secrets-populated:
    name: gate — CF secrets populated
    needs: gate-secrets-checklist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install wrangler
        run: npm install -g wrangler@4.95.0  # pinned exact (audit 2026-06-11); v3 cannot parse [[env.*.containers]] arrays (verified 2026-06-05)

      - name: List CF Worker secrets (prod env)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          wrangler secret list --env "${WRANGLER_ENV}" > /tmp/wrangler-secrets.json
          cat /tmp/wrangler-secrets.json

      - name: Verify required prod secrets are populated
        run: |
          # Hard-required secrets for prod. If any of these are missing in
          # Cloudflare, fail before deploying — better to short-circuit than
          # to ship a Worker that 5xx's on first request.
          #
          # SLACK_WEBHOOK_URL_* are intentionally NOT gated: operational
          # alerting currently routes via PagerDuty (PAGERDUTY_ROUTING_KEY),
          # and direct Slack delivery is a not-yet-wired enhancement
          # (docs/internal/secrets-checklist.md §"not yet wired into a code
          # consumer"). corelink-slack-real degrades gracefully when a
          # channel's webhook is unset (WebhookRegistry::from_env omits it,
          # dispatch returns ChannelUnconfigured — no startup failure). Re-add
          # the SLACK_WEBHOOK_URL_* entries here if/when Slack becomes a
          # load-bearing alert path so the deploy can't ship without them.
          # CORE secrets — required on EVERY prod env (main + regionals), because
          # they gate the cache hot path that ALL envs serve. 2026-06-11 audit
          # Finding #3: forwarded into the container (durable_object.ts) and
          # degrade SILENTLY if unset — R2 keys unset → InMemory storage (DATA
          # LOSS); internal-auth / PAT-signing unset → internal/CAS routes break.
          REQUIRED=(
            CORELINK_INTERNAL_AUTH_KEY
            PAT_SIGNING_KEY
            R2_S3_ACCESS_KEY_ID
            R2_S3_SECRET_ACCESS_KEY
          )
          # Billing / auth / alerting secrets — required ONLY on the main `prod`
          # env, which is where signup, checkout, Stripe webhooks, Clerk login and
          # PagerDuty alerting run. The regional cache envs
          # (prod-{sam,lhr,nrt,syd}) serve PAT-authed CAS/AC only and never
          # exercise those paths, so requiring them there is a FALSE block
          # (verified: regionals carry only the CORE set). Env-aware so a regional
          # repin/deploy isn't gated on secrets it neither has nor needs.
          if [ "${WRANGLER_ENV}" = "prod" ]; then
            REQUIRED+=(
              STRIPE_SECRET_KEY
              STRIPE_WEBHOOK_SECRET
              STRIPE_PRICE_ID_PRO
              STRIPE_PRICE_ID_SOLO
              STRIPE_PRICE_ID_MAX
              CLERK_SECRET_KEY
              PAGERDUTY_ROUTING_KEY
            )
          fi
          MISSING=0
          for name in "${REQUIRED[@]}"; do
            if ! grep -q "\"${name}\"" /tmp/wrangler-secrets.json; then
              echo "::error ::Required ${WRANGLER_ENV} secret not populated in Cloudflare: ${name}"
              MISSING=$((MISSING+1))
            fi
          done
          if [ "${MISSING}" -gt 0 ]; then
            echo "::error ::${MISSING} required ${WRANGLER_ENV} secrets are missing. Run 'wrangler secret put <NAME> --env ${WRANGLER_ENV}' for each (see docs/internal/secrets-runbook.md §1)."
            exit 1
          fi
          echo "All required prod secrets are populated."

  # ---------------------------------------------------------------------------
  # Deploy — only runs after both gates pass.
  # ---------------------------------------------------------------------------
  deploy:
    name: wrangler deploy --env prod
    needs:
      - gate-secrets-checklist
      - gate-cf-secrets-populated
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      # The Worker (main = worker/src/index.ts) imports @clerk/backend +
      # @sentry/cloudflare; `wrangler deploy` esbuild-bundles it and needs
      # worker/node_modules present. On the self-hosted Mac these existed from
      # local dev; a clean ubuntu runner must install them. Repo is a pnpm
      # workspace (pnpm@10.32.1); `--filter worker...` installs the worker + its
      # deps only (not the heavy admin-ui/docs members).
      - name: Install worker deps (pnpm workspace)
        run: |
          npm install -g pnpm@10.32.1
          pnpm install --frozen-lockfile --filter worker...

      - name: Install wrangler
        run: npm install -g wrangler@4.95.0  # pinned exact (audit 2026-06-11); v3 cannot parse [[env.*.containers]] arrays (verified 2026-06-05)

      - name: Install jq (CF rollout-verify parser)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq

      - name: Deploy Worker + verify container rollout (prod)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          # The container env blocks deploy via the auto-named registry image.
          # scripts/deploy-container-prod.sh runs `wrangler deploy` then POLLS the
          # CF Containers applications API until the running configuration.image
          # matches the wrangler.toml pin — re-deploying if the first deploy
          # didn't roll the running instances (a known CF Containers beta
          # behavior). Use the globally-installed wrangler (no local node_modules
          # path on the ubuntu runner).
          WRANGLER: wrangler
        run: |
          bash scripts/deploy-container-prod.sh --apply --env "${WRANGLER_ENV}"

      - name: Emit deploy audit event
        if: success()
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          CF_DEPLOY_VERIFIER_URL: ${{ secrets.CF_DEPLOY_VERIFIER_URL }}
        run: |
          # Mirror to D1 audit_outbox via the deploy verifier service (see
          # docs/internal/secrets-runbook.md §4.2). Soft-fail (|| true) so the
          # deploy itself isn't reverted if the audit sink is briefly down.
          if [ -n "${CF_DEPLOY_VERIFIER_URL:-}" ] && [ -n "${DEPLOY_WEBHOOK_SECRET:-}" ]; then
            curl -fsS -X POST "${CF_DEPLOY_VERIFIER_URL}/audit" \
              -H "Authorization: Bearer ${DEPLOY_WEBHOOK_SECRET}" \
              -H "Content-Type: application/json" \
              -d "{\"kind\":\"deploy.prod\",\"actor\":\"${GITHUB_ACTOR}\",\"commit\":\"${GITHUB_SHA}\",\"workflow\":\"cf-deploy-prod\"}" \
              || echo "::warning ::Audit sink unreachable; deploy proceeded but audit event not recorded."
          fi
