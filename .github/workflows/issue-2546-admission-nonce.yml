name: issue-2546-admission-nonce

on:
  pull_request:
    paths:
      - 'crates/corelink-container/src/storage.rs'
      - 'crates/corelink-container/src/storage/staging_load_test_admission.rs'
      - 'migrations/d1/0148_staging_load_test_admission_nonce.sql'
      - 'scripts/check_issue_2546_clippy.py'
      - 'scripts/check_migration_prefixes.py'
      - 'scripts/check_migrations_additive.py'
      - 'scripts/verify_issue_2546_admission_nonce.py'
      - 'tests/test_issue_2546_staging_admission_nonce.py'
      - '.github/workflows/issue-2546-admission-nonce.yml'

permissions:
  contents: read

concurrency:
  group: issue-2546-admission-nonce-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  admission-nonce:
    name: Exact-head #2546 admission nonce pack
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout authored head without write credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert checkout is the exact authored head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable toolchain action
        with:
          toolchain: 1.91.1

      - name: Rust dependency cache
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        with:
          workspaces: '.'
          shared-key: issue-2546-admission-nonce

      - name: Run migration prefix and additive checks
        run: |
          python3 scripts/check_migration_prefixes.py
          python3 scripts/check_migrations_additive.py

      - name: Verify codec contract and indexing negative fixture
        run: python3 -I scripts/verify_issue_2546_admission_nonce.py

      - name: Run migration SQLite adversarial tests
        run: python3 -I tests/test_issue_2546_staging_admission_nonce.py

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check corelink-container library
        run: cargo check -p corelink-container --lib

      - name: Run focused admission Rust tests
        run: cargo test -p corelink-container --lib staging_load_test_admission -- --nocapture

      - name: Run candidate clippy and scope diagnostics to this module
        shell: bash
        run: |
          set +e
          cargo clippy -p corelink-container --lib --message-format=json > "$RUNNER_TEMP/issue-2546-clippy.jsonl" 2> "$RUNNER_TEMP/issue-2546-clippy.stderr"
          clippy_status=$?
          set -e
          python3 -I scripts/check_issue_2546_clippy.py "$RUNNER_TEMP/issue-2546-clippy.jsonl"
          echo "cargo clippy exit code: $clippy_status (non-candidate baseline diagnostics are informational)"
          cat "$RUNNER_TEMP/issue-2546-clippy.stderr"
