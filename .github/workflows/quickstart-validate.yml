name: quickstart-validate

# Cross-checks the 10-minute quickstart MDX against the actual
# corelink-cli subcommand surface so the single most-clicked post-launch
# doc never drifts from reality.
#
# Implements: R-prep launch checklist (R-8 GA wave) — quickstart canonicality.
# Failure mode: surfaces drift as a CI annotation; does NOT block merges
# (continue-on-error: docs drift is fixable post-merge and we'd rather
# ship than block on a typo).
#
# SHA-pinned actions per ADR-S12-045 §6 tooling-pin policy.

on:
  pull_request:
    paths:
      - "apps/docs/docs/tutorials/quickstart-10min.mdx"
      - "apps/docs/scripts/validate-quickstart.sh"
      - "tools/cli/src/main.rs"
      - ".github/workflows/quickstart-validate.yml"
  push:
    branches: [main]
    paths:
      - "apps/docs/docs/tutorials/quickstart-10min.mdx"
      - "apps/docs/scripts/validate-quickstart.sh"
      - "tools/cli/src/main.rs"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-quickstart:
    name: validate quickstart MDX vs CLI surface
    # Runner: self-hosted mac fleet (CI cost diet 2026-08-01).
    # A single portable bash validator (soft-fail / continue-on-error).
    # Hosted minutes bill with a 1-MINUTE-PER-JOB FLOOR, so this sub-minute
    # check costs a full paid minute every run; on the fleet it costs $0.
    # Verified running natively on the fleet host (macOS/BSD userland).
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 5
    # Soft-fail: surface as a warning annotation, do not block merges.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Run validator
        shell: bash
        run: |
          bash apps/docs/scripts/validate-quickstart.sh
