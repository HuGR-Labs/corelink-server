name: BYOK Kill Switch Chaos Drill (Weekly)

concurrency:
  # Escopo por ref. Grupo CONSTANTE torna o grupo repo-global: duas execucoes
  # `workflow_dispatch` deste mesmo workflow em branches DIFERENTES cancelam uma
  # a outra. Foi o que matou tres dispatches em 2026-08-31.
  group: "ci-byok-kill-switch-chaos-drill-weekly-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

on:
  # DISPATCH-ONLY as of 2026-08-31 (B-084).
  #
  # The `schedule: cron "0 3 * * 0"` that used to fire every Sunday is removed.
  # Two reasons, both measured:
  #
  # 1. Every phase of `scripts/byok_kill_switch_drill.sh` is still a stub, so
  #    the harness now REFUSES to emit an attestation and exits non-zero. On a
  #    weekly cron that is a chronic red nobody can act on, and a chronic red
  #    trains everyone to ignore the signal — the same lesson B-058 recorded
  #    for the OKF robot.
  # 2. This repo's own rule (CLAUDE.md): a cron earns its keep only when
  #    something can change WITHOUT a commit. The drill's outcome is decided
  #    entirely by constants in the script, so it cannot change until someone
  #    commits the real provider calls. It belongs on a PR/dispatch trigger.
  #
  # Run it on demand while implementing a phase; the lane is one click away.
  #
  # WORTH KNOWING BEFORE RE-ARMING THIS: the "Commit drill report" step below
  # commits but never PUSHES, so no report this lane produced has ever reached
  # the repo. That is why 12 consecutive `success` runs (2026-06-07..2026-08-30)
  # left `specs/_audits/` empty — the only drill report in the tree,
  # `sealed/2026-05-14-byok-kill-switch-drill-aws.md`, was committed by hand.
  # Fixing the push without first implementing the phases would start the false
  # attestations actually landing.
  workflow_dispatch:
    inputs:
      provider:
        description: "KMS provider to drill (aws|gcp|azure|vault; default: weekly rotation)"
        required: false
        default: ""

permissions:
  contents: write  # to commit drill report

jobs:
  kill-switch-drill:
    name: BYOK Kill Switch Drill
    runs-on: corelink
    timeout-minutes: 20  # SLA ≤ 6 min + overhead

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # actions/checkout@v7.0.0

      - name: Determine provider (weekly rotation)
        id: provider
        run: |
          if [[ -n "${{ github.event.inputs.provider }}" ]]; then
            echo "provider=${{ github.event.inputs.provider }}" >> "$GITHUB_OUTPUT"
          else
            # Rotation: week of year mod 4 → provider index.
            WEEK=$(date -u +%V)
            IDX=$(( (10#${WEEK}) % 4 ))
            PROVIDERS=(aws gcp azure vault)
            echo "provider=${PROVIDERS[$IDX]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run kill switch chaos drill
        id: drill
        env:
          PROVIDER: ${{ steps.provider.outputs.provider }}
          # Production: inject staging KMS credentials here.
          # AWS_ACCESS_KEY_ID: ${{ secrets.STAGING_AWS_KEY_ID }}
          # GCP_SERVICE_ACCOUNT: ${{ secrets.STAGING_GCP_SA }}
          # AZURE_CLIENT_ID: ${{ secrets.STAGING_AZURE_CLIENT_ID }}
          # VAULT_TOKEN: ${{ secrets.STAGING_VAULT_TOKEN }}
        run: |
          bash scripts/byok_kill_switch_drill.sh "${PROVIDER}"

      - name: Commit drill report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE="$(date -u +%Y-%m-%d)"
          PROVIDER="${{ steps.provider.outputs.provider }}"
          REPORT="specs/_audits/${DATE}-byok-kill-switch-drill-${PROVIDER}.md"
          if [[ -f "${REPORT}" ]]; then
            git add "${REPORT}"
            git diff --cached --quiet || git commit -m \
              "chore(chaos-drill): BYOK kill switch drill ${PROVIDER} ${DATE}"
          fi

      - name: Fail on SLA miss
        if: failure()
        run: |
          echo "::error::BYOK kill switch SLA MISS — SEV-1 alert required"
          exit 1
