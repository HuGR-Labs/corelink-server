name: BYOK Kill Switch Chaos Drill (Weekly)

on:
  schedule:
    # Every Sunday at 03:00 UTC (per-provider rotation: 4 providers / 4 weeks).
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      provider:
        description: "KMS provider to drill (aws|gcp|azure|vault; default: weekly rotation)"
        required: false
        default: ""

permissions:
  contents: write  # to commit drill report

jobs:
  kill-switch-drill:
    name: BYOK Kill Switch Drill
    # Moved off the GitHub-hosted runner: this repo is PRIVATE, so every hosted
    # minute is billed, and on 2026-08-02 the org's Actions quota ran out —
    # hosted jobs now fail in ~10 s with "The job was not started because
    # recent account payments have failed or your spending limit needs to be
    # increased". Self-hosted jobs bill zero and are unaffected.
    # The box was inventoried before any of this moved (probe run 30724931256);
    # nothing this job runs is missing from it. No step is changed — on a
    # self-hosted runner the saving is total however many steps run.
    # Revert = this one line back to the hosted label.
    runs-on: corelink
    timeout-minutes: 20  # SLA ≤ 6 min + overhead

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # actions/checkout@v7.0.0

      - name: Determine provider (weekly rotation)
        id: provider
        run: |
          if [[ -n "${{ github.event.inputs.provider }}" ]]; then
            echo "provider=${{ github.event.inputs.provider }}" >> "$GITHUB_OUTPUT"
          else
            # Rotation: week of year mod 4 → provider index.
            WEEK=$(date -u +%V)
            IDX=$(( (10#${WEEK}) % 4 ))
            PROVIDERS=(aws gcp azure vault)
            echo "provider=${PROVIDERS[$IDX]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run kill switch chaos drill
        id: drill
        env:
          PROVIDER: ${{ steps.provider.outputs.provider }}
          # Production: inject staging KMS credentials here.
          # AWS_ACCESS_KEY_ID: ${{ secrets.STAGING_AWS_KEY_ID }}
          # GCP_SERVICE_ACCOUNT: ${{ secrets.STAGING_GCP_SA }}
          # AZURE_CLIENT_ID: ${{ secrets.STAGING_AZURE_CLIENT_ID }}
          # VAULT_TOKEN: ${{ secrets.STAGING_VAULT_TOKEN }}
        run: |
          bash scripts/byok_kill_switch_drill.sh "${PROVIDER}"

      - name: Commit drill report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE="$(date -u +%Y-%m-%d)"
          PROVIDER="${{ steps.provider.outputs.provider }}"
          REPORT="specs/_audits/${DATE}-byok-kill-switch-drill-${PROVIDER}.md"
          if [[ -f "${REPORT}" ]]; then
            git add "${REPORT}"
            git diff --cached --quiet || git commit -m \
              "chore(chaos-drill): BYOK kill switch drill ${PROVIDER} ${DATE}"
          fi

      - name: Fail on SLA miss
        if: failure()
        run: |
          echo "::error::BYOK kill switch SLA MISS — SEV-1 alert required"
          exit 1
