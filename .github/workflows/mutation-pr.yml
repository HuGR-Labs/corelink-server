name: mutation-pr (per-diff cargo-mutants — fast PR gate)

# Lightweight per-PR replacement for the workspace mutation sweep.
#
# WHY: the old `mutation-nightly` ran cargo-mutants across 11 whole crates
# EVERY night — thousands of mutants, each requiring a full build + full test
# run → 6-8h that pinned the prior shared self-hosted Mac and re-sabotaged code
# nobody had touched in weeks. (See the brutal-audit infra notes.)
#
# WHAT THIS DOES INSTEAD: mutates ONLY the lines this PR changed
# (`cargo mutants --in-diff`). A PR touching ~20 Rust lines spawns ~5-10
# mutants (minutes), not thousands. A PR with no Rust source changes produces
# zero mutants and passes instantly. Same protection where bugs actually live —
# the NEW code — without re-auditing months-stale code every night.
#
# This compile-and-test gate runs on an isolated GitHub-hosted Ubuntu runner.
#
# The full-crate kill-rate BASELINE regression gate still lives in
# `mutation-nightly.yml` (on-demand). This per-PR check is
# the fast first line: it fails if a mutant on a CHANGED line survives the
# tests (a test blind spot in the new code).

on:
  pull_request:
    # Only spawn the job when Rust code/manifests change — a docs/TS/config PR
    # has nothing to mutate, so it shouldn't even pay the setup cost. (The
    # in-job "no .rs in diff" guard is kept as a belt-and-suspenders for
    # Cargo.toml-only changes.)
    paths:
      - '**.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

# Only the latest commit of a PR needs checking; cancel superseded runs so a
# rapid push sequence never stacks mutation runs on the shared Mac.
concurrency:
  group: mutation-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  mutants-diff:
    name: cargo-mutants (changed lines only)
    runs-on: ubuntu-24.04
    # Bound the job (CI cost diet 2026-08-01): it had NO timeout, so the GitHub
    # default of 360 min applied — a wedged cargo-mutants run could burn 6h of
    # paid minutes. `--in-diff` runs are minutes; 20 is generous headroom.
    timeout-minutes: 20
    # Pass the PR base branch via env (not interpolated into run: shell) —
    # template-injection-safe (a branch name can carry shell metacharacters).
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - name: Checkout (full history — needed for the base diff)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install workspace-pinned Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-04-29
        with:
          toolchain: 1.91.1

      - name: Use the workspace-pinned toolchain
        env:
          HOST_TRIPLE: x86_64-unknown-linux-gnu
        run: bash scripts/ci-use-host-toolchain.sh

      - name: Cargo cache
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          workspaces: ". -> target"
          key: mutants-pr

      # Prebuilt binaries via taiki-e (SHA-pinned) — avoids the from-source
      # `cargo install` compile race (os error 2 / aws-lc-sys) that flakes on
      # the shared runner, and is faster than compiling from source.
      - name: Install cargo-mutants (prebuilt)
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-mutants@25.0.1
      - name: Install cargo-nextest (prebuilt)
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-nextest

      - name: Compute the PR diff (changed lines only)
        run: |
          set -euo pipefail
          base="origin/$BASE_REF"
          # NOT `--depth=1`. The checkout above deliberately asks for
          # `fetch-depth: 0` because the three-dot diff below needs a merge
          # base — and a `--depth=1` fetch afterwards CONVERTS THE REPO BACK TO
          # SHALLOW, throwing away the history that was just fetched for this
          # exact purpose. The result is `fatal: origin/main...HEAD: no merge
          # base` and exit 128, which surfaces as a red `cargo-mutants` check
          # that has nothing to do with mutants or with the PR's code. It bites
          # whenever the branch was rebased or the base moved far enough that
          # one commit cannot reach the merge base — i.e. exactly on the busy
          # days, and never on a quiet one.
          git fetch --no-tags origin "$BASE_REF" || true
          # Fail loudly rather than diffing against nothing: an empty `pr.diff`
          # would make `--in-diff` mutate zero lines and the lane would report
          # SUCCESS while having tested nothing.
          if ! git merge-base "$base" HEAD >/dev/null 2>&1; then
            echo "::error::no merge base between $base and HEAD — the diff would be" \
                 "meaningless and an empty diff would pass this lane vacuously."
            exit 1
          fi
          # Three-dot: changes introduced by this PR relative to the merge-base.
          git diff "$base"...HEAD > pr.diff
          echo "diff lines: $(wc -l < pr.diff)"

      - name: Run cargo-mutants on changed lines
        run: |
          set -euo pipefail
          # Skip cleanly if the PR touches no Rust source — zero mutants.
          if ! grep -qE '^\+\+\+ b/.*\.rs$' pr.diff; then
            echo "No Rust source changes in this PR — 0 mutants, passing."
            exit 0
          fi
          # `--in-diff` restricts mutants to the changed lines.
          # `--test-tool nextest` runs the suite in parallel (faster).
          # Timeout is auto-derived from the baseline test time (robust against
          # false timeouts on slower crates); a hung mutant still dies.
          # We pass `--output .` (cargo-mutants writes results to ./mutants.out/)
          # and `|| true` because the pass/fail gate is computed below from
          # missed.txt — so we can print the surviving mutants explicitly.
          cargo mutants \
            --in-diff pr.diff \
            --test-tool nextest \
            --no-shuffle \
            --output . \
            -j 2 \
            || true

      - name: Gate — fail if any CHANGED-line mutant survived
        run: |
          set -euo pipefail
          out="mutants.out"
          if [ ! -d "$out" ]; then
            echo "No mutants.out produced (no Rust mutants for this diff) — pass."
            exit 0
          fi
          missed="$out/missed.txt"
          timed_out="$out/timeout.txt"
          if [ -s "$missed" ]; then
            echo "::error::Surviving mutants on lines THIS PR changed — the new code has a test blind spot. Add a test that fails when the mutated line is sabotaged:"
            sed 's/^/  SURVIVED: /' "$missed"
            exit 1
          fi
          if [ -s "$timed_out" ]; then
            echo "::warning::Some changed-line mutants TIMED OUT (inconclusive, not a hard fail):"
            sed 's/^/  TIMEOUT: /' "$timed_out"
          fi
          echo "✅ All changed-line mutants were caught (or none were generated)."
          if [ -f "$out/caught.txt" ]; then
            sed 's/^/  caught: /' "$out/caught.txt"
          fi
