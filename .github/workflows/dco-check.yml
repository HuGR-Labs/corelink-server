name: dco-check

# DCO (Developer Certificate of Origin) sign-off enforcement.
# Every commit in a PR must carry a `Signed-off-by: Name <email>` trailer
# matching the commit author. See CONTRIBUTING.md for the rationale.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

# Cancel a superseded run when the PR is pushed again (don't waste runner minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    # Runner: self-hosted mac fleet (CI cost diet 2026-08-01). The old
    # "Blacksmith not provisioning" reason is stale, and this job is a pure
    # git/bash trailer walk over the PR commit range — no toolchain, no
    # network. It runs on EVERY PR (673 runs in June 2026), and hosted
    # minutes bill with a 1-MINUTE-PER-JOB FLOOR, so a ~15s check costs a
    # full paid minute each time; on the fleet it costs $0. Verified
    # natively on the fleet host (git 2.51 supports %(trailers:...), bash
    # 5.3 supports the process substitution below).
    runs-on: [self-hosted, mac, corelink-builder]
    # Bound the job (CI cost diet 2026-08-01): a self-hosted job with no
    # timeout inherits GitHub's 360-min default, so one wedged run can hold
    # 1 of the 4 `corelink-builder` runners for 6h and stall
    # `scripts/pre-merge-gate-check.sh` (the mandatory merge gate) for every
    # other PR. This check is sub-minute.
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify every commit has Signed-off-by trailer
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          fail=0
          while IFS= read -r sha; do
            author=$(git show -s --format='%an <%ae>' "$sha")
            signoff=$(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha")

            if [ -z "$signoff" ]; then
              echo "::error::commit $sha by $author is missing Signed-off-by trailer."
              echo "::error::Sign with: git commit -s -m 'your message'"
              fail=1
              continue
            fi

            # Ensure at least one signoff matches the author email.
            if ! echo "$signoff" | grep -q "<$(git show -s --format='%ae' "$sha")>"; then
              echo "::warning::commit $sha signoff ($signoff) does not match author email ($author)."
            fi
          done < <(git rev-list "$BASE_SHA".."$HEAD_SHA")

          if [ "$fail" = "1" ]; then
            echo ""
            echo "DCO check FAILED. Every commit must carry 'Signed-off-by: Your Name <you@example.com>'."
            echo "See CONTRIBUTING.md §DCO for amendment instructions."
            exit 1
          fi

          echo "DCO check passed for all commits in this PR."
