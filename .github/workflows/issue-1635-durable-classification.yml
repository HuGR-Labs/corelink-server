name: issue-1635 durable staging classification

on:
  pull_request:
    paths:
      - crates/corelink-container/src/routes/billing_ingest.rs
      - crates/corelink-container/src/routes/billing_ingest/tests_durable_classification.rs
      - migrations/d1/0017_usage_event_idem.sql
      - migrations/d1/0095_usage_event_staging_aggregatable.sql
      - migrations/d1/0134_usage_event_staging_conflicts.sql
      - .github/workflows/issue-1635-durable-classification.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  durable-classification:
    name: real-adapter durable classification regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout without write credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable toolchain action
        with:
          toolchain: 1.91.1

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0

      - name: Cache Cargo
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: '. -> target'
          shared-key: i1635-durable-classification

      - name: Run the real-adapter durable classification matrix
        run: |
          set -euo pipefail
          cargo test --locked -p corelink-server --lib \
            routes::billing_ingest::tests_durable_classification::durable_classification_matrix \
            -- --exact --nocapture
