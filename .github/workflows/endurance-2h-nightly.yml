name: endurance-2h (operator dispatch, R-prep)

# Runner: `corelink` — the Cloudflare container fabric (Ubuntu 24.04, apt +
# sudo available, which is what the k6 apt install below needs).
#
# 2026-08-25 (B-037): both jobs were pinned to `[self-hosted, Linux, X64]`, a
# label NO runner in the fleet carries, so neither could ever be scheduled — and
# a workflow that cannot be scheduled is indistinguishable, in every view that
# matters, from one that passes. The header claimed the cause was "no Linux
# runner exists on the fleet". That stopped being true when the container fabric
# landed: `corelink` IS Linux, and `buck2-starter-ci` / `sign-windows` had
# already moved to it for exactly this reason. The claim outlived the fact.
#
# STILL dispatch-only. Re-arming the nightly cron is a SPEND decision, not a
# wiring one: this is a 2-hour job and the container fabric is metered. The
# cadence rule would justify a cron (staging drift changes without a commit),
# but that is the owner's money and it is not mine to start spending silently.
#
# R-prep endurance load — 2-hour variant of the 24h endurance drill.
#
# The full 24h exercise (manual; see specs/_runbooks/RB-ENDURANCE-24H-DRILL)
# is too long for CI. An operator can dispatch the 2-hour variant so that
# slow-drift symptoms (memory growth, p99 climb, log volume escalation) are
# surfaced within a single business-day window before the 24h drill.
#
# Non-blocking on PR merges — this is an operator-dispatched workflow. A
# dispatched run fails when the 7-day rolling p99 baseline drifts > 20% on any
# SLO (cas_read, cas_write, audit_query, byok_op, admin_op, webhook).
#
# SHA-pinned per ADR-S12-045 §6 tooling-pin policy.

on:
  # schedule deliberately absent — see the header. The runner-label defect that
  # originally forced this is fixed; what remains is the cost decision. To
  # re-arm, add:
  #   schedule:
  #     # 03:00 UTC daily — well after the 02:00 UTC weekly load-test-nightly
  #     # so they don't contend for staging.
  #     - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: 'k6 DURATION (default 2h; smoke test uses 30s)'
        required: false
        default: '2h'

permissions:
  contents: read
  id-token: none
  actions: read

concurrency:
  group: endurance-2h-operator
  cancel-in-progress: false

jobs:
  endurance-2h:
    name: k6 endurance 2h (staging)
    runs-on: corelink
    environment: staging
    # Budget: 2h script + 5min ramp-up + 5min ramp-down + ~10min for k6
    # boot / artifact upload / baseline compare = 140 minutes ceiling.
    timeout-minutes: 145
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: install k6
        run: |
          set -euo pipefail
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
          k6 version

      - name: validate script syntax
        run: |
          set -euo pipefail
          k6 inspect \
            -e DURATION=30s \
            -e K6_AUTH_BEARER=ci-stub \
            -e K6_TARGET_HOST=https://staging.corelink.humangr.com \
            tests/load/k6/scenarios/endurance-24h.js

      - name: pre-flight target host check
        env:
          K6_TARGET_HOST: ${{ secrets.K6_TARGET_HOST }}
        run: |
          set -euo pipefail
          if [[ -z "${K6_TARGET_HOST:-}" ]]; then
            echo "::error::K6_TARGET_HOST secret missing in staging environment"
            exit 1
          fi
          if [[ "$K6_TARGET_HOST" != *"staging."* && "$K6_TARGET_HOST" != *"dev."* ]]; then
            echo "::error::K6_TARGET_HOST=$K6_TARGET_HOST is not a staging hostname"
            exit 1
          fi
          echo "Target: $K6_TARGET_HOST"

      - name: prepare results dir
        run: |
          set -euo pipefail
          mkdir -p tests/load/results/endurance-2h

      - name: run k6 endurance 2h
        env:
          K6_TARGET_HOST:             ${{ secrets.K6_TARGET_HOST }}
          K6_AUTH_BEARER:             ${{ secrets.K6_STAGING_PAT }}
          K6_PROMETHEUS_RW_SERVER_URL: ${{ secrets.K6_PROMETHEUS_RW_SERVER_URL }}
          DURATION:                   ${{ github.event.inputs.duration || '2h' }}
          K6_ENDURANCE_CONFIRM:       'yes'
        run: |
          set -euo pipefail
          DATE_TAG=$(date -u +%Y-%m-%d)
          echo "RESULTS_DATE=${DATE_TAG}" >> "$GITHUB_ENV"
          # `--out json` for the local artifact + experimental prom-rw if
          # the Prometheus remote-write endpoint is configured. The
          # prom-rw output is optional — k6 ignores it if the env var is
          # empty (we test via a guard).
          OUTPUTS=( "--out" "json=tests/load/results/endurance-2h/endurance-2h-results-${DATE_TAG}.json" )
          if [[ -n "${K6_PROMETHEUS_RW_SERVER_URL:-}" ]]; then
            OUTPUTS+=( "--out" "experimental-prometheus-rw" )
          fi
          k6 run \
            "${OUTPUTS[@]}" \
            --summary-export "tests/load/results/endurance-2h/endurance-2h-summary-${DATE_TAG}.json" \
            tests/load/k6/scenarios/endurance-24h.js

      - name: upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: endurance-2h-results-${{ env.RESULTS_DATE }}
          path: tests/load/results/endurance-2h/
          retention-days: 30
          if-no-files-found: error

  baseline-drift-check:
    name: 7-day rolling p99 drift (≤ +20% per SLO)
    runs-on: corelink
    needs: endurance-2h
    if: always()
    permissions:
      contents: read
      actions: read
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: download current run artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: endurance-2h-results-*
          path: tests/load/results/endurance-2h-download
          merge-multiple: true

      - name: list past 7 runs from workflow history
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Fetch the last 7 successful operator-dispatched runs. History and
          # the rolling baseline are inputs
          # to a gate: absent or malformed data must fail closed.
          mkdir -p tests/load/results/endurance-2h-baseline
          # Use the GitHub REST API via gh CLI to enumerate prior runs.
          # Pinned action elsewhere; gh is preinstalled on ubuntu-22.04.
          timeout 30s gh run list \
            --workflow=endurance-2h-nightly.yml \
            --branch=main \
            --status=success \
            --json databaseId,createdAt \
            --limit 7 \
            > tests/load/results/endurance-2h-baseline/runs.json
          cat tests/load/results/endurance-2h-baseline/runs.json
          echo "history_path=tests/load/results/endurance-2h-baseline/runs.json" >> "$GITHUB_OUTPUT"

      - name: compare current p99 vs 7-day rolling baseline
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, math, pathlib, sys

          REGRESSION_THRESHOLD = 1.20  # 20% over baseline → FAIL

          # SLO keys we track (per endurance scenario op tags).
          OPS = ["cas_read", "cas_write", "audit_query", "byok_op", "admin_op", "webhook"]

          curr_dir = pathlib.Path("tests/load/results/endurance-2h-download")
          summaries = sorted(curr_dir.rglob("endurance-2h-summary-*.json"))
          if len(summaries) != 1:
              print(f"::error::expected exactly one current endurance summary, found {len(summaries)}")
              sys.exit(1)
          try:
              curr = json.loads(summaries[0].read_text())
          except (OSError, ValueError) as exc:
              print(f"::error::current endurance summary is malformed: {exc}")
              sys.exit(1)
          curr_metrics = curr.get("metrics") if isinstance(curr, dict) else None
          if not isinstance(curr_metrics, dict):
              print("::error::current endurance summary has no metrics object")
              sys.exit(1)

          def extract_p99(metrics, op):
              # k6 tag-filtered submetrics surface as e.g.
              # "endurance_op_latency_ms{op:cas_read}" in the summary export.
              key = f"endurance_op_latency_ms{{op:{op}}}"
              m = metrics.get(key)
              if not isinstance(m, dict):
                  return None
              value = m.get("p(99)", m.get("p99"))
              if isinstance(value, bool) or not isinstance(value, (int, float)):
                  return None
              return float(value) if math.isfinite(float(value)) and value > 0 else None

          # Baseline = mean of last 7 successful runs' p99 per op.
          baseline_file = pathlib.Path("tests/load/results/endurance-2h-baseline/rolling-7d-p99.json")
          if not baseline_file.exists():
              print("::error::rolling-7d p99 baseline is missing; cannot prove endurance health")
              sys.exit(1)
          try:
              baseline = json.loads(baseline_file.read_text())
          except (OSError, ValueError) as exc:
              print(f"::error::rolling-7d p99 baseline is malformed: {exc}")
              sys.exit(1)
          if not isinstance(baseline, dict):
              print("::error::rolling-7d p99 baseline must be an object")
              sys.exit(1)
          missing = [op for op in OPS if op not in baseline]
          if missing:
              print(f"::error::rolling-7d p99 baseline is partial; missing: {', '.join(missing)}")
              sys.exit(1)
          failed = []
          for op in OPS:
              curr_p99 = extract_p99(curr_metrics, op)
              base_p99 = baseline.get(op)
              if curr_p99 is None:
                  print(f"::error::current p99 is missing or invalid for op={op}")
                  sys.exit(1)
              if isinstance(base_p99, bool) or not isinstance(base_p99, (int, float)) or not math.isfinite(float(base_p99)) or base_p99 <= 0:
                  print(f"::error::baseline p99 is missing or invalid for op={op}: {base_p99!r}")
                  sys.exit(1)
              base_p99 = float(base_p99)
              ratio = curr_p99 / base_p99
              status = "OK" if ratio <= REGRESSION_THRESHOLD else "FAIL"
              print(f"op={op} curr_p99={curr_p99:.2f}ms baseline_p99={base_p99:.2f}ms ratio={ratio:.3f} -> {status}")
              if ratio > REGRESSION_THRESHOLD:
                  failed.append((op, ratio, curr_p99, base_p99))

          if failed:
              for op, ratio, curr_p99, base_p99 in failed:
                  print(f"::error::p99 drift >20% on op={op}: curr={curr_p99:.2f}ms vs 7d_baseline={base_p99:.2f}ms ({ratio:.2%})")
              sys.exit(1)

          print("baseline drift check: PASS")
          PY
