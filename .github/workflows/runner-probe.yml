name: runner probe — what is actually on a corelink box

# Inventory of the `runs-on: corelink` image. This exists because migrating a
# gate off a GitHub-hosted runner is only safe once you know what the
# destination image ACTUALLY ships: an ephemeral box carries no cache between
# runs, so every tool the image lacks becomes a `setup-*` step paid on EVERY
# run, in wall-clock and in network.
#
# Run it (`workflow_dispatch`) before planning a migration wave; the log is the
# evidence. It asserts nothing on purpose — a probe that fails on a missing
# tool would hide the rest of the inventory, which is the part with value.

on:
  workflow_dispatch:
    inputs:
      fanout:
        description: >-
          How many SIMULTANEOUS corelink boxes to ask for, to MEASURE the
          fabric's concurrency ceiling. 0 (default) skips the fan-out job
          entirely. Set it ABOVE the ceiling (the tenant cap and the global
          FLEET_MAX_CONCURRENCY are both 20 today) to observe what the fabric
          does when the wave exceeds capacity — queue or refuse.
          ⚠️ The fleet cap is GLOBAL, not per-repo: saturating it stalls every
          other repo's corelink jobs for the duration. Keep the jobs short.
        required: false
        default: '0'

permissions:
  contents: read

jobs:
  probe:
    name: inventory the corelink image
    runs-on: corelink
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: hardware, kernel, disk
        run: |
          set -uo pipefail
          echo "== identity =="
          uname -a
          echo "  runner_name : ${RUNNER_NAME:-?}"
          echo "  arch        : ${RUNNER_ARCH:-?}  os: ${RUNNER_OS:-?}"
          echo "  user        : $(id -un) (uid $(id -u))  home=$HOME"
          echo
          echo "== cpu =="
          echo "  nproc: $(nproc)"
          grep -m1 'model name' /proc/cpuinfo || true
          echo
          echo "== memory =="
          grep -E '^(MemTotal|MemAvailable|SwapTotal)' /proc/meminfo || true
          echo
          echo "== disk =="
          df -h
          echo
          echo "== os release =="
          cat /etc/os-release 2>/dev/null || echo "  (no /etc/os-release)"

      - name: toolchain inventory
        run: |
          set -uo pipefail
          # Never `set -e` here: a missing tool is a RESULT, not a failure.
          probe() {
            if command -v "$1" >/dev/null 2>&1; then
              printf '  %-12s PRESENT  %s\n' "$1" "$("${@:2}" 2>&1 | head -1)"
            else
              printf '  %-12s ABSENT\n' "$1"
            fi
          }
          echo "== rust =="
          probe rustc  rustc --version
          probe cargo  cargo --version
          probe rustup rustup --version
          probe clippy-driver clippy-driver --version
          probe rustfmt rustfmt --version
          echo "  cargo fmt  : $( cargo fmt --version >/dev/null 2>&1 && echo WORKS || echo BROKEN )"
          echo "  ~/.cargo   : $( [ -d "$HOME/.cargo" ]  && echo EXISTS || echo missing )"
          echo "  ~/.rustup  : $( [ -d "$HOME/.rustup" ] && echo EXISTS || echo missing )"
          echo
          echo "== node =="
          probe node node --version
          probe npm  npm --version
          probe pnpm pnpm --version
          probe npx  npx --version
          echo
          echo "== python =="
          probe python3 python3 --version
          probe pip3    pip3 --version
          echo
          echo "== containers / misc =="
          probe docker docker --version
          probe jq     jq --version
          probe git    git --version
          probe curl   curl --version
          probe wget   wget --version
          probe unzip  unzip -v
          probe tar    tar --version
          probe gh     gh --version
          probe go     go version
          probe java   java -version
          probe clw    clw --version
          probe make   make --version
          probe cc     cc --version
          probe ld     ld --version
          probe sha256sum sha256sum --version
          echo
          echo "== package manager =="
          probe apt-get apt-get --version
          echo "  can sudo   : $( sudo -n true 2>/dev/null && echo YES || echo NO )"

      - name: network egress + PATH
        run: |
          set -uo pipefail
          echo "== PATH =="
          echo "$PATH" | tr ':' '\n' | sed 's/^/  /'
          echo
          echo "== egress reachability (headers only) =="
          # ghcr.io + mirror.gcr.io matter specifically for `trivy`: it pulls its
          # vulnerability DB and its misconfig-checks bundle as OCI artifacts, so
          # a box that can reach github.com but not ghcr.io fails that gate only.
          for u in https://github.com https://api.github.com https://static.rust-lang.org \
                   https://registry.npmjs.org https://pypi.org https://ghcr.io/v2/ \
                   https://mirror.gcr.io https://objects.githubusercontent.com; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$u" || echo TIMEOUT)
            printf '  %-34s %s\n' "$u" "$code"
          done

  # ── The wave-2 question: what does the box's RUSTUP actually hold? ──────────
  # Wave 2 migrates the Rust lanes, and every one of them runs
  # `dtolnay/rust-toolchain`. On an EPHEMERAL box that action re-downloads a
  # toolchain on every single run, so the tempting move is to delete it. That is
  # only safe if the box already provides EXACTLY what the action was asked for
  # — otherwise it is a coverage change, not a runner change.
  #
  # The subtlety this job exists to settle: the workspace ships a
  # `rust-toolchain.toml` pinning channel 1.91.1 plus components and TARGETS
  # (wasm32-unknown-unknown, x86_64-unknown-linux-musl). Wherever rustup is
  # installed, its shims honour that file over any `rustup default`. So the
  # question is never "what does `rustc --version` print on a bare shell" — it
  # is "what does cargo resolve to INSIDE the repo, is that resolution already
  # local, and what does it cost when it is not".
  rust-detail:
    name: rustup detail (toolchains, targets, components, resolution cost)
    runs-on: corelink
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: what rustup holds BEFORE anything touches the repo
        # Run from OUTSIDE the checkout so rust-toolchain.toml cannot influence
        # the answer — this is the image's own inventory.
        working-directory: /
        run: |
          set -uo pipefail
          echo "== rustup =="
          rustup --version 2>&1 | head -2
          echo
          echo "== installed toolchains =="
          rustup toolchain list -v 2>&1
          echo
          echo "== default toolchain =="
          rustup show active-toolchain 2>&1 || true
          echo
          # `rustup toolchain list` annotates entries ("… (active, default)"), so
          # take FIELD ONE per line — word-splitting the whole line feeds rustup
          # the annotation as a toolchain name and it exits 1.
          toolchains=$(rustup toolchain list 2>/dev/null | awk 'NF{print $1}')
          echo "== targets installed (per toolchain) =="
          for tc in $toolchains; do
            echo "  --- $tc"
            rustup target list --installed --toolchain "$tc" 2>&1 | sed 's/^/      /'
          done
          echo
          echo "== components installed (per toolchain) =="
          for tc in $toolchains; do
            echo "  --- $tc"
            rustup component list --installed --toolchain "$tc" 2>&1 | sed 's/^/      /'
          done
          echo
          echo "== cargo home state (ephemeral box ⇒ expect an EMPTY registry) =="
          echo "  CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}"
          du -sh "${CARGO_HOME:-$HOME/.cargo}" 2>/dev/null || echo "  (absent)"
          echo "  registry/cache entries: $(find "${CARGO_HOME:-$HOME/.cargo}/registry/cache" -type f 2>/dev/null | wc -l)"
          echo "  registry/src   entries: $(find "${CARGO_HOME:-$HOME/.cargo}/registry/src" -maxdepth 2 -type d 2>/dev/null | wc -l)"

      - name: what the REPO resolves to, and what that resolution costs
        # The load-bearing measurement. `cargo --version` inside the checkout
        # forces rustup to honour rust-toolchain.toml; if the pinned channel is
        # absent, the shim installs it (with the file's components + targets)
        # right here — so this step's wall-clock IS the per-run toolchain tax
        # that dropping `dtolnay/rust-toolchain` would or would not remove.
        run: |
          set -uo pipefail
          echo "== rust-toolchain.toml =="
          cat rust-toolchain.toml
          echo
          echo "== resolving (timed) =="
          start=$(date +%s)
          cargo --version 2>&1
          rustc --version 2>&1
          end=$(date +%s)
          echo "  >>> rust-toolchain.toml resolution took $((end-start))s"
          echo
          echo "== active toolchain INSIDE the repo =="
          rustup show active-toolchain 2>&1 || true
          echo
          echo "== toolchains after resolution (did a new one appear?) =="
          rustup toolchain list 2>&1
          echo
          echo "== the components the Rust lanes ask dtolnay for =="
          echo "  cargo fmt    : $(cargo fmt --version 2>&1 | head -1)"
          echo "  cargo clippy : $(cargo clippy --version 2>&1 | head -1)"
          echo "  llvm-tools   : $(rustup component list --installed 2>/dev/null | grep -c llvm-tools) (coverage.yml asks for llvm-tools-preview)"
          echo
          echo "== the targets the Rust lanes ask dtolnay for =="
          rustup target list --installed 2>&1 | sed 's/^/    /'
          echo
          echo "== cost of adding wasm32 IF it were missing (timed; no-op if present) =="
          start=$(date +%s)
          rustup target add wasm32-unknown-unknown 2>&1
          end=$(date +%s)
          echo "  >>> rustup target add wasm32-unknown-unknown took $((end-start))s"

      - name: what a COLD compile actually costs here
        # The third wave-2 unknown. Every Rust lane restores `Swatinem/rust-cache`
        # on the hosted runner, and that cache step is gated
        # `runner.environment == 'github-hosted'` — so on an ephemeral corelink box
        # it is SKIPPED and the lane compiles cold, every run. Whether that is a
        # win or a loss is an empirical question about 4 cold cores versus 2 warm
        # ones, and the honest way to answer it is to run one real lane's exact
        # commands and print the seconds. corelink-hash's PR gate is the smallest
        # crate lane, so it is the cheapest faithful sample.
        run: |
          set -uo pipefail
          t() { s=$(date +%s); "$@" >/dev/null 2>&1; rc=$?; e=$(date +%s);
                printf '  >>> %-58s %4ds (exit %d)\n' "$*" "$((e-s))" "$rc"; }
          t cargo fetch --locked
          t cargo clippy --package corelink-hash --all-targets -- -D warnings
          t cargo test --package corelink-hash --all-targets
          t cargo test --release --package corelink-hash
          t cargo check --package corelink-hash --target wasm32-unknown-unknown
          echo
          echo "== disk + cargo home AFTER a cold crate build =="
          df -h / | tail -1
          du -sh "${CARGO_HOME:-$HOME/.cargo}" target 2>/dev/null || true

  # ── The other wave-2 question: what is the concurrency ceiling, really? ─────
  # A single push already fans out ~13 workflows. Migrating the Rust lanes could
  # ask for 15-25 boxes at once, and the answer to "what happens then" decides
  # the wave SIZE. Config says the ceiling is 20 (the tenant's
  # `runners_entitlement.max_concurrency` AND the spawn-Worker's global
  # `FLEET_MAX_CONCURRENCY`, whichever is lower). This job MEASURES it.
  #
  # Skipped unless `fanout` is set > 0 — it is a deliberate, operator-triggered
  # saturation test, not something to run by accident.
  fanout-matrix:
    name: fan-out ${{ matrix.n }}
    if: github.event.inputs.fanout != '0' && github.event.inputs.fanout != ''
    needs: fanout-plan
    runs-on: corelink
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 64   # do NOT let Actions throttle: we are measuring the FABRIC
      matrix:
        n: ${{ fromJSON(needs.fanout-plan.outputs.list) }}
    steps:
      - name: report placement + hold the slot briefly
        run: |
          set -uo pipefail
          echo "slot=${{ matrix.n }} runner_name=${RUNNER_NAME:-?} started=$(date -u +%FT%TZ)"
          # Hold long enough that the boxes genuinely overlap, short enough that
          # a saturated GLOBAL fleet recovers in about a minute.
          sleep 45
          echo "slot=${{ matrix.n }} finished=$(date -u +%FT%TZ)"

  fanout-plan:
    name: plan the fan-out
    if: github.event.inputs.fanout != '0' && github.event.inputs.fanout != ''
    runs-on: corelink
    timeout-minutes: 10
    outputs:
      list: ${{ steps.plan.outputs.list }}
    steps:
      - name: build the matrix list
        id: plan
        # jq is on the image; python3 is not. Clamp to 64 so a typo cannot ask
        # for a thousand boxes.
        env:
          FANOUT: ${{ github.event.inputs.fanout }}
        run: |
          set -euo pipefail
          n=$(printf '%s' "$FANOUT" | tr -cd '0-9')
          [ -n "$n" ] || n=0
          [ "$n" -le 64 ] || n=64
          list=$(jq -cn --argjson n "$n" '[range(1; $n+1)]')
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "planned $n simultaneous boxes: $list"
