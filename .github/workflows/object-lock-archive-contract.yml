name: Object-Lock archive contract

on:
  pull_request:
    paths:
      - "crates/corelink-audit-chain/**"
      - ".github/workflows/object-lock-archive-contract.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: object-lock-archive-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: immutable archive adapter conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable toolchain action
        with:
          toolchain: 1.91.1

      - name: Run immutable archive adapter conformance tests
        run: cargo test --locked -p corelink-audit-chain --lib object_lock_archive -- --nocapture
