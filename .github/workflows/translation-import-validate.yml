name: translation import validate

# R-4 / H-16 — validates translator-returned i18n MDX before merge.
# Runs `translation-quality-check.ts --strict` on PRs that touch the pt-BR or
# es-419 docs trees. Blocks merge on any error (missing translation, broken
# MDX, terminology violation, link drift, code-block tampering).
#
# Spec contract: R-4 (i18n parity at GA) + S-18 §5.6 R-S18-12.

on:
  pull_request:
    paths:
      - "apps/docs/i18n/pt-BR/**/*.md"
      - "apps/docs/i18n/pt-BR/**/*.mdx"
      - "apps/docs/i18n/es-419/**/*.md"
      - "apps/docs/i18n/es-419/**/*.mdx"
      - "apps/docs/i18n/STYLE-GUIDE.md"
      - "apps/docs/scripts/translation-quality-check.ts"
      - "apps/docs/scripts/export-xliff.ts"
      - "apps/docs/scripts/import-xliff.ts"
      - ".github/workflows/translation-import-validate.yml"
  push:
    branches: [main]
    paths:
      - "apps/docs/i18n/pt-BR/**/*.md"
      - "apps/docs/i18n/pt-BR/**/*.mdx"
      - "apps/docs/i18n/es-419/**/*.md"
      - "apps/docs/i18n/es-419/**/*.mdx"
      - "apps/docs/scripts/translation-quality-check.ts"
      - ".github/workflows/translation-import-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: translation-import-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    name: translation quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v4.1.0
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run translation quality check (strict)
        working-directory: apps/docs
        # During the stub phase (pre-delivery), STUB_REMAINS errors are
        # expected; the gate runs non-strict by default so stub PRs are not
        # blocked. Once the translator delivery lands and stubs reach 0, flip
        # this to --strict via a follow-up PR to enforce zero regression.
        run: pnpm tsx scripts/translation-quality-check.ts

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: translation-quality-report
          path: apps/docs/dist/translation-quality-report.md
          if-no-files-found: warn
