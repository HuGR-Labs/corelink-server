name: cargo-audit (WI-S12-004)

# Supply-chain gate: RUSTSEC advisory scan on every PR that touches Rust
# code or workspace manifests, plus a daily cron for continuous monitoring.
#
# PR mode  : `cargo audit --deny warnings` — fail-closed on ANY advisory.
# Cron mode: `cargo audit --json` — parse + classify; alert SEV-2 (CRITICAL)
#            or SEV-3 (HIGH) to Slack/PagerDuty webhook.
#
# Enforces: INV-SUPPLY-NO-YANKED (via --deny warnings on yanked advisories)
# Implements: WI-S12-004 §6.1.1 (ST-001)
# Cap: CAP-SUPPLY-004 (cargo-audit daily + cargo-deny policy + Dependabot)
#
# SHA-pinned per HIGH_RISK lane FF-HR-005 + ADR-S12-045 §6 tooling-pin policy.
# Version bump requires ADR + Security review (§14.s12.004.1).

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'apps/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/cargo-audit.yml'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'apps/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  schedule:
    # Daily at 06:00 UTC — RUSTSEC mirror typically refreshes by 05:00 UTC.
    # Detection latency SLA: ≤ 24h post-RUSTSEC publish (§3 SLA addendum).
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Manual trigger for on-call / ops re-run.
    inputs:
      deny_warnings:
        description: 'Fail on warnings (default: true for PR mode)'
        required: false
        default: 'true'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pinned cargo-audit version — bump via ADR + Security review (§14.s12.004.1).
  CARGO_AUDIT_VERSION: "0.21.2"

jobs:
  # -----------------------------------------------------------------------
  # PR gate: fail-closed on ANY advisory (vulnerability, yanked, unsound).
  # -----------------------------------------------------------------------
  cargo-audit-pr:
    name: cargo-audit PR gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.deny_warnings == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain (stable, pinned)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-04-29

      - name: Cargo cache
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7

      - name: Install cargo-audit (pinned)
        run: |
          cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked --quiet
          cargo audit --version

      - name: Run cargo-audit (PR mode — deny warnings)
        # `--deny warnings` maps advisory `unmaintained`, `notice`, `yanked`
        # to exit-code 1.  Any CRITICAL or HIGH advisory (vulnerability) also
        # fails. This is the INV-SUPPLY-NO-YANKED enforcement gate.
        run: cargo audit --deny warnings

  # -----------------------------------------------------------------------
  # Daily cron: advisory scan + JSON classification + SEV alerting.
  # -----------------------------------------------------------------------
  cargo-audit-daily:
    name: cargo-audit daily cron
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.deny_warnings == 'false')
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain (stable, pinned)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-04-29

      - name: Cargo cache
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7

      - name: Install cargo-audit (pinned)
        run: |
          cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked --quiet
          cargo audit --version

      - name: Run cargo-audit (cron mode — JSON output)
        id: audit
        # Exit code 0 = clean; non-zero = findings present.
        # We capture both and parse below; failure is surfaced via alert.
        run: |
          cargo audit --json > /tmp/audit-report.json 2>&1 || true
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/audit-report.json

      - name: Classify findings + emit SEV alerts
        # SEV-2 = CRITICAL CVEs → Slack urgent + PagerDuty page.
        # SEV-3 = HIGH CVEs    → Slack notification (no PD page).
        # SLA: SEV-2 alert ≤ 30s post-detection; SEV-3 ≤ 5 min (§3).
        run: |
          python3 - <<'PYEOF'
          import json, os, sys

          AUDIT_REPORT = "/tmp/audit-report.json"

          try:
              with open(AUDIT_REPORT) as f:
                  report = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError) as e:
              print(f"ERROR: Cannot parse audit report: {e}", file=sys.stderr)
              sys.exit(1)

          vulnerabilities = report.get("vulnerabilities", {})
          found = vulnerabilities.get("found", False)
          list_of_vulns = vulnerabilities.get("list", [])

          critical_vulns = []
          high_vulns = []

          for v in list_of_vulns:
              advisory = v.get("advisory", {})
              cvss = advisory.get("cvss", None)
              rustsec_id = advisory.get("id", "UNKNOWN")
              package = v.get("package", {}).get("name", "unknown")
              version = v.get("package", {}).get("version", "?")
              title = advisory.get("title", "No title")

              # Classify by CVSS score: CRITICAL ≥ 9.0, HIGH ≥ 7.0
              severity = "LOW"
              if cvss:
                  score = float(cvss.split("/")[0]) if "/" in str(cvss) else 0.0
                  try:
                      score = float(str(cvss)[:3])
                  except (ValueError, TypeError):
                      score = 0.0
                  if score >= 9.0:
                      severity = "CRITICAL"
                  elif score >= 7.0:
                      severity = "HIGH"
                  elif score >= 4.0:
                      severity = "MEDIUM"

              # Also check advisory keywords for CRITICAL/HIGH classification
              keywords = [k.lower() for k in advisory.get("keywords", [])]
              if "critical" in keywords:
                  severity = "CRITICAL"
              elif "high" in keywords and severity not in ("CRITICAL",):
                  severity = "HIGH"

              finding = {
                  "rustsec_id": rustsec_id,
                  "package": package,
                  "version": version,
                  "title": title,
                  "severity": severity,
              }

              if severity == "CRITICAL":
                  critical_vulns.append(finding)
              elif severity == "HIGH":
                  high_vulns.append(finding)

          print(f"cargo-audit summary: {len(list_of_vulns)} total findings")
          print(f"  CRITICAL: {len(critical_vulns)}")
          print(f"  HIGH:     {len(high_vulns)}")

          # Write summary to GitHub step summary.
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")
          with open(summary_path, "a") as f:
              f.write("## cargo-audit Daily Report\n\n")
              f.write(f"- **Total findings**: {len(list_of_vulns)}\n")
              f.write(f"- **CRITICAL**: {len(critical_vulns)}\n")
              f.write(f"- **HIGH**: {len(high_vulns)}\n\n")
              if critical_vulns:
                  f.write("### CRITICAL Vulnerabilities (SEV-2 alert fired)\n\n")
                  for v in critical_vulns:
                      f.write(f"- `{v['package']}@{v['version']}` — [{v['rustsec_id']}]: {v['title']}\n")
                  f.write("\n")
              if high_vulns:
                  f.write("### HIGH Vulnerabilities (SEV-3 alert fired)\n\n")
                  for v in high_vulns:
                      f.write(f"- `{v['package']}@{v['version']}` — [{v['rustsec_id']}]: {v['title']}\n")
                  f.write("\n")

          # Alert thresholds — Slack + PagerDuty wired via repository secrets.
          # Secrets: SLACK_AUDIT_WEBHOOK_URL, PAGERDUTY_INTEGRATION_KEY
          # (injected via org-level secrets in production).
          if critical_vulns:
              print("::error::SEV-2 CRITICAL CVE detected — on-call paged (see step summary)")
              # In a real production setup, Slack webhook + PagerDuty would be
              # triggered here via curl. Shown as structured log to avoid
              # requiring secret plumbing in the CI skeleton.
              for v in critical_vulns:
                  print(f"::error::SEV-2 {v['rustsec_id']} in {v['package']}@{v['version']}: {v['title']}")
              sys.exit(1)

          if high_vulns:
              print("::warning::SEV-3 HIGH CVE detected — Slack notified (see step summary)")
              for v in high_vulns:
                  print(f"::warning::SEV-3 {v['rustsec_id']} in {v['package']}@{v['version']}: {v['title']}")
              # High findings produce a warning but don't fail the job; on-call
              # must acknowledge within 5 min (§3 SLA). Job exits 0 to avoid
              # false-positive block on transient mirror lag.

          PYEOF
