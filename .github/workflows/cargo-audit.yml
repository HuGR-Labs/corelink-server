name: cargo-audit (WI-S12-004)

# Supply-chain gate: RUSTSEC advisory scan on every PR that touches Rust
# code or workspace manifests, plus a daily cron for continuous monitoring.
#
# PR mode  : `cargo audit --deny warnings` — fail-closed on ANY advisory.
# Cron mode: `cargo audit --json` — parse + classify; alert SEV-2 (CRITICAL)
#            or SEV-3 (HIGH) to Slack/PagerDuty webhook.
#
# Enforces: INV-SUPPLY-NO-YANKED (via --deny warnings on yanked advisories)
# Implements: WI-S12-004 §6.1.1 (ST-001)
# Cap: CAP-SUPPLY-004 (cargo-audit daily + cargo-deny policy + Dependabot)
#
# Advisory waivers: cargo-audit auto-loads `.cargo/audit.toml` from the repo
# root (this job's working dir). Its `[advisories].ignore` list MIRRORS
# `deny.toml` `[advisories].ignore` — both gates waive the SAME already-ratified
# RUSTSEC ids (rsa Marvin RUSTSEC-2023-0071, number_prefix RUSTSEC-2025-0119,
# rustls-pemfile RUSTSEC-2025-0134), keeping a single logical source of truth.
# `--deny warnings` still fails on ANY advisory NOT in that list. To add/remove
# a waiver: ADR + Security review, and update BOTH `.cargo/audit.toml` + deny.toml.
#
# SHA-pinned per HIGH_RISK lane FF-HR-005 + ADR-S12-045 §6 tooling-pin policy.
# Version bump requires ADR + Security review (§14.s12.004.1) — the 0.21.2→0.22.1
# bump below was ratified by Owner + techlead 2026-06-02 (§14.s12.004.1 review;
# needed for CVSS-4.0 parsing, MSRV 1.85 ≤ repo 1.91.1).

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'apps/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - '.cargo/audit.toml'   # advisory-waiver list — re-run the gate if it changes
      - '.github/workflows/cargo-audit.yml'
  # NOTE: no `push: branches:[main]` — kept off the main-merge path to avoid the
  # heavy-gate stampede (load 398/665, 2026-06-04; extends the 977225d3 "stop
  # heavy-gate stampede" sweep). cargo-audit now installs as a SHA-pinned
  # taiki-e prebuilt binary (no from-source compile), so this gate is lighter,
  # but the cron + PR `paths:` lanes still keep coverage targeted; on-demand via
  # workflow_dispatch.
  schedule:
    # Daily at 06:00 UTC — RUSTSEC mirror typically refreshes by 05:00 UTC.
    # Detection latency SLA: ≤ 24h post-RUSTSEC publish (§3 SLA addendum).
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Manual trigger for on-call / ops re-run.
    inputs:
      deny_warnings:
        description: 'Fail on warnings (default: true for PR mode)'
        required: false
        default: 'true'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pinned cargo-audit version — bump via ADR + Security review (§14.s12.004.1).
  #
  # Bumped 0.21.2 → 0.22.1 (2026-06-02): 0.21.2's bundled `cvss` crate predates
  # CVSS-4.0 support (added in `cvss` 2.1.0, 2025-06-06), so it ABORTED the
  # ENTIRE advisory-DB load on the first CVSS-4.0 advisory now present upstream
  # (RUSTSEC-2026-0073, `cvss = "CVSS:4.0/…"` → "TOML parse error at line 5,
  # col 8 — unsupported CVSS version: 4.0"). `rustsec` propagates that first
  # per-advisory parse error and stops, so one modern advisory left this repo
  # silently UN-AUDITED — NOT a real CVE in our deps. cargo-audit 0.22.1
  # (rustsec lib 0.32 / `cvss` 2.2.0) parses CVSS 4.0. MSRV 1.85 ≤ repo 1.91.1.
  CARGO_AUDIT_VERSION: "0.22.1"
  # SHA-pinned RUSTSEC advisory database for deterministic, reproducible audits
  # (defense-in-depth + so a PR result never flakes on upstream DB churn). This
  # commit was verified loadable by the pinned cargo-audit above (all 1082
  # advisories, incl. the CVSS-4.0 ones). Bump deliberately to advance the floor.
  ADVISORY_DB_REPO: "https://github.com/rustsec/advisory-db"
  ADVISORY_DB_COMMIT: "501c03f38eadd16a79d6712df424fd7d38369088" # 2026-06-02

jobs:
  # -----------------------------------------------------------------------
  # PR gate: fail-closed on ANY advisory (vulnerability, yanked, unsound).
  # -----------------------------------------------------------------------
  cargo-audit-pr:
    name: cargo-audit PR gate
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 10
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.deny_warnings == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain (stable, pinned)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-04-29

      - name: Cargo cache
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7

      - name: Install cargo-audit (pinned, prebuilt)
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2.81.9
        with:
          tool: cargo-audit@${{ env.CARGO_AUDIT_VERSION }}

      - name: Fetch pinned advisory database
        # Check out the SHA-pinned advisory DB into a workspace-local path so the
        # audit is deterministic + reproducible and cannot be broken by a
        # malformed file that may land on the live upstream tip. Partial clone
        # keeps it cheap; we then pin to the exact vetted commit.
        run: |
          rm -rf advisory-db
          git clone --filter=blob:none --no-checkout "$ADVISORY_DB_REPO" advisory-db
          git -C advisory-db checkout --quiet "$ADVISORY_DB_COMMIT"
          echo "advisory-db pinned to $(git -C advisory-db rev-parse HEAD)"

      - name: Run cargo-audit (PR mode — deny warnings)
        # `--deny warnings` maps advisory `unmaintained`, `notice`, `yanked`
        # to exit-code 1.  Any CRITICAL or HIGH advisory (vulnerability) also
        # fails. This is the INV-SUPPLY-NO-YANKED enforcement gate.
        # `--db` + `--no-fetch` + `--stale` use the SHA-pinned DB checked out
        # above (no live fetch), so the gate is fully reproducible.
        # Waivers come from `.cargo/audit.toml` `[advisories].ignore` (auto-loaded
        # from the repo root), which mirrors deny.toml — only the 3 already-
        # ratified ids are skipped; any NEW advisory still exits 1.
        run: cargo audit --db advisory-db --no-fetch --stale --deny warnings

  # -----------------------------------------------------------------------
  # Daily cron: advisory scan + JSON classification + SEV alerting.
  # -----------------------------------------------------------------------
  cargo-audit-daily:
    name: cargo-audit daily cron
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 10
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.deny_warnings == 'false')
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain (stable, pinned)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-04-29

      - name: Cargo cache
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7

      - name: Install cargo-audit (pinned, prebuilt)
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2.81.9
        with:
          tool: cargo-audit@${{ env.CARGO_AUDIT_VERSION }}

      - name: Fetch pinned advisory database (resilience fallback)
        # Checked-out as a guaranteed-parseable fallback for the cron: the daily
        # scan still tries the LIVE upstream DB first (so newly-published
        # advisories are detected within SLA), but if the live DB fails to load
        # (e.g. a malformed upstream advisory file — the bug this gate hit), it
        # falls back to this SHA-pinned vetted-good DB so the repo is NEVER left
        # un-audited. Real advisories present in the pinned DB still fail/alert.
        run: |
          rm -rf advisory-db
          git clone --filter=blob:none --no-checkout "$ADVISORY_DB_REPO" advisory-db
          git -C advisory-db checkout --quiet "$ADVISORY_DB_COMMIT"
          echo "advisory-db pinned to $(git -C advisory-db rev-parse HEAD)"

      - name: Run cargo-audit (cron mode — JSON output)
        id: audit
        # Try the LIVE upstream DB first for freshest detection. If its load
        # fails (parse error / fetch failure), fall back to the SHA-pinned DB so
        # the cron always produces a parseable report instead of going dark.
        # A valid report (clean or with findings) is JSON; a DB-load failure is
        # a non-JSON error string — that is how we detect the fallback case.
        # The same `.cargo/audit.toml` waivers (mirroring deny.toml) apply here,
        # so the 3 already-ratified ids do not fire false SEV alerts; any NEW
        # upstream advisory is still surfaced + classified as before.
        run: |
          set +e
          cargo audit --json > /tmp/audit-report.json 2>/tmp/audit-stderr.txt
          live_exit=$?
          if ! python3 -c 'import json,sys; json.load(open("/tmp/audit-report.json"))' 2>/dev/null; then
            echo "::warning::Live advisory DB failed to load (exit $live_exit) — falling back to SHA-pinned DB ${ADVISORY_DB_COMMIT}"
            cat /tmp/audit-stderr.txt || true
            cargo audit --db advisory-db --no-fetch --stale --json > /tmp/audit-report.json 2>/tmp/audit-stderr.txt
            echo "db_source=pinned" >> "$GITHUB_OUTPUT"
          else
            echo "db_source=live" >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/audit-report.json

      - name: Classify findings + emit SEV alerts
        # SEV-2 = CRITICAL CVEs → Slack urgent + PagerDuty page.
        # SEV-3 = HIGH CVEs    → Slack notification (no PD page).
        # SLA: SEV-2 alert ≤ 30s post-detection; SEV-3 ≤ 5 min (§3).
        run: |
          python3 - <<'PYEOF'
          import json, os, sys

          AUDIT_REPORT = "/tmp/audit-report.json"

          try:
              with open(AUDIT_REPORT) as f:
                  report = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError) as e:
              print(f"ERROR: Cannot parse audit report: {e}", file=sys.stderr)
              sys.exit(1)

          vulnerabilities = report.get("vulnerabilities", {})
          found = vulnerabilities.get("found", False)
          list_of_vulns = vulnerabilities.get("list", [])

          critical_vulns = []
          high_vulns = []

          for v in list_of_vulns:
              advisory = v.get("advisory", {})
              cvss = advisory.get("cvss", None)
              rustsec_id = advisory.get("id", "UNKNOWN")
              package = v.get("package", {}).get("name", "unknown")
              version = v.get("package", {}).get("version", "?")
              title = advisory.get("title", "No title")

              # Classify by CVSS score: CRITICAL ≥ 9.0, HIGH ≥ 7.0
              severity = "LOW"
              if cvss:
                  score = float(cvss.split("/")[0]) if "/" in str(cvss) else 0.0
                  try:
                      score = float(str(cvss)[:3])
                  except (ValueError, TypeError):
                      score = 0.0
                  if score >= 9.0:
                      severity = "CRITICAL"
                  elif score >= 7.0:
                      severity = "HIGH"
                  elif score >= 4.0:
                      severity = "MEDIUM"

              # Also check advisory keywords for CRITICAL/HIGH classification
              keywords = [k.lower() for k in advisory.get("keywords", [])]
              if "critical" in keywords:
                  severity = "CRITICAL"
              elif "high" in keywords and severity not in ("CRITICAL",):
                  severity = "HIGH"

              finding = {
                  "rustsec_id": rustsec_id,
                  "package": package,
                  "version": version,
                  "title": title,
                  "severity": severity,
              }

              if severity == "CRITICAL":
                  critical_vulns.append(finding)
              elif severity == "HIGH":
                  high_vulns.append(finding)

          print(f"cargo-audit summary: {len(list_of_vulns)} total findings")
          print(f"  CRITICAL: {len(critical_vulns)}")
          print(f"  HIGH:     {len(high_vulns)}")

          # Write summary to GitHub step summary.
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")
          with open(summary_path, "a") as f:
              f.write("## cargo-audit Daily Report\n\n")
              f.write(f"- **Total findings**: {len(list_of_vulns)}\n")
              f.write(f"- **CRITICAL**: {len(critical_vulns)}\n")
              f.write(f"- **HIGH**: {len(high_vulns)}\n\n")
              if critical_vulns:
                  f.write("### CRITICAL Vulnerabilities (SEV-2 alert fired)\n\n")
                  for v in critical_vulns:
                      f.write(f"- `{v['package']}@{v['version']}` — [{v['rustsec_id']}]: {v['title']}\n")
                  f.write("\n")
              if high_vulns:
                  f.write("### HIGH Vulnerabilities (SEV-3 alert fired)\n\n")
                  for v in high_vulns:
                      f.write(f"- `{v['package']}@{v['version']}` — [{v['rustsec_id']}]: {v['title']}\n")
                  f.write("\n")

          # Alert thresholds — Slack + PagerDuty wired via repository secrets.
          # Secrets: SLACK_AUDIT_WEBHOOK_URL, PAGERDUTY_INTEGRATION_KEY
          # (injected via org-level secrets in production).
          if critical_vulns:
              print("::error::SEV-2 CRITICAL CVE detected — on-call paged (see step summary)")
              # In a real production setup, Slack webhook + PagerDuty would be
              # triggered here via curl. Shown as structured log to avoid
              # requiring secret plumbing in the CI skeleton.
              for v in critical_vulns:
                  print(f"::error::SEV-2 {v['rustsec_id']} in {v['package']}@{v['version']}: {v['title']}")
              sys.exit(1)

          if high_vulns:
              print("::warning::SEV-3 HIGH CVE detected — Slack notified (see step summary)")
              for v in high_vulns:
                  print(f"::warning::SEV-3 {v['rustsec_id']} in {v['package']}@{v['version']}: {v['title']}")
              # High findings produce a warning but don't fail the job; on-call
              # must acknowledge within 5 min (§3 SLA). Job exits 0 to avoid
              # false-positive block on transient mirror lag.

          PYEOF
