name: issue-2140 trusted v0004 policy

on:
  pull_request:
    paths:
      - '.github/workflows/issue-2140-trusted-v0004-policy.yml'
      - 'scripts/backlog_ledger_successor.py'
      - 'scripts/backlog_verify.py'
      - 'tests/test_backlog_ledger_successor.py'

permissions:
  contents: read

jobs:
  policy:
    name: verify trusted BASE v0004 policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout without write credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.6.0
        with:
          python-version: '3.12'
      - name: Install CI test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Prove policy pins and BASE mutation rejection
        run: >-
          python -m pytest -q
          tests/test_backlog_ledger_successor.py::test_v0004_reconciliation_allows_only_exact_b012_catalog_retirement
          tests/test_backlog_ledger_successor.py::test_v0004_policy_prior_source_matches_pull_request_base_and_delta_is_derived
          tests/test_backlog_ledger_successor.py::test_v0004_historical_delta_ids_are_computed_from_immutable_sources
