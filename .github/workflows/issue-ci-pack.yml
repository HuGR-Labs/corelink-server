name: Issue CI pack (manual, bounded)

on:
  workflow_dispatch:
    inputs:
      pack_id:
        description: Reviewed closed-catalog pack identifier
        required: true
        type: choice
        options:
          - issue-2440-ci-scoping
          - issue-2437-worker-three-arm
          - issue-1948-mutants-receipt
          - issue-2457-mutants-shards
          - issue-1677-b170-owner-actions
      candidate_sha:
        description: Exact candidate head SHA for this dispatch ref
        required: true
        type: string
      target_base_sha:
        description: Exact target base SHA used to construct the candidate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: issue-ci-pack-${{ inputs.pack_id }}-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  pack:
    name: ${{ inputs.pack_id }} focused issue pack
    if: >-
      github.repository == 'HuGR-dev/corelink-server' && github.repository_id == '1232040291' &&
      github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out trusted pack controls from protected main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact candidate as data
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Bind the dispatch to the exact candidate SHA
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          TARGET_BASE_SHA: ${{ inputs.target_base_sha }}
          PACK_ID: ${{ inputs.pack_id }}
          TRUSTED_MAIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_REF_PROTECTED" == true ]]
          ACTUAL_SHA="$(git -C candidate rev-parse HEAD)"
          [[ "$TRUSTED_MAIN_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$EXPECTED_SHA" == "$ACTUAL_SHA" ]]
          MERGE_BASE="$(git -C candidate merge-base "$TRUSTED_MAIN_SHA" "$ACTUAL_SHA")"
          [[ "$TARGET_BASE_SHA" != "$ACTUAL_SHA" ]]
          if [[ "$PACK_ID" == issue-2440-ci-scoping && "$ACTUAL_SHA" == "$TRUSTED_MAIN_SHA" ]]; then
            EXPECTED_BASE="$(git -C candidate rev-parse HEAD^)"
          else
            EXPECTED_BASE="$MERGE_BASE"
          fi
          [[ "$TARGET_BASE_SHA" == "$EXPECTED_BASE" ]]
          case "$PACK_ID" in
            issue-2440-ci-scoping|issue-2437-worker-three-arm|issue-1948-mutants-receipt|issue-2457-mutants-shards|issue-1677-b170-owner-actions) ;;
            *) echo "::error::unknown issue CI pack ID" >&2; exit 1 ;;
          esac

      - name: Install pinned actionlint
        if: inputs.pack_id == 'issue-2440-ci-scoping' || inputs.pack_id == 'issue-2437-worker-three-arm' || inputs.pack_id == 'issue-2457-mutants-shards'
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" \
            --output "${archive}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${archive}" \
            | sha256sum --check --status
          mkdir -p "${RUNNER_TEMP}/actionlint"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/actionlint" actionlint
          "${RUNNER_TEMP}/actionlint/actionlint" -version

      - name: Validate declared workflow surface
        id: actionlint
        if: inputs.pack_id == 'issue-2440-ci-scoping' || inputs.pack_id == 'issue-2437-worker-three-arm' || inputs.pack_id == 'issue-2457-mutants-shards'
        env:
          PACK_ID: ${{ inputs.pack_id }}
        shell: bash
        run: |
          set -euo pipefail
          case "$PACK_ID" in
            issue-2440-ci-scoping) workflows=(.github/workflows/issue-ci-pack.yml) ;;
            issue-2437-worker-three-arm) workflows=(.github/workflows/corelink-worker.yml) ;;
            issue-2457-mutants-shards) workflows=(.github/workflows/issue-1863-mutants-hosted.yml .github/workflows/issue-1863-mutants-contract.yml .github/workflows/issue-1666-mutants-evidence-contract.yml .github/workflows/issue-ci-pack.yml) ;;
            *) echo "::error::no workflow surface for this pack" >&2; exit 1 ;;
          esac
          "${RUNNER_TEMP}/actionlint/actionlint" -color "${workflows[@]}"
        working-directory: candidate

      - name: Install the repository Rust toolchain
        if: inputs.pack_id == 'issue-2437-worker-three-arm'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable toolchain action
        with:
          toolchain: 1.91.1

      - name: Run issue 2437 padded timing acceptance test
        id: rust-worker-three-arm
        if: inputs.pack_id == 'issue-2437-worker-three-arm'
        timeout-minutes: 10
        run: timeout 600s cargo test --package corelink-worker --features tower-middleware --lib three_arm_ -- --nocapture
        working-directory: candidate

      - name: Run issue 1948 hosted receipt contract tests
        id: python-mutants-receipt
        if: inputs.pack_id == 'issue-1948-mutants-receipt'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -q tests/test_i1863_mutants_hosted_receipt.py
          python3 scripts/verify_i1863_mutants_hosted.py
        working-directory: candidate

      - name: Run issue 2457 deterministic shard contract tests
        id: python-mutants-shards
        if: inputs.pack_id == 'issue-2457-mutants-shards'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.verify_i1666_mutants_evidence
          python3 -m scripts.verify_i1863_mutants_hosted
          python3 -m unittest -q \
            tests/test_verify_i1666_mutants_evidence.py \
            tests/test_i1863_mutants_hosted_receipt.py \
            tests/test_i2457_mutants_shards.py
        working-directory: candidate

      - name: Assert the candidate workspace-pinned toolchain for issue 2457 inventory
        if: inputs.pack_id == 'issue-2457-mutants-shards'
        timeout-minutes: 3
        run: bash scripts/ci-assert-pinned-toolchain.sh
        working-directory: candidate

      - name: Install protoc for issue 2457 inventory discovery
        if: inputs.pack_id == 'issue-2457-mutants-shards'
        uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0
        timeout-minutes: 3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned cargo-mutants for issue 2457 inventory discovery
        if: inputs.pack_id == 'issue-2457-mutants-shards'
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        timeout-minutes: 5
        with:
          tool: cargo-mutants@27.0.0
          fallback: cargo-binstall

      - name: Run the real cargo-mutants v27 denominator-one inventory
        id: cargo-mutants-v27-inventory
        if: inputs.pack_id == 'issue-2457-mutants-shards'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          cargo mutants --version | grep -Fx 'cargo-mutants 27.0.0'
          cargo mutants --workspace --no-config --no-shuffle --minimum-test-timeout=600 --sharding=round-robin --shard 0/1 --list --json > "${RUNNER_TEMP}/full-inventory.json"
          python3 scripts/verify_i2457_mutants_shards.py build-inventory \
            --raw "${RUNNER_TEMP}/full-inventory.json" \
            --sha "${EXPECTED_SHA}" --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --out "${RUNNER_TEMP}/inventory-manifest.json"
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        working-directory: candidate

      - name: Run issue 1677 B-170 owner-actions verifier
        id: python-b170-owner-actions
        if: inputs.pack_id == 'issue-1677-b170-owner-actions'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python3 -S scripts/verify_b170_owner_actions.py
          template=docs/internal/b170-owner-artifact-templates/legal-contract-disposition.md
          grep -Fq 'docs/customer/dpa-onboarding.md' "$template"
          grep -Fq 'lighthouse enterprise customer' "$template"
        working-directory: candidate

      - name: Verify pack contract and adversarial controls
        id: ci-pack-contract
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          TARGET_BASE_SHA: ${{ inputs.target_base_sha }}
          PACK_ID: ${{ inputs.pack_id }}
          TRUSTED_MAIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git -C candidate rev-parse HEAD)"
          python3 -S scripts/verify_ci_issue_packs.py \
            --candidate-sha "$EXPECTED_SHA" \
            --actual-sha "$ACTUAL_SHA" \
            --target-base-sha "$TARGET_BASE_SHA" \
            --trusted-main-sha "$TRUSTED_MAIN_SHA" \
            --pack-id "$PACK_ID" \
            --candidate-root candidate \
            --run-self-test
