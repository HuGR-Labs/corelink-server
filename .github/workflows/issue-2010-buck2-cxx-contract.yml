name: issue-2010 Buck2 public C++ rule contract

# Credentialless hosted contract for #2010.  This lane checks the pinned source
# and its mutation teeth only; it never downloads Buck2, reads a PAT, contacts
# CoreLink, or dispatches the long Buck2 starter workflow.
on:
  pull_request:
    paths:
      - "examples/buck2-starter/BUCK"
      - "examples/buck2-starter/.buckconfig"
      - "examples/buck2-starter/toolchains/BUCK"
      - ".github/workflows/buck2-starter-ci.yml"
      - ".github/workflows/issue-2010-buck2-cxx-contract.yml"
      - "scripts/verify_i2010_buck2_cxx.py"
      - "tests/test_i2010_buck2_cxx_contract.py"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: issue-2010-buck2-cxx-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: credentialless Buck2 C++ contract and mutations
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision without write credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify repository contract and mutation resistance
        run: python3 -S scripts/verify_i2010_buck2_cxx.py --self-test --json
      - name: Run focused Python regression
        run: python3 -S -m unittest tests/test_i2010_buck2_cxx_contract.py
