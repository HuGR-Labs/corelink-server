name: admin-ui — CF Worker deploy

# Stream 3.11 — deploys apps/admin-ui to the Cloudflare Worker
# (Worker name: corelink-admin-ui) on every push to main that touches the
# admin-ui subtree.
#
# Migrated Pages → Worker: @cloudflare/next-on-pages 1.13.7 cannot render
# Next 15 SSR with next-intl + middleware + ClerkProvider (every SSR route
# returned HTTP 500). The supported path is @opennextjs/cloudflare
# (`pnpm cf:build`) + `wrangler deploy` (`pnpm cf:deploy`), matching
# apps/admin-ui/wrangler.toml (main = .open-next/worker.js).
#
# Required GH Secrets:
#   CF_API_TOKEN          — Cloudflare API token with "Workers Scripts: Edit" permission
#   CF_ACCOUNT_ID         — Cloudflare account ID (HumanGuardrail)
#
# Required GH Variables (non-secret, set in repo Settings → Variables):
#   NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
#   NEXT_PUBLIC_CORELINK_API_URL        (https://corelink-api.humangr.com)
#   NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
#   NEXT_PUBLIC_SENTRY_DSN
#
# Runtime secrets (set once via `wrangler secret put` — NOT via this workflow):
#   CLERK_SECRET_KEY
#   STRIPE_SECRET_KEY
#   SENTRY_AUTH_TOKEN  (optional — enables source-map upload)
#
# Custom domain: bound directly to the Worker in apps/admin-ui/wrangler.toml
# (`routes = [{ pattern = "humangr.com", custom_domain = true }]`),
# so `wrangler deploy` provisions it — no manual Pages-dashboard step.

on:
  push:
    branches: [main]
    paths:
      - "apps/admin-ui/**"
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (production or preview)'
        required: false
        default: production
        type: choice
        options:
          - production
          - preview

permissions:
  contents: read
  deployments: write

concurrency:
  group: admin-ui-deploy-${{ github.ref }}
  cancel-in-progress: false  # don't cancel in-flight deploys; queue instead

jobs:
  build-and-deploy:
    name: build + deploy to CF Worker
    runs-on: ubuntu-latest
    # 40m (was 20m): the OpenNext build (next build + worker packaging) routinely
    # runs 18-20m on the shared self-hosted Mac under normal load, so a 20m cap
    # cancelled deploys mid-`Build for CF Worker`. 40m absorbs the variance.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/admin-ui

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      # cf:build = `opennextjs-cloudflare build` (next build + the OpenNext
      # Cloudflare adapter) — emits .open-next/worker.js + .open-next/assets.
      # Injects NEXT_PUBLIC_* vars at build time so Next.js can inline them
      # into client bundles. Server-side secrets (CLERK_SECRET_KEY etc.) are
      # NOT needed at build time — they are injected by the Worker runtime
      # via `wrangler secret put` (one-time operator step).
      - name: Build for CF Worker
        run: pnpm cf:build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_ENV: production
          # NEXT_PUBLIC_* vars inlined at build time.
          # Values sourced from GH Variables (non-secret).
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CORELINK_API_URL: ${{ vars.NEXT_PUBLIC_CORELINK_API_URL || 'https://corelink-api.humangr.com' }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          # Sentry source-map upload at build time (optional; no-op if unset).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: "corelink"
          SENTRY_PROJECT: "corelink-admin-ui"
          CSP_ENFORCEMENT: "enforce"

      # wrangler is not a dependency of apps/admin-ui, so `pnpm cf:deploy`
      # (= `wrangler deploy`) would otherwise fail with "wrangler: command not
      # found". Pin the global install to v4 to match cf-deploy-prod.yml
      # (v3 cannot parse [[env.*.containers]] arrays — verified 2026-06-05).
      - name: Install wrangler
        working-directory: .
        run: npm install -g wrangler@4.95.0  # pinned exact (audit 2026-06-11 Finding #4: no floating major)

      # Deploy the built Worker. `cf:deploy` = `wrangler deploy`, which reads
      # the Worker name (corelink-admin-ui), entrypoint (.open-next/worker.js),
      # assets, and the custom-domain route from apps/admin-ui/wrangler.toml.
      - name: Deploy to Cloudflare Worker
        run: pnpm cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Print deployment URL
        if: success()
        run: |
          echo "Deployed Worker: corelink-admin-ui"
          echo "Production URL: https://humangr.com"
          echo "Commit: ${{ github.sha }}"
