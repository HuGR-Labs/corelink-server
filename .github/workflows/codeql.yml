name: CodeQL (R-prep static analysis)

# GitHub CodeQL static analysis gate — pre-pentest engagement R-prep wave.
#
# Languages covered:
#   - rust (experimental CodeQL pack — explicitly enabled for the nightly scan).
#   - javascript-typescript (admin-ui + docs site + tooling).
#   - python (validate_specs.py, conformance harness, audit scripts).
#
# Triggers (CORRECTED 2026-08-01 — the list below had drifted away from the
# actual `on:` block, which is the drift that produced a false "every real diff
# is still gated on PR" claim in the CI-cost-diet review):
#   - schedule: DAILY 05:30 UTC. This is the ONLY automatic trigger.
#   - workflow_dispatch: manual trigger for on-call / pentest preparation re-run.
#   - there is NO `pull_request` lane and NO `push` lane — both were removed on
#     2026-06-02 when the heavy gates moved off per-PR. Nothing gates on CodeQL
#     between scheduled runs.
#
# Fail policy:
#   The severity gate below only fails on `pull_request` / `workflow_dispatch`.
#   Since there is no `pull_request` trigger, in practice only a dispatched run
#   can fail-closed on a HIGH/CRITICAL finding; scheduled runs surface findings
#   in the Security tab without blocking.
#
# CURRENT REALITY (verified 2026-08-30): hosted Actions jobs never received a
# runner because account billing was blocked. This lane now runs on the
# product-owned `corelink` fabric and therefore performs the scan even when
# Advanced Security is unavailable. The Security-tab upload remains an external
# owner capability; a retained SARIF artifact and the independent watchdog make
# that limitation visible instead of turning it into a green zero-scan.
#
# SARIF uploaded to the GHA Security tab (category per language) so the
# Security team can triage via the repo's central security dashboard.
#
# SHA-pinned per HIGH_RISK lane FF-HR-005 + ADR-S12-045 §6 tooling-pin
# policy. All three `github/codeql-action/*` refs below resolve to the verified
# CodeQL Action v4.37.1 commit `7188fc363630916deb702c7fdcf4e481b751f97a`.
# Keep the friendly version, env declaration, and SHA comment synchronized;
# version/SHA bumps require ADR + Security review (§14).
#
# Cross-refs:
#   - SOC2 rollup: CC8.1 (change management — static-analysis gate evidence).
#   - ROADMAP-TO-GA.md §7 Wave R-7 (Evidence Gate) — static-analysis baseline
#     is part of the GA-go evidence package consumed by PRR-S20-GA.
#   - Pre-pentest cutoff 2026-06-15 (specs/_pentest/scope.md).
#   - Runbook: specs/_runbooks/RB-STATIC-ANALYSIS-TRIAGE.md.

on:
  # Moved OFF per-PR 2026-06-02 to keep PRs fast (was a heavy gate). Runs
  # nightly + on-demand. There is NO `pull_request` lane — re-add one only if
  # this must block PRs again.
  #
  # Cadence: DAILY, deliberately KEPT (CI cost diet 2026-08-01 considered
  # daily -> weekly and rejected it). Two reasons:
  #   1. There is no `pull_request` lane, so weekly really would open a 7-day
  #      window with nothing compensating — on a launched product carrying
  #      auth + billing. The "the PR paths: lane still gates every diff"
  #      argument applies to s07/s08/s09/gc, NOT to this workflow.
  #   2. The saving did not justify that risk: with GHAS off the whole run
  #      bills 3 hosted minutes (see the header), so daily -> weekly buys
  #      ~66 min/month — ~2% of this repo's Actions bill.
  # Revisit only together with enabling GHAS: a full 3-language CodeQL run is
  # expensive, and at that point the correct lever is a paths-filtered
  # `pull_request` lane, not a longer cron interval.
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  # Required by github/codeql-action/analyze to upload SARIF.
  security-events: write
  # Required to checkout the code + read PR metadata for paths-filter.
  contents: read
  actions: read
  # Read-only PR context for path/severity comment links.
  pull-requests: read

concurrency:
  # A stable group also serializes manual dispatches from different refs. A
  # queued security scan is safer than cancelling the only nightly evidence.
  group: codeql-nightly
  cancel-in-progress: false

env:
  # Pinned CodeQL action release — bump via ADR + Security review.
  CODEQL_ACTION_VERSION: "v4.37.1"
  # CodeQL and cargo both default to all available CPUs. The corelink default
  # box is shared with other customer work, so keep this lane resource-bounded.
  CODEQL_THREADS: "2"
  CODEQL_RAM_MB: "4096"
  CARGO_BUILD_JOBS: "2"

jobs:
  analyze:
    name: CodeQL ${{ matrix.language }}
    # Manual dispatch is valid only from trusted main. Scheduled runs are
    # emitted by GitHub from the default branch.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    # Product-owned ephemeral Linux runner (zero GitHub-hosted billing). The
    # CodeQL bundle supports Linux x64 and the corelink image carries Python,
    # Node and the workspace-pinned Rust toolchain.
    runs-on: corelink
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Three CodeQL jobs otherwise contend for memory/egress on the fabric;
      # serializing the matrix preserves all languages without a stampede.
      max-parallel: 1
      matrix:
        include:
          # `queries` is per-language: the extended suites
          # (security-extended, security-and-quality) only exist for the
          # mature CodeQL packs (js/ts, python). The Rust pack
          # (codeql/rust-queries) ships NO `*-security-extended` /
          # `*-security-and-quality` suites — requesting them on the rust
          # leg fails init with "Query pack rust-security-extended cannot
          # be found". Rust therefore uses the empty/default query set
          # (codeql/rust-queries). Wired through `with: queries:` below.
          #
          # Rust is in experimental CodeQL support — enabled via the
          # `--language rust` opt-in. Build mode `manual` so cargo respects
          # the workspace toolchain pin (rust-toolchain.toml).
          - language: rust
            build-mode: manual
            queries: ""
          - language: javascript-typescript
            build-mode: none
            queries: security-extended,security-and-quality
          - language: python
            build-mode: none
            queries: security-extended,security-and-quality

    steps:
      - name: Checkout
        # actions/checkout v7.0.0 — SHA-pinned (matches the verified ref).
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7.0.0
        with:
          persist-credentials: false

      # -----------------------------------------------------------------
      # GHAS preflight distinguishes the documented disabled response from
      # auth/network/API failures. Only the former is a permitted disabled
      # state; all other failures fail closed rather than skipping analysis.
      # -----------------------------------------------------------------
      - name: GHAS code-scanning preflight
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          err_file="$(mktemp)"
          trap 'rm -f "${err_file}"' EXIT
          set +e
          gh api "repos/${REPOSITORY}/code-scanning/alerts" \
            --jq 'length' > /dev/null 2>"${err_file}"
          rc=$?
          set -e
          if [ "${rc}" -eq 0 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Code scanning is enabled — CodeQL will run."
          elif grep -Eiq 'advanced security.*(must be enabled|not enabled|disabled)|code[- ]scanning.*(not enabled|disabled)' "${err_file}"; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Code scanning is disabled for this repository — CodeQL will run and retain local evidence."
          else
            redacted="$(sed -E 's/(token|authorization|bearer|ghs_[[:alnum:]_-]+)/[REDACTED]/Ig' "${err_file}" | tr '\n' ' ' | cut -c1-400)"
            echo "::error::GHAS code-scanning preflight failed (auth/network/API); refusing to classify it as disabled. ${redacted}"
            exit 1
          fi

      # -----------------------------------------------------------------
      # Rust build prerequisites (only for the `rust` matrix leg).
      # CodeQL Rust analyser instruments cargo build artefacts; we install
      # the workspace-pinned toolchain + cache to keep the run < 30 min.
      # -----------------------------------------------------------------
      - name: Use workspace-pinned Rust toolchain (provisions nothing)
        if: matrix.language == 'rust'
        # `corelink` is self-hosted: dtolnay/rust-toolchain would mutate the
        # runner's shared ~/.rustup. This script reads rust-toolchain.toml and
        # fails loudly when the baked Linux toolchain is missing.
        env:
          HOST_TRIPLE: x86_64-unknown-linux-gnu
        run: bash scripts/ci-use-host-toolchain.sh

      - name: Initialize CodeQL
        # github/codeql-action/init v4.37.1 — verified SHA pin below.
        # Version/SHA bumps require ADR + Security review per §14; do not
        # replace this immutable ref with a mutable tag.
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a  # github/codeql-action/init@v4.37.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Per-language query suite (see `matrix.queries` above). For
          # js/ts + python this is `security-extended,security-and-quality`
          # to surface CWE-top-25 + OWASP-top-10 patterns beyond the default
          # "code-scanning" set; for rust it is empty (the Rust pack has no
          # extended suites), so codeql/rust-queries (the default) is used.
          queries: ${{ matrix.queries }}
          # CodeQL manages its dependency cache through the Actions cache
          # service. The corelink runner is ephemeral, so this does not touch
          # the shared Mac home/cache guarded elsewhere in the repository.
          dependency-caching: true
          threads: ${{ env.CODEQL_THREADS }}
          ram: ${{ env.CODEQL_RAM_MB }}

      # -----------------------------------------------------------------
      # Rust manual build — CodeQL traces the workspace cargo build to
      # build its CFG/dataflow facts. We compile with --all-targets to
      # cover bin + lib + tests + examples in one pass.
      # -----------------------------------------------------------------
      - name: Build Rust workspace (manual mode for CodeQL trace)
        if: matrix.language == 'rust'
        run: |
          cargo build --workspace --all-targets --locked

      - name: Perform CodeQL Analysis
        id: analyze
        # github/codeql-action/analyze@v4.37.1 — same verified SHA pin as init
        # above + semgrep.yml's upload-sarif.
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a  # github/codeql-action/analyze@v4.37.1
        with:
          category: "/language:${{ matrix.language }}"
          # Write the SARIF to a local dir for BOTH the severity gate below and
          # the (separate, non-fatal) upload step. `upload: never` so the
          # analysis is judged ONLY on whether the scan/build succeeded — NOT on
          # the GHAS-gated Security-tab upload, which is split out into the
          # best-effort step below (mirrors the tfsec pattern in
          # terraform-lint.yml). Previously `upload: always`, which folded the
          # upload into this step and reddened the whole job when GHAS was off.
          output: codeql-results
          upload: never

      # A successful job without a SARIF file is not a clean scan. This guard
      # runs even when the CodeQL action failed and writes a manifest that the
      # independent watchdog can prove was retained.
      - name: Require CodeQL SARIF evidence
        id: evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p codeql-results
          shopt -s nullglob
          sarif_files=(codeql-results/*.sarif)
          if (( ${#sarif_files[@]} == 0 )); then
            echo "::error::CodeQL emitted no SARIF for ${MATRIX_LANGUAGE}; scan evidence is missing."
            evidence_status=missing
          else
            echo "CodeQL emitted ${#sarif_files[@]} SARIF file(s) for ${MATRIX_LANGUAGE}."
            evidence_status=present
          fi
          export EVIDENCE_STATUS="${evidence_status}"
          python3 - <<'PYEOF' > codeql-results/run-manifest.json
          import json
          import os
          import sys

          manifest = {
              "schema_version": "1",
              "workflow": "codeql.yml",
              "language": os.environ["MATRIX_LANGUAGE"],
              "event": os.environ["EVENT_NAME"],
              "run_id": os.environ["RUN_ID"],
              "ref": os.environ["REF"],
              "scan_status": os.environ["ANALYZE_OUTCOME"],
              "evidence_status": os.environ["EVIDENCE_STATUS"],
              "ghas_enabled": os.environ["GHAS_ENABLED"],
          }
          json.dump(manifest, sys.stdout, indent=2)
          sys.stdout.write("\n")
          PYEOF
          echo "evidence_status=${evidence_status}" >> "$GITHUB_OUTPUT"
          if [[ "${evidence_status}" != present ]]; then
            exit 1
          fi
        env:
          MATRIX_LANGUAGE: ${{ matrix.language }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref }}
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
          GHAS_ENABLED: ${{ steps.preflight.outputs.enabled }}

      - name: Upload SARIF to GitHub Security tab
        # github/codeql-action/upload-sarif@v4.37.1 — same verified SHA pin as
        # init/analyze above (matches semgrep.yml).
        #
        # SARIF upload requires GitHub Advanced Security (code scanning), which
        # is NOT enabled on this private repo — the upload returns "Code scanning
        # is not enabled for this repository" and would otherwise red the whole
        # CodeQL job even though the scan above passed. `continue-on-error` keeps
        # the JOB status driven by the actual CodeQL scan + severity gate; until
        # GHAS is enabled this upload no-ops without failing the gate. The scan
        # still runs. Once GHAS is enabled the SARIF populates the Security tab
        # with no further change.
        continue-on-error: true
        id: upload
        if: always() && steps.evidence.outputs.evidence_status == 'present'
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a  # github/codeql-action/upload-sarif@v4.37.1
        with:
          # Directory of per-language SARIF emitted by the analyze step above.
          sarif_file: codeql-results
          category: "/language:${{ matrix.language }}"

      - name: Retain CodeQL SARIF evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7.0.1
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: codeql-results
          retention-days: 90
          if-no-files-found: error

      - name: Report Security-tab upload status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          upload_outcome="${UPLOAD_OUTCOME}"
          {
            echo "## CodeQL evidence"
            echo ""
            echo "- Language: \`${MATRIX_LANGUAGE}\`"
            echo "- SARIF artifact: \`codeql-sarif-${MATRIX_LANGUAGE}\` (90 days)"
            if [[ "${upload_outcome}" == failure ]]; then
              echo "- Security-tab upload: **unavailable** (owner must enable Advanced Security)"
              echo "::warning::CodeQL scan evidence is retained, but the Security-tab upload was unavailable; follow the B-142 action packet."
            elif [[ "${upload_outcome}" == skipped ]]; then
              echo "- Security-tab upload: **not attempted** because scan evidence was missing"
            else
              echo "- Security-tab upload: **${upload_outcome}**"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
        env:
          MATRIX_LANGUAGE: ${{ matrix.language }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}

      # -----------------------------------------------------------------
      # Severity gate — fail the PR if any finding ≥ HIGH (security-severity
      # >= 7.0 in SARIF) appears in the current run.
      #
      # On schedule/push to main we surface findings but never auto-fail
      # the cron — the Security tab + Slack notification handles triage.
      # -----------------------------------------------------------------
      - name: Severity gate (fail PR on HIGH/CRITICAL)
        if: steps.evidence.outputs.evidence_status == 'present' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        run: |
          set -euo pipefail
          shopt -s nullglob
          sarif_files=(codeql-results/*.sarif)
          if [[ ${#sarif_files[@]} -eq 0 ]]; then
            echo "::error::No SARIF emitted by CodeQL — refusing to assume a clean run."
            exit 1
          fi
          python3 - <<'PYEOF'
          import glob
          import json
          import os
          import sys

          THRESHOLD = 7.0  # CVSS-style: HIGH starts at 7.0, CRITICAL at 9.0.
          high_or_critical = []

          for path in glob.glob("codeql-results/*.sarif"):
              with open(path) as f:
                  sarif = json.load(f)
              for run in sarif.get("runs", []):
                  tool = run.get("tool", {}).get("driver", {}).get("name", "codeql")
                  # Build a lookup of rule -> security-severity score.
                  rules = {}
                  for rule in run.get("tool", {}).get("driver", {}).get("rules", []):
                      props = rule.get("properties", {}) or {}
                      sev_raw = props.get("security-severity")
                      try:
                          rules[rule.get("id")] = float(sev_raw) if sev_raw is not None else 0.0
                      except (TypeError, ValueError):
                          rules[rule.get("id")] = 0.0
                  for result in run.get("results", []):
                      rule_id = result.get("ruleId", "unknown")
                      score = rules.get(rule_id, 0.0)
                      if score >= THRESHOLD:
                          loc = "unknown"
                          locs = result.get("locations", [])
                          if locs:
                              pl = locs[0].get("physicalLocation", {})
                              uri = pl.get("artifactLocation", {}).get("uri", "?")
                              line = pl.get("region", {}).get("startLine", "?")
                              loc = f"{uri}:{line}"
                          msg = result.get("message", {}).get("text", "")
                          high_or_critical.append({
                              "tool": tool,
                              "rule": rule_id,
                              "severity": score,
                              "location": loc,
                              "message": msg,
                          })

          summary = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")
          with open(summary, "a") as f:
              f.write("## CodeQL severity gate\n\n")
              f.write(f"- HIGH+CRITICAL findings: **{len(high_or_critical)}**\n\n")
              for v in high_or_critical:
                  f.write(f"- `{v['rule']}` (sev={v['severity']}) at `{v['location']}` — {v['message']}\n")

          if high_or_critical:
              print(f"::error::CodeQL gate: {len(high_or_critical)} HIGH/CRITICAL findings")
              for v in high_or_critical:
                  print(f"::error file={v['location']}::{v['rule']} (sev={v['severity']}): {v['message']}")
              sys.exit(1)
          print("CodeQL gate: clean (no HIGH/CRITICAL findings).")
          PYEOF
