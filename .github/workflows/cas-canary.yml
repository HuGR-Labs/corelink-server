name: cas-datacenter-canary
# Real-client drift canary: asserts the CAS API answers an AUTHENTICATED BLAKE3
# round-trip 2xx from a NON-residential IP — the customer's CI environment.
# Catches the class of drift that is invisible to every existing gate + the
# unauthenticated /health probes: Cloudflare edge policy (Bot Fight Mode / WAF
# rate-limit) blocking datacenter IPs, a digest-algo regression, or a route
# break. If this goes red, real customer CI cannot use the cache.
#   See docs/operator/edge-security-per-plane-sota.md + memory edge-security-blocked-datacenter-ci.
#
# TWO vantage points, because they do not prove the same thing:
#
#   fabric  — historical job id retained for workflow compatibility; this
#             migrated job now runs from a GitHub-hosted datacenter and cannot
#             claim the CoreLink-fabric vantage.
#   hosted  — `ubuntu-latest`, a GitHub-owned datacenter IP genuinely outside
#             our provider. This is the probe that actually answers the
#             question the canary was built for.
#
# 2026-08-24: hosted Actions are payment-blocked again (job never starts:
# ~2s, `runner: ""`, 0 steps, "recent account payments have failed"). The
# hosted job went red 9 times in a row and the fabric half was not running at
# all, so the ONLY probe of the cache's real-client path was dark. The hosted
# job is therefore gated behind `vars.HOSTED_ACTIONS_AVAILABLE == 'true'`
# (unset today) rather than left to fail hourly — a monitor that cannot start
# is not a monitor, and an hourly red that everyone learns to ignore is worse
# than an honest absence. Flip the variable to `true` the moment billing is
# restored; that is the one action that brings the datacenter probe back.
on:
  schedule:
    # HOURLY — deliberately KEPT (the CI cost diet 2026-08-01 proposed every-4h
    # and the proposal was REJECTED on review).
    #   - Real cost is NOT ~720 min/month. Measured 2026-07-15..21, GitHub
    #     drops scheduled runs under load: 10-13 dispatches/day, not 24, each
    #     ~10s = 1 billable min under the per-job floor -> ~340 min/month.
    #   - Moving to every 4h would save ~185 min/month (~9% of the Free
    #     allowance) in exchange for 4x the detection window on a LAUNCHED
    #     product.
    #   - It is not theoretical: this canary caught a real production CAS
    #     outage on 2026-08-01 (two consecutive failures, R2 binding disabled).
    # Staggered off :00.
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/cas-canary-roundtrip.sh"
      - ".github/workflows/cas-canary.yml"
  pull_request:
    paths:
      - "scripts/cas-canary-roundtrip.sh"
      - ".github/workflows/cas-canary.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cas-canary
  cancel-in-progress: false
jobs:
  fabric:
    name: CAS round-trip (GitHub-hosted datacenter IP)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Authenticated CAS BLAKE3 round-trip against prod
        env:
          PAT: ${{ secrets.CORELINK_CANARY_PAT }}
          API: https://corelink-api.humangr.com
          TEN: 93da3f7a-984d-4ef9-86e0-b0bd9fd0252e   # dedicated canary tenant (unmetered $1M; decoupled from the paused githugr/hugit d863fafb dogfood)
          CANARY_VANTAGE: github-hosted-datacenter
          RUN_TAG: ${{ github.run_id }}-${{ github.run_attempt }}-fabric
        run: bash scripts/cas-canary-roundtrip.sh

  hosted:
    name: CAS round-trip (third-party datacenter IP)
    # Gated: see the header. Unset today because hosted Actions cannot start.
    if: vars.HOSTED_ACTIONS_AVAILABLE == 'true'
    runs-on: ubuntu-latest          # datacenter IP genuinely outside our provider
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Authenticated CAS BLAKE3 round-trip against prod
        env:
          PAT: ${{ secrets.CORELINK_CANARY_PAT }}
          API: https://corelink-api.humangr.com
          TEN: 93da3f7a-984d-4ef9-86e0-b0bd9fd0252e
          CANARY_VANTAGE: github-hosted-datacenter
          RUN_TAG: ${{ github.run_id }}-${{ github.run_attempt }}-hosted
        run: bash scripts/cas-canary-roundtrip.sh
