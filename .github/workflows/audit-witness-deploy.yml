name: audit-witness-deploy

# Manual exact-SHA deployment only. The `audit-witness-production` GitHub
# environment must be owned by Security and contain credentials for a
# Cloudflare account distinct from CoreLink production.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main SHA approved for witness deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: audit-witness-production
  cancel-in-progress: false

jobs:
  deploy:
    environment: audit-witness-production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Require exact main SHA and independent account
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
          ACTUAL_REF: ${{ github.ref }}
          WITNESS_ACCOUNT: ${{ secrets.AUDIT_WITNESS_CF_ACCOUNT_ID }}
          CORELINK_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          WITNESS_DOMAIN: ${{ vars.AUDIT_WITNESS_DOMAIN }}
        run: |
          set -euo pipefail
          test "${ACTUAL_REF}" = "refs/heads/main"
          test "${EXPECTED_SHA}" = "${ACTUAL_SHA}"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "${EXPECTED_SHA}" = "$(git rev-parse refs/remotes/origin/main)"
          test -n "${WITNESS_ACCOUNT}"
          test -n "${CORELINK_ACCOUNT}"
          test "${WITNESS_ACCOUNT}" != "${CORELINK_ACCOUNT}"
          grep -Eq '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$' <<<"${WITNESS_DOMAIN}"

      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v4.1.0
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @corelink/audit-witness-worker...
      - run: pnpm --filter @corelink/audit-witness-worker typecheck
      - run: pnpm --filter @corelink/audit-witness-worker test
      - run: pnpm --filter @corelink/audit-witness-worker test:workerd

      - name: Require pre-provisioned witness secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.AUDIT_WITNESS_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.AUDIT_WITNESS_CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          names="$(pnpm --filter @corelink/audit-witness-worker exec wrangler secret list --config wrangler.toml | jq -r '.[].name')"
          grep -Fxq WITNESS_APPEND_TOKEN <<<"${names}"
          grep -Fxq WITNESS_RECEIPT_SIGNING_SEED_HEX <<<"${names}"

      - name: Deploy independent witness
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.AUDIT_WITNESS_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.AUDIT_WITNESS_CF_ACCOUNT_ID }}
          WITNESS_DOMAIN: ${{ vars.AUDIT_WITNESS_DOMAIN }}
        run: pnpm --filter @corelink/audit-witness-worker exec wrangler deploy --config wrangler.toml --domain "${WITNESS_DOMAIN}"
