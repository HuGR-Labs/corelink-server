name: issue-1678 B-216 DSR DLQ receipt contract

on:
  pull_request:
    paths:
      - "apps/signup-worker/src/webhooks/dsr_consumer.ts"
      - "apps/signup-worker/src/index.ts"
      - "apps/signup-worker/tests/dsr_consumer.test.ts"
      - "migrations/d1/0138_dsr_dlq_delivery_receipts.sql"
      - "migrations/d1/0145_dsr_dlq_redrive_authority.sql"
      - "docs/internal/b215-b230-runtime-owner-actions.md"
      - "BACKLOG.md"
      - ".github/workflows/issue-1678-b216-dsr-dlq.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dlq-receipt-contract:
    # This intentionally stays on GitHub-hosted infrastructure: it validates
    # only the B-216 consumer contract and has no Cloudflare credentials.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact requested head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install pinned signup-worker dependencies
        run: pnpm install --frozen-lockfile --filter @corelink/signup-worker... --ignore-scripts
      - name: Exercise B-216 DSR DLQ receipt contract
        run: pnpm --dir apps/signup-worker exec vitest run tests/dsr_consumer.test.ts
      - name: Prove B-216 static mutations break redrive invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("apps/signup-worker/src/webhooks/dsr_consumer.ts").read_text()
          required = (
              "constantTimeEqual(token, expected)",
              "state='ready' AND requeue_count=0 AND expires_at_ms>?5",
              "!redrive || !await redrive.capture(eventId, body, Date.now())",
              "await store.fence(eventId, Date.now())",
              "INSERT OR IGNORE INTO dsr_dlq_redrive_audit",
          )
          assert all(marker in source for marker in required)
          PY
