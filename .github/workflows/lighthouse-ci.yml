name: admin-ui lighthouse

# WI-S16-007 deliverable 2 — Lighthouse CI gate.
# Asserts Performance ≥ 95, Accessibility = 100, Best Practices ≥ 95,
# SEO ≥ 90 across the 4 most-visited admin-ui routes. Score < threshold
# fails the PR per spec contract S-16 §6 DoD + 14.s16.5.

on:
  pull_request:
    paths:
      - "apps/admin-ui/**"
      - ".github/workflows/lighthouse-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/admin-ui/**"
      - ".github/workflows/lighthouse-ci.yml"
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-ui-lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lhci:
    name: lighthouse-ci (≥ 95)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/admin-ui
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_E2E_TEST_MODE: "1"
      CSP_ENFORCEMENT: enforce
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v4.1.0
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run Lighthouse CI
        run: pnpm lhci

      - name: Upload LHCI report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lhci-report
          path: apps/admin-ui/.lighthouseci/
          retention-days: 14
