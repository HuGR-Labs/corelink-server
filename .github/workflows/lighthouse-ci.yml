name: admin-ui lighthouse

# WI-S16-007 deliverable 2 — Lighthouse CI gate.
# Asserts Performance ≥ 95, Accessibility = 100, Best Practices ≥ 95,
# SEO ≥ 90 across the 4 most-visited admin-ui routes. Score < threshold
# fails the PR per spec contract S-16 §6 DoD + 14.s16.5.

on:
  pull_request:
    paths:
      - "apps/admin-ui/**"
      - ".github/workflows/lighthouse-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/admin-ui/**"
      - ".github/workflows/lighthouse-ci.yml"
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-ui-lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lhci:
    name: lighthouse-ci (≥ 95)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/admin-ui
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_E2E_TEST_MODE: "1"
      CSP_ENFORCEMENT: enforce
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run Lighthouse CI
        run: pnpm lhci

      - name: Upload LHCI report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lhci-report
          path: apps/admin-ui/.lighthouseci/
          retention-days: 14

      - name: Reap orphaned LHCI server + headless Chrome
        if: always()
        shell: bash
        run: |
          # LHCI's startServerCommand brings up a standalone `node server.js`
          # (:3000) and spawns headless Chrome. This gate uses concurrency
          # cancel-in-progress:true, and the shared self-hosted Mac gets sieged,
          # so runs are frequently cancelled mid-flight — LHCI then can't tear
          # its children down and they reparent to launchd, piling up across
          # days (observed: a 6-day-old 186 MB server + 18 stranded Chrome).
          # Reap ONLY orphaned (PPID == 1) leftovers: a live sibling runner's
          # job never has PPID == 1, so this is safe on the shared host and is
          # self-healing — each run also sweeps prior runs' orphans. always()
          # runs on cancellation too.
          set +e
          n=0
          for pid in $(pgrep -f 'standalone/apps/admin-ui/server\.js') \
                     $(pgrep -f 'Google Chrome.*--headless'); do
            [ "$(ps -o ppid= -p "$pid" 2>/dev/null | tr -d ' ')" = "1" ] \
              && kill -9 "$pid" 2>/dev/null && n=$((n + 1))
          done
          echo "Reaped $n orphaned LHCI process(es)."
          exit 0
