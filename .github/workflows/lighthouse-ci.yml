name: admin-ui lighthouse

# WI-S16-007 deliverable 2 — Lighthouse CI gate.
# Asserts Performance ≥ 95, Accessibility = 100, Best Practices ≥ 95,
# SEO ≥ 90 across the 4 most-visited admin-ui routes. Score < threshold
# fails the PR per spec contract S-16 §6 DoD + 14.s16.5.

on:
  pull_request:
    paths:
      - "apps/admin-ui/**"
      - ".github/workflows/lighthouse-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/admin-ui/**"
      - ".github/workflows/lighthouse-ci.yml"
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-ui-lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lhci:
    name: lighthouse-ci (≥ 95)
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/admin-ui
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_E2E_TEST_MODE: "1"
      CSP_ENFORCEMENT: enforce
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v4.1.0
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run Lighthouse CI
        run: pnpm lhci

      - name: Upload LHCI report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lhci-report
          path: apps/admin-ui/.lighthouseci/
          retention-days: 14
