name: pnpm-audit (supply-chain)

# Supply-chain gate: npm/pnpm advisory scan on every PR that touches JS/TS
# lockfiles or package manifests, plus a daily cron for continuous monitoring.
#
# PR mode  : `pnpm audit --prod --audit-level high` — blocking on HIGH+ prod
#             advisories (BLOCKING on the prod graph since 2026-06-11; the
#             TODO(flip-to-blocking) until the npm-advisories-override PR
#             that clears the 10 known prod vulns lands; flip at that point).
# Full scan: `pnpm audit` (all deps incl. dev) — non-blocking (continue-on-error:
#             true); surfaces dev-graph advisories for visibility without
#             breaking the gate on tooling-only vulns.
#
# Advisory waivers: add the GHSA/npm advisory IDs to the `pnpm.auditConfig.ignoreCves`
# array in the root `package.json`. EACH entry MUST be accompanied by an
# ADR-style comment in the PR description explaining the rationale +
# compensating control, mirroring the `.cargo/audit.toml` ignore policy for
# Rust advisories. To add a waiver:
#   1. Open a PR that modifies package.json + pnpm-lock.yaml.
#   2. Add the CVE/GHSA id to `pnpm.auditConfig.ignoreCves`.
#   3. Include the ADR note in the PR body: risk, compensating control, expiry.
#   4. Get Security + Owner sign-off before merge.
#
# ⚠  TODO(flip-to-blocking): The `pnpm audit --prod --audit-level high` step
# below is BLOCKING (flipped 2026-06-11 when the prod graph reached 0 vulns)
# in the current prod dependency graph that have not yet been resolved. Once
# the npm-advisories-override PR (resolving/suppressing those 10 known prod
# vulns via `pnpm.auditConfig.ignoreCves`) lands on main, flip that step to
# `continue-on-error: false` (or remove the key entirely — false is the
# default) to make this a hard gate. Track: search for
# "TODO(flip-to-blocking)" in this file.
#
# Runner: self-hosted (this private repo has no GitHub-hosted runners; the
#         ubuntu-latest attempt 2s-failed with 'no runner'). Pure registry
#         call — light on the Mac; runs sequentially after heavier jobs.
# (pnpm install --frozen-lockfile + pnpm audit). Sending it to the self-hosted
# Mac would waste a CI slot and contribute to the Mac-overload problem
# (load 398/665 recorded 2026-06-04; see cargo-audit.yml note). No compilation
# or platform-specific tooling is needed here.
#
# SHA-pinned per HIGH_RISK lane FF-HR-005 + ADR-S12-045 §6 tooling-pin policy.
# Bump of any action SHA requires ADR + Security review.

on:
  pull_request:
    paths:
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'apps/**/package.json'
      - 'worker/package.json'
      - 'crates/corelink-wasm/package.json'
      - '.github/workflows/pnpm-audit.yml'
  schedule:
    # Daily at 03:47 UTC — staggered from other nightlies:
    #   03:00 neon-shadow-reconcile + terraform-drift
    #   03:17 fuzz-nightly + perf-nightly
    #   03:17 sbom (Tue only)
    # 03:47 is the next clear slot in this band; npm advisory DB is
    # typically refreshed well before 03:00 UTC.
    - cron: '47 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------------
  # Advisory scan: blocking on HIGH+ prod advisories, non-blocking on full.
  # Runs on the self-hosted fleet — pure registry call, no compilation.
  # -----------------------------------------------------------------------
  pnpm-audit:
    name: pnpm advisory audit
    # self-hosted: this job only calls the npm registry + parses JSON.
    # Do NOT route to [self-hosted, mac, corelink-builder] — that fleet is
    # shared with all Rust build jobs and the Mac cannot afford idle network
    # slots (ref: cargo-audit.yml "stop heavy-gate stampede" note).
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4.1.0
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (frozen, no scripts)
        # --frozen-lockfile: abort if pnpm-lock.yaml would change (lockfile
        #   drift is itself a supply-chain signal).
        # --ignore-scripts: do not execute lifecycle scripts (install/postinstall)
        #   from any dependency — defense-in-depth against malicious packages
        #   that run code at install time (e.g. protestware, supply-chain
        #   injections). The audit is purely advisory-DB lookup; we do not
        #   need a fully linked node_modules.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: pnpm audit — prod HIGH+ (blocking gate)
        # Scans only production dependencies (--prod) at HIGH or above severity
        # (--audit-level high). This is the fail-closed gate that blocks a PR
        # when a HIGH/CRITICAL advisory is present in the runtime dep graph.
        #
        # One retry on failure before surfacing the error — `pnpm audit` hits
        # the npm registry and a transient 5xx should not burn a PR slot.
        #
        # Blocking since 2026-06-11: the prod graph reached 0 known
        # vulnerabilities (npm-prod-advisories overrides PR). New prod
        # advisories now RED this gate; waiver = pnpm.auditConfig.ignoreCves.
        run: |
          attempt=0
          until pnpm audit --prod --audit-level high || [ $attempt -ge 1 ]; do
            attempt=$((attempt + 1))
            echo "::warning::pnpm audit (prod) attempt $attempt failed — retrying once (possible registry 5xx)"
            sleep 5
          done
          if [ $attempt -ge 1 ]; then
            pnpm audit --prod --audit-level high
          fi

      - name: pnpm audit — full dep graph (non-blocking, visibility only)
        # Scans ALL dependencies including dev/test tooling. Non-blocking:
        # dev-only advisories (e.g. jest, eslint plugins) should not fail a
        # production gate but MUST be visible so they are eventually resolved.
        # Findings appear in the job log and step summary.
        continue-on-error: true
        run: pnpm audit
