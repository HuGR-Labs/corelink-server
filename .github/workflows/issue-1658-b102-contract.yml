name: issue-1658 B-102 credentialless contract

# Repository-only gate. This workflow validates the staging lane's safety and
# attribution contract; it never dispatches the lane and has no credentials.
on:
  pull_request:
    paths:
      - ".github/workflows/issue-1658-b102-contract.yml"
      - ".github/workflows/issue-1658-b102-cargo-put.yml"
      - "evidence/owner-actions/B-102/hot-cargo-put-contract.json"
      - "scripts/probe_i1658_cargo_put_latency.py"
      - "scripts/verify_i1658_b102_contract.py"
      - "tests/test_probe_i1658_cleanup.py"
      - "specs/_runbooks/RB-B102-HOT-CARGO-PUT.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/issue-1658-b102-contract.yml"
      - ".github/workflows/issue-1658-b102-cargo-put.yml"
      - "evidence/owner-actions/B-102/hot-cargo-put-contract.json"
      - "scripts/probe_i1658_cargo_put_latency.py"
      - "scripts/verify_i1658_b102_contract.py"
      - "tests/test_probe_i1658_cleanup.py"
      - "specs/_runbooks/RB-B102-HOT-CARGO-PUT.md"

permissions:
  contents: read

concurrency:
  group: issue-1658-b102-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: B-102 credentialless static contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact tree without write credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify B-102 staging boundary and attribution contract
        run: python3 -S scripts/verify_i1658_b102_contract.py
      - name: Verify cleanup on failed and ambiguous writes
        run: python3 -S -m unittest discover -s tests -p test_probe_i1658_cleanup.py -v
