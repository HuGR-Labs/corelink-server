name: Spec Validation (Lote 9.5c)

# Runs spec validation gates per Lote 9.5b/c CI hardening:
# - validate_references.py: cross-reference IDs (CTRL/PAT/INV/FM/EVT/RB/ADR/SLO/FF-HR/WAIVER)
# - validate_specs.py: YAML front matter + JSON Schema validation
# - check_tla_obligations.py: TLA+ obligation matrix consistency
# - check_error_taxonomy.py: error_taxonomy.md schema instantiation
# - check_cost_regression.py: §14.10 universal cost regression gate adoption

on:
  pull_request:
    paths:
      - 'specs/**'
      - 'scripts/validate_*.py'
      - 'scripts/check_*.py'
      - '.github/workflows/spec_validation.yml'
  push:
    branches: [main]
    paths:
      - 'specs/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  spec-validation:
    runs-on: [self-hosted, mac, corelink-builder]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # actions/checkout@v6.0.3

      # No actions/setup-python: the self-hosted mac fleet can't reliably
      # provision Python via setup-python (RUNNER_TOOL_CACHE is unset → it
      # falls back to the unwritable /Users/runner hosted path and dies with
      # `mkdir: /Users/runner: Permission denied`). We use the system `python3`
      # (ships on every runner) and isolate the jsonschema/pyyaml deps in a
      # repo-local venv. Adding the venv's bin to $GITHUB_PATH makes the
      # `python3` in every subsequent step resolve to the venv. (2026-06-03)
      - name: Install dependencies (venv on system python3)
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python3 -m pip install --upgrade pip
          .venv/bin/python3 -m pip install -r requirements-ci.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Validate references (CTRL/PAT/INV/FM/EVT/RB/ADR/SLO)
        run: python3 scripts/validate_references.py

      - name: Validate specs (YAML front matter + JSON Schema)
        run: python3 scripts/validate_specs.py

      - name: Check TLA+ obligations matrix
        run: python3 scripts/check_tla_obligations.py
        # NOTE: warnings (forward-looking PLANNED specs) are OK; errors block.

      - name: Check error_taxonomy.md schema + domain coverage
        run: python3 scripts/check_error_taxonomy.py

      - name: Check cost regression gate adoption
        run: python3 scripts/check_cost_regression.py

      - name: GA-readiness DEFER drift detector (wave-25 advisory)
        # Catches stale DEFER rows (e.g. GHA-billing / CI-offline framings)
        # that contradict the `feedback_ci_local` stance. Exits 1 on drift.
        run: python3 scripts/ga-readiness-defer-drift.py

      - name: RACI sign-off SLA advisory (wave-26)
        # Parses §6 RACI matrix detail from the framework reviewer roles
        # addendum and emits an advisory conformance line consumed by the
        # quarterly framework review delta-doc (addendum §3.4). Advisory
        # only — exits 0 even when SLA breaches detected. Wave-26 closure
        # per `specs/_audits/sealed/2026-05-16-lote-7-followons-closure.md`.
        run: python3 scripts/check-raci-sla.py --dry-run
