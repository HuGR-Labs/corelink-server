name: Nightly extended gates (WI-S01-007)

# Sprint-level nightly workflow per WI-S01-007 §6.1.2.
# Adds extended-bound runs that are too costly for per-PR gating:
#
#   1. tlc-extended: TLC v1.8.0 SHA-256 pinned, **extended bounds**
#      (per WI §6.1.7 nightly column) on the 4 canonical S-01 specs.
#      Hard 30-min timeout per spec; fail-closed.
#   2. proptest-extended: proptest 100k iter (vs 10k on PR) for the
#      cross-component property tests in corelink-reapi (WI-S01-006).
#   3. fuzz-matrix: parallel matrix runner for ALL 9 fuzz targets across
#      the 5 S-01 SEALed crates, 1h each. Runs in parallel via `strategy.matrix`.
#   4. mutants-workspace: cargo-mutants on the workspace; default fail-on-
#      any-survivor mode, i.e. effective 100% kill-rate requirement (the
#      sprint corpus is small enough that there's no headroom for survivors;
#      stricter than the per-WI 80% baseline by design).
#
# All gates fail-closed (HIGH_RISK lane FF-HR-005).

on:
  schedule:
    # 04:23 UTC nightly — staggered relative to per-crate nightly crons
    # (which fire at :17, :37, :47, :53). This workflow runs LAST so its
    # failures surface clearly.
    - cron: '23 4 * * *'
  workflow_dispatch:
    # Manual trigger for ops/dev to re-run nightly on demand (e.g. after a
    # PR landing flagged in nightly post-mortem).

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------
  # 1. TLC extended bounds (per WI §6.1.7 nightly column).
  # Each spec gets a 30-min hard timeout; failures (timeout, deadlock,
  # invariant violation) fail the job — no warning-only.
  # ---------------------------------------------------------------------
  tlc-extended:
    name: TLC extended (${{ matrix.spec }})
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        spec:
          - tenant_isolation
          - cas_integrity
          - gc_correctness
          - audit_immutability
          - billing_atomicity
          # Added R-PREP 2026-05-15 — closes auth-revocation cluster
          # (INV-AUTH-REVOCATION-IDEMPOTENT/-SLO-60S/-MASS-REVOKE-ATOMIC
          # + INV-AUTH-PROPAGATION-AT-LEAST-ONCE). See
          # `specs/_audits/sealed/2026-05-15-tla-coverage-audit.md`.
          - auth_revocation
          # DEBT-005 batch 1 closure 2026-05-15 — 5 new specs (5/40 critical
          # INV-no-TLA gaps). See specs/_audits/sealed/2026-05-15-debt-register.md.
          - auth_jwt_validation
          - tenant_ctx_propagation
          - merkle_integrity
          - byok_envelope_aad
          - failover_no_split_brain
          # DEBT-014 partial closure 2026-05-15 — 3 new specs closing FT-1,
          # FT-2, FT-5 from `specs/_audits/sealed/tla-followup-tickets.md`.
          - auth_pat_hybrid
          - key_lifecycle
          - gc_lock_protocol
          # DEBT-005 batch 2 closure 2026-05-15 — 5 more specs (10/47 cumulative
          # — drops critical_no_tla 35 → 30). Closes INV-ROLLOUT-COSIGN-GATE +
          # INV-SUPPLY-SIGNED-DEPLOY (runtime) + INV-BACKUP-RESTORE-EPHEMERAL +
          # INV-GC-SWEEP-AUDIT-FAIL-CLOSED + INV-GC-RECONCILE-AUDIT-FAIL-CLOSED
          # + INV-AC-EVICT-REGION-PINNED + INV-AC-EVICT-TENANT-SCOPED +
          # INV-AUDIT-EMIT-ATOMIC-WITH-HANDLER.
          - rollout_cosign_gate
          - backup_restore_ephemeral
          - gc_sweep_audit_fail_closed
          - ac_eviction_isolation
          - audit_emit_atomic
          # DEBT-005 batch 3 closure 2026-05-15 — 5 more specs (18/47 cumulative
          # — drops critical_no_tla 34 → 26 INV-granularity; tla_verified
          # 33 → 49). Closes INV-OBS-NO-PII + INV-OFFBOARDING-AUDIT-COMPLETE +
          # INV-OFFBOARDING-GRACE-RESPECTED + INV-BILLING-CHAIN-INTEGRITY +
          # INV-GC-GRACE-BOUNDARY-STRICT + INV-GC-MARK-TENANT-SCOPED +
          # INV-GC-SWEEP-TENANT-SCOPED + INV-BACKUP-FRESH +
          # INV-BACKUP-INTEGRITY-SAMPLE-CAP.
          - obs_no_pii
          - offboarding_audit_complete
          - billing_chain_integrity
          - gc_grace_boundary
          - backup_fresh
          # DEBT-005 batch 4 closure 2026-05-15 — 5 more specs (23/47 cumulative
          # — drops critical_no_tla 26 → 16 INV-granularity; tla_verified
          # 49 → 59). Closes INV-AC-DIGEST-SIGNED + INV-AC-MERKLE-DETERMINISTIC +
          # INV-AC-TENANT-SCOPED + INV-AUTH-WEBAUTHN-ORIGIN-EXACT +
          # INV-AUTH-WEBAUTHN-RP-ID-CANONICAL + INV-DIGEST-VERIFICATION +
          # INV-GC-MARK-STARTED-AT-ATOMIC + INV-GC-MARK-STARTED-AT-IMMUTABLE +
          # INV-MULTIPART-CHUNK-DETERMINISTIC + INV-MULTIPART-PATH-TENANT-SCOPED.
          - ac_integrity
          - webauthn_origin
          - digest_verification
          - gc_mark_started_at
          - multipart_determinism
          # DEBT-005 batch 5 closure 2026-05-15 — 5 more specs (28/47 cumulative
          # — drops critical_no_tla 16 → 6 INV-granularity; tla_verified
          # 59 → 71). Closes INV-AUDIT-NO-RAW-PII + INV-NO-PII-IN-LOGS +
          # INV-NO-BODY-IN-LOGS + INV-AUTH-PAT-PLAINTEXT-NEVER-PERSISTED +
          # INV-AUTH-WEBAUTHN-UV-REQUIRED-ADMIN +
          # INV-AUTH-WEBAUTHN-ATTESTATION-VERIFIED + INV-CAS-IMMUTABILITY +
          # INV-CAS-IDEMPOTENCY + INV-CAS-CORRECTNESS +
          # INV-AUTH-SCHEMA-RLS-DEFAULT-ON + INV-AUTH-PII-ENCRYPTED.
          - audit_no_raw_pii
          - auth_pat_plaintext_never_persisted
          - auth_webauthn_uv_admin
          - cas_immutability
          - auth_schema_rls_default_on
          # DEBT-005 batch 6 FINAL closure 2026-05-15 — last 5 specs closing
          # CRITICAL INV-no-TLA gaps; drops critical_no_tla 5 → 0 (DEBT-005
          # SEALED); tla_verified 71 → 76. Closes INV-AUTH-AUDIT-PSEUDONYMIZATION
          # + INV-AUTH-CONSTANT-TIME-COLD-PAD + INV-CONSENT-PROOF-VERIFIABLE +
          # INV-GC-REACHABLE-SET-COMPLETE + INV-SUB-PROCESSOR-AUDIT-FAIL-CLOSED.
          - auth_audit_pseudonymization
          - auth_constant_time_cold_pad
          - consent_proof_verifiable
          - gc_reachable_set_complete
          - sub_processor_audit_fail_closed
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Java (TLC requires JVM)
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install pinned TLC v1.8.0 (SHA-256 verified — ADR-0042 §A1)
        env:
          TLC_VERSION: '1.8.0'
          TLC_SHA256_PINNED: 'd5d07d5dab38ddb840c91ec48fa02f28b37a608d5af9a73570018591dbc8ef7f'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tla"
          curl -fsSL -o "$RUNNER_TEMP/tla/tla2tools.jar" \
            "https://github.com/tlaplus/tlaplus/releases/download/v${TLC_VERSION}/tla2tools.jar"
          ACTUAL_SHA="$(sha256sum "$RUNNER_TEMP/tla/tla2tools.jar" | awk '{print $1}')"
          if [[ "${ACTUAL_SHA}" != "${TLC_SHA256_PINNED}" ]]; then
            echo "::error::TLC SHA-256 supply-chain pin violation (ADR-0042 §A1)"
            exit 1
          fi
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/tlc" <<'EOF'
          #!/usr/bin/env bash
          exec java -cp "${TLC_JAR}" tlc2.TLC "$@"
          EOF
          chmod +x "$HOME/.local/bin/tlc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "TLC_JAR=$RUNNER_TEMP/tla/tla2tools.jar" >> "$GITHUB_ENV"

      - name: TLC extended (${{ matrix.spec }} + ${{ matrix.spec }}_nightly.cfg)
        run: timeout 1800s bash scripts/run_tlc_corelink.sh ${{ matrix.spec }} ${{ matrix.spec }}_nightly

  # ---------------------------------------------------------------------
  # 2. proptest extended (100k iter) for cross-component property tests.
  # Override `PROPTEST_CASES` env var; gate at <= 5 min total runtime per
  # WI §10.7.6 / Gherkin "Property test extended 100k".
  # ---------------------------------------------------------------------
  proptest-extended:
    name: proptest extended (100k iter cross-component)
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-04-29

      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        with:
          workspaces: ". -> target"

      - uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Build first so the test binary is cached; PROPTEST_CASES applies at
      # runtime only.
      - name: cargo build --release (test artifacts)
        run: cargo test --release --workspace --no-run

      - name: proptest 100k iter (cross-component WI-S01-006)
        env:
          PROPTEST_CASES: '100000'
          # Extended timeouts to absorb 100k cases without spurious flake.
          PROPTEST_MAX_LOCAL_REJECTS: '100000'
          PROPTEST_MAX_GLOBAL_REJECTS: '500000'
        run: |
          set -euo pipefail
          # Run the cross-component property test targets (10x cases on the
          # WI-S01-006 prop_cas + prop_idempotency suite). Both targets are
          # declared in `crates/corelink-reapi/Cargo.toml` and MUST exist —
          # if either is missing, that's a regression and the job fails.
          cargo test --release --package corelink-reapi --test prop_cas
          cargo test --release --package corelink-reapi --test prop_idempotency

      - name: proptest 100k iter — INV-GC-004 race (WI-S06-006 nightly tier)
        env:
          PROPTEST_CASES: '100000'
          PROPTEST_MAX_LOCAL_REJECTS: '100000'
          PROPTEST_MAX_GLOBAL_REJECTS: '500000'
        # WI-S06-006 §6.1.2 + §1: the canonical 100k iter race
        # property test cross-validates the TLA+ obligation
        # `gc_correctness.tla::InvGCReRefProtected` against the real
        # Rust impl. PR-gate runs at 10k; nightly tier runs at 100k
        # per the dual-tier ceiling. ZERO violations sustained over
        # 100k iter is the sprint contract DoD §6 gate.
        run: |
          set -euo pipefail
          cargo test --release --package corelink-gc --test prop_inv_gc_004_race

      - name: proptest 100k iter — S-07 dedup + eviction + quota + lru (WI-S07-005 nightly tier)
        env:
          PROPTEST_CASES: '100000'
          PROPTEST_MAX_LOCAL_REJECTS: '100000'
          PROPTEST_MAX_GLOBAL_REJECTS: '500000'
        # WI-S07-005 §F + sprint contract §6 DoD: S-07 ship gate
        # consolidates the prior 4 WIs' deferred items by extending
        # the nightly proptest tier to 100k iter for prop_dedup +
        # prop_eviction + prop_quota + prop_lru. PR-gate runs at 10k;
        # nightly tier runs at 100k per the dual-tier ceiling. ZERO
        # INV-DEDUP-CONSISTENCY / INV-EVICT-* / INV-QUOTA-* / INV-LRU-*
        # violations sustained over 100k iter is the spec contract
        # DoD §6 gate.
        run: |
          set -euo pipefail
          cargo test --release --package corelink-cas --test prop_dedup
          cargo test --release --package corelink-eviction --test prop_eviction
          cargo test --release --package corelink-billing --test prop_quota
          cargo test --release --package corelink-cas --test prop_lru

      - name: proptest 100k iter — S-08 ratelimit + edge + quota-cas + abuse + rate-headers (WI-S08-006 nightly tier)
        env:
          PROPTEST_CASES: '100000'
          PROPTEST_MAX_LOCAL_REJECTS: '100000'
          PROPTEST_MAX_GLOBAL_REJECTS: '500000'
        # WI-S08-006 §F + sprint contract §6 DoD: S-08 ship gate
        # consolidates the prior 5 WIs' deferred items by extending
        # the nightly proptest tier to 100k iter for prop_ratelimit +
        # prop_edge + prop_quota_cas + prop_abuse + prop_rate_headers.
        # PR-gate runs at 10k; nightly tier runs at 100k per the
        # dual-tier ceiling. ZERO INV-AVAIL-ISOLATION /
        # INV-RATE-LIMIT-PROPORTIONALITY / INV-QUOTA-ENFORCEMENT /
        # INV-TENANT-ISOLATION violations sustained over 100k iter
        # is the spec contract DoD §6 gate.
        run: |
          set -euo pipefail
          cargo test --release --package corelink-ratelimit --test prop_ratelimit
          cargo test --release --package corelink-cas --test prop_edge
          cargo test --release --package corelink-billing --test prop_quota_cas
          cargo test --release --package corelink-billing --test prop_abuse
          cargo test --release --package corelink-rate-headers --test prop_rate_headers

      - name: proptest 100k iter — S-09 analytics + logpush + tracing + audit-chain + slo + canary (WI-S09-007 nightly tier)
        env:
          PROPTEST_CASES: '100000'
          PROPTEST_MAX_LOCAL_REJECTS: '100000'
          PROPTEST_MAX_GLOBAL_REJECTS: '500000'
        # WI-S09-007 §F + sprint contract §6 DoD: S-09 ship gate
        # consolidates the prior 6 WIs' deferred items by extending
        # the nightly proptest tier to 100k iter for prop_analytics +
        # prop_logpush + prop_tracing + prop_audit_chain + prop_slo +
        # prop_canary. PR-gate runs at 10k; nightly tier runs at 100k
        # per the dual-tier ceiling. ZERO INV-OBS-CARDINALITY-BUDGET /
        # INV-OBS-AUDIT-CHAIN-INTEGRITY / INV-AUDIT-EMIT-ATOMIC-WITH-
        # HANDLER / INV-TENANT-ISOLATION violations sustained over
        # 100k iter is the spec contract DoD §6 gate.
        run: |
          set -euo pipefail
          cargo test --release --package corelink-analytics --test prop_analytics
          cargo test --release --package corelink-telemetry --test prop_logpush
          cargo test --release --package corelink-tracing --test prop_tracing
          cargo test --release --package corelink-audit-chain --test prop_audit_chain
          cargo test --release --package corelink-slo --test prop_slo
          cargo test --release --package corelink-telemetry --test prop_canary

      - name: proptest 100k iter — S-10 billing-emit + aggregator + stripe + reconcile + quota-fsm + replay (WI-S10-007 nightly tier)
        env:
          PROPTEST_CASES: '100000'
          PROPTEST_MAX_LOCAL_REJECTS: '100000'
          PROPTEST_MAX_GLOBAL_REJECTS: '500000'
        # WI-S10-007 §F + sprint contract §6 DoD: S-10 ship gate
        # consolidates the prior 6 WIs' deferred items by extending
        # the nightly proptest tier to 100k iter for prop_billing_emit +
        # prop_billing_aggregator + prop_billing_stripe +
        # prop_billing_reconcile + prop_quota_fsm + prop_billing_replay.
        # PR-gate runs at 10k; nightly tier runs at 100k per the
        # dual-tier ceiling. ZERO INV-BILLING-NO-LOSS / INV-BILLING-NO-DUP /
        # INV-BILLING-RECONCILE-3-LAYER / INV-BILLING-REPLAYABLE-FROM-EVENTS /
        # INV-AUDIT-APPEND-ONLY / INV-AUDIT-EMIT-ATOMIC-WITH-HANDLER /
        # INV-TENANT-ISOLATION violations sustained over 100k iter is
        # the spec contract DoD §6 gate; per WI-S10-007 ADR-S10-007-tla-
        # substitutes-proptest, TLA+ TLC model checking covers the
        # WI-S10-007 atomicity contract while these 6 prior crates
        # carry the runtime 100k coverage canonical.
        run: |
          set -euo pipefail
          cargo test --release --package corelink-billing-emit --test prop_billing_emit
          cargo test --release --package corelink-billing-aggregator --test prop_billing_aggregator
          cargo test --release --package corelink-billing-stripe --test prop_billing_stripe
          cargo test --release --package corelink-billing-reconcile --test prop_billing_reconcile
          cargo test --release --package corelink-billing --test prop_quota_fsm
          cargo test --release --package corelink-billing --test prop_billing_replay

  # ---------------------------------------------------------------------
  # 3. Fuzz matrix — all 9 targets across 5 SEALed crates, 1h each parallel.
  # ---------------------------------------------------------------------
  fuzz-matrix:
    name: fuzz 1h (${{ matrix.crate }}::${{ matrix.target }})
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { crate: tenant-path, target: derive_prefix }
          - { crate: corelink-hash, target: digest_parse }
          - { crate: corelink-hash, target: verify_body }
          - { crate: corelink-worker, target: r2_path }
          - { crate: corelink-worker, target: r2_put_get_roundtrip }
          - { crate: corelink-meta, target: commit_put_roundtrip }
          - { crate: corelink-meta, target: audit_idempotency }
          - { crate: corelink-reapi, target: proto_decode_batch_update }
          - { crate: corelink-reapi, target: audit_request_id_total }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly as of 2026-04-29

      - name: Install cargo-fuzz (pinned)
        # Pin the exact cargo-fuzz version so future upstream changes
        # (e.g. libfuzzer flag semantics) don't silently alter coverage.
        run: cargo install cargo-fuzz --locked --version =0.13.1

      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        with:
          workspaces: "crates/${{ matrix.crate }}/fuzz -> target"

      - uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run fuzz target 3600s (${{ matrix.target }})
        working-directory: crates/${{ matrix.crate }}
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=3600

      - name: Upload fuzz artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.crate }}-${{ matrix.target }}
          path: crates/${{ matrix.crate }}/fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------
  # 4. cargo-mutants workspace kill-rate gate (fail-on-any-survivor).
  # `cargo mutants` exits non-zero on any unkilled mutant by default; that
  # is the fail-closed config used by every per-crate nightly workflow.
  # On this small sprint corpus an unkilled mutant means insufficient test
  # coverage of the mutated code path — fix the test, not the threshold.
  # ---------------------------------------------------------------------
  mutants-workspace:
    name: cargo-mutants workspace (fail-on-any-survivor)
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-04-29

      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        with:
          workspaces: ". -> target"

      - uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-mutants (pinned)
        # Pin the exact mutant-runner version so workflow runs are
        # reproducible and a future cargo-mutants upstream change can't
        # silently shift our kill-rate.
        run: cargo install cargo-mutants --locked --version =27.0.0

      - name: cargo-mutants workspace
        run: cargo mutants --workspace --no-shuffle --minimum-test-timeout=600
