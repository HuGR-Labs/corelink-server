name: worker vitest

# Gates the TypeScript `worker/` node vitest suite (previously ungated in PR CI).
# The `*.miniflare.test.ts` suite is excluded here — it runs separately under the
# workerd (miniflare) harness via vitest.miniflare.config.mts, not the node pool.

on:
  pull_request:
    paths:
      - "worker/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    runs-on: corelink
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        # package-lock.json is gitignored (.gitignore **/package-lock.json), so
        # `npm ci` cannot run — use `npm install` like the other node workflows.
        # --legacy-peer-deps: wrangler ≥4.108 declares a peerOPTIONAL on
        # @cloudflare/workers-types@^5, but the repo pins workers-types 4.x (for
        # @sentry/cloudflare compat). Since the lockfile is gitignored here, a
        # fresh npm install floats wrangler and strict peer resolution ERESOLVEs
        # on that OPTIONAL peer. --legacy-peer-deps skips the optional-peer check
        # (it does not weaken anything real) so the node vitest can install+run.
        # The pnpm workspace side stays deterministic via the committed lockfile.
        run: npm install --legacy-peer-deps

      - name: Run vitest (node config)
        run: npx vitest run

      - name: Run vitest (miniflare / workerd integration)
        # The workerd DO-dispatch / isolation / CORS integration suite. Its
        # beforeAll ALWAYS rebuilds the bundle (wrangler --dry-run, headless — no
        # CF creds) and loads it via scriptPath + nodejs_compat, so it can't rot
        # against a stale dist again. Kept separate from the node config (workerd
        # pool, not node).
        run: npx vitest run --config vitest.miniflare.config.mts
