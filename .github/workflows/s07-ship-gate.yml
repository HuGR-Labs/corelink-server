name: S-07 ship gate (WI-S07-005)

# Sprint-level ship-gate workflow per WI-S07-005 §6.1.10. Drives the
# host-side cross-component prop suite + 2 RB dry-runs + validators
# chain so a regression cannot land without a CI failure.
#
# This workflow runs:
#   1. Validators (specs + INV promotion + migration additivity).
#   2. Cross-component property tests at 10k iter PR speed.
#   3. RB-FM-305 (S-07 re-execution) + RB-FM-059 host-side dry-run scripts.
#   4. DASH-DEDUP dashboard JSON parse smoke.
#   5. DASH-DEDUP alert rules YAML parse smoke.
#   6. Aggregate gate (fan-in for required-status-checks branch
#      protection rule).
#
# All gates fail-closed (STANDARD lane; less ceremony than HIGH_RISK
# but the structural pattern mirrors gc-ship-gate.yml). Per WI §6.1.10
# dependency chain: WI-S07-001..004 SEALED is a prerequisite; this
# workflow runs at WI-S07-005 SEAL + on every subsequent PR that
# touches dedup / eviction / quota / lru-tracker code, the canonical
# migration files, the runbooks, the dashboard JSON, or the alert
# rules YAML.

on:
  pull_request:
    paths:
      - 'crates/corelink-cas/**'
      - 'crates/corelink-eviction/**'
      - 'crates/corelink-billing/**'
      - 'specs/05_quality/runbooks/RB-FM-059-do-quota-exceeded.md'
      - 'specs/05_quality/runbooks/RB-FM-305-tombstone-lost.md'
      - 'scripts/rb_fm_059_dry_run.sh'
      - 'scripts/rb_fm_305_dry_run.sh'
      - 'dashboards/grafana/DASH-DEDUP.json'
      - 'dashboards/alerts/dash-dedup-alerts.yml'
      - 'specs/04_sprints/S07/**'
      - '.github/workflows/s07-ship-gate.yml'
  # Cadence: daily -> WEEKLY (CI cost diet 2026-08-01). The `pull_request`
  # paths: lane above still gates EVERY diff that can regress this sprint's
  # surface; the schedule is only belt-and-braces re-execution for a SEALED
  # sprint, and it fans out to 4 hosted jobs (2 of them full Rust builds).
  schedule:
    - cron: '0 8 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # --------------------------------------------------------------------
  # NOTE (CI-OPT-003): The `validators` job (validate_specs/inv/refs +
  # check_migrations_additive) has been moved to `spec_validation.yml` as
  # the single source of truth. Branch protection requires
  # `spec_validation / spec-validation` as a separate REQUIRED status
  # check on all PRs touching `specs/**`, so removing the duplicate
  # validators job here does not weaken the gate.
  # --------------------------------------------------------------------
  # 1. Cross-component property tests + lib unit at PR speed.
  # --------------------------------------------------------------------
  prop-and-tests:
    name: corelink-{cas,eviction,billing} tests (lib + prop @ 10k iter)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-04-29

      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          workspaces: ". -> target"

      - uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: cargo test -p corelink-cas --all-targets
        run: cargo test -p corelink-cas --all-targets

      - name: cargo test -p corelink-eviction --all-targets
        run: cargo test -p corelink-eviction --all-targets

      - name: cargo test -p corelink-billing --all-targets
        run: cargo test -p corelink-billing --all-targets

      - name: cargo clippy -- -D warnings
        run: cargo clippy --workspace --all-targets --features corelink-worker/tower-middleware -- -D warnings

  # --------------------------------------------------------------------
  # 2. RB-FM-305 (S-07 re-execution) + RB-FM-059 host-side dry-run scripts.
  # --------------------------------------------------------------------
  rb-dry-runs:
    name: RB-FM-305 / RB-FM-059 host-side dry-runs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [prop-and-tests]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-04-29

      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          workspaces: ". -> target"

      - uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: RB-FM-305 dry-run (S-07 re-execution)
        run: bash scripts/rb_fm_305_dry_run.sh

      - name: RB-FM-059 dry-run
        run: bash scripts/rb_fm_059_dry_run.sh

  # --------------------------------------------------------------------
  # 3. DASH-DEDUP dashboard JSON + alert rules YAML parse smoke.
  # --------------------------------------------------------------------
  dashboard-smoke:
    name: DASH-DEDUP parse smoke
    # Runner: self-hosted mac fleet (CI cost diet 2026-08-01) — a JSON/YAML
    # parse smoke that still costs a full paid minute under the hosted
    # 1-MINUTE-PER-JOB FLOOR. The step comment below already documents the
    # system-python3 idiom written FOR this fleet.
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # No actions/setup-python: the self-hosted mac fleet cannot provision
      # Python via setup-python (RUNNER_TOOL_CACHE is unset, falls back to
      # the unwritable /Users/runner hosted path and dies with
      # `mkdir: /Users/runner: Permission denied`). Use system python3
      # and ensure pyyaml is available (mirrors spec_validation.yml). (2026-06-03)
      - name: Ensure pyyaml (system python3)
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null && exit 0
          python3 -m venv .venv-smoke
          .venv-smoke/bin/pip install --quiet pyyaml
          echo "$PWD/.venv-smoke/bin" >> "$GITHUB_PATH"

      - name: DASH-DEDUP.json parse smoke
        run: python3 -c "import json; json.load(open('dashboards/grafana/DASH-DEDUP.json'))"

      - name: dash-dedup-alerts.yml parse smoke
        run: python3 -c "import yaml; yaml.safe_load(open('dashboards/alerts/dash-dedup-alerts.yml'))"

  # --------------------------------------------------------------------
  # 4. Aggregate gate (fan-in for required-status-checks branch
  #    protection rule).
  # --------------------------------------------------------------------
  s07-ship-gate:
    name: S-07 ship gate (aggregate)
    # Runner: self-hosted mac fleet (CI cost diet 2026-08-01) — a fan-in
    # `echo` that still costs a full paid minute under the hosted
    # 1-MINUTE-PER-JOB FLOOR.
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 1
    needs: [prop-and-tests, rb-dry-runs, dashboard-smoke]
    steps:
      - name: Aggregate
        run: echo "S-07 ship gate green; all canonical sub-gates passed."
