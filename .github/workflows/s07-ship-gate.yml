name: S-07 ship gate (WI-S07-005)

# Sprint-level ship-gate workflow per WI-S07-005 §6.1.10. Drives the
# host-side cross-component prop suite + 2 RB dry-runs + validators
# chain so a regression cannot land without a CI failure.
#
# This workflow runs:
#   1. Validators (specs + INV promotion + migration additivity).
#   2. Cross-component property tests at 10k iter PR speed.
#   3. RB-FM-305 (S-07 re-execution) + RB-FM-059 host-side dry-run scripts.
#   4. DASH-DEDUP dashboard JSON parse smoke.
#   5. DASH-DEDUP alert rules YAML parse smoke.
#   6. Aggregate gate (fan-in for required-status-checks branch
#      protection rule).
#
# All gates fail-closed (STANDARD lane; less ceremony than HIGH_RISK
# but the structural pattern mirrors gc-ship-gate.yml). Per WI §6.1.10
# dependency chain: WI-S07-001..004 SEALED is a prerequisite; this
# workflow runs at WI-S07-005 SEAL + on every subsequent PR that
# touches dedup / eviction / quota / lru-tracker code, the canonical
# migration files, the runbooks, the dashboard JSON, or the alert
# rules YAML.

on:
  pull_request:
    paths:
      - 'crates/corelink-dedup/**'
      - 'crates/corelink-eviction/**'
      - 'crates/corelink-quota/**'
      - 'crates/corelink-lru-tracker/**'
      - 'specs/05_quality/runbooks/RB-FM-059-do-quota-exceeded.md'
      - 'specs/05_quality/runbooks/RB-FM-305-tombstone-lost.md'
      - 'scripts/rb_fm_059_dry_run.sh'
      - 'scripts/rb_fm_305_dry_run.sh'
      - 'dashboards/grafana/DASH-DEDUP.json'
      - 'dashboards/alerts/dash-dedup-alerts.yml'
      - 'specs/04_sprints/S07/**'
      - '.github/workflows/s07-ship-gate.yml'
  push:
    branches: [main]
    paths:
      - 'crates/corelink-dedup/**'
      - 'crates/corelink-eviction/**'
      - 'crates/corelink-quota/**'
      - 'crates/corelink-lru-tracker/**'
      - 'specs/05_quality/runbooks/RB-FM-059-do-quota-exceeded.md'
      - 'specs/05_quality/runbooks/RB-FM-305-tombstone-lost.md'
      - 'scripts/rb_fm_059_dry_run.sh'
      - 'scripts/rb_fm_305_dry_run.sh'
      - 'dashboards/grafana/DASH-DEDUP.json'
      - 'dashboards/alerts/dash-dedup-alerts.yml'
      - 'specs/04_sprints/S07/**'
      - '.github/workflows/s07-ship-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # --------------------------------------------------------------------
  # 1. Validators chain (specs schema + INV promotion + migration additivity).
  # --------------------------------------------------------------------
  validators:
    name: validators (specs + INV + migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install -r requirements-ci.txt

      - name: validate_specs.py
        run: python3 scripts/validate_specs.py

      - name: validate_inv_promotion.py
        run: python3 scripts/validate_inv_promotion.py

      - name: validate_references.py
        run: python3 scripts/validate_references.py

      - name: check_migrations_additive.py
        run: python3 scripts/check_migrations_additive.py

  # --------------------------------------------------------------------
  # 2. Cross-component property tests + lib unit at PR speed.
  # --------------------------------------------------------------------
  prop-and-tests:
    name: corelink-{dedup,eviction,quota,lru-tracker} tests (lib + prop @ 10k iter)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-04-29

      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        with:
          workspaces: ". -> target"

      - uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: cargo test -p corelink-dedup --all-targets
        run: cargo test -p corelink-dedup --all-targets

      - name: cargo test -p corelink-eviction --all-targets
        run: cargo test -p corelink-eviction --all-targets

      - name: cargo test -p corelink-quota --all-targets
        run: cargo test -p corelink-quota --all-targets

      - name: cargo test -p corelink-lru-tracker --all-targets
        run: cargo test -p corelink-lru-tracker --all-targets

      - name: cargo clippy -- -D warnings
        run: cargo clippy --workspace --all-targets --features corelink-worker/tower-middleware -- -D warnings

  # --------------------------------------------------------------------
  # 3. RB-FM-305 (S-07 re-execution) + RB-FM-059 host-side dry-run scripts.
  # --------------------------------------------------------------------
  rb-dry-runs:
    name: RB-FM-305 / RB-FM-059 host-side dry-runs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [prop-and-tests]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-04-29

      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        with:
          workspaces: ". -> target"

      - uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: RB-FM-305 dry-run (S-07 re-execution)
        run: bash scripts/rb_fm_305_dry_run.sh

      - name: RB-FM-059 dry-run
        run: bash scripts/rb_fm_059_dry_run.sh

  # --------------------------------------------------------------------
  # 4. DASH-DEDUP dashboard JSON + alert rules YAML parse smoke.
  # --------------------------------------------------------------------
  dashboard-smoke:
    name: DASH-DEDUP parse smoke
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Install Python deps (yaml + json)
        run: pip install pyyaml

      - name: DASH-DEDUP.json parse smoke
        run: python3 -c "import json; json.load(open('dashboards/grafana/DASH-DEDUP.json'))"

      - name: dash-dedup-alerts.yml parse smoke
        run: python3 -c "import yaml; yaml.safe_load(open('dashboards/alerts/dash-dedup-alerts.yml'))"

  # --------------------------------------------------------------------
  # 5. Aggregate gate (fan-in for required-status-checks branch
  #    protection rule).
  # --------------------------------------------------------------------
  s07-ship-gate:
    name: S-07 ship gate (aggregate)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: [validators, prop-and-tests, rb-dry-runs, dashboard-smoke]
    steps:
      - name: Aggregate
        run: echo "S-07 ship gate green; all canonical sub-gates passed."
