name: issue-1650-real-integration-readiness

# Credentialless contract only. This lane never reads protected secrets, calls a
# provider, dispatches real harnesses, or mutates D1/R2/Stripe/Neon resources.
on:
  pull_request:
    paths:
      - ".github/workflows/issue-1650-real-readiness.yml"
      - ".github/workflows/real-ignored-harnesses.yml"
      - "scripts/real-ignored-harness-manifest.json"
      - "scripts/verify_i1650_real_integration_readiness.py"
      - "docs/handoff/2026-09-22-i1650-real-integration-readiness.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: validate credentialless real integration readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact tree
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Audit packet and executor without credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ""
          CF_API_TOKEN: ""
          D1_DATABASE_ID: ""
          R2_S3_ENDPOINT: ""
          R2_S3_ACCESS_KEY_ID: ""
          R2_S3_SECRET_ACCESS_KEY: ""
          HUGR_WALLET_TOKEN: ""
          NEON_TEST_DSN: ""
        run: python3 scripts/verify_i1650_real_integration_readiness.py
