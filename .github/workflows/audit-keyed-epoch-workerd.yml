name: audit keyed epoch workerd

on:
  pull_request:
    paths:
      - "worker/tests/keyed_epoch_disposable.miniflare.test.ts"
      - "worker/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/audit-keyed-epoch-workerd.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: audit-keyed-epoch-workerd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  disposable-workerd:
    name: B-054 disposable E0 to E1 workerd harness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4.1.0
        with:
          version: 10.32.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install worker dependencies
        run: pnpm install --frozen-lockfile --filter @corelink/worker...
      - name: Exercise disposable workerd epoch harness
        run: pnpm --dir worker exec vitest run --config vitest.miniflare.config.mts tests/keyed_epoch_disposable.miniflare.test.ts
# This local, credential-free harness has an in-process fixture witness. It is
# not independent-witness, key-custody, archive, or live-target evidence (#1793+).
