# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: shell-pipeline-safety

# Refuses two shell defects that make a gate answer wrongly instead of failing.
#
# RULE 1 — no early-exiting boolean consumer on the right of a pipe.
# `producer | grep -<quiet> P` under `set -o pipefail` inverts on match: the
# quiet grep exits at the first hit, the producer takes SIGPIPE and exits 141,
# pipefail reports the pipeline failed, and the caller reads "no match". It is
# a race against the 64 KiB pipe buffer, so it is invisible on small inputs and
# near-certain on large ones — measured 38/40 misreports on a 326-file diff.
# Found because the changelog gate claimed a modified CHANGELOG.md was not
# modified (PR #1271). Two other sites failed OPEN: the CTRL-CRED-001 scan of
# `docker history` (a credential MATCH is what kills the producer, so the
# control printed PASS) and okf-autoreconcile's out-of-tree edit guard.
#
# RULE 2 — no `| head` whose exit status is consumed.
# Same SIGPIPE mechanism, opposite blast radius: `head` cannot answer wrongly,
# only abort with 141. So the question is never "is there a `| head`" but "does
# anything read this pipeline's status". `scripts/check_head_under_pipefail.py`
# answers that per site — an assignment RHS or a bare pipeline is a failure; a
# `$( … | head … )` in an argument position, whose status the enclosing command
# discards, is not, and neither is prose inside a quoted string. Counting
# occurrences instead is what kept B-040 open: 72 raw matches, of which 0 were
# actually reachable failures once the position was taken into account, and 3
# real ones that the comment-anchored grep could not see at all because the
# line contained a `#` inside quotes.
#
# RULE 4 — no raw NUL byte in a tracked text file.
# Git calls a blob binary when it finds a 0x00 in the first 8000 bytes, so one
# raw NUL turns a source file into a binary one for every operation review
# depends on: `git diff` prints `Binary files … differ` instead of a patch and
# `--stat` collapses to a byte count. Nothing goes red — the file simply stops
# being reviewable, and every later change to it ships unread. Found on
# `worker/tests/runner_mint.test.ts`, whose D1 mock joins tenant and repo on a
# NUL separator written as a literal byte; `\u0000` is the same character at
# runtime and keeps the file text. Belongs in THIS lane because it is the same
# class as the rules above — a check that answers wrongly (here, review
# answering "no change") instead of failing.
#
# RULE 3 — every tracked shell script must parse (`bash -n`).
# This is how `scripts/okf-reconcile-local.sh` was found dead on main: its
# prompt was single-quoted and contained "file's anchor", so the apostrophe
# closed the string and the rest of the prose was parsed as shell.
#
# The checker self-tests both directions before it is trusted; a gate that has
# only ever been observed green proves nothing.
#
# Quality lane: STANDARD
# Fail-closed: YES

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'tests/**'
      - 'tools/**'
      # RULE 4 scans the whole tracked tree, so a NUL landing in any source
      # file must reach this lane — not only one landing in a script.
      - 'apps/**'
      - 'crates/**'
      - 'worker/**'
      - 'docs/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'tests/**'
      - 'tools/**'
      - 'apps/**'
      - 'crates/**'
      - 'worker/**'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shell-pipeline-safety:
    name: pipelines cannot invert on match; every shell script parses
    # Self-hosted fleet (zero hosted Actions spend). Pure stdlib python3 plus
    # `bash -n`; sub-minute, no toolchain, no network.
    # zero-hosted (WP-CI): python3 puro (baked na imagem da frota)
    runs-on: corelink
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Self-test the checker before trusting its verdict
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_shell_pipeline_safety.py --self-test

      - name: Enforce
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_shell_pipeline_safety.py

      - name: Self-test the `| head` classifier before trusting its verdict
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_head_under_pipefail.py --self-test

      - name: Enforce — no `| head` whose exit status is consumed
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_head_under_pipefail.py

      - name: Self-test the NUL-byte checker before trusting its verdict
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_no_nul_bytes.py --self-test

      - name: Enforce — no raw NUL byte in a tracked text file
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_no_nul_bytes.py
