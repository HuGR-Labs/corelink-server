name: e2e-browser-prod

# Real-browser money/DSR e2e (Playwright + @clerk/testing) driving a REAL
# prod-accepted Clerk session against LIVE humangr.com/corelink.
#
# This is the ONLY vantage that can exercise the money path end-to-end: a
# headless FAPI mint is rejected 401 by the prod Worker's Clerk verification,
# a browser session is not, so `curl` cannot stand in for it (see BACKLOG B-042).
# The `03-money-checkout` spec is the sole e2e proof a customer reaches a real
# `checkout.stripe.com/…/cs_live_` session (it STOPS at the hosted page — no card
# submitted, so no charge; Stripe owns the rest).
#
# Runner: the self-hosted mac fleet — it has a real browser and can
# `playwright install chromium`. Zero GitHub-hosted spend (standing mandate).
#
# Trigger: workflow_dispatch ONLY, on purpose. Each run creates a fresh live
# Clerk user + a live Stripe checkout session against prod; until test-user
# cleanup is confirmed automatic we do NOT put this on a schedule that would
# accrete prod state unattended. Promote to a nightly `schedule:` once the
# 04-dsr erase path is confirmed to reap what the run creates.
#
# Secrets (repo-level, set out-of-band — no Actions token can read them back):
#   CLERK_LIVE_PUBLISHABLE_KEY  -> env CLERK_PUBLISHABLE_KEY (pk_live_, public)
#   CLERK_LIVE_SECRET_KEY       -> env CLERK_SECRET_KEY      (sk_live_, sensitive)
# The suite maps LIVE_* -> the un-suffixed names @clerk/testing expects.
#
# Action SHAs are pinned (no floating tags) — security requirement.

on:
  workflow_dispatch:
    inputs:
      grep:
        description: "Playwright --grep filter (blank = full suite)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: e2e-browser-prod
  cancel-in-progress: true

jobs:
  browser:
    name: real-browser money/DSR (chromium, prod)
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tests/e2e-browser
    env:
      CORELINK_APP_URL: ${{ vars.CORELINK_APP_URL || 'https://humangr.com/corelink' }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_LIVE_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_LIVE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Fail fast if live Clerk creds are absent
        run: |
          if [ -z "${CLERK_PUBLISHABLE_KEY}" ] || [ -z "${CLERK_SECRET_KEY}" ]; then
            echo "::error::CLERK_LIVE_PUBLISHABLE_KEY / CLERK_LIVE_SECRET_KEY not set as repo secrets — the browser suite cannot mint a prod-accepted session. See BACKLOG B-042."
            exit 1
          fi

      - name: Install deps (npm, standalone — not a pnpm-workspace member)
        run: npm ci

      - name: Install chromium
        run: npx playwright install chromium

      - name: Run suite
        run: |
          if [ -n "${{ inputs.grep }}" ]; then
            npx playwright test --grep "${{ inputs.grep }}"
          else
            npx playwright test
          fi

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: tests/e2e-browser/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
