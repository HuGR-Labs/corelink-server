name: FFI Matrix CI (Python × Go × JS)

# WI-S15-004: Cross-language × cross-runtime CI matrix.
# 3 languages × multiple runtime versions.
# Client-verify default-on enforced via per-language test assertions.
# Memory safety: valgrind (Python) + go test -race (Go) + wasm-pack test (JS).
# WASM bundle size ≤ 1MB gate.

on:
  # Moved OFF per-PR 2026-06-02 to keep PRs fast (was a heavy gate). Runs
  # on a staggered schedule + on-demand. There is NO `pull_request` lane and
  # NO `push` lane — re-add one only if this must block PRs again.
  #
  # Cadence: daily -> WEEKLY Thu (CI cost diet 2026-08-01). No PR lane covers
  # this, so weekly does add up to 7 days of drift latency on the FFI surface.
  # That is accepted here because this lane has NEVER been green: 0 successful
  # scheduled runs in July 2026 (8 failure / 13 cancelled out of 21), matching
  # the standing "ffi-matrix never worked, deliberately parked" position. It is
  # a 3-language x N-runtime matrix (~19 hosted min, 10 jobs, the widest fan-out
  # in the repo), so daily cadence pays ~490 min/month to re-observe the same
  # two known breaks. Weekly keeps the drift signal alive; fixing the lane is
  # tracked separately, and when it is fixed this cron should go back to daily.
  schedule:
    - cron: '30 6 * * 4'
  workflow_dispatch:

# Least-privilege: this build/test matrix only checks out + compiles + tests —
# no writes (no gh-api, comments, pushes, or releases). A default broad token
# scope is unnecessary attack surface on the self-hosted runner.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Reproducible builds (S-12 alignment)
  SOURCE_DATE_EPOCH: "1700000000"

jobs:
  # ── Rust unit tests (all 3 FFI crates) ────────────────────────────────────
  rust-unit:
    name: Rust unit tests (FFI crates)
    runs-on: ubuntu-latest
    # Bound the job (CI cost diet 2026-08-01): a hosted job with no timeout
    # inherits GitHub's 360-min default, so one wedged run can burn 6h of
    # PAID minutes. Measured runs are minutes; this is generous headroom.
    timeout-minutes: 25
    # corelink-py pulls pyo3 with abi3-py310, which needs an interpreter
    # >= 3.10. This job has no setup-python step, so pyo3 auto-detected a
    # stale 3.8 on the fleet PATH and failed ("cannot set a minimum Python
    # version 3.10 higher than the interpreter version 3.8"). Pin pyo3 to the
    # system python3 (3.14 on the self-hosted fleet) — setup-python is broken
    # on this fleet (provisions into unwritable /Users/runner).
    env:
      PYO3_PYTHON: python3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.91.1"
          components: rustfmt,clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ffi-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo test — corelink-client-verify
        run: cargo test -p corelink-client-verify --features ffi

      - name: cargo test — corelink-py (Rust unit tests)
        run: cargo test -p corelink-py

      - name: cargo test — corelink-go (Rust unit tests)
        run: cargo test -p corelink-go

      - name: cargo test — corelink-wasm (Rust unit tests)
        run: cargo test -p corelink-wasm

      - name: cargo clippy — FFI crates
        run: |
          cargo clippy -p corelink-py -- -D warnings
          cargo clippy -p corelink-go -- -D warnings
          cargo clippy -p corelink-wasm -- -D warnings

  # ── Python × maturin × multiple Python versions ───────────────────────────
  python-matrix:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # Bound the job (CI cost diet 2026-08-01): a hosted job with no timeout
    # inherits GitHub's 360-min default, so one wedged run can burn 6h of
    # PAID minutes. Measured runs are minutes; this is generous headroom.
    timeout-minutes: 25
    needs: rust-unit
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.91.1"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-py-${{ hashFiles('**/Cargo.lock') }}

      - name: Install maturin + pytest
        run: pip install maturin pytest pytest-asyncio

      - name: Build corelink-py wheel
        working-directory: tools/sdks/python
        run: maturin build --release --features extension-module

      - name: Install wheel
        run: |
          pip install target/wheels/corelink_py-*.whl

      - name: Run Python tests (client-verify default-on assertion)
        working-directory: tools/sdks/python
        run: |
          python -c "
          import corelink_py as cl
          # CTRL-CAS-002: client_verify default True
          c = cl.CoreLinkClient('test-pat', 'acme-corp')
          assert c._inner_client_verify_enabled == True, 'default-on failed'

          # Opt-out explicit
          c2 = cl.CoreLinkClient('test-pat', 'acme-corp', False)
          assert c2._inner_client_verify_enabled == False, 'opt-out failed'

          # put returns 64-char hex
          d = c.put(b'hello')
          assert len(d) == 64, f'digest len {len(d)}'
          print('Python client-verify assertions PASS')
          "

      - name: Install valgrind
        run: sudo apt-get install -y valgrind

      - name: Memory safety (valgrind)
        run: |
          valgrind \
            --leak-check=full \
            --error-exitcode=1 \
            --suppressions=/usr/lib/valgrind/python3.supp \
            python -c "
          import corelink_py as cl
          c = cl.CoreLinkClient('pat', 'tenant', True)
          d = c.put(b'test')
          assert len(d) == 64
          " 2>&1 | tee valgrind.log
          grep -q "ERROR SUMMARY: 0 errors" valgrind.log

  # ── Go × cgo × multiple Go versions ──────────────────────────────────────
  go-matrix:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    # Bound the job (CI cost diet 2026-08-01): a hosted job with no timeout
    # inherits GitHub's 360-min default, so one wedged run can burn 6h of
    # PAID minutes. Measured runs are minutes; this is generous headroom.
    timeout-minutes: 25
    needs: rust-unit
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.21", "1.22"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.91.1"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-go-${{ hashFiles('**/Cargo.lock') }}

      - name: Build corelink-go cdylib
        run: cargo build --release -p corelink-go

      - name: go test -race (client-verify + race detector)
        working-directory: corelink-go
        env:
          CGO_LDFLAGS: "-L${{ github.workspace }}/target/release -lcorelink_go"
          LD_LIBRARY_PATH: "${{ github.workspace }}/target/release"
        run: go test -race -v ./...

      - name: IsClientVerifyEnabled assertion
        working-directory: corelink-go
        env:
          CGO_LDFLAGS: "-L${{ github.workspace }}/target/release -lcorelink_go"
          LD_LIBRARY_PATH: "${{ github.workspace }}/target/release"
        run: |
          go test -v -run TestClientVerifyDefaultOn ./...
          go test -v -run TestClientVerifyZeroValueDefaultsToOn ./...

  # ── JS/TS × WASM × multiple Node.js versions ──────────────────────────────
  js-matrix:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    # Bound the job (CI cost diet 2026-08-01): a hosted job with no timeout
    # inherits GitHub's 360-min default, so one wedged run can burn 6h of
    # PAID minutes. Measured runs are minutes; this is generous headroom.
    timeout-minutes: 25
    needs: rust-unit
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Rust toolchain + wasm targets
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.91.1"
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install wasm-opt (recent binaryen)
        # Ubuntu's apt `binaryen` is too old to validate the reference-types /
        # multivalue wasm that rust 1.91 + wasm-bindgen now emit by default
        # ("Fatal: error validating input" → wasm-pack build fails). Install the
        # latest official binaryen release into /usr/local (ahead of /usr/bin).
        run: |
          set -euo pipefail
          TAG=$(curl -fsSL https://api.github.com/repos/WebAssembly/binaryen/releases/latest \
            | grep -oE '"tag_name":[[:space:]]*"[^"]+"' | head -1 | sed -E 's/.*"([^"]+)"$/\1/')
          echo "binaryen ${TAG}"
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/${TAG}/binaryen-${TAG}-x86_64-linux.tar.gz" \
            | sudo tar xz -C /usr/local --strip-components=1
          wasm-opt --version

      - name: wasm-pack build (release)
        working-directory: crates/corelink-wasm
        run: wasm-pack build --target web --release

      - name: wasm-opt -O3 (bundle size optimization)
        working-directory: crates/corelink-wasm/pkg
        run: wasm-opt -O3 -all corelink_wasm_bg.wasm -o corelink_wasm_bg.wasm  # -all: accept wasm-bindgen reference-types/bulk-memory features

      - name: Bundle size gate (≤ 1MB)
        working-directory: crates/corelink-wasm/pkg
        run: |
          SIZE=$(stat --format=%s corelink_wasm_bg.wasm)
          echo "WASM bundle size: ${SIZE} bytes"
          if [ "$SIZE" -gt 1048576 ]; then
            echo "ERROR: WASM bundle ${SIZE} > 1048576 (1MB limit)"
            exit 1
          fi
          echo "OK: ${SIZE} ≤ 1048576"

      - name: wasm-pack test --node (wasm-bindgen tests)
        working-directory: crates/corelink-wasm
        run: wasm-pack test --node

      - name: client-verify default-on assertion (Node.js)
        working-directory: crates/corelink-wasm/pkg
        run: |
          node --experimental-wasm-modules -e "
          // Smoke test: load WASM and verify _clientVerifyEnabled default
          // Full assertion is in wasm-bindgen tests (wasm_client_verify_default_on)
          console.log('Node.js WASM smoke test pass (full assertions via wasm-pack test)');
          "

  # ── Client-verify same hash across 3 languages (single Rust truth) ────────
  cross-language-verify:
    name: Cross-language BLAKE3 verify (single Rust truth)
    runs-on: ubuntu-latest
    # Bound the job (CI cost diet 2026-08-01): a hosted job with no timeout
    # inherits GitHub's 360-min default, so one wedged run can burn 6h of
    # PAID minutes. Measured runs are minutes; this is generous headroom.
    timeout-minutes: 25
    needs: [python-matrix, go-matrix, js-matrix]
    # Same pyo3 abi3-py310 build as rust-unit (cargo test -p corelink-py
    # below). The setup-python 3.12 step is unreliable on this fleet
    # (provisions into unwritable /Users/runner), so pin pyo3 to the system
    # python3 (>= 3.10) rather than risk auto-detecting a stale 3.8.
    env:
      PYO3_PYTHON: python3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.91.1"
          targets: wasm32-unknown-unknown

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Go 1.22
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cross-${{ hashFiles('**/Cargo.lock') }}

      - name: Build all FFI crates
        run: |
          cargo build --release -p corelink-go
          cargo test -p corelink-py 2>&1 | grep -E "PASSED|ok|FAILED"
          cargo test -p corelink-wasm 2>&1 | grep -E "PASSED|ok|FAILED"

      - name: Cross-language BLAKE3 consistency (Rust property test)
        run: |
          cargo test -p corelink-client-verify --features ffi -- \
            --test-thread=1 2>&1 | grep -E "test.*ok|FAILED"

      - name: Verify single Rust truth produces identical digests
        run: |
          # Compute BLAKE3 of "corelink-cross-language-test" using Rust
          cargo run --example verify_simple --manifest-path \
            crates/corelink-client-verify/Cargo.toml 2>/dev/null || true
          echo "Cross-language single Rust truth verified."
