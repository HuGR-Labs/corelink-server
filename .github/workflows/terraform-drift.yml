name: Terraform Drift Detection

# WI-S13-004 / #1720 / #1721 / #1722 — one independent Terraform root and
# remote state key per region, with provider auth and bounded evidence.
# per region. Every root declares an S3 backend with native R2 lock files.
# Exit code 0 = no diff; 2 = drift; 1 = Terraform/configuration error.
# Auto-apply is forbidden; this workflow only initializes and plans.
#
# Backend inputs (repository secrets; values are never printed):
#   TF_BACKEND_BUCKET              — R2 state bucket
#   TF_BACKEND_ENDPOINT            — R2 S3 endpoint
#   TF_BACKEND_ACCESS_KEY_ID       — scoped R2 Object Read & Write key ID
#   TF_BACKEND_SECRET_ACCESS_KEY   — scoped R2 Object Read & Write secret
#
# Provider inputs are separate from the backend credentials. All third-party
# actions are SHA-pinned per WI-S01-007.
# Owners must provision and verify the dedicated read-only token before a live
# run; this repository cannot verify live secret existence.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      region:
        description: "Single region to check (leave empty for all)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: terraform-drift
  cancel-in-progress: false

env:
  TF_VERSION: "1.11.4"
  TF_IN_AUTOMATION: "true"
  TF_CLI_ARGS: "-no-color"

jobs:
  drift-check:
    name: Drift — ${{ matrix.region }}
    runs-on: corelink
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        region: [wnam, enam, weur, sam]
    outputs:
      drift_detected: ${{ steps.plan.outputs.drift_detected }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init — ${{ matrix.region }}
        env:
          TF_BACKEND_BUCKET: ${{ secrets.TF_BACKEND_BUCKET }}
          TF_BACKEND_ENDPOINT: ${{ secrets.TF_BACKEND_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_BACKEND_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_BACKEND_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          region="${{ matrix.region }}"
          root="infra/terraform/regions/${region}"
          [[ -d "${root}" ]] || { echo "::error::Missing regional Terraform root: ${root}"; exit 1; }
          required=(TF_BACKEND_BUCKET TF_BACKEND_ENDPOINT AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY)
          missing=()
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || missing+=("${name}")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Required R2 backend inputs missing before init: ${missing[*]}"
            exit 1
          fi
          # The root's backend.tf fixes the region-specific state key. Only
          # non-secret bucket/endpoint values are supplied as init arguments.
          terraform -chdir="${root}" init \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="region=auto" \
            -backend-config="endpoints={s3=\"${TF_BACKEND_ENDPOINT}\"}" \
            -backend-config="use_lockfile=true" \
            -input=false \
            -reconfigure

      - name: Terraform plan — ${{ matrix.region }}
        id: plan
        env:
          TF_BACKEND_BUCKET: ${{ secrets.TF_BACKEND_BUCKET }}
          TF_BACKEND_ENDPOINT: ${{ secrets.TF_BACKEND_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_BACKEND_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_BACKEND_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_TERRAFORM_DRIFT_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          TF_VAR_cf_account_id: ${{ secrets.CF_ACCOUNT_ID }}
          TF_VAR_cf_zone_id: ${{ vars.CF_ZONE_ID }}
        continue-on-error: true
        run: scripts/terraform_drift_plan.sh "${{ matrix.region }}" "infra/terraform/regions/${{ matrix.region }}"

      - name: Sanitize Terraform drift evidence — ${{ matrix.region }}
        if: always()
        env:
          PLAN_EXIT: ${{ steps.plan.outputs.terraform_exitcode }}
        run: |
          set -euo pipefail
          region="${{ matrix.region }}"
          root="infra/terraform/regions/${region}"
          plan_json="${GITHUB_WORKSPACE}/terraform-plan-${region}.json"
          summary_file="${GITHUB_WORKSPACE}/terraform-drift-summary-${region}.json"
          trap 'rm -f "${plan_json}" "${root}/plan-${region}.tfplan" "${root}/plan-${region}.log"' EXIT
          exit_code="${PLAN_EXIT:-1}"

          if [[ "${exit_code}" == 0 || "${exit_code}" == 2 ]]; then
            if ! terraform -chdir="${root}" show -json "plan-${region}.tfplan" >"${plan_json}" 2>/dev/null; then
              exit_code=1
            fi
          fi

          if [[ "${exit_code}" == 0 || "${exit_code}" == 2 ]]; then
            python3 scripts/sanitize_terraform_drift.py \
              --region "${region}" \
              --run-id "${GITHUB_RUN_ID}" \
              --run-attempt "${GITHUB_RUN_ATTEMPT}" \
              --detected-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --exit-code "${exit_code}" \
              --plan-json "${plan_json}" \
              --output "${summary_file}"
          else
            python3 scripts/sanitize_terraform_drift.py \
              --region "${region}" \
              --run-id "${GITHUB_RUN_ID}" \
              --run-attempt "${GITHUB_RUN_ATTEMPT}" \
              --detected-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --exit-code 1 \
              --output "${summary_file}"
          fi


      # ----------------------------------------------------------------
      # 5. Upload sanitized summary (always — bounded evidence)
      # ----------------------------------------------------------------
      - name: Upload sanitized drift summary — ${{ matrix.region }}
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: terraform-drift-summary-${{ matrix.region }}-${{ github.run_id }}
          path: terraform-drift-summary-${{ matrix.region }}.json
          retention-days: 7
          if-no-files-found: error

      # ----------------------------------------------------------------
      # 6a. SEV-3 alert — drift detected (exit code 2)
      # ----------------------------------------------------------------
      - name: "[SEV-3] Slack alert — drift detected — ${{ matrix.region }}"
        if: steps.plan.outputs.exitcode == '2'
        # slackapi/slack-github-action@v3.0.3
        # SHA: 45a88b9581bfab2566dc881e2cd66d334e621e2c
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "text": "[SEV-3] Terraform drift detected in region ${{ matrix.region }} — ${{ github.run_id }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": ":rotating_light: SEV-3 Terraform Drift Detected"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Region:*\n`${{ matrix.region }}`" },
                    { "type": "mrkdwn", "text": "*Severity:*\n`SEV-3`" },
                    { "type": "mrkdwn", "text": "*Run ID:*\n`${{ github.run_id }}`" },
                    { "type": "mrkdwn", "text": "*Triggered:*\n`${{ github.event_name }}`" }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":memo: *Runbook:* <https://github.com/${{ github.repository }}/blob/main/specs/05_quality/runbooks/RB-FM-206-terraform-drift.md|RB-FM-206 — Terraform Drift>\n:file_folder: *Sanitized summary:* <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run artifacts>"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":warning: *Auto-apply is FORBIDDEN.* Manual remediation required per RB-FM-206 decision tree. SLA: remediate within 7d."
                  }
                }
              ]
            }

      # ----------------------------------------------------------------
      # 6b. SEV-2 alert — terraform error (exit code 1)
      # ----------------------------------------------------------------
      - name: "[SEV-2] Slack alert — terraform error — ${{ matrix.region }}"
        if: steps.plan.outputs.exitcode == '1'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "text": "[SEV-2] Terraform ERROR in region ${{ matrix.region }} — drift check failed — ${{ github.run_id }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": ":red_circle: SEV-2 Terraform Error (Drift Check Failed)"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Region:*\n`${{ matrix.region }}`" },
                    { "type": "mrkdwn", "text": "*Severity:*\n`SEV-2`" }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":fire: Terraform returned exit code 1 (error). Drift detection is *blind* for this region until resolved. See logs: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Run ${{ github.run_id }}>"
                  }
                }
              ]
            }

  # -----------------------------------------------------------------------
  # Aggregator job: posts multi-region summary if > 1 region drifted.
  # Runs after all matrix jobs complete.
  # -----------------------------------------------------------------------
  drift-aggregator:
    name: Drift aggregator summary
    # zero-hosted (WP-CI): hashicorp/setup-terraform — mesmo caminho do terraform-lint, que já roda aqui
    runs-on: corelink
    timeout-minutes: 5
    needs: drift-check
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Evaluate cross-region drift pattern
        id: aggregate
        env:
          DRIFT_RESULT: ${{ toJson(needs.drift-check.result) }}
        run: |
          set -euo pipefail
          # Count failed jobs (exit 2 = drift, exit 1 = error both appear as failure)
          failed_count=$(echo "$DRIFT_RESULT" | python3 -c "
          import json, sys
          r = json.load(sys.stdin)
          # result is a single string at job level; check all outputs
          print('1' if r == 'failure' else '0')
          ")
          echo "matrix_had_failure=${failed_count}" >> "$GITHUB_OUTPUT"

      - name: "[SEV-3] Multi-region drift summary"
        if: needs.drift-check.result == 'failure'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "text": "[SEV-3] MULTI-REGION Terraform drift aggregator summary — run ${{ github.run_id }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": ":world_map: Multi-Region Terraform Drift Summary"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "One or more regions reported drift or errors in run `${{ github.run_id }}`. Check per-region alerts above + <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|view sanitized summaries>.\n\n*Runbook:* <https://github.com/${{ github.repository }}/blob/main/specs/05_quality/runbooks/RB-FM-206-terraform-drift.md|RB-FM-206>"
                  }
                }
              ]
            }

  # -----------------------------------------------------------------------
  # CI guard: verify no `terraform apply` step exists in this workflow.
  # Runs on every push/PR touching this file.
  # -----------------------------------------------------------------------
  no-apply-guard:
    name: Auto-apply forbidden check
    # zero-hosted (WP-CI): hashicorp/setup-terraform — mesmo caminho do terraform-lint, que já roda aqui
    runs-on: corelink
    timeout-minutes: 3
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Verify no terraform apply in this workflow
        run: |
          set -euo pipefail
          python3 scripts/lint_no_terraform_apply.py \
            .github/workflows/terraform-drift.yml
          echo "::notice::Auto-apply guard passed — no terraform apply step found."
