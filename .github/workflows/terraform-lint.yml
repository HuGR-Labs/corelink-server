name: Terraform Lint

# WI-R-PREP — Lint gate for infra/terraform/**.
#
# Runs:
#   - terraform fmt -recursive -check  (whole tree)
#   - terraform validate                (per environment)
#   - tflint                            (with cloudflare ruleset)
#   - tfsec                             (SARIF upload)
#
# Auto-apply is FORBIDDEN — this workflow only validates.
# Supply-chain: all third-party actions SHA-pinned per WI-S01-007.

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-lint.yml"
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write # for tfsec SARIF upload

concurrency:
  group: terraform-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.7.5"
          terraform_wrapper: false

      - name: terraform fmt -recursive -check
        run: terraform -chdir=infra/terraform fmt -recursive -check -diff

  validate:
    name: terraform validate (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [staging]
        # production/ is .example-only until GA; add once activated.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.7.5"
          terraform_wrapper: false

      - name: terraform init -backend=false
        working-directory: infra/terraform/environments/${{ matrix.env }}
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: infra/terraform/environments/${{ matrix.env }}
        run: terraform validate -no-color

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.55.1

      - name: tflint --init
        run: tflint --chdir=infra/terraform --init
        env:
          # GitHub token avoids tflint rate-limiting when fetching plugins.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: tflint --recursive
        run: tflint --chdir=infra/terraform --recursive --format compact

  tfsec:
    name: tfsec
    runs-on: ubuntu-latest
    # Native tfsec (no container action). `aquasecurity/tfsec-sarif-action` is a
    # Docker container action we avoid (no-unpinned-action posture). We download
    # the pinned tfsec linux binary from GitHub Releases (SHA-256 verified,
    # mirroring the supply-chain pin pattern in tla_check.yml) and run it
    # directly on the GitHub-hosted ubuntu-latest fleet.
    env:
      TFSEC_VERSION: "1.28.14"
      # SHA-256 of the RAW `tfsec-linux-amd64` release asset for the version
      # above. The published checksums.txt only covers the .tar.gz archives, so
      # this hash was captured + verified out-of-band against an independent
      # download. Re-pin requires re-deriving this hash for the new version.
      TFSEC_SHA256_PINNED: "a32d0799bbefababaa4fcd814da9f4d251cd932789590b99d1d5fcb89ace6f68"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tfsec (pinned, SHA-256 verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tfsec"
          BIN="$RUNNER_TEMP/tfsec/tfsec"
          curl -fsSL -o "$BIN" \
            "https://github.com/aquasecurity/tfsec/releases/download/v${TFSEC_VERSION}/tfsec-linux-amd64"
          ACTUAL_SHA="$(sha256sum "$BIN" | awk '{print $1}')"
          echo "tfsec SHA-256 actual: ${ACTUAL_SHA}"
          echo "tfsec SHA-256 expect: ${TFSEC_SHA256_PINNED}"
          # HARD-FAIL on hash drift (supply-chain pin per WI-S01-007).
          if [ "${ACTUAL_SHA}" != "${TFSEC_SHA256_PINNED}" ]; then
            echo "::error::tfsec SHA-256 supply-chain pin violation (WI-S01-007)" >&2
            echo "::error::expected: ${TFSEC_SHA256_PINNED}" >&2
            echo "::error::actual:   ${ACTUAL_SHA}" >&2
            exit 1
          fi
          chmod +x "$BIN"
          "$BIN" --version

      - name: tfsec
        run: |
          set -euo pipefail
          # `--force-all-dirs`: scan EVERY .tf under infra/terraform (modules,
          # regions, environments — ~65 files / 417 blocks), not just the root
          # module graph. Without it tfsec only reads the top-level main.tf and
          # the gate passes trivially while ~all of the IaC goes unscanned.
          # tfsec exits non-zero on any UNSUPPRESSED finding, so the gate fails
          # if new IaC introduces an un-reviewed issue. The single known finding
          # (the BYOK `kms:ReEncrypt*` action wildcard, scoped to specific
          # `customer_kms_key_arns`) is an owner-reviewed, justified exception
          # carried as an inline `tfsec:ignore` in aws-kms/main.tf (2026-06-02),
          # so tfsec currently exits 0 here.
          "$RUNNER_TEMP/tfsec/tfsec" infra/terraform \
            --force-all-dirs \
            --format sarif \
            --out tfsec.sarif \
            --no-color

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        # Best-effort: the Security tab (code-scanning / GHAS) is not enabled on
        # this private repo, so this upload returns "Resource not accessible by
        # integration / Code scanning is not enabled" and would otherwise red the
        # whole tfsec job even though the scan above passed. `continue-on-error`
        # keeps the JOB status driven by the actual tfsec result; once GHAS is
        # enabled the SARIF will populate the Security tab with no further change.
        continue-on-error: true
        if: always()
        with:
          sarif_file: tfsec.sarif
          category: tfsec
