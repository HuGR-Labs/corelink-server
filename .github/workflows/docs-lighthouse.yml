name: docs lighthouse (≥ 95 nightly + tag)

# WI-S18-005 deliverable 6 — Lighthouse CI gate for docs site.
# Performance ≥ 95, A11y = 100, Best Practices ≥ 95, SEO ≥ 90 on 5 routes.
# Spec contract S-18 §5.6 R-S18-13 + Quality Standard 14.s18.1.

on:
  schedule:
    - cron: "0 8 * * *"  # nightly 08:00 UTC
  push:
    tags:
      - "docs-v*"
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: lighthouse-ci (≥ 95 perf + 100 a11y)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v4.1.0
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm build

      - name: Run Lighthouse CI
        run: pnpm exec lhci autorun --config=lighthouserc.cjs

      - name: Upload LHCI report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-lhci-report
          path: apps/docs/.lighthouseci/
          retention-days: 14
