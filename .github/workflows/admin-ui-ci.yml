name: admin-ui CI

# WI-S16-001 — typecheck + lint + test + build for the Next.js admin UI.
#
# Runs on `runs-on: corelink` (CoreLink's own ephemeral runner fabric) as of
# 2026-08-04; previously GitHub-hosted `ubuntu-latest`. See the block above
# `runs-on:` for the measured cost, the box's specs, and the ephemeral-box
# caveats.

on:
  pull_request:
    paths:
      - "apps/admin-ui/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/admin-ui-ci.yml"
      # This job's `pnpm install` behaviour comes from the composite action as
      # much as from this file, so a change to it must re-run this gate.
      - ".github/actions/setup-pnpm/**"
  push:
    branches: [main]
    paths:
      - "apps/admin-ui/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/admin-ui-ci.yml"
      # This job's `pnpm install` behaviour comes from the composite action as
      # much as from this file, so a change to it must re-run this gate.
      - ".github/actions/setup-pnpm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-ui-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Sliced one-job-per-phase (matrix) so a runner that dies mid-`build` does NOT
    # discard the phases that already passed: GitHub banks each green leg, and
    # `gh run rerun --failed` re-runs only the leg that died — never re-doing a
    # phase that already went green. That property matters MORE on the ephemeral
    # `corelink` fabric than it did hosted, because a lost box is the fabric's
    # known failure mode (a `corelink-client-verify` job died 2026-08-03 with
    # "the self-hosted runner lost communication with the server" and passed on a
    # plain re-run, #1021).
    #   - fail-fast: false → a killed/failed leg must not cancel the others.
    #   - max-parallel: 2  → kept, but for a NEW reason. It was written to cap
    #     peak load on the shared self-hosted Mac, which this workflow already
    #     did not use. On the fabric it caps how many spawns one admin-ui run
    #     demands at once: the fabric's real concurrency is well under its
    #     nominal cap, and a spawn that is refused strands its job QUEUED rather
    #     than queueing it politely. 2-at-a-time trades ~2 min of wall clock for
    #     not competing with the Rust lanes for boxes. Raise it only with a
    #     measured fabric capacity number in hand.
    # NOTE: `next build` re-runs tsc + eslint internally, so the build leg
    # overlaps the typecheck/lint legs; kept independent for banking. A future
    # optimization can set typescript.ignoreBuildErrors / eslint.ignoreDuringBuilds
    # in next.config since the dedicated legs already cover them.
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        # `cf:build` (OpenNext → CF Worker bundle) is the REAL prod-deploy path;
        # stock `next build` passing does NOT prove it deploys (a Next-major bump
        # can break OpenNext's traced-files/standalone step while `next build`
        # stays green — #679 shipped that way and only broke post-merge in
        # admin-ui-deploy). Gating `cf:build` here verifies the deploy path on
        # every admin-ui PR. Build-only (no wrangler deploy) → needs no CF creds.
        #
        # `timeout` rides in the matrix so each leg is bounded by ITS OWN measured
        # median rather than by the slowest leg's — the spread here is 3.5x
        # (64 s typecheck vs 221 s test), so one blanket number would leave the
        # short legs effectively unbounded. Rule applied: ~3x the median, floor
        # 10 min. Medians are job-level durations from the Actions API over the
        # last 30 hosted runs (n=28 successes per leg; n=27 for `test`), measured
        # 2026-08-04. They are a fair basis for the fabric even though they were
        # taken hosted: the `pnpm install` step in them was already effectively
        # cold every run (see the pnpm-store note on `Set up Node.js` below), so
        # the fabric's lack of a persistent store costs nothing extra here, and
        # the box has twice the cores.
        include:
          - task: typecheck # median 64 s → 3x = 3.2 min → floor
            timeout: 10
          - task: lint # median 67 s → 3x = 3.4 min → floor
            timeout: 10
          - task: test # median 221 s → 3x = 11.1 min
            timeout: 12
          - task: build # median 88 s → 3x = 4.4 min → floor
            timeout: 10
          - task: "cf:build" # median 96 s → 3x = 4.8 min → floor
            timeout: 10
    name: ${{ matrix.task }}
    # Runner: `corelink` — CoreLink's own ephemeral runner fabric (2026-08-04;
    # previously GitHub-hosted `ubuntu-latest`). This workflow burned 811 billed
    # hosted minutes (~$4.87) across 77 runs in the 3 days to 2026-08-03; a minute
    # on `corelink` costs $0 of GitHub billing, so the move removes all of it.
    #
    # This lane was never BLOCKED from moving. `actions/setup-node` already ran
    # here, and `./.github/actions/setup-pnpm` already carried a documented
    # `pnpm/action-setup` fallback. What the 2026-08-03 image roll changed is that
    # node 22.23.2 / npm 10.9.8 / pnpm 10.32.1 are now on the box's PATH, so the
    # composite takes its zero-network fast path instead of the fallback — which,
    # measured on hosted, downloads pnpm on EVERY run (log: "pnpm 10.32.1 not
    # pre-installed (found: none) — falling back to the pinned download").
    # ⚠️ `docs/internal/ci-runner-fabric-box.md` §3 and §5 still say node/npm/pnpm
    # are ABSENT from PATH. That was true of the pre-2026-08-03 image and is now
    # stale; the box's own `Set up pnpm` step output is the authority.
    #
    # The box is 4 vCPU / 12.5 GB (probe run 30825772599) against ubuntu-latest's
    # 2 vCPU / 7 GB on a private repo — twice the cores.
    #
    # ⚠️ Ephemeral-runner reality — the box is destroyed after the job, so NOTHING
    # caches between runs: no pnpm store, no `node_modules`, no Next build cache.
    # `pnpm install --frozen-lockfile` re-fetches from the registry every run
    # (~28-35 s hosted). That is not a regression: the GitHub-side pnpm cache this
    # workflow used to configure never hit even once — see `Set up Node.js`.
    #
    # ⚠️ A refused or dropped fabric spawn leaves the job QUEUED, and
    # `timeout-minutes` does NOT bound queued time — it only starts counting once
    # the job is RUNNING. That is a stall, not a false pass:
    # `scripts/pre-merge-gate-check.sh` scores a pending check as ⛔ DO NOT MERGE,
    # so a stranded box blocks the PR rather than waving it through.
    runs-on: corelink
    timeout-minutes: ${{ matrix.timeout }}
    defaults:
      run:
        working-directory: apps/admin-ui
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # On the fabric box this takes the composite's zero-network fast path
      # (pnpm 10.32.1 is pre-installed as of the 2026-08-03 image), so the
      # `pnpm/action-setup` download that hosted runs paid on every job is gone.
      # The step prints which path it took — that output is the live check on
      # whether the image still ships pnpm.
      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm

      # KEPT deliberately, even though the box now ships node 22.23.2 on PATH.
      # The image drifts unmonitored — rustc moved 1.91.1 → 1.96.0 in two days
      # between the two probe runs with no announcement — so "the box has node"
      # is a snapshot, not a contract. This step pins the major explicitly and
      # fails loudly if it ever cannot provide it, instead of silently compiling
      # the admin UI on whatever node the image happens to ship. The cost is one
      # node download per run on a box with no tool cache (hosted resolved it for
      # free from /opt/hostedtoolcache).
      #
      # `cache: pnpm` + `cache-dependency-path` REMOVED. Measured, not assumed:
      # across the 20 jobs of the last 4 hosted runs the restore printed "pnpm
      # cache is not found" 20/20 times and the post step then wrote a ~330 MB
      # blob 20/20 times. 0% hit rate, ~1.6 GB written per run.
      #
      # Root cause: `setup-pnpm` scopes the store to
      # `$HOME/.pnpm-store-$RUNNER_NAME` (its fix for the shared-$HOME race on
      # the Mac fleet). `setup-node` resolves the cache PATH from `pnpm store
      # path`, so the path is runner-unique. The actions/cache entry is keyed by
      # (key, version) where version is a hash of the path list — the key is
      # lockfile-stable but the version changes on every runner, so a restore can
      # never match, and each of the 5 matrix legs writes its own copy. The repo
      # cache budget is 10 GB; the API showed 28 live `node-cache-*` entries at
      # ~330 MB each, i.e. this dead cache was occupying ~9 GB and evicting the
      # Rust `Swatinem/rust-cache` entries that other lanes DO restore from.
      #
      # Not "fixed" by re-keying here, because the fix belongs in the composite
      # (shared with docs-ci et al.) and this file must not change it. Removing
      # the input is the honest local action: it deletes a step that reported
      # success while caching nothing, and stops the eviction pressure. If the
      # store scoping is ever made runner-independent, re-add `cache: pnpm` and
      # verify a "Cache restored from key" line before believing it works.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: ${{ matrix.task }}
        run: pnpm ${{ matrix.task }}
