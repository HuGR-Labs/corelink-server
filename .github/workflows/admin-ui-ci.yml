name: admin-ui CI

# WI-S16-001 — typecheck + lint + test + build for the Next.js admin UI.

on:
  pull_request:
    paths:
      - "apps/admin-ui/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/admin-ui-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/admin-ui/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/admin-ui-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-ui-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck + lint + test + build
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/admin-ui
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
