name: admin-ui CI

# WI-S16-001 — typecheck + lint + test + build for the Next.js admin UI.

on:
  pull_request:
    paths:
      - "apps/admin-ui/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/admin-ui-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/admin-ui/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/admin-ui-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-ui-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Sliced one-job-per-phase (matrix) so a runner that dies mid-`build` on the
    # contended self-hosted Mac does NOT discard the phases that already passed:
    # GitHub banks each green leg, and `gh run rerun --failed` re-runs only the
    # leg that died — never re-doing a phase that already went green. Short legs
    # (typecheck/lint ~1-2 min, test ~2-3 min, build ~3-5 min) also complete
    # inside the brief low-load windows on the shared Mac, instead of needing
    # one sustained ~10-min window like the old monolithic job did.
    #   - fail-fast: false → a killed/failed leg must not cancel the others.
    #   - max-parallel: 2  → cap peak load on the shared self-hosted Mac.
    # NOTE: `next build` re-runs tsc + eslint internally, so the build leg
    # overlaps the typecheck/lint legs; kept independent for banking. A future
    # optimization can set typescript.ignoreBuildErrors / eslint.ignoreDuringBuilds
    # in next.config since the dedicated legs already cover them.
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        # `cf:build` (OpenNext → CF Worker bundle) is the REAL prod-deploy path;
        # stock `next build` passing does NOT prove it deploys (a Next-major bump
        # can break OpenNext's traced-files/standalone step while `next build`
        # stays green — #679 shipped that way and only broke post-merge in
        # admin-ui-deploy). Gating `cf:build` here verifies the deploy path on
        # every admin-ui PR. Build-only (no wrangler deploy) → needs no CF creds.
        task: [typecheck, lint, test, build, cf:build]
    name: ${{ matrix.task }}
    # TEMPORARY (2026-08-02): GitHub-hosted runners are billing-blocked
    # (jobs die in ~2s, zero steps, runner=""). Moved to the self-hosted
    # mac fleet to keep the PR gates ALIVE. Revert to ubuntu-latest once
    # billing clears or the corelink runner fleet is generally available.
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/admin-ui
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: ${{ matrix.task }}
        run: pnpm ${{ matrix.task }}
