name: admin-ui CI

# WI-S16-001 — typecheck + lint + test + build for the Next.js admin UI.

on:
  pull_request:
    paths:
      - "apps/admin-ui/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/admin-ui-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/admin-ui/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/admin-ui-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-ui-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck + lint + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/admin-ui
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v4.1.0
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
