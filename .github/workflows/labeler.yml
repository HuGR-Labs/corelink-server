# Auto-label PRs based on changed paths.
# -----------------------------------------------------------------------------
# Reads `.github/labeler.yml`. Runs on every PR open/sync/reopen. Labels are
# additive — never removes labels a human added.
#
# Permissions: `pull-requests: write` is the minimum required to apply labels.
# `contents: read` is needed for the action to read the labeler config from
# the base ref (safer than checking out HEAD on a fork PR).
#
# Cross-link: .github/labeler.yml (rules), .github/CODEOWNERS (routing).

name: PR Auto-Label (paths)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Apply path-based labels
    runs-on: [self-hosted, mac, corelink-builder]
    steps:
      - name: Apply labels
        uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          # Never strip labels a human triaged in.
          sync-labels: false
          # Operate on the PR's diff (default true on v5 — explicit for clarity).
          dot: true
