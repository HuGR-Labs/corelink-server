name: api reference sync (regenerate MDX from openapi/corelink-v1.yaml)

# Drift gate for the auto-generated typed REST API reference under
# `apps/docs/docs/reference/api/`.
#
#  - On `pull_request` that touches the canonical YAML or the
#    generator, runs `scripts/gen-api-reference.py --check` and fails
#    the PR if the reference set is stale; the failure message tells
#    the author exactly which command to run.
#  - On `push` to `main` that touches the YAML or generator, regenerates
#    the reference set and (if there is a diff) opens an automated
#    follow-up PR via `gh pr create`. This keeps the docs branch
#    self-healing even if the originating PR forgot to regenerate.
#  - Manual `workflow_dispatch` is supported for ad-hoc regeneration.
#
# Charter: all actions SHA-pinned (mirror of openapi-validate.yml).

on:
  pull_request:
    paths:
      - "openapi/corelink-v1.yaml"
      - "scripts/gen-api-reference.py"
      - "apps/docs/docs/reference/api/**"
      - ".github/workflows/api-reference-sync.yml"
  push:
    branches: [main]
    paths:
      - "openapi/corelink-v1.yaml"
      - "scripts/gen-api-reference.py"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: api-reference-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-check:
    name: drift check (PR-side)
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # No actions/setup-python: the self-hosted mac fleet can't reliably
      # provision Python via setup-python (RUNNER_TOOL_CACHE is unset -> it
      # falls back to the unwritable /Users/runner hosted path and dies with
      # `mkdir: /Users/runner: Permission denied`). Use system python3 with a
      # repo-local venv for pyyaml. (2026-06-04)
      - name: Install Python deps (venv on system python3)
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python3 -m pip install --upgrade pip
          .venv/bin/python3 -m pip install pyyaml
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run generator in --check mode
        run: |
          set -euo pipefail
          python3 scripts/gen-api-reference.py --check

      - name: How to fix
        if: failure()
        run: |
          echo "::error::API reference is stale. Run locally and commit:"
          echo "::error::  python3 scripts/gen-api-reference.py"

  regenerate-and-pr:
    name: regenerate + open PR (main-side)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          # Need a writable token for the auto-PR branch push.
          token: ${{ secrets.GITHUB_TOKEN }}

      # No actions/setup-python: system python3 on the mac fleet. pyyaml
      # installed into a repo-local venv. (2026-06-04)
      - name: Install Python deps (venv on system python3)
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python3 -m pip install --upgrade pip
          .venv/bin/python3 -m pip install pyyaml
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Regenerate reference set
        run: |
          set -euo pipefail
          python3 scripts/gen-api-reference.py

      - name: Detect changes
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet apps/docs/docs/reference/api/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "info: reference is already up to date"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat apps/docs/docs/reference/api/ | head -50
          fi

      - name: Configure git identity
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name  "corelink-bot"
          git config user.email "bot@humangr.com"

      - name: Open auto-sync PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="bot/api-reference-sync-${GITHUB_SHA::7}"
          git checkout -b "$BRANCH"
          git add apps/docs/docs/reference/api/
          # Use a heredoc temp file for the commit message so the YAML
          # block stays a clean indented scalar.
          MSG_FILE="$(mktemp)"
          {
            echo "chore(docs): auto-regen API reference from openapi/corelink-v1.yaml"
            echo ""
            echo "Triggered by ${GITHUB_SHA} on ${GITHUB_REF}."
          } > "$MSG_FILE"
          git commit -F "$MSG_FILE"
          git push -u origin "$BRANCH"
          BODY_FILE="$(mktemp)"
          {
            echo "Auto-generated by \`.github/workflows/api-reference-sync.yml\` after a change to \`openapi/corelink-v1.yaml\` or \`scripts/gen-api-reference.py\` landed on \`main\` without an accompanying reference regeneration."
            echo ""
            echo "Run locally to regenerate:"
            echo ""
            echo '```bash'
            echo "python3 scripts/gen-api-reference.py"
            echo '```'
            echo ""
            echo "Triggered by commit \`${GITHUB_SHA}\`."
          } > "$BODY_FILE"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(docs): auto-regen API reference (drift from openapi/corelink-v1.yaml)" \
            --body-file "$BODY_FILE"
