name: TLA+ dsr_erasure_atomicity Model Check (WI-S11-008)

# Runs TLC v1.8.0 SHA-256 pinned (ADR-0042 §A1) over
# specs/tla/dsr_erasure_atomicity.tla. Dedicated gate for S-11 WI-S11-008
# privacy-erasure atomicity + consent-symmetry + residency-pinning spec.
#
# Gates via scripts/run_tlc_corelink.sh which enforces:
#   1. TLC binary SHA-256 supply-chain pin (mandatory per ADR-0042 §A1)
#   2. .tla + .cfg presence verification
#   3. TLC INVARIANTS + PROPERTIES check (exit code 0 = all pass)
#
# The 5 invariants + 3 temporal properties checked are:
#   INVARIANTS (state predicates):
#     - TypeOK                     (type safety, shape of all variables)
#     - InvErasureComplete         (INV-DATA-ERASURE-COMPLETE CRITICAL — 12-backend atomic gate)
#     - InvConsentSymmetry         (INV-CONSENT-PROOF-VERIFIABLE CRITICAL — Lote 9.4 H-05 schema parity)
#     - InvBackendAckIdempotent    (PAT-RETRY-IDEMPOTENT-001 replay safety)
#     - InvResidencyPinned         (INV-DATA-RESIDENCY CRITICAL — canonical 6-region pinning)
#   PROPERTIES (temporal):
#     - InvAuditAppendOnly         (INV-AUDIT-APPEND-ONLY CRITICAL — Len monotonic + prefix preserved)
#     - InvResidencyMonotonic      (residency monotonic — once pinned, never migrated)
#     - EventualTermination        (liveness: in-flight tickets reach terminal state)
#
# CI block on any failure (exit code != 0).
# Status: PLANNED → green after first sustained CI run per ADR-S11-012 honest-flag.
#
# Reference: invariant_registry.md §4.2 L414 (INV-DATA-ERASURE-COMPLETE) +
#            L452 (INV-CONSENT-PROOF-VERIFIABLE) — PLANNED → green after this workflow first passes.

on:
  pull_request:
    paths:
      - 'specs/tla/dsr_erasure_atomicity.tla'
      - 'specs/tla/dsr_erasure_atomicity.cfg'
      - 'scripts/run_tlc_corelink.sh'
      - '.github/workflows/tla_dsr_erasure_check.yml'
      # S-11 WI-S11-008 contract trigger surface:
      - 'crates/corelink-privacy-erasure-worker/**'
      - 'crates/corelink-privacy/**'
      # Schema + architecture docs that the model abstracts:
      - 'specs/03_architecture/invariant_registry.md'
      - 'specs/03_architecture/privacy_model.md'
      - 'specs/04_sprints/S11/_spec_contract.md'
      - 'specs/04_sprints/S11/work_items/WI-S11-008-dpia-lia-3-filled-tla-dsr-erasure-atomicity.md'
      # DPIA/LIA docs (DPIA CI hook companion):
      - 'legal/dpia/**'
      - 'legal/lia/**'
      - 'scripts/validate_dpia.py'
  push:
    branches: [main]
    paths:
      # Mirror PR trigger surface (post-merge must observe same surface):
      - 'specs/tla/dsr_erasure_atomicity.tla'
      - 'specs/tla/dsr_erasure_atomicity.cfg'
      - 'scripts/run_tlc_corelink.sh'
      - '.github/workflows/tla_dsr_erasure_check.yml'
      - 'crates/corelink-privacy-erasure-worker/**'
      - 'crates/corelink-privacy/**'
      - 'specs/03_architecture/invariant_registry.md'
      - 'specs/03_architecture/privacy_model.md'
      - 'specs/04_sprints/S11/_spec_contract.md'
      - 'legal/dpia/**'
      - 'legal/lia/**'
      - 'scripts/validate_dpia.py'

permissions:
  contents: read
  pull-requests: read

jobs:
  tla-dsr-erasure-check:
    name: TLC dsr_erasure_atomicity (WI-S11-008 INV-DATA-ERASURE-COMPLETE)
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java (TLC requires JVM ≥ 11)
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install pinned TLC v1.8.0 (SHA-256 verified — ADR-0042 §A1)
        env:
          TLC_VERSION: '1.8.0'
          TLC_SHA256_PINNED: 'd5d07d5dab38ddb840c91ec48fa02f28b37a608d5af9a73570018591dbc8ef7f'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tla"
          curl -fsSL -o "$RUNNER_TEMP/tla/tla2tools.jar" \
            "https://github.com/tlaplus/tlaplus/releases/download/v${TLC_VERSION}/tla2tools.jar"
          ACTUAL_SHA="$(sha256sum "$RUNNER_TEMP/tla/tla2tools.jar" | awk '{print $1}')"
          echo "TLC SHA-256 actual:   ${ACTUAL_SHA}"
          echo "TLC SHA-256 expected: ${TLC_SHA256_PINNED}"
          if [[ "${ACTUAL_SHA}" != "${TLC_SHA256_PINNED}" ]]; then
            echo "::error::TLC SHA-256 supply-chain pin violation (ADR-0042 §A1)" >&2
            echo "::error::expected: ${TLC_SHA256_PINNED}" >&2
            echo "::error::actual:   ${ACTUAL_SHA}" >&2
            echo "::error::Re-pin requires Security review + ADR-0042 §A1 update + Architect sign-off" >&2
            exit 1
          fi
          echo "TLC SHA-256 pin verified OK (ADR-0042 §A1)"
          # Install wrapper script — CI runner enforces $TLC_JAR for hash (not wrapper)
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/tlc" <<'WRAPPER'
          #!/usr/bin/env bash
          exec java -cp "$TLC_JAR" tlc2.TLC "$@"
          WRAPPER
          chmod +x "$HOME/.local/bin/tlc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "TLC_JAR=$RUNNER_TEMP/tla/tla2tools.jar" >> "$GITHUB_ENV"

      - name: TLC verify dsr_erasure_atomicity (WI-S11-008)
        # run_tlc_corelink.sh re-verifies SHA-256 as defense-in-depth (TLC_JAR env set above).
        # TLC_SHA256_SKIP is NOT set — mandatory hash check enforced.
        # Checks: TypeOK + InvErasureComplete + InvConsentSymmetry + InvBackendAckIdempotent
        #         + InvResidencyPinned (INVARIANTS) + InvAuditAppendOnly + InvResidencyMonotonic
        #         + EventualTermination (PROPERTIES).
        # State space target: 5,000–500,000 states (bounded by MaxConcurrentErasures=2,
        #   MaxAuditChainLen=30, MaxAttempts=5, |Tickets|=2, |Backends|=12).
        run: bash scripts/run_tlc_corelink.sh dsr_erasure_atomicity

      - name: Validate DPIA presence (WI-S11-008 CI hook)
        # Basic presence check — full PII-detection hook is in validate_dpia.py.
        # This step ensures the 3 required DPIAs are committed before this WI merges.
        run: |
          set -euo pipefail
          REQUIRED_DPIAS=(
            "legal/dpia/s07-dedup-leakage.md"
            "legal/dpia/s09-telemetry-aggregation.md"
            "legal/dpia/s10-billing-cross-border.md"
          )
          REQUIRED_LIAS=(
            "legal/lia/s09-telemetry-aggregation.md"
          )
          all_ok=true
          for f in "${REQUIRED_DPIAS[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "::error::Required DPIA missing: $f" >&2
              all_ok=false
            else
              echo "DPIA present: $f"
            fi
          done
          for f in "${REQUIRED_LIAS[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "::error::Required LIA missing: $f" >&2
              all_ok=false
            else
              echo "LIA present: $f"
            fi
          done
          if [[ "$all_ok" != "true" ]]; then
            echo "::error::DPIA/LIA presence check failed — ensure WI-S11-008 artifacts are committed" >&2
            exit 1
          fi
          echo "All required DPIA/LIA artifacts present."

      - name: Run DPIA hook validate_dpia.py (PII detection)
        # validate_dpia.py checks PRs modifying PII-handling paths for DPIA coverage.
        # Runs in --check-only mode here (no PR context in this workflow).
        run: python3 scripts/validate_dpia.py --check-only
