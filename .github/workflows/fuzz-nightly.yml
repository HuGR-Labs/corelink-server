name: Fuzz nightly (BYOK + tenant-path + audit-chain + HKDF)

concurrency:
  # Keep scheduled and manual runs in separate groups. A manual dispatch must
  # never cancel a scheduled measurement (the cancellation observed in #1686).
  group: "ci-fuzz-nightly-byok-tenant-path-audit-chain-hkdf-${{ github.event_name }}-${{ github.ref }}"
  # A fuzz run is evidence. Serialize equivalent runs and let the explicit
  # job/step timeouts stop a wedged or over-budget process.
  cancel-in-progress: false

# Nightly fuzz lane for the pre-pentest hardening surface: BYOK
# envelope encryption, tenant-path HMAC derivation (extended), audit-
# chain hash-chain append + JCS canonicalization, HKDF-SHA256 expand.
#
# The six targets run as independent shards for 30 min on hosted Linux. The
# schedule is enabled again after #1686: versioned runner evidence showed the
# former macOS host lacked FuzzerPlatform.h and libFuzzer C++ sources.
# Corpus is persisted via actions/cache so scheduled and manual runs grow it
# monotonically.
# Fail-closed: any libfuzzer-discovered crash uploads the offending
# artifact + exits non-zero.

on:
  schedule:
    # 03:17 UTC nightly — staggered before the 04:23 UTC main nightly.
    - cron: '17 3 * * *'
  workflow_dispatch:
    # Manual trigger for a bounded re-run after a crypto-adjacent change.

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # 30 min per target (1800s). PR-gate runs at 300s via scripts/fuzz-all.sh.
  FUZZ_DURATION: '1800'

jobs:
  fuzz-matrix-expansion:
    name: fuzz 30m (${{ matrix.crate }}::${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # cargo-fuzz requires nightly; hosted jobs install it in their isolated
    # workspace and never mutate another job's toolchain.
    env:
      RUSTUP_TOOLCHAIN: nightly
      FUZZ_CRATE: ${{ matrix.crate }}
      FUZZ_TARGET: ${{ matrix.target }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { crate: corelink-byok, target: wrapped_dek_parse }
          - { crate: corelink-byok, target: envelope_roundtrip }
          - { crate: tenant-path, target: derive_prefix_extended }
          - { crate: corelink-audit-chain, target: merkle_append }
          - { crate: corelink-audit-chain, target: jcs_canonicalize }
          - { crate: corelink-ac, target: hkdf_expand }
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Hosted jobs have an isolated HOME. Pin the action revision while using
      # the nightly channel required by cargo-fuzz.
      - name: Install nightly toolchain (cargo-fuzz)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: nightly

      # The installer binary is kept in its runner-local tools directory, but
      # the Cargo registry/git checkout and build output used by `cargo fuzz`
      # must not fall back to the shared ~/.cargo or a shared fuzz target.
      # Every matrix leg gets a fresh run/attempt/crate/target namespace.
      - name: Isolate fuzz Cargo and target state per matrix leg
        run: |
          set -euo pipefail
          CARGO_HOME="${RUNNER_TEMP}/corelink-fuzz-cargo/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${FUZZ_CRATE}/${FUZZ_TARGET}"
          CARGO_TARGET_DIR="${RUNNER_TEMP}/corelink-fuzz-target/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${FUZZ_CRATE}/${FUZZ_TARGET}"
          mkdir -p "${CARGO_HOME}" "${CARGO_TARGET_DIR}"
          echo "CARGO_HOME=${CARGO_HOME}" >> "${GITHUB_ENV}"
          echo "CARGO_TARGET_DIR=${CARGO_TARGET_DIR}" >> "${GITHUB_ENV}"

      # `cargo install` compiles cargo-fuzz's OWN dependency tree (aws-lc-sys, syn,
      # tokio, ctutils, parking_lot …) into whatever CARGO_HOME points at. Pointed at
      # the SHARED `~/.cargo`, it mutates the registry that every other concurrent
      # Rust job on this 5-runner Mac is compiling from — and those are exactly the
      # crate names in the `os error 2` failures. cargo-fuzz is NOT pre-installed on
      # the host, so this ran on EVERY fuzz job, not just after a version bump.
      #
      # Same class as the 2026-06-15 rustup incident documented in fuzz-nightly.yml
      # (shared `~/.rustup` mutated mid-run), one level down: shared `~/.cargo`.
      # There is no prebuilt binary to switch to — cargo-fuzz has no manifest in
      # taiki-e/install-action at the SHA this repo pins, so it would silently fall
      # back to this same from-source install.
      #
      # Fix: build the tool itself into a PER-RUNNER CARGO_HOME. The preceding
      # step separately isolates the Cargo state used by the actual fuzz run.
      - name: Install cargo-fuzz (isolated CARGO_HOME — never the shared one)
        timeout-minutes: 20
        run: |
          set -euo pipefail
          TOOLS="$HOME/.cargo-tools/${RUNNER_NAME:-default}"
          mkdir -p "$TOOLS/bin"
          echo "$TOOLS/bin" >> "$GITHUB_PATH"
          if "$TOOLS/bin/cargo-fuzz" --version 2>/dev/null | grep -Fx 'cargo-fuzz 0.13.2' >/dev/null; then
            echo "cargo-fuzz 0.13.2 already in $TOOLS — no compile, no shared-registry write"
          else
            echo "compiling cargo-fuzz 0.13.2 into $TOOLS (isolated from ~/.cargo)"
            CARGO_HOME="$TOOLS" cargo install cargo-fuzz --locked --version =0.13.2
          fi

      - name: Rust target cache
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          workspaces: "crates/${{ matrix.crate }}/fuzz -> target"

      - name: Restore fuzz corpus (warm-start across nightly runs)
        # Corpus persists across runs so libfuzzer accelerates faster
        # on a known-good seed set. Keyed by crate::target so each
        # target has an isolated corpus.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/${{ matrix.crate }}/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.crate }}-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.crate }}-${{ matrix.target }}-

      - name: Run fuzz target (${{ env.FUZZ_DURATION }}s)
        working-directory: crates/${{ matrix.crate }}
        timeout-minutes: 35
        run: |
          set -euo pipefail
          cargo fuzz run ${{ matrix.target }} -- -max_total_time=${{ env.FUZZ_DURATION }}

      - name: Upload fuzz artifacts on failure
        # libfuzzer drops crash-* / leak-* / timeout-* artifacts here.
        # Persist for 14 days so the on-call has time to root-cause
        # before retention expires.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.crate }}-${{ matrix.target }}
          path: crates/${{ matrix.crate }}/fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14
