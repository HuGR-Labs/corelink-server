name: tenant-path (WI-S01-001)

# CI gate for the corelink-tenant-path crate per WI-S01-001 §13 + §17.
# Fast lane on every PR; nightly full lane includes 1h fuzz + cargo-mutants.

on:
  pull_request:
    paths:
      - 'crates/tenant-path/**'
      - 'apps/server/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/tenant-path.yml'
  # NOTE: no `push: branches:[main]`. The build/clippy/test lane compiles the
  # crate (debug + release) on the self-hosted macOS fleet; re-running it on every
  # main merge fed the heavy-gate stampede (load 398/665, 2026-06-04; extends the
  # 977225d3 "stop heavy-gate stampede" sweep). The nightly cron below + the PR
  # `paths:` lane above keep continuous + targeted coverage.
  schedule:
    # Nightly full lane (fuzz 1h, cargo-mutants, criterion compare).
    - cron: '17 4 * * *'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # PR gate is crate-scoped only. Workspace-wide gates (fmt, clippy --workspace,
  # test --workspace, doc --workspace) live in cas_foundation.yml::workspace-build-test
  # per CI-OPT-001. cargo-audit advisory DB scan lives in cargo-audit.yml
  # per CI-OPT-004 (removes floating rustsec/audit-check@v1 ref).
  pr-gate:
    name: PR gate (crate-scoped clippy + tests + canonical vectors)
    runs-on: [self-hosted, mac, corelink-builder]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout@v4.3.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # dtolnay/rust-toolchain@stable@2026-05-15
        with:
          components: clippy, rustfmt

      - name: Cargo cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # Swatinem/rust-cache@v2.9.1
        with:
          workspaces: ". -> target"

      - name: cargo clippy (corelink-tenant-path, -D warnings)
        run: cargo clippy --package corelink-tenant-path --all-targets -- -D warnings

      - name: cargo test (corelink-tenant-path, debug)
        run: cargo test --package corelink-tenant-path --all-targets

      - name: cargo test (release, includes perf regression gate AC-6)
        run: cargo test --release --package corelink-tenant-path

      - name: cargo test (canonical vectors only — fast smoke)
        run: cargo test --package corelink-tenant-path canonical_vectors

  fuzz-smoke:
    name: cargo-fuzz smoke (60s)
    runs-on: [self-hosted, mac, corelink-builder]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout@v4.3.1
      # Self-hosted Macs already ship rustup+cargo; re-provisioning via
      # dtolnay/rust-toolchain collides on `bin/cargo`. Put the pre-installed
      # host nightly toolchain (cargo-fuzz requires nightly) on PATH instead —
      # see CLAUDE.md "the rustup proxy is broken" note.
      - name: Put host nightly toolchain on PATH (cargo-fuzz needs nightly)
        run: echo "$HOME/.rustup/toolchains/nightly-x86_64-apple-darwin/bin" >> "$GITHUB_PATH"
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Cargo cache (fuzz)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # Swatinem/rust-cache@v2.9.1
        with:
          workspaces: "crates/tenant-path/fuzz -> target"
      - name: Run fuzz target 60s
        working-directory: crates/tenant-path
        run: cargo fuzz run derive_prefix -- -max_total_time=60

  fuzz-nightly:
    name: cargo-fuzz nightly (1h)
    runs-on: [self-hosted, mac, corelink-builder]
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout@v4.3.1
      # Self-hosted Macs already ship rustup+cargo; re-provisioning via
      # dtolnay/rust-toolchain collides on `bin/cargo`. Put the pre-installed
      # host nightly toolchain (cargo-fuzz requires nightly) on PATH instead —
      # see CLAUDE.md "the rustup proxy is broken" note.
      - name: Put host nightly toolchain on PATH (cargo-fuzz needs nightly)
        run: echo "$HOME/.rustup/toolchains/nightly-x86_64-apple-darwin/bin" >> "$GITHUB_PATH"
      - run: cargo install cargo-fuzz --locked
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # Swatinem/rust-cache@v2.9.1
        with:
          workspaces: "crates/tenant-path/fuzz -> target"
      - name: Run fuzz target 3600s
        working-directory: crates/tenant-path
        run: cargo fuzz run derive_prefix -- -max_total_time=3600

  mutants-nightly:
    name: cargo-mutants kill-rate ≥ 80%
    runs-on: [self-hosted, mac, corelink-builder]
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout@v4.3.1
      # Self-hosted Macs already ship rustup+cargo; re-provisioning via
      # dtolnay/rust-toolchain collides on `bin/cargo`. Put the pre-installed
      # host toolchain (workspace pins 1.91.1 via rust-toolchain.toml) on PATH
      # instead — see CLAUDE.md "the rustup proxy is broken" note.
      - name: Put host toolchain on PATH (workspace-pinned 1.91.1)
        run: echo "$HOME/.rustup/toolchains/1.91.1-x86_64-apple-darwin/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # Swatinem/rust-cache@v2.9.1
        with:
          workspaces: ". -> target"
      - run: cargo install cargo-mutants --locked
      - name: Run cargo-mutants
        run: cargo mutants --package corelink-tenant-path --no-shuffle --check
