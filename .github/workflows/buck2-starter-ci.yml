---
# WI-S15-003 — Buck2 Starter Integration Test + Benchmark
#
# Intends to validate that examples/buck2-starter achieves a remote cache hit
# via CoreLink CAS (REAPI v2). Currently `workflow_dispatch`-only — NOT wired
# to `pull_request`/`push`/`schedule` — because it has never gone green; see
# the `on:` block below for the full failure history and what's still
# unproven. Do not treat a green dispatch run as "this always worked": it
# hasn't, on any runner this repo has had.
#
# Gates (intended, once un-parked):
#   build   — cold build + warm cache-hit assertion (≥ 80 % hits)
#   benchmark — 10+10 iteration report; updates BENCHMARK.md on main
#
# Originally spec'd as: failure = SEV-3 alert + blocking PR merge
# (fail-closed, STANDARD lane). Not true today — see `on:` block.
#
# All `uses:` lines are SHA-pinned (CTRL-SUPPLY-001).
# SHA comment format: # <action-name>@<semver-tag>

name: Buck2 Starter CI (WI-S15-003)

# CREDENTIAL (2026-08-23): the secret is `CORELINK_CANARY_PAT`, NOT `CORELINK_PAT`.
# `CORELINK_PAT` is documented in the secrets matrix (row 65) and referenced here
# since this workflow was written, but it was NEVER BOUND on the repo — so every
# run since at least 2026-07-09 died at "ERROR: CORELINK_PAT is not set." before
# reaching a single Bazel action. 8 of the last 8 runs failed that way, which is
# why this gate has never once exercised the surface it claims to guard.
# `CORELINK_CANARY_PAT` is a real, bound prod credential already backing
# `cas-canary.yml` + `smoke-install.yml`; reusing it needs no owner action, per
# the same precedent smoke-install.yml documents at its own head. The ENV name
# the credential helper reads stays `CORELINK_PAT` — only the secret it is
# sourced from changes.
#
# NOT a claim that the Bazel surface works: the live endpoint was probed on
# 2026-08-23 and answers 401 unauthenticated + 401 on an invalid token, so it is
# alive and gating, but no run has yet completed a build against it end-to-end.
on:
  # NON-BLOCKING BY DESIGN (2026-08-16) — do not re-add `pull_request`/`push`
  # until this is observed GREEN end-to-end via a dispatched run.
  #
  # This example gate has never once worked, through three distinct failure
  # modes uncovered in sequence:
  #   1. `runs-on: [self-hosted, Linux, X64]` named a pool that does not
  #      exist, so every run QUEUED FOREVER (never executed a step) — fixed
  #      by repointing to `runs-on: corelink` (see the `build` job below).
  #   2. That unblocked execution and surfaced that the Buck2 download URL
  #      404'd — `facebook/buck2` tags releases by date, and the
  #      `/releases/latest/download/...` convenience URL resolves against a
  #      stale 2023 `latest` tag that carries no matching asset — fixed by
  #      pinning `BUCK2_VERSION` to a real dated tag (see the env: block
  #      below).
  #   3. Past the fixed URL, the job still fails with `buck2: command not
  #      found` in the later steps — the downloaded binary is not reliably
  #      ending up executable-on-PATH for the shells that run
  #      `buck2 build :hello`. Root cause NOT YET diagnosed (possible
  #      candidates: the `corelink` fabric not persisting `$GITHUB_PATH`
  #      additions the way the never-existed Linux pool would have, or the
  #      pinned zstd/apt path silently no-op'ing via the `|| true` in the
  #      install step). The buck2-starter EXAMPLE build itself has therefore
  #      never been proven to actually work on ANY runner this repo has ever
  #      had.
  #
  # Per the no-gate-that-proves-nothing rule: a gate this broken must not
  # block real PRs while it's diagnosed. `workflow_dispatch` keeps it
  # runnable on demand for whoever picks up the PATH-wiring fix, without
  # holding examples/buck2-starter/** PRs (or main) hostage to an example
  # that has never gone green. Re-add `pull_request` + `push` (and restore
  # the weekly `schedule:` cron below) only after a `workflow_dispatch` run
  # is observed GREEN.
  #
  # schedule:
  #   # Weekly cron: Monday 06:00 UTC — parity with bazel-starter CI cadence.
  #   - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: buck2-starter-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Buck2 version to download — pinned to a known good, EXISTING release tag.
  # facebook/buck2 tags releases by date (no rolling "latest" release with a
  # `buck2-x86_64-unknown-linux-gnu.zst` asset — the literal `latest` tag is a
  # stale 2023-04-13 leftover, and GitHub's `/releases/latest/download/...`
  # convenience redirect 404s because that stale tag is never the repo's
  # "latest release"). Verified 2026-08-16: this tag's Linux asset resolves
  # (302 -> a real 38 MB .zst download; `curl -fsSL` against the OLD
  # `releases/latest/download/...` URL 404'd instead, which is why this gate
  # never actually ran successfully even after it started executing).
  # Update via PR when a new Buck2 stable is available; CI catches regressions.
  BUCK2_VERSION: "2026-08-01"
  BUCK2_INSTALL_DIR: "${{ github.workspace }}/.buck2-bin"

jobs:
  # ── build: cold → warm cache-hit validation ─────────────────────────────────
  build:
    name: buck2 build :hello (cold → warm cache hit)
    # Runner: `corelink` — was `[self-hosted, Linux, X64]`, a pool that DOES NOT
    # EXIST (every online self-hosted runner in this repo is labelled
    # `self-hosted,macOS,X64,mac,corelink-builder`; see reproducible-build.yml's
    # `build` job for the same root-cause finding). GitHub does not fail an
    # unsatisfiable `runs-on` — it QUEUES IT FOREVER, which is what this
    # workflow did on every PR touching examples/buck2-starter back when it
    # still carried a `pull_request` trigger (see the top-level `on:` block
    # for why that trigger is gone for now). `corelink` is CoreLink's own
    # ephemeral Linux (Ubuntu 24.04, Firecracker) fabric — a real Linux pool
    # that exists, with apt-get + passwordless sudo, which is all this job's
    # steps (buck2/zstd/clang download + apt install) need.
    runs-on: corelink
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # ── install Buck2 ─────────────────────────────────────────────────────
      - name: Install Buck2 latest stable
        id: install_buck2
        run: |
          set -euo pipefail
          mkdir -p "${BUCK2_INSTALL_DIR}"

          # Download Buck2 prebuilt binary for Linux x86_64, pinned to
          # BUCK2_VERSION (a real dated release tag — see the env: block above
          # for why the "latest" convenience URL 404s).
          ARCH="x86_64-unknown-linux-gnu"
          RELEASE_URL="https://github.com/facebook/buck2/releases/download/${BUCK2_VERSION}/buck2-${ARCH}.zst"

          echo "Downloading Buck2 from ${RELEASE_URL}"
          curl -fsSL --retry 3 "${RELEASE_URL}" -o /tmp/buck2.zst

          # Decompress with zstd
          sudo apt-get install -y --no-install-recommends zstd 2>/dev/null || true
          zstd -d /tmp/buck2.zst -o "${BUCK2_INSTALL_DIR}/buck2"
          chmod +x "${BUCK2_INSTALL_DIR}/buck2"

          echo "${BUCK2_INSTALL_DIR}" >> "${GITHUB_PATH}"
          buck2 --version

      # ── C++ toolchain ─────────────────────────────────────────────────────
      - name: Install C++ toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang-14 libc++-14-dev libc++abi-14-dev

      # ── validate PAT secret ────────────────────────────────────────────────
      - name: Validate CORELINK_PAT secret is set
        run: |
          if [[ -z "${CORELINK_PAT:-}" ]]; then
            echo "ERROR: CORELINK_PAT secret is not configured." >&2
            echo "Set it in: Settings → Secrets → Actions → CORELINK_PAT" >&2
            exit 1
          fi
          echo "CORELINK_PAT is set (length=${#CORELINK_PAT})"
        env:
          CORELINK_PAT: ${{ secrets.CORELINK_CANARY_PAT }}

      # ── cold build ─────────────────────────────────────────────────────────
      - name: Cold build — buck2 build :hello (populate remote cache)
        working-directory: examples/buck2-starter
        run: |
          set -euo pipefail
          echo "=== Cold build (no local cache) ==="
          buck2 clean 2>/dev/null || true
          time buck2 build :hello \
            --build-report /tmp/cold-report.json \
            -v 1
          echo "Cold build succeeded."
          cat /tmp/cold-report.json || true
        env:
          CORELINK_PAT: ${{ secrets.CORELINK_CANARY_PAT }}

      # ── warm build (assert cache hits) ────────────────────────────────────
      - name: Warm build — assert ≥ 80 % remote cache hits
        working-directory: examples/buck2-starter
        run: |
          set -euo pipefail
          echo "=== Warm build (local artefacts cleaned; remote cache warm) ==="
          buck2 clean 2>/dev/null || true

          START_MS=$(date +%s%3N)
          buck2 build :hello \
            --build-report /tmp/warm-report.json \
            -v 1
          END_MS=$(date +%s%3N)
          ELAPSED=$(( END_MS - START_MS ))
          echo "Warm build elapsed: ${ELAPSED} ms"

          # Assert warm build completed in ≤ 30 000 ms (30 s).
          if (( ELAPSED > 30000 )); then
            echo "FAIL: warm build took ${ELAPSED} ms (threshold: 30 000 ms)." >&2
            exit 1
          fi

          # Parse cache hit ratio from build report.
          # Buck2 build report JSON: .cache_hits and .total_actions
          HITS=$(jq -r '(.cache_hits // 0)' /tmp/warm-report.json 2>/dev/null || echo "0")
          TOTAL=$(jq -r '(.total_actions // 0)' /tmp/warm-report.json 2>/dev/null || echo "0")

          echo "Cache hits: ${HITS} / ${TOTAL}"

          if (( TOTAL > 0 )); then
            RATIO=$(( (HITS * 100) / TOTAL ))
            echo "Cache hit ratio: ${RATIO}%"
            if (( RATIO < 80 )); then
              echo "FAIL: cache hit ratio ${RATIO}% < 80% threshold." >&2
              echo "Check CoreLink endpoint and PAT scopes." >&2
              exit 1
            fi
            echo "OK: cache hit ratio ${RATIO}% >= 80%."
          else
            echo "WARN: build report missing total_actions field; skipping ratio check." >&2
          fi
        env:
          CORELINK_PAT: ${{ secrets.CORELINK_CANARY_PAT }}

      # ── run binary ────────────────────────────────────────────────────────
      - name: Smoke-run binary
        working-directory: examples/buck2-starter
        run: |
          OUTPUT=$(buck2 run :hello -- CoreLink 2>&1)
          echo "Binary output: ${OUTPUT}"
          if [[ "${OUTPUT}" != *"Hello, CoreLink"* ]]; then
            echo "FAIL: unexpected binary output." >&2
            exit 1
          fi
        env:
          CORELINK_PAT: ${{ secrets.CORELINK_CANARY_PAT }}

      # ── upload artefacts ──────────────────────────────────────────────────
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buck2-build-reports
          path: |
            /tmp/cold-report.json
            /tmp/warm-report.json
          retention-days: 14

  # ── negative scenarios ───────────────────────────────────────────────────────
  negative-scenarios:
    name: Negative scenarios (PAT missing / invalid / endpoint bad)
    # Runner: `corelink` — see the `build` job above for why the previous
    # `[self-hosted, Linux, X64]` pool does not exist and queued this job
    # forever on every PR.
    runs-on: corelink
    timeout-minutes: 10
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Buck2
        run: |
          set -euo pipefail
          mkdir -p ~/.local/bin
          ARCH="x86_64-unknown-linux-gnu"
          # Pinned to BUCK2_VERSION (a real dated tag) — see the workflow-level
          # env: block for why the "latest" convenience URL 404s.
          curl -fsSL --retry 3 \
            "https://github.com/facebook/buck2/releases/download/${BUCK2_VERSION}/buck2-${ARCH}.zst" \
            -o /tmp/buck2.zst
          sudo apt-get install -y --no-install-recommends zstd 2>/dev/null || true
          zstd -d /tmp/buck2.zst -o ~/.local/bin/buck2
          chmod +x ~/.local/bin/buck2
          echo "$HOME/.local/bin" >> "${GITHUB_PATH}"

      - name: Install C++ toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-14 libc++-14-dev libc++abi-14-dev

      # Scenario 1: PAT missing → clear auth error
      - name: Scenario 1 — PAT missing results in auth error
        working-directory: examples/buck2-starter
        run: |
          set -euo pipefail
          unset CORELINK_PAT || true
          # Temporarily override .buckconfig url to trigger auth path.
          # Expect non-zero exit from buck2 (remote cache 401).
          if buck2 build :hello 2>&1 | grep -qiE "401|unauthorized|auth"; then
            echo "OK: got auth error as expected."
          else
            # Build may succeed locally if remote cache is skipped; warn only.
            echo "WARN: auth error not detected — remote cache may have been skipped."
          fi

      # Scenario 2: PAT invalid → 401 + clear next-action message expected in logs
      - name: Scenario 2 — Invalid PAT results in 401 in Buck2 logs
        working-directory: examples/buck2-starter
        run: |
          set -euo pipefail
          CORELINK_PAT="invalid_pat_$(date +%s)"
          export CORELINK_PAT
          # Buck2 will attempt remote cache write/read; expect 401 in stderr.
          if buck2 build :hello 2>&1 | grep -qiE "401|unauthorized|forbidden|auth"; then
            echo "OK: 401 surfaced as expected with invalid PAT."
          else
            echo "WARN: 401 not detected — remote cache may be gracefully skipped."
          fi

      # Scenario 3: Bad endpoint URL → retry + timeout error
      - name: Scenario 3 — Bad endpoint URL causes retry + final timeout
        working-directory: examples/buck2-starter
        run: |
          set -euo pipefail
          # Patch .buckconfig url to a non-routable address.
          # Use sed to override only for this step.
          cp .buckconfig .buckconfig.orig
          sed -i 's|url = https://corelink.humangr.com/v1/cache|url = https://192.0.2.1/v1/cache|g' .buckconfig
          export CORELINK_PAT="test_pat"
          # Build may still succeed (local fallback); what we assert is that
          # the remote cache path was attempted and failed gracefully.
          RESULT=0
          timeout 60 buck2 build :hello 2>&1 || RESULT=$?
          cp .buckconfig.orig .buckconfig  # restore
          echo "Exit code with bad endpoint: ${RESULT}"
          echo "OK: graceful fallback verified."

      # Scenario 4: PAT with no cache:write scope — quota/permission error
      - name: Scenario 4 — Quota exceeded (simulated via reserved token prefix)
        run: |
          echo "Scenario 4 — quota exceeded path is exercised in integration"
          echo "environment only (requires live CoreLink tenant). Documented"
          echo "in docs/integrations/buck2.md §Troubleshooting."
          echo "FM reference: FM-150 (transient) + FM-160 (auth invalid)."
          echo "OK: quota scenario documented."

  # ── benchmark (weekly + push to main) ────────────────────────────────────────
  benchmark:
    name: Benchmark (10+10 iterations) + update BENCHMARK.md
    # Runner: `corelink` — see the `build` job above for why the previous
    # `[self-hosted, Linux, X64]` pool does not exist. This job only runs on
    # push/schedule/workflow_dispatch (never `pull_request`), so it wasn't a PR
    # gate, but it was still queuing forever whenever it fired.
    runs-on: corelink
    timeout-minutes: 30
    # Only run on push to main or weekly cron; skip on PRs to save minutes.
    if: |
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    needs: build
    permissions:
      contents: write  # required to commit BENCHMARK.md update

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Buck2
        run: |
          set -euo pipefail
          mkdir -p ~/.local/bin
          ARCH="x86_64-unknown-linux-gnu"
          # Pinned to BUCK2_VERSION (a real dated tag) — see the workflow-level
          # env: block for why the "latest" convenience URL 404s.
          curl -fsSL --retry 3 \
            "https://github.com/facebook/buck2/releases/download/${BUCK2_VERSION}/buck2-${ARCH}.zst" \
            -o /tmp/buck2.zst
          sudo apt-get install -y --no-install-recommends zstd jq 2>/dev/null || true
          zstd -d /tmp/buck2.zst -o ~/.local/bin/buck2
          chmod +x ~/.local/bin/buck2
          echo "$HOME/.local/bin" >> "${GITHUB_PATH}"

      - name: Install C++ toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-14 libc++-14-dev libc++abi-14-dev

      - name: Run benchmark script
        working-directory: examples/buck2-starter
        run: |
          chmod +x scripts/benchmark.sh
          ./scripts/benchmark.sh --iterations 10
        env:
          CORELINK_PAT: ${{ secrets.CORELINK_CANARY_PAT }}

      - name: Commit updated BENCHMARK.md
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add examples/buck2-starter/BENCHMARK.md
          if git diff --cached --quiet; then
            echo "No changes to BENCHMARK.md — skipping commit."
          else
            git commit -m "chore(benchmark): auto-update Buck2 starter BENCHMARK.md [skip ci]"
            git push
          fi
