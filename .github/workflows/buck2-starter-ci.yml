---
# WI-S15-003 — Buck2 Starter Integration Test + Benchmark
#
# Intends to validate that examples/buck2-starter achieves a remote cache hit
# via CoreLink CAS (REAPI v2). Currently `workflow_dispatch`-only — NOT wired
# to `pull_request`/`push`/`schedule` — because it has never gone green; see
# the `on:` block below for the full failure history and what's still
# unproven. Do not treat a green dispatch run as "this always worked": it
# hasn't, on any runner this repo has had.
#
# Gates (intended, once un-parked):
#   build   — cold build + warm cache-hit assertion (≥ 80 % hits)
#   benchmark — 10+10 iteration report; uploaded as a workflow artifact
#
# Originally spec'd as: failure = SEV-3 alert + blocking PR merge
# (fail-closed, STANDARD lane). Not true today — see `on:` block.
#
# All `uses:` lines are SHA-pinned (CTRL-SUPPLY-001).
# SHA comment format: # <action-name>@<semver-tag>

name: Buck2 Starter CI (WI-S15-003)

# CREDENTIAL (2026-08-23): the secret is `CORELINK_CANARY_PAT`, NOT `CORELINK_PAT`.
# `CORELINK_PAT` is documented in the secrets matrix (row 65) and referenced here
# since this workflow was written, but it was NEVER BOUND on the repo — so every
# run since at least 2026-07-09 died at "ERROR: CORELINK_PAT is not set." before
# reaching a single Bazel action. 8 of the last 8 runs failed that way, which is
# why this gate has never once exercised the surface it claims to guard.
# `CORELINK_CANARY_PAT` is a real, bound prod credential already backing
# `cas-canary.yml` + `smoke-install.yml`; reusing it needs no owner action, per
# the same precedent smoke-install.yml documents at its own head. The ENV name
# the credential helper reads stays `CORELINK_PAT` — only the secret it is
# sourced from changes.
#
# NOT a claim that the Bazel surface works: the live endpoint was probed on
# 2026-08-23 and answers 401 unauthenticated + 401 on an invalid token, so it is
# alive and gating, but no run has yet completed a build against it end-to-end.
on:
  # NON-BLOCKING BY DESIGN (2026-08-16) — do not re-add `pull_request`/`push`
  # until this is observed GREEN end-to-end via a dispatched run.
  #
  # This example gate has never once worked, through three distinct failure
  # modes uncovered in sequence:
  #   1. `runs-on: [self-hosted, Linux, X64]` named a pool that does not
  #      exist, so every run QUEUED FOREVER (never executed a step) — fixed
  #      by repointing to `runs-on: corelink` (see the `build` job below).
  #   2. That unblocked execution and surfaced that the Buck2 download URL
  #      404'd — `facebook/buck2` tags releases by date, and the
  #      `/releases/latest/download/...` convenience URL resolves against a
  #      stale 2023 `latest` tag that carries no matching asset — fixed by
  #      pinning `BUCK2_VERSION` to a real dated tag (see the env: block
  #      below).
  #   3. DIAGNOSED 2026-08-31 (WP-E) — was "root cause NOT YET diagnosed".
  #      The `buck2: command not found` is not in "the later steps": it is the
  #      LAST LINE OF THE INSTALL STEP ITSELF. That step wrote
  #      `$BUCK2_INSTALL_DIR` into `$GITHUB_PATH` and then immediately ran
  #      `buck2 --version` — but `$GITHUB_PATH` only takes effect in SUBSEQUENT
  #      steps, never in the one that writes it. Verbatim tail of run
  #      31978160612:
  #
  #        /opt/actions-runner/_work/_temp/e625eb87-….sh: line 19: buck2: command not found
  #        ##[error]Process completed with exit code 127
  #
  #      Both candidates named above are REFUTED by that same log, and both
  #      mattered because each would have implied a much larger fix:
  #        - the `corelink` fabric DOES persist `$GITHUB_PATH` normally; nothing
  #          about the fabric is involved.
  #        - the apt/zstd path did NOT silently no-op — the log shows
  #          `Setting up zstd (1.5.5+dfsg2-2build1.1)` and a successful
  #          decompress of `/tmp/buck2.zst : 133202112 bytes`. The `|| true`
  #          never fired, and the `BUCK2_VERSION` pin is live (the tag resolves,
  #          it does not 404).
  #      Fixed by invoking the binary by absolute path in that step.
  #
  #      Note this bug is NOT present in the second job's installer, which
  #      appends to `$GITHUB_PATH` and does not invoke `buck2` in-step. So job 2
  #      fails later or not at all — its state is simply unknown, because 77
  #      runs never got past step 2.
  #
  # Per the no-gate-that-proves-nothing rule: a gate this broken must not
  # block real PRs while it's diagnosed. `workflow_dispatch` keeps it
  # runnable on demand for whoever picks up the PATH-wiring fix, without
  # holding examples/buck2-starter/** PRs (or main) hostage to an example
  # that has never gone green. Re-add `pull_request` + `push` (and restore
  # the weekly `schedule:` cron below) only after a `workflow_dispatch` run
  # is observed GREEN.
  #
  # schedule:
  #   # Weekly cron: Monday 06:00 UTC — parity with bazel-starter CI cadence.
  #   - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: buck2-starter-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Buck2 version to download — pinned to a known good, EXISTING release tag.
  # facebook/buck2 tags releases by date (no rolling "latest" release with a
  # `buck2-x86_64-unknown-linux-gnu.zst` asset — the literal `latest` tag is a
  # stale 2023-04-13 leftover, and GitHub's `/releases/latest/download/...`
  # convenience redirect 404s because that stale tag is never the repo's
  # "latest release"). Verified 2026-08-16: this tag's Linux asset resolves
  # (302 -> a real 38 MB .zst download; `curl -fsSL` against the OLD
  # `releases/latest/download/...` URL 404'd instead, which is why this gate
  # never actually ran successfully even after it started executing).
  # Update via PR when a new Buck2 stable is available; CI catches regressions.
  BUCK2_VERSION: "2026-08-01"
  # The 2026-08-01 release asset embeds the preceding build date in its
  # version string (observed in run 35743969492). Keep the release tag and the
  # binary's reported build version explicit so the smoke check validates the
  # exact pinned artifact without conflating those two identifiers.
  BUCK2_BUILD_VERSION: "2026-07-31"
  # Digest of buck2-x86_64-unknown-linux-gnu.zst for BUCK2_VERSION.  The
  # dated URL is immutable in practice, but the digest is the enforceable
  # supply-chain boundary (a changed asset must not become executable).
  BUCK2_SHA256: "aa304d471a79f69233b09767d4ba9add769049b7a37f78a3a71a72983372f511"
  BUCK2_INSTALL_DIR: "${{ github.workspace }}/.buck2-bin"

jobs:
  # ── build: cold → warm cache-hit validation ─────────────────────────────────
  build:
    name: buck2 build :hello (cold → warm cache hit)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # ── install Buck2 ─────────────────────────────────────────────────────
      - name: Install Buck2 latest stable
        id: install_buck2
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p "${BUCK2_INSTALL_DIR}"

          # Download Buck2 prebuilt binary for Linux x86_64, pinned to
          # BUCK2_VERSION (a real dated release tag — see the env: block above
          # for why the "latest" convenience URL 404s).
          ARCH="x86_64-unknown-linux-gnu"
          RELEASE_URL="https://github.com/facebook/buck2/releases/download/${BUCK2_VERSION}/buck2-${ARCH}.zst"

          echo "Downloading Buck2 from ${RELEASE_URL}"
          ARCHIVE="${RUNNER_TEMP}/buck2-${BUCK2_VERSION}.zst"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            --connect-timeout 10 --max-time 120 "${RELEASE_URL}" -o "${ARCHIVE}"

          if command -v sha256sum >/dev/null 2>&1; then
            ACTUAL_SHA256="$(sha256sum "${ARCHIVE}" | awk '{print $1}')"
          else
            ACTUAL_SHA256="$(openssl dgst -sha256 "${ARCHIVE}" | awk -F'= ' '{print $2}')"
          fi
          if [[ "${ACTUAL_SHA256}" != "${BUCK2_SHA256}" ]]; then
            echo "::error::Buck2 SHA-256 mismatch: expected ${BUCK2_SHA256}, got ${ACTUAL_SHA256}"
            exit 1
          fi

          # Own every tool consumed below instead of depending on incidental
          # packages in a particular ephemeral runner image.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zstd jq
          zstd -d "${ARCHIVE}" -o "${BUCK2_INSTALL_DIR}/buck2"
          chmod +x "${BUCK2_INSTALL_DIR}/buck2"

          # `$GITHUB_PATH` only takes effect in SUBSEQUENT steps — never in the
          # step that writes it. The smoke check below therefore ran before the
          # PATH entry existed and exited 127 with `buck2: command not found`,
          # which is the entirety of this lane's 77-run / 0-success record.
          # Call the binary by its absolute path here; the `>> $GITHUB_PATH`
          # above is still what serves every LATER step.
          echo "${BUCK2_INSTALL_DIR}" >> "${GITHUB_PATH}"
          VERSION_OUTPUT="$("${BUCK2_INSTALL_DIR}/buck2" --version)"
          printf '%s\n' "${VERSION_OUTPUT}"
          grep -F -- "${BUCK2_BUILD_VERSION}" <<<"${VERSION_OUTPUT}" || {
            echo "::error::Buck2 reported an unexpected version: ${VERSION_OUTPUT}" >&2
            exit 1
          }

      # ── C++ toolchain ─────────────────────────────────────────────────────
      - name: Install C++ toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang-14 libc++-14-dev libc++abi-14-dev

      # ── validate PAT secret ────────────────────────────────────────────────
      - name: Validate CORELINK_PAT secret is set
        id: validate-pat
        run: |
          if [[ -z "${CORELINK_PAT:-}" ]]; then
            echo "ERROR: CORELINK_PAT secret is not configured." >&2
            echo "Set it in: Settings → Secrets → Actions → CORELINK_PAT" >&2
            exit 1
          fi
          echo "CORELINK_PAT is set (length=${#CORELINK_PAT})"
          echo "present=true" >> "${GITHUB_OUTPUT}"
        env:
          CORELINK_PAT: ${{ secrets.CORELINK_CANARY_PAT }}

      # This cache is only a runner-local acceleration layer for the pinned
      # Buck2 release.  The full repository and exact commit are part of the
      # key: a warm result from another repository or SHA must never be
      # admitted.  There are deliberately no restore-keys fallbacks.
      - name: Restore exact Buck2 cache namespace
        id: buck2-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: examples/buck2-starter/buck-out/v2/cache
          key: buck2-build-${{ github.repository }}-${{ github.sha }}

      - name: Record Buck2 cache provenance
        run: |
          set -euo pipefail
          cat > /tmp/buck2-cache-provenance.txt <<EOF
          key=buck2-build-${GITHUB_REPOSITORY}-${GITHUB_SHA}
          matched_key=${{ steps.buck2-cache-restore.outputs.cache-matched-key }}
          authenticated_pat=true
          EOF

      # ── cold build ─────────────────────────────────────────────────────────
      - name: Cold build — buck2 build :hello (populate remote cache)
        working-directory: examples/buck2-starter
        run: |
          set -euo pipefail
          echo "=== Cold build (no local cache) ==="
          buck2 clean
          time buck2 build :hello \
            --build-report /tmp/cold-report.json \
            -v 1
          echo "Cold build succeeded."
          test -s /tmp/cold-report.json
          jq -e 'type == "object"' /tmp/cold-report.json >/dev/null
          cat /tmp/cold-report.json
        env:
          CORELINK_PAT: ${{ secrets.CORELINK_CANARY_PAT }}

      # ── warm build (assert cache hits) ────────────────────────────────────
      - name: Warm build — assert ≥ 80 % remote cache hits
        id: warm-build
        working-directory: examples/buck2-starter
        run: |
          set -euo pipefail
          echo "=== Warm build (local artefacts cleaned; remote cache warm) ==="
          buck2 clean

          START_MS=$(date +%s%3N)
          buck2 build :hello \
            --build-report /tmp/warm-report.json \
            -v 1
          END_MS=$(date +%s%3N)
          ELAPSED=$(( END_MS - START_MS ))
          echo "Warm build elapsed: ${ELAPSED} ms"

          # Assert warm build completed in ≤ 30 000 ms (30 s).
          if (( ELAPSED > 30000 )); then
            echo "FAIL: warm build took ${ELAPSED} ms (threshold: 30 000 ms)." >&2
            exit 1
          fi

          # Parse the documented pinned Buck2 report schema. The parser reads
          # build_metrics.metrics.remote_cache_hits and declared_actions and
          # rejects missing, renamed, typed, negative, fractional, or
          # inconsistent counters. A broken cache assertion must stay red.
          test -s /tmp/warm-report.json || {
            echo "FAIL: warm build did not produce a report." >&2; exit 1;
          }
          COUNTERS="$(python3 -S "${GITHUB_WORKSPACE}/scripts/parse_buck2_build_report.py" \
            --report /tmp/warm-report.json)"
          read -r HITS TOTAL <<<"${COUNTERS}"

          echo "Cache hits: ${HITS} / ${TOTAL}"

          RATIO=$(( (HITS * 100) / TOTAL ))
          echo "Cache hit ratio: ${RATIO}%"
          if (( RATIO < 80 )); then
            echo "FAIL: cache hit ratio ${RATIO}% < 80% threshold." >&2
            echo "Check CoreLink endpoint and PAT scopes." >&2
            exit 1
          fi
          echo "OK: cache hit ratio ${RATIO}% >= 80%."
        env:
          CORELINK_PAT: ${{ secrets.CORELINK_CANARY_PAT }}

      # ── run binary ────────────────────────────────────────────────────────
      - name: Smoke-run binary
        working-directory: examples/buck2-starter
        run: |
          OUTPUT=$(buck2 run :hello -- CoreLink 2>&1)
          echo "Binary output: ${OUTPUT}"
          if [[ "${OUTPUT}" != *"Hello, CoreLink"* ]]; then
            echo "FAIL: unexpected binary output." >&2
            exit 1
          fi
        env:
          CORELINK_PAT: ${{ secrets.CORELINK_CANARY_PAT }}

      # ── upload artefacts ──────────────────────────────────────────────────
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buck2-build-reports
          path: |
            /tmp/cold-report.json
            /tmp/warm-report.json
            /tmp/buck2-cache-provenance.txt
          retention-days: 14

      # Save only a successful, authenticated candidate under the exact
      # repository/SHA key.  A missing PAT can therefore never populate a
      # cache namespace that a later warm build would trust.
      - name: Save exact Buck2 cache namespace
        if: steps.validate-pat.outputs.present == 'true' && steps.warm-build.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: examples/buck2-starter/buck-out/v2/cache
          key: buck2-build-${{ github.repository }}-${{ github.sha }}

  # ── negative scenarios ───────────────────────────────────────────────────────
  negative-scenarios:
    name: Negative scenarios (PAT missing / invalid / endpoint bad)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Keep negative probes independent: a failed canary build must not skip
    # the auth, endpoint, and quota assertions that diagnose separate causes.

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Buck2
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p ~/.local/bin
          ARCH="x86_64-unknown-linux-gnu"
          # Pinned to BUCK2_VERSION (a real dated tag) — see the workflow-level
          # env: block for why the "latest" convenience URL 404s.
          ARCHIVE="${RUNNER_TEMP}/buck2-${BUCK2_VERSION}.zst"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            --connect-timeout 10 --max-time 120 \
            "https://github.com/facebook/buck2/releases/download/${BUCK2_VERSION}/buck2-${ARCH}.zst" \
            -o "${ARCHIVE}"
          if command -v sha256sum >/dev/null 2>&1; then
            ACTUAL_SHA256="$(sha256sum "${ARCHIVE}" | awk '{print $1}')"
          else
            ACTUAL_SHA256="$(openssl dgst -sha256 "${ARCHIVE}" | awk -F'= ' '{print $2}')"
          fi
          [[ "${ACTUAL_SHA256}" == "${BUCK2_SHA256}" ]] || {
            echo "::error::Buck2 SHA-256 mismatch: expected ${BUCK2_SHA256}, got ${ACTUAL_SHA256}"; exit 1;
          }
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zstd
          zstd -d "${ARCHIVE}" -o ~/.local/bin/buck2
          chmod +x ~/.local/bin/buck2
          echo "$HOME/.local/bin" >> "${GITHUB_PATH}"

      - name: Install C++ toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-14 libc++-14-dev libc++abi-14-dev

      # Scenario 1: PAT missing → clear auth error
      - name: Scenario 1 — PAT missing results in auth error
        working-directory: examples/buck2-starter
        run: |
          set -euo pipefail
          echo "negative probes independent"
          unset CORELINK_PAT
          set +e
          OUTPUT="$(
            if [[ -z "${CORELINK_PAT:-}" ]]; then
              echo "CORELINK_PAT is missing; refusing unauthenticated remote-cache build." >&2
              exit 78
            fi
            buck2 build :hello 2>&1
          ) 2>&1"
          RESULT=$?
          set -e
          printf '%s\n' "${OUTPUT}"
          (( RESULT != 0 )) || { echo "FAIL: missing PAT was accepted." >&2; exit 1; }
          grep -qiE '401|unauthorized|forbidden|authentication|auth|corelink_pat.*(set|missing|required)' <<<"${OUTPUT}" || {
            echo "FAIL: missing PAT did not produce an authentication error." >&2; exit 1;
          }
          echo "OK: missing PAT failed closed with an authentication error."

      # Scenario 2: PAT invalid → 401 + clear next-action message expected in logs
      - name: Scenario 2 — Invalid PAT results in 401 in Buck2 logs
        working-directory: examples/buck2-starter
        run: |
          set -euo pipefail
          export CORELINK_PAT="invalid_pat_b113"
          set +e
          OUTPUT="$(buck2 build :hello 2>&1)"
          RESULT=$?
          set -e
          printf '%s\n' "${OUTPUT}"
          (( RESULT != 0 )) || { echo "FAIL: invalid PAT was accepted." >&2; exit 1; }
          grep -qiE '401|unauthorized|forbidden|authentication|auth' <<<"${OUTPUT}" || {
            echo "FAIL: invalid PAT did not produce an authentication error." >&2; exit 1;
          }
          echo "OK: invalid PAT failed closed with an authentication error."

      # Scenario 3: Bad endpoint URL → retry + timeout error
      - name: Scenario 3 — Bad endpoint URL causes retry + final timeout
        working-directory: examples/buck2-starter
        run: |
          set -euo pipefail
          # Patch .buckconfig url to a non-routable address.
          # Use sed to override only for this step.
          cp .buckconfig .buckconfig.orig
          trap 'cp .buckconfig.orig .buckconfig' EXIT
          sed -i -E 's|url = https://[^[:space:]]+|url = https://192.0.2.1/bad-cache|g' .buckconfig
          export CORELINK_PAT="test_pat"
          set +e
          OUTPUT="$(timeout 60 buck2 build :hello 2>&1)"
          RESULT=$?
          set -e
          printf '%s\n' "${OUTPUT}"
          (( RESULT != 0 )) || { echo "FAIL: bad endpoint was accepted." >&2; exit 1; }
          if (( RESULT == 124 )); then
            echo "OK: bad endpoint hit the explicit 60s timeout."
          else
            grep -qiE 'timed out|timeout|unreachable|refused|failed|error|network' <<<"${OUTPUT}" || {
              echo "FAIL: bad endpoint did not produce a network failure." >&2; exit 1;
            }
            echo "OK: bad endpoint produced a network failure."
          fi

      # Scenario 4: dedicated tenant PAT with no cache:write scope — real
      # quota/permission response. The secret is deliberately separate from
      # the canary PAT so this probe cannot turn a production credential into
      # a false quota assertion.
      - name: Scenario 4 — Dedicated quota PAT returns quota error
        working-directory: examples/buck2-starter
        timeout-minutes: 2
        env:
          CORELINK_PAT: ${{ secrets.CORELINK_QUOTA_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${CORELINK_PAT:-}" ]]; then
            echo "::error::CORELINK_QUOTA_PAT is not configured; quota probe cannot be proven" >&2
            exit 1
          fi
          set +e
          OUTPUT="$(buck2 build :hello 2>&1)"
          RESULT=$?
          set -e
          printf '%s\n' "${OUTPUT}"
          (( RESULT != 0 )) || { echo "FAIL: quota probe was accepted." >&2; exit 1; }
          grep -qiE '429|too many requests|quota|limit exceeded|rate limit' <<<"${OUTPUT}" || {
            echo "FAIL: quota probe did not produce a quota/rate-limit error." >&2; exit 1;
          }
          echo "OK: quota probe failed closed with a quota/rate-limit error."

  # ── benchmark report ────────────────────────────────────────────────────────
  benchmark:
    name: Benchmark (10+10 iterations) + report artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only run on push to main or weekly cron; skip on PRs to save minutes.
    if: |
      needs.build.result == 'success' &&
      (github.event_name == 'push' ||
       github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch')
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Restore exact Buck2 cache namespace
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: examples/buck2-starter/buck-out/v2/cache
          key: buck2-build-${{ github.repository }}-${{ github.sha }}

      - name: Download and admit the current warm receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: buck2-build-reports
          path: ${{ runner.temp }}/buck2-build-reports

      - name: Require numeric warm receipt before benchmark
        run: |
          set -euo pipefail
          WARM_REPORT="${RUNNER_TEMP}/buck2-build-reports/warm-report.json"
          test -s "${WARM_REPORT}" || {
            echo "FAIL: benchmark admission requires the current warm report." >&2
            exit 1
          }
          COUNTERS="$(python3 -S "${GITHUB_WORKSPACE}/scripts/parse_buck2_build_report.py" \
            --report "${WARM_REPORT}")"
          read -r HITS TOTAL <<<"${COUNTERS}"
          RATIO=$(( (HITS * 100) / TOTAL ))
          printf 'warm_cache_hits=%s\nwarm_declared_actions=%s\nwarm_cache_ratio=%s\n' \
            "${HITS}" "${TOTAL}" "${RATIO}" > "${RUNNER_TEMP}/buck2-warm-admission.txt"
          if (( RATIO < 80 )); then
            echo "FAIL: benchmark admission requires warm cache ratio >= 80%; got ${RATIO}%." >&2
            exit 1
          fi

      - name: Install Buck2
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p ~/.local/bin
          ARCH="x86_64-unknown-linux-gnu"
          # Pinned to BUCK2_VERSION (a real dated tag) — see the workflow-level
          # env: block for why the "latest" convenience URL 404s.
          ARCHIVE="${RUNNER_TEMP}/buck2-${BUCK2_VERSION}.zst"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            --connect-timeout 10 --max-time 120 \
            "https://github.com/facebook/buck2/releases/download/${BUCK2_VERSION}/buck2-${ARCH}.zst" \
            -o "${ARCHIVE}"
          if command -v sha256sum >/dev/null 2>&1; then
            ACTUAL_SHA256="$(sha256sum "${ARCHIVE}" | awk '{print $1}')"
          else
            ACTUAL_SHA256="$(openssl dgst -sha256 "${ARCHIVE}" | awk -F'= ' '{print $2}')"
          fi
          [[ "${ACTUAL_SHA256}" == "${BUCK2_SHA256}" ]] || {
            echo "::error::Buck2 SHA-256 mismatch: expected ${BUCK2_SHA256}, got ${ACTUAL_SHA256}"; exit 1;
          }
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zstd jq bc
          zstd -d "${ARCHIVE}" -o ~/.local/bin/buck2
          chmod +x ~/.local/bin/buck2
          echo "$HOME/.local/bin" >> "${GITHUB_PATH}"

      - name: Install C++ toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-14 libc++-14-dev libc++abi-14-dev

      - name: Validate CORELINK_PAT before benchmark
        run: |
          set -euo pipefail
          if [[ -z "${CORELINK_PAT:-}" ]]; then
            echo "ERROR: refusing benchmark without CORELINK_PAT; no unauthenticated cache writes are allowed." >&2
            exit 1
          fi
          echo "CORELINK_PAT is set (length=${#CORELINK_PAT})"
        env:
          CORELINK_PAT: ${{ secrets.CORELINK_CANARY_PAT }}

      - name: Run benchmark script
        working-directory: examples/buck2-starter
        run: |
          chmod +x scripts/benchmark.sh
          mkdir -p "${RUNNER_TEMP}/buck2-benchmark"
          ./scripts/benchmark.sh --iterations 10 \
            --output-md "${RUNNER_TEMP}/buck2-benchmark/BENCHMARK.md"
        env:
          CORELINK_PAT: ${{ secrets.CORELINK_CANARY_PAT }}

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buck2-benchmark-report
          path: |
            ${{ runner.temp }}/buck2-benchmark/BENCHMARK.md
            ${{ runner.temp }}/buck2-benchmark/BENCHMARK.json
            ${{ runner.temp }}/buck2-warm-admission.txt
          if-no-files-found: error
          retention-days: 14
