# i1672 — manual GitHub-hosted boundary observation; credential-free.
name: smoke-install

on:
  workflow_dispatch:
    inputs:
      timeout_seconds:
        description: Probe timeout for startup/readiness and cleanup
        required: false
        default: "2"
        type: string

permissions:
  contents: read

jobs:
  observe:
    name: GitHub-hosted smoke observation (not fleet evidence)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # Record the runtime identity fields so the receipt describes the hosted runner.
      I1672_FLEET_LABEL: github-hosted
      I1672_RUNNER_NAME: ${{ runner.name }}
      I1672_RUNNER_OS: ${{ runner.os }}
      I1672_RUNNER_ARCH: ${{ runner.arch }}
    steps:
      - name: Checkout tested tree
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Observe Docker boundary
        id: backend
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/i1672
          if docker info > artifacts/i1672/docker-info.txt 2>&1; then
            echo "Docker boundary reachable; helper will classify daemon versus shim separately."
          else
            rc=$?
            echo "::error title=i1672 backend unavailable::docker info failed (rc=${rc}); fleet/backend failure is recorded explicitly."
            exit "${rc}"
          fi

      - name: Observe process, readiness, endpoint, death, timeout, and cleanup
        if: ${{ always() }}
        shell: bash
        env:
          I1672_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
        run: |
          set -euo pipefail
          timeout="${I1672_TIMEOUT_SECONDS:-2}"
          python3 scripts/smoke_install_observe.py \
            --timeout-seconds "${timeout}" \
            --receipt artifacts/i1672/smoke-install-receipt.json

      - name: Upload structured observation
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: i1672-smoke-install-observation-${{ github.run_id }}
          path: artifacts/i1672/
          if-no-files-found: error
          retention-days: 14
