# smoke-install — end-to-end smoke test of the `corelink` install one-liner.
# -----------------------------------------------------------------------------
# Builds a clean Debian container, runs the public install script, and asserts
# `corelink --version` / `corelink doctor`. This is a Docker-DAEMON workflow (plain
# `docker build`/`docker run` `run:` steps — NOT a container action), so it does
# NOT hit the "Container action is only supported on Linux" failure. It instead
# requires a working Docker daemon on the macOS self-hosted runner.
#
# ⚠️ THIS GATE WAS GREEN AND BLIND (fixed 2026-08-02).
#   `CORELINK_TEST_TOKEN_CI` has never existed — verified: absent from the repo
#   secrets, and there are no org secrets. The preflight treated that as a reason
#   to SKIP and report success, so every run since inception passed while
#   executing none of the smoke test. That covers the 2026-07-10 launch and the
#   three weeks since — exactly the window in which this was meant to be proving
#   that the customer-facing install one-liner still works.
#
#   It is also the gate that should have caught the CLI being fully broken
#   against prod while its unit tests stayed green (found and fixed by hand, #842).
#
#   Both skip branches are now HARD FAILURES. A gate that cannot run must say so
#   in red: reporting green is worse than having no gate at all, because it also
#   consumes the attention that would otherwise notice the gap.
#
#   OWNER ACTION to make it green legitimately — one step:
#     Settings → Secrets and variables → Actions → new repository secret
#     `CORELINK_TEST_TOKEN_CI`, a CoreLink PAT the install one-liner can
#     authenticate with.
#
#   Safe to fail loudly: the triggers are `push:main` + weekly schedule + manual
#   dispatch, NOT `pull_request`, so a red here blocks nobody's PR.
#
# NOTE on the stale macOS/Docker story that used to live here: it described a
#   Docker-less macOS fleet, but this job has since moved to `ubuntu-latest`,
#   where the Docker daemon is part of the hosted image and IS present (confirmed
#   at runtime in run 30723111099: "Docker daemon reachable."). That skip branch
#   was dead code guarding a condition that can no longer occur — and if it ever
#   does, it means a broken runner image, which is a failure, not a skip.

name: smoke-install
on:
  push:
    branches: [main]
    paths:
      - "apps/get-corelink-worker/**"
      - ".github/workflows/smoke-install.yml"
  schedule:
    # Cadence: daily -> WEEKLY Wed (CI cost diet 2026-08-01). The paths-filtered
    # `push` lane above still smokes every change to the installer surface.
    - cron: "0 6 * * 3"
  workflow_dispatch:

# Least-privilege: this smoke test only checks out + builds + runs a throwaway
# Docker image — no writes (no gh-api, comments, pushes, or releases). A default
# broad token scope is unnecessary attack surface on the self-hosted runner.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Map the gating secret to a job-level env so the preflight below can test
      # for its presence. The `secrets` context is NOT usable in a job-level
      # `if:` (and not directly in `run:`/`if:`) — mirror the repo idiom
      # (pentest-findings-sync.yml) of routing the secret through `env` first.
      # Resolves to the empty string when the secret is unset.
      CORELINK_TEST_TOKEN_CI: ${{ secrets.CORELINK_TEST_TOKEN_CI }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Preflight — Docker daemon + CORELINK_TEST_TOKEN_CI available?
        id: preflight
        shell: bash
        run: |
          set -uo pipefail
          ok=true

          # Both checks below FAIL rather than skip. This job's whole purpose is to
          # prove the customer install one-liner still works; if it cannot run then
          # it has proven nothing, and saying so in red is the only honest report.
          # Safe to be loud: there is no `pull_request` trigger, so this blocks no PR.

          # On ubuntu-latest the Docker daemon ships with the runner image, so a miss
          # here means the image is broken — a genuine failure, not an environmental
          # skip. (`docker info` also catches a present CLI with a dead daemon.)
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo "Docker daemon reachable."
          else
            ok=false
            echo "::error title=smoke-install cannot run (Docker)::No Docker daemon on this runner. ubuntu-latest ships one, so this points at a broken runner image."
          fi

          # The install one-liner authenticates with CORELINK_TEST_TOKEN_CI. That
          # secret has NEVER been set, and the previous version treated its absence
          # as a reason to report SUCCESS — so this gate was green and blind through
          # the 2026-07-10 launch and the three weeks after it.
          if [ -n "${CORELINK_TEST_TOKEN_CI:-}" ]; then
            echo "CORELINK_TEST_TOKEN_CI is set."
          else
            ok=false
            echo "::error title=smoke-install cannot run (token)::CORELINK_TEST_TOKEN_CI is not set, so the install one-liner cannot authenticate and this gate proves nothing. Set it: Settings -> Secrets and variables -> Actions."
          fi

          if [ "${ok}" != "true" ]; then
            echo "Preflight FAILED — refusing to report success without running the smoke test."
            exit 1
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "Preflight OK — running smoke test."

      - name: Build smoke image
        if: steps.preflight.outputs.run == 'true'
        run: docker build -f apps/get-corelink-worker/test/smoke-install.Dockerfile -t corelink-smoke .

      - name: Run install one-liner (corelink --version)
        if: steps.preflight.outputs.run == 'true'
        env:
          CORELINK_TEST_TOKEN: ${{ secrets.CORELINK_TEST_TOKEN_CI }}
        run: |
          docker run --rm \
            -e CORELINK_TEST_TOKEN="$CORELINK_TEST_TOKEN" \
            corelink-smoke

      - name: Verify corelink doctor reaches the server
        if: steps.preflight.outputs.run == 'true'
        env:
          CORELINK_TEST_TOKEN: ${{ secrets.CORELINK_TEST_TOKEN_CI }}
        run: |
          # Additional verification beyond just --version — `doctor` runs the
          # canonical connectivity + auth diagnostic checks (there is no `ping`
          # subcommand; the real verb is `doctor`, tools/cli/src/main.rs).
          docker run --rm \
            -e CORELINK_TEST_TOKEN="$CORELINK_TEST_TOKEN" \
            corelink-smoke \
            sh -c "curl -fsSL \$CORELINK_GET_URL | sh -s -- --token=\$CORELINK_TEST_TOKEN && corelink doctor"
