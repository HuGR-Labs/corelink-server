# smoke-install — end-to-end smoke test of the `corelink` install one-liner.
# -----------------------------------------------------------------------------
# Builds a clean Debian container, runs the public install script, and asserts
# `corelink --version` / `corelink ping`. This is a Docker-DAEMON workflow (plain
# `docker build`/`docker run` `run:` steps — NOT a container action), so it does
# NOT hit the "Container action is only supported on Linux" failure. It instead
# requires a working Docker daemon on the macOS self-hosted runner.
#
# ⚠️ OWNER DECISION NEEDED (TODO, 2026-06-02):
#   The 5-runner macOS fleet has NO guaranteed Docker daemon. Docker Desktop was
#   confirmed working on the primary builder Mac (Docker 28.3.2, `desktop-linux`
#   context, `docker info` OK) — but Docker Desktop needs the GUI app actively
#   running and is not present/started on every runner. Rather than hard-fail
#   the job on Docker-less runners, the preflight step below SKIPS the smoke test
#   (green, with a ::notice::) when `docker info` fails. Decide one of:
#     (a) install + auto-start Colima (headless Docker) on all runners and drop
#         this guard so the smoke test always runs, or
#     (b) retire this Docker-based smoke test in favour of a native one.
#   Only `push:main` + schedule trigger this (NOT pull_request), so it never
#   blocks PRs — lowest urgency.

name: smoke-install
on:
  push:
    branches: [main]
    paths:
      - "apps/get-corelink-worker/**"
      - ".github/workflows/smoke-install.yml"
  schedule:
    - cron: "0 6 * * *"  # daily at 06:00 UTC
  workflow_dispatch:

# Least-privilege: this smoke test only checks out + builds + runs a throwaway
# Docker image — no writes (no gh-api, comments, pushes, or releases). A default
# broad token scope is unnecessary attack surface on the self-hosted runner.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Map the gating secret to a job-level env so the preflight below can test
      # for its presence. The `secrets` context is NOT usable in a job-level
      # `if:` (and not directly in `run:`/`if:`) — mirror the repo idiom
      # (pentest-findings-sync.yml) of routing the secret through `env` first.
      # Resolves to the empty string when the secret is unset.
      CORELINK_TEST_TOKEN_CI: ${{ secrets.CORELINK_TEST_TOKEN_CI }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Preflight — Docker daemon + CORELINK_TEST_TOKEN_CI available?
        id: preflight
        shell: bash
        run: |
          set -uo pipefail
          run=true

          # `docker info` exits non-zero if the CLI is missing OR the daemon is
          # not reachable — exactly the two ways this fleet can lack Docker.
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo "Docker daemon reachable."
          else
            run=false
            echo "::notice title=smoke-install skipped (Docker)::No Docker daemon on this runner; skipping the container smoke test (see workflow header TODO — owner decision: Colima fleet-wide vs. drop)."
          fi

          # The install one-liner authenticates with CORELINK_TEST_TOKEN_CI — an
          # owner-provided repo secret that does NOT exist pre-launch. SKIP
          # (green) when it is absent rather than red the gate; it RUNS as soon
          # as the owner sets it. (Routed from secrets into env above.)
          if [ -n "${CORELINK_TEST_TOKEN_CI:-}" ]; then
            echo "CORELINK_TEST_TOKEN_CI is set."
          else
            run=false
            echo "::notice title=smoke-install skipped (token)::CORELINK_TEST_TOKEN_CI not set — set it (Settings → Secrets → Actions) to enable this gate."
          fi

          echo "run=${run}" >> "$GITHUB_OUTPUT"
          if [ "${run}" = "true" ]; then
            echo "Preflight OK — running smoke test."
          fi

      - name: Build smoke image
        if: steps.preflight.outputs.run == 'true'
        run: docker build -f apps/get-corelink-worker/test/smoke-install.Dockerfile -t corelink-smoke .

      - name: Run install one-liner (corelink --version)
        if: steps.preflight.outputs.run == 'true'
        env:
          CORELINK_TEST_TOKEN: ${{ secrets.CORELINK_TEST_TOKEN_CI }}
        run: |
          docker run --rm \
            -e CORELINK_TEST_TOKEN="$CORELINK_TEST_TOKEN" \
            corelink-smoke

      - name: Verify corelink ping returns 200
        if: steps.preflight.outputs.run == 'true'
        env:
          CORELINK_TEST_TOKEN: ${{ secrets.CORELINK_TEST_TOKEN_CI }}
        run: |
          # Additional verification beyond just --version
          docker run --rm \
            -e CORELINK_TEST_TOKEN="$CORELINK_TEST_TOKEN" \
            corelink-smoke \
            sh -c "curl -fsSL \$CORELINK_GET_URL | sh -s -- --token=\$CORELINK_TEST_TOKEN && corelink ping"
