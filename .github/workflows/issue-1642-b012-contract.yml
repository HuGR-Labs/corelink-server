name: issue-1642 B-012 bot PR contract

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - .github/workflows/api-reference-sync.yml
      - .github/workflows/compliance-weekly.yml
      - .github/workflows/okf-autoreconcile.yml
      - .github/workflows/release-notes.yml
      - .github/workflows/subprocessors-sync.yml
      - .github/workflows/issue-1642-b012-contract.yml
      - BACKLOG.md
      - docs/internal/b012-github-app.md
      - docs/handoff/2026-09-05-owner-action-packets-b008-b154.json
      - evidence/owner-actions/B-012/**
      - scripts/verify_owner_action_packets.py
      - scripts/verify_b012_bot_pr_evidence.py
      - scripts/verify_bot_pr_auth.py
      - scripts/verify_bot_pr_auth.py
      - tests/test_b012_bot_pr_evidence.py
      - tests/test_b012_bot_pr_auth.py
      - tests/test_owner_action_packets.py

permissions:
  contents: read

concurrency:
  group: issue-1642-b012-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: B-012 fork-safe App contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision without write credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify bot PR credential and fork-safety contract
        run: python3 -S scripts/verify_bot_pr_auth.py

      - name: Verify B-012 closure and sanitized evidence
        run: |
          set -euo pipefail
          python3 -S scripts/verify_owner_action_packets.py --id B-012
          python3 -S scripts/verify_b012_bot_pr_evidence.py

      - name: Run B-012 regression tests
        run: python3 -S -m unittest -v tests/test_b012_bot_pr_auth.py tests/test_b012_bot_pr_evidence.py tests/test_owner_action_packets.py
