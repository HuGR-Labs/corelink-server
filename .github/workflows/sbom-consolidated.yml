name: sbom-consolidated (R7-1 supply-quality rollup)

# Consolidated workspace SBOM (CycloneDX 1.5 JSON) emitted on every release
# tag. Complements `sbom.yml` (WI-S12-002: per-binary SBOM publisher with
# NTIA validation + RFC 3161 TSA timestamp + Dependency-Track ingestion) by
# producing a SINGLE document spanning all workspace crates, suitable for
# downstream-consumer single-pull use (regulators, customer security
# review, evidence pack attachment).
#
# Bundles all per-crate cargo-cyclonedx outputs into a single
# `corelink-workspace.cdx.json` (pkg:cargo/corelink-workspace@<tag>) and
# attaches it to the release artifact set.
#
# Triggers:
#   - push to any tag matching `v*` (release lane)
#   - manual workflow_dispatch (operator-on-demand SBOM)
#
# SHA-pinned per HIGH_RISK lane FF-HR-005 + ADR-S12-045 §6 tooling-pin policy.
#
# Reference: scripts/sbom-aggregate.sh, tools/sbom-publish,
#            specs/_audits/sealed/2026-05-14-sbom-coverage.md

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'git ref / tag to embed as workspace bom version'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom-consolidated:
    name: aggregate workspace CycloneDX SBOM
    # Runner: `corelink` (zero-hosted). Needs a working cargo (cargo-cyclonedx
    # resolves the workspace) + jq — both provided by the box image; cargo-cyclonedx
    # arrives via the SHA-pinned taiki-e prebuilt.
    runs-on: corelink
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # `dtolnay/rust-toolchain` removed — validate_no_shared_rustup_mutation
      # forbids it on self-hosted (`corelink`). The box image bakes the pinned
      # channel; assert it is on PATH instead (mirrors corelink-server.yml).
      - name: Assert the workspace-pinned toolchain (rust-toolchain.toml)
        run: bash scripts/ci-assert-pinned-toolchain.sh

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          shared-key: sbom-consolidated

      # cargo-cyclonedx =0.5.9 — the version ADR-0044 canonicalizes for SBOM
      # generation (the previous @0.5.7 pin drifted from the ADR; restoring 0.5.9
      # is ADR compliance, not a new bump). 0.5.9 emits CycloneDX up to spec 1.5
      # (ADR-0014/0044/S12-001 all fix the format at 1.5) and processes every
      # workspace member by default (there is no `--workspace` flag).
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-cyclonedx@0.5.9

      - name: Verify jq present (baked into the corelink box image)
        run: jq --version

      - name: Run sbom-aggregate
        env:
          SBOM_REF: ${{ inputs.ref || github.ref_name }}
        run: bash scripts/sbom-aggregate.sh

      # Artifact names may not contain '/', but github.ref_name does for branch
      # dispatches (e.g. `fix/…`). Releases fire on slash-free tags, but sanitize
      # so a workflow_dispatch on any branch does not fail the upload.
      - name: Compute slash-safe artifact ref
        id: saferef
        run: echo "ref=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload consolidated SBOM (release artifact)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corelink-workspace-sbom-${{ steps.saferef.outputs.ref }}
          path: target/sbom/corelink-workspace.cdx.json
          retention-days: 365
          if-no-files-found: error

      - name: Emit step summary
        if: success()
        env:
          SBOM_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          COUNT=$(jq '.components | length' target/sbom/corelink-workspace.cdx.json)
          {
              echo '## Consolidated SBOM emitted'
              echo ''
              echo '- spec: CycloneDX 1.5'
              echo "- ref:  ${SBOM_REF}"
              echo "- components (deduped by purl): ${COUNT}"
              echo ''
              echo 'INV-SUPPLY-SBOM-PRESENT: ENFORCED'
          } >> "$GITHUB_STEP_SUMMARY"
