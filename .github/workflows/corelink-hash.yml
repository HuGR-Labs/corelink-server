name: corelink-hash (WI-S01-002)

# CI gate for the corelink-hash crate per WI-S01-002 §13 + §17.
# PR lane: build/clippy/tests (debug + release)/doc/canonical-vectors smoke +
# WASM target build + cargo-fuzz 60s smoke.
# Nightly lane: 1h fuzz + cargo-mutants kill rate + audit.

on:
  pull_request:
    paths:
      - 'crates/corelink-hash/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/corelink-hash.yml'
  # NOTE: no `push: branches:[main]`. The build/clippy/test lane compiles the
  # crate (debug + release) on the self-hosted macOS fleet; re-running it on every
  # main merge fed the heavy-gate stampede (load 398/665, 2026-06-04; extends the
  # 977225d3 "stop heavy-gate stampede" sweep). The nightly cron below + the PR
  # `paths:` lane above keep continuous + targeted coverage.
  schedule:
    # Nightly full lane.
    - cron: '37 4 * * *'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # PR gate is crate-scoped only. Workspace-wide gates (fmt, clippy --workspace,
  # test --workspace, doc --workspace) live in cas_foundation.yml::workspace-build-test
  # per CI-OPT-001. cargo-audit advisory DB scan lives in cargo-audit.yml
  # per CI-OPT-004 (removes floating rustsec/audit-check@v1 ref).
  pr-gate:
    name: PR gate (crate-scoped clippy + tests + canonical vectors)
    runs-on: [self-hosted, mac, corelink-builder]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # actions/checkout@v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # dtolnay/rust-toolchain@stable@2026-05-15
        with:
          components: clippy, rustfmt

      - name: Cargo cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # Swatinem/rust-cache@v2.9.1
        with:
          workspaces: ". -> target"

      - name: cargo clippy (corelink-hash, -D warnings)
        run: cargo clippy --package corelink-hash --all-targets -- -D warnings

      - name: cargo test (corelink-hash, debug)
        run: cargo test --package corelink-hash --all-targets

      - name: cargo test (release — perf + ct-variance gates AC §8)
        run: cargo test --release --package corelink-hash

      - name: cargo test (canonical vectors — fast smoke)
        run: cargo test --package corelink-hash canonical_vectors

  wasm-build:
    name: WASM target builds (CF Workers compile compatibility)
    runs-on: [self-hosted, mac, corelink-builder]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # actions/checkout@v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # dtolnay/rust-toolchain@stable@2026-05-15
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # Swatinem/rust-cache@v2.9.1
        with:
          workspaces: ". -> target"
      - name: cargo check (corelink-hash on wasm32-unknown-unknown)
        run: cargo check --package corelink-hash --target wasm32-unknown-unknown

  fuzz-smoke:
    name: cargo-fuzz smoke (60s, both targets)
    runs-on: [self-hosted, mac, corelink-builder]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # actions/checkout@v6.0.3
      # Self-hosted Macs already ship rustup+cargo; re-provisioning via
      # dtolnay/rust-toolchain collides on `bin/cargo`. Put the pre-installed
      # host nightly toolchain (cargo-fuzz requires nightly) on PATH instead —
      # see CLAUDE.md "the rustup proxy is broken" note.
      - name: Put host nightly toolchain on PATH (cargo-fuzz needs nightly)
        run: echo "$HOME/.rustup/toolchains/nightly-x86_64-apple-darwin/bin" >> "$GITHUB_PATH"
      - run: cargo install cargo-fuzz --locked
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # Swatinem/rust-cache@v2.9.1
        with:
          workspaces: "crates/corelink-hash/fuzz -> target"
      - name: digest_parse 60s
        working-directory: crates/corelink-hash
        run: cargo fuzz run digest_parse -- -max_total_time=60
      - name: verify_body 60s
        working-directory: crates/corelink-hash
        run: cargo fuzz run verify_body -- -max_total_time=60

  fuzz-nightly:
    name: cargo-fuzz nightly (1h each)
    runs-on: [self-hosted, mac, corelink-builder]
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # actions/checkout@v6.0.3
      # Self-hosted Macs already ship rustup+cargo; re-provisioning via
      # dtolnay/rust-toolchain collides on `bin/cargo`. Put the pre-installed
      # host nightly toolchain (cargo-fuzz requires nightly) on PATH instead —
      # see CLAUDE.md "the rustup proxy is broken" note.
      - name: Put host nightly toolchain on PATH (cargo-fuzz needs nightly)
        run: echo "$HOME/.rustup/toolchains/nightly-x86_64-apple-darwin/bin" >> "$GITHUB_PATH"
      - run: cargo install cargo-fuzz --locked
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # Swatinem/rust-cache@v2.9.1
        with:
          workspaces: "crates/corelink-hash/fuzz -> target"
      - name: digest_parse 3600s
        working-directory: crates/corelink-hash
        run: cargo fuzz run digest_parse -- -max_total_time=3600
      - name: verify_body 3600s
        working-directory: crates/corelink-hash
        run: cargo fuzz run verify_body -- -max_total_time=3600

  mutants-nightly:
    name: cargo-mutants kill-rate ≥ 80%
    runs-on: [self-hosted, mac, corelink-builder]
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # actions/checkout@v6.0.3
      # Self-hosted Macs already ship rustup+cargo; re-provisioning via
      # dtolnay/rust-toolchain collides on `bin/cargo`. Put the pre-installed
      # host toolchain (workspace pins 1.91.1 via rust-toolchain.toml) on PATH
      # instead — see CLAUDE.md "the rustup proxy is broken" note.
      - name: Put host toolchain on PATH (workspace-pinned 1.91.1)
        run: echo "$HOME/.rustup/toolchains/1.91.1-x86_64-apple-darwin/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # Swatinem/rust-cache@v2.9.1
        with:
          workspaces: ". -> target"
      - uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2.81.10
        with:
          tool: cargo-mutants
      - run: cargo mutants --package corelink-hash --no-shuffle --check
