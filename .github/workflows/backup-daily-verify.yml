name: Backup Daily Verify

# Continuous (daily) backup-verification harness. Complements the
# quarterly cold-restore drill (GAP-15) and the monthly first-Monday
# verification cycle (RB-BACKUP-VERIFICATION). Runs every day at 05:00
# UTC; alerts on any tier returning stale / corrupt / restore_failed.

on:
  schedule:
    # Daily at 05:00 UTC.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      env:
        description: "CoreLink env (staging | production)"
        required: false
        default: "production"
      dry_run:
        description: "If true, run in deterministic in-memory mode (no live R2 calls)"
        required: false
        default: "false"

permissions:
  contents: read
  issues: write   # SEV-2 / SEV-1 alerts via GitHub issue
  actions: read

concurrency:
  group: backup-daily-verify
  cancel-in-progress: false

jobs:
  verify:
    name: Verify backups (daily)
    # GitHub-hosted (Mac-free), matching cf-deploy-prod.yml. The live lane only
    # needs wrangler + jq + CF auth to list the backup R2 bucket.
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35

    env:
      CORELINK_ENV: ${{ github.event.inputs.env || 'production' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve dry-run flag
        id: mode
        run: |
          set -euo pipefail
          # The live lane is REAL (scripts/backup-daily-verify.sh lists the
          # backup R2 bucket and checks freshness/existence/non-empty). Scheduled
          # runs are LIVE (dry_run=false); dispatch may override to "true" for a
          # no-network smoke. NOTE: until the live backup workflow has produced
          # its first snapshot, the live verify will correctly report
          # missing/stale (exit 2) or, if BACKUP_R2_BUCKET is unset, a config
          # error (exit 3) — that is honest, not a false green.
          DRY="${{ github.event.inputs.dry_run }}"
          DRY="${DRY:-false}"
          echo "dry=${DRY}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.mode.outputs.dry == 'false'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install wrangler + jq (live lane)
        if: steps.mode.outputs.dry == 'false'
        run: |
          npm install -g wrangler@4.95.0
          sudo apt-get update && sudo apt-get install -y --no-install-recommends jq

      - name: Run daily verification
        id: verify
        continue-on-error: true
        env:
          # CF auth so wrangler can list the backup R2 bucket (reused prod
          # secrets). BACKUP_R2_BUCKET defaults to corelink-backups-<env> in the
          # script; override via repo var if the bucket is named differently.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          BACKUP_R2_BUCKET: ${{ vars.BACKUP_R2_BUCKET }}
          # Real prod D1 name(s) — see backup-daily.yml (stale script default).
          D1_DATABASES: ${{ vars.D1_DATABASES }}
        run: |
          set -euo pipefail
          ARGS=("--env" "${CORELINK_ENV}")
          if [[ "${{ steps.mode.outputs.dry }}" == "true" ]]; then
            ARGS+=("--dry-run")
          fi
          bash scripts/backup-daily-verify.sh "${ARGS[@]}"
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Upload verification log + metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backup-verification-${{ github.run_id }}
          path: |
            .backup-verify-logs/
            .backup-verify-metrics/
          retention-days: 90
          if-no-files-found: warn

      - name: Alert on verification failure
        if: steps.verify.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const dry = '${{ steps.mode.outputs.dry }}';
            const severity = dry === 'true' ? 'SEV-3' : 'SEV-2';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${severity}: daily backup verification failed (run ${context.runId})`,
              labels: ['backup-verify', 'r-prep', severity.toLowerCase()],
              body: [
                `Daily backup verification harness reported a failure.`,
                ``,
                `**Mode:** dry_run=${dry}`,
                `**Env:** ${process.env.CORELINK_ENV}`,
                `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                ``,
                `**Action required:**`,
                `- Follow specs/_runbooks/RB-BACKUP-VERIFICATION-FAILURE.md`,
                `- Triage tier (R2 / D1 / KV) from artifact JSON log`,
                `- If two consecutive daily cycles fail → escalate to SEV-1`,
              ].join('\n'),
            });

      - name: Fail job to propagate exit code
        if: steps.verify.outcome == 'failure'
        run: |
          echo "Daily backup verification failed; see uploaded artifact." >&2
          exit 1
