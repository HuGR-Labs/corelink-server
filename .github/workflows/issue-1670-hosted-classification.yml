name: issue-1670-hosted-classification

# One-shot evidence lane for #1670. It is deliberately manual and uses only
# the runner user's writable tmpfs; no privileged loop device is required.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify-bounded-disk-failures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Induce and classify ENOSPC plus linker failure
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP:-/tmp}/issue-1670"
          fs_root="/dev/shm/corelink-issue-1670-${GITHUB_RUN_ID:-$$}"
          report="$root/report.json"
          mkdir -p "$root" "$fs_root"
          cleanup() {
            set +e
            rm -rf "$root" "$fs_root"
          }
          trap cleanup EXIT

          # /dev/shm is a bounded runner tmpfs writable by the job user. Fill
          # to a 64 KiB margin from its measured free space, then a 1 MiB
          # write deterministically returns ENOSPC without sudo or fallocate.
          shm_size="$(df --output=size -B1 "$fs_root" | awk 'NR == 2 { print $1 }')"
          shm_free="$(df --output=avail -B1 "$fs_root" | awk 'NR == 2 { print $1 }')"
          test -n "$shm_size" -a -n "$shm_free"
          test "$shm_free" -gt $((1024 * 1024))
          fill_to_margin() {
            local fill="$1" available
            available="$(df --output=avail -B1 "$fs_root" | awk 'NR == 2 { print $1 }')"
            test "$available" -gt $((1024 * 1024))
            python3 - "$fill" $((available - 64 * 1024)) <<'PY'
          import os
          import sys

          path, target = sys.argv[1], int(sys.argv[2])
          chunk = b"\0" * (1024 * 1024)
          with open(path, "wb", buffering=0) as handle:
              remaining = target
              while remaining:
                  written = handle.write(chunk[: min(len(chunk), remaining)])
                  if written <= 0:
                      raise SystemExit("bounded tmpfs fill made no progress")
                  remaining -= written
              os.fsync(handle.fileno())
          PY
          }

          fill_to_margin "$fs_root/fill.bin"
          enospc_log="$root/enospc.log"
          set +e
          CORELINK_CLASSIFICATION_ARTIFACT="$root/enospc-classification.json" \
            scripts/run-with-infra-classification.sh \
            dd if=/dev/zero of="$fs_root/write.bin" bs=1M count=1 status=none \
            >"$enospc_log" 2>&1
          enospc_rc=$?
          set -e

          rm -rf "$fs_root"
          mkdir -p "$fs_root"
          cat >"$root/main.c" <<'C'
          int main(void) { return 0; }
          C
          cc -c "$root/main.c" -o "$root/main.o"
          fill_to_margin "$fs_root/fill.bin"
          linker_log="$root/linker.log"
          set +e
          CORELINK_CLASSIFICATION_ARTIFACT="$root/linker-classification.json" \
            scripts/run-with-infra-classification.sh \
            cc "$root/main.o" -o "$fs_root/linked" \
            >"$linker_log" 2>&1
          linker_rc=$?
          set -e

          enospc_class="$(sed -n 's/^classification: //p' "$enospc_log" | tail -1)"
          linker_class="$(sed -n 's/^classification: //p' "$linker_log" | tail -1)"
          python3 - "$report" "$shm_size" "$enospc_rc" "$enospc_class" "$linker_rc" "$linker_class" <<'PY'
          import json
          import sys

          out, shm_size, enospc_rc, enospc_class, linker_rc, linker_class = sys.argv[1:]
          json.dump({
              "issue": 1670,
              "runner": "GitHub-hosted ubuntu-24.04",
              "filesystem": "/dev/shm tmpfs",
              "bounded_filesystem_bytes": int(shm_size),
              "enospc": {"exit_code": int(enospc_rc), "classification": enospc_class},
              "linker": {"exit_code": int(linker_rc), "classification": linker_class},
              "cleanup": "performed by EXIT trap",
          }, open(out, "w"), indent=2)
          PY
          cp "$report" "$GITHUB_WORKSPACE/issue-1670-report.json"
          cp "$enospc_log" "$GITHUB_WORKSPACE/issue-1670-enospc.log"
          cp "$linker_log" "$GITHUB_WORKSPACE/issue-1670-linker.log"
          {
            echo "## Issue #1670 hosted evidence"
            echo "- runner: GitHub-hosted ubuntu-24.04"
            echo "- bounded filesystem: /dev/shm tmpfs (${shm_size} bytes)"
            echo "- ENOSPC: exit=$enospc_rc classification=$enospc_class"
            echo "- linker: exit=$linker_rc classification=$linker_class"
            echo "- cleanup: performed by EXIT trap"
          } >>"$GITHUB_STEP_SUMMARY"

          # A red command with either classifier result is required; the raw
          # diagnostics remain in the uploaded logs for receipt review.
          test "$enospc_rc" -ne 0
          test "$linker_rc" -ne 0
          [[ "$enospc_class" == ENOSPC || "$enospc_class" == LINKER_FAILURE ]]
          [[ "$linker_class" == ENOSPC || "$linker_class" == LINKER_FAILURE ]]

      - name: Upload reproducible evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-1670-hosted-classification
          path: |
            issue-1670-report.json
            issue-1670-enospc.log
            issue-1670-linker.log
          if-no-files-found: error
