name: docs lychee (broken-link)

# WI-S18-005 deliverable 11 — lychee broken-link CI gate.
# Internal links checked on every PR (fast); external links verified
# nightly. Spec contract S-18 §5.6 R-S18-16 + Quality Standard 14.s18.4.

on:
  pull_request:
    paths:
      - "apps/docs/**"
      - ".github/workflows/docs-lychee.yml"
  schedule:
    - cron: "30 6 * * *"  # nightly 06:30 UTC (external links)
  workflow_dispatch:

permissions:
  contents: read
  issues: write  # auto-file tracking issue on nightly external failure

concurrency:
  group: docs-lychee-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: lychee broken-link check
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@82202e5e9c2f4ef1a55a3d02563e1cb6041e5332 # v2.4.1
        with:
          args: >-
            --config apps/docs/lychee.toml
            --no-progress
            --base apps/docs
            apps/docs/docs/**/*.md
            apps/docs/docs/**/*.mdx
            apps/docs/blog/**/*.md
            apps/docs/blog/**/*.mdx
            apps/docs/src/**/*.md
            apps/docs/src/**/*.mdx
          fail: ${{ github.event_name == 'pull_request' }}
          token: ${{ secrets.GITHUB_TOKEN }}
          output: ./lychee-report.md

      - name: Upload lychee report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lychee-report
          path: ./lychee-report.md
          retention-days: 14

      - name: Open issue on nightly external failure
        if: github.event_name == 'schedule' && steps.lychee.outputs.exit_code != '0'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: "[docs-lychee] external broken links detected (${{ github.run_id }})"
          content-filepath: ./lychee-report.md
          labels: docs, lychee, broken-link
