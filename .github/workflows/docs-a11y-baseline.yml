name: docs a11y baseline (axe-core/cli regression diff)

# WT-R4-1 deliverable (Goal C) — complementary to the Playwright a11y sweep.
#
# Runs `apps/docs/scripts/a11y-audit.sh --against=baseline` on every PR
# touching apps/docs/**. Compares the live audit to the snapshot at
# `apps/docs/i18n/A11Y-BASELINE-2026-05-14.json` and fails if any NEW
# CRITICAL violation is introduced vs that snapshot.
#
# Why separate from `docs-a11y.yml`: that workflow uses
# `@axe-core/playwright` (browser-driven, exercises every route, zero
# `serious`+`critical` tolerance). This workflow uses `@axe-core/cli`
# (broader ruleset, top-10 routes only, diff-vs-baseline tolerance) so
# we can detect *regressions* without the maintenance cost of a hard
# zero-tolerance gate on every severity tier.
#
# Spec contract: R-4 (i18n + a11y parity at GA) + S-18 §5.6 R-S18-14 +
# Quality Standard 14.s18.4.

on:
  pull_request:
    paths:
      - "apps/docs/**"
      - ".github/workflows/docs-a11y-baseline.yml"
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - ".github/workflows/docs-a11y-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-a11y-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-diff:
    name: axe-core/cli diff vs A11Y-BASELINE-2026-05-14.json
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v4.1.0
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (workspace root)
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Install Chrome for axe-core/cli
        # @axe-core/cli drives headless Chrome via Selenium WebDriver; the
        # ubuntu-latest runner image ships chromium-browser, but axe-core/cli
        # prefers `google-chrome-stable` on its default path.
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends chromium-browser
          # axe-core/cli looks for `chromedriver` next to its node_modules; the
          # devDependency `chromedriver` (transitive via @axe-core/cli) handles
          # the binary download in the postinstall step.

      - name: Build docs
        run: pnpm build

      - name: Serve built site (background)
        run: |
          pnpm serve --port 3000 --no-open > /tmp/docs-serve.log 2>&1 &
          echo $! > /tmp/docs-serve.pid
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null --max-time 2 http://localhost:3000/; then
              echo "docs server up"
              exit 0
            fi
            sleep 2
          done
          echo "docs server failed to come up" >&2
          tail -50 /tmp/docs-serve.log >&2 || true
          exit 1

      - name: Run a11y baseline diff
        env:
          DOCS_BASE_URL: http://localhost:3000
        run: bash scripts/a11y-audit.sh --against=baseline

      - name: Stop docs server
        if: always()
        run: |
          if [[ -f /tmp/docs-serve.pid ]]; then
            kill "$(cat /tmp/docs-serve.pid)" || true
          fi

      - name: Upload a11y reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-a11y-baseline-report
          path: apps/docs/dist/a11y/
          retention-days: 14
