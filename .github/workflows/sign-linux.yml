# CoreLink CLI — Linux GPG detached-signature workflow (WI-S15-006 §6.3).
#
# Activates after the same `cli-v*` tag release as `release-cli.yml`. After the
# release-cli pipeline produces unsigned Linux binaries (`linux-x86_64`,
# `linux-arm64`), this workflow:
#
#   1. Imports a 4096-bit RSA GPG signing key from the `GPG_PRIVATE_KEY`
#      secret into a fresh ephemeral keyring.
#   2. Produces an ASCII-armored detached signature (`.asc`) for each
#      Linux release tarball via `gpg --detach-sign --armor`.
#   3. Uploads the `.asc` files as GitHub Release assets, alongside the
#      corresponding tarballs.
#
# Public-key distribution:
#   - Publish the matching public key at
#     `https://corelink.humangr.com/.well-known/gpg-pubkey.asc`.
#   - End-users verify with:
#       `curl -fsSL https://corelink.humangr.com/.well-known/gpg-pubkey.asc | gpg --import`
#       `gpg --verify corelink-linux-x86_64.tar.gz.asc corelink-linux-x86_64.tar.gz`
#
# Secrets required:
#   - GPG_PRIVATE_KEY       — ASCII-armored private key block
#   - GPG_PRIVATE_KEY_PASS  — passphrase for the private key
#   - GPG_KEY_ID            — long key ID (e.g. 0xABCD1234EF567890)

name: sign-linux

concurrency:
  group: "ci-sign-linux"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to GPG-sign (e.g. cli-v0.1.0)"
        required: true
        type: string
  workflow_run:
    workflows: ["release-cli"]
    types: [completed]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  gpg-key-present:
    name: gate — GPG key present
    runs-on: [self-hosted, mac, corelink-builder]
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Reject a failed release root
        if: github.event_name == 'workflow_run'
        env:
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [ "$UPSTREAM_CONCLUSION" != "success" ]; then
            echo "::error::release-cli concluded ${UPSTREAM_CONCLUSION}; refusing to make a signer skip look successful." >&2
            exit 1
          fi

      - name: Check that GPG_PRIVATE_KEY secret is populated
        id: check
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "${GPG_PRIVATE_KEY}" ]; then
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "::notice ::GPG_PRIVATE_KEY secret not populated — Linux signing skipped (acquire 4096-bit RSA key + populate secret + publish pubkey at https://corelink.humangr.com/.well-known/gpg-pubkey.asc)."
          else
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          fi

  sign:
    name: gpg detach-sign (${{ matrix.asset_suffix }})
    needs: gpg-key-present
    if: >-
      needs.gpg-key-present.outputs.ready == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: [self-hosted, mac, corelink-builder]
    strategy:
      fail-fast: false
      # Matrix legs each rewrite the aggregate release checksum; serialize them.
      max-parallel: 1
      matrix:
        include:
          - asset_suffix: linux-x86_64
          - asset_suffix: linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "${INPUT_TAG}" ]; then
            echo "tag=${INPUT_TAG}" >> "${GITHUB_OUTPUT}"
          else
            echo "tag=${{ github.event.workflow_run.head_branch }}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Download release asset
        env:
          # This source repository's GITHUB_TOKEN has no authority in the
          # separate public release repository. Keep the cross-repo PAT on this
          # exact gh step only.
          GH_TOKEN: ${{ secrets.CORELINK_CLI_RELEASE_TOKEN }}
          RELEASE_REPOSITORY: HuGR-Labs/corelink-cli
          TAG: ${{ steps.tag.outputs.tag }}
          ASSET: corelink-${{ matrix.asset_suffix }}.tar.gz
        run: |
          set -euo pipefail
          mkdir -p ./assets
          gh release download "${TAG}" --repo "${RELEASE_REPOSITORY}" --pattern "${ASSET}" --dir ./assets
          ls -la ./assets

      - name: Import GPG signing key into ephemeral keyring
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PRIVATE_KEY_PASS: ${{ secrets.GPG_PRIVATE_KEY_PASS }}
        run: |
          mkdir -p "${RUNNER_TEMP}/gpg-home"
          chmod 700 "${RUNNER_TEMP}/gpg-home"
          export GNUPGHOME="${RUNNER_TEMP}/gpg-home"
          echo "GNUPGHOME=${GNUPGHOME}" >> "${GITHUB_ENV}"
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import
          # Configure loopback pinentry so passphrase comes from env var.
          echo "allow-loopback-pinentry" > "${GNUPGHOME}/gpg-agent.conf"
          gpgconf --kill gpg-agent
          gpg --list-secret-keys --keyid-format=long

      - name: Produce detached ASCII-armored signature
        env:
          GPG_PRIVATE_KEY_PASS: ${{ secrets.GPG_PRIVATE_KEY_PASS }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          ASSET: corelink-${{ matrix.asset_suffix }}.tar.gz
        run: |
          gpg --batch --yes \
            --pinentry-mode loopback \
            --passphrase "${GPG_PRIVATE_KEY_PASS}" \
            --local-user "${GPG_KEY_ID}" \
            --detach-sign --armor \
            --output "./assets/${ASSET}.asc" \
            "./assets/${ASSET}"

      - name: Verify detached signature locally
        env:
          ASSET: corelink-${{ matrix.asset_suffix }}.tar.gz
        run: |
          gpg --verify "./assets/${ASSET}.asc" "./assets/${ASSET}"

      - name: Refresh checksums for the signed release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CORELINK_CLI_RELEASE_TOKEN }}
          RELEASE_REPOSITORY: HuGR-Labs/corelink-cli
          TAG: ${{ steps.tag.outputs.tag }}
          ASSET: corelink-${{ matrix.asset_suffix }}.tar.gz
        run: |
          set -euo pipefail
          gh release download "${TAG}" --repo "${RELEASE_REPOSITORY}" \
            --pattern 'corelink-*.sha256' --dir ./assets --clobber
          (cd ./assets && shasum -a 256 "${ASSET}" > "${ASSET}.sha256")
          (cd ./assets && shasum -a 256 "${ASSET}.asc" > "${ASSET}.asc.sha256")
          (cd ./assets && LC_ALL=C sort corelink-*.sha256 > checksums.txt)
          (cd ./assets && shasum -a 256 -c "${ASSET}.sha256")
          (cd ./assets && shasum -a 256 -c "${ASSET}.asc.sha256")

      - name: Attach signature and refreshed checksums to release
        env:
          GH_TOKEN: ${{ secrets.CORELINK_CLI_RELEASE_TOKEN }}
          RELEASE_REPOSITORY: HuGR-Labs/corelink-cli
          TAG: ${{ steps.tag.outputs.tag }}
          ASSET: corelink-${{ matrix.asset_suffix }}.tar.gz
        run: |
          set -euo pipefail
          gh release upload "${TAG}" --repo "${RELEASE_REPOSITORY}" --clobber \
            "./assets/${ASSET}.asc" "./assets/${ASSET}.sha256" \
            "./assets/${ASSET}.asc.sha256" ./assets/checksums.txt

      - name: Read back signer-updated release checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CORELINK_CLI_RELEASE_TOKEN }}
          RELEASE_REPOSITORY: HuGR-Labs/corelink-cli
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          PUBLISHED="${RUNNER_TEMP}/corelink-sign-linux-readback-${{ matrix.asset_suffix }}"
          mkdir -p "$PUBLISHED"
          gh release download "${TAG}" --repo "${RELEASE_REPOSITORY}" --dir "$PUBLISHED" \
            --pattern 'corelink-*' --pattern checksums.txt --clobber
          (cd "$PUBLISHED" && shasum -a 256 -c checksums.txt)

      - name: Wipe GPG keyring
        if: always()
        run: rm -rf "${GNUPGHOME}" || true
