name: issue-1664-signing-readiness

on:
  pull_request:
    paths:
      - "scripts/verify_i1664_signing_readiness.py"
      - "docs/handoff/2026-09-22-i1664-signing-readiness.json"
      - ".github/workflows/issue-1664-signing-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: validate credentialless signing readiness packet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Validate packet without credentials
        run: python3 scripts/verify_i1664_signing_readiness.py
