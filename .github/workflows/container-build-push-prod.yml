# Build + push the prod container image as a repeatable, dispatchable workflow.
#
# RUNS ON THE SELF-HOSTED MAC. Both off-Mac options were tried and ruled out
# (2026-06-19):
#   - Blacksmith — requires a GitHub *Organization*; this account is personal → unsupported.
#   - GitHub-hosted `ubuntu-latest` — billing-blocked (no payment method; private-repo
#     Actions refused to start: "recent account payments have failed or your spending
#     limit needs to be increased").
# So the build stays on the Mac (the accepted fallback). This workflow at least makes
# it a clean, logged, one-command dispatch instead of ad-hoc local scripts.
#
# To TRULY get off the Mac later (no Org, no GitHub-hosted billing): stand up a cheap
# cloud VM (Hetzner-class) as a self-hosted GitHub runner and point this `runs-on` at
# it — which is literally CoreLink's own ephemeral-runners thesis dogfooded.
#
# Manual-only. Requires a Mac builder runner online. Runs the same scripts the
# 2026-06-18 prod redeploy ran (build → multi-region push).
name: container-build-push-prod

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "build" to confirm building + pushing the prod container image to the CF registries.'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  build-push:
    name: build + push prod container (self-hosted Mac)
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 75
    steps:
      - name: Confirm intent
        run: |
          if [ "${{ inputs.confirm }}" != "build" ]; then
            echo "::error::Type 'build' in the confirm input to proceed."; exit 1
          fi

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # full history so `git rev-parse --short HEAD` resolves the image tag

      - name: Runner + tooling check
        run: |
          echo "=== runner ==="; uname -a
          echo "=== docker ==="; docker version --format '{{.Server.Version}}'
          echo "=== buildx ==="; docker buildx version
          echo "=== disk ==="; df -h /

      - name: Build prod container image (Dockerfile → corelink-server:prod + :<sha>)
        run: bash scripts/build-container-prod.sh

      - name: Install wrangler (4.x — required for [[containers]] push)
        run: npm install -g wrangler@4.95.0

      - name: Push image to the 5 CF Containers registries
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          WRANGLER: wrangler
        run: bash scripts/push-container-multiregion.sh --apply

      - name: Next step (repin + deploy)
        run: |
          echo "Built+pushed corelink-server:$(git rev-parse --short HEAD) to the CF registries."
          echo "NEXT (off-Mac too): repin wrangler.toml [[env.*.containers]] image= to the new tag, then run cf-deploy-prod."
