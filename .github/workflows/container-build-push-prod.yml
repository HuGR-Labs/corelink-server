# Build + push the prod container image on a GitHub-HOSTED Linux runner — OFF the
# founder's dev Mac.
#
# WAIVER (human-authorized) — this lane stays GitHub-HOSTED, exempt from the
# zero-hosted-spend mandate. Reason: it needs `docker` + buildx to build a native
# linux/amd64 image. The self-hosted `corelink` fabric runs in Firecracker with no
# docker daemon (docker-in-Firecracker is unbuilt), and the only docker-capable
# self-hosted box is the founder's arm64 Mac (`corelink-builder`) — where an
# amd64 build means slow qemu emulation of a fat-LTO Rust link, exactly what this
# lane was moved off the Mac to avoid. Cost is negligible: it fires only on
# `workflow_dispatch` (a manual release step), not per-PR or per-push.
#   authorized-by: repo owner | 2026-08-11 ("manter hosted c/ waiver")
#   remediation: move to `runs-on: corelink` once the corelink runner image ships
#     a docker daemon, OR to a native-amd64 self-hosted box if one is provisioned.
#
# History: the off-Mac build was blocked twice on 2026-06-19 — Blacksmith needs a
# GitHub Org (account was personal), and GitHub-hosted was billing-blocked. BOTH
# were resolved when the account moved to the `HumanGuardrail` GitHub Org + a paid
# GitHub plan was added. So we're back on GitHub-hosted runners: Linux x86 with
# docker + buildx → builds the linux/amd64 image natively, no Mac, no
# Docker-Desktop-on-the-laptop, no third-party.
#
# === 2026-06-20: SOTA build — no across-run cache machinery ===
#
# The Dockerfile builds with the canonical `[profile.release]` (lto="fat",
# codegen-units=1) for the best prod binary (smaller = faster container
# cold-start) and uses BuildKit `--mount=type=cache` for the cargo registry,
# cargo git db, and `/build/target` WITHIN a run. We deliberately do NOT persist
# those mounts across runs: no `actions/cache`, no `buildkit-cache-dance`, no
# `cache-to/cache-from type=gha`. The build is fast and the gha cache risks the
# 10 GB limit. The build is followed by the SOTA gates that the prior local
# script (scripts/build-container-prod.sh) ran: an image-size gate, a
# CTRL-CRED-001 docker-history credential scan, and a bounded binary smoke probe.
#
# HARD CONSTRAINT (do NOT change): we do NOT touch the Dockerfile's dependency
# caching DESIGN. No cargo-chef, no stub/skeleton dep layer, no layer-cached deps.
# The Dockerfile header documents a PROD INCIDENT caused exactly by layer-cached
# deps (a stub binary shipped, bit-identical image hashes). The cache-MOUNT design
# is deliberate + incident-proof.
#
# The build step uses docker/build-push-action with `load: true` so the image is
# loaded into the local docker daemon as `corelink-server:<short-sha>` (the ref
# `scripts/push-container-multiregion.sh` consumes as LOCAL_REF) + `:prod`. Push
# stays exactly as before: scripts/push-container-multiregion.sh --apply.
name: container-build-push-prod

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "build" to confirm building + pushing the prod container image to the CF registries.'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  build-push:
    name: build + push prod container (fat-LTO SOTA, off-Mac)
    # `ubuntu-x64-4core` was a GitHub LARGER runner, which is a per-organization
    # resource. It did not survive the move to the HuGR-Labs org (Free plan —
    # larger runners are a Team/Enterprise feature), so the label now matches
    # nothing and a dispatch simply QUEUES FOREVER with no error: verified
    # 2026-08-02, run 30743452742 sat queued 4h30 with zero competing jobs, and
    # every other workflow on this label last ran 2026-07-20/21, i.e. before the
    # migration. Standard hosted runners are unaffected and ran fine the same day.
    #
    # Why standard is expected to cope here: the OOM warnings on this label
    # elsewhere in the repo ("ld Bus error, signal 7") come from `coverage.yml`
    # (cargo-llvm-cov instrumenting the WHOLE workspace) and the full-workspace
    # TEST link (every test binary). This job links ONE release binary, and took
    # 6.5 / 6.8 min on the 4-core — a small job that inherited a big label.
    # Timeout raised 30 -> 60 to absorb the halved core count (link is the long
    # pole and is largely single-threaded under `codegen-units = 1`).
    #
    # If this OOMs anyway, the fallback is `runs-on: corelink` (our own CoreLink
    # Runners, already registered on this repo) — NOT relaxing `lto = "fat"`,
    # which would degrade the shipped production binary to work around CI.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Confirm intent
        run: |
          if [ "${{ inputs.confirm }}" != "build" ]; then
            echo "::error::Type 'build' in the confirm input to proceed."; exit 1
          fi

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # full history so `git rev-parse --short HEAD` resolves the image tag

      - name: Compute short SHA + reproducible-build args
        id: meta
        run: |
          # ADR-0015: SOURCE_DATE_EPOCH from HEAD commit timestamp (matches
          # scripts/build-container-prod.sh). RUST_VERSION mirrors the script;
          # both are passed as build-args for fidelity with the prior path.
          {
            echo "short_sha=$(git rev-parse --short HEAD)"
            echo "source_date_epoch=$(git log -1 --format=%ct)"
            echo "rust_version=1.91"
          } >> "$GITHUB_OUTPUT"

      # build-push-action needs a buildx builder. The Dockerfile's
      # `--mount=type=cache` cargo/target mounts still work within a single run;
      # we deliberately do NOT persist them across runs (no gha cache) — the
      # build is fast and the gha cache risks the 10GB limit.
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build prod container image (Dockerfile → corelink-server:<sha> + :prod)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true   # load into the local docker daemon for the push script
          push: false
          # LOCAL_REF the push script consumes is `corelink-server:<short-sha>`
          # (scripts/push-container-multiregion.sh:63). :prod kept for parity.
          tags: |
            corelink-server:prod
            corelink-server:${{ steps.meta.outputs.short_sha }}
          # NB: the Dockerfile hardcodes FROM rust:1.91 + does not declare
          # ARG RUST_VERSION / ARG SOURCE_DATE_EPOCH, so these build-args are
          # currently inert (BuildKit ignores undeclared args). Passed anyway to
          # mirror scripts/build-container-prod.sh and to stay correct if the
          # Dockerfile later wires the ARGs.
          build-args: |
            RUST_VERSION=${{ steps.meta.outputs.rust_version }}
            SOURCE_DATE_EPOCH=${{ steps.meta.outputs.source_date_epoch }}

      # ── Build gates (mirror scripts/build-container-prod.sh steps 4–6) ──────
      # The image is loaded locally as corelink-server:<short-sha>. ubuntu runs
      # the linux/amd64 image natively, so we probe it directly.
      - name: Image size gate (CF Containers 2 GiB ceiling)
        env:
          IMAGE_REF: corelink-server:${{ steps.meta.outputs.short_sha }}
        run: |
          set -euo pipefail
          IMAGE_SIZE="$(docker images --format '{{.Size}}' "$IMAGE_REF" | head -1)"
          echo "Image size: $IMAGE_SIZE"
          # Docker reports sizes with a unit suffix (kB/MB/GB/B). Parse number+unit.
          SIZE_VALUE="$(echo "$IMAGE_SIZE" | grep -oE '[0-9]+(\.[0-9]+)?')"
          SIZE_UNIT="$(echo "$IMAGE_SIZE" | grep -oE '[A-Za-z]+')"
          SIZE_BYTES=0
          case "$SIZE_UNIT" in
            kB|KB) SIZE_BYTES=$(echo "$SIZE_VALUE * 1024" | bc) ;;
            MB)    SIZE_BYTES=$(echo "$SIZE_VALUE * 1048576" | bc) ;;
            GB)    SIZE_BYTES=$(echo "$SIZE_VALUE * 1073741824" | bc) ;;
            B)     SIZE_BYTES="$SIZE_VALUE" ;;
            *)     echo "::warning::Could not parse image size unit '$SIZE_UNIT'; skipping size gate." ;;
          esac
          MAX_BYTES=$(( 2 * 1024 * 1024 * 1024 ))  # 2 GiB
          # bc may emit a float (e.g. "123.4"); truncate to an integer for -gt.
          SIZE_BYTES_INT="${SIZE_BYTES%.*}"
          if [ -n "${SIZE_BYTES_INT:-}" ] && [ "$SIZE_BYTES_INT" -gt "$MAX_BYTES" ] 2>/dev/null; then
            echo "::error::HARD FAIL: image size ($IMAGE_SIZE) exceeds the 2 GiB CF Containers limit."
            exit 1
          fi
          echo "Size gate: PASS ($IMAGE_SIZE < 2 GiB)"

      - name: CTRL-CRED-001 — no credentials in image layers
        env:
          IMAGE_REF: corelink-server:${{ steps.meta.outputs.short_sha }}
        run: |
          set -euo pipefail
          HISTORY_OUTPUT="$(docker history --no-trunc --format '{{.CreatedBy}}' "$IMAGE_REF")"
          CRED_PATTERNS=(
            "API_TOKEN" "API_KEY" "SECRET" "PASSWORD" "PASSWD"
            "PRIVATE_KEY" "ACCESS_KEY" "CF_API" "STRIPE_" "CLERK_"
            "PAGERDUTY" "NEON_" "DATABASE_URL"
          )
          CRED_HITS=0
          for pattern in "${CRED_PATTERNS[@]}"; do
            if echo "$HISTORY_OUTPUT" | grep -qi "$pattern"; then
              echo "::error::CTRL-CRED-001 VIOLATION: pattern '$pattern' found in docker history."
              CRED_HITS=$(( CRED_HITS + 1 ))
            fi
          done
          if [ "$CRED_HITS" -gt 0 ]; then
            echo "::error::HARD FAIL: $CRED_HITS credential pattern(s) in image layers (CTRL-CRED-001)."
            exit 1
          fi
          echo "CTRL-CRED-001 scan: PASS (0 credential patterns found)."

      - name: Binary smoke probe (detached, bounded-by-construction)
        env:
          IMAGE_REF: corelink-server:${{ steps.meta.outputs.short_sha }}
        run: |
          set -euo pipefail
          # ROOT-CAUSE FIX (the original "2h build" hang): the server binary IGNORES
          # --version/--help and BOOTS the gRPC server (blocks forever). The prior
          # `timeout 8s docker run … --version` did NOT bound it — `timeout` sends
          # SIGTERM, the server ignores it, and without `--kill-after` timeout waits
          # forever → the step hung ~85min until the job timeout. So we NEVER run a
          # blocking `docker run --version`. Instead: start DETACHED (returns
          # immediately), check the binary is still alive after a few seconds (a
          # broken binary panics/exits immediately), then FORCE-remove. Bounded by
          # construction (~6s); `docker rm -f` cannot hang.
          docker rm -f corelink-smoke >/dev/null 2>&1 || true
          CID="$(docker run -d --name corelink-smoke "$IMAGE_REF" 2>/dev/null || true)"
          if [ -z "$CID" ]; then
            echo "::error::HARD FAIL: container failed to start (docker run -d returned no id)."
            exit 1
          fi
          # A boot panic is immediate; 6s is ample to catch it. The server boots its
          # listener even without backend secrets (storage degrades to in-memory; no
          # boot panic), so a healthy binary is Running=true here.
          sleep 6
          RUNNING="$(docker inspect -f '{{.State.Running}}' corelink-smoke 2>/dev/null || echo false)"
          EXITCODE="$(docker inspect -f '{{.State.ExitCode}}' corelink-smoke 2>/dev/null || echo 1)"
          docker rm -f corelink-smoke >/dev/null 2>&1 || true
          if [ "$RUNNING" != "true" ] && [ "$EXITCODE" != "0" ]; then
            echo "::error::HARD FAIL: container exited non-zero ($EXITCODE) within 6s — binary smoke failed."
            exit 1
          fi
          echo "Smoke probe: PASS (binary started + stayed up; Running=$RUNNING ExitCode=$EXITCODE)"

      - name: ADR-0015 reproducibility attestation (reminder)
        run: |
          set -euo pipefail
          echo "ADR-0015: to verify reproducibility, rebuild on the same HEAD and compare"
          echo "  docker inspect --format '{{.Id}}' corelink-server:prod"
          echo "Both runs MUST produce the same sha256 for ADR-0015 compliance."

      - name: Install wrangler (4.x — required for [[containers]] push)
        run: npm install -g wrangler@4.95.0

      - name: Push image to the 5 CF Containers registries
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          WRANGLER: wrangler
        run: bash scripts/push-container-multiregion.sh --apply

      - name: Next step (repin + deploy)
        run: |
          echo "Built+pushed corelink-server:$(git rev-parse --short HEAD) to the CF registries."
          echo "NEXT: repin wrangler.toml [[env.*.containers]] image= to the new tag, then run cf-deploy-prod."
