# Build + push the prod container image on a GitHub-HOSTED Linux runner
# (`ubuntu-latest`) — OFF the founder's dev Mac.
#
# History: the off-Mac build was blocked twice on 2026-06-19 — Blacksmith needs a
# GitHub Org (account was personal), and GitHub-hosted was billing-blocked. BOTH
# were resolved when the account moved to the `HumanGuardrail` GitHub Org + a paid
# GitHub plan was added. So we're back on GitHub-hosted ubuntu-latest: Linux x86
# with docker + buildx pre-installed → builds the linux/amd64 image natively, no
# Mac, no Docker-Desktop-on-the-laptop, no third-party.
# (Blacksmith is now also viable as a faster/cached future option, but ubuntu-latest
#  is the simplest path and needs no extra setup.)
#
# Cost: GitHub Actions minutes (paid plan includes a monthly allotment; a build is
# ~20-40 min, cacheable). Manual-only. Runs the same scripts the Mac path ran
# (build → multi-region push), so the result matches the prior prod redeploy.
name: container-build-push-prod

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "build" to confirm building + pushing the prod container image to the CF registries.'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  build-push:
    name: build + push prod container (ubuntu-latest, off-Mac)
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 120
    steps:
      - name: Confirm intent
        run: |
          if [ "${{ inputs.confirm }}" != "build" ]; then
            echo "::error::Type 'build' in the confirm input to proceed."; exit 1
          fi

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # full history so `git rev-parse --short HEAD` resolves the image tag

      - name: Runner + tooling check (proof it's off-Mac Linux)
        run: |
          echo "=== runner ==="; uname -a
          echo "=== docker ==="; docker version --format '{{.Server.Version}}'
          echo "=== buildx ==="; docker buildx version
          echo "=== disk ==="; df -h /

      - name: Build prod container image (Dockerfile → corelink-server:prod + :<sha>)
        run: bash scripts/build-container-prod.sh

      - name: Install wrangler (4.x — required for [[containers]] push)
        run: npm install -g wrangler@4.95.0

      - name: Push image to the 5 CF Containers registries
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          WRANGLER: wrangler
        run: bash scripts/push-container-multiregion.sh --apply

      - name: Next step (repin + deploy)
        run: |
          echo "Built+pushed corelink-server:$(git rev-parse --short HEAD) to the CF registries."
          echo "NEXT: repin wrangler.toml [[env.*.containers]] image= to the new tag, then run cf-deploy-prod."
