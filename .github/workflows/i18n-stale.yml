name: i18n stale-content check

# R-prep i18n-de — weekly stale-content audit per TRANSLATION-WORKFLOW.md §3.
# Runs Tuesday 10:00 UTC; opens (or updates) a single tracking issue when any
# locale page is older than the EN source by more than $MAX_STALE_DAYS.
# Spec reference: ROADMAP §4 R-4 + R-prep i18n-de.

on:
  schedule:
    # Tuesday 10:00 UTC. After Monday's EN merges land, before mid-week
    # translator hand-off.
    - cron: "0 10 * * 2"
  workflow_dispatch:
    inputs:
      threshold_days:
        description: "Stale threshold in days (default 14)"
        required: false
        default: "14"

permissions:
  contents: read
  issues: write

concurrency:
  group: i18n-stale-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stale-check:
    name: Weekly i18n stale audit
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 10
    steps:
      - name: Checkout (full history for git log)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # We need history to read `git log -1 --format=%ct` on every doc.
          fetch-depth: 0

      - name: Run stale-check script
        id: stale
        env:
          MAX_STALE_DAYS: ${{ github.event.inputs.threshold_days || '14' }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # --no-fail so the workflow always reaches the report-publishing
          # step; the gating happens via the issue body (and a follow-up
          # PR-time gate when docs change).
          bash apps/docs/scripts/i18n-stale-check.sh \
            --no-fail \
            --md dist/i18n-stale.md \
            --json dist/i18n-stale.json
          # Surface stale count to subsequent steps.
          stale=$(jq -r '.stale' dist/i18n-stale.json)
          echo "stale=$stale" >> "$GITHUB_OUTPUT"
          echo "Stale rows: $stale"

      - name: Upload stale report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: i18n-stale-report
          path: |
            dist/i18n-stale.md
            dist/i18n-stale.json
          retention-days: 90

      - name: Open or update tracking issue
        if: steps.stale.outputs.stale != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STALE_COUNT: ${{ steps.stale.outputs.stale }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('dist/i18n-stale.md', 'utf8');
            const title = `[i18n-stale] ${process.env.STALE_COUNT} pages overdue per SLA`;
            const labels = ['i18n', 'docs', 'sla-tracking'];

            const { owner, repo } = context.repo;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo,
              state: 'open',
              labels: labels.join(','),
              per_page: 100,
            });
            const sameTitle = existing.find(i => i.title.startsWith('[i18n-stale]'));
            const fullBody =
              body +
              `\n\n---\n_Generated by \`.github/workflows/i18n-stale.yml\` ` +
              `(weekly Tue 10:00 UTC). Source: ` +
              `\`apps/docs/scripts/i18n-stale-check.sh\`. SLA reference: ` +
              `\`apps/docs/i18n/TRANSLATION-WORKFLOW.md\` §3._`;

            if (sameTitle) {
              await github.rest.issues.update({
                owner, repo,
                issue_number: sameTitle.number,
                title, body: fullBody,
              });
              core.info(`Updated existing issue #${sameTitle.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner, repo, title, body: fullBody, labels,
              });
              core.info(`Opened new issue #${created.data.number}`);
            }
