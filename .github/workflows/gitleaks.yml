name: gitleaks (secret-leak scan)

# Launch-hardening scan: detect committed secrets (API keys, tokens, private
# keys, Stripe `sk_live`/`whsec_`, Clerk keys, CF tokens) before they reach main.
# The 2026-06-18 baseline caught a stale committed Stripe webhook secret that the
# DEFAULT ruleset missed — `.gitleaks.toml` adds a custom `whsec_` rule + tunes
# the fixture/spec allowlist (operational trees stay in scope).
#
# Runner: `corelink` — the product's own ephemeral runner fabric (wave 1 of the
# migration off GitHub-hosted runners, 2026-08-03). gitleaks is a light git-log
# scan (no Rust compile, ~70 MB graph) and the pinned binary is the Linux x86_64
# release asset, which is exactly what a corelink box runs: Ubuntu 24.04 /
# x86_64 / 4 vCPU / 12.5 GB. curl, tar, sha256sum and git 2.43 are all on the
# image, so the install step below is byte-for-byte the same work it did on
# ubuntu-latest — same tarball, same checksum, same command, same assertions.
#
# gitleaks and trivy were the ONLY two hosted workflows with an unfiltered
# `pull_request:` trigger, i.e. the two that ran on EVERY pull request. That is
# why they are wave 1: they carry the hosted PR bill almost by themselves.
#
# ⚠️ Ephemeral-runner reality. A corelink box is minted per job and destroyed
# after, so nothing is cached between runs — fine here, since this job never
# cached anything. The real exposure is the opposite one: if the fabric refuses
# or drops the spawn, the job sits QUEUED, and `timeout-minutes` does NOT apply
# to queued time (it starts counting once a job is RUNNING). GitHub eventually
# cancels a job left queued for 24 h. That is a stall, not a false pass:
# `scripts/pre-merge-gate-check.sh` scores a pending check as ⛔ DO NOT MERGE,
# so a stranded box blocks the PR rather than waving it through.
#
# gitleaks is installed as a VERSION-pinned release BINARY (curl tarball + verify
# sha256), matching the repo's no-unpinned-action posture (every `uses:` is a
# 40-char SHA). A gitleaks version/checksum bump takes the same tooling-pin review
# as an action SHA bump (FF-HR-005 / ADR-S12-045 §6).

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned gitleaks release + its published linux_x64 tarball sha256 (the
  # corelink fabric hands out Linux x86_64 boxes, so this stays the linux_x64
  # asset — unchanged by the runner migration). Source of truth
  # (gitleaks_8.30.1_checksums.txt):
  # https://github.com/gitleaks/gitleaks/releases/tag/v8.30.1
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

jobs:
  gitleaks:
    name: gitleaks detect
    runs-on: corelink
    timeout-minutes: 10

    steps:
      - name: Checkout (full history — gitleaks scans the commit graph)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false  # scan-only job never pushes — don't keep the token

      - name: Install gitleaks (pinned binary + checksum verify)
        # Download the version-pinned release tarball and fail closed unless its
        # sha256 matches GITLEAKS_SHA256. Install into $RUNNER_TEMP + prepend to
        # $GITHUB_PATH (NOT `sudo install` — self-hosted runners often lack
        # passwordless sudo).
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          curl -fsSL -o "${tarball}" "${url}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/gitleaks-bin"
          tar -xzf "${tarball}" -C "${RUNNER_TEMP}/gitleaks-bin" gitleaks
          rm -f "${tarball}"
          echo "${RUNNER_TEMP}/gitleaks-bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/gitleaks-bin/gitleaks" version

      - name: gitleaks detect — PR commit range
        # On a PR we scan ONLY the commits the PR introduces (base..head) so the
        # gate is fast and only blocks on NEW leaks — historical findings are
        # triaged out-of-band (the baseline doc). `--redact` keeps secret values
        # out of the CI log; `--exit-code 1` fails the job on any finding.
        if: github.event_name == 'pull_request'
        # PR SHAs are passed via env (NOT interpolated directly into run:) — the
        # template-injection-safe pattern (zizmor template-injection); base/head
        # SHAs are validated 40-hex, but env-passing is the correct posture.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --redact \
            --no-banner \
            --exit-code 1 \
            --report-format sarif \
            --report-path "${RUNNER_TEMP}/gitleaks.sarif"

      - name: gitleaks detect — full history (manual dispatch)
        # workflow_dispatch runs a full-history baseline sweep.
        if: github.event_name == 'workflow_dispatch'
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1 \
            --report-format sarif \
            --report-path "${RUNNER_TEMP}/gitleaks.sarif"
