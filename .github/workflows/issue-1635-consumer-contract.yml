name: issue-1635 credentialless consumer contract

on:
  pull_request:
    paths:
      - .github/workflows/issue-1635-consumer-contract.yml
      - docs/operator/issue-1635-consumer-contract.md
      - scripts/verify_i1635_consumer_contract.py
      - tests/test_verify_i1635_consumer_contract.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: validate server usage acknowledgement wire
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout without write credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
        with:
          persist-credentials: false
      - name: Build literal server mixed response and submitted batch
        run: |
          cat > "$RUNNER_TEMP/i1635-request.json" <<'JSON'
          [
            {"tenant_id":"11111111-1111-4111-8111-111111111111","event_kind":"runner_slot_seconds","qty":7200,"billing_period":"2026-06","region":"iad","source":"corelink/runner/iad","time_ms":1718000000000,"idem_key":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"},
            {"tenant_id":"11111111-1111-4111-8111-111111111111","event_kind":"runner_slot_seconds","qty":7200,"billing_period":"2026-06","region":"iad","source":"corelink/runner/iad","time_ms":1718000000000,"idem_key":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"},
            {"tenant_id":"invalid","event_kind":"runner_slot_seconds","qty":7200,"billing_period":"2026-06","region":"iad","source":"corelink/runner/iad","time_ms":1718000000000,"idem_key":"CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC"}
          ]
          JSON
          cat > "$RUNNER_TEMP/i1635-response.json" <<'JSON'
          {
            "outcomes": [
              {"index": 0, "idem_key": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", "outcome": "accepted"},
              {"index": 1, "idem_key": "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb", "outcome": "deduped"},
              {"index": 2, "idem_key": "cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc", "outcome": "rejected", "reason": "bad_tenant_id"}
            ],
            "accepted": 1,
            "deduped": 1,
            "rejected": 1,
            "total": 2
          }
          JSON
      - name: Validate mixed 202 receipt
        run: python3 scripts/verify_i1635_consumer_contract.py --status 202 --request "$RUNNER_TEMP/i1635-request.json" --response "$RUNNER_TEMP/i1635-response.json"
      - name: Validate outcome and status mutations
        run: python3 tests/test_verify_i1635_consumer_contract.py
      - name: Validate bodyless backend uncertainty
        run: python3 scripts/verify_i1635_consumer_contract.py --status 503 --no-body
