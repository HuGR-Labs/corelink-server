name: docs CI

# WI-S18-001 + CI-OPT-002 consolidation — typecheck + lint + test + build +
# Lighthouse-CI + axe + lychee broken-link + Vale prose lint + Playwright
# a11y sweep (WCAG 2.2 AA, powered by @axe-core/playwright) + i18n coverage +
# REAPI auto-gen drift check for apps/docs/ (Docusaurus 3).
#
# All actions are SHA-pinned per S-12 supply-chain policy.
#
# Trigger surface expanded by CI-OPT-002 to absorb formerly-standalone
# workflows: includes proto paths (for REAPI drift) and a schedule trigger
# (for nightly Lighthouse baseline). Standalone `docs-a11y.yml`,
# `docs-a11y-baseline.yml`, `docs-i18n.yml`, `docs-lighthouse.yml`, and
# `docs-reapi-gen.yml` have been deleted; their jobs are absorbed below
# and share the single `build` artifact (saves ~25 billable-min/PR).

on:
  pull_request:
    paths:
      - "apps/docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/docs-ci.yml"
      # This job's `pnpm install` behaviour comes from the composite action as
      # much as from this file, so a change to it must re-run this gate.
      - ".github/actions/setup-pnpm/**"
      # REAPI drift surface (absorbed from docs-reapi-gen.yml per CI-OPT-002).
      # apps/server/proto/** moved to crates/corelink-container/proto/** in
      # wave-33 stage 2.B.1 (1d0c221e) — keep the trigger pointed at the live
      # location or proto edits silently skip the drift gate.
      - "crates/corelink-reapi/proto/**"
      - "crates/corelink-container/proto/**"
      # The React-page internal-link gate lives outside apps/docs, so a change
      # to the gate itself must re-run it (otherwise the gate can be weakened
      # without ever executing).
      - "scripts/check_docs_react_links.py"
      - "tests/test_check_docs_react_links.py"
      - "requirements-ci.txt"
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/docs-ci.yml"
      # This job's `pnpm install` behaviour comes from the composite action as
      # much as from this file, so a change to it must re-run this gate.
      - ".github/actions/setup-pnpm/**"
      - "crates/corelink-reapi/proto/**"
      - "crates/corelink-container/proto/**"
      # The React-page internal-link gate lives outside apps/docs, so a change
      # to the gate itself must re-run it (otherwise the gate can be weakened
      # without ever executing).
      - "scripts/check_docs_react_links.py"
      - "tests/test_check_docs_react_links.py"
      - "requirements-ci.txt"
  schedule:
    # Lighthouse baseline at 08:00 UTC (absorbed from docs-lighthouse.yml).
    # Tag-trigger surface from old docs-lighthouse.yml (docs-v*, v*) is
    # deferred: PR-time `lighthouse` job covers every PR; the scheduled
    # `lighthouse-baseline` covers regression detection. Add a tag-time
    # lighthouse job in a follow-up if release verification becomes a hard
    # requirement.
    #
    # Cadence: daily -> WEEKLY Mon (CI cost diet 2026-08-01). This workflow
    # fans out to 10 jobs, of which 6 are still GitHub-hosted after the wave-2
    # fabric migration (lighthouse, axe, broken-links, a11y-playwright,
    # a11y-baseline-diff, lighthouse-baseline — all blocked on Chrome or Docker;
    # see each job), so one scheduled run costs ~6x the per-job billing floor
    # before any real work.
    # The `pull_request` + `push:main` paths above already gate EVERY docs
    # change; the schedule only catches external drift (dead outbound links,
    # a Lighthouse score moving under an unchanged site), which is weekly-shaped.
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "10.32.1"
  NODE_VERSION: "20"

jobs:
  build:
    name: typecheck + lint + test + build
    # ── Runner: `corelink` — the product's own ephemeral runner fabric (wave 2,
    # 2026-08-03). THIS BLOCK IS THE CANONICAL NOTE FOR THIS FILE; the other
    # three migrated jobs (`vale`, `i18n-coverage`, `reapi-gen-drift`) point here.
    #
    # Measured cost removed: 204 billed minutes of `ubuntu-latest` over the 43
    # docs-ci runs in the 3 days to 2026-08-03 (43 executions, median 290 s,
    # p90 306 s, max 312 s; billed = ceil-to-the-minute per job). That is 31 % of
    # this workflow's 664 billed minutes in the window and the single most
    # expensive job in the file. A minute on `corelink` costs $0 of GitHub billing.
    #
    # Why it fits: `pnpm typecheck/lint/test/build` is node-only. `vitest` runs
    # with `environment: "node"` (apps/docs/vitest.config.ts) — no browser. pnpm 10
    # does not execute dependency lifecycle scripts (no `onlyBuiltDependencies` in
    # package.json), so `pnpm install` never invokes node-gyp and never needs the
    # python3 that this box lacks. Image inventory job 91857115465 (2026-08-04
    # 00:30 UTC, on a real fabric box) proves: Linux x86_64, node v22.23.2,
    # npm 10.9.8, pnpm 10.32.1, registry.npmjs.org reachable (200).
    #
    # Box shape: 4 vCPU / 12.5 GB against `ubuntu-latest`'s 2 vCPU / 7 GB on a
    # private repo — twice the cores for the 226 s Docusaurus build that dominates
    # this job.
    #
    # ⚠️ Ephemeral: the box carries NOTHING between runs — no tool cache, no pnpm
    # store, no node_modules. See the Node.js step below for what that costs and
    # for why the pnpm cache was removed rather than left looking functional.
    #
    # ⚠️ A refused or dropped spawn leaves the job QUEUED, and `timeout-minutes`
    # does not bound queued time — it starts once a job is RUNNING. That is a
    # stall, not a false pass: `scripts/pre-merge-gate-check.sh` scores a pending
    # check as ⛔ DO NOT MERGE. Note this job has the highest fan-in in the file —
    # six jobs `needs: build` for the `docs-build` artifact — so a stranded spawn
    # here stalls the whole workflow rather than one lane.
    runs-on: ubuntu-latest
    # Measured median 290 s (~4.8 min) over 43 hosted runs; worst observed 312 s.
    # DELIBERATELY LEFT AT 20 (≈4.1x median) rather than tightened to the 3x/15
    # the recipe suggests: this is the job's first exposure to a cold, cacheless
    # box, so the fabric median is not yet known. A too-tight bound would fail
    # runs that are merely cold. Re-tighten once ~6 fabric runs exist. This bounds
    # RUNNING time only — it does not cap a job queued on a fabric spawn.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pnpm
        # Local composite (offline-first): prefers the runner's pre-installed
        # pnpm to avoid the shared-$HOME race that `pnpm/action-setup` triggers
        # on the single-Mac self-hosted fleet. Mirrors admin-ui-ci/lighthouse-ci.
        uses: ./.github/actions/setup-pnpm
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        # KEPT on the fabric box, deliberately. The image ships node v22.23.2,
        # but this pins node 20 (`NODE_VERSION`), and the runner image drifts
        # UNMONITORED — rustc moved 1.91 -> 1.96 on this image inside two days.
        # Measured price of the pin: 6.0 s median for this step across 14 hosted
        # runs, i.e. ~2 % of the job's 290 s. Dropping it would save at most those
        # few seconds and would silently move the Docusaurus build from node 20 to
        # node 22 — a behaviour change, not a cost win. Keep.
        #
        # ⛔ `cache: pnpm` REMOVED here (it is still present on the jobs that stay
        # hosted). Reason, measured — NOT assumed:
        #   * `.github/actions/setup-pnpm` pins the pnpm store to
        #     `$HOME/.pnpm-store-$RUNNER_NAME`. A fabric box is ephemeral and its
        #     RUNNER_NAME is unique per spawn (`cf-runner-<hex>`), so a restored
        #     store always lands under a DEAD directory name that pnpm never reads.
        #     The step would report success and deliver nothing.
        #   * It already delivers nothing on the hosted runners either: job
        #     91820851349 (2026-08-03) logged `pnpm cache is not found` and then
        #     `resolved 2087, reused 0, downloaded 2084` — a full cold install —
        #     and job 91811652838 on the prior run logged the same. Two jobs of the
        #     same run also race to save the identical key
        #     `node-cache-Linux-x64-pnpm-<lockfile-hash>`.
        # Removing it also drops the ~9 s `Post Set up Node.js` save step. The
        # hosted-side breakage lives in the shared composite and is NOT fixed here
        # (it is shared with admin-ui-ci and out of this file's scope).
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Bundle size assertion (≤ 250 KB main bundle)
        run: |
          # R-S18-X — main bundle ≤ 250 KB budget (S-18 perf target).
          # Docusaurus emits the runtime/main chunk under build/assets/js/main.*.js.
          main_file=$(find build/assets/js -maxdepth 1 -name "main.*.js" | head -1 || true)
          if [ -z "$main_file" ]; then
            # Fallback: largest single JS asset (Docusaurus chunk naming can vary).
            # `|| true` to match the guard on the primary lookup four lines up.
            # The asymmetry was the bug: the fallback path is the one that runs
            # when there are MANY chunks, i.e. exactly when `head -1` closes the
            # pipe and pipefail turns a size report into a failed step (B-040).
            main_file=$(find build/assets/js -maxdepth 1 -name "*.js" -print0 \
              | xargs -0 du -k 2>/dev/null | sort -nr | head -1 | awk '{print $2}' || true)
          fi
          if [ -z "$main_file" ] || [ ! -f "$main_file" ]; then
            echo "::error::Bundle-size assertion could not locate main bundle under build/assets/js"
            ls -lah build/assets/js || true
            exit 1
          fi
          main_kb=$(du -k "$main_file" | awk '{print $1}')
          echo "Main bundle: $main_file = ${main_kb} KB (budget: 250 KB)"
          if [ "$main_kb" -gt 250 ]; then
            echo "::error::Main bundle ${main_kb} KB exceeds 250 KB budget (R-S18-X)"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-build
          path: apps/docs/build
          retention-days: 7
          if-no-files-found: error

  broken-links:
    name: lychee broken-link check
    needs: build
    # MOVED OFF HOSTED (2026-08-24). `lycheeverse/lychee-action` is a Docker
    # CONTAINER action and the fabric box has no docker, so the action cannot run
    # there at all. The 2026-08-03 note declined the swap because a hand-rolled
    # download trades a SHA-pinned action for a bespoke one — a fair objection,
    # answered here rather than ignored: the release tarball is pinned by VERSION
    # and by SHA-256 recorded below, and the checksum is verified before the
    # binary is ever executed. That is the same property the action pin gave us.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-build
          path: apps/docs/build

      # This gate was `fail: false` (always green regardless of findings) AND
      # its internal-link resolution was structurally broken: `baseUrl` mounts
      # the site under `/corelink/docs/…` (docusaurus.config.ts), but the
      # build output on disk is flat — no `/corelink/docs` directory — so
      # every absolute-path internal link (`/tutorial/...`, `/security`, …)
      # resolved via `--root-dir` to a nonexistent
      # `build/corelink/docs/...` path. Measured against the actual build
      # output (`lychee 0.24.2`, one representative page): 74/118 links
      # errored, ALL of them this one false-positive class — 0 were real.
      #
      # Fixed both problems instead of relabeling the gate as advisory:
      #   1. `--remap` rewrites the `/corelink/docs` mount prefix off local
      #      `file://` URIs before root-dir resolution, so an absolute link
      #      to `/tutorial/02-first-pat` resolves to
      #      `<root-dir>/tutorial/02-first-pat` instead of
      #      `<root-dir>/corelink/docs/tutorial/02-first-pat`.
      #   2. `--fallback-extensions html` — `trailingSlash: false` means
      #      Docusaurus emits `tutorial/02-first-pat.html`, not
      #      `.../index.html`, so the extensionless link needs the fallback
      #      to find it.
      # Re-verified after both fixes on the same page: 0 errors (91 OK).
      # `fail: true` now that the gate proves something instead of nothing.
      - name: Install lychee (pinned + checksum-verified)
        env:
          LYCHEE_VERSION: v0.24.2
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)  target=x86_64-unknown-linux-musl;  sha=73657a111819a30c47c08352896796f23d64e4eb2b3ed39b6d32149241566fc5 ;;
            aarch64) target=aarch64-unknown-linux-musl; sha=5d0b0e3aeab240f41920c633a6eaf97599be6eedda034b36e858ede7dba5e535 ;;
            *) echo "::error::No pinned lychee checksum for $(uname -m)" >&2; exit 1 ;;
          esac
          tarball="lychee-${target}.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-${LYCHEE_VERSION}/${tarball}"
          # Verify BEFORE unpacking or executing anything.
          echo "${sha}  ${tarball}" | sha256sum -c -
          # The archive nests everything under <target>/. Unpack it whole and
          # take the binary from its known path -- selecting a single member by
          # name is not portable across GNU tar and bsdtar.
          tar -xzf "$tarball"
          install -m 0755 "lychee-${target}/lychee" "${RUNNER_TEMP}/lychee"
          "${RUNNER_TEMP}/lychee" --version

      - name: Run lychee
        # ⛔ DO NOT add `GITHUB_TOKEN` (or any other credential) to this job.
        # lychee picks `GITHUB_TOKEN` up from the environment automatically, and
        # a link checker holding a credential the reader does not have stops
        # measuring what the reader sees. This job has NO env at the workflow,
        # job or step level beyond `LYCHEE_VERSION`, and B-037's verify asserts
        # that mechanically.
        #
        # The other half of the vantage question — this job runs `runs-on:
        # corelink`, i.e. from inside Cloudflare, checking links partly served
        # BY Cloudflare — was settled by measurement rather than by argument on
        # 2026-08-25: the same build artifact (run 32801556993) re-checked from
        # an outside, token-less host produced byte-identical counters —
        # 108 870 total / 11 553 unique / 105 598 OK / **0 errors** / 3 183
        # excluded / 89 unsupported — differing only in redirects followed
        # (111 vs 108, ordinary jitter). Re-measure if the exclusion list or the
        # runner changes; do not assume it.
        #
        # Same arguments the action was invoking, and still fail-on-error: the
        # `--remap` + `--fallback-extensions` pair is what makes this gate prove
        # something (see the note above), so neither may be dropped in the move.
        #
        # The second --remap resolves the two SDK artifact trees we publish
        # ourselves (`/pypi/**`, `/npm/**`) against THIS build instead of the
        # live site. Those URLs must be absolute in the docs because a reader
        # pastes them into `pip install --extra-index-url ...`, and on a PR they
        # necessarily 404 on the live site: the assets ship WITH the deploy this
        # PR produces. Checking them against the build is the stronger claim,
        # not the weaker one — it fails if the documented URL does not match an
        # artifact that is actually about to be served, which a live check
        # cannot see until after the merge. Scoped to those two prefixes only;
        # every other humangr.com link is still fetched over the network.
        run: |
          set -euo pipefail
          # SC2016: the single quotes are deliberate — the `$` belongs to the
          # --remap REGEX, not to the shell. `${{ github.workspace }}` is
          # substituted by Actions before the shell ever sees this line.
          # shellcheck disable=SC2016
          "${RUNNER_TEMP}/lychee" \
            --config apps/docs/lychee.toml --no-progress \
            --root-dir "${{ github.workspace }}/apps/docs/build" \
            --fallback-extensions html \
            --remap '^file://${{ github.workspace }}/apps/docs/build/corelink/docs(/.*)?$ file://${{ github.workspace }}/apps/docs/build$1' \
            --remap '^https://humangr\.com/corelink/docs/(pypi|npm)/(.*)$ file://${{ github.workspace }}/apps/docs/build/$1/$2' \
            'apps/docs/build/**/*.html'

  sdk-artifacts:
    name: published SDK artifacts match their source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Rebuild the wheel and the tarball and compare
        # apps/docs/static/ serves a built wheel and a built npm tarball, so a
        # change under sdks/ that forgets to republish would leave customers
        # downloading a stale SDK. This rebuilds both and fails on any drift.
        run: bash scripts/verify-sdk-artifacts.sh

  react-link-check:
    name: React-page internal links resolve to published routes
    # WHY THIS JOB EXISTS. `onBrokenLinks: "throw"` (docusaurus.config.ts) only
    # covers links Docusaurus resolves itself — Markdown/MDX links and <Link>.
    # A raw `<a href="/...">` typed into a React page under
    # apps/docs/src/pages/** is invisible to it, and the `broken-links` job
    # above (lychee, against the BUILD output) did not catch these either.
    # Measured on 2026-08-31: 9 such hrefs on the LIVE legal pages resolved to
    # nothing — /explanation/compliance/dpa (x6), /explanation/privacy/gdpr,
    # /explanation/privacy/lgpd-full, /explanation/sre/slo — with every gate in
    # the repo green. Confirmed against production:
    # `curl -o /dev/null -w '%{http_code}' https://humangr.com/corelink/docs/explanation/compliance/dpa`
    # returned 404.
    #
    # Independent of the `build` artifact by design: it reads sources, not
    # build output, so it still runs (and still fails) when the build breaks.
    #
    # ── Runner: `corelink` fabric — see the `build` job above for the full
    # ephemeral-box / queued-spawn note. This job is python3-only; the image
    # ships /usr/bin/python3 (the same idiom `spec_validation.yml` has used on
    # this fleet since 2026-06-03), and pyyaml comes from requirements-ci.txt
    # in a repo-local venv rather than being assumed present.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install dependencies (venv on system python3)
        # No actions/setup-python: it cannot provision Python on the
        # self-hosted fleets (RUNNER_TOOL_CACHE unset -> unwritable
        # /Users/runner). Same recipe as spec_validation.yml.
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python3 -m pip install --upgrade pip
          .venv/bin/python3 -m pip install -r requirements-ci.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Prove the JSX-link scanner rejects malformed, empty, and dead routes
        run: python3 -m unittest tests/test_check_docs_react_links.py

      - name: Resolve every internal href in apps/docs/src/**/*.tsx
        # --verbose prints the POPULATION (hrefs checked, destinations known,
        # drafts excluded) so a run that checked nothing is visible in the log
        # instead of reading as a pass. The script itself fails loudly on every
        # empty-list path; it cannot pass vacuously.
        run: python3 scripts/check_docs_react_links.py --verbose

  vale:
    name: Vale prose lint
    # ADVISORY (never fails on findings — `--no-exit`): full-tree error-level
    # report, i.e. the legacy prose-debt burn-down list. The ENFORCING gate is
    # docs-vale.yml, scoped to the files each PR changes. Installs a
    # checksum-pinned native Vale (Linux x86_64 release asset) rather than
    # errata-ai/vale-action, keeping the no-unpinned-action posture.
    #
    # ── Runner: `corelink` fabric (wave 2, 2026-08-03) — see the `build` job above
    # for the full ephemeral-box / queued-spawn note.
    #
    # Measured cost removed: 43 billed minutes of `ubuntu-latest` over the 43 runs
    # in the 3 days to 2026-08-03 — and ALL of it is GitHub's per-job 1-minute
    # billing floor, because the job's median wall time is 12 s (max 29 s). This is
    # the best ratio in the file: ~9 s of real work billed as 43 minutes.
    #
    # Why it fits: pure `curl` + `sha256sum` + `tar` + a static Go binary. Nothing
    # node, nothing python3, no browser. All four are PRESENT on the box (curl
    # 8.5.0, coreutils 9.4, GNU tar 1.35) and github.com answers 200 from it
    # (image inventory 91857115465).
    runs-on: ubuntu-latest
    # Measured median 12 s over 43 hosted runs (max 29 s). 3x median is far under
    # the floor, so this sits at the recipe's 10-minute floor — which is also what
    # it already was. Bounds RUNNING time only; a queued spawn is not capped.
    timeout-minutes: 10
    env:
      VALE_VERSION: 3.9.1
      # sha256 from the official vale_3.9.1_checksums.txt release asset
      # (vale_3.9.1_Linux_64-bit.tar.gz).
      VALE_SHA256_X86_64: fbc2eb47d0b8c50220ed1a2c5c611fbe0904ed567d638143d482016a18fd2db0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Vale (pinned, checksum-verified)
        # ⚠️ ARCH ASSUMPTION, now explicit. The tarball name and the sha256 above
        # are hardcoded to Linux x86_64. That held implicitly on ubuntu-latest;
        # on the corelink fabric it holds because the box reports X64 / Linux
        # (`uname -m` = x86_64, image inventory 91857115465) — but the runner image
        # is rebuilt without notice, so assert it rather than discover an arm64
        # image via a confusing "Exec format error" three steps later.
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          if [ "$arch" != "x86_64" ]; then
            echo "::error::Vale install is pinned to the Linux x86_64 asset but this runner is ${arch}. Add the matching asset + checksum before re-enabling." >&2
            exit 1
          fi
          TARBALL="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          SHA="$VALE_SHA256_X86_64"
          curl -fsSLo "$RUNNER_TEMP/$TARBALL" \
            "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/${TARBALL}"
          echo "$SHA  $RUNNER_TEMP/$TARBALL" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$TARBALL" -C "$RUNNER_TEMP" vale
          "$RUNNER_TEMP/vale" --version

      - name: Sync Vale packages (Microsoft style)
        run: |
          "$RUNNER_TEMP/vale" --config=apps/docs/.vale.ini sync

      - name: Run Vale (full tree, advisory)
        # _generated/** mirrors .proto comments (REAPI zero-drift gate) —
        # prose edits there are forbidden, so it is not prose-linted.
        run: |
          "$RUNNER_TEMP/vale" --config=apps/docs/.vale.ini --no-exit \
            --glob='!**/_generated/**' --output=line \
            apps/docs/docs apps/docs/blog

  # ===================================================================
  # CI-OPT-002 absorbed jobs (from former standalone workflows)
  # Each reuses the `build` artifact uploaded by the `build` job above.
  # ===================================================================

  # ---- Absorbed from docs-a11y.yml (WI-S18-005 D4) ----
  # Playwright + @axe-core/playwright WCAG 2.2 AA sweep; zero
  # serious/critical violations allowed. Per S-18 §5.6 R-S18-14.
  a11y-playwright:
    name: axe-core WCAG 2.2 AA sweep (0 serious/critical)
    needs: build
    # MOVED OFF HOSTED (2026-08-24). The 2026-08-03 note kept this hosted because
    # `playwright install --with-deps chromium` re-downloads ~150 MB on every run
    # of an ephemeral box, and baking a browser into the shared image (~1 GiB)
    # was rejected — every Rust spawn would pay it. Both facts still hold; what
    # changed is that hosted Actions is blocked at the account level ("The job was
    # not started because recent account payments have failed or your spending
    # limit needs to be increased"), so the choice is no longer 111 billed minutes
    # versus a per-run download — it is a download versus a job that cannot start.
    # `admin-ui-e2e.yml` already runs this exact install on `corelink`, so the box
    # has the sudo `--with-deps` needs; this is the same recipe, not a new one.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pnpm
        # Local composite (offline-first): prefers the runner's pre-installed
        # pnpm to avoid the shared-$HOME race that `pnpm/action-setup` triggers
        # on the single-Mac self-hosted fleet. Mirrors admin-ui-ci/lighthouse-ci.
        uses: ./.github/actions/setup-pnpm
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Download build artifact (reuse from `build` job)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-build
          path: apps/docs/build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run a11y sweep
        run: pnpm exec playwright test --config playwright-a11y.config.ts

      - name: Upload a11y report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-a11y-report
          path: apps/docs/playwright-report/
          retention-days: 14

  # ---- Absorbed from docs-i18n.yml (WI-S18-005 D2) ----
  # i18n coverage ≥ 80 % en → {pt-BR, es-419}. Per S-18 §5.6 R-S18-12.
  i18n-coverage:
    name: i18n coverage (>=80% en -> {pt-BR, es-419})
    # ── Runner: `corelink` fabric (wave 2, 2026-08-03) — see the `build` job above
    # for the full ephemeral-box / queued-spawn note.
    #
    # Measured cost removed: 52 billed minutes of `ubuntu-latest` over 43 runs in
    # the 3 days to 2026-08-03 (median 54 s, p90 67 s, max 271 s).
    #
    # Why it fits: `pnpm i18n-coverage` is `tsx scripts/i18n-coverage.ts` — pure
    # node, no `child_process`, no browser, no python3. node/npm/pnpm are on the
    # box (image inventory 91857115465).
    runs-on: ubuntu-latest
    # Measured median 54 s over 43 hosted runs (p90 67 s; one 271 s outlier).
    # 3x median is under the recipe's 10-minute floor, so it stays at the floor —
    # which also covers the outlier ~2.2x over. Bounds RUNNING time only.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pnpm
        # Local composite (offline-first): prefers the runner's pre-installed
        # pnpm to avoid the shared-$HOME race that `pnpm/action-setup` triggers
        # on the single-Mac self-hosted fleet. Mirrors admin-ui-ci/lighthouse-ci.
        uses: ./.github/actions/setup-pnpm
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        # `cache: pnpm` removed — see the `build` job's Node.js step for the
        # measurement. Short version: the store is pinned to
        # `$HOME/.pnpm-store-$RUNNER_NAME`, which is unique per ephemeral fabric
        # spawn, so a restore can never be read back; and the hosted runs already
        # log `pnpm cache is not found` + `reused 0`. Node 20 stays pinned.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run i18n coverage script
        working-directory: apps/docs
        run: pnpm i18n-coverage --threshold 0.8

  # ---- Absorbed from docs-reapi-gen.yml (CTRL-DOC-AUTO-GEN) ----
  # Zero-drift gate between .proto vendored copies and generated MDX.
  # Independent of docs-build artifact (uses pnpm directly per
  # docs-gen-check script).
  reapi-gen-drift:
    name: REAPI .proto -> MDX zero-drift
    # ── Runner: `corelink` fabric (wave 2, 2026-08-03) — see the `build` job above
    # for the full ephemeral-box / queued-spawn note.
    #
    # Measured cost removed: 45 billed minutes of `ubuntu-latest` over 43 runs in
    # the 3 days to 2026-08-03 (median 50 s, p90 55 s, max 67 s).
    #
    # Why it fits: `docs:gen:check` is `tsx scripts/gen-reapi-docs.ts --check` —
    # node, plus one `execSync("diff -r --brief ...")`. No protoc, no python3, no
    # browser. `diff` is Priority: required on the Ubuntu 24.04 base this image is
    # built from; and if it were ever absent, `checkDrift()` catches the execSync
    # throw and FAILS the gate loudly — it cannot degrade into a false pass.
    runs-on: ubuntu-latest
    # Measured median 50 s over 43 hosted runs (max 67 s). 3x median is under the
    # recipe's 10-minute floor, so it stays at the floor. Bounds RUNNING time only.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Local composite (offline-first) — see note on the `build` job's pnpm step.
      - uses: ./.github/actions/setup-pnpm
        with:
          version: ${{ env.PNPM_VERSION }}

      # `cache: pnpm` removed — see the `build` job's Node.js step for the
      # measurement. Short version: the store is pinned to
      # `$HOME/.pnpm-store-$RUNNER_NAME`, which is unique per ephemeral fabric
      # spawn, so a restore can never be read back; and the hosted runs already
      # log `pnpm cache is not found` + `reused 0`. Node 20 stays pinned.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install docs deps
        run: pnpm install --filter @corelink/docs --frozen-lockfile=false

      # The hosted Ubuntu image does not include the shell/hash tools exercised
      # by the cross-platform raw-curl fixtures.
      - name: Install REAPI fixture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends b3sum zsh

      - name: Typecheck
        run: pnpm --filter @corelink/docs typecheck

      - name: Tests
        run: pnpm --filter @corelink/docs test

      - name: Verify zero drift between .proto and generated MDX
        run: pnpm --filter @corelink/docs docs:gen:check

      - name: Auto-PR on drift (informational)
        if: failure() && github.event_name == 'push'
        run: |
          echo "::warning::REAPI reference is out of date — run pnpm --filter @corelink/docs docs:gen and commit."
