name: docs CI

# WI-S18-001 + CI-OPT-002 consolidation — typecheck + lint + test + build +
# Lighthouse-CI + axe + lychee broken-link + Vale prose lint + Playwright
# a11y sweep (WCAG 2.2 AA) + axe-core/cli baseline diff + i18n coverage +
# REAPI auto-gen drift check for apps/docs/ (Docusaurus 3).
#
# All actions are SHA-pinned per S-12 supply-chain policy.
#
# Trigger surface expanded by CI-OPT-002 to absorb formerly-standalone
# workflows: includes proto paths (for REAPI drift) and a schedule trigger
# (for nightly Lighthouse baseline). Standalone `docs-a11y.yml`,
# `docs-a11y-baseline.yml`, `docs-i18n.yml`, `docs-lighthouse.yml`, and
# `docs-reapi-gen.yml` have been deleted; their jobs are absorbed below
# and share the single `build` artifact (saves ~25 billable-min/PR).

on:
  pull_request:
    paths:
      - "apps/docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/docs-ci.yml"
      # REAPI drift surface (absorbed from docs-reapi-gen.yml per CI-OPT-002):
      - "crates/corelink-reapi/proto/**"
      - "apps/server/proto/**"
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/docs-ci.yml"
      - "crates/corelink-reapi/proto/**"
      - "apps/server/proto/**"
  schedule:
    # Nightly Lighthouse baseline at 08:00 UTC (absorbed from docs-lighthouse.yml).
    # Tag-trigger surface from old docs-lighthouse.yml (docs-v*, v*) is
    # deferred: PR-time `lighthouse` job covers every PR; nightly
    # `lighthouse-baseline` covers regression detection. Add a tag-time
    # lighthouse job in a follow-up if release verification becomes a hard
    # requirement.
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "10.32.1"
  NODE_VERSION: "20"

jobs:
  build:
    name: typecheck + lint + test + build
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up pnpm
        # Local composite (offline-first): prefers the runner's pre-installed
        # pnpm to avoid the shared-$HOME race that `pnpm/action-setup` triggers
        # on the single-Mac self-hosted fleet. Mirrors admin-ui-ci/lighthouse-ci.
        uses: ./.github/actions/setup-pnpm
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Bundle size assertion (≤ 250 KB main bundle)
        run: |
          # R-S18-X — main bundle ≤ 250 KB budget (S-18 perf target).
          # Docusaurus emits the runtime/main chunk under build/assets/js/main.*.js.
          main_file=$(find build/assets/js -maxdepth 1 -name "main.*.js" | head -1 || true)
          if [ -z "$main_file" ]; then
            # Fallback: largest single JS asset (Docusaurus chunk naming can vary).
            main_file=$(find build/assets/js -maxdepth 1 -name "*.js" -print0 \
              | xargs -0 du -k 2>/dev/null | sort -nr | head -1 | awk '{print $2}')
          fi
          if [ -z "$main_file" ] || [ ! -f "$main_file" ]; then
            echo "::error::Bundle-size assertion could not locate main bundle under build/assets/js"
            ls -lah build/assets/js || true
            exit 1
          fi
          main_kb=$(du -k "$main_file" | awk '{print $1}')
          echo "Main bundle: $main_file = ${main_kb} KB (budget: 250 KB)"
          if [ "$main_kb" -gt 250 ]; then
            echo "::error::Main bundle ${main_kb} KB exceeds 250 KB budget (R-S18-X)"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-build
          path: apps/docs/build
          retention-days: 7
          if-no-files-found: error

  lighthouse:
    name: lighthouse-ci (Perf ≥ 95, A11y = 100, BP ≥ 95, SEO ≥ 90)
    needs: build
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-build
          path: apps/docs/build

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Lighthouse CI + http-server
        run: npm install --global @lhci/cli@0.14.0 http-server@14.1.1

      - name: Serve static site (background)
        working-directory: apps/docs
        run: |
          http-server build -p 4173 -s &
          echo $! > /tmp/http-server.pid
          # Wait until the server responds (max 30s).
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/ > /dev/null; then
              echo "http-server ready"; break
            fi
            sleep 1
          done

      - name: Run Lighthouse CI
        working-directory: apps/docs
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
        run: |
          lhci autorun \
            --collect.url=http://127.0.0.1:4173/ \
            --collect.url=http://127.0.0.1:4173/tutorial/ \
            --collect.url=http://127.0.0.1:4173/how-to/ \
            --collect.url=http://127.0.0.1:4173/reference/ \
            --collect.url=http://127.0.0.1:4173/explanation/architecture \
            --collect.numberOfRuns=1 \
            --upload.target=temporary-public-storage \
            --assert.assertions.categories:performance="[\"error\", {\"minScore\": 0.95}]" \
            --assert.assertions.categories:accessibility="[\"error\", {\"minScore\": 1.0}]" \
            --assert.assertions.categories:best-practices="[\"error\", {\"minScore\": 0.95}]" \
            --assert.assertions.categories:seo="[\"error\", {\"minScore\": 0.90}]" \
            || echo "::warning::Lighthouse-CI assertions failed (foundation budget; tightened by WI-S18-005)"

      - name: Stop http-server
        if: always()
        run: |
          if [ -f /tmp/http-server.pid ]; then
            kill "$(cat /tmp/http-server.pid)" || true
          fi

  axe:
    name: axe-core a11y scan (WCAG 2.2 AA)
    needs: build
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-build
          path: apps/docs/build

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install axe-core CLI + http-server
        run: npm install --global @axe-core/cli@4.10.1 http-server@14.1.1

      - name: Serve static site (background)
        working-directory: apps/docs
        run: |
          http-server build -p 4174 -s &
          echo $! > /tmp/http-server-axe.pid
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4174/ > /dev/null; then break; fi
            sleep 1
          done

      - name: Run axe-core
        run: |
          axe http://127.0.0.1:4174/ \
              http://127.0.0.1:4174/tutorial/ \
              http://127.0.0.1:4174/reference/ \
              --tags wcag2a,wcag2aa,wcag22aa \
              --exit \
            || echo "::warning::axe-core found violations (foundation budget; tightened by WI-S18-005)"

      - name: Stop http-server
        if: always()
        run: |
          if [ -f /tmp/http-server-axe.pid ]; then
            kill "$(cat /tmp/http-server-axe.pid)" || true
          fi

  broken-links:
    name: lychee broken-link check
    needs: build
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-build
          path: apps/docs/build

      - name: Run lychee
        uses: lycheeverse/lychee-action@2b973e86b5a8a3ac0cbcdd4358ce28ed8c52b1a2 # v2.6.1
        with:
          args: --config apps/docs/lychee.toml --no-progress 'apps/docs/build/**/*.html'
          fail: false
          jobSummary: true

  vale:
    name: Vale prose lint
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run Vale
        uses: errata-ai/vale-action@d89dee975228ae261d22c15adcd03578634d429c # v2.1.1
        with:
          version: 3.9.1
          files: apps/docs/docs
          fail_on_error: false
          reporter: github-pr-check
          vale_flags: "--config=apps/docs/.vale.ini --no-exit"

  # ===================================================================
  # CI-OPT-002 absorbed jobs (from former standalone workflows)
  # Each reuses the `build` artifact uploaded by the `build` job above.
  # ===================================================================

  # ---- Absorbed from docs-a11y.yml (WI-S18-005 D4) ----
  # Playwright + @axe-core/playwright WCAG 2.2 AA sweep; zero
  # serious/critical violations allowed. Per S-18 §5.6 R-S18-14.
  a11y-playwright:
    name: axe-core WCAG 2.2 AA sweep (0 serious/critical)
    needs: build
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up pnpm
        # Local composite (offline-first): prefers the runner's pre-installed
        # pnpm to avoid the shared-$HOME race that `pnpm/action-setup` triggers
        # on the single-Mac self-hosted fleet. Mirrors admin-ui-ci/lighthouse-ci.
        uses: ./.github/actions/setup-pnpm
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Download build artifact (reuse from `build` job)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-build
          path: apps/docs/build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run a11y sweep
        run: pnpm exec playwright test --config playwright-a11y.config.ts

      - name: Upload a11y report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-a11y-report
          path: apps/docs/playwright-report/
          retention-days: 14

  # ---- Absorbed from docs-a11y-baseline.yml (WT-R4-1 Goal C) ----
  # @axe-core/cli diff-vs-baseline regression check. Fails on NEW
  # CRITICAL violations vs A11Y-BASELINE-2026-05-14.json.
  a11y-baseline-diff:
    name: axe-core/cli diff vs A11Y-BASELINE
    needs: build
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up pnpm
        # Local composite (offline-first): prefers the runner's pre-installed
        # pnpm to avoid the shared-$HOME race that `pnpm/action-setup` triggers
        # on the single-Mac self-hosted fleet. Mirrors admin-ui-ci/lighthouse-ci.
        uses: ./.github/actions/setup-pnpm
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (workspace root)
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Download build artifact (reuse from `build` job)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-build
          path: apps/docs/build

      - name: Locate system Chrome for axe-core/cli
        # The self-hosted Mac fleet ships Google Chrome pre-installed, so the
        # old `apt-get install chromium-browser` (Linux-only; hard-fails on
        # macOS) is unnecessary. @axe-core/cli drives Chrome via the bundled
        # chromedriver, which honours $CHROME_PATH; point it at the system app
        # and fail loudly (not silently) if Chrome is somehow absent.
        run: |
          set -euo pipefail
          chrome="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          if [ ! -x "$chrome" ]; then
            chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          fi
          if [ -z "$chrome" ] || [ ! -x "$chrome" ]; then
            echo "::error::No system Chrome found for @axe-core/cli on the self-hosted Mac fleet (expected /Applications/Google Chrome.app)." >&2
            exit 1
          fi
          echo "Using system Chrome: $chrome"
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"

      - name: Serve built site (background)
        run: |
          pnpm serve --port 3000 --no-open > /tmp/docs-serve.log 2>&1 &
          echo $! > /tmp/docs-serve.pid
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null --max-time 2 http://localhost:3000/; then
              echo "docs server up"
              exit 0
            fi
            sleep 2
          done
          echo "docs server failed to come up" >&2
          tail -50 /tmp/docs-serve.log >&2 || true
          exit 1

      - name: Run a11y baseline diff
        env:
          DOCS_BASE_URL: http://localhost:3000
        run: bash scripts/a11y-audit.sh --against=baseline

      - name: Stop docs server
        if: always()
        run: |
          if [[ -f /tmp/docs-serve.pid ]]; then
            kill "$(cat /tmp/docs-serve.pid)" || true
          fi

      - name: Upload a11y reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-a11y-baseline-report
          path: apps/docs/dist/a11y/
          retention-days: 14

  # ---- Absorbed from docs-i18n.yml (WI-S18-005 D2) ----
  # i18n coverage ≥ 80 % en → {pt-BR, es-419}. Per S-18 §5.6 R-S18-12.
  i18n-coverage:
    name: i18n coverage (>=80% en -> {pt-BR, es-419})
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up pnpm
        # Local composite (offline-first): prefers the runner's pre-installed
        # pnpm to avoid the shared-$HOME race that `pnpm/action-setup` triggers
        # on the single-Mac self-hosted fleet. Mirrors admin-ui-ci/lighthouse-ci.
        uses: ./.github/actions/setup-pnpm
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run i18n coverage script
        working-directory: apps/docs
        run: pnpm i18n-coverage --threshold 0.8

  # ---- Absorbed from docs-reapi-gen.yml (CTRL-DOC-AUTO-GEN) ----
  # Zero-drift gate between .proto vendored copies and generated MDX.
  # Independent of docs-build artifact (uses pnpm directly per
  # docs-gen-check script).
  reapi-gen-drift:
    name: REAPI .proto -> MDX zero-drift
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Local composite (offline-first) — see note on the `build` job's pnpm step.
      - uses: ./.github/actions/setup-pnpm
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install docs deps
        run: pnpm install --filter @corelink/docs --frozen-lockfile=false

      - name: Typecheck
        run: pnpm --filter @corelink/docs typecheck

      - name: Tests
        run: pnpm --filter @corelink/docs test

      - name: Verify zero drift between .proto and generated MDX
        run: pnpm --filter @corelink/docs docs:gen:check

      - name: Auto-PR on drift (informational)
        if: failure() && github.event_name == 'push'
        run: |
          echo "::warning::REAPI reference is out of date — run pnpm --filter @corelink/docs docs:gen and commit."

  # ---- Absorbed from docs-lighthouse.yml (WI-S18-005 D6) ----
  # Lighthouse baseline (lighthouserc.cjs) — perf >= 95, a11y = 100,
  # best-practices >= 95, SEO >= 90. Runs on schedule + workflow_dispatch
  # only (PR-time lighthouse runs in the `lighthouse` job above with
  # inline assertions; baseline runs the curated lighthouserc.cjs).
  lighthouse-baseline:
    name: lighthouse-ci baseline (lighthouserc.cjs)
    needs: build
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up pnpm
        # Local composite (offline-first): prefers the runner's pre-installed
        # pnpm to avoid the shared-$HOME race that `pnpm/action-setup` triggers
        # on the single-Mac self-hosted fleet. Mirrors admin-ui-ci/lighthouse-ci.
        uses: ./.github/actions/setup-pnpm
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Download build artifact (reuse from `build` job)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-build
          path: apps/docs/build

      - name: Run Lighthouse CI (lighthouserc.cjs baseline)
        run: pnpm exec lhci autorun --config=lighthouserc.cjs

      - name: Upload LHCI report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-lhci-report
          path: apps/docs/.lighthouseci/
          retention-days: 14
