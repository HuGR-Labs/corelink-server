# Welcome bot for first-time contributors.
# -----------------------------------------------------------------------------
# Greets new contributors on their first issue/PR with pointers to:
#  - CONTRIBUTING.md (build + test + lint expectations)
#  - .github/PULL_REQUEST_TEMPLATE.md (author checklist)
#  - SECURITY.md (NEVER file security via public issue)
#  - DCO / signed-off-by reminder (we require `git commit -s`)
#
# Native `gh` implementation (no container action). The previous
# `actions/first-interaction` is a Docker container action — Linux-only —
# which HARD-FAILS on the macOS self-hosted fleet ("Container action is only
# supported on Linux"). We reproduce the same "first issue / first PR" greeting
# by counting the author's prior items via the GitHub search API and posting
# with `gh`, so it runs on any runner. (2026-06-02)
#
# `pull_request_target` is intentional: a first-time contributor's PR comes from
# a fork, and only `pull_request_target` grants the write-scoped token needed to
# comment. We never check out or run the PR's code here — this job only reads the
# event metadata and posts a comment, so the elevated token is safe.
#
# Cross-link: CONTRIBUTING.md, SECURITY.md, .github/PULL_REQUEST_TEMPLATE.md.

name: Welcome First-Time Contributor

on:
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: welcome-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  welcome:
    name: Post welcome comment
    runs-on: [self-hosted, mac, corelink-builder]
    steps:
      - name: Greet first-time contributor
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          # `issues` events expose .issue; `pull_request_target` exposes
          # .pull_request — exactly one of each pair is non-empty per run.
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          AUTHOR: ${{ github.event.issue.user.login || github.event.pull_request.user.login }}
          # Greeting bodies as block scalars so YAML strips the indentation and
          # the posted Markdown is flush-left (10-space-indented text would
          # otherwise render as a code block). The leading marker makes the
          # post idempotent. Mirrors the old action's issue-message / pr-message.
          ISSUE_MESSAGE: |
            <!-- welcome-first-timer -->
            Thanks for opening your first issue on **CoreLink**! A maintainer
            will triage shortly.

            A few quick pointers:

            - **Bug?** Please make sure you used the *Bug Report* template
              (`.github/ISSUE_TEMPLATE/bug_report.yml`) — it asks for the
              `audit_id` and environment that maintainers need to reproduce.
            - **Feature request?** Use the *Feature Request* template — the
              "problem / alternatives" framing makes triage 10x faster.
            - **Security finding?** Please DO NOT post details in a public
              issue. See `SECURITY.md` and email `security@humangr.com` (or
              use the GitHub *Report a vulnerability* private advisory flow).

            Welcome aboard!
          PR_MESSAGE: |
            <!-- welcome-first-timer -->
            Welcome — and thank you for your first pull request to
            **CoreLink**! Here is what reviewers will look for:

            1. **Read `CONTRIBUTING.md`** for build + test + lint expectations
               (`cargo build --workspace`, `cargo clippy --workspace --tests
               -- -D warnings`, `cargo test --workspace`). CI runs all three.
            2. **Walk the PR template** (`.github/PULL_REQUEST_TEMPLATE.md`) —
               every Author Pre-PR Checklist row should be ticked before
               review.
            3. **Sign every commit.** We require [DCO](https://developercertificate.org/)
               sign-off. Use `git commit -s` (or amend with `git commit
               --amend -s` if you forgot). The CI DCO check will block merge
               otherwise.
            4. **Security-sensitive change?** Do not include exploitation
               details in this public PR. Coordinate with `security@humangr.com`
               first — see `SECURITY.md`.
            5. **Be patient.** CoreLink ships under a strict GA-Gate process;
               maintainer review can take a few business days, especially for
               BYOK / audit-chain / billing surfaces.

            A maintainer (auto-assigned via `CODEOWNERS`) will be in touch.
            Thank you for contributing!
        run: |
          set -euo pipefail

          # `pr` for pull_request_target, `issue` otherwise. The search API
          # `type:` filter and the `gh ... comment` subcommand both key off this.
          if [ "$EVENT" = "pull_request_target" ]; then
            KIND="pr"; BODY="$PR_MESSAGE"
          else
            KIND="issue"; BODY="$ISSUE_MESSAGE"
          fi
          echo "event=$EVENT kind=$KIND author=$AUTHOR #$NUMBER repo=$REPO"

          # Bots never get the welcome (mirror first-interaction, which only
          # fires for human first-timers and would otherwise greet dependabot).
          case "$AUTHOR" in
            *"[bot]" | dependabot | dependabot-preview | github-actions)
              echo "author is a bot — skipping"
              exit 0
              ;;
          esac

          # First-timer test: count this author's items of this KIND in the repo.
          # `actions/first-interaction` greets the FIRST pr and FIRST issue
          # independently, so we filter by type. total_count<=1 means the only
          # such item is the one that just triggered us → first-timer.
          # `-X GET -f q=` sends a properly URL-encoded search query string.
          COUNT="$(gh api -X GET search/issues \
                     -f q="repo:${REPO} type:${KIND} author:${AUTHOR}" \
                     --jq '.total_count')"
          echo "prior ${KIND}s by ${AUTHOR} (incl. this one): ${COUNT}"
          if [ "${COUNT:-0}" -gt 1 ]; then
            echo "not a first-time ${KIND} — skipping"
            exit 0
          fi

          # Idempotency guard: never double-post if the workflow re-runs (search
          # indexing lag could momentarily report total_count<=1 again).
          MARKER="<!-- welcome-first-timer -->"
          if gh "$KIND" view "$NUMBER" --repo "$REPO" --json comments \
               --jq '.comments[].body' 2>/dev/null | grep -qF "$MARKER"; then
            echo "welcome already posted — skipping"
            exit 0
          fi

          gh "$KIND" comment "$NUMBER" --repo "$REPO" --body "$BODY"
          echo "posted welcome ${KIND} comment on #${NUMBER}"
