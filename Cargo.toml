    # default; live `STRIPE_SECRET_KEY_TEST`-gated tests behind `--ignored`.
    "tests/e2e-signup-flow",
    # OpenAPI 3.1 contract for the customer / privacy / admin REST surface.
    # Hand-authored YAML + embedded constants; spec_roundtrip integration test
    # gates drift between the YAML, the generated JSON sibling, and the path
    # constants exported by this crate.
    "crates/corelink-openapi",
    # R-prep handler-crate skeletons (CAS / AC / Admin). Each crate ships the
    # typed handler-surface trait + InMemoryFake + per-handler SliObserver
    # integration emitting canonical Sli observations + audit-fail-CLOSED
    # ordering envelope. Closes the handler-layer SLO emit gap from
    # specs/_audits/2026-05-14-slo-instrumentation-gaps.md §6. Real
    # wasm32 CF-Worker impls deferred per autonomous-execution charter
    # trait-abstraction-defer.
    "crates/corelink-handler-cas",
    "crates/corelink-handler-ac",
    "crates/corelink-handler-admin",
    # R3-2 BYOK CMK revoke → kill switch → audit E2E harness (WI-S14-006).
    # In-memory `KmsProvider` per provider kind + `RevocationDetector` cycle +
    # `MultiChannelAlerter` stub-mode by default; `AWS_TEST_KEY_ARN` /
    # `GCP_TEST_KEY_RESOURCE` / `AZURE_TEST_KEY_RESOURCE` /
    # `VAULT_TEST_KEY_NAME` env-gated `#[ignore]` live-provider tests.
    "tests/e2e-byok-revoke",
    # R3-3 end-to-end DSR rights harness: access / portability / rectification /
    # erasure / restriction / objection submit → MFA stub → JWT receipt → status
    # poll → 12-backend erasure worker → 24h verification + signed report. Six
    # happy DSR rights + five adversarial paths + 500-case property test. All
    # in-memory fakes; no network IO under default `cargo test -p e2e-dsr`.
    "tests/e2e-dsr",
    # R3-4 end-to-end chaos drill harness: 8 canonical chaos experiments ×
    # steady-state hypothesis + rollback ≤ 5 min + audit lifecycle +
    # `corelink_chaos_slo_violation_total` recording; 3 adversarial
    # cross-WI invariants (OPS-EXCLUSIVITY / SEV1-DRILL-PAUSE /
    # CHAOS-STAGING-ONLY); 200-case property test on deterministic seed
    # replay (FNV-1a bit-identical). In-memory fakes; no network IO.
    "tests/e2e-chaos",
    # R3-6 end-to-end resilience harness: rate-limit burst + token-bucket
    # refill + 3-state circuit breaker (multi-signal trip + hysteresis +
    # HalfOpen 10% probe) + back-pressure queue + audit fail-CLOSED.
    # Composes corelink-ratelimit (camada 1) + corelink-rate-headers
    # (camada 0) under a logical clock; no real network.
    "tests/e2e-resilience",
    # R3-5 end-to-end billing-flow harness: signup → tier_select(Starter)
    # → Stripe Checkout → subscription activation → cancel-while-active
    # → refund webhook → DSR-erasure-while-subscribed gate. In-memory
    # fakes wire every collaborator (corelink-signup +
    # corelink-tier-selection + corelink-billing-stripe + corelink-dsr)
    # so the full customer billing journey runs without network IO.
    "tests/e2e-billing-flow",
    # R3-8 end-to-end tenant isolation adversarial harness: 12 scenarios
    # spanning CAS read/write cross-tenant, list enumeration, BYOK AAD
    # tamper, audit cross-tenant query, D1 row spoofing, idempotency
    # collision, quota / rate-limit crosstalk, Stripe webhook replay,
    # PAT cross-tenant. Exercises real `corelink-tenant-path`,
    # `corelink-byok`, and `corelink-audit` primitives behind in-memory
    # fakes for CAS / D1 / quota / ratelimit / Stripe / PAT. Every
    # rejection asserts an audit event was emitted BEFORE the reject
    # (fail-CLOSED ordering, INV-TENANT-ISOLATION layer 6).
    "tests/e2e-tenant-isolation",
    # DR-16 end-to-end active-failover harness: 5 canonical scenarios
    # pinning the warm-failover lifecycle (primary-up, primary-degraded,
    # split-brain prevention, failback after recovery, partial-region).
    # Drives `corelink-failover-router::InMemoryFailoverRouter` under a
    # deterministic logical clock + write-lease ledger so split-brain
    # absence is provable. Companion to RB-ACTIVE-FAILOVER + DR-16.
    "tests/e2e-failover-router",
    # R-prep survey infra (NPS / CSAT / free-text / multi-choice).
    # HMAC-SHA256-signed one-shot invite tokens + TTL + audit-fail-CLOSED
    # record path + in-memory fake. Anti-abuse runbook RB-SURVEY-ABUSE +
    # additive migration 0046_survey_responses + analyst protocol live
    # under marketing/retention/customer-health/.
    "crates/corelink-survey",
]
exclude = [
