    # json_deserialize / auth_resolution / secret_redaction_check).
    "crates/corelink-cli/fuzz",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Async trait support
async-trait = "0.1"
# Concurrent maps
dashmap = "6"

# gRPC stack
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"

# HTTP server stack (R2-12: Stripe webhook route in apps/server)
# axum 0.7 + tower + http 1.x align with tonic 0.12 (hyper 1 underneath).
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "json"] }
tower = { version = "0.5", default-features = false }
http = "1"
http-body-util = "0.1"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# WI-S15-004 FFI wrappers
# PyO3: Python extension module (Python 3.10+ ABI3).
# R1-9: bumped 0.22 → 0.24.1 to close RUSTSEC-2025-0020 (PyString::from_object
# buffer overflow). 0.22→0.24 introduced `Py::extract_bound` and a deprecation
# of `PyBytes::new_bound` (renamed to `PyBytes::new`); see corelink-py call
# sites for migration shims.
pyo3 = { version = "0.24.1", features = ["abi3-py310"] }
# wasm-bindgen: Rust → WASM JS bridge
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
serde-wasm-bindgen = "0.6"

# BYOK (S-14)
aes-gcm = { version = "0.10", features = ["aes"] }
getrandom = "0.2"
# `lru` 0.14+ ships the IterMut soundness fix (RUSTSEC-2026-0002). Bumped to
# 0.18 (latest) per R1-9 emergency dep update; CoreLink's only consumer is
# `corelink-byok::dek_cache` which uses get/put/pop/iter/new — all stable
# across the 0.12→0.18 major-version progression.
lru = "0.18"
# AWS SDK — requires Rust ≥ 1.91.1 per MSRV; workspace is pegged to 1.80 as floor.
# The actual CI toolchain (1.88+) compiles these correctly.
# `cargo check -p corelink-byok-aws --ignore-rust-version` is required until
# the workspace rust-version floor is bumped (tracked as infra debt post-S-14).
#
# R1-9: `default-features = false` + explicit `rustls-aws-lc-runtime` excludes
# the `tls-rustls` legacy feature path (hyper 0.14 + rustls 0.21 +
# rustls-webpki 0.101.7 vulnerable to RUSTSEC-2026-0098/0099/0104). The
# modern `rustls-aws-lc` runtime pulls rustls 0.23 + rustls-webpki 0.103.
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "credentials-process", "sso", "default-https-client"] }
aws-sdk-kms = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }

# Crypto / encoding (S-01 foundation)
hmac = "0.12"
sha2 = "0.10"
blake3 = { version = "1", features = ["traits-preview"] }
base64 = "0.22"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
subtle = "2"
zeroize = { version = "1.8", features = ["derive"] }
hkdf = "0.12"
bytes = "1"
# Ed25519 (FIPS 186-5 EdDSA) — erasure attestation signing (WI-S14-007)
ed25519-dalek = { version = "2", features = ["rand_core"] }

# Internal crates
corelink-tenant-path = { path = "crates/tenant-path" }
corelink-hash = { path = "crates/corelink-hash" }
corelink-worker = { path = "crates/corelink-worker" }
corelink-meta = { path = "crates/corelink-meta" }
corelink-reapi = { path = "crates/corelink-reapi" }
corelink-client-verify = { path = "crates/corelink-client-verify" }
# default-features = false here so that per-crate overrides can choose
# whether to enable `jwt-adapter` (which pulls ring, incompatible with
# wasm32-unknown-unknown without emscripten). All native crates should
# explicitly add `features = ["jwt-adapter"]` or rely on the re-export.
# `corelink-clerk-cf` omits that feature to stay wasm32-clean.
corelink-clerk = { path = "crates/corelink-clerk", default-features = false }
corelink-pat = { path = "crates/corelink-pat" }
corelink-auth-schema = { path = "crates/corelink-auth-schema" }
corelink-webauthn = { path = "crates/corelink-webauthn" }
