[workspace]
resolver = "2"
members = [
    "apps/server",
    "crates/tenant-path",
    "crates/corelink-hash",
    "crates/corelink-worker",
    "crates/corelink-meta",
    "crates/corelink-reapi",
    "crates/corelink-client-verify",
    "crates/corelink-clerk",
]
exclude = [
    "crates/tenant-path/fuzz",
    "crates/corelink-hash/fuzz",
    "crates/corelink-worker/fuzz",
    "crates/corelink-meta/fuzz",
    "crates/corelink-reapi/fuzz",
    "crates/corelink-client-verify/fuzz",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# gRPC stack
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto / encoding (S-01 foundation)
hmac = "0.12"
sha2 = "0.10"
blake3 = { version = "1", features = ["traits-preview"] }
base64 = "0.22"
hex = "0.4"
uuid = { version = "1" }
subtle = "2"
zeroize = { version = "1.8", features = ["derive"] }
bytes = "1"

# Internal crates
corelink-tenant-path = { path = "crates/tenant-path" }
corelink-hash = { path = "crates/corelink-hash" }
corelink-worker = { path = "crates/corelink-worker" }
corelink-meta = { path = "crates/corelink-meta" }
corelink-reapi = { path = "crates/corelink-reapi" }
corelink-client-verify = { path = "crates/corelink-client-verify" }
corelink-clerk = { path = "crates/corelink-clerk" }

# Test / bench
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
# Build otimizado pra Cloudflare Containers
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3

[profile.dev]
opt-level = 0
debug = true
