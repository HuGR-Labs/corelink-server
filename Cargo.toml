    "crates/corelink-chaos-scheduler",
    # WI-S17-003 runbook dry-run tracker (PAT-RUNBOOK-DRILL-001 + FM-202)
    "crates/corelink-runbook-tracker",
    # WI-S17-005 oncall scheduler + fatigue tracking + PagerDuty integration trait
    "crates/corelink-oncall",
    # WI-S19-002 DPA click-through 6-field consent + RS256 JWT receipt + 3 locales
    "crates/corelink-dpa-acceptance",
    # WI-S19-001 signup orchestration backend + atomic D1 provisioning + chaos Stripe outage
    "crates/corelink-signup",
    # WI-S19-003 DPA versioning + 30d grace + read-only degrade middleware
    "crates/corelink-dpa-versioning",
    # WI-S19-004 tier selection + Stripe Checkout + INV-ONBOARD-DPA-FIRST D1 lock
    "crates/corelink-tier-selection",
    # WI-S19-005 enterprise inquiry form + Slack/CRM atomic outbox + 24h auto-reply SLA
    "crates/corelink-enterprise-inquiry",
    # WI-S20-004 lighthouse customer state machine tracker (3 customers — 2 team
    # + 1 enterprise BYOK — across recruiting → engaged → migrating → observing
    # → attested → case-study-signed; 30d observation window canonical;
    # GA Evidence Gate D+60 check)
    "crates/corelink-lighthouse-tracker",
    # WI-S20-006 synthetic page weekly drill — 3-region 24/7 follow-the-sun + MTTA budget
    "crates/corelink-synthetic-pager",
    # R2-1 real HTTPS Stripe client implementing corelink-tier-selection::StripeClient
    # (Checkout / Subscriptions / Customers / Billing Portal + webhook HMAC-SHA256 verify
    # + idempotent POST retries with exponential backoff + Retry-After). Native-only
    # (wasm32 gated out — production callers run from apps/server, not CF Worker).
    "crates/corelink-stripe-real",
    # R2-4 shared Slack incoming-webhook real client (Block Kit + per-channel
    # routing + retry + audit envelope; bridges to enterprise-inquiry via adapter)
    "crates/corelink-slack-real",
    # R2-13 D1 migration replay harness (rusqlite-backed; CI gate that every
    # migrations/d1/*.sql applies cleanly in numeric order against a fresh
    # in-memory SQLite. Catches ordering bugs + schema dependency hazards.)
    "crates/corelink-d1-migrations",
    # R2-10 CF Worker binding adapters (R2 / D1 / KV / DO) implementing the
    # trait surfaces from corelink-worker. wasm32-unknown-unknown ONLY —
    # the crate root carries `#![cfg(target_arch = "wasm32")]` so native
    # `cargo build --workspace` produces an empty rlib.
    "crates/corelink-cf-bindings",
    # R5-prep SOC 2 Drata evidence collection pipeline: pulls evidence from
    # audit_outbox / tenants RBAC / PAT issuance / GH PR-merge / PD incident
    # timeline / pentest findings → POSTs to Drata REST API with Bearer auth,
    # SHA-256 idempotency dedup, retry, fail-CLOSED audit emit.
    "crates/corelink-drata-sync",
    # R3-1 end-to-end signup happy-path harness: signup → DPA → tier → Stripe
    # Checkout → first PAT → R2 CAS write + BLAKE3 verify. In-memory fakes by
    # default; live `STRIPE_SECRET_KEY_TEST`-gated tests behind `--ignored`.
    "tests/e2e-signup-flow",
]
exclude = [
    "crates/tenant-path/fuzz",
    "crates/corelink-hash/fuzz",
    "crates/corelink-worker/fuzz",
    "crates/corelink-meta/fuzz",
    "crates/corelink-reapi/fuzz",
    "crates/corelink-client-verify/fuzz",
