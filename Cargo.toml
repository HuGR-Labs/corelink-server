corelink-stripe-real = { path = "crates/corelink-stripe-real" }
corelink-drata-sync = { path = "crates/corelink-drata-sync" }
corelink-openapi = { path = "crates/corelink-openapi" }
# R-prep handler-crate skeletons (CAS / AC / Admin).
corelink-handler-cas = { path = "crates/corelink-handler-cas" }
corelink-handler-ac = { path = "crates/corelink-handler-ac" }
corelink-handler-admin = { path = "crates/corelink-handler-admin" }

# CLI tooling (WI-S15-001 / WI-S15-005)
toml = "0.8"
dirs = "5"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
corelink-cli = { path = "crates/corelink-cli" }

# Test / bench
proptest = "1.5"
tokio-test = { version = "0.4" }
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
# Build otimizado pra Cloudflare Containers
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3

[profile.dev]
opt-level = 0
debug = true
