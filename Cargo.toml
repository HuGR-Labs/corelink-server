[workspace]
resolver = "2"
members = [
    "apps/server",
    "crates/tenant-path",
    "crates/corelink-hash",
    "crates/corelink-worker",
    "crates/corelink-meta",
    "crates/corelink-reapi",
    "crates/corelink-client-verify",
    "crates/corelink-clerk",
    "crates/corelink-pat",
    "crates/corelink-auth-schema",
    "crates/corelink-webauthn",
    "crates/corelink-audit",
    "crates/corelink-ac-schema",
    "crates/corelink-ac",
    "crates/corelink-chunker",
    "crates/corelink-r2-multipart",
    "crates/corelink-multipart-schema",
    "crates/corelink-manifest",
    "crates/corelink-gc",
    "crates/corelink-dedup",
    "crates/corelink-deploy-verifier",
    "crates/corelink-eviction",
    "crates/corelink-quota",
    "crates/corelink-quota-cas",
    "crates/corelink-lru-tracker",
    "crates/corelink-ratelimit",
    "crates/corelink-edge",
    "crates/corelink-abuse",
    "crates/corelink-rate-headers",
    "crates/corelink-analytics",
    "crates/corelink-logpush",
    "crates/corelink-tracing",
    "crates/corelink-audit-chain",
    "crates/corelink-slo",
    "crates/corelink-supply-verify",
    "crates/corelink-canary",
    "crates/corelink-billing-emit",
    "crates/corelink-billing-aggregator",
    "crates/corelink-billing-stripe",
    "crates/corelink-billing-reconcile",
    "crates/corelink-billing-replay",
    "crates/corelink-quota-fsm",
    "crates/corelink-dsr",
    "crates/corelink-privacy-sub-processor-emit",
    "crates/corelink-clerk-cf",
    "crates/corelink-privacy-consent-ledger",
    "crates/corelink-privacy-breach-emit",
    "crates/corelink-privacy-erasure-worker",
    "crates/corelink-privacy-notice-emit",
    "crates/corelink-privacy-pseudonymize",
    "crates/corelink-privacy-residency-enforcement",
    "tools/sbom-publish",
    "crates/corelink-supply-chain-policy",
    "crates/corelink-config-api",
    "crates/corelink-config-do",
    "crates/corelink-dt-cli",
    "crates/corelink-dt-reconcile",
    "crates/corelink-dt-webhook",
    "crates/corelink-dual-approval",
    "crates/corelink-admin-api",
    "crates/corelink-admin-dry-run",
    "crates/corelink-rotation-adapters",
    "crates/corelink-rotation-worker",
    "crates/corelink-terraform-drift-consumer",
    "crates/corelink-rollout-controller",
    # S-14 BYOK (WI-S14-004 trait + WI-S14-005 adapters + matrix test)
    "crates/corelink-byok",
    "crates/corelink-byok-gcp",
    "crates/corelink-byok-azure",
    "crates/corelink-byok-vault",
    "crates/corelink-byok-matrix-test",
]
exclude = [
    "crates/tenant-path/fuzz",
    "crates/corelink-hash/fuzz",
    "crates/corelink-worker/fuzz",
    "crates/corelink-meta/fuzz",
    "crates/corelink-reapi/fuzz",
    "crates/corelink-client-verify/fuzz",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# gRPC stack
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto / encoding (S-01 foundation)
hmac = "0.12"
sha2 = "0.10"
blake3 = { version = "1", features = ["traits-preview"] }
base64 = "0.22"
hex = "0.4"
uuid = { version = "1" }
subtle = "2"
zeroize = { version = "1.8", features = ["derive"] }
hkdf = "0.12"
bytes = "1"

# Internal crates
corelink-tenant-path = { path = "crates/tenant-path" }
corelink-hash = { path = "crates/corelink-hash" }
corelink-worker = { path = "crates/corelink-worker" }
corelink-meta = { path = "crates/corelink-meta" }
corelink-reapi = { path = "crates/corelink-reapi" }
corelink-client-verify = { path = "crates/corelink-client-verify" }
# default-features = false here so that per-crate overrides can choose
# whether to enable `jwt-adapter` (which pulls ring, incompatible with
# wasm32-unknown-unknown without emscripten). All native crates should
# explicitly add `features = ["jwt-adapter"]` or rely on the re-export.
# `corelink-clerk-cf` omits that feature to stay wasm32-clean.
corelink-clerk = { path = "crates/corelink-clerk", default-features = false }
corelink-pat = { path = "crates/corelink-pat" }
corelink-auth-schema = { path = "crates/corelink-auth-schema" }
corelink-webauthn = { path = "crates/corelink-webauthn" }
corelink-audit = { path = "crates/corelink-audit" }
corelink-ac-schema = { path = "crates/corelink-ac-schema" }
corelink-ac = { path = "crates/corelink-ac" }
corelink-chunker = { path = "crates/corelink-chunker" }
corelink-r2-multipart = { path = "crates/corelink-r2-multipart" }
corelink-multipart-schema = { path = "crates/corelink-multipart-schema" }
corelink-manifest = { path = "crates/corelink-manifest" }
corelink-gc = { path = "crates/corelink-gc" }
corelink-dedup = { path = "crates/corelink-dedup" }
corelink-deploy-verifier = { path = "crates/corelink-deploy-verifier" }
corelink-eviction = { path = "crates/corelink-eviction" }
corelink-quota = { path = "crates/corelink-quota" }
corelink-quota-cas = { path = "crates/corelink-quota-cas" }
corelink-lru-tracker = { path = "crates/corelink-lru-tracker" }
corelink-ratelimit = { path = "crates/corelink-ratelimit" }
corelink-edge = { path = "crates/corelink-edge" }
corelink-abuse = { path = "crates/corelink-abuse" }
corelink-rate-headers = { path = "crates/corelink-rate-headers" }
corelink-analytics = { path = "crates/corelink-analytics" }
corelink-logpush = { path = "crates/corelink-logpush" }
corelink-tracing = { path = "crates/corelink-tracing" }
corelink-audit-chain = { path = "crates/corelink-audit-chain" }
corelink-slo = { path = "crates/corelink-slo" }
corelink-supply-verify = { path = "crates/corelink-supply-verify" }
corelink-canary = { path = "crates/corelink-canary" }
corelink-billing-emit = { path = "crates/corelink-billing-emit" }
corelink-billing-aggregator = { path = "crates/corelink-billing-aggregator" }
corelink-billing-stripe = { path = "crates/corelink-billing-stripe" }
corelink-billing-reconcile = { path = "crates/corelink-billing-reconcile" }
corelink-billing-replay = { path = "crates/corelink-billing-replay" }
corelink-quota-fsm = { path = "crates/corelink-quota-fsm" }
corelink-dsr = { path = "crates/corelink-dsr" }
corelink-privacy-sub-processor-emit = { path = "crates/corelink-privacy-sub-processor-emit" }
corelink-clerk-cf = { path = "crates/corelink-clerk-cf" }
corelink-privacy-consent-ledger = { path = "crates/corelink-privacy-consent-ledger" }
corelink-privacy-breach-emit = { path = "crates/corelink-privacy-breach-emit" }
corelink-privacy-erasure-worker = { path = "crates/corelink-privacy-erasure-worker" }
corelink-privacy-notice-emit = { path = "crates/corelink-privacy-notice-emit" }
corelink-privacy-pseudonymize = { path = "crates/corelink-privacy-pseudonymize" }
corelink-privacy-residency-enforcement = { path = "crates/corelink-privacy-residency-enforcement" }
corelink-config-do = { path = "crates/corelink-config-do" }
corelink-config-api = { path = "crates/corelink-config-api" }
corelink-dt-webhook = { path = "crates/corelink-dt-webhook" }
corelink-dt-cli = { path = "crates/corelink-dt-cli" }
corelink-dt-reconcile = { path = "crates/corelink-dt-reconcile" }
corelink-dual-approval = { path = "crates/corelink-dual-approval" }
corelink-admin-api = { path = "crates/corelink-admin-api" }
corelink-admin-dry-run = { path = "crates/corelink-admin-dry-run" }
corelink-rotation-adapters = { path = "crates/corelink-rotation-adapters" }
corelink-rotation-worker = { path = "crates/corelink-rotation-worker" }
corelink-rollout-controller = { path = "crates/corelink-rollout-controller" }
# S-14 BYOK
corelink-byok = { path = "crates/corelink-byok" }
corelink-byok-gcp = { path = "crates/corelink-byok-gcp" }
corelink-byok-azure = { path = "crates/corelink-byok-azure" }
corelink-byok-vault = { path = "crates/corelink-byok-vault" }

# Test / bench
proptest = "1.5"
tokio-test = { version = "0.4" }
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
# Build otimizado pra Cloudflare Containers
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3

[profile.dev]
opt-level = 0
debug = true
