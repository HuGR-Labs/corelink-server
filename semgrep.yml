# CoreLink-specific Semgrep rule pack
# ====================================
#
# Pre-pentest engagement (cutoff 2026-06-15) R-prep wave. These rules
# encode CoreLink charter conventions that the bundled OSS rulepacks do
# not catch. Each rule MUST be cross-referenced to:
#   - A charter / ADR / RUNBOOK line that justifies it.
#   - The remediation guidance in
#     `specs/_runbooks/RB-STATIC-ANALYSIS-TRIAGE.md`.
#
# Naming convention: `corelink.<area>.<short-id>`. The `corelink.` prefix
# is leveraged by `.github/workflows/semgrep.yml` to tally custom-rule
# hits separately from the bundled OSS rulesets.
#
# Suppression policy: a finding may be suppressed only with an inline
# `# nosemgrep: <rule-id>  # reason: <one-line>; ADR-XXXX` comment on
# the offending line. The triage runbook enforces ADR linkage in PR
# review.
#
# ROADMAP-TO-GA.md §7 Wave R-7 (Evidence Gate) — this file is referenced
# by the GA evidence package consumed by PRR-S20-GA.
# SOC2 rollup: CC8.1 (change-management gate).

rules:

  # -----------------------------------------------------------------
  # R1 — Forbid `.unwrap()` in non-test Rust source.
  #
  # Rationale: charter "no panic-on-unwrap" — every fallible op must
  # propagate via `?` or an explicit `match`. Clippy's
  # `clippy::unwrap_used` is set on most crates but historically slips
  # past macro-generated code; Semgrep catches it as a backstop.
  # Test files (`tests/`, `*/tests/*`, `*_test.rs`, `*/src/**/tests.rs`)
  # are exempt — assertions in tests routinely use `.unwrap()` and that
  # is acceptable because a panicked test is a failed test.
  #
  # NOTE on inline `#[cfg(test)] mod tests { ... }` modules: Semgrep's
  # path-based exclusion cannot scope by Rust attribute, so this rule
  # WILL fire on `.unwrap()` inside inline test modules in src/ files.
  # That is intentional and accepted: clippy's `unwrap_used` lint with
  # the `#[allow(clippy::unwrap_used)]` annotation at the test-module
  # boundary already documents the test-only intent (see e.g.
  # `crates/corelink-ac/src/codec.rs:72-79`). For the R-prep baseline
  # the project standard is: any inline test module that needs
  # `.unwrap()` MUST carry `#[cfg(test)] #[allow(clippy::unwrap_used)]`
  # together; the audit baseline §7.b row R1 documents this convention
  # and the cron-time cross-check.
  # `**/bin/**` is excluded — binary setup/startup code is the
  # legitimate runtime layer (CLI arg parsing, env init).
  # -----------------------------------------------------------------
  - id: corelink.rust.no-unwrap-in-src
    message: |
      `.unwrap()` is forbidden in non-test Rust source. Use `?` to
      propagate or `match` with an explicit error arm. If unavoidable,
      annotate with `# nosemgrep: corelink.rust.no-unwrap-in-src  # reason: <...>; ADR-XXXX`.
    severity: ERROR
    languages: [rust]
    pattern: $X.unwrap()
    paths:
      include:
        - "crates/*/src/**/*.rs"
        - "apps/**/src/**/*.rs"
      exclude:
        - "**/tests/**"
        - "**/tests.rs"
        - "**/*_test.rs"
        - "**/test_*.rs"
        - "**/benches/**"
        - "**/examples/**"
        - "**/build.rs"
        - "**/bin/**"

  # -----------------------------------------------------------------
  # R2 — Forbid `tokio::` inside the CF-Workers / WASM target lib crates.
  #
  # Rationale: CoreLink charter §"runtime-agnostic core" — only the
  # crates that target the CF Workers / WASM runtime (V8 isolates, no
  # tokio executor available) must remain tokio-free. The S20 sprint-
  # close review (`specs/_audits/sealed/2026-05-14-s20-sprint-close-review-round1.md`
  # rows 13–14) explicitly lists `corelink-lighthouse-tracker` and
  # `corelink-synthetic-pager` as the charter-bound runtime-agnostic
  # surface; other workspace crates (`corelink-worker`, `corelink-byok-*`,
  # `corelink-r2-multipart`, `corelink-client-verify`) legitimately
  # depend on tokio in their `Cargo.toml` and are runtime-bound by
  # design (audit row 14 reference).
  #
  # The R2 scope is therefore the union of:
  #   - crates flagged runtime-agnostic in audit AUDIT-2026-05-14-S20.
  #   - any future crate that declares `# runtime-agnostic` in its
  #     `Cargo.toml` header (TODO: extend rule when the marker lands).
  # `apps/*` and `**/bin/**` / `**/main.rs` are excluded because the
  # binary layer is the legitimate runtime-selection surface.
  # Tuned 2026-05-15 (R-prep baseline triage): pre-tuning the rule
  # would have fired on 27 legitimate uses (binary entrypoints +
  # tokio-bound lib crates) — see audit baseline §3.3 row R2.
  # -----------------------------------------------------------------
  - id: corelink.rust.no-tokio-in-lib-crates
    message: |
      `tokio::` is forbidden inside CF-Workers / WASM-target lib crates
      (charter no-tokio rule — V8 isolates have no tokio executor).
      Use `async-lock`, `futures::*` primitives, or a `cfg(target_arch
      = "wasm32")` branch. Suppression requires Owner approval + ADR.
    severity: ERROR
    languages: [rust]
    pattern-either:
      - pattern: tokio::$X
      - pattern: |
          use tokio::$X;
      - pattern: |
          use tokio;
    paths:
      include:
        - "crates/corelink-lighthouse-tracker/src/**/*.rs"
        - "crates/corelink-synthetic-pager/src/**/*.rs"
      exclude:
        - "**/tests/**"
        - "**/tests.rs"
        - "**/*_test.rs"
        - "**/test_*.rs"
        - "**/benches/**"
        - "**/examples/**"
        - "**/bin/**"
        - "**/main.rs"

  # -----------------------------------------------------------------
  # R3 — Forbid the proptest anti-pattern flagged in S-08 P1-1.
  #
  # Background: S-08 adversarial audit P1-1 caught
  #   prop_assert!(matches!(err, Error::Variant { .. }));
  # which silently swallows mismatched payload fields — the test
  # passes whenever the variant tag matches, regardless of payload
  # content.  Correct form is to destructure and `prop_assert_eq!` on
  # the inner fields.
  # -----------------------------------------------------------------
  - id: corelink.rust.prop-assert-matches-struct-variant
    message: |
      `prop_assert!(matches!(..., Variant { .. }))` is the S-08 P1-1
      anti-pattern: it passes whenever the variant tag matches even if
      payload fields are wrong. Destructure the variant explicitly and
      `prop_assert_eq!` (or `prop_assert!`) on each field.
    severity: ERROR
    languages: [rust]
    pattern-either:
      - pattern: "prop_assert!(matches!($X, $V { .. }))"
      - pattern: "prop_assert!(matches!($X, $E :: $V { .. }))"
      - pattern: "prop_assert!(matches!($X, $E :: $V { .. }), $...REST)"
      - pattern: "prop_assert!(matches!($X, $V { .. }), $...REST)"
    paths:
      include:
        - "crates/**/*.rs"
        - "apps/**/*.rs"
        - "tests/**/*.rs"

  # -----------------------------------------------------------------
  # R4 — Forbid `.expect()` in BYOK-* crate src/ (extra strict).
  #
  # Rationale: BYOK crates handle customer key material and run inside
  # tenant-isolated enclaves. A panic in the BYOK path leaks an entire
  # tenant session; the charter mandates structured error propagation
  # ONLY (no `expect`, no `unwrap` — the latter is already covered by
  # R1 but R4 is the BYOK-strict variant that additionally bans
  # `.expect()` regardless of the static-string argument).
  #
  # Baseline triage 2026-05-15: 3 legitimate static-regex compile
  # sites in `crates/corelink-byok-{vault,azure,gcp}/src/key_*.rs`
  # carry inline `# nosemgrep` annotations because the regex literal
  # is a compile-time constant whose failure is impossible at runtime
  # (caught by tests). All three already carry
  # `#[allow(clippy::expect_used)]` as the project's idiomatic
  # justification; the `nosemgrep` comment cross-references the
  # R-prep static-analysis triage decision. No rule pattern change.
  # -----------------------------------------------------------------
  - id: corelink.rust.no-expect-in-byok-src
    message: |
      `.expect()` is forbidden in BYOK crate source (extra-strict per
      BYOK charter — panics in this layer leak tenant key material).
      Propagate the error via `?` and emit a structured `BYOK*Error`
      variant with a redacted message.
    severity: ERROR
    languages: [rust]
    pattern: $X.expect($MSG)
    paths:
      include:
        - "crates/corelink-byok/src/**/*.rs"
        - "crates/corelink-byok-aws/src/**/*.rs"
        - "crates/corelink-byok-azure/src/**/*.rs"
        - "crates/corelink-byok-gcp/src/**/*.rs"
        - "crates/corelink-byok-vault/src/**/*.rs"
        - "crates/corelink-byok-revocation/src/**/*.rs"
        - "crates/corelink-byok-matrix-test/src/**/*.rs"
      exclude:
        - "**/tests/**"
        - "**/tests.rs"
        - "**/*_test.rs"
        - "**/test_*.rs"
